worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    server {
        listen 8080;
        location = / { default_type text/plain; return 200 "foss-mcp gateway (image demo-ce89954): /<family>-<platform>/mcp\n"; }
        location ~ ^/(?<pilot>[a-z0-9]+-[a-z0-9]+)/(?<rest>.*)$ {
            proxy_set_header Host mcp-$pilot;
            proxy_pass http://mcp-$pilot:8080/$rest$is_args$args;
        }
        # Two-segment form /<family>/<platform>/ (TC-833): one location per pilot in pilots.txt,
        # routed ONLY for / and /mcp so /metrics, /readyz etc. stay unexposed; same upstream and
        # proxy settings as the hyphenated location above. /<family>/ alone is not routed.
        location ~ ^/3d/java(?:/(?<rest>mcp/?)?)?$ { set $pilot 3d-java; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/3d/net(?:/(?<rest>mcp/?)?)?$ { set $pilot 3d-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/3d/python(?:/(?<rest>mcp/?)?)?$ { set $pilot 3d-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/3d/typescript(?:/(?<rest>mcp/?)?)?$ { set $pilot 3d-typescript; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/barcode/python(?:/(?<rest>mcp/?)?)?$ { set $pilot barcode-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/cpp(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-cpp; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/go(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-go; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/java(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-java; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/net(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/python(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/rust(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-rust; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/cells/typescript(?:/(?<rest>mcp/?)?)?$ { set $pilot cells-typescript; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/email/cpp(?:/(?<rest>mcp/?)?)?$ { set $pilot email-cpp; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/email/net(?:/(?<rest>mcp/?)?)?$ { set $pilot email-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/email/python(?:/(?<rest>mcp/?)?)?$ { set $pilot email-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/html/python(?:/(?<rest>mcp/?)?)?$ { set $pilot html-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/imaging/net(?:/(?<rest>mcp/?)?)?$ { set $pilot imaging-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/note/python(?:/(?<rest>mcp/?)?)?$ { set $pilot note-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/page/python(?:/(?<rest>mcp/?)?)?$ { set $pilot page-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/cpp(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-cpp; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/go(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-go; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/java(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-java; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/net(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/python(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/pdf/typescript(?:/(?<rest>mcp/?)?)?$ { set $pilot pdf-typescript; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/slides/cpp(?:/(?<rest>mcp/?)?)?$ { set $pilot slides-cpp; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/slides/java(?:/(?<rest>mcp/?)?)?$ { set $pilot slides-java; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/slides/net(?:/(?<rest>mcp/?)?)?$ { set $pilot slides-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/slides/python(?:/(?<rest>mcp/?)?)?$ { set $pilot slides-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/tex/python(?:/(?<rest>mcp/?)?)?$ { set $pilot tex-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/words/net(?:/(?<rest>mcp/?)?)?$ { set $pilot words-net; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
        location ~ ^/words/python(?:/(?<rest>mcp/?)?)?$ { set $pilot words-python; proxy_set_header Host mcp-$pilot; proxy_pass http://mcp-$pilot:8080/$rest$is_args$args; }
    }
}
