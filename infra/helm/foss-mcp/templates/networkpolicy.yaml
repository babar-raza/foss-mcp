# Always rendered - deliberately no {{- if .Values.networkPolicy.enabled }} guard around
# this resource. The reference overlay disabled its NetworkPolicy through exactly that kind
# of values-driven toggle; that is the defect this chart exists to reverse, not a pattern to
# reproduce. A deployer who genuinely needs a different policy edits this template, not a
# values flag that silently removes isolation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foss-mcp.fullname" . }}
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foss-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - ports:
        - protocol: TCP
          port: 443
      to:
        - namespaceSelector: {}
