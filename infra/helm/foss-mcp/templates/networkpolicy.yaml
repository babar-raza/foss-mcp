# Always rendered - deliberately no values-driven conditional wrapped around this resource.
# The reference overlay disabled its NetworkPolicy through exactly that kind of values toggle;
# that is the defect this chart exists to reverse, not a pattern to reproduce. A deployer who
# genuinely needs a different policy edits this template, not a values flag that silently
# removes isolation. (No template braces appear in this comment: Helm parses comments too.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foss-mcp.fullname" . }}
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foss-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    # DNS to the cluster resolver only: kube-dns (CoreDNS) in kube-system, over UDP and TCP.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
---
# Ingestion egress. The ingestion Jobs download pinned sources and packages (NuGet, git, package
# registries) over HTTPS to arbitrary hosts, so TCP 443 to any destination is granted to ingestion
# pods only. A NetworkPolicy egress rule cannot be scoped to one subset of the pods a policy
# selects, and the policy above selects serving and ingestion pods alike, so this grant is its own
# document. Egress is additive: ingestion pods get these rules together with the rules above, and
# serving pods, which do not carry the ingestion component label, are not selected here at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foss-mcp.fullname" . }}-ingestion-egress
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foss-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- if .Values.embeddingGateway.existingSecret }}
{{- if not .Values.embeddingGateway.egressCidrs }}
{{- fail "embeddingGateway.egressCidrs must list at least one CIDR when embeddingGateway.existingSecret is set" }}
{{- end }}
---
# Embedding gateway egress. Rendered only when the operator names a gateway Secret, because only
# then do serving pods call the gateway at query time (find_examples' vector fallback). The
# gateway sits behind a public hostname, so serving pods need TCP 443 to the configured address
# ranges; the always-rendered policies above do not grant that. The selector covers both serving
# pod kinds: the live per-pilot pods (component serving) and the lean demo pods (component
# demo-serving), which a plain serving label would silently miss. Egress is additive: those pods
# get these rules together with the rules above (including DNS, which is not repeated here), and
# ingestion pods, which carry neither component label, are not selected here at all.
# Nothing in the policies above is relaxed by this document.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foss-mcp.fullname" . }}-gateway-egress
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foss-mcp.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - serving
          - demo-serving
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
      to:
        {{- range .Values.embeddingGateway.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
