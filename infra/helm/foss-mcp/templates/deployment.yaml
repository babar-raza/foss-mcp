# The serving pod runs the HTTP entrypoint, the same override docker-compose.yml uses. The stdio
# CMD of Dockerfile.serving listens on nothing, so a pod running it never answers on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foss-mcp.fullname" . }}
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "foss-mcp.servingSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foss-mcp.servingSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # serve_http.py reads both its packaging-manifest sidecar AND its recent-releases sidecar
      # exactly once, at process start, with no refresh. The ingestion Job's own shell chain
      # (infra/helm/foss-mcp/templates/ingestion-job.yaml) runs fetch_product_reference.py
      # STRICTLY BEFORE fetch_recent_releases.py, so waiting on the product-reference file alone
      # lets the serving container start in the window before the second file exists - it would
      # then answer list_recent_changes with a permanently-wrong empty list for its entire
      # lifetime (G2/TC-251). The serving container therefore starts only after the ingestion Job
      # has written BOTH this identity's sidecars (product_reference_<family>_<platform>.json and
      # recent_releases_<family>_<platform>.json, the names sidecar_name and
      # recent_releases_sidecar_name return in infra/fetch_product_reference.py and
      # infra/fetch_recent_releases.py respectively). This unconditional wait is safe against a
      # persistent live-fetch failure because fetch_recent_releases.py's main() now always writes
      # an empty-list sidecar on failure rather than leaving no file at all. The gate is a loop
      # over two tests; it runs no other command.
      initContainers:
        - name: wait-for-product-reference-and-recent-releases
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned version or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "sh"
            - "-c"
            - {{ printf "until [ -f %s/product_reference_%s_%s.json ] && [ -f %s/recent_releases_%s_%s.json ]; do sleep 2; done" .Values.manifests.mountPath .Values.deployment.family .Values.deployment.platform .Values.manifests.mountPath .Values.deployment.family .Values.deployment.platform | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: manifests
              mountPath: {{ .Values.manifests.mountPath }}
              readOnly: true
      containers:
        - name: serving
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned version or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/infra/serve_http.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FOSS_MCP_FAMILY
              value: {{ .Values.deployment.family | quote }}
            - name: FOSS_MCP_PLATFORM
              value: {{ .Values.deployment.platform | quote }}
            - name: FOSS_MCP_SOURCE_KIND
              value: {{ .Values.deployment.sourceKind | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: manifests
              mountPath: {{ .Values.manifests.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          persistentVolumeClaim:
            claimName: {{ include "foss-mcp.manifestsClaimName" . }}
        - name: tmp
          emptyDir: {}
