# The serving pod runs the HTTP entrypoint, the same override docker-compose.yml uses. The stdio
# CMD of Dockerfile.serving listens on nothing, so a pod running it never answers on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foss-mcp.fullname" . }}
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "foss-mcp.servingSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foss-mcp.servingSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.pod.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.pod.enableServiceLinks }}
      # serve_http.py reads both its packaging-manifest sidecar AND its recent-releases sidecar
      # exactly once, at process start, with no refresh. The ingestion Job's own shell chain
      # (infra/helm/foss-mcp/templates/ingestion-job.yaml) runs fetch_product_reference.py
      # STRICTLY BEFORE fetch_recent_releases.py, so waiting on the product-reference file alone
      # lets the serving container start in the window before the second file exists - it would
      # then answer list_recent_changes with a permanently-wrong empty list for its entire
      # lifetime (G2/TC-251). The serving container therefore starts only after the ingestion Job
      # has written BOTH this identity's sidecars (product_reference_<family>_<platform>.json and
      # recent_releases_<family>_<platform>.json, the names sidecar_name and
      # recent_releases_sidecar_name return in infra/fetch_product_reference.py and
      # infra/fetch_recent_releases.py respectively), and both are non-empty (an empty or truncated
      # file does not pass). The wait is BOUNDED by initGate.timeoutSeconds: a Job that hung or
      # failed can no longer hold a pod in Init for ever. The default is the Job deadline
      # (ingestion.activeDeadlineSeconds, 3600) plus 300 s, not a short 120 s, because a fresh
      # install's Job takes 5 to 40 minutes and serving reads its sidecars only once, so a shorter
      # gate would reintroduce TC-251 on every fresh install. When the bound is reached the gate
      # names the missing files on stderr and the pod starts WITHOUT them (degraded); the cure is a
      # retry of the pilot. The gate is a loop over four tests; it runs no other command.
      initContainers:
        - name: wait-for-product-reference-and-recent-releases
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned version or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $gateA := printf "%s/product_reference_%s_%s.json" .Values.manifests.mountPath .Values.deployment.family .Values.deployment.platform }}
          {{- $gateB := printf "%s/recent_releases_%s_%s.json" .Values.manifests.mountPath .Values.deployment.family .Values.deployment.platform }}
          {{- $gateT := int .Values.initGate.timeoutSeconds }}
          {{- $gateI := int .Values.initGate.intervalSeconds }}
          command:
            - "sh"
            - "-c"
            - {{ printf "waited=0; until [ -f %s ] && [ -s %s ] && [ -f %s ] && [ -s %s ]; do if [ \"$waited\" -ge %d ]; then echo \"init gate timed out after %d seconds waiting for non-empty %s and %s; starting WITHOUT them (degraded)\" >&2; exit 0; fi; sleep %d; waited=$((waited + %d)); done" $gateA $gateA $gateB $gateB $gateT $gateT $gateA $gateB $gateI $gateI | quote }}
          resources:
            {{- toYaml .Values.initGate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: manifests
              mountPath: {{ .Values.manifests.mountPath }}
              readOnly: true
      containers:
        - name: serving
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned version or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/infra/serve_http.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FOSS_MCP_FAMILY
              value: {{ .Values.deployment.family | quote }}
            - name: FOSS_MCP_PLATFORM
              value: {{ .Values.deployment.platform | quote }}
            {{- with .Values.embeddingGateway }}
            {{- if .existingSecret }}
            # The endpoint/API key are read from an operator-created Secret. optional keeps a
            # missing key from failing the pod; find_examples then falls back to lexical-only
            # matching, as it does with no gateway configured at all.
            - name: FOSS_MCP_EMBEDDING_GATEWAY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: {{ .endpointKey | quote }}
                  optional: true
            - name: FOSS_MCP_EMBEDDING_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: {{ .apiKeyKey | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            - name: FOSS_MCP_SOURCE_KIND
              value: {{ .Values.deployment.sourceKind | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: manifests
              mountPath: {{ .Values.manifests.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          persistentVolumeClaim:
            claimName: {{ include "foss-mcp.manifestsClaimName" . }}
        - name: tmp
          emptyDir: {}
