# The serving pod runs the HTTP entrypoint, the same override docker-compose.yml uses. The stdio
# CMD of Dockerfile.serving listens on nothing, so a pod running it never answers on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foss-mcp.fullname" . }}
  labels:
    {{- include "foss-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "foss-mcp.servingSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foss-mcp.servingSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: serving
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned version or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/infra/serve_http.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FOSS_MCP_FAMILY
              value: {{ .Values.deployment.family | quote }}
            - name: FOSS_MCP_PLATFORM
              value: {{ .Values.deployment.platform | quote }}
            - name: FOSS_MCP_SOURCE_KIND
              value: {{ .Values.deployment.sourceKind | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: manifests
              mountPath: {{ .Values.manifests.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          persistentVolumeClaim:
            claimName: {{ include "foss-mcp.manifestsClaimName" . }}
        - name: tmp
          emptyDir: {}
