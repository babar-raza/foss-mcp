# Deployment identity - deployment-time only, per foss_mcp.mcp.routing.resolve_scope: a
# client request never determines which product a deployment serves.
deployment:
  family: pdf
  platform: net
  sourceKind: self_extracted

image:
  repository: foss-mcp-serving
  # REQUIRED. A pinned release version (for example --set image.tag=1.4.0). The chart never
  # chooses a version: it refuses to render while this is empty, and it is never `latest`.
  # The same tag is applied to the ingestion image below, so one release is one tag.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  # targetPort is not a value: infra/serve_http.py binds its own DEFAULT_PORT (8080), which is
  # not overridable by env, so the Deployment and Service hardcode 8080 to match it.

probes:
  # /healthz is liveness (process alive). /readyz is readiness (a real active generation is
  # readable). A pod with an empty manifests claim answers /readyz 503 and receives no traffic.
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

terminationGracePeriodSeconds: 30

# Serving is a Python ASGI server whose image installs only requirements-serving.lock (mcp and its
# transitive closure, per Dockerfile.serving). 256Mi covers CPython and that import set with
# headroom, and 512Mi is 2x the request. Estimated from the image, not load-tested.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The manifests claim is shared: serving mounts it read-only, and each ingestion Job mounts it
# read-write. An empty claimName means "<fullname>-manifests". An empty storageClassName omits
# the field, so the cluster default class is used. ReadWriteOnce means serving pods and Jobs must
# schedule on one node; use a ReadWriteMany class if they cannot.
manifests:
  mountPath: /data/manifests
  claimName: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# uid 10001 is the user both Dockerfiles create (useradd --uid 10001 foss-mcp). fsGroup makes the
# freshly provisioned claim writable for that uid, which the ingestion Jobs need.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

# readOnlyRootFilesystem is on, so every path the process must write to is an emptyDir: /tmp for
# both pods, and the home directory for ingestion (go, maven, npm and dotnet caches).
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingestion:
  image:
    repository: foss-mcp-ingestion
  # Each Job runs infra/build_chunks.py then infra/ingest.py, the same two-step chain
  # docker-compose.yml runs. A failed chain retries up to backoffLimit times, then stays failed.
  backoffLimit: 2
  # Ingestion compiles real reference libraries (dotnet build, cargo build, mvn, go build, a
  # Python venv) per candidate example, so its limits are several times the serving pod's.
  # Estimated from the toolchains installed in Dockerfile.ingestion, not measured.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # One Job per entry. Each entry copies its arguments from its ingest-<family>-<platform> service
  # in docker-compose.yml exactly; tests/infra/test_helm_pilots_match_compose.py enforces that. All
  # entries publish into the one manifests claim, which serving mounts read-only.
  pilots:
    - family: pdf
      platform: net
      sourceKind: self_extracted
      heldBy: ingestion-pdf-net
      apiSurface: /app/fixtures/pdf_net/api_surface.json
      title: pdf/net API surface
      maxTypes: 20
      furnishedPage: /app/fixtures/furnished/pdf_net/pages/_index.md
      manifestPath: src/Aspose.Pdf.Foss.csproj
      library:
        repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET
        commit: "b7172877651413cff57a8bfe41fb8a8befb2406b"
        platform: dotnet
        csproj: src/Aspose.Pdf.Foss.csproj
    - family: slides
      platform: python
      sourceKind: self_extracted
      heldBy: ingestion-slides-python
      apiSurface: /app/fixtures/slides_python/api_surface.json
      title: slides/python API surface
      maxTypes: 20
      furnishedPage: /app/fixtures/furnished/slides_python/pages/_index.md
      manifestPath: pyproject.toml
      library:
        repository: aspose-slides-foss/Aspose.Slides-FOSS-for-Python
        commit: "4e63447ba79d1c27a5192844847d9f872c5b92ad"
        platform: python
    - family: pdf
      platform: typescript
      sourceKind: self_extracted
      heldBy: ingestion-pdf-typescript
      apiSurface: /app/fixtures/pdf_typescript/api_surface.json
      title: pdf/typescript API surface
      maxTypes: 20
      furnishedPage: /app/fixtures/furnished/pdf_typescript/pages/_index.md
      manifestPath: package.json
      library:
        repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-TypeScript
        commit: "155bfc7a33f0ba23fb4252b6ba201828b02a5b9d"
        platform: typescript
        packageName: "@asposefoss/pdf"
    - family: pdf
      platform: go
      sourceKind: self_extracted
      heldBy: ingestion-pdf-go
      apiSurface: /app/fixtures/pdf_go/api_surface.json
      title: pdf/go API surface
      maxTypes: 20
      furnishedPage: /app/fixtures/furnished/pdf_go/pages/_index.md
      manifestPath: go.mod
      library:
        repository: aspose-pdf-foss/Aspose-PDF-FOSS-for-Go
        commit: "286484d235196d65c9a458c5eff3d3d6539216dc"
        platform: go
        modulePath: github.com/aspose-pdf-foss/aspose-pdf-foss-for-go
    - family: pdf
      platform: java
      sourceKind: self_extracted
      heldBy: ingestion-pdf-java
      apiSurface: /app/fixtures/pdf_java/api_surface.json
      title: pdf/java API surface
      maxTypes: 20
      furnishedPage: /app/fixtures/furnished/pdf_java/pages/_index.md
      manifestPath: pom.xml
      library:
