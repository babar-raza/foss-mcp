- title: Attach legacy comments to worksheet cells
  description: Adds two legacy cell comments with Worksheet.Comments.Add, sets author, note and visibility on each, round-trips the workbook through an in-memory XLSX stream and reads the comment count, author, note and visibility back from the reloaded sheet.
  symbols:
  - Worksheet.Comments
  - CommentCollection.Add
  - CommentCollection.Count
  - Comment.Author
  - Comment.Note
  - Comment.IsVisible
  code: |
    // Authored example: attach legacy comments to worksheet cells
    using Aspose.Cells_FOSS;

    var workbook = new Workbook();
    var sheet = workbook.Worksheets[0];
    sheet.Cells["A1"].PutValue("Task");
    sheet.Cells["A2"].PutValue("Design UI");
    sheet.Cells["A3"].PutValue("Write tests");

    var designComment = sheet.Comments.Add("A2");
    designComment.Author = "Reviewer";
    designComment.Note = "Confirm the color palette before merging.";
    designComment.IsVisible = true;

    var testsComment = sheet.Comments.Add("A3");
    testsComment.Author = "QA";
    testsComment.Note = "Covers the happy path only so far.";
    testsComment.IsVisible = false;

    using var stream = new MemoryStream();
    workbook.Save(stream, SaveFormat.Xlsx);
    stream.Position = 0;
    var loaded = new Workbook(stream);
    var loadedSheet = loaded.Worksheets[0];

    Console.WriteLine("comment count: " + loadedSheet.Comments.Count);
    Console.WriteLine(loadedSheet.Comments["A2"].Author + ": " + loadedSheet.Comments["A2"].Note);
    Console.WriteLine("A3 visible: " + loadedSheet.Comments["A3"].IsVisible);

    if (loadedSheet.Comments.Count != 2)
    {
        throw new Exception("expected exactly two comments");
    }
    if (loadedSheet.Comments["A2"].Author != "Reviewer")
    {
        throw new Exception("author mismatch");
    }
    if (loadedSheet.Comments["A3"].IsVisible)
    {
        throw new Exception("A3 should not be visible");
    }
