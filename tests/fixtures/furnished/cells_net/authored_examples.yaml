- title: Draw auto shapes anchored to worksheet cells
  description: Adds a rectangle, a five-point star and a right-arrow auto shape to a worksheet with Worksheet.Shapes.Add, names each one, round-trips the workbook through an in-memory XLSX stream and reads the shape count, names and AutoShapeType values back from the reloaded sheet.
  symbols:
  - Worksheet.Shapes
  - ShapeCollection.Add
  - Shape.Name
  - Shape.AutoShapeType
  - AutoShapeType.Rectangle
  - AutoShapeType.Star5Point
  - AutoShapeType.RightArrow
  code: |
    // Authored example: draw auto shapes anchored to worksheet cells
    using Aspose.Cells_FOSS;

    var workbook = new Workbook();
    var sheet = workbook.Worksheets[0];

    var rectangleIndex = sheet.Shapes.Add(0, 0, 2, 2, AutoShapeType.Rectangle);
    sheet.Shapes[rectangleIndex].Name = "Rectangle Box";

    var starIndex = sheet.Shapes.Add(0, 3, 2, 5, AutoShapeType.Star5Point);
    sheet.Shapes[starIndex].Name = "5-Point Star";

    var arrowIndex = sheet.Shapes.Add(3, 0, 5, 2, AutoShapeType.RightArrow);
    sheet.Shapes[arrowIndex].Name = "Right Arrow";

    using var stream = new MemoryStream();
    workbook.Save(stream, SaveFormat.Xlsx);
    stream.Position = 0;
    var loaded = new Workbook(stream);
    var loadedSheet = loaded.Worksheets[0];

    Console.WriteLine("shape count: " + loadedSheet.Shapes.Count);
    Console.WriteLine(loadedSheet.Shapes[0].Name + " (" + loadedSheet.Shapes[0].AutoShapeType + ")");
    Console.WriteLine(loadedSheet.Shapes[1].Name + " (" + loadedSheet.Shapes[1].AutoShapeType + ")");
    Console.WriteLine(loadedSheet.Shapes[2].Name + " (" + loadedSheet.Shapes[2].AutoShapeType + ")");

    if (loadedSheet.Shapes.Count != 3)
    {
        throw new Exception("expected exactly three shapes");
    }
    if (loadedSheet.Shapes[1].AutoShapeType != AutoShapeType.Star5Point)
    {
        throw new Exception("shape type mismatch");
    }
    if (loadedSheet.Shapes[2].AutoShapeType != AutoShapeType.RightArrow)
    {
        throw new Exception("shape type mismatch");
    }
