- title: Store document metadata in the core and extended property sets
  description: Sets the shared document properties plus the OOXML core (Creator, LastModifiedBy) and extended (Company, Manager) property sets on a new workbook, round-trips it through an in-memory XLSX stream and reads each value back from the reloaded workbook's DocumentProperties.
  symbols:
  - Workbook.DocumentProperties
  - DocumentProperties.Title
  - CoreDocumentProperties.Creator
  - ExtendedDocumentProperties.Company
  code: |
    // Authored example: store document metadata in the core and extended property sets
    using Aspose.Cells_FOSS;

    var workbook = new Workbook();
    var sheet = workbook.Worksheets[0];
    sheet.Cells["A1"].PutValue("Quarterly Report");

    var properties = workbook.DocumentProperties;
    properties.Title = "Quarterly Sales Report";
    properties.Subject = "Regional performance";
    properties.Author = "Finance Team";
    properties.Keywords = "sales, quarterly, finance";
    properties.Category = "Reports";
    properties.Core.Creator = "Finance Team";
    properties.Core.LastModifiedBy = "Finance Team";
    properties.Extended.Company = "Acme Corporation";
    properties.Extended.Manager = "Jane Smith";

    using var stream = new MemoryStream();
    workbook.Save(stream, SaveFormat.Xlsx);
    stream.Position = 0;
    var loaded = new Workbook(stream);
    var loadedProperties = loaded.DocumentProperties;

    Console.WriteLine("Title: " + loadedProperties.Title);
    Console.WriteLine("Core creator: " + loadedProperties.Core.Creator);
    Console.WriteLine("Extended company: " + loadedProperties.Extended.Company);

    if (loadedProperties.Title != "Quarterly Sales Report")
    {
        throw new Exception("title mismatch");
    }
    if (loadedProperties.Core.Creator != "Finance Team")
    {
        throw new Exception("creator mismatch");
    }
    if (loadedProperties.Extended.Company != "Acme Corporation")
    {
        throw new Exception("company mismatch");
    }
