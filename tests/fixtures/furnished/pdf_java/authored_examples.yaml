  code: |
    // Authored example: set the document title and author, then read them back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.pdf.Document;
    import org.aspose.pdf.DocumentInfo;

    public class DocumentInfoRoundtripExample {
        public static void main(String[] args) throws Exception {
            Document document = new Document();
            document.getPages().add();
            DocumentInfo info = document.getInfo();
            info.setTitle("Quarterly Report");
            info.setAuthor("Finance Team");

            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            document.save(savedBytes);

            Document reloaded = new Document(new ByteArrayInputStream(savedBytes.toByteArray()));
            DocumentInfo reloadedInfo = reloaded.getInfo();

            System.out.println("title: " + reloadedInfo.getTitle());
            System.out.println("author: " + reloadedInfo.getAuthor());
            if (!"Quarterly Report".equals(reloadedInfo.getTitle())) {
                throw new AssertionError("expected the reloaded title to be Quarterly Report");
            }
            if (!"Finance Team".equals(reloadedInfo.getAuthor())) {
                throw new AssertionError("expected the reloaded author to be Finance Team");
            }
        }
    }
