  code: |
    // Authored example: create an AcroForm text box field, set its value, then read it back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.pdf.Document;
    import org.aspose.pdf.Page;
    import org.aspose.pdf.Rectangle;
    import org.aspose.pdf.forms.Field;
    import org.aspose.pdf.forms.Form;
    import org.aspose.pdf.forms.TextBoxField;

    public class TextBoxFieldRoundtripExample {
        public static void main(String[] args) throws Exception {
            Document document = new Document();
            Page page = document.getPages().add();

            TextBoxField textBox = new TextBoxField(page, new Rectangle(50, 700, 250, 720));
            textBox.setPartialName("customerName");
            textBox.setValue("Jordan Lee");
            document.getForm().add(textBox);

            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            document.save(savedBytes);

            Document reloaded = new Document(new ByteArrayInputStream(savedBytes.toByteArray()));
            Form form = reloaded.getForm();
            Field field = form.get("customerName");

            System.out.println("field value: " + field.getValue());
            if (!"Jordan Lee".equals(field.getValue())) {
                throw new AssertionError("expected the reloaded field value to be Jordan Lee");
            }
        }
    }
