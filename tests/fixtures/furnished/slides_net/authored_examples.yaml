- title: Set core and custom document properties and read them back
  description: Sets Presentation.DocumentProperties' Title and Author and a custom property with DocumentProperties.SetCustomPropertyValue,
    round-trips the presentation through a MemoryStream, and reads the custom property back with DocumentProperties.GetCustomPropertyValue
    alongside the two core properties.
  symbols:
  - Presentation.DocumentProperties
  - DocumentProperties.Title
  - DocumentProperties.Author
  - DocumentProperties.SetCustomPropertyValue
  - DocumentProperties.GetCustomPropertyValue
  code: |
    // Authored example: set core and custom document properties and read them back
    using Aspose.Slides.Foss;
    using Aspose.Slides.Foss.Drawing;
    using Aspose.Slides.Foss.Export;

    using var presentation = new Presentation();
    presentation.Slides[0].Shapes!.AddAutoShape(ShapeType.Rectangle, 10, 10, 100, 50);

    IDocumentProperties properties = presentation.DocumentProperties;
    properties.Title = "Quarterly Review";
    properties.Author = "Jane Smith";
    properties.SetCustomPropertyValue("ReviewStatus", "Draft");

    using var buffer = new MemoryStream();
    presentation.Save(buffer, SaveFormat.Pptx);
    buffer.Position = 0;

    using var reopened = new Presentation(buffer);
    IDocumentProperties reloaded = reopened.DocumentProperties;
    object customValue = reloaded.GetCustomPropertyValue("ReviewStatus")!;

    Console.WriteLine("title: " + reloaded.Title);
    Console.WriteLine("author: " + reloaded.Author);
    Console.WriteLine("custom: " + customValue);

    if (reloaded.Title != "Quarterly Review")
    {
        throw new Exception("title mismatch");
    }
    if (reloaded.Author != "Jane Smith")
    {
        throw new Exception("author mismatch");
    }
    if (customValue.ToString() != "Draft")
    {
        throw new Exception("custom property mismatch");
    }
