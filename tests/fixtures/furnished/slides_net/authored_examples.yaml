- title: Apply a 3-D bevel, camera preset and light rig, then read them back
  description: Reads an AutoShape's ThreeDFormat and sets BevelTop.BevelType, Camera.CameraType and LightRig.LightType,
    round-trips the presentation through a MemoryStream, and checks that all three preset values survive
    the round trip.
  symbols:
  - AutoShape.ThreeDFormat
  - ThreeDFormat.BevelTop
  - ShapeBevel.BevelType
  - ThreeDFormat.Camera
  - Camera.CameraType
  - ThreeDFormat.LightRig
  - LightRig.LightType
  code: |
    // Authored example: apply a 3-D bevel, camera preset and light rig, then read them back
    using Aspose.Slides.Foss;
    using Aspose.Slides.Foss.Drawing;
    using Aspose.Slides.Foss.Export;

    using var presentation = new Presentation();
    IAutoShape shape = presentation.Slides[0].Shapes!.AddAutoShape(ShapeType.Rectangle, 50, 50, 200, 150);

    IThreeDFormat threeD = shape.ThreeDFormat;
    threeD.BevelTop.BevelType = BevelPresetType.Circle;
    threeD.BevelTop.Width = 6;
    threeD.BevelTop.Height = 6;
    threeD.Camera.CameraType = CameraPresetType.IsometricTopUp;
    threeD.LightRig.LightType = LightRigPresetType.ThreePt;

    using var buffer = new MemoryStream();
    presentation.Save(buffer, SaveFormat.Pptx);
    buffer.Position = 0;

    using var reopened = new Presentation(buffer);
    IThreeDFormat reloaded = reopened.Slides[0].Shapes![0].ThreeDFormat;

    Console.WriteLine("bevel type: " + reloaded.BevelTop.BevelType);
    Console.WriteLine("camera type: " + reloaded.Camera.CameraType);
    Console.WriteLine("light type: " + reloaded.LightRig.LightType);

    if (reloaded.BevelTop.BevelType != BevelPresetType.Circle)
    {
        throw new Exception("bevel type mismatch");
    }
    if (reloaded.Camera.CameraType != CameraPresetType.IsometricTopUp)
    {
        throw new Exception("camera type mismatch");
    }
    if (reloaded.LightRig.LightType != LightRigPresetType.ThreePt)
    {
        throw new Exception("light rig type mismatch");
    }
