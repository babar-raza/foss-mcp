- title: Save a Message as EML and Load It Back
  description: Creates a message with a subject and a plain-text body, serialises it to an in-memory EML byte buffer with mapi_message::save_to_eml, loads it back from those bytes with mapi_message::load_from_eml and checks that the subject and body survive the round trip.
  symbols:
  - mapi_message.create
  - mapi_message.set_sender_email_address
  - mapi_message.save_to_eml
  - mapi_message.load_from_eml
  - mapi_message.subject
  - mapi_message.body
  code: |
    // Authored example: save a message as EML and load it back from memory.
    #include <cassert>
    #include <iostream>
    #include <sstream>
    #include <string>

    #include "aspose/email/foss/msg/mapi_message.hpp"

    using aspose::email::foss::msg::mapi_message;

    int main()
    {
        auto message = mapi_message::create("Release notes", "Plain text body.");
        message.set_sender_email_address("builds@example.com");

        const auto eml_bytes = message.save_to_eml();
        const std::string blob(eml_bytes.begin(), eml_bytes.end());
        std::istringstream stream(blob);
        auto loaded = mapi_message::load_from_eml(stream);

        std::cout << "subject: " << loaded.subject() << '\n';
        std::cout << "body: " << loaded.body() << '\n';

        assert(loaded.subject() == "Release notes");
        assert(loaded.body() == "Plain text body.");
        return 0;
    }
