  code: |
    // Authored example: set and read back core document properties after a save and reload.
    use aspose_cells_foss_rust::Workbook;
    use std::error::Error;

    fn main() -> Result<(), Box<dyn Error>> {
        let mut workbook = Workbook::new();
        {
            let properties = workbook.get_document_properties_mut();
            properties.set_title("Quarterly Report");
            properties.set_author("Finance Team");
            properties.set_subject("Q1 Results");
        }

        let bytes = workbook.save_xlsx_to_bytes()?;
        let loaded = Workbook::load_xlsx_from_bytes(&bytes)?;
        let properties = loaded.get_document_properties();

        println!("title: {}", properties.get_title());
        println!("author: {}", properties.get_author());
        println!("subject: {}", properties.get_subject());

        assert_eq!(properties.get_title(), "Quarterly Report");
        assert_eq!(properties.get_author(), "Finance Team");
        assert_eq!(properties.get_subject(), "Q1 Results");
        Ok(())
    }
