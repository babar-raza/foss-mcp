- title: Add Three Shapes, Find One With index_of, Then Save
  description: Adds a rectangle, a triangle and a rounded rectangle to the first slide, names each one, confirms the triangle's position in the collection with index_of, then saves the presentation to a temporary .pptx file and checks it is non-empty before deleting it.
  symbols:
  - ShapeCollection
  - ShapeCollection.add_auto_shape
  - ShapeCollection.size
  - ShapeCollection.index_of
  - AutoShape.set_name
  - Presentation.save
  code: |
    // Authored example: add three auto shapes, find one by reference with index_of, save and reload.
    #include <cassert>
    #include <filesystem>
    #include <iostream>
    #include <string>

    #include <Aspose/Slides/Foss/auto_shape.h>
    #include <Aspose/Slides/Foss/export/save_format.h>
    #include <Aspose/Slides/Foss/presentation.h>
    #include <Aspose/Slides/Foss/shape_collection.h>
    #include <Aspose/Slides/Foss/shape_type.h>
    #include <Aspose/Slides/Foss/slide.h>

    using namespace Aspose::Slides::Foss;

    int main() {
        const std::string path = "authored_three_shapes.pptx";

        Presentation pres;
        ShapeCollection& shapes = pres.slides()[0].shapes();
        auto& rect = shapes.add_auto_shape(ShapeType::RECTANGLE, 10, 10, 100, 60);
        rect.set_name("Rect1");
        auto& triangle = shapes.add_auto_shape(ShapeType::TRIANGLE, 150, 10, 100, 60);
        triangle.set_name("Tri1");
        auto& rounded = shapes.add_auto_shape(ShapeType::ROUND_CORNER_RECTANGLE, 300, 10, 100, 60);
        rounded.set_name("Round1");

        std::cout << "shapes: " << shapes.size() << '\n';
        assert(shapes.size() == 3);

        auto triangle_index = shapes.index_of(triangle);
        std::cout << "triangle index: " << triangle_index << '\n';
        assert(triangle_index == 1);

        pres.save(path, SaveFormat::PPTX);
        auto file_size = std::filesystem::file_size(path);
        std::cout << "saved bytes: " << file_size << '\n';
        assert(file_size > 0);
        std::filesystem::remove(path);

        return 0;
    }
