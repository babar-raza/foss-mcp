- title: Save a Box Mesh as an STL File
  description: Converts a Box primitive to a mesh with ToMesh, attaches it to a child node of the scene root with Node.CreateChildNode and saves the scene with Scene.Save to box.stl using plain extension-based format detection, printing the written file's length.
  symbols:
  - Scene
  - Scene.Save
  - Box
  - Box.ToMesh
  - Node.CreateChildNode
  code: |
    // Authored example: save a box mesh as an STL file
    using Aspose.ThreeD;
    using Aspose.ThreeD.Entities;

    var scene = new Scene();
    Mesh mesh = new Box(2, 2, 2).ToMesh();
    scene.RootNode.CreateChildNode("box", mesh);
