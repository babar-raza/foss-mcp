examples:
- title: "Store built-in and custom document properties, then read them back"
  description: "Sets the built-in Title and Author properties and two custom properties (a string and a double) on a new document, round-trips it through an in-memory MemoryStream and reads every value back from the reloaded document's BuiltInDocumentProperties and CustomDocumentProperties."
  symbols:
  - Document.BuiltInDocumentProperties
  - BuiltInDocumentProperties.Title
  - BuiltInDocumentProperties.Author
  - Document.CustomDocumentProperties
  - CustomDocumentProperties.Add
  - CustomDocumentProperties.Count
  - DocumentProperty.ToDouble
  code: |
    // Authored example: store built-in and custom document properties, then read them back
    using Aspose.Words;

    var doc = new Document();
    var builder = new DocumentBuilder(doc);
    builder.Writeln("Quarterly roadmap draft.");

    doc.BuiltInDocumentProperties.Title = "Quarterly Roadmap";
    doc.BuiltInDocumentProperties.Author = "Planning Team";
    doc.CustomDocumentProperties.Add("ReviewCycle", "Q3-2026");
    doc.CustomDocumentProperties.Add("ApprovedBudget", 125000.0);

    using var stream = new MemoryStream();
    doc.Save(stream, SaveFormat.Docx);
    stream.Position = 0;
    var loaded = new Document(stream);

    var reviewCycle = loaded.CustomDocumentProperties["ReviewCycle"];
    var approvedBudget = loaded.CustomDocumentProperties["ApprovedBudget"];

    Console.WriteLine("title: " + loaded.BuiltInDocumentProperties.Title);
    Console.WriteLine("author: " + loaded.BuiltInDocumentProperties.Author);
    Console.WriteLine("review cycle: " + reviewCycle.ToString());
    Console.WriteLine("approved budget: " + approvedBudget.ToDouble());
    Console.WriteLine("custom property count: " + loaded.CustomDocumentProperties.Count);

    if (loaded.BuiltInDocumentProperties.Title != "Quarterly Roadmap")
    {
        throw new Exception("title mismatch");
    }
    if (loaded.BuiltInDocumentProperties.Author != "Planning Team")
    {
        throw new Exception("author mismatch");
    }
    if (loaded.CustomDocumentProperties.Count != 2)
    {
        throw new Exception("expected exactly two custom properties");
    }
    if (approvedBudget.ToDouble() != 125000.0)
    {
        throw new Exception("approved budget mismatch");
    }
