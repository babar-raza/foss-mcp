- title: Track Live Mutations to a Subtree with an Observer Callback
  description: Attaches a MutationObserver to a container with child_list and subtree enabled, appends a child and a grandchild, confirms two childList records were delivered in order with the right added_nodes, then disconnects the observer and confirms a further mutation produces no more records.
  symbols:
  - MutationObserver
  - MutationObserver.observe
  - MutationObserver.disconnect
  - MutationRecord
  - Document.create_element
  - Node.append_child
  code: |
    # Authored example: track live mutations to a subtree with an observer callback
    from aspose_html.dom import Document, MutationObserver, MutationRecord

    document = Document()
    root = document.create_element("div")
    document.append_child(root)

    records = []
    observer = MutationObserver(lambda recs, obs: records.extend(recs))
    observer.observe(root, child_list=True, subtree=True)

    child = document.create_element("span")
    root.append_child(child)
    grandchild = document.create_element("em")
    child.append_child(grandchild)

    print("mutation count:", len(records))
    print("mutation types:", [record.type for record in records])
    assert len(records) == 2
    assert all(isinstance(record, MutationRecord) for record in records)
    assert all(record.type == "childList" for record in records)
    assert records[0].added_nodes[0] is child
    assert records[1].added_nodes[0] is grandchild

    observer.disconnect()
    later = document.create_element("p")
    child.append_child(later)
    print("records after disconnect:", len(records))
    assert len(records) == 2
    print("OK")
