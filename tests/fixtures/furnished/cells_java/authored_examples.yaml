- title: Set a row's outline group level and collapsed flag and read them back after a reload
  description: Sets a row's outline group level and collapsed flag via Row.setGroupLevel and Row.setCollapsed, saves the workbook to memory, reloads it and reads both values back from the reloaded row.
  symbols:
  - Workbook
  - Worksheet.getCells
  - Cells.getRows
  - Row.setGroupLevel
  - Row.getGroupLevel
  - Row.setCollapsed
  - Row.isCollapsed
  code: |
    // Authored example: set a row's outline group level and collapsed flag, then read them back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.cells_foss.Row;
    import org.aspose.cells_foss.SaveFormat;
    import org.aspose.cells_foss.Workbook;
    import org.aspose.cells_foss.Worksheet;

    public class RowOutlineGroupRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Workbook workbook = new Workbook()) {
                Worksheet sheet = workbook.getWorksheets().get(0);
                Row row = sheet.getCells().getRows().get(2);
                row.setGroupLevel(2);
                row.setCollapsed(true);
                workbook.save(savedBytes, SaveFormat.XLSX);
            }

            try (Workbook reloaded = new Workbook(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                Row row = reloaded.getWorksheets().get(0).getCells().getRows().get(2);
                System.out.println("groupLevel: " + row.getGroupLevel());
                System.out.println("collapsed: " + row.isCollapsed());
                if (row.getGroupLevel() != 2) {
                    throw new AssertionError("expected the reloaded row's group level to be 2");
                }
                if (!row.isCollapsed()) {
                    throw new AssertionError("expected the reloaded row to be collapsed");
                }
            }
        }
    }
