- title: Merge a block of cells and read the merged region's coordinates back after a reload
  description: Merges a 2x3 block of cells with Cells.merge, saves the workbook to memory, reloads it and reads the merged region's first row, first column, total rows and total columns back from the reloaded worksheet's CellArea.
  symbols:
  - Workbook
  - Worksheet.getCells
  - Cells.merge
  - Cells.getMergedCells
  - CellArea.getFirstRow
  - CellArea.getFirstColumn
  - CellArea.getTotalRows
  - CellArea.getTotalColumns
  code: |
    // Authored example: merge a block of cells and read the merged region's coordinates back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.cells_foss.CellArea;
    import org.aspose.cells_foss.SaveFormat;
    import org.aspose.cells_foss.Workbook;
    import org.aspose.cells_foss.Worksheet;

    public class MergedCellRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Workbook workbook = new Workbook()) {
                Worksheet sheet = workbook.getWorksheets().get(0);
                sheet.getCells().get("B2").putValue("Merged header");
                sheet.getCells().merge(1, 1, 2, 3);
                workbook.save(savedBytes, SaveFormat.XLSX);
            }

            try (Workbook reloaded = new Workbook(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                CellArea area = reloaded.getWorksheets().get(0).getCells().getMergedCells().get(0);
                System.out.println("firstRow: " + area.getFirstRow());
                System.out.println("firstColumn: " + area.getFirstColumn());
                System.out.println("totalRows: " + area.getTotalRows());
                System.out.println("totalColumns: " + area.getTotalColumns());
                if (area.getFirstRow() != 1 || area.getFirstColumn() != 1) {
                    throw new AssertionError("expected the reloaded merge region to start at row 1, column 1");
                }
                if (area.getTotalRows() != 2 || area.getTotalColumns() != 3) {
                    throw new AssertionError("expected the reloaded merge region to span 2 rows and 3 columns");
                }
            }
        }
    }
