- title: Add a workbook-scoped defined name with a comment and read it back after a reload
  description: Adds a workbook-scoped defined name with a SUM formula and a comment via DefinedNameCollection.add and DefinedName.setComment, saves the workbook to memory, reloads it and reads the name, formula and comment back from the reloaded DefinedName.
  symbols:
  - Workbook
  - Workbook.getDefinedNames
  - DefinedNameCollection.add
  - DefinedName.getName
  - DefinedName.getFormula
  - DefinedName.setComment
  - DefinedName.getComment
  code: |
    // Authored example: add a workbook-scoped defined name with a comment, then read it back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.cells_foss.DefinedName;
    import org.aspose.cells_foss.SaveFormat;
    import org.aspose.cells_foss.Workbook;

    public class DefinedNameRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Workbook workbook = new Workbook()) {
                workbook.getWorksheets().get(0).setName("Data");
                workbook.getWorksheets().get(0).getCells().get("A1").putValue(10);
                int index = workbook.getDefinedNames().add("Total", "=SUM(Data!$A$1:$A$10)");
                DefinedName total = workbook.getDefinedNames().get(index);
                total.setComment("Workbook total");
                workbook.save(savedBytes, SaveFormat.XLSX);
            }

            try (Workbook reloaded = new Workbook(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                DefinedName total = reloaded.getDefinedNames().get(0);
                System.out.println("name: " + total.getName());
                System.out.println("formula: " + total.getFormula());
                System.out.println("comment: " + total.getComment());
                if (!"Total".equals(total.getName())) {
                    throw new AssertionError("expected the reloaded defined name to be Total");
                }
                if (!total.getFormula().contains("SUM")) {
                    throw new AssertionError("expected the reloaded formula to contain SUM");
                }
                if (!"Workbook total".equals(total.getComment())) {
                    throw new AssertionError("expected the reloaded comment to be Workbook total");
                }
            }
        }
    }
