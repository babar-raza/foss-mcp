- title: Add a hyperlink with a screen tip and read it back after a save and reload
  description: Adds a hyperlink to a cell with its own display text and screen tip via HyperlinkCollection.add, saves the workbook to memory, reloads it and reads the hyperlink's address, display text and screen tip back from the reloaded worksheet.
  symbols:
  - Workbook
  - Workbook.save
  - Worksheet.getHyperlinks
  - HyperlinkCollection.add
  - Hyperlink.getAddress
  - Hyperlink.getTextToDisplay
  - Hyperlink.getScreenTip
  code: |
    // Authored example: add a hyperlink with display text and a screen tip, then read them back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.cells_foss.Hyperlink;
    import org.aspose.cells_foss.SaveFormat;
    import org.aspose.cells_foss.Workbook;
    import org.aspose.cells_foss.Worksheet;

    public class HyperlinkRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Workbook workbook = new Workbook()) {
                Worksheet sheet = workbook.getWorksheets().get(0);
                sheet.getCells().get("A1").putValue("Project status");
                sheet.getHyperlinks().add("A1", "A1", "https://example.com/status", "Click here", "Open the status page");
                workbook.save(savedBytes, SaveFormat.XLSX);
            }

            try (Workbook reloaded = new Workbook(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                Hyperlink link = reloaded.getWorksheets().get(0).getHyperlinks().get(0);
                System.out.println("address: " + link.getAddress());
                System.out.println("textToDisplay: " + link.getTextToDisplay());
                System.out.println("screenTip: " + link.getScreenTip());
                if (!"https://example.com/status".equals(link.getAddress())) {
                    throw new AssertionError("expected the reloaded hyperlink address to be https://example.com/status");
                }
                if (!"Click here".equals(link.getTextToDisplay())) {
                    throw new AssertionError("expected the reloaded hyperlink text to be Click here");
                }
                if (!"Open the status page".equals(link.getScreenTip())) {
                    throw new AssertionError("expected the reloaded hyperlink screen tip to be Open the status page");
                }
            }
        }
    }
