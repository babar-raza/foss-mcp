- title: Set a workbook's title, subject and company and read them back after a reload
  description: Sets the title, subject and company on a new workbook's DocumentProperties, saves the workbook to memory, reloads it and reads all three properties back from the reloaded workbook's DocumentProperties.
  symbols:
  - Workbook
  - Workbook.getDocumentProperties
  - DocumentProperties.setTitle
  - DocumentProperties.getTitle
  - DocumentProperties.setSubject
  - DocumentProperties.getSubject
  - DocumentProperties.setCompany
  - DocumentProperties.getCompany
  code: |
    // Authored example: set document title, subject and company, then read them back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.cells_foss.DocumentProperties;
    import org.aspose.cells_foss.SaveFormat;
    import org.aspose.cells_foss.Workbook;

    public class DocumentPropertiesRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Workbook workbook = new Workbook()) {
                DocumentProperties properties = workbook.getDocumentProperties();
                properties.setTitle("Quarterly Spreadsheet");
                properties.setSubject("Finance Summary");
                properties.setCompany("Acme Corp");
                workbook.save(savedBytes, SaveFormat.XLSX);
            }

            try (Workbook reloaded = new Workbook(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                DocumentProperties properties = reloaded.getDocumentProperties();
                System.out.println("title: " + properties.getTitle());
                System.out.println("subject: " + properties.getSubject());
                System.out.println("company: " + properties.getCompany());
                if (!"Quarterly Spreadsheet".equals(properties.getTitle())) {
                    throw new AssertionError("expected the reloaded title to be Quarterly Spreadsheet");
                }
                if (!"Finance Summary".equals(properties.getSubject())) {
                    throw new AssertionError("expected the reloaded subject to be Finance Summary");
                }
                if (!"Acme Corp".equals(properties.getCompany())) {
                    throw new AssertionError("expected the reloaded company to be Acme Corp");
                }
            }
        }
    }
