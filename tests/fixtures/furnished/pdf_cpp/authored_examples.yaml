- title: Record a Highlight Annotation's Contents and Color, Confirm After Reload
  description: Adds a HighlightAnnotation with a color and contents string to a from-scratch page, saves the document, reopens the saved file, walks the reloaded page's AnnotationCollection and checks that the annotation's type, contents and the fact that there is exactly one annotation all survive the round trip.
  symbols:
  - Page.Annotations
  - HighlightAnnotation
  - AnnotationCollection.Add
  - AnnotationCollection.Count
  - Annotation.Color
  - Annotation.Contents
  - Annotation.AnnotationType
  - AnnotationType.Highlight
  code: |
    // Authored example: add a highlight annotation and read its contents and color back after save and reload.
    #include <cassert>
    #include <iostream>
    #include <string>

    #include <aspose/pdf/annotations/annotation.hpp>
    #include <aspose/pdf/annotations/annotation_collection.hpp>
    #include <aspose/pdf/annotations/annotation_type.hpp>
    #include <aspose/pdf/annotations/highlight_annotation.hpp>
    #include <aspose/pdf/color.hpp>
    #include <aspose/pdf/document.hpp>
    #include <aspose/pdf/page.hpp>
    #include <aspose/pdf/page_collection.hpp>
    #include <aspose/pdf/rectangle.hpp>

    using namespace Aspose::Pdf;

    int main() {
        const std::string path = "authored_annotation_roundtrip.pdf";

        {
            Document doc;
            Page page = doc.Pages().Add();
            page.SetPageSize(595.0, 842.0);

            Annotations::HighlightAnnotation highlight(page, Rectangle(60.0, 700.0, 210.0, 716.0, true));
            highlight.Color(Color::FromRgb(1.0, 0.95, 0.0));
            highlight.Contents("Important phrase");
            page.Annotations().Add(highlight);

            doc.Save(path);
        }

        Document reloaded(path);
        Page page = reloaded.Pages()[1];
        Annotations::AnnotationCollection& annots = page.Annotations();
        std::cout << "annotation count: " << annots.Count() << '\n';
        assert(annots.Count() == 1);

        Annotations::Annotation& loaded = annots[0];
        std::cout << "type: " << static_cast<int>(loaded.AnnotationType()) << '\n';
        std::cout << "contents: " << loaded.Contents() << '\n';

        assert(loaded.AnnotationType() == Annotations::AnnotationType::Highlight);
        assert(loaded.Contents() == "Important phrase");
        return 0;
    }
