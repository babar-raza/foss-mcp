- title: Encrypt a File With AES-256 and Reopen It With the Password
  description: Encrypts a from-scratch document with Document::Encrypt and CryptoAlgorithm::AESx256, saves it, then reopens the saved file both with the correct user password (checking IsEncrypted and that the page count is readable) and with a wrong password (checking that the constructor throws).
  symbols:
  - Document.Encrypt
  - Document.IsEncrypted
  - Document.Pages
  - PageCollection.Count
  - Permissions
  - CryptoAlgorithm.AESx256
  code: |
    // Authored example: encrypt a document with AES-256 and open it back with the correct password.
    #include <cassert>
    #include <iostream>
    #include <stdexcept>
    #include <string>

    #include <aspose/pdf/crypto_algorithm.hpp>
    #include <aspose/pdf/document.hpp>
    #include <aspose/pdf/page.hpp>
    #include <aspose/pdf/page_collection.hpp>
    #include <aspose/pdf/permissions.hpp>

    using namespace Aspose::Pdf;

    int main() {
        const std::string path = "authored_encrypted_roundtrip.pdf";

        {
            Document doc;
            Page page = doc.Pages().Add();
            page.SetPageSize(595.0, 842.0);
            doc.Encrypt("user-secret", "owner-secret", Permissions(), CryptoAlgorithm::AESx256);
            doc.Save(path);
        }

        Document locked(path, "user-secret");
        std::cout << "is encrypted: " << std::boolalpha << locked.IsEncrypted() << '\n';
        assert(locked.IsEncrypted());
        assert(locked.Pages().Count() == 1);

        bool wrongPasswordRejected = false;
        try {
            Document rejected(path, "not-the-password");
            (void)rejected;
        } catch (const std::runtime_error&) {
            wrongPasswordRejected = true;
        }
        std::cout << "wrong password rejected: " << std::boolalpha << wrongPasswordRejected << '\n';
        assert(wrongPasswordRejected);
        return 0;
    }
