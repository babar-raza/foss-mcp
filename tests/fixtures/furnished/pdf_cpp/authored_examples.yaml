- title: Build Positioned Text and Recover It With TextFragmentAbsorber After Reload
  description: Builds a from-scratch document with one positioned text fragment via TextBuilder and FontRepository, saves it, reopens the saved file as a fresh Document, and recovers the exact text with a phrase-search TextFragmentAbsorber, checking both the match count and the recovered text.
  symbols:
  - Document
  - PageCollection.Add
  - Page.SetPageSize
  - TextFragment
  - TextBuilder.AppendText
  - FontRepository.FindFont
  - TextFragmentAbsorber
  - TextFragmentAbsorber.Visit
  - TextFragmentAbsorber.TextFragments
  - TextFragmentCollection.Count
  - TextFragment.Text
  code: |
    // Authored example: build positioned text from scratch, save, reload, and recover it with TextFragmentAbsorber.
    #include <cassert>
    #include <iostream>
    #include <string>

    #include <aspose/pdf/document.hpp>
    #include <aspose/pdf/font_repository.hpp>
    #include <aspose/pdf/page.hpp>
    #include <aspose/pdf/page_collection.hpp>
    #include <aspose/pdf/position.hpp>
    #include <aspose/pdf/text_builder.hpp>
    #include <aspose/pdf/text_fragment.hpp>
    #include <aspose/pdf/text_fragment_absorber.hpp>
    #include <aspose/pdf/text_fragment_collection.hpp>

    using namespace Aspose::Pdf;

    int main() {
        const std::string path = "authored_text_roundtrip.pdf";

        {
            Document doc;
            Page page = doc.Pages().Add();
            page.SetPageSize(595.0, 842.0);

            Text::TextFragment frag("Hello from a from-scratch PDF");
            frag.TextState().Font(Text::FontRepository::FindFont("Helvetica"));
            frag.TextState().FontSize(16.0f);
            frag.Position(Text::Position(60.0, 760.0));
            Text::TextBuilder{page}.AppendText(frag);

            doc.Save(path);
        }

        Document reloaded(path);
        Text::TextFragmentAbsorber absorber("Hello from a from-scratch PDF");
        absorber.Visit(reloaded);

        Text::TextFragmentCollection& fragments = absorber.TextFragments();
        std::cout << "matches: " << fragments.Count() << '\n';
        std::cout << "text: " << fragments[1].Text() << '\n';

        assert(fragments.Count() == 1);
        assert(fragments[1].Text() == "Hello from a from-scratch PDF");
        return 0;
    }
