- title: Build an Outline (Bookmark) Tree, Save, and Walk It Back After Reload
  description: Builds a two-page from-scratch document with one bookmark pointing at page 2 via XYZExplicitDestination, saves it, reopens the saved file, and walks the reloaded Document's OutlineCollection, checking the bookmark's title, bold flag and destination page number all survive the round trip.
  symbols:
  - Document.Outlines
  - PageCollection.Add
  - OutlineCollection.Add
  - OutlineCollection.Count
  - OutlineItemCollection
  - OutlineItemCollection.Title
  - OutlineItemCollection.Bold
  - OutlineItemCollection.Destination
  - XYZExplicitDestination
  - ExplicitDestination.PageNumber
  code: |
    // Authored example: build an outline (bookmark) tree, save, and walk it back after reload.
    #include <cassert>
    #include <iostream>
    #include <string>

    #include <aspose/pdf/annotations/explicit_destination.hpp>
    #include <aspose/pdf/annotations/xyz_explicit_destination.hpp>
    #include <aspose/pdf/document.hpp>
    #include <aspose/pdf/outline_collection.hpp>
    #include <aspose/pdf/outline_item_collection.hpp>
    #include <aspose/pdf/page.hpp>
    #include <aspose/pdf/page_collection.hpp>

    using namespace Aspose::Pdf;

    int main() {
        const std::string path = "authored_outline_roundtrip.pdf";

        {
            Document doc;
            Page page1 = doc.Pages().Add();
            page1.SetPageSize(595.0, 842.0);
            Page page2 = doc.Pages().Add();
            page2.SetPageSize(595.0, 842.0);

            OutlineCollection& root = doc.Outlines();
            OutlineItemCollection chapter(root);
            chapter.Title("Chapter Two");
            chapter.Bold(true);
            chapter.Destination(Annotations::XYZExplicitDestination(2, 0.0, 842.0, 0.0));
            root.Add(chapter);

            doc.Save(path);
        }

        Document reloaded(path);
        OutlineCollection& outlines = reloaded.Outlines();
        std::cout << "outline count: " << outlines.Count() << '\n';
        assert(outlines.Count() == 1);

        OutlineItemCollection& item = outlines[1];
        std::cout << "title: " << item.Title() << '\n';
        std::cout << "bold: " << std::boolalpha << item.Bold() << '\n';
        assert(item.Title() == "Chapter Two");
        assert(item.Bold());

        auto* destination = dynamic_cast<Annotations::ExplicitDestination*>(item.Destination());
        assert(destination != nullptr);
        std::cout << "destination page: " << destination->PageNumber() << '\n';
        assert(destination->PageNumber() == 2);
        return 0;
    }
