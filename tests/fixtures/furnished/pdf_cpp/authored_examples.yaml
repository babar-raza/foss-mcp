- title: Create AcroForm Text and Checkbox Fields, Save, and Read Values Back
  description: Adds a TextBoxField and a CheckboxField to a from-scratch document through Document::Form, saves it, reopens the saved file, walks the reloaded Form's Fields() by PartialName and checks that the text value and the checkbox state both survive the round trip.
  symbols:
  - Document.Form
  - TextBoxField
  - TextBoxField.PartialName
  - TextBoxField.Value
  - CheckboxField
  - CheckboxField.PartialName
  - CheckboxField.Checked
  - Form.Add
  - Form.Fields
  - Field.Value
  code: |
    // Authored example: create AcroForm text and checkbox fields, save, and read their values back after reload.
    #include <cassert>
    #include <iostream>
    #include <string>

    #include <aspose/pdf/document.hpp>
    #include <aspose/pdf/forms/checkbox_field.hpp>
    #include <aspose/pdf/forms/field.hpp>
    #include <aspose/pdf/forms/form.hpp>
    #include <aspose/pdf/forms/text_box_field.hpp>
    #include <aspose/pdf/page.hpp>
    #include <aspose/pdf/page_collection.hpp>
    #include <aspose/pdf/rectangle.hpp>

    using namespace Aspose::Pdf;

    int main() {
        const std::string path = "authored_acroform_roundtrip.pdf";

        {
            Document doc;
            Page page = doc.Pages().Add();
            page.SetPageSize(595.0, 842.0);

            Forms::TextBoxField name(doc, Rectangle(190.0, 700.0, 470.0, 720.0, true));
            name.PartialName("fullName");
            name.Value("Alice Sample");
            doc.Form().Add(name, 1);

            Forms::CheckboxField subscribe(doc, Rectangle(190.0, 650.0, 208.0, 668.0, true));
            subscribe.PartialName("subscribe");
            subscribe.Checked(true);
            doc.Form().Add(subscribe, 1);

            doc.Save(path);
        }

        Document reloaded(path);
        Forms::Form& form = reloaded.Form();
        std::cout << "field count: " << form.Count() << '\n';
        assert(form.Count() == 2);

        Forms::Field* nameField = nullptr;
        Forms::Field* checkField = nullptr;
        for (Forms::Field* field : form.Fields()) {
            if (field->PartialName() == "fullName") nameField = field;
            if (field->PartialName() == "subscribe") checkField = field;
        }

        assert(nameField != nullptr);
        assert(checkField != nullptr);
        std::cout << "fullName value: " << nameField->Value() << '\n';
        assert(nameField->Value() == "Alice Sample");

        auto* checkbox = dynamic_cast<Forms::CheckboxField*>(checkField);
        assert(checkbox != nullptr);
        std::cout << "subscribe checked: " << std::boolalpha << checkbox->Checked() << '\n';
        assert(checkbox->Checked());
        return 0;
    }
