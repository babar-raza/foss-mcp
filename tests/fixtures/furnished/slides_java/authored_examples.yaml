- title: Set a paragraph's alignment, margin and indent and read them back after a reload
  description: Adds a rectangle with a text frame, sets the first paragraph's alignment to centre with a left margin and an indent through its paragraph format, saves to memory, reloads and reads the alignment, margin and indent back from the reloaded paragraph.
  symbols:
  - Presentation
  - Presentation.save
  - IShapeCollection.addAutoShape
  - IAutoShape.addTextFrame
  - IParagraphFormat.setAlignment
  - IParagraphFormat.getAlignment
  - IParagraphFormat.setMarginLeft
  - IParagraphFormat.setIndent
  code: |
    // Authored example: set a paragraph's alignment, left margin and indent, then read them back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.slides.foss.IAutoShape;
    import org.aspose.slides.foss.IParagraph;
    import org.aspose.slides.foss.IParagraphFormat;
    import org.aspose.slides.foss.ISlide;
    import org.aspose.slides.foss.Presentation;
    import org.aspose.slides.foss.ShapeType;
    import org.aspose.slides.foss.TextAlignment;
    import org.aspose.slides.foss.export.SaveFormat;

    public class ParagraphAlignmentRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Presentation pres = new Presentation()) {
                ISlide slide = pres.getSlides().get(0);
                slide.getShapes().clear();
                IAutoShape shape = slide.getShapes().addAutoShape(ShapeType.RECTANGLE, 50, 50, 400, 150);
                shape.addTextFrame("Centred paragraph");
                IParagraphFormat format = shape.getTextFrame().getParagraphs().get(0).getParagraphFormat();
                format.setAlignment(TextAlignment.CENTER);
                format.setMarginLeft(12.5);
                format.setIndent(4.0);
                pres.save(savedBytes, SaveFormat.PPTX);
            }

            try (Presentation reloaded = new Presentation(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                IAutoShape shape = (IAutoShape) reloaded.getSlides().get(0).getShapes().get(0);
                IParagraph paragraph = shape.getTextFrame().getParagraphs().get(0);
                IParagraphFormat format = paragraph.getParagraphFormat();
                System.out.println("text: " + paragraph.getText());
                System.out.println("alignment: " + format.getAlignment());
                System.out.println("marginLeft: " + format.getMarginLeft());
                System.out.println("indent: " + format.getIndent());
                if (format.getAlignment() != TextAlignment.CENTER) {
                    throw new AssertionError("expected the reloaded paragraph to be centred");
                }
                if (format.getMarginLeft() != 12.5) {
                    throw new AssertionError("expected the reloaded left margin to be 12.5");
                }
                if (format.getIndent() != 4.0) {
                    throw new AssertionError("expected the reloaded indent to be 4.0");
                }
            }
        }
    }
