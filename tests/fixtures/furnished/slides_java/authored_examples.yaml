- title: Apply a solid fill colour to a rectangle and confirm its fill type and colour after a reload
  description: Adds a rounded rectangle, sets its fill to solid with an opaque blue colour through IFillFormat, saves to memory, reloads and reads the fill type and the ARGB value of the solid colour back from the reloaded shape.
  symbols:
  - Presentation
  - Presentation.save
  - IShapeCollection.addAutoShape
  - IAutoShape.getFillFormat
  - IFillFormat.setFillType
  - IFillFormat.getSolidFillColor
  - FillType.SOLID
  code: |
    // Authored example: give a rectangle a solid fill colour, then read its fill type and colour back after a save and reload
    import java.io.ByteArrayInputStream;
    import java.io.ByteArrayOutputStream;
    import org.aspose.slides.foss.FillType;
    import org.aspose.slides.foss.IAutoShape;
    import org.aspose.slides.foss.ISlide;
    import org.aspose.slides.foss.Presentation;
    import org.aspose.slides.foss.ShapeType;
    import org.aspose.slides.foss.drawing.Color;
    import org.aspose.slides.foss.export.SaveFormat;

    public class ShapeFillRoundtripExample {
        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream savedBytes = new ByteArrayOutputStream();
            try (Presentation pres = new Presentation()) {
                ISlide slide = pres.getSlides().get(0);
                slide.getShapes().clear();
                IAutoShape shape = slide.getShapes().addAutoShape(ShapeType.ROUND_RECTANGLE, 80, 80, 240, 120);
                shape.getFillFormat().setFillType(FillType.SOLID);
                shape.getFillFormat().getSolidFillColor().setColor(Color.fromArgb(255, 0, 112, 192));
                pres.save(savedBytes, SaveFormat.PPTX);
            }

            try (Presentation reloaded = new Presentation(new ByteArrayInputStream(savedBytes.toByteArray()))) {
                IAutoShape shape = (IAutoShape) reloaded.getSlides().get(0).getShapes().get(0);
                FillType fillType = shape.getFillFormat().getFillType();
                Color color = shape.getFillFormat().getSolidFillColor().getColor();
                System.out.println("fillType: " + fillType);
                System.out.println("argb: " + Integer.toHexString(color.toArgb()));
                if (fillType != FillType.SOLID) {
                    throw new AssertionError("expected the reloaded fill to be solid");
                }
                if (color.toArgb() != Color.fromArgb(255, 0, 112, 192).toArgb()) {
                    throw new AssertionError("expected the reloaded fill colour to be 0070C0");
                }
            }
        }
    }
