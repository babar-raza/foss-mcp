# TC-860 (G3, RT5): replayable probes for the 7 workstream-L (latency) and 3 workstream-K (tool contract) rows of
# docs/ROUND2_REVIEW.md dispositioned by this card. Each entry's probe runs in-process against infra/demo-manifests
# (and against a running container); `expect` describes the CURRENT served behaviour that justifies the disposition.
# result_contains substrings are checked against the tool result serialised as JSON (ensure_ascii=False).
# The latency rows are DISCLOSED by docs/RELEASE.md L-143: the stall sits in the public quick tunnel, so the probe
# proves the served call is correct and fast, and the tail itself is only measurable through the tunnel (OWNER-17).
- id: 3D-NET-010
  row: RD2-020
  pilot: 3d/net
  disposition: DISCLOSED
  probe:
    tool: get_symbol
    args:
      fqn: Aspose.ThreeD.Scene
  expect:
    found: true
    result_contains:
    - Aspose.ThreeD.Scene
  evidence: 'Latency tail is a property of the public Cloudflare quick tunnel, not of the served call: RT4 measurement (docs/DECISION_LOG.md
    2026-11-05, OWNER-17) put 48 concurrent sessions at 7.0-8.8 s through the tunnel versus ~0.9 s through nginx alone, serial
    traffic never stalled; disclosed as docs/RELEASE.md L-143. Re-measured in-process on 2026-11-24 over demo-manifests: 20
    sequential identical calls, p50 10.4 ms, p95 12.8 ms, max 36.7 ms (audit: p50 91 ms, max 21120 ms). This call is the row''s
    own repro and answers correctly; a runner against a container may add timing.'
