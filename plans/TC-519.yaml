min_tests: 40
network: true
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/release_alignment.py');s=p.read_text(encoding='utf-8');old='if release_version > indexed_version:';assert s.count(old)==1;p.write_text(s.replace(old,'if release_version < indexed_version:'),encoding='utf-8')"
  rationale: >-
    Inverts the version comparison, so a release newer than the indexed package version is reported as in the index and an older one as not: the baked-data tests (cells/python 26.10.0 false, pdf/net 26.10.0 false) and the unit tests fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-519/receipt.json
closeout:
- >-
  Every served release says whether the index includes it, the freshness report distinguishes unknown from stale and says how it decided, and the sidecars can hold 20 releases or the tags of a repository without releases. The baked sidecars hold at most 10 releases and no tag entries until the pilots are re-ingested (a supervisor step); until then `in_index` is computed from the version rule
  alone, which already marks cells/python 26.10.0 and pdf/net 26.10.0 as newer than the index. The image must be rebuilt for this to reach a pilot.
recovery: Re-run from a clean tree.
