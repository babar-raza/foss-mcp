id: TC-519
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review; findings AGT-04, D-05, D-06, D-13 and AGT-11). RELEASE/INDEX SKEW AND FRESHNESS. Measured by the reviewers and re-checked offline by the drafter on the baked sidecars and generations: the
  release notes `list_recent_changes` serves and the API the index describes are different versions with nothing marking which is which. cells/python: the index is built at commit 4f6768a whose pyproject says 26.7.0, the served newest
  release is V26.10.0 (PDF export), and a blind coding task that used the release note's `save_as_pdf` raised AttributeError at the indexed commit; pdf/net: manifest 26.9.0, newest release v26.10.0; pdf/go serves release v0.11.0 (a security
  fix) twenty commits ahead of the indexed commit. `report_index_freshness` always answers `stale: true` when the caller does not pass a commit - "unknown" and "stale" are one boolean - and has no generation age, source repository,
  latest release, or warning for an abbreviated SHA (a 7 to 39 character prefix silently prefix-matches and reports `stale: false`). The sidecar writer keeps only 10 releases (infra/fetch_recent_releases.py `_DEFAULT_LIMIT = 10`,
  applied at the `fetch_releases(...)[: args.limit]` slice): pdf/go has 12, so 2 are dropped; 3 of the 15 repositories with no GitHub releases have tags (page/python 2, email/python 1) and note/python has 17 tags next to 2 releases, but
  the tool ignores tags and answers an empty list. This card (a) marks every served release `in_index` - true when the indexed API includes it, false when it is newer than the index, null (unknown) otherwise - by one deterministic rule with a
  stated basis: the tag's commit equals an indexed source commit (needs the 40-hex `target_commit` that card TC-511 records, available for tag entries below), else the release's version compared with the version the package manifest
  declares when both have the same major number (so 26.10.0 is newer than 26.7.0, 26.7.0 is not, and the jmap pilots' calendar-style 26.09 against a 0.1.0 manifest is NOT compared), else unknown; (b) makes the freshness verdict tri-state while
  keeping the boolean for compatibility, adds the indexed time (read from the UTC stamp in the generation id), the source repository, the latest release tag and whether it is in the index, a warning for an abbreviated commit, and a documented default
  for an omitted commit; (c) raises the sidecar release cap from 10 to 20 and, when a repository has no GitHub releases, falls back to its tags (a tag entry has no notes: richness none, source "tag", and the tags API gives the commit sha with no extra
  call). Measured on the baked data with the rule: cells/python V26.10.0 false, V26.7.0 and V26.3.1 true; pdf/net v26.10.0 false, v26.9.0 and v26.8.0 true; cells/net V26.9.0 true (manifest 26.9.0.0); pdf/cpp v1.0.1 true; the eight jmap pilots,
  pdf/go and every pilot whose manifest states no version stay null. Decisions recorded here. The bare list of `list_recent_changes` stays a bare list (card TC-507 pins that decision) - the new fields are additive keys of each entry. `stale` stays
  `true` for an unknown verdict (today's behaviour) and `freshness_state` carries the distinction; the pinned legacy `reason` sentence is kept word for word whenever nothing but the legacy information is available. Fetching tags or releases at
  serving time is NOT added (no network at serving). What does NOT change: tool names and input schemas, the number of releases returned by default (limit 10), the richness verdicts, the index.
