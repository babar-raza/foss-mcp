- command: '{python} -m pytest tests/mcp tests/infra/test_fetch_recent_releases.py tests/infra/test_fetch_recent_releases_failure.py tests/extraction/test_repo_native.py tests/infra/test_serve_http.py tests/infra/test_serve_stdio_parity.py tests/test_unwired_modules.py -q -rfE -p no:cacheprovider'
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
