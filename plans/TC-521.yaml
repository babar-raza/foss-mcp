negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='_JS_MIXIN_ASSIGN_CALLEE = ';assert s.count(old)==1;p.write_text(s.replace(old,'_JS_MIXIN_ASSIGN_CALLEE = chr(120) + ',1),encoding='utf-8')"
  rationale: >-
    Turns the recognised callee into "xObject.assign", so the extractor stops recognising Object.assign(Class.prototype, Mixin): no mixin is ever
    attached, the wrapper class has no listMailboxes, and the acceptance test (the owner's Methods block must hold the mixin methods) and every mixin
    test fail, as does the alias-inheritance test that counts the wrapper's members. A real break of the card's central claim.
