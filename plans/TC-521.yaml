closeout:
- >-
  A JavaScript library that composes its client from object-literal mixins publishes those methods on the class they are applied to, a destructured
  constructor shows the keys it accepts, and exported classes keep their description. A permanent test now fails whenever a pilot's README names an
  identifier the committed fixture does not hold unless it sits on the exact allowlist, and fails again when a listed gap is fixed without removing
  it. Takes effect for jmap_nodejs when a re-extraction card regenerates tests/fixtures/jmap_nodejs/api_surface.json (it must then regenerate the
  allowlist with `python -m tests.extraction.docs_identifiers --write` and show the jmap_nodejs entry shrinking: listMailboxes, getMailbox,
  createMailbox, deleteMailbox, listMessages, fetchMessage, moveMessage, setMessageKeyword, deleteMessage, listIdentities, send, cancelSend,
  listSubmissions must leave it) and the image is rebuilt.
recovery: Re-run from a clean tree.
