id: TC-521
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, findings RST-04 = ISOPROV-02 = AGT-01). JS MIXINS AND DESTRUCTURED CONSTRUCTORS. The jmap/nodejs
  pilot is genuine JavaScript (aspose-email-foss/Aspose.JMAP-FOSS-for-Node.js at 93f22fb, 44 .js, no .ts) but its client API is invisible. Measured
  by the reviewers and re-measured here by running `run_extraction.extract_from_clone` on the pinned clone: src/client-mail.js and
  src/client-submission.js define `export const MailClientMixin = { async listMailboxes(...) {...}, ... }` and src/index.js applies them with
  `Object.assign(JmapClient.prototype, MailClientMixin)` onto `class JmapClient extends CoreClient {}`, where CoreClient is the import alias of
  `JmapClient` from client-core.js. The extractor models only `class` declarations and object-literal methods fail `is_public` (their parent is an
  `object`, not a class_body), so 13 of 20 public client methods (listMailboxes, getMailbox, createMailbox, deleteMailbox, listMessages, fetchMessage,
  moveMessage, setMessageKeyword, deleteMessage, listIdentities, send, cancelSend, listSubmissions) are absent, the fixture's wrapper
  `JmapClient` (file src/index.js) has `bases ["CoreClient"]` and NO methods, and `list_members JmapClient` returns an empty list although every
  chunk claims `API-Coverage: 31 of 31 types`. The served README example itself calls `client.listMailboxes()`. Two smaller defects of the same
  adapter sit on the same pilot: `constructor({ id, name, parentId = null, ... } = {})` (models/Mailbox.js:21, and every other model) renders
  `constructor()` with no parameter because `_extract_method_params` (api_surface.py L357) ignores `object_pattern` and `assignment_pattern`
  parameters, so an agent cannot learn which fields a model accepts; and the class description of every `export class` is dropped (jmap/nodejs
  class descriptions 3 percent): `_extract_doc_comment` (L759) asks `lang.get(language)` for the doc anchor, but `lang.LANGUAGES` has no
  "javascript" key (only "typescript"), so the redirect from the declaration to its `export_statement` that makes TypeScript work never happens for
  the language the nodejs pilots extract under. The review also found no permanent test that the identifiers a pilot's README names resolve to
  something the index holds (the 65-task blind run found 3 of 5 jmap/nodejs tasks undiscoverable for exactly this reason). This card: (1) teaches
  the JavaScript extraction object-literal mixins applied with `Object.assign(<Class>.prototype, <Mixin>, ...)` (also inline object literals),
  attaching the mixin's methods to the class in the file that applies them, marked with their mixin and defining file; (2) resolves an
  `extends <import alias>` base to the aliased class so the wrapper inherits the core client's members; (3) renders a destructured parameter as one
  object-typed parameter built from the pattern and the JSDoc `@param {T} [params.key=default]` lines, and adds the destructured keys of a
  constructor as properties; (4) fixes the JavaScript doc anchor; (5) adds the permanent, data-driven "identifiers the docs name must resolve"
  helper and test over all 40 committed fixtures with an allowlist derived from the CURRENT fixtures (stale-allowlist rule, like TC-440's
  tex_python exception). What does NOT change: the committed jmap_nodejs fixture (a later re-extraction card regenerates it and must then shrink the
  allowlist), TypeScript behaviour (TC-523), signature rendering of any other language, the selection policy (TC-520).
depends_on:
- TC-520
- TC-315
- TC-396
