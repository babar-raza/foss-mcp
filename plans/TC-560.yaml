id: TC-560
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-009 (rows RD3-070 to RD3-073; decision OQ-013). INDEX-VERSUS-PACKAGE DRIFT DETECTION AND DISCLOSURE. Freshness is a version-string comparison, so when the indexed commit is past the latest release
  tag and the manifest version string is unchanged, or the manifest carries no version, nothing is detected: slides/python documents `hyperlink_click` (AttributeError on the installed 26.8.0), 3d/java documents
  65 types the Maven jar lacks (`ImageRenderOptions`: javac 'cannot find symbol'), 3d/net documents 103 types NuGet 26.1.0 lacks (196 vs 293, the documented FileFormat names do not compile), slides/java
  is 45 commits past its tag; pdf/go `go get` resolves v0.11.0 which has the sanitization API the index lacks, freshness says unknown; `list_recent_changes` ignores tags newer than the latest GitHub release
  (note/python v26.9.0, cells/go v26.7.1); `stale` is reported in the wrong direction for tag-only repositories (email/python, page/python are AHEAD of their tag). FIX: compute drift by git ancestry between
  the indexed commit and the commit of the latest release/tag (the sidecar fetch records both), expose `index_ahead_of_package` / `package_ahead_of_index` with the commit distance and the published version
  in report_index_freshness, write the same fact and the exact build-from-commit instruction into the install notice, merge newer tags into the release list (marked source: tag), and report the direction
  correctly. FINALISED for dispatch on 2026-10-19 by the supervisor (min_tests calibrated per check, negative control authored, write_paths checked).
depends_on:
- TC-550
- TC-553
- TC-554
- TC-555
- TC-556
- TC-466
write_paths:
- infra/fetch_recent_releases.py
- infra/fetch_product_reference.py
- src/foss_mcp/mcp/tools/report_index_freshness.py
- src/foss_mcp/mcp/tools/list_recent_changes.py
- src/foss_mcp/mcp/tools/release_alignment.py
- src/foss_mcp/mcp/tools/get_product_reference.py
- tests/mcp/tools/test_round3_drift.py
- tests/infra/test_round3_release_tags.py
- src/foss_mcp/extraction/github_release_reader.py
- tests/mcp/tools/test_freshness_tristate.py
- tests/mcp/tools/test_freshness_provenance.py
- tests/mcp/tools/test_release_alignment.py
- tests/mcp/tools/test_release_index_baked.py
- tests/infra/test_fetch_recent_releases.py
- tests/test_unwired_modules.py
satisfies:
- REQ-G3-009
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: (a) given a repository whose indexed commit is N commits past the latest release tag with an unchanged manifest version, freshness says index_ahead_of_package with N and the published version,
  and the install notice says the published package can lack members and spells out `git clone` / `go get ...@<commit>` / FetchContent at the commit; (b) given a Go-style manifest with no version and a
  newer release tag, freshness says package_ahead_of_index; (c) tags newer than the newest release object appear in list_recent_changes marked source tag; (d) tag-only repositories get the right direction.
  INDEPENDENT ORACLE: a throw-away local git repository built in the test (commits, tags, a manifest) so ancestry is real; the live pins (slides/python 26.8.0 vs the indexed commit, pdf/go v0.11.0, note/python
  v26.9.0, cells/go v26.7.1) are asserted on the baked sidecars after the supervisor's re-ingest (TC-536 owns that pin).
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated names in src/foss_mcp/mcp/tools/release_alignment.py: the exact lines `INDEX_AHEAD = "index_ahead_of_package"` and `PACKAGE_AHEAD = "package_ahead_of_index"`
  and a pure function `drift_verdict(indexed_commit, latest_release_tag, commits_ahead, commits_behind, published_version, indexed_version) -> dict` that every emitter (report_index_freshness, get_product_reference
  install notice, list_recent_changes) calls. Absent drift data (every sidecar baked before the final re-ingest has none) must yield the existing behaviour plus `drift: unknown`, never an error. (2) Where
  the numbers come from: at ingestion the sidecar writers (infra/fetch_recent_releases.py, using src/foss_mcp/extraction/github_release_reader.py) ask the GitHub compare API once per pilot (`compare/<tag_commit>...<indexed_commit>`:
  ahead_by, behind_by) or, if that fails, record `drift: unknown`; the result is stored in the existing releases sidecar under a new optional key that the loaders ignore when absent (check load_recent_releases_sidecar
  and the sidecar identity checks). The API call carries the ingestion token if present and degrades without it; the tests use recorded JSON, no network. (3) Existing tests to keep green and to re-pin only
  where the new key legitimately changes an expectation (list each change with its reason): tests/mcp/tools/test_freshness_tristate.py (23), test_freshness_provenance.py (38), test_release_alignment.py
  (39), test_release_index_baked.py (42, pins the baked sidecars: do not change baked data), tests/infra/test_fetch_recent_releases.py (12). (4) min_tests is 100 for EACH check: check 1 collects at least
  8 new + 23 + 38 + 39 + 12 = 120; check 2 collects 2,500 or more. (5) The live pins named in the acceptance (slides/python 26.8.0, pdf/go v0.11.0, note/python v26.9.0, cells/go v26.7.1) are asserted with
  recorded API responses in tests/infra/test_round3_release_tags.py; the baked-sidecar pins are the closing step's (TC-536).
- >-
  REWORK AMENDMENT (supervisor, 2026-10-19). The liveness test tests/test_unwired_modules.py lists the production entrypoints from which it walks the import graph; infra/fetch_recent_releases.py (the container
  fetch step that calls merge_newer_tags, fetch_drift and order_tags_newest_first of src/foss_mcp/extraction/github_release_reader.py) is not on that list, so the walk reports those three functions as unwired.
  Add infra/fetch_recent_releases.py to the entrypoint list of that test with a comment `TC-560: the container fetch step that computes the drift record`, and update the module docstring paragraph that
  enumerates the entrypoints. Do NOT add the three symbols to _KNOWN_UNWIRED: they have a real call site in a production entrypoint, which is exactly what the integration rule requires. tests/test_unwired_modules.py
  is now in write_paths for this reason only.
actions:
- Add ancestry-based drift detection and disclosure, newer-tag merging and the direction fix.
checks:
- command: >-
    {python} -m pytest tests/mcp/tools/test_round3_drift.py tests/infra/test_round3_release_tags.py tests/mcp/tools/test_freshness_tristate.py tests/mcp/tools/test_freshness_provenance.py tests/mcp/tools/test_release_alignment.py
    tests/infra/test_fetch_recent_releases.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp tests/infra/test_fetch_recent_releases.py -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native"
  expect: exit 0
  timeout_seconds: 2400
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 100
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/release_alignment.py');s=p.read_text(encoding='utf-8');old='INDEX_AHEAD = chr(34)+chr(105)';q=chr(34);old='INDEX_AHEAD = '+q+'index_ahead_of_package'+q;assert s.count(old)==1;p.write_text(s.replace(old,'INDEX_AHEAD = '+q+'index_ahead_of_pkg'+q),encoding='utf-8')"
  rationale: >-
    Renames the mandated constant INDEX_AHEAD (the value freshness and the install notice emit when the indexed commit is past the latest release), so every test that asserts the drift verdict 'index_ahead_of_package'
    for the slides/python, 3d/java and synthetic-ancestry cases fails at once. A real break of the card's claim that this drift is detected and named.
evidence:
- evidence/build/G3/TC-560/receipt.json
closeout:
- >-
  Index-ahead-of-package and package-ahead-of-index drift is detected from git ancestry and disclosed per pilot with the exact build-from-commit instruction; release lists include newer tags.
recovery: Re-run from a clean tree.
