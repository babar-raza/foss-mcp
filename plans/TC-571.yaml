- command: >-
    {python} -m pytest tests/mcp/tools/test_round3_promoted_member_ranking.py tests/mcp/tools/test_search_symbols_forgiveness.py tests/mcp/tools/test_search_symbols_memberless_last.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
- command: >-
    {python} -m pytest tests/mcp tests/indexing tests/infra tests/deploy --ignore=tests/deploy/test_served_coverage_matches_fixtures.py --ignore=tests/deploy/test_compact_demo_manifests.py --ignore=tests/deploy/test_fleet_consistency.py
    --ignore=tests/deploy/test_demo_manifests_sidecars.py --ignore=tests/mcp/tools/test_find_examples_verification_record.py --ignore=tests/infra/test_round3_serving_robustness.py -q -rfE -p no:cacheprovider
    -k "not live and not github_http and not repo_native and not docker and not helm_template and not test_prepare_rust_library and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
min_tests: 20
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/search_symbols.py');s=p.read_text(encoding='utf-8');old='_NON_DECLARING_MARKERS = (' + chr(34) + '(inherited from ' + chr(34) + ', ' + chr(34) + '(promoted from ' + chr(34) + ')';assert s.count(old)==1;p.write_text(s.replace(old,'_NON_DECLARING_MARKERS = (' + chr(34) + '(inherited from ' + chr(34) + ',)'),encoding='utf-8')"
  rationale: >-
    Drops the promoted-from marker from the mandated tuple, so a Go struct that only promotes a member through embedding is misclassified as declaring it again: the new synthetic promoted-member test and
    the real pdf/go ranking test fail at once. A real break of the card's central claim (a promoted member is never mistaken for a declared one).
evidence:
- evidence/build/G3/TC-571/receipt.json
closeout:
- >-
  search_symbols.py treats a promoted Go struct-embedding member the same as any other inherited member for ranking purposes; the real pdf/go and cells/go data rank declaring types above promoting ones
  again.
recovery: Re-run from a clean tree.
