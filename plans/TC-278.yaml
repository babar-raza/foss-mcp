negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/search_symbols.py');s=p.read_text(encoding='utf-8');old='_match_tier';new='_match_tier_DISABLED';i=s.rindex(old);s=s[:i]+new+s[i+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: Renames the LAST occurrence of "_match_tier" in the file - the real call site inside search_symbols()
    that sorts admitted candidates by tier, not the function's own definition (which this card mandates the
    worker name exactly this way) - so the new tiered-ranking/precision-floor behavior is disabled (a NameError
    at the real call site) and every new test proving either fix must fail. Built with plain text, no backslash,
    using rindex per this session's established vacuous-falsifier safeguard. If the worker names the new
    function something else, the falsifier must be updated to match - report this explicitly rather than
    silently adjusting the negative control to fit whatever was built.
