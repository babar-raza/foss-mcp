inputs:
- 'Read src/foss_mcp/mcp/tools/search_symbols.py in full (is_exact_symbol_hit ~line 64-91, search_symbols
  ~line 137-186) before changing anything. Confirm the three-branch structure (full-FQN equality, final-segment
  equality, bag-of-words containment) yourself in the real code, not from this card''s prose. Confirm (via grep)
  that is_exact_symbol_hit has exactly one caller outside this file -
  tests/indexing/test_lookup_doc_fallback_query_safety.py, used only as a boolean predicate
  (`any(is_exact_symbol_hit(...) for fqn in real_fqns)`) - so its existing boolean return contract must be
  preserved exactly; do not change its signature or remove it.'
- 'FIX A (buried-too-deep, low risk): restructure the three-branch logic into a new function, e.g.
  `_match_tier(query, fqn) -> int | None` - returns 0 for full-FQN equality, 1 for final-segment equality, 2 for
  bag-of-words containment, or None for no match (the exact same three conditions is_exact_symbol_hit already
  checks, just returning which one fired instead of a bare bool). Redefine `is_exact_symbol_hit(query, fqn)` as
  `_match_tier(query, fqn) is not None` so its existing callers and contract are completely unchanged. In
  search_symbols() itself, when building the candidate list, keep each admitted doc''s tier alongside its BM25
  score, and sort the admitted candidates primarily by tier (ascending - strongest evidence first), secondarily
  by BM25 score (descending, the existing order) as the tiebreak within a tier - never discard the BM25 score,
  it is still the right tiebreak among same-tier candidates. This is a pure reordering of already-admitted
  matches: it must add no new positive result and remove none. Verify directly against the real pdf/net fixture
  (tests/fixtures/pdf_net/api_surface.json, built through the real build_chunks_from_api_surface ->
  build_lexical_index -> search_symbols production path - NOT a hand-shaped one-chunk-per-method synthetic
  fixture, which does not match real chunking) that querying "Annotation" now ranks
  Aspose.Pdf.Annotations.Annotation ahead of every bag-of-words-tier subclass.'
- 'FIX B (confidently-wrong, needs real measurement - do not guess a number or reuse TC-273''s 0.6 BM25-coverage
  threshold verbatim; that was measured for a different signal - BM25-score-based coverage in an otherwise-
  unfiltered fallback - against a different failure mode, and the false positive here scores LOWER on that exact
  signal than an already-required true positive, proving it is the wrong signal for this bug, not merely the
  wrong number): add a precision floor to the bag-of-words branch specifically (tier 2 only - never touch the
  full-FQN or final-segment branches, which have no such problem). Measure, empirically, against the real
  lexical/symbol data for at least 3 real pilots (pdf/net, cells/cpp, slides/python - mirroring TC-273''s own
  3-pilot/7-phrasing protocol), BOTH of these candidate signals before picking either: (a) a SYMMETRIC overlap
  ratio - the fraction of the FQN''s OWN total word count the query''s words actually cover (not the current
  one-directional "all query words are somewhere in fqn" containment, which is what let a 3-word query match a
  9-word FQN); (b) an adjacency/order constraint - the query''s words must appear as a contiguous or near-
  contiguous run in the FQN''s own word sequence, not scattered or reordered. Pick whichever candidate (or
  combination) correctly admits every already-required true positive in the existing test suites (see the next
  input) while correctly rejecting the real "set pattern color"/"set color pattern" false positives above -
  record your measured numbers and the real symbols/queries you tested against in your own report, the same way
  TC-273 recorded its coverage numbers.'
- 'Do-not-break list, read both files in full first: tests/mcp/test_search_symbols_honest_miss.py locks in exact
  FQN match, case-insensitive final-segment match, miss-not-match for a token-sharing-but-absent symbol
  ("PdfDocument.Rotate"), fuzzy suggestion on a near-miss, WHOLE-WORD single-token match ("watermark" against
  PdfDocument.AddWatermarkAnnotation - this is the true positive your Fix B measurement must keep admitting),
  miss for a name sharing no word, miss for a partial/truncated word ("Watermar"/"Annotat" must stay Misses), and
  C++ `::`-scoped FQN handling. tests/mcp/tools/test_retrieval_tools.py has test_search_symbols_finds_a_real_
  published_symbol and test_search_symbols_returns_an_explicit_miss_never_a_widened_result (the honest-miss
  invariant itself) plus pseudo-symbol-exclusion and miss-suggestion tests. Confirmed (by this card''s own
  investigation): none of these assertions pin the ORDER of multiple returned matches (all use `any(...)` over
  the result list) - Fix A''s reordering is safe against every one of them as written. Run both files in full,
  twice, before and after your changes.'
- 'Add new tests (in tests/mcp/tools/test_retrieval_tools.py, this file''s own existing search_symbols test
  section) proving both fixes against the REAL production chunking path (build_chunks_from_api_surface, not a
  hand-shaped synthetic fixture): Fix A - querying "Annotation" against the real pdf/net fixture ranks the base
  class ahead of its subclasses (a direct regression test for the exact buried-too-deep case this card closes);
  Fix B - "set pattern color"/"set color pattern" against the real pdf/net fixture return an honest Miss, not
  BasicSetColorAndPatternOperator (a direct regression test for the exact confident-wrong case this card closes),
  while "watermark" against the real pdf/net fixture''s AddWatermarkAnnotation still correctly matches (proving
  Fix B did not regress an existing true positive).'
- 'Do NOT fold in or attempt to fix, as a side effect of this card, the SEPARATE defect this card''s own
  investigation also found: build_chunks_from_api_surface publishes one chunk per TYPE with a single FQN line
  naming only the class, so a query naming a METHOD (e.g. "SetRotation" for the real Aspose.Pdf.Page.SetRotation)
  can never pass is_exact_symbol_hit no matter how BM25 ranks its containing chunk, producing a Miss with a
  misleading suggestion for a symbol that genuinely exists. This is a different bug shape (extraction/matching
  granularity, not a ranking/threshold problem) requiring its own measurement and test coverage - it is tracked
  separately (see docs/DECISION_LOG.md) and must not be touched by this card.'
- 'REWORK (attempt 2): attempt 1''s Fix A and Fix B are both correct and well-verified (the base class now ranks
  1st of 14, survives at top_k=5; the contiguous-run constraint - correctly independently re-derived after
  disqualifying the symmetric-overlap signal the same way the card disqualified reusing TC-273''s own threshold -
  correctly rejects both real false positives while admitting every required true positive across 3 real
  pilots). One genuine, correctly-identified consequence needs resolving: `is_exact_symbol_hit` now has only its
  one test caller (tests/indexing/test_lookup_doc_fallback_query_safety.py), since search_symbols() itself now
  calls `_match_tier` directly for the tier value, not the boolean wrapper - test_unwired_modules.py correctly
  flags it as newly production-unwired. Decision (do not pad _KNOWN_UNWIRED - this project''s own test file
  documents that list as one that should shrink, not grow, when a symbol becomes genuinely redundant rather than
  merely hard to reach): DELETE `is_exact_symbol_hit` entirely (it is now dead weight - every real need it served
  is better served by `_match_tier(query, fqn) is not None`, which is exactly as clear) and update
  tests/indexing/test_lookup_doc_fallback_query_safety.py''s one call site (`any(is_exact_symbol_hit(...) for fqn
  in real_fqns)`) to import and call `_match_tier(OFFLINE_SAFE_QUERY, fqn) is not None` instead - same boolean
  meaning, same assertion, no public wrapper left unreferenced. Re-run that test file plus your original check
  command, then the full suite once more, and confirm test_unwired_modules.py no longer flags anything new.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
