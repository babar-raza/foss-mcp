- Restructure the three branches into a tier-returning helper; sort admitted candidates by tier then BM25 score.
- Empirically measure a precision floor for the bag-of-words tier against 3 real pilots; wire it in.
- Add regression tests for both fixes against the real production chunking path; run the full do-not-break list
