closeout:
- search_symbols ranks already-admitted matches by the strength of evidence that admitted them (exact FQN, then
  final segment, then bag-of-words), not by raw BM25 density alone, so a real base class is never buried behind
  its own subclasses; and the bag-of-words tier has a real, measured precision floor so a query naming a
  nonexistent feature gets an honest Miss instead of a confident wrong top-1 - without weakening any single
  already-required true positive.
recovery: Re-run from a clean tree.
