id: TC-278
gate: G2
lane: storage-retrieval
purpose: 'Fix C7 of the third independent audit (2026-10-08): search_symbols already has a relevance floor
  (is_exact_symbol_hit, src/foss_mcp/mcp/tools/search_symbols.py ~line 64-91), but it has two distinct, concretely
  reproduced defects. (1) "Correct symbols buried too deep": is_exact_symbol_hit already distinguishes three
  strengths of evidence internally (full-FQN equality > final-segment equality > bag-of-words word-set
  containment) but discards that distinction immediately, using it only as a boolean filter - so a weaker
  bag-of-words match with a shorter, denser document can out-rank a stronger final-segment match by raw BM25
  score alone. Live-confirmed against pdf/net: querying "Annotation" ranks the real base class
  Aspose.Pdf.Annotations.Annotation (a final-segment-equality hit, the strongest evidence short of exact-FQN) 9th
  of 14 admitted candidates behind 8 subclasses (each only a weaker bag-of-words hit, e.g.
  AnnotationSelector/PopupAnnotation/MarkupAnnotation), because every subclass repeats "Annotation" in a shorter
  overall document and so scores higher on raw BM25 term density alone - at the real default top_k=10 it only
  barely survives; at find_examples'' own default top_k=5 it would not appear at all. (2) "Nonexistent features
  yield a confident, wrong top-1": the bag-of-words branch has no precision floor beyond "every query word
  appears somewhere in the FQN''s own word set," with no check on order, adjacency, or how much of the FQN''s own
  structure the query actually covers. Live-confirmed against pdf/net: the queries "set pattern color" and "set
  color pattern" each return exactly one confident match, Aspose.Pdf.Operators.BasicSetColorAndPatternOperator -
  an internal, abstract content-stream-operator base class for parsing raw SCN/scn operators, not a public "set
  pattern color" feature at all (no such feature exists in this corpus; the honest answer is a Miss). The match
  happens because all 3 scattered, reordered query words happen to appear somewhere among the FQN''s 9 words,
  with no sense of containment DENSITY - this scores LOWER one-directional coverage (3/9) than an already-
  required true positive the existing tests lock in (e.g. "watermark" against PdfDocument.AddWatermarkAnnotation,
  4 words, 1/4 density) despite being the false positive, proving one-directional containment alone is the wrong
  signal, not merely under-tuned. The audit''s own explicit invariant governs both fixes: "Ranking improvements
  must not weaken negative knowledge... A search system that returns something for every query is worse than one
  that honestly misses."'
