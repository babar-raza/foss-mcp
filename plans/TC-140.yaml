- Remove `foss_mcp.mcp.health.is_alive` and `foss_mcp.mcp.health.round_trip_check`
  from _KNOWN_UNWIRED - both are confirmed genuinely wired into infra/serve_http.py
  by TC-137.
- 'For `foss_mcp.mcp.health.is_ready` (newly unwired): read both is_ready and round_trip_check
  in src/foss_mcp/mcp/health.py in full, and confirm for yourself (do not take this
  card''s own claim on faith) that round_trip_check is a real, strict superset of
  is_ready''s own guarantee - if genuinely confirmed, DELETE is_ready from health.py
  entirely (per this project''s own stated principle: if you are certain something
  is unused and superseded, delete it, do not carry a backwards-compatibility shim).
