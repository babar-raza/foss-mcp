id: TC-746
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a thirteenth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism twelve sibling cards already proved for twelve other pilots this session (different
  pilots, zero file overlap - do not touch anything any of them touch), including `TC-745`'s own
  `cells/typescript` card, the first proof this mechanism works for the TypeScript `verify_
  typescript_example` pipeline this session. Confirmed needing ZERO code change:
  `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads `tests/fixtures/
  furnished/<pilot>/authored_examples.yaml`, merges it with README-derived candidates, and runs
  every entry through `verify_typescript_example`, publishing only the ones that pass.

  `pdf/typescript` currently serves only 8 real example chunks (confirmed directly against the
  real committed `infra/demo-manifests/pdf__typescript__self_extracted` generation - note the
  plan's own Appendix C table says "4", which is now stale; re-confirm the real current count
  yourself before planning, do not trust either number blindly). Its real pinned repository is
  `aspose-pdf-foss/Aspose.PDF-FOSS-for-TypeScript` (re-confirm the exact pinned commit yourself
  from `config/products/pdf/typescript.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust this
  card's own citation blindly). The real upstream repository has a genuinely rich real
  `examples/feature-showcase` directory of roughly 26 real TypeScript modules plus bundled test
  assets (per this project's own Appendix-C style accounting for this pilot, the richest
  TypeScript sample set of any pilot touched this session) - read enough of the real files to
  pick up to 5 genuinely distinct, valuable operations.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `pdf/typescript` from 8 to AT MOST 13 served examples, not to its own
  real floor (12-30, Appendix C - this card may close or nearly close this pilot's own minimum
  floor if enough real examples verify, report honestly either way). This card's job is the real,
  bounded, immediately shippable slice: up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.

  VERIFY EACH EXAMPLE YOURSELF - read `example_verifier.py`'s `verify_typescript_example` to
  confirm exactly what the real pipeline needs. `TC-745`'s own closeout for `cells/typescript`
  found the toolchain only resolves via PowerShell (`scripts/toolchain/activate.ps1`) since Bash
  alone has no node/npm/npx on this host - use the same path. It also found the library's getter-
  backed-field object-spread trap can silently corrupt data (see `docs/DECISION_LOG.md`'s
  2026-11-10 entry) - check for the same class of bug in any sample you adapt before trusting its
  claimed behavior, and if you find a genuinely broken operation, decline it rather than building
  an example around broken behavior (flag it in your report instead, as `TC-745` did).
