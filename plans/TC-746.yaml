    authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`,
    `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal `normalised_code_sha256(code)`, `symbols`
    must be real FQNs, `library_commit` must be the real 40-hex pinned commit,
    `LANGUAGE_BY_PLATFORM` maps `typescript` -> `typescript`), `src/foss_mcp/indexing/
    example_verifier.py`'s `verify_typescript_example` in full, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `pdf/typescript`'s real current served example count and real pinned
    repository/commit yourself. Fetch the real upstream `examples/feature-showcase` directory at
    that exact commit and read enough of the real ~26 files to pick up to 5 real, genuinely
    distinct, valuable operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm a working Node/TypeScript toolchain
    (PowerShell with `scripts/toolchain/activate.ps1` - Bash alone lacks node/npm on this host),
    install the real pinned package, actually compile and RUN each program, confirm each one's
