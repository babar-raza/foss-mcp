id: TC-657
gate: G3
lane: storage-retrieval
purpose: >-
  Fixes 3 real round-3 audit findings (`docs/round3/issues.json`: `EML-NET-007`, `NOTE-PY-010`,
  `SLIDES-JAVA-004`), all one shared root cause in `report_index_freshness.py`'s
  `registry_served_version` comparison branch (the last-resort verdict this function falls
  through to when no commit-ancestry/release-tag signal is available - the branch this
  supervisor built as I7/I8, `TC-621`/`TC-622`). Per `AGENTS.md`'s "no pilot ever gets worse"
  rule: these are regressions in epistemic honesty (a confident-but-wrong verdict replacing an
  honest `"unknown"`), exactly as serious as a letter-grade regression, and are fixed before any
  further work on this mechanism.

  Confirmed directly by this supervisor before authoring this card:

  1. **`SLIDES-JAVA-004`** (real, narrow bug, not a design flaw): when this branch fires, it
     returns `build("fresh"/"stale", ...)` WITHOUT setting `drift`/`published_version`/
     `index_ahead_of_package` the way the sibling `git_ancestry` branch (a few lines above, in
     the same function) already does for the identical kind of verdict. The confident `"fresh"`
     verdict itself is consistent with this project's own existing design (Decision B: an index
     ahead of what the registry serves has always meant `"fresh"` here, the same rule
     `git_ancestry`'s own branch already uses) - the real, fixable gap is that the caller gets a
     confident verdict with none of the supporting evidence fields populated, which is what the
     audit's own "confident-but-unsupported" wording is really describing.
  2. **`NOTE-PY-010`**: not a logic bug. The real comparison (registry 26.9.0 vs indexed 26.9.0)
     is correct. The tool's own self-description text, in TWO places -
     `report_index_freshness`'s own docstring (`src/foss_mcp/mcp/tools/report_index_freshness.py`,
     "never guesses freshness") and the MCP-facing tool description served to a real agent
     (`src/foss_mcp/mcp/server.py` line ~551, "it never guesses") - is simply stale: both were
     written before this exact fallback branch existed (I7/I8) and were never updated to
     honestly describe it.
  3. **`EML-NET-007`**: a real, confirmed data problem, not a code bug in the comparison itself.
     `indexed_version` for this whole comparison comes from `release_alignment.package_version()`,
     which parses the raw packaging-manifest-declared version (`infra/demo-manifests/
     product_reference_email_net.json`'s own `manifest_text`, a `.csproj` with a literal
     `<Version>0.1.0</Version>`) - a meaningless, generic placeholder many of this project's
     pinned repos use in their build files, confirmed NOT the real served/installed version
     (the SAME sidecar's own `install_served_version` field reads `"26.7.0"`, matching the
     registry's own `served_version`). Comparing a real registry version against a placeholder
     manifest version produces an arithmetically "correct" but semantically meaningless
     `"stale"` verdict. Confirmed this is NOT simply fixable by swapping in
     `install_verified_served_version` as the comparison's `indexed_version` instead - read
     `src/foss_mcp/mcp/server.py` around line 373-387 yourself first: `registry_served_version`
     (the OTHER side of this exact comparison) is ITSELF already derived from that same field, so
     substituting it in would make the comparison trivially compare a value against itself.

  You must find and apply the right fix for case 3 yourself, guided by this project's own
  founding principle (`AGENTS.md`/this plan's own diagnosis: "a miss or an empty result is an
  honest answer... never guess past it") rather than a prescribed mechanism: when the ONLY
  available `indexed_version` signal is a manifest-declared version that cannot be trusted to
  mean anything (this card's own confirmed email/net case is your real, reproducible example -
  do not invent a synthetic one), this branch must prefer reporting `"unknown"` over a
  confident-but-potentially-meaningless verdict, consistent with every other honest-miss
  convention already in this codebase. Do not simply delete or weaken this branch for every
  caller - pilots where the manifest's declared version IS meaningful (check a few real
  `config/products/*/*.yaml`-adjacent manifests yourself to confirm not everyone uses a
  "0.1.0"-style placeholder) must keep getting a real, confident verdict from it.
