source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST, in full: the real `EML-NET-007`/`NOTE-PY-010`/`SLIDES-JAVA-004` records in
    `docs/round3/issues.json`. Then `report_index_freshness.py`'s full `report_index_freshness()`
    function (every branch, not just the `registry_served_version` one, so your fix's ordering
    relative to the other branches is deliberate) and its own module/function docstrings. Then
    `server.py`'s own tool description text around line 551 and wherever `registry_served_version`
    is computed and passed in (around line 373-387). Then `infra/demo-manifests/
    product_reference_email_net.json`'s real `manifest_text`/`install_served_version` fields
    (confirm the 0.1.0-vs-26.7.0 mismatch yourself) and at least 2 other pilots' equivalent
    sidecars to check whether the placeholder-version problem is widespread or email/net-specific.
  - >-
    Write at least 10 tests in `tests/mcp/tools/test_round3_freshness_honesty_regressions.py`:
    a synthetic case reproducing SLIDES-JAVA-004 (registry_served_version branch fires, verdict is
    fresh/stale, assert `drift`/`published_version`/`index_ahead_of_package` are now populated,
    matching what the git_ancestry branch would populate for the equivalent case); a real
    end-to-end test against email/net's real baked sidecar proving the real EML-NET-007 case now
    resolves to `"unknown"` (or your own chosen honest outcome) rather than a wrong confident
    `"stale"`; a synthetic case proving a PILOT WITH A MEANINGFUL manifest version still gets a
    real confident verdict from this same branch (your fix must not blind the mechanism for
    everyone); a test confirming `server.py`'s real tool description text no longer claims
    "never guesses" unconditionally; a test confirming `report_index_freshness.py`'s own
    docstring is updated the same way. Also add any missing coverage to
    `tests/mcp/tools/test_freshness_registry_version.py` (the existing regression file for this
    branch) if your fix changes that file's own already-passing tests' real expected output.
actions:
  - >-
    Fix 3 real round-3 regressions in report_index_freshness's registry-version fallback: a
    missing evidence-field population, a stale tool description, and a confident-but-meaningless
    verdict built on a placeholder manifest version - restoring the "never guesses" promise this
    tool's own documentation already makes to callers.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_round3_freshness_honesty_regressions.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-012
  - command: '{python} -m pytest tests/mcp/tools/test_freshness_registry_version.py tests/mcp/tools/test_freshness_provenance.py tests/mcp/tools/test_freshness_tristate.py tests/mcp/tools/test_known_defects_in_freshness.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 240
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 10
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/report_index_freshness.py'); s = p.read_text(encoding='utf-8'); marker = 'registry_served_version'; assert marker in s, 'registry_served_version not found as expected - if your real code differs, anchor your own mutate on your own real name instead and note the substitution in your closeout'; s2 = s.replace(marker, 'disabled_' + marker); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Breaks every reference to the registry_served_version branch by renaming it to an undefined
    symbol, so neither the fixed evidence-field population nor the honest-unknown fallback can
    run. Every test proving this card's real fixes must fail under this mutation (a NameError, or
    the field population/honest-fallback behavior silently missing); tests of unrelated freshness
    paths (git_ancestry, caller_commit, etc.) stay green. If your real fix lives partly outside
    this exact branch's own code block, verify this mutation still reaches it, or write your own
    more faithful mutate and say so in your closeout.
evidence:
  - evidence/build/G3/TC-657/receipt.json
closeout:
  - >-
    report_index_freshness's registry-version fallback now populates its evidence fields, never
    claims "never guesses" while using a confidence-graded fallback, and prefers an honest
    "unknown" over a verdict built on a meaningless placeholder version - closing 3 real round-3
    honesty regressions.
recovery: Re-run from a clean tree.
