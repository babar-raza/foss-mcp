id: TC-836
gate: G3
lane: storage-retrieval
purpose: >-
  Two tests are red on main (reproduced by the supervisor 2026-11-14 at HEAD, first noticed by the
  TC-822/TC-824 workers):
  tests/mcp/tools/test_product_reference_cpp_install.py::test_the_wrong_cmake_floor_is_gone_and_the_real_one_is_served
  and
  tests/mcp/tools/test_cpp_install_faq_fallback.py::test_cells_cpp_install_is_the_faq_fallback_specifically.
  Both are about CELLS-CPP-010 (round-3: get_product_reference(install) for cells/cpp claimed a
  fabricated 'CMake 3.15+, no external deps'; TC-659 fixed it so the answer states the REAL floor
  'CMake 3.16' from the pinned CMakeLists). On main the served cells/cpp install answer is now
  'Build from source with CMake. Repository: ... add_subdirectory(Aspose.Cells.Foss.Cpp) ...
  FetchContent ...' and no longer contains 'CMake 3.16' at all. Since TC-786/787/788 every sidecar
  carries `readme_document` + `manifest_path`, so the install answer is now built from the
  generated cpp build recipe merged with the README Installation section (TC-698 multi-route
  disclosure) instead of the FAQ-fallback path the tests pinned. FIRST establish facts (do not
  assume): (1) what the real pinned CMakeLists.txt of cells/cpp requires (clone read-only at the
  pilot's pinned commit in infra/demo-manifests/product_reference_cells_cpp.json, outside the
  repo, and read cmake_minimum_required); (2) what the served answer says today for ALL FOUR cpp
  pilots (cells, pdf, slides, email) about the minimum CMake version and whether each pilot's real
  CMakeLists states a floor; (3) why the floor disappeared (the generic `_MIN_VERSION_PATTERNS` /
  `_cpp_build_guidance` mechanism in src/foss_mcp/mcp/tools/get_product_reference.py and the
  `manifest_path` sidecar field; use git log/bisect between TC-659 and HEAD on that function).
  THEN DECIDE WITH EVIDENCE: if the real floor is still a true, user-relevant fact that the served
  answer used to state and now omits, this is a regression of a round-3 honesty fix (the 'no pilot
  ever gets worse' rule) - fix it in get_product_reference.py so the cpp install answer states the
  pinned CMakeLists minimum version for every cpp pilot that declares one (additive sentence,
  never changing other text; the generated recipe is the right place), then update the two tests
  ONLY where they pinned the OLD path (the FAQ-fallback specificity), keeping the CMake 3.16
  assertion for cells/cpp. If instead the floor is stated elsewhere in the same answer in
  different wording, re-pin the assertion to the real wording with a comment. Never weaken the
  'wrong floor is gone' guard.
depends_on:
  - TC-824
  - TC-816
  - TC-812
  - TC-798
  - TC-698
  - TC-681
  - TC-659
  - TC-786
  - TC-787
  - TC-788
write_paths:
  - src/foss_mcp/mcp/tools/get_product_reference.py
  - tests/mcp/tools/test_product_reference_cpp_install.py
  - tests/mcp/tools/test_cpp_install_faq_fallback.py
  - tests/mcp/tools/test_product_reference_cpp_cmake_floor.py
satisfies:
  - REQ-G3-013
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: get_product_reference.py `_cpp_install`, `_cpp_build_guidance`,
    `_MIN_VERSION_PATTERNS`, how `manifest_path`/`readme_document` feed the install answer; the two
    failing tests in full; docs/DECISION_LOG.md entries for CELLS-CPP-010 / TC-659 (grep
    CELLS-CPP-010); infra/demo-manifests/product_reference_cells_cpp.json and the other three cpp
    sidecars.
  - >-
    REPRODUCE FIRST (PowerShell after scripts/toolchain/activate.ps1): run the two tests on main,
    then call get_product_reference(inputs,'install') for the four cpp pilots from the real sidecars
    (the way tests/mcp/tools/test_product_reference_baked_contract.py loads them) and record whether
    each answer states a CMake minimum.
  - >-
    NEW TEST tests/mcp/tools/test_product_reference_cpp_cmake_floor.py: for each of the four cpp
    pilots the served install answer states the real minimum from its pinned CMakeLists (derive the
    expected value from the committed sidecar/manifest data, with the CMakeLists value pinned as a
    literal you verified) or, for a pilot whose CMakeLists declares none, does NOT invent one;
    non-cpp pilots' install answers are byte-identical before/after (measure all 32).
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies the src part). ruff
    format + ruff check on changed files, then the card's check command twice; report real counts.
    Do NOT use git stash. If you find the answer is correct as is and only the tests are stale, say
    so with the evidence and change only tests.
actions:
  - >-
    Restore (or re-pin with evidence) the stated CMake minimum version in the cpp install answers
    and fix the two stale cells/cpp install tests.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_product_reference_cpp_cmake_floor.py tests/mcp/tools/test_product_reference_cpp_install.py tests/mcp/tools/test_cpp_install_faq_fallback.py tests/mcp/tools/test_product_reference_baked_contract.py tests/mcp/tools/test_product_reference_install_pin.py tests/mcp/tools/test_get_product_reference_platforms.py tests/mcp/tools/test_get_product_reference_python_extras.py tests/conformance/test_reference_content.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 1500
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 436
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/mcp/tools/get_product_reference.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-836/receipt.json
closeout:
  - >-
    The cpp install answers state the real pinned CMake minimum again (or the tests are re-pinned to
    the verified wording), with a regression guard for all four cpp pilots.
recovery: Re-run from a clean tree.
