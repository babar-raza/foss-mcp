id: TC-261
gate: G2
lane: extraction
purpose: 'Fix a real, confirmed provenance gap (C3 of the third independent audit, 2026-10-08):
  src/foss_mcp/extraction/tree_sitter_engine/api_surface.py''s _flatten_inheritance() is a deliberate,
  language-agnostic function that copies every ancestor class''s methods/properties into every descendant''s own
  methods/properties list (walking the full transitive bases chain, not just direct parents), with zero marker
  distinguishing a copied (inherited) entry from a genuinely locally-declared one. Confirmed against pdf/cpp''s real
  PopupAnnotation -> Annotation -> BaseParagraph chain (fetched the real popup_annotation.hpp from GitHub at the
  pinned commit): PopupAnnotation''s real header declares exactly 5 members, but the extracted fixture''s
  PopupAnnotation entry also carries every one of Annotation''s ~30 methods and every one of BaseParagraph''s ~15
  methods - including BaseParagraph''s own constructor and destructor, which PopupAnnotation obviously never
  declares. Each copied method''s own file/line metadata is individually accurate (correctly pointing at the real
  ancestor''s file, never claiming to be declared in popup_annotation.hpp), but src/foss_mcp/indexing/chunk_builder.py''s
  _format_type_text/_method_line/_property_line render every entry in a flat "Methods:"/"Properties:" list with no
  file/line/provenance shown at all - so a caller (or an agent reading get_symbol/list_members/search_docs output)
  cannot tell a genuinely own-declared member from an inherited one. This is not fabrication like the audit''s C1
  (the capability is real: a PopupAnnotation genuinely can call the inherited GetRectangle) but a silent ownership
  misrepresentation that violates the audit''s own stated invariant: "every served member must either belong to the
  requested type, or be explicitly identified as inherited."'
depends_on:
- TC-241
- TC-238
- TC-092
- TC-255
