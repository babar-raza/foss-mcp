id: TC-834
gate: G3
lane: verification
purpose: >-
  Two tests are red on main (found 2026-11-14 by the TC-817 worker and reproduced by the
  supervisor at HEAD 8d75b533) and must be explained, not just re-pinned, because both concern the
  reported `LONGQ-001` sentence: (1)
  tests/mcp/tools/test_search_docs_partial_tier.py::test_longq_001_literal_query_still_a_miss_from_search_docs_alone
  and (2)
  tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py::test_longq_001_real_weighted_coverage_through_the_real_wired_search_docs
  (pinned weighted coverage 0.29841659976076695 but the real value is now 0.2913575860194603;
  pre_card coverage 0.3333 still matches). Something that changed the committed pdf/net doc corpus
  or the doc-scope term weights since those pins were written (candidates: TC-786..788 sidecar
  re-fetches adding readme_document, TC-790 truncation, the README/furnished-page content of
  pdf/net, TC-651/TC-677 doc counts, doc df changes) moved the numbers. FIRST bisect: run both
  tests at successive commits of main (git worktree in a temp dir OUTSIDE the repo, python from
  the main venv with PYTHONPATH to that worktree's src; `git log --oneline --
  infra/demo-manifests/pdf__net__self_extracted tests/fixtures/furnished/pdf_net
  src/foss_mcp/mcp/tools/search_docs.py src/foss_mcp/mcp/tools/relevance.py` gives the candidate
  commits) to find the first commit where each started failing and WHY (which chunk/term/df
  changed). Then decide with evidence: (a) if the change is a legitimate data/weight evolution
  that does not alter the LONGQ-001 behaviour contract (a long sentence must still return the
  install/quick-start chunk via the documented route, `unmatched_terms` shown, labelled partial -
  read the tests, docs/DECISION_LOG.md LONGQ entries and
  tests/conformance/test_sentence_wrapped_retrieval.py for the contract), re-pin the numbers with
  a comment naming the commit that moved them; (b) if the behaviour contract is actually violated
  now (e.g. `search_docs` alone now answers where the test says it must miss, or the answer lost
  its install chunk), do NOT re-pin: report it as a real regression with the first-bad commit and
  stop - the supervisor will card the fix. Never loosen a ratchet or weaken an assertion.
depends_on:
  - TC-627
  - TC-630
  - TC-626
  - TC-671
write_paths:
  - tests/mcp/tools/test_search_docs_partial_tier.py
  - tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py
satisfies:
  - REQ-G3-011
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: both test files around the failing tests, src/foss_mcp/mcp/tools/search_docs.py
    (partial tier, `search_docs` miss/partial result), src/foss_mcp/mcp/tools/relevance.py
    (doc-scope weights, DOC_SCOPE_WEIGHTS flag),
    tests/conformance/test_sentence_wrapped_retrieval.py (LONGQ literal), and the LONGQ-001 entries
    in docs/DECISION_LOG.md (grep LONGQ).
  - >-
    The two failing tests currently print: (1) a miss expected from search_docs alone; (2) assert
    0.2913575860194603 == 0.29841659976076695. Reproduce both first on main with `{python} -m pytest
    <test id> -q -p no:cacheprovider` (PowerShell after scripts/toolchain/activate.ps1) and record
    the exact output.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies it). Run ruff
    format and ruff check on changed files, then the card check twice. If you stop with a
    real-regression finding, make NO commit and put the first-bad commit, the evidence and the
    proposed fix direction in your final report. Do NOT use git stash.
actions:
  - >-
    Bisect the two LONGQ-001 test failures, then either re-pin with a documented cause or report a
    real regression.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_search_docs_partial_tier.py tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 1800
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 70
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['tests/mcp/tools/test_search_docs_partial_tier.py', 'tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-834/receipt.json
closeout:
  - >-
    Both LONGQ-001 tests pass against the committed data with a documented cause for the moved
    numbers, or a real regression is on record.
recovery: Re-run from a clean tree.
