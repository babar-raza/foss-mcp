id: TC-197
gate: G2
lane: verification
purpose: 'Prove that each POC pilot works through the whole MCP surface, in realistic workflows, not only one
  search. The earlier live POC check called search_symbols once per pilot. That shows a symbol exists. It does not
  show that lookup, symbol detail, members, documentation, examples, install guidance, freshness, scope isolation and
  honest misses work. This card adds a workflow proof script that runs every MCP tool a real user would call, against
  a live serving endpoint for one pilot, and checks each answer against that pilot''s own fixtures, not against values
  chosen by hand. It fails loudly on any tool that returns nothing, returns another pilot''s scope, or answers a
  symbol that does not exist.'
depends_on:
- TC-195
- TC-196
write_paths:
- scripts/poc/pilot_workflow_proof.py
- tests/poc/test_pilot_workflow_proof.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read the MCP client code in tests/e2e/test_cells_rust_live_content.py, the class _McpSession, and reuse its
  protocol steps: initialize, notifications/initialized, then tools/list and tools/call as JSON-RPC over HTTP at
  /mcp. Do not write a second client. If you need a small change to make the client importable, say so in your report
  and do not change the e2e file.'
- 'Read tools/list from a live serving endpoint, the nine tools, and their input schemas, so that every call uses the
  real argument names. Do not guess argument names.'
- 'The script takes --pilot NAME, --url BASE_URL and --fixtures DIR. It reads the pilot''s api_surface.json, and its
  furnished page if one exists, from the fixtures directory named for the pilot (for example pdf_net, slides_python,
  pdf_typescript, pdf_go, pdf_java, cells_rust). It runs these checks, in this order, and records each result as
  pass or fail with the evidence:
  1 initialize returns a protocol version and a server name, and tools/list returns the nine tools.
  2 search_symbols for a real symbol from the fixture returns an exact match whose final FQN segment equals the symbol,
    and every result carries this pilot''s family and platform scope.
  3 lookup for that same symbol resolves to the same FQN.
  4 get_symbol for that FQN returns its kind, and for an enum or a class with members, list_members returns at least one.
  5 search_docs for a phrase taken from the furnished page''s title returns a non-empty answer that is about this pilot,
    when the pilot has a furnished page. A pilot without one is recorded as not applicable, not as a pass.
  6 find_examples for that symbol returns a result or an honest "no verified example" answer. Record which one. A
    result with no example text is a fail.
  7 get_product_reference for this pilot returns non-empty product information.
  8 report_index_freshness returns this pilot''s current generation id, the same id that search_symbols reported.
  9 list_recent_changes returns a well-formed answer, empty or not, and the answer is a list.
  10 an absent symbol, one that is certainly not in the fixture, returns an honest miss, not a fuzzy match from another
    scope. Any result with a non-empty match is a fail.
  11 a symbol that belongs to another pilot''s fixture, searched through this pilot''s endpoint, returns no exact match.'
- 'The script writes one JSON report, with each check, its status, and its evidence, to the path given by --report. It
  exits 0 only when every applicable check passes. It must never skip a check silently. A check that cannot run is a
  fail with the reason.'
- 'Add tests/poc/test_pilot_workflow_proof.py as a new file, offline. It drives the same checks through a fake client
  that returns scripted answers, so no network is needed. Test 1: the exact-match rule accepts a result whose final
  segment equals the symbol and rejects a fuzzy one. Test 2: a scope mismatch in a result is a fail. Test 3: an absent
  symbol that returns a match is a fail. Test 4: a pilot with no furnished page is recorded as not applicable for check
  5, not as a pass. Test 5: the report is written and the exit code is 0 only when every applicable check passes.'
- 'Keep every existing test. Do not change the e2e suite or any chart file.'
actions:
- Read the e2e client, the fixtures layout, and the tools/list schema from a live endpoint.
- Write the script and the offline test file.
- Run the offline tests and report the exact counts.
checks:
- command: '{python} -m pytest tests/poc/test_pilot_workflow_proof.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 5
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('scripts/poc/pilot_workflow_proof.py');s=p.read_text(encoding='utf-8');p.write_text(s.replace('def is_exact_hit(','def is_exact_hit_off(',1),encoding='utf-8')"
  rationale: 'Renames the exact-match rule, so the call sites raise NameError. Test 1 then fails, because the exact-match
    rule is what it checks. Tests 2 to 5 depend on the same rule through the report, and fail the same way. The
    replace is limited to the first match, which is the definition. Built with plain text, since it has no quote or
    backslash.'
evidence:
- evidence/build/G2/TC-197/receipt.json
closeout:
- Each of the six pilots passes every applicable MCP check on a live endpoint, with the evidence in the report.
- A pilot that fails any check is reported with the exact failing check and its evidence.
recovery: Re-run from a clean tree.
