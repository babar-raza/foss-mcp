      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST: `OQ-028` in `ops/open_questions.jsonl` in full, then the real current content of
    `config/known_defects/cells__net.yaml`, `cells__java.yaml`, `cells__python.yaml` (confirm the
    bare `Workbook` ref really sits there today, alongside TC-660's own already-correct
    additions), then `tests/indexing/test_known_defects_data_cells.py`'s synthetic test for
    `CELLS-JAVA-001`.
  - >-
    Verify each of the three real namespace-qualified FQN strings yourself before writing them -
    OQ-028 already names them, but confirm directly against the real generation/lexical-index
    content (or a real test-harness call) rather than copying blind.
  - >-
    Write at least 6 new tests in `tests/mcp/tools/test_known_defects_refs_population.py` (one
    `get_symbol` and one `search_symbols` test per pilot), proving the real namespace-qualified
    FQN query now surfaces the right defect id through the real server wrapper against the real
    `infra/demo-manifests` data - the same pattern this file's own Group A tests already use for
    `SaveOptions`/`Cell`. These are the tests that actually prove OQ-028 is closed; the existing
    bare-`Workbook` path was never tested against real data before and should NOT be asserted to
    still "work", since it never did.
  - >-
    Fix `test_get_symbol_end_to_end_surfaces_the_real_written_java_workbook_save_defect`'s
    synthetic store and assertions to use the real namespace-qualified FQN, confirming the
    existing single-ref regression-shape test (one `get_symbol` call, one defect, no
    cross-match) still holds under the corrected data.
actions:
  - >-
    Correct three pre-existing known_defects refs (CELLS-NET-002, CELLS-JAVA-001, CELLS-PY-005)
    from a bare "Workbook" that has never matched any real symbol to each pilot's real
    namespace-qualified FQN - closing OQ-028, the same bug class TC-660 already fixed for
    cells/go.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_known_defects_refs_population.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-015
  - command: '{python} -m pytest tests/indexing/test_known_defects_data_cells.py tests/indexing/test_known_defects_completeness.py tests/mcp/tools/test_known_defects_in_get_symbol.py tests/mcp/tools/test_known_defects_in_search_symbols.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-015
min_tests: 6
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/known_defects/cells__java.yaml'); s = p.read_text(encoding='utf-8'); marker = 'org.aspose.cells_foss.Workbook'; assert marker in s, 'the corrected qualified FQN literal was not found exactly as expected in cells__java.yaml - if your real fix spells it differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(marker, 'NeverMatchesAnything.Workbook', 1); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Breaks the one real fix this card makes for cells/java - the corrected qualified FQN no
    longer matches the real symbol - so any test proving get_symbol/search_symbols now surfaces
    CELLS-JAVA-001 via the qualified Workbook FQN must fail. Tests scoped only to cells/net or
    cells/python are unaffected by this specific mutation; if your real fix does not quote the
    FQN this way in YAML, anchor your own mutate on your own real literal instead and say so in
    your closeout.
evidence:
  - evidence/build/G3/TC-668/receipt.json
closeout:
  - >-
    CELLS-NET-002, CELLS-JAVA-001, and CELLS-PY-005 now disclose through their real
    namespace-qualified Workbook FQN, which is what the real baked data actually carries - closing
    OQ-028. The bare "Workbook" ref, which never matched anything, is gone.
recovery: Re-run from a clean tree.
