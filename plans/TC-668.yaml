id: TC-668
gate: G3
lane: storage-retrieval
purpose: >-
  Closes `OQ-028` (`ops/open_questions.jsonl`): TC-660's own worker found, while live-verifying the
  refs it was adding, that `CELLS-NET-002`, `CELLS-JAVA-001`, and `CELLS-PY-005`'s PRE-EXISTING,
  unmodified `Workbook` ref has never actually matched any real symbol in the real
  `infra/demo-manifests` data either - the real baked FQN is namespace-qualified in all three
  pilots (confirmed live by that worker): `Aspose.Cells_FOSS.Workbook` (cells/net),
  `org.aspose.cells_foss.Workbook` (cells/java), `aspose.cells_foss.workbook.Workbook`
  (cells/python) - never the bare `Workbook` the registry carries today. This is the exact same
  bug class as `CELLS-GO-001`/`CELLS-GO-011`, which TC-660 already found and corrected for
  cells/go. Confirm each of the three real FQN strings yourself (read the real, current
  `infra/demo-manifests` lexical-index/generation content for each pilot, or make a real
  `get_symbol`/`search_symbols` call through the test harness) before writing anything - OQ-028's
  own text already gives you the answer, but a wrong FQN string here is strictly worse than
  leaving the bug alone, since it would look fixed while still matching nothing.

  Read `OQ-028` in `ops/open_questions.jsonl` in full before starting. This is a correction of
  wrong data, not an addition: replace each entry's bare `Workbook` with the real
  namespace-qualified form, in the same position in the `refs` array (do not remove or reorder
  the other refs TC-660 already added - `Aspose.Cells_FOSS.SaveOptions`,
  `org.aspose.cells_foss.SaveOptions`, `aspose.cells_foss.cell.Cell` - those are already correct
  and already proven by TC-660's own tests).

  `tests/indexing/test_known_defects_data_cells.py`'s
  `test_get_symbol_end_to_end_surfaces_the_real_written_java_workbook_save_defect` builds a
  SYNTHETIC in-memory symbol store whose own FQN is the bare string `"Workbook"` (not the real
  namespace-qualified form) - confirm this yourself by reading the test - which means this test
  has been passing by accidentally matching the OLD, WRONG ref, not by testing real behavior.
  Update the synthetic store's FQN and the test's own assertions to the real namespace-qualified
  form (`org.aspose.cells_foss.Workbook`), so the test proves the real fix rather than continuing
  to validate the bug it never should have had.
