id: TC-605
gate: G3
lane: storage-retrieval
purpose: >-
  Build F5 (REQ-G3-010): the sentence-wrapped retrieval conformance invariant - the direct,
  permanent regression test for the originally reported bug (LONGQ-001: a 20-word natural-language
  `lookup` query on pdf/net returns "nothing matches"). Wraps real doc headings and example titles in
  conversational sentence frames and measures how often the real chunk is still returned, confident
  or labelled partial. Root cause already confirmed (do not re-derive): the real pdf/net
  "Installation, Dependencies, and Quick Start" chunk holds only 3 of LONGQ-001's 7 distinctive query
  terms (coverage 0.43), failing the WHOLE-CHUNK `guarded_coverage()` gate at 0.6 - not the 10-line
  passage window. Most sentence-frame cases are expected to FAIL today; Q1-Q10 (later cards) fix the
  mechanism, this card only measures and pins today's real baseline, including the literal LONGQ-001
  sentence. Read C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1, 1.4 and 2.1 (F5)
  first.
depends_on:
  - TC-001
  - TC-598
write_paths:
  - tests/conformance/test_sentence_wrapped_retrieval.py
  - tests/fixtures/conformance/baseline_sentence_wrapped_retrieval.json
satisfies:
  - REQ-G3-010
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-10-30 — Round-2 portfolio audit remediation adopted: unified plan, governance decisions A-K
      recorded (supervisor)
    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST: C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1 (M1), 1.4
    (corrections) and 2.1 (F5). THE LITERAL REPORTED QUERY, to pin exactly, verbatim, as one of this
    card's own test cases against the real pdf/net pilot: "how do I install and reference the
    Aspose.PDF FOSS library in my .NET project so I can start converting files". Do not paraphrase it.
    Expected result TODAY (confirm by actually running it, do not assume): `lookup(store,
    Scope(family="pdf", platform="net", source_kind="self_extracted"), &lt;that exact string&gt;)` is a
    Miss against the real `infra/demo-manifests/pdf__net__self_extracted` generation.
  - >-
    READ `tests/conformance/corpus.py` and `baseline.py` in full first - reuse their real API exactly
    (`load_demo_manifests_corpus`, `ConformancePilot.doc_chunks()`/`example_chunks()`,
    `load_baseline`, `assert_no_new_failures`, `sample_pilots`/`sample_items` if present,
    `exhaustive_enabled()`), do not reinvent any part of it.
  - >-
    For each of the 32 real pilots, extract a handful of real doc-chunk headings and example titles
    (parse the `FQN: Doc: &lt;title&gt;` / `FQN: Example: &lt;title&gt;` line the same way the product code
    itself does - find and reuse the real extraction function rather than writing a second regex;
    `get_symbol.py`/`find_examples.py` likely already have one). For each extracted title, generate 12
    conversational sentence frames of 12-35 words each, wrapping the title's own real distinctive
    words in natural filler (product name, platform word, "how do I", "I need to", "can you show me",
    "what is the way to", etc. - vary the filler across the 12 frames, do not just repeat one
    template). Write these 12 frame templates as named, documented constants in the test file itself
    (not generated algorithmically from nothing - they should read as genuinely natural sentences a
    real user might type, since that is what this invariant exists to protect). Include at least one
    frame per title that is a genuinely long, multi-clause sentence in the LONGQ-001 style (not just a
    short 12-word one) so the invariant actually exercises the long-query failure mode, not only short
    ones.
  - >-
    Also generate a small set of DELIBERATE NONSENSE sentence frames (same length range, same
    conversational style, but built from words that do not appear in that pilot's real corpus at all -
    reuse this plan's existing `test_nonsense_queries_miss.py` nonsense-word list or build a similarly
    absent vocabulary) to measure the precision side: these must ALWAYS miss, today and after any
    future fix - record any case where a nonsense sentence incorrectly returns a confident hit as a
    FAILURE in the same baseline (this sub-case should mostly PASS today; if it already fails anywhere,
    that is itself a notable finding to record honestly, not to explain away).
  - >-
    Default run: seeded sample of 2-3 titles per pilot x the 12 frames (so roughly 60-100 real-sentence
    cases, plus a handful of nonsense cases) - keep this test file's default run under about 3 minutes.
    Gate a full sweep (every title x all 12 frames x all 32 pilots) behind `exhaustive_enabled()`.
    Record each case as PASS (the real chunk is in the top 10 of `lookup`'s or `search_docs`'s answer,
    confident or - once Q7/Q8 land in a LATER card - labelled `match_quality="partial"`; today, before
    those cards land, only a confident hit counts as PASS) or a named FAILURE
    (`f"sentence-wrapped:{pilot}:{frame_index}:{title}"`), via
    `assert_no_new_failures(load_baseline(...), observed_failures)` exactly as the other F-cards do.
  - >-
    The LONGQ-001 literal case gets its OWN dedicated, always-run (never sampled out, never gated by
    `exhaustive_enabled()`) test function, separate from the generic sentence-frame sweep - this is the
    one case this whole card exists to protect going forward, and it must always execute in the fast
    default run. Pin it as a currently-failing baseline entry today (confirm it really is a Miss by
    running it for real, do not assume); this single entry flipping to PASS, with the baseline then
    tightened to `strict: true` by Q17 (a much later closure card), is the literal, permanent proof the
    original bug is fixed - name this explicitly in your closeout.
actions:
  - >-
    Wrap real doc/example titles from all 32 pilots in 12 natural conversational sentence frames,
    measure how often lookup/search_docs still finds the real chunk, and pin today's real baseline -
    including the literal LONGQ-001 sentence as its own always-run, never-sampled case - for Q1-Q10 to
    improve against.
checks:
  - command: '{python} -m pytest tests/conformance/test_sentence_wrapped_retrieval.py -q -rfE'
    expect: 'exit 0'
    timeout_seconds: 240
    junitxml: true
    proves:
      - REQ-G3-010
  - command: '{python} -m pytest tests/conformance/test_sentence_wrapped_retrieval.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 240
    junitxml: true
    proves:
      - REQ-G3-010
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib, json; p = pathlib.Path('tests/fixtures/conformance/baseline_sentence_wrapped_retrieval.json'); d = json.loads(p.read_text(encoding='utf-8')); assert d.get('known_failures'), 'fix text not found - the real baseline has no known_failures to empty, card and source have diverged'; p.write_text(json.dumps({'strict': d.get('strict', False), 'known_failures': []}, indent=2) + chr(10), encoding='utf-8')"
  rationale: >-
    Rewrites the committed baseline to an empty known_failures list, so every real measured sentence-
    wrapped failure (including, if it is still failing today as expected, the LONGQ-001 case itself)
    becomes "new" and unexpected. The check must then fail, proving the baseline file is actually
    consulted and this is not a vacuous always-pass test.
evidence:
  - evidence/build/G3/TC-605/receipt.json
closeout:
  - >-
    A real, measured baseline of today's sentence-wrapped retrieval behaviour exists across all 32
    pilots, with the literal LONGQ-001 query pinned as its own dedicated, always-run case (state
    plainly whether it is confirmed failing today, matching the original bug report) - the honest
    starting line Q1-Q10 must improve against, and the single fact (does LONGQ-001 pass yet) that
    proves the original bug is eventually fixed.
recovery: >-
  If the negative-control mutate script's JSON assumption does not match your real baseline file's
  actual shape, write a simpler, reliable one yourself in the same chr()/json-based style used
  elsewhere in this plan and report the substitution in your closeout - do not leave a broken
  falsifier in place.
