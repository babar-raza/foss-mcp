id: TC-802
gate: G3
lane: storage-retrieval
purpose: >-
  XA3a - stamped verification level and a truthful served label. Measured 2026-11-14: (1) 119 of
  280 served verified examples (all 99 python and 20 cpp) were run to exit 0 by their verifier but
  carry no `Runtime-Status`, so `find_examples` serves 'compiled only (run not verified)' - safe
  but untrue; (2) `build_chunks` publishes `compiled and not rejected and (verified or provenance
  != "authored")`, so a README example whose run FAILED is still `Kind: verified_example` (4
  chunks: 3d/java 2, 3d/net 1, pdf/cpp 1; labels honest, ranked last); (3) a README fence
  containing a truncation placeholder literal (`iVBORw0KGgo...`) is published (RD2-284). Build:
  (a) `VerificationResult.level` set by each verifier from facts it already has (python
  `ran-exit0`; cpp run-mode `ran-exit0`; cpp compile-mode / go / rust `built`; typescript
  `type-checked`; java/dotnet `ran-produced-output` or `ran-exit0` from the existing
  RuntimeRecord) - vocabulary: syntax-only < type-checked < built < ran-exit0 <
  ran-produced-output < artifact-validated; (b) chunk lines `Verification-Level:` and
  `Verified-With:` (the toolchain id already computed by `toolchain_id()`); (c)
  `find_examples.runtime_label` derives its sentence from the level, keeping today's text only as
  the legacy-chunk fallback; (d) a README candidate whose run failed or produced nothing is NOT
  published as `verified_example` (kept in the verification report); (e) `example_candidates`
  rejects a README fence whose string literal contains a truncation placeholder. HARD CONSTRAINT:
  do NOT change `counts_as_verified` - 17 of 75 README python examples print nothing and would
  vanish if the level changed it (a 'no pilot gets worse' regression).
depends_on:
  - TC-801
  - TC-797
  - TC-795
  - TC-688
  - TC-502
  - TC-552
  - TC-565
  - TC-458
  - TC-460
  - TC-561
  - TC-551
  - TC-553
write_paths:
  - src/foss_mcp/indexing/example_verifier.py
  - infra/build_chunks.py
  - src/foss_mcp/mcp/tools/find_examples.py
  - src/foss_mcp/indexing/example_candidates.py
  - tests/indexing/test_example_verification_level.py
  - tests/mcp/tools/test_find_examples_verification_level_label.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    Evidence for the ledger rows this card closes was gathered by a read-only 2026-11-14 triage:
    per-row record (id, pilot, evidence, proposed fix) in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\all_triage.json
    (JSON list; filter by `id`, e.g. RD2-190). It is a LEAD, not truth: REPRODUCE everything
    yourself first; if something no longer reproduces, say so and do not invent a fix.
  - >-
    The measured design record for this stage is in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\decision.md
    (section 2 for your stage, section 3 for the card breakdown; per-pilot corpus table in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\per_pilot_table.md).
    Its numbers were measured on 2026-11-14 - re-measure what you rely on. Where the record and the
    code disagree, the code wins; say so in your report.
  - >-
    READ FIRST: VerificationResult / RuntimeRecord / counts_as_verified / toolchain_id in
    example_verifier.py; the publish condition in infra/build_chunks.py (`compiled and not rejected
    and (verified or provenance != "authored")`); `runtime_label` and `is_verified_example_text` in
    find_examples.py; example_candidates.py;
    tests/mcp/tools/test_find_examples_verification_record.py (25), test_round3_example_labels.py
    (20), test_find_examples_verified_only.py (78),
    tests/indexing/test_round3_example_runtime_truth.py (57),
    tests/deploy/test_verified_examples_coverage.py (124) and
    tests/conformance/test_example_integrity.py + baseline_example_integrity.json (read only).
  - >-
    REPRODUCE FIRST: (1) a python example chunk and a cpp run-mode chunk from the committed corpus
    render 'compiled only (run not verified)' through find_examples; (2) the 4 failed/no-output
    chunks are `Kind: verified_example` (list them); (3) the placeholder literal case (words/python
    'Load Markdown From In-Memory Content (2)'). Record the numbers.
  - >-
    BUILD as in the purpose. Old chunks (no `Verification-Level:` line) MUST keep rendering exactly
    as today (legacy fallback), because the committed generations are not regenerated by this card.
    A failed/no-output README candidate must be excluded from publication; authored examples keep
    their current behavior unless their own run failed. Keep every pre-existing label test green
    (change an assertion only if it pinned the 'compiled only' text for an example the verifier
    demonstrably ran, and say so).
  - >-
    TESTS: tests/indexing/test_example_verification_level.py - a per-platform table asserting the
    exact level each verifier returns (python/cpp-run `ran-exit0`, go/rust/cpp-compile `built`, ts
    `type-checked`, java/dotnet from the RuntimeRecord); `counts_as_verified` unchanged for the
    17-example no-print case; a failed README candidate is not published; the placeholder-literal
    rejection. tests/mcp/tools/test_find_examples_verification_level_label.py - labels derived from
    the level, legacy chunk fallback unchanged.
  - >-
    Do NOT regenerate or touch anything under infra/demo-manifests/ or
    tests/fixtures/verified_examples/ - a single coordinated regeneration of all pilots happens in a
    later card; this card changes code and tests only. Chunk text produced by the new code will
    therefore differ from the committed generations - tests must exercise the code path directly,
    never rely on the committed generations being regenerated.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies that commit's
    production-code part). Before committing run `ruff format` and `ruff check` on changed Python
    files, then run the card's check command twice and report the real results. Keep every
    pre-existing test unchanged unless a test pinned the now-corrected behavior as 'correct' - then
    change only that assertion and say so.
actions:
  - >-
    Stamp every verified example with the level its verifier actually achieved, derive the served
    label from it, stop publishing failed README candidates as verified, and reject
    placeholder-literal fences - without changing what counts as verified.
checks:
  - command: '{python} -m pytest tests/indexing/test_example_verification_level.py tests/mcp/tools/test_find_examples_verification_level_label.py tests/indexing/test_example_verifier.py tests/indexing/test_example_verifier_classification.py tests/indexing/test_example_verifier_toolchain.py tests/indexing/test_round3_example_runtime_truth.py tests/indexing/test_example_candidates.py tests/indexing/test_example_candidates_supply.py tests/mcp/tools/test_find_examples_verification_record.py tests/mcp/tools/test_round3_example_labels.py tests/mcp/tools/test_find_examples_verified_only.py tests/infra/test_build_chunks_verification_cache.py tests/conformance/test_example_integrity.py tests/deploy/test_verified_examples_coverage.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 2400
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 615
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/indexing/example_verifier.py', 'infra/build_chunks.py', 'src/foss_mcp/mcp/tools/find_examples.py', 'src/foss_mcp/indexing/example_candidates.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-802/receipt.json
closeout:
  - >-
    Served examples state the verification level their verifier achieved (python and cpp runs no
    longer mislabelled), failed README candidates are never published as verified,
    placeholder-literal fences are rejected; legacy chunks render unchanged until the coordinated
    regeneration.
recovery: Re-run from a clean tree.
