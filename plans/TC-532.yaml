negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/python_surface.py');s=p.read_text(encoding='utf-8');q=chr(34);old='_ENUM_AUTO_CALLS = ('+q+'auto'+q+', '+q+'enum.auto'+q+')';assert s.count(old)==1;p.write_text(s.replace(old,'_ENUM_AUTO_CALLS = ('+q+'__never__'+q+',)'),encoding='utf-8')"
  rationale: >-
    Removes `auto` from the mandated set of calls that count as an enum member value, so `class E(Enum): A = auto()` yields no members again (the barcode QrEncodeMode defect): the synthetic-source enum
    test and the regenerated-barcode fixture test (QrEncodeMode must list AUTO, NUMERIC, ALPHANUMERIC, BYTE, KANJI) fail at once.
evidence:
- evidence/build/G3/TC-532/receipt.json
closeout:
- >-
  The eleven Python fixtures are regenerated with the current extractor (extractor_version 5), keyword-only/default/static marks, enum members built with auto(), dataclass constructors, shadowed and duplicate
  definitions, private-base inheritance and factory properties are served faithfully, the 3d option-class conflict is explicit, and the tests prove each from an independent oracle. Nothing a peer sees changes
  until the supervisor re-ingests.
recovery: Re-run from a clean tree.
