id: TC-532
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-05, RST-01 python part, RST-03 = ISOPROV-01 coverage part, AGT-05, AGT-07 python
  part, RST-15 shells). RE-EXTRACT THE TWELVE PYTHON FIXTURES. Measured by the reviewers: parameter defaults are dropped everywhere (upstream
  defaulted parameters cells/python 420, pdf/python 1235, jmap/python 8, rendered 0), keyword-only parameters lose their `*` marker so positional
  calls would raise TypeError, `@staticmethod` and `@classmethod` are marked on none (0 of 51, 45, 45), the eight pdf/python facades (PdfFileSecurity,
  PdfBookmarkEditor, PdfAnnotationEditor, PdfPageEditor, PdfFileInfo, PdfFileStamp, PdfXmpMetadata, PdfConverter) lose their own methods
  (`encrypt_file`, `decrypt_file` and `change_password` of PdfFileSecurity are absent), pdf/python, slides/python, 3d/python, words/python and
  html/python are cut at 300 types (pdf/python 300 of 867, README recall 87 percent, PdfFileEditor missing), and tex/python indexes only 4 exception
  classes because 35 of the 45 files of its package do not parse (IndentationError) while the freshness report said 4 of 4 types with no note. A
  prototype extraction on 2026-10-15 with the unmerged extractor at the pin and no cap kept 867 of 867 pdf_python types (including
  aspose_pdf.facades.PdfFileEditor with 13 methods and aspose_pdf.facades.PdfFileSecurity with 11) and 1023 of 1023 slides_python types, and left 11
  of 354 pdf_python README identifiers unresolved (96.9 percent). This card regenerates 3d_python, barcode_python, cells_python, email_python,
  html_python, jmap_python, note_python, page_python, pdf_python, slides_python, tex_python and words_python at their pinned commits with the merged
  extractor (TC-520 selection and parse-failure record, TC-522 defaults, keyword-only and decorator marks and re-export pairing, TC-528 docstring
  parsing), raises the five capped pilots to their whole surface, empties the stale-checked KNOWN_GAP table that TC-522 created, regenerates the
  allowlist and pins the Python facts at fixture level. What it does NOT change: src/, any furnished page, infra/demo-manifests, sidecars, memory
  limits.
