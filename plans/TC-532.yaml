    ## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md rows RD3-001 to RD3-009 and section 3.1, then python_surface.py, run_extraction.py (`main`, flags --commit, --keep-names-from, --max-types, `EXTRACTOR_VERSION`), chunk_builder.py
  (`_param_text`, `_param_list_text`, `_method_line`, `_format_type_text`) and tests/extraction/test_run_extraction_python.py. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command
  as every python or pytest call; set PYTHONPATH=src. Never print an environment value. Verify every name against the merged code and list differences in your report. Run ruff format and ruff check on every
  Python file you change. Do not edit plans/, project/, ops/, evidence/, schemas/ or docs/; no docker or cluster command. Source truth wins over fixtures: every new test takes its expectation from an INDEPENDENT
  oracle (a hand-written Python source whose answer follows from the language rules, or the upstream facts quoted below), never from the extractor's own output.
- >-
  THE EXTRACTOR AND RENDERER WORK. Mandated names (the negative control and later cards rely on them): in python_surface.py the exact line `_ENUM_AUTO_CALLS = ("auto", "enum.auto")` (calls treated as an
  enum member value; an `auto()` member is recorded with its name and the marker value `auto()`, ordered, and `enum.IntEnum`/`StrEnum`/`Flag` bases count as enums); a function `_is_shadowed_definition(...)`
  or equivalent that makes the LAST definition of a method win (Python semantics) while keeping `@overload` stubs and `@property`/`@x.setter` pairs intact; name binding that follows `__init__` imports in
  source order so that when two classes of the same name are importable under one exported name the LAST import wins for that exported name, the earlier class keeps its own module FQN, and the empty/stub
  exported class is NOT given the other class's members: the exported-name chunk gets a field `Shadows` and the real class chunk a field `Use-Instead` / `Shadowed-By` rendered by chunk_builder as one line
  each (`Note: this exported name is an empty placeholder at runtime; the working class is <FQN>`); inherited members are collected through underscore-prefixed bases (a private base's public members are
  listed on the public subclass with `(inherited from _Base)`), class-level assignments whose value is a call to a module-level function or a `property(...)` call are recorded as properties (`x = _name_property(...)`,
  `x = property(get_x)`), a `@dataclass` (and `attrs`/`NamedTuple`/`TypedDict` where trivially detectable) gets a synthesised `__init__(field: type = default, ...)` in field order honouring `field(default_factory=...)`,
  `kw_only=True` and `InitVar`, and its fields as properties, an overriding method records its OWN signature, class-level constants and `self.x` assignments in `__init__` with a literal value are recorded
  as properties with their literal. ACCEPTANCE: each item has a synthetic-source test in tests/extraction/tree_sitter_engine/test_python_surface_round3.py (at least 18 tests, hand-written sources, the expected
  answer follows from Python semantics: for example `class E(Enum): A = auto(); B = auto()` yields members A, B in order; a class with two `def f` yields the second; `from .a import X` then `from .b import
  X` binds X to b.X; `class P(_Base)` lists `_Base`'s public methods as inherited; `@dataclass class C: a: int; b: str = 'x'` renders `__init__(a: int, b: str = 'x')`), and renderer tests in tests/indexing/test_chunk_builder_round3_python.py
  (at least 6) for the Shadows/Use-Instead lines and the dataclass constructor. No currently faithful line changes: the existing per-pilot tests, test_python_fidelity.py and the slides/words/html/pdf pins
  stay green.
- >-
  THE RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop).
  Regenerate ALL ELEVEN Python fixtures with the fixed extractor, one pilot per command, from the repository root: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/python.yaml
  tests/fixtures/<family>_python/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_python/pages/_index.md --max-types 100000` where <pin> is `ingestion.pilots[].library.commit`
  of infra/helm/foss-mcp/values.yaml for that pilot (never retype a commit) and <family> is each of: 3d, barcode, cells, email, html, note, page, pdf, slides, tex, words. Each prints `wrote <path> (<bytes>
  bytes); <kept>/<total> types; commit <sha>`: kept must equal total and the commit must equal the pin. The CLI writes CRLF on Windows: normalise to LF so `git diff --stat` shows a content change. Every
  regenerated fixture must carry extractor_version 5 (the current), `symbol_counts`, `counts` and `parse_failures`. Record old and new type, function and member counts and byte sizes in the report. chart
  `maxTypes` and compose `--max-types` stay as they are unless a measured total exceeds 300 (then report: RECOMMENDED_MAX_TYPES and the chart are outside write_paths).
- >-
  INDEPENDENT FACTS to assert on the REGENERATED real fixtures (each was read from the upstream source by the round-3 audit; verify each against the clone at the pin before you rely on it and report any
  that is wrong): barcode: `aspose_barcode_foss.api.generate(symbology, data, *, encode=None, render=None)` has keyword-only `encode` and `render` with default None; QrEncodeMode has AUTO, NUMERIC, ALPHANUMERIC,
  BYTE, KANJI; QrErrorCorrectionLevel has L, M, Q, H; Code128EncodeMode has 7 members. cells: `Workbook.__init__(self, file_path=None, password=None)`, `save(self, file_path, save_format=None, options=None,
  password=None, encryption_params=None)`. email: `Attachment.from_bytes(filename, data, *, mime_type=None, content_id=None)` keyword-only. 3d: `aspose.threed.formats.FbxLoadOptions` is an EMPTY placeholder
  in the package namespace (the real class lives in `aspose.threed.formats.fbx.FbxLoadOptions`); same for Obj, Stl, Gltf load/save options. pdf: `CircleAnnotation` inherits `_ShapeAnnotation` -> `MarkupAnnotation`
  -> `Annotation`, so `Annotation.color` and the markup members are reachable. slides/3d: `TransformBuilder.rotate_degree` is defined twice (lines 16 and 19 of aspose/threed/utilities/TransformBuilder.py);
  the second `(self, rot, order)` wins. html: `TokenizerState(IntEnum)` has about 80 members. tex: `TeXOptions` is a dataclass.
- >-
  RE-PINS AND TABLES (only after the re-extraction): run the first check and keep the failures. Change ONLY the assertions that pin a fact the regeneration legitimately moved, each with the comment `TC-532:
  <old> -> <new>` and listed with its reason in the report; never delete, skip or xfail a test, never loosen a guard. tests/deploy/test_fleet_consistency.py: add STALE_BAKED_PILOTS entries (TC-550 wording:
  `re-extracted by TC-532: the fixture now holds ..., the baked generation still says ... until the supervisor re-ingests`) for exactly the pilots whose `coverage_problems` is non-empty after your regeneration,
  UNRESOLVED_EXCEPTIONS from the regenerated `unresolved` lists (never higher than the old maximum without an extraction-defect report). tests/fixtures/readme_identifier_allowlist.json only with the helper
  (`python -X utf8 -m tests.extraction.docs_identifiers --write`); read `git diff`: only keys of these eleven pilots may change. If a test outside write_paths fails, stop and report its name and the pinned
  fact.
- >-
  TEST COUNTS: min_tests is 440 for EACH check. At the issue revision the first check collects 436 existing tests (test_python_fidelity 7 files listed in the check) plus the at least 24 you add in the two
  new files, and the second check collects well over 2,500.
