gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 and REQ-G3-008 (Round-3 rows RD3-001 to RD3-009; the earlier pre-production rows RST-05, RST-01 Python part, AGT-07 Python part, AGT-05). PYTHON EXTRACTION FIDELITY FOR THE ELEVEN PYTHON PILOTS
  (3d, barcode, cells, email, html, note, page, pdf, slides, tex, words; the jmap family no longer exists). The round-3 differential (own oracle: the real packages imported, inspect and ast over the defining
  files) found: (1) barcode, cells, email, note and page still serve fixtures from the OLD extractor (no extractor_version, no param_details): defaults, the keyword-only `*` marker and static/classmethod
  marks are lost (barcode 26 of 27 sampled methods lost defaults and 34 the `*`; cells 177 of 1,342 defaults and 53 static marks; email 51 of 239 and 40 classmethod marks; note 48 of 145; page 66 of 923
  and 24 static); an MCP-literal call `generate("code128","HELLO123",None,None)` raises TypeError. The current extractor already renders these for 3d, html, pdf, slides, words (0 loss), so the fix for these
  five is a re-extraction. (2) Enum members built with `auto()` are dropped (barcode: 8 enums, 36 members, e.g. QrEncodeMode AUTO, NUMERIC, ALPHANUMERIC, BYTE, KANJI; html TokenizerState: 80). (3) 3d/python:
  seven load/save option classes (Fbx/Obj/Stl/Gltf Load/Save options) exist twice in the package (the real class in the format submodule and an empty placeholder re-imported LAST by the package __init__,
  so the exported name binds to the empty class: `FbxLoadOptions(fmt)` raises TypeError); the extractor merges them and serves members and a constructor for the empty exported name. (4) A method defined
  twice in a class body is served with the shadowed first definition (3d 41 members, slides 75; `remove_property(property=...)` fails). (5) pdf/python annotation classes are empty or partial: the underscore-prefixed
  base (`_ShapeAnnotation`) is not followed (18 classes, 877 inherited members missing) and factory-built properties (`icon = _name_property(...)`, `property(getter)`: 58 plus `Matrix4.identity`) are invisible;
  8 re-exported pdf types and about 10 slides alias types carry no members. (6) Dataclass `__init__` is not synthesised and class-level and instance attributes are absent (page, tex, email, barcode: `ImageSaveOptions(...)`
  fails on a required `format` the MCP never shows). (7) An overriding method shows the base signature (pdf 18, slides 85). Verified faithful today and to be preserved: slides, words, html, pdf signatures,
  `__init__`, enum values, property/method distinction, bases, the chunk round trip of annotations, the tex repair (TC-555).
