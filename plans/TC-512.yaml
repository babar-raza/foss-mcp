id: TC-512
gate: G3
lane: transport-deployment
purpose: >-
  REQ-G3-008 (independent pre-production review, findings GRR-02 gate part, GRR-11, FK8S-05 init part, FK8S-08, FK8S-09). CHART LIFECYCLE AND
  HARDENING. Measured on the live kind cluster (40 pilot releases) and by rendering the chart: (1) the serving pod's init container
  `wait-for-product-reference-and-recent-releases` (infra/helm/foss-mcp/templates/deployment.yaml) loops `until [ -f A ] && [ -f B ]` with no
  timeout, tests only that the files EXIST (an empty or truncated file passes), and has no resources block; the reviewer reproduced a failed
  product-reference fetch leaving a pod in Init:0/1 forever while its Job was Complete (the gate exited 124). TC-511 removes the usual cause (a
  failed fetch now leaves a typed placeholder file); this card bounds the gate for every other cause. (2) The ingestion Jobs have no
  `activeDeadlineSeconds` and no `ttlSecondsAfterFinished` (41 completed Jobs were still retained a day later), (3) the serving Deployment has no
  startupProbe, (4) the manifests PVC has no `helm.sh/resource-policy: keep`, so `helm uninstall` deletes the only copy of a published
  generation, (5) no pod sets `seccompProfile`, `runAsGroup`, `automountServiceAccountToken: false` or `enableServiceLinks: false` (81 pods mount a
  service-account token they never use and carry about 280 service-link environment variables; serving reads only FOSS_MCP_* variables, and no code
  under infra/ or src/ reads KUBERNETES_* or *_SERVICE_HOST), (6) the pdf/cpp ingestion Job was OOMKilled at the 4Gi default (it has no
  `ingestionMemoryLimit`, the per-pilot key TC-457 added for html/python, page/python, words/net at 8Gi and slides/cpp at 10Gi), and (7)
  scripts/deploy/install_pilots.py runs `helm upgrade --install --wait`, which does not wait for Jobs: a pilot whose ingestion FAILED while the
  serving pod kept running the previous generation is reported `installed` with stale content (GRR-11). Verified already satisfied and only
  locked by a test here: the gateway egress NetworkPolicy (networkpolicy-gateway-egress.yaml) is rendered only when `embeddingGateway.existingSecret`
  is set, so serving 443 egress is default-deny otherwise (the world-open 443 the reviewer saw on the cluster came from the gateway Secret being
  configured there). DESIGN DECISION, flagged for the supervisor: the brief asked for a 120 s default gate timeout, but serving reads its sidecars
  ONCE at process start (G2/TC-251: a pod that starts before the Job wrote them answers list_recent_changes with a permanently wrong empty list), a
  fresh install's Job (build, example verification, publish, then the sidecar fetches) takes 5 to 40 minutes, and nothing yet re-reads sidecars; a 120 s
  default would therefore reintroduce TC-251 on every fresh install. The default is `initGate.timeoutSeconds: 3900`, which is the Job deadline
  (3600) plus 300 s, so the gate is bounded and a hung or failed Job can no longer hold a pod in Init for ever, while a healthy install is unaffected;
  the value is a chart value, to be lowered to 120 once serving re-reads its sidecars. Behaviour today when a sidecar is missing at start (verified in
  infra/serve_http.py `_serving_product_reference_inputs` / `_serving_recent_releases`): an ABSENT sidecar is tolerated (product reference answers
  NotAvailable, releases answer an empty list); only a PRESENT-but-corrupt one raises. So a gate that times out and exits 0 starts the pod degraded, and
  the honest wording of that degraded state ("fetch failed" versus "not present") is the serving cards' job (TC-507), not this card's. What does NOT
  change: serving code, any ingestion argument (so docker-compose.yml needs no change: the only chart-versus-compose parity test compares the ingest
  command and args, which this card does not touch), the NetworkPolicy templates, image tags and digests, replicas, PodDisruptionBudgets.
depends_on:
- TC-457
- TC-455
- TC-341
- TC-339
- TC-347
- TC-177
- TC-251
- TC-499
- TC-529
write_paths:
