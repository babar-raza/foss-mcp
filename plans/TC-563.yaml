- command: >-
    {python} -m pytest tests/mcp/test_round3_doc_excerpt.py tests/mcp/tools/test_consumer_tools.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
