  - command: '{python} -m pytest tests/indexing/test_chunk_builder_coverage_line.py tests/extraction/test_reextracted_uncapped.py tests/indexing/test_chunk_builder_python_signatures.py tests/mcp/tools/test_coverage_note.py tests/indexing/test_chunk_builder.py tests/indexing/test_symbol_identity.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
