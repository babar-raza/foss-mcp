min_tests: 245
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/indexing/chunk_builder.py'); s = p.read_text(encoding='utf-8'); old = chr(10).join(['    type_count = fixture.get(' + chr(34) + 'type_count' + chr(34) + ')']); assert s.count(old) == 1, 'fix text not found - card and source have diverged'; p.write_text(s.replace(old, '    identities = None  # TC-614 negative control: never use the canonical identities even when given' + chr(10) + old, 1), encoding='utf-8')"
  rationale: >-
    CORRECTED in attempt 2 after a real attempt found the original anchor fragile: `_coverage_line`'s
    3-parameter signature exceeds this repo's pinned ruff line length, so ruff format reflows the
    signature across multiple physical lines - an anchor on the literal `def _coverage_line(` landed
    the inserted line INSIDE the parameter list, producing a SyntaxError/collection error rather than
    a clean logical failure (the predicted outcome still held in spirit, just via a blunter mechanism).
    The new anchor is the first statement of the function BODY (`type_count = fixture.get(...)`, after
    the docstring, immune to signature reflow) and shadows `identities` to `None` immediately before
    it executes, forcing the function to ignore any identities argument it is given, reproducing the
    pre-fix, non-deduplicated numerator unconditionally. The deduplication test, the real slides/python
    regression test, and the 3 corrected-expectation tests (REWORK attempt 2) must then fail, proving
    they exercise the real dedup logic rather than trusting the function signature alone.
evidence:
  - evidence/build/G3/TC-614/receipt.json
closeout:
  - >-
    The API-Coverage numerator is deduplicated via I1's canonical-identity model, fully backward-
    compatible; state the real before/after numbers for slides/python and confirm
    coverage_note_from_text now returns a real caveat for it. State plainly that the denominator
    remains inflated until I3 lands. State the real before/after numbers for each of the 5
    test_reextracted_uncapped.py pilots, the test_chunk_builder_python_signatures.py synthetic case,
    and the test_coverage_note.py tex_python case corrected in REWORK attempt 2.
recovery: >-
  If compute_canonical_identities turns out not to group function entries at all (so every
  function's is_definition is trivially True), confirm this explicitly in your closeout rather than
  assuming it - it changes nothing about the fix's correctness, but the plan needs it documented
  honestly. If coverage_note.py turns out to need a real change after all, STOP and report that
  finding rather than editing a file outside this card's write_paths. If a 4th file beyond the 3
  named in the REWORK note turns out to hardcode a pre-fix number, add it to write_paths and fix it
  the same way, stating this explicitly in your closeout.
