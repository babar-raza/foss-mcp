id: TC-614
gate: G3
lane: storage-retrieval
purpose: >-
  Build I2 (REQ-G3-012): deduplicate the numerator of the `API-Coverage:` line using I1's new
  canonical-identity model (`symbol_identity.compute_canonical_identities`, just landed in
  TC-612), closing the measured slides/python case where 1023 raw entries render as "1022 of 1022
  types" (100%, by construction) even though only 517 are real, distinct canonical types. This
  card fixes the NUMERATOR side only (chunk_builder.py's rendering); the DENOMINATOR
  (`run_extraction.py`'s own `symbol_counts.types` total, also computed by counting raw
  un-deduplicated entries) is I3's separate job, not this card's - after this card alone, a pilot
  with real aliases will honestly show a ratio BELOW 100% for the first time (e.g. roughly "517 of
  1022"), even though 1022 itself is still an inflated denominator until I3 lands; state this
  residual plainly in your closeout, do not try to fix it here.
  `coverage_note.coverage_note_from_text` ALREADY re-parses whatever `chunk_builder._coverage_line`
  renders and ALREADY correctly emits a caveat whenever the parsed numerator is less than the
  parsed denominator - it needs NO code change (confirm this yourself by reading it; it is a
  read-only reference for this card, not a write_path) - it was simply never exercised because the
  numerator was never honestly below the denominator before. Read
  C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1 (M2/C1) and 2.3 (I1-I5) first.

  REWORK (attempt 2): attempt 1 built the real fix correctly (verified by the supervisor's own
  review) but its blast radius extends past the 2 files it was scoped to. `gatectl review`'s own
  wider offline sweep of "files this card touches" found 7 pre-existing tests across 3 OTHER files
  now failing, because they hardcoded the OLD, tautological numbers for pilots that genuinely have
  real aliases - this is the exact, intended consequence of fixing the tautology, not a bug in the
  fix. Attempt 2 widens this card's write_paths to the 3 affected files and REQUIRES correcting
  their hardcoded expectations to the new, honestly-measured numbers (never deleting or weakening
  the assertions - each one still asserts something true and specific, just a different true,
  specific number than before):
  1. `tests/extraction/test_reextracted_uncapped.py::test_coverage_line_states_the_complete_surface`
     is parametrized over 5 pilots (pdf_python, slides_python, html_python, 3d_python, words_python)
     and asserts `_coverage_is_complete(line)` (100%) for each. Measure fresh, per pilot, through the
     real `build_chunks_from_api_surface` call site with the fix applied: a pilot with zero real
     aliased pairs legitimately stays 100%-complete and its assertion is unchanged; a pilot with real
     aliases now honestly reports a partial ratio and its assertion must change to a concrete
     `assert line == "API-Coverage: <real N> of <real M> types; ..."` (or equivalent concrete check),
     never a change to `_coverage_is_complete`'s own definition or threshold. State the real measured
     before/after per pilot in your closeout.
  2. `tests/indexing/test_chunk_builder_python_signatures.py::test_coverage_line_counts_entries_so_it_can_exceed_the_cap`
     currently asserts the literal string `"API-Coverage: 4 of 10 types"` for a fixture built from two
     real shell/definition pairs (`_pair(1)`, `_pair(2)`) with `max_types=2`, `type_count=10`. With the
     fix, two real pairs canonicalize to 2 distinct types, not 4 - measure the real rendered line
     through the actual call site and update the literal to match. If the test's own intent ("counts
     entries so it can exceed the cap") depended on counting raw entries rather than canonical units,
     state plainly in your closeout whether that intent still holds under dedup or whether the test
     needed a second, separate case added (without removing the original assertion's correctness).
  3. `tests/mcp/tools/test_coverage_note.py::test_report_index_freshness_states_the_same_note` hardcodes
     tex_python's old `(21, 21)` (itself a correction from TC-555's `(4, 4)` - keep that comment style,
     append `# TC-614: (21, 21) -> (<real>, 21)`). The supervisor's own review run measured this as
     `(14, 21)` through the real, unmodified `coverage_note_from_text` - confirm this number yourself
     fresh rather than trusting it, since the fixture may have shifted slightly, and update the
     assertion to the real measured pair.
  Do not go looking for a 4th or 5th affected file beyond these 3 plus your attempt-1 files - the
  supervisor's review ran the full offline suite of every file this card's write_paths now cover and
  these were the only failures found. If your own verification surfaces a DIFFERENT file failing for
  the same reason (a hardcoded pre-fix number), you may add it to write_paths and fix it the same way,
  but state this explicitly in your closeout as a correction to the card.
