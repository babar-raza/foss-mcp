    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST: C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 2.3. Also read, in
    full, before writing anything: `src/foss_mcp/indexing/chunk_builder.py`'s real `_coverage_line`
    function (around line 679) AND its one real call site inside `build_chunks_from_api_surface`
    (around line 712-750, where `coverage = _coverage_line(fixture, entries)` is called - note
    that `candidate_pairs`/`pairs` already exist in scope at that call site, computed by
    `_reexport_pairs`/`_slot_units` a few lines earlier for an unrelated purpose, the `max_types`
    slot cap); `src/foss_mcp/indexing/symbol_identity.py`'s real `SymbolIdentity`
    dataclass (`canonical_id`, `aliases`, `is_definition`) and `compute_canonical_identities(entries)
    -&gt; list[SymbolIdentity]` (just landed, TC-612 - confirm its exact real shape, it may have
    details beyond what is summarized here); `src/foss_mcp/mcp/tools/coverage_note.py`'s real
    `parse_api_coverage`/`_describe`/`coverage_note_from_text` (read-only - confirm for yourself
    that it needs no change, by tracing through what happens once `_coverage_line` emits a smaller
    numerator; if you find it DOES need a change, STOP and report that finding rather than editing
    a file outside your write_paths).
  - >-
    At the ONE real call site (`build_chunks_from_api_surface`), compute
    `identities = compute_canonical_identities(entries)` (over the SAME `entries` list already in
    scope there - the post-slot-cut, position-remapped list, not the pre-cut `candidates`) and
    pass it into `_coverage_line` as a new parameter. Change `_coverage_line`'s signature to accept
    it: `_coverage_line(fixture, entries, identities: Sequence[SymbolIdentity] | None = None)` -
    `identities=None` (the default) must preserve the EXACT current behaviour byte-for-byte, so
    every existing caller/test that calls `_coverage_line` with the old two-argument form is
    unaffected - this is the backward-compatibility contract. When `identities` is given, replace
    the numerator computation: instead of `len(entries) - kept_functions` (which counts every
    entry, aliases included), count only entries whose `identities[index].is_definition` is True
    AND whose `kind` is not `"function"` (functions have their own separate clause and are not
    affected by this change - confirm whether `compute_canonical_identities` even groups function
    entries at all, since `_reexport_pairs`' three rules all restrict to class/enum kinds per its
    own docstring; if functions are never paired, every function entry's `is_definition` should
    already be True by construction - verify this rather than assuming it, and if a function entry
    is ever NOT its own definition, treat that as a real finding to report, not something to
    silently special-case around). Apply the same dedup to the LEGACY clause
    (`f"{len(entries)} of {type_count} types"`, used when the fixture has no `symbol_counts`) the
    same way, for consistency - a pilot without `symbol_counts` still deserves an honest numerator
    if it has real aliases.
  - >-
    tests/indexing/test_chunk_builder_coverage_line.py (no mocks for the real-pilot case; this is
    allowed to read the real, committed `infra/demo-manifests`, nothing is ever written to it):
    (a) calling `_coverage_line` with the OLD two-argument form (no `identities`) produces
    IDENTICAL output to before this card, for a handful of cases copied from
    `tests/indexing/test_chunk_builder.py`'s own existing coverage-line tests if any exist (check
    first; if none exist, build a couple of synthetic `fixture`/`entries` pairs yourself) - the
    backward-compatibility proof; (b) a synthetic fixture+entries with a real shell/definition pair
    (reuse `_reexport_pairs`'s own synthetic shapes, or build one matching one of the three real
    rules) produces a DEDUPLICATED numerator with `identities` given, smaller than without; (c) a
    REAL regression reproduction: run `build_chunks_from_api_surface` (or re-derive the relevant
    piece of it, calling `_coverage_line` with real `compute_canonical_identities` output) against
    the real, committed `slides_python` fixture (`tests/fixtures/slides_python/api_surface.json` or
    wherever it actually lives - find the real path) and confirm the rendered coverage line's
    numerator drops from the old (inflated) count to the real, deduplicated one - state the exact
    real before/after numbers in your closeout, do not assume they match TC-612's own 517/1023
    finding exactly (that card measured differently; measure fresh here against the real rendering
    path); (d) an end-to-end proof that `coverage_note.coverage_note_from_text` now returns a
    non-None caveat for that same slides/python-shaped chunk text (where it returned `None` before
    this card, since the ratio was always 100%) - call the REAL, unmodified `coverage_note_from_text`
    function against the real rendered line text, proving the revival with zero changes to that
    file. Never weaken a check to make it pass.
actions:
  - >-
    Thread I1's canonical-identity model into chunk_builder's API-Coverage rendering so the
    numerator counts each alias group once, not once per chunk - reviving coverage_note's existing,
    unmodified caveat path for the first time on a real pilot (slides/python), with the
    denominator-side fix explicitly deferred to I3.
