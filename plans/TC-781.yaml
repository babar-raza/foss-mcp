  - docker
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('docs/RELEASE.md'); s = p.read_text(encoding='utf-8'); old = '**L-022**'; count = s.count(old); assert count == 1, 'the expected L-022 bold marker was not found exactly once - the card needs re-anchoring'; s2 = s.replace(old, 'L-022', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Strips the bold markup from the existing, already-committed L-022 limitation entry, which
    must make tests/deploy/test_release_known_limitations.py fail (it explicitly asserts every
    ACCEPTED_LEDGER_IDS entry "must each appear exactly once, in bold") - this proves the
    required check command's own aggregated test suite genuinely reads docs/RELEASE.md's real
    content, since this card's own new closure prose has no dedicated automated consumer of its
    specific wording. A pure text mutation, immune to the lockstep-rename vacuousness class
    found earlier this session, and it never touches any code path.
evidence:
  - evidence/build/G3/TC-781/receipt.json
closeout:
  - >-
    O10 (oracle closure) is closed: the oracle program (O1-O10) is confirmed genuinely complete
    per the plan's own closure rule (every classified bucket ends FIXED or DEFINITIONAL, never
    merely "disclosed"), the real oracle test suite confirmed green, and the formal closure
    summary written into docs/RELEASE.md. The 19 remaining real open findings in
    docs/ROUND2_REVIEW.md (already individually investigated by I14) are named honestly, not
    silently absorbed.
recovery: Re-run from a clean tree.
