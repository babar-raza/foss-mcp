id: TC-781
gate: G3
lane: storage-retrieval
purpose: >-
  Closes O10 (REQ-G3-012, "oracle closure"), the third of the plan's 8 named closure stages,
  continuing the methodology that just closed Q17 (`TC-777`) and I14 (`TC-780`) today. A
  dedicated scoping investigation confirmed O10's own real dependencies (`O9`, `I14`) are both
  genuinely satisfied: O9 landed via `TC-694` (oracle enumerators run in pinned containers), and
  I14 landed via `TC-780` today.

  UNLIKE Q17/I14, O10 is confirmed NOT primarily a ledger-dispositioning task. Of the 286
  `docs/ROUND2_REVIEW.md` rows, only 19 remain `OPEN` naming an O-series card in their `Cards`
  column - and all 19 are the SAME rows `TC-780`'s own I14 pass individually investigated minutes
  earlier and correctly left honestly `OPEN` (confirmed real, still-broken findings or
  deliberately deferred work - re-touching them again under O10 would be redundant, not real new
  work). O10's genuine, distinct substance already exists, built by two prior cards: `docs/
  ORACLE_TRIAGE.md` (`TC-691`) classifies every real Go/Rust/C++ oracle-disagreement pilot, and
  `TC-732` ("O10 prep") finished the real individual root-causing for the 3 previously-untraced
  C++ pilots (`cells/cpp`, `slides/cpp`, `email/cpp`) against their real pinned source, explicitly
  closing out with "O10... still separately waits on I14" - now resolved. The real oracle test
  suite (`tests/release/test_source_differential.py`, `test_oracle_shell_resolution.py`,
  `test_oracle_inherited_verification.py`) is confirmed green by the supervisor directly, with
  Docker running.

  This card's real job: confirm the oracle program (`O1`-`O10`) is genuinely, fully complete per
  the master plan's own closure rule ("an oracle class may end only FIXED or DEFINITIONAL -
  'disclosed limitation' is NOT an allowed closure" - verify every real oracle-disagreement
  bucket this project ever classified actually ends in one of those two states, not a third,
  unresolved state masquerading as closed), write the formal closure summary into `docs/
  RELEASE.md` section 8 and `docs/DECISION_LOG.md`, and do NOT re-touch the 19 ledger rows I14
  already correctly left open.
depends_on:
  - TC-694
  - TC-780
  - TC-691
  - TC-732
write_paths:
  - docs/RELEASE.md
satisfies:
  - REQ-G3-012
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-13 — I14 (index-truth closure) lands: the second of the plan's 8 named closure stages
    sha256: 10dfc1f5b3843a42e1538b5ffa95001e50b8f263a02772cef0d0670add8c5bf9
inputs:
  - >-
    READ FIRST: `docs/ORACLE_TRIAGE.md` in full (all 7 real Go/Rust/C++ oracle-disagreement
    pilots and their real classification), `plans/TC-732.yaml`'s own closeout, and the master
    plan's own closure rule for the oracle program (section 2.3 of `C:\Users\babar\.claude\
    plans\steady-wobbling-meteor.md`: "an oracle class may end only FIXED or DEFINITIONAL").
  - >-
    REPRODUCE FIRST: re-run `{python} -m pytest tests/release/test_source_differential.py
    tests/release/test_oracle_shell_resolution.py tests/release/test_oracle_inherited_
    verification.py tests/release/test_oracle_triage_doc.py -q -rfE` yourself (Docker must be
    running - confirm with `docker info` first; use PowerShell with `.\scripts\toolchain\
    activate.ps1` run first in the same invocation if you need helm/go/cargo/docker on PATH) and
    confirm every test passes before claiming closure.
  - >-
    Verify every real oracle-disagreement bucket this project has ever classified (the 2
    cross-cutting buckets in `ORACLE_TRIAGE.md` - inheritance-flattening, bare-name/overload
    collision - plus Go's struct-embedding-promotion variant found by `TC-691`, plus whatever
    `TC-732` concluded for the 3 C++ pilots) genuinely ends in `FIXED` or `DEFINITIONAL`, per the
    plan's own rule. If you find any bucket still effectively "disclosed limitation only" with
    no real fix or definitional resolution, report this honestly rather than silently calling it
    closed - that would be a real gap worth flagging for its own follow-up, not papering over.
  - >-
    Do NOT re-touch any row in `docs/ROUND2_REVIEW.md` - the 19 remaining O-series rows were
    already individually investigated and correctly left `OPEN` by `TC-780`'s own I14 pass
    minutes earlier; re-touching them is explicitly out of scope and would be redundant work, not
    real progress.
  - >-
    Add the formal O10 closure summary to `docs/RELEASE.md` section 8 in the existing format
    (matching `TC-777`'s/`TC-780`'s own entries there), stating plainly what IS closed (O1-O9,
    the oracle-disagreement classification/root-causing program) and naming the 19 real,
    still-open findings honestly rather than implying they're resolved.
  - >-
    This card's write_paths is deliberately `docs/RELEASE.md` ONLY - the DECISION_LOG entry
    itself is written by the supervisor directly after acceptance, matching the established
    pattern for every closure card this session (Q17, I14). Do not attempt to write
    `docs/DECISION_LOG.md` yourself.
actions:
  - >-
    Confirm the oracle program (O1-O10) is genuinely complete per the plan's own closure rule,
    and write the formal closure summary into `docs/RELEASE.md` section 8.
checks:
  - command: '{python} -m pytest tests/release/test_source_differential.py tests/release/test_oracle_shell_resolution.py tests/release/test_oracle_inherited_verification.py tests/release/test_oracle_triage_doc.py tests/deploy/test_release_known_limitations.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 600
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 5
