id: TC-781
gate: G3
lane: storage-retrieval
purpose: >-
  Closes O10 ("oracle closure", REQ-G3-012), the third of the plan's 8 named closure stages,
  continuing the same day as Q17 (`TC-777`) and I14 (`TC-780`). A dedicated scoping investigation
  confirmed this card is NOT another large ledger-dispositioning pass like its two predecessors:
  `O1`-`O9` are already genuinely done (`O9` via `TC-694`; the real per-pilot C++ oracle
  root-causing via `docs/ORACLE_TRIAGE.md`, written by `TC-691`, and its own prep card `TC-732`;
  the oracle snapshot/ratchet mechanism via `tests/fixtures/oracle/snapshot.json`, `TC-693`), and
  I14 (this card's other dependency) landed today. Of `docs/ROUND2_REVIEW.md`'s 286 rows, exactly
  19 name an O-series card in their `Cards` column - but ALL 19 collapse into the SAME 2 row
  clusters `TC-780`'s own I14 pass already individually investigated and correctly left `OPEN`
  minutes ago (real, still-broken findings or deliberately deferred work). Re-touching them here
  would be redundant, not real new work - **do not re-disposition any row `TC-780` already
  touched**.

  O10's real, distinct job is the formal closure wrapper the plan's own "Notes that govern
  several cards" section describes for every closure stage: confirm the oracle program (`O1`-
  `O9`) is genuinely complete end to end, write the closing `DECISION_LOG`/`RELEASE.md` summary
  recording that state, and confirm the real oracle test suite is green. If, while confirming
  this, you find any genuinely NEW row (not already touched by `TC-777`/`TC-780`) that
  legitimately belongs to O10's own closure, disposition it the same individually-live-verified
  way - but the expectation, confirmed by the scoping investigation, is that none remain.
depends_on:
  - TC-780
  - TC-694
  - TC-691
  - TC-732
  - TC-693
write_paths:
  - docs/ROUND2_REVIEW.md
  - docs/RELEASE.md
satisfies:
  - REQ-G3-012
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-13 — I14 (index-truth closure) lands: the second of the plan's 8 named closure stages
    sha256: 10dfc1f5b3843a42e1538b5ffa95001e50b8f263a02772cef0d0670add8c5bf9
inputs:
  - >-
    READ FIRST: `docs/ORACLE_TRIAGE.md` in full (the real per-pilot oracle classification `TC-691`
    wrote), `tests/fixtures/oracle/snapshot.json` (the real O8 snapshot/ratchet mechanism), and
    `docs/ROUND2_REVIEW.md`'s own 19 rows naming an O-series card (confirm yourself they are the
    exact same rows `TC-780` already dispositioned or correctly left OPEN - do not re-touch them
    unless your own fresh investigation finds a genuinely different, previously-unconsidered
    angle).
  - >-
    REPRODUCE FIRST, YOURSELF, FRESH (needs Docker running - confirm `docker info` succeeds
    first, start Docker Desktop if not): run `{python} -m pytest tests/release/
    test_source_differential.py tests/release/test_oracle_shell_resolution.py tests/release/
    test_oracle_inherited_verification.py -q -rfE` and confirm the real oracle test suite is
    fully green. This is the real evidence O10 closes on, not assumed.
  - >-
    Writing a closing entry in `docs/DECISION_LOG.md` is NOT this card's job (that file is never
    a worker's write_paths - the supervisor adds that separately after integration). This card's
    real, concrete deliverable in `docs/RELEASE.md` is a NEW, genuine completeness record (not
    padding): read the file's own structure first and add a note, in whichever existing section
    best fits (or a new small one if none fits), stating the oracle program's real final,
    measured state - cite the real total oracle-disagreement reconciliation achieved across
    `O1`-`O9` (pull the real numbers from `docs/ORACLE_TRIAGE.md` and the earlier oracle-program
    cards' own closeout text, re-verified by you, not copied blindly) and the real test suite
    result you just measured. This is genuine release documentation a reader would want, not
    filler - if, after really looking, you find this exact content is ALREADY fully present
    elsewhere in `docs/RELEASE.md` verbatim, say so precisely (cite the section) rather than
    duplicating it, but do not skip this step without that specific verification.
  - >-
    Do NOT re-disposition any of the 19 O-series `docs/ROUND2_REVIEW.md` rows unless your own
    fresh investigation finds one is genuinely NOT the same row `TC-780` already correctly
    touched - verify this precisely before changing anything, citing the exact row id and why it
    differs from what `TC-780`'s own report already covered.
  - >-
    Do NOT touch `tests/deploy/test_round2_ledger.py`, `docs/ORACLE_TRIAGE.md`, `tests/fixtures/
    oracle/snapshot.json`, any `tests/conformance/*.py` file, or any extraction/oracle test or
    fixture file - this card confirms the real state of all of these, it does not change them.
  - >-
    Before committing: run `{python} -m pytest tests/deploy/test_round2_ledger.py tests/conformance/ -q -rfE -p no:cacheprovider`
    twice to confirm no regression, and report the real result alongside the oracle suite's own
    real result.
actions:
  - >-
    Confirm the oracle program (O1-O9) is genuinely complete, record its real closure state in
    `docs/RELEASE.md` if anything is genuinely missing there, and verify (without redundantly
    re-touching) that no O-series ledger row needs a disposition `TC-780` did not already give it.
checks:
  - command: '{python} -m pytest tests/deploy/test_round2_ledger.py tests/conformance/ -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 600
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('docs/ROUND2_REVIEW.md'); s = p.read_text(encoding='utf-8'); old = '| RD2-003 |'; count = s.count(old); assert count == 1, 'the expected RD2-003 row marker was not found exactly once - the card needs re-anchoring'; idx = s.index(old); line_end = s.index(chr(10), idx); line = s[idx:line_end]; parts = line.rsplit('|', 2); assert len(parts) == 3; corrupted = parts[0] + '|BOGUS_STATUS' + '|' + parts[2]; s2 = s[:idx] + corrupted + s[line_end:]; assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts row RD2-003's own Status cell to a value that is not any real disposition, which
    must make the permanent test_every_row_status_is_a_real_disposition_value check (added by
    TC-777) fail - a pure data mutation, immune to the lockstep-rename vacuousness class found
    earlier this session, and it never touches any code path.
evidence:
  - evidence/build/G3/TC-781/receipt.json
closeout:
  - >-
    O10 (oracle closure) is closed: the real oracle test suite confirmed green, the oracle
    program's real end-to-end completeness recorded, and the 19 O-series ledger rows confirmed
    to need no redundant re-disposition beyond what TC-780 already gave them (or, if a genuinely
    new one was found, dispositioned the same individually-verified way).
recovery: Re-run from a clean tree.
