id: TC-524
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, finding RST-06; carries the scope of the cut cards TC-397 and TC-475's C++ half, which were
  SUPERSEDED). C++ FIDELITY. The reviewer diffed the served cells/cpp and pdf/cpp symbol chunks against the upstream public headers. Measured:
  constructors upstream/served 166/71 (cells) and 383/75 (pdf), so 96 of 165 and 104 of 217 classes lose ALL their constructors; parameters
  declared by reference upstream 351 and 673 but served with a `&` or `*` on 0 and 4 lines; const methods 781 and 805 upstream, 0 marked; static
  methods 192 and 197 upstream, 0 marked; 247 (13 percent) and 425 (18 percent) methods missing. Concretely `Workbook` serves only `Workbook()`:
  `explicit Workbook(std::string_view)`, `Workbook(const std::vector<uint8_t>&)` and the LoadOptions overloads are absent;
  `void Save(std::vector<std::uint8_t>& stream, SaveFormat) const` is served `Save(stream: std::vector<std::uint8_t>, format: SaveFormat) -> void`
  and `WorksheetCollection& GetWorksheets()` is served `-> WorksheetCollection`, so an agent writes `auto x = wb.GetWorksheets()`, which does not
  compile (the copy constructor is deleted). 100 of the 300 cells/cpp symbol chunks (33 percent) are `Kind: function`; 93 of them are file-static
  helpers defined in `.cpp` files (`GetElapsedMinutes`, `IsNumericFormatChar`, `EscapeTextContent`, `IsWhitespaceOrEmpty`, `MakeElem`), all with zero
  parameters, and `get_symbol` serves them as public API. The cells/cpp headers document with `/// <summary>` while the C++ doc reader accepts only
  `/** */`, so 0 of 300 chunks carry a description. Reproduced on this checkout with `get_parser("cpp")` and `extract_api_surface`: on the
  vendored, checksummed cells/cpp snapshot (tests/fixtures/cells_cpp_pinned_source, commit 9f852d0) the extractor returns 146 free-function entries,
  ALL 146 from `.cpp` files, 0 from a header, and 1815 methods of which 0 are marked as constructors; on a small header with the reviewer's cases
  the tree-sitter node shapes are: constructors and destructors inside a class parse as `declaration` (not `field_declaration`) nodes, deleted and
  defaulted members as `function_definition` nodes with a `delete_method_clause` or `default_method_clause`, free functions declared in a header as
  `declaration` nodes whose parent is the namespace `declaration_list` or the `translation_unit`, operators carry an `operator_name` declarator, and
  the reference or pointer of a return or parameter type lives in a `reference_declarator` or `pointer_declarator` wrapper, which the extractor drops
  because it reads only the declarator-less `type` field. The same C++ adapter serves slides/cpp, jmap/cpp and email/cpp (untested by the reviewer).
  This card changes the C++ extraction in src/foss_mcp/extraction/tree_sitter_engine/api_surface.py and one rendering rule in
  src/foss_mcp/indexing/chunk_builder.py so that: parameters and return types keep the full declarator text (references, pointers, const, default
  arguments); constructors, destructors, operator overloads and deleted or defaulted special members are collected; static, const, virtual, explicit,
  noexcept, override, final, pure and constexpr are recorded in the existing additive `modifiers` list that chunk_builder already renders as
  `[static, const]`; a free function is published only when it is declared or defined inline in a PUBLIC header (never a function that only a `.cpp`
  defines, never `static`, never in an anonymous or `detail` or `internal` scope); and `///` comments (including `/// <summary>` blocks) are read as
  doc comments. It does NOT change any other language, the committed tests/fixtures/*/api_surface.json files (they change only when the C++ pilots are
  re-extracted by a later card), the selection of which types are kept (TC-520 to TC-523), or the coverage line.
