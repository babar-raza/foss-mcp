id: TC-808
gate: G3
lane: storage-retrieval
purpose: >-
  XA6a - artifact validators (low priority, last). 'Ran and produced a file' must mean a valid
  file, not a 0-byte or garbage container. Validators exist only for STL/glTF/OBJ
  (`artefact_payload_bytes`, which caught the one real 3d/java `no_output` case). Add pure-Python
  structural checks in a NEW module `src/foss_mcp/indexing/example_artifacts.py`, called from
  `artefact_payload_bytes`: OOXML zip with `[Content_Types].xml`, PDF `%PDF` header + `%%EOF`
  trailer, PNG/JPEG magic, EML headers, MSG OLE magic. A produced artifact that fails its
  validator makes the run `failed` (not published as verified). Only useful once the
  python/go/rust/ts run steps record produced files (TC-805..807); if after measuring over the
  committed authored examples the validators would flag nothing real, still land the module (it is
  small) but say so.
depends_on:
  - TC-807
  - TC-806
  - TC-805
  - TC-804
  - TC-803
  - TC-802
write_paths:
  - src/foss_mcp/indexing/example_artifacts.py
  - src/foss_mcp/indexing/example_verifier.py
  - tests/indexing/test_example_artifact_validators.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    The measured design record for this stage is in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\decision.md
    (section 2 for your stage, section 3 for the card breakdown; per-pilot corpus table in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\per_pilot_table.md).
    Its numbers were measured on 2026-11-14 - re-measure what you rely on. Where the record and the
    code disagree, the code wins; say so in your report.
  - >-
    READ FIRST: `artefact_payload_bytes` and its STL/glTF/OBJ validators in example_verifier.py;
    tests/indexing/test_example_verifier.py, test_example_verifier_classification.py,
    tests/indexing/test_example_fixtures.py (the OOXML/zip fixture generators from TC-701 give ready
    valid samples).
  - >-
    TESTS tests/indexing/test_example_artifact_validators.py: valid samples (the TC-701 generators
    for docx/xlsx/pptx/zip; a minimal PDF; PNG/JPEG headers; an EML; an OLE/MSG magic) are accepted;
    a corrupt zip, a 0-byte PDF, a truncated PNG are rejected; the wiring proof that
    `artefact_payload_bytes` calls the new module (source assertion).
  - >-
    Do not change what counts as verified for examples that produce no artifact.
  - >-
    Do NOT regenerate or touch anything under infra/demo-manifests/ or
    tests/fixtures/verified_examples/ - a single coordinated regeneration of all pilots happens in a
    later card; this card changes code and tests only. Chunk text produced by the new code will
    therefore differ from the committed generations - tests must exercise the code path directly,
    never rely on the committed generations being regenerated.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies that commit's
    production-code part). Before committing run `ruff format` and `ruff check` on changed Python
    files, then run the card's check command twice and report the real results. Keep every
    pre-existing test unchanged unless a test pinned the now-corrected behavior as 'correct' - then
    change only that assertion and say so.
actions:
  - >-
    Reject invalid or empty produced artifacts (OOXML, PDF, PNG/JPEG, EML, MSG) as failed runs.
checks:
  - command: '{python} -m pytest tests/indexing/test_example_artifact_validators.py tests/indexing/test_example_verifier.py tests/indexing/test_example_verifier_classification.py tests/indexing/test_example_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 119
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/indexing/example_artifacts.py', 'src/foss_mcp/indexing/example_verifier.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-808/receipt.json
closeout:
  - >-
    Produced artifacts are structurally validated; an empty or corrupt output can no longer pass as
    a verified run.
recovery: Re-run from a clean tree.
