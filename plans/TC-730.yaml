    shelled-pilots-only failure the rationale describes - still a real, non-vacuous break, just not
    the exact shape described. Re-anchor the mutate on the real use-site comparison yourself if you
    hit the same ambiguity (attempt 1 already confirmed this is fine to do, following this card's
    own negative_control rationale text), and verify by hand it is non-vacuous before committing -
    exactly as attempt 1 already did correctly.
actions:
