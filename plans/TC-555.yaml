negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/python_surface.py');s=p.read_text(encoding='utf-8');q=chr(34);old='_REPAIR_TRY = '+q+'if True: pass'+q;assert s.count(old)==1;p.write_text(s.replace(old,'_REPAIR_TRY = '+q+'try: pass'+q),encoding='utf-8')"
  rationale: >-
    Replaces the neutral replacement of a collapsed `try:` header by another `try:` header, so a collapsed try/except ladder can no longer be repaired: the synthetic ladder test and the reader.py excerpt
    test fail (the file is dropped again), exactly the way the real reader.py was dropped before this card. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-555/receipt.json
closeout:
- >-
  A Python file whose indentation was collapsed upstream no longer disappears from the index: its declarations are recovered by a bounded textual repair and disclosed as a `repaired-syntax` unresolved entry;
  tex_python is re-extracted at its chart pin and holds TeXJob, TeXOptions, OutputFormat, the devices, the input sources and the four exception classes. Nothing a peer sees changes until the supervisor
  re-ingests tex/python.
recovery: Re-run from a clean tree.
