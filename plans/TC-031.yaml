id: TC-031
gate: G2
lane: foundation
purpose: Author config/products/cells/rust.yaml, the third G2 pilot's product manifest,
  pinning the exact verified upstream repository and its already-decided storage_topology.
depends_on:
- TC-003
write_paths:
- config/products/cells/**
- tests/config/test_cells_rust_manifest.py
satisfies:
- REQ-G2-011
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 11.2 Family-wise public GitHub distribution — preserved as a required
    outcome, not deferred'
  sha256: 230a252ade7d0c7eaf969af89192636e0905f79b15b780f65ad8797efbe5f427
inputs:
- 'VERIFIED upstream name, re-checked via a fresh anonymous `gh api repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Rust`
  read on 2026-09-24: aspose-cells-foss/Aspose.Cells-FOSS-for-Rust, public, size ~245KB.
  Pin this exact string; do not derive it from family/platform.'
- 'IMPORTANT AND UNIQUE TO THIS PILOT: this repository''s default branch is `master`,
  not `main` - confirmed via the same API read (`default_branch: master`). This is
  the only one of the 7 pilots where this differs. It does not affect this card directly
  (the product manifest schema has no branch/ref field - schemas/product/product-manifest.schema.json
  only requires family/platform/repository/schedule/storage_topology), but RECORD
  it clearly in your commit/report so it is not rediscovered the hard way by whichever
  card next needs an explicit --ref argument (e.g. a furnished-content export or any
  tool defaulting to --ref main).'
- 'storage_topology is ALREADY DECIDED - see docs/DECISION_LOG.md''s ''Storage topology
  decision generalized to all pilots'' entry (also referenced, possibly under a slightly
  reworded heading, by a concurrent session''s own edit - either heading text refers
  to the same decision): write storage_topology: embedded directly. Do not write ''undecided_pending_TC-004''
  and do not run any new topology measurement.'
- 'Follow config/products/pdf/net.yaml''s and config/products/slides/python.yaml''s
  exact shape: family: cells, platform: rust, repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Rust,
  a real schedule.cron (pick an hour distinct from pdf/net''s 04:00 UTC and slides/python''s
  06:00 UTC), storage_topology: embedded.'
actions:
- Write config/products/cells/rust.yaml with the fields above.
- 'Write tests/config/test_cells_rust_manifest.py asserting: the manifest validates
  against schemas/product/product-manifest.schema.json; repository equals the exact
  pinned literal string above (assert the literal, never reconstruct it from family/platform);
  storage_topology equals ''embedded''.'
checks:
- command: '{python} -m pytest tests/config/test_cells_rust_manifest.py -q'
  expect: exit 0
  timeout_seconds: 60
  junitxml: true
  proves:
  - REQ-G2-011
min_tests: 3
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('config/products/cells/rust.yaml');s=p.read_text(encoding='utf-8');s=s.replace('aspose-cells-foss/Aspose.Cells-FOSS-for-Rust','aspose-cells-foss/wrong-repo-name');p.write_text(s,encoding='utf-8')"
  rationale: Corrupting the pinned repository string must break the suite - proves
    the test asserts the real literal rather than something derivable. Self-checked
    end-to-end before being persisted.
evidence:
- evidence/build/G2/TC-031/receipt.json
closeout:
- config/products/cells/rust.yaml exists, validates, pins the exact repository.
- storage_topology is embedded.
- Corrupting the repository string fails the suite.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
