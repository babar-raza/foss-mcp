purpose: 'URGENT (main is RED at HEAD since TC-853 integrated, found by the pre-push CI on 2026-11-21): six tests fail on main - tests/infra/test_furnished_chunk_quality.py::test_no_candidate_line_is_lost[tex_python] (the chunker bug below: ''**Requirements**: Python 3.10+.'' of the tex Installation block is not in any chunk) and five tests that still pin the OLD tex api_surface fixture: tests/infra/test_build_chunks_extraction_notice.py::test_the_committed_tex_fixture_discloses_its_two_repaired_files and ::test_main_on_the_repaired_tex_fixture_writes_the_notice_with_a_source_commit_line, tests/infra/test_build_chunks_parse_failures_notice.py::test_tex_without_parse_failures_is_still_one_chunk_without_a_headline, ::test_tex_with_parse_failures_keeps_one_chunk_and_leads_with_the_headline and ::test_main_on_the_committed_tex_fixture_ends_symbol_chunks_with_the_coverage_line (31 chunks now, not 25; no repaired-file notice). Fix: the five fixture pins are re-pointed at the frozen tests/fixtures/tex_python/api_surface_181015d2_repaired.json
  for the notice/headline/repair mechanisms plus new tests pinning the committed 26.11.1 fixture (no notice, 0 of 59, 31 symbol chunks, coverage line ''16 of 16 types; 8 of 8 functions''); the sixth is fixed by the chunker change below, never by loosening or skipping test_no_candidate_line_is_lost. Found by TC-853''s worker (2026-11-20): src/foss_mcp/normalization/chunker.py _heading_sections() cuts a document body at its ''#'' headings and DISCARDS every character before the first heading, so a candidate whose body is a preamble followed by a sub-heading loses the preamble from the served index. On the regenerated tex/python furnished page two blocks lose real, true text: ''Installation'' (the 287-character ''Install the package from PyPI: pip install aspose-tex-foss ... mcp extra'' preamble before its first ### heading) and ''API Reference'' (the 227-character intro ''The primary entry point is TeXJob ...''); the worker measured all 32 furnished pages and found only these two candidates
  affected, but the document/README candidates of every pilot were not measured. This is a silent-data-loss class (AGENTS.md: never acceptable). MEASURE FIRST, then fix: (1) count, for every one of the 32 pilots, the doc candidates (build_chunks doc sections, furnished pages, README sections) whose body has non-whitespace text before its first heading, and the characters lost; report the table. (2) Fix _heading_sections so that text before the first heading becomes its own section (heading '''' so chunk_document labels it with the document title as it does for heading-less bodies), keeping every other behaviour byte-identical for bodies that have no preamble (fence-aware heading detection, empty-section handling, section order). (3) Add tests: a preamble is kept, a preamble-less body is unchanged, a preamble followed by a fenced ''#'' comment is handled, whitespace-only preamble yields no section, order is preamble then headings. (4) Regeneration: if the measured impact is exactly the two
  tex/python blocks, regenerate tex_python with scripts/release/regenerate_local.py --only tex_python (image built from the worktree) so the committed generation serves the lost text and re-pin the tex tests to the real new chunk count. If the measurement shows OTHER pilots lose a preamble, do NOT regenerate them in this card: report the per-pilot table and the changed in-process chunk counts, keep the committed data of those pilots as it is, and make sure no committed-data-vs-simulation test (tests/mcp/tools/post_regen_simulation.py users, tests/deploy chunk-identity tests) breaks; if one would, STOP and report so the supervisor can schedule a fleet regeneration. No pilot may get worse: answer_diff for tex_python must show lost 0.'
