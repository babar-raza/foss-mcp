negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/relevance.py'); s = p.read_text(encoding='utf-8'); old = 'DOC_SCOPE_WEIGHTS_ENABLED = True'; assert s.count(old) == 1, 'fix text not found - card and source have diverged - if the real flag text differs from this guess (e.g. spacing, or the flip was implemented a different way), anchor on your own real post-fix line instead, in the same chr()-based style, and note the substitution in your closeout'; p.write_text(s.replace(old, 'DOC_SCOPE_WEIGHTS_ENABLED = False  # TC-626 negative control: reinstate the dormant default', 1), encoding='utf-8')"
  rationale: >-
    Reverts the flag to its pre-card dormant value. If search_docs/lookup's own wiring reads this
    flag at call time (one design option this card's inputs leave open to the author), this
    reproduces pre-card behaviour directly; if instead the wiring unconditionally calls
    doc_scope_term_weights with no runtime flag check (also a valid reading of the inputs, since
    the flag's own comment calls it a documentation/handoff marker, not necessarily a runtime
    switch), this mutate alone will NOT fail any check - in that case, REPLACE it with one that
    shadows `doc_scope_term_weights` itself (imported into search_docs.py/lookup.py) back to
    `term_weights`'s own old behaviour, in the same chr()-based style, dry-run it, and note the
    substitution in your closeout. Either way, test (b) (the liveness/wiring check) must fail.
