    doc_scope_term_weights is live in search_docs and lookup, confirmed ratchet-safe against the
    full bundle; find_examples stays on term_weights, with the real measured regression numbers
    recorded as a finding for a future card. State the real, fresh-measured LONGQ-001 coverage
    number honestly, whichever way it falls, and confirm which negative-control approach you used.
    Confirm tests/test_unwired_modules.py's stale _KNOWN_UNWIRED entry is removed and
    tests/mcp/tools/test_relevance_doc_scope_weights.py's dormant-marker test now correctly
    asserts the live, enabled state.
recovery: >-
