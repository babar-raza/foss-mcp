  pre-measurement did not catch (in search_docs or lookup specifically, not find_examples, which is
  already known and excluded), STOP and report FAILED_INTERNAL with the exact numbers - per Decision
  F, do not enable the flag or ship the wiring if your own independent measurement disagrees with
  the supervisor's; report the real conflict instead.
