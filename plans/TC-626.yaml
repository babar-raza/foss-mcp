id: TC-626
gate: G3
lane: storage-retrieval
purpose: >-
  Build Q6 (REQ-G3-011): the measurement-gated decision to enable Q5's `doc_scope_term_weights`
  (dormant since TC-625) - REAL, PRE-AUTHORING measurement already performed by the supervisor
  (not assumed), with a precise, narrower-than-originally-planned result. Patching
  `term_weights` -> `doc_scope_term_weights` at ALL THREE real call sites at once
  (`search_docs._rule_for` line ~266, `lookup._limitation_docs` line ~357,
  `find_examples.find_examples` line ~546) and running the full retrieval ratchet bundle found: (a)
  `search_docs` ALONE: the full bundle (`test_round3_retrieval_corpus.py`,
  `test_forgiveness_acceptance.py`, `test_nonsense_queries_miss.py`,
  `test_find_examples_title_anchor.py`, `test_relevance_idf_synonyms.py` - 293 tests) passes
  completely unchanged; (b) `lookup` ALONE: the same bundle plus `test_lookup_forgiveness.py`/
  `test_lookup_miss_reason.py` also passes completely unchanged; (c) `find_examples` ALONE: a REAL,
  REPRODUCED REGRESSION - `test_forgiveness_acceptance.py::test_verbose_example_queries_do_not_
  regress` and `test_find_examples_title_anchor.py::test_the_tc516_example_tables_are_unchanged`
  both drop from the pinned floor `MIN_VERBOSE_HITS = 14` to a measured 12 hits / 14 misses. This
  card therefore enables doc-scope weights for `search_docs` and `lookup` ONLY - `find_examples`
  stays on `term_weights` unchanged, and the measured regression is recorded as a finding for a
  SEPARATE, later card (plausibly tied to Q10's own find_examples-specific admission work, NOT this
  card's job to fix). Also measured directly, honestly, and worth stating plainly rather than
  assuming a feel-good narrative: the literal LONGQ-001 sentence itself does NOT flip to a confident
  hit from this card alone - the real, committed "Installation, Dependencies, and Quick Start"
  chunk's own weighted coverage for that exact query measures 0.4286 with `term_weights` and 0.3895
  with `doc_scope_term_weights` (a small DECREASE for this one specific passage, even though the
  isolated "install" vs. "file" weight gap this card's own premise rests on DOES widen, as TC-625
  measured) - because `passage_coverage` sums weighted coverage over ALL of the query's distinctive
  terms, not just the two illustrative ones, and not every term's doc-scope weight shifts the same
  direction. Flipping LONGQ-001 to a confident hit remains Q7-Q9's job (the graded admission tier
  and, if still needed, clause decomposition) - per the plan's own staged design, this was never
  this card's own acceptance bar; "every existing ratchet holds" is. Read
  C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1 (row 1), 2.2 (Q5-Q9), and
  section 3 Decision F (measurement-gated stages) first.

  REWORK (attempt 2): attempt 1's wiring is correct, fully re-confirmed independently by the
  worker (search_docs-only and lookup-only both passed the full 361-test ratchet bundle
  unchanged; find_examples-only reproduced the exact predicted regression - all three numbers
  matched the card's own pre-measurement exactly). The worker ALSO found and honestly corrected a
  real error in the supervisor's own pre-authoring LONGQ-001 measurement: it was taken with
  `platform=None`, but every real production call site passes `platform="net"` (TC-610's platform
  exclusion, already shipped) - the real, correctly-measured number is `0.3333 -> 0.2984` (still a
  decrease, still well under 0.6 - the qualitative conclusion is unchanged, only the exact figures
  were wrong in this card's own `purpose` text; do not "fix" that text, it is not in your
  write_paths and the real test now carries the correct number). Attempt 1 also correctly
  identified, and correctly did NOT fix (outside its write_paths), two now-stale pre-existing
  tests broken by this card's OWN real, correct behaviour change: (1)
  `tests/test_unwired_modules.py`'s `_KNOWN_UNWIRED` frozenset still lists
  `"foss_mcp.mcp.tools.relevance.doc_scope_term_weights"` (TC-625's own entry) even though this
  card makes it genuinely, permanently wired - remove that one entry and its docstring mention
  (update the "EIGHT such symbols" count language down by one; confirm the real current count
  yourself, it may have shifted); (2)
  `tests/mcp/tools/test_relevance_doc_scope_weights.py::test_doc_scope_weights_enabled_marker_is_
  false_and_dormant` (TC-625's own test) pins `DOC_SCOPE_WEIGHTS_ENABLED is False` - update it to
  assert `is True` (rename the test function to match: e.g.
  `test_doc_scope_weights_enabled_marker_is_true_and_live`), keep its OWN real, valuable invariant
  (flipping the flag back and forth must not change `doc_scope_term_weights`' own output - the
  function never reads it) intact, just toggling in the OTHER direction from the new `True`
  default. Do not touch any OTHER test in either file.
