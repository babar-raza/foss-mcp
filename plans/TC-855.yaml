write_paths:
  - docs/DECISION_LOG.md
  - docs/RELEASE.md
  - tests/deploy/test_release_records.py
satisfies:
  - REQ-G3-018
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: the last five sections of docs/DECISION_LOG.md (style, and note the 'source-ref
    anchor fencepost': another card's source_refs hash a DECISION_LOG section up to the next '## '
    heading, so append your section at the END and never edit the text of an existing section),
    docs/RELEASE.md section 8 and the regeneration paragraphs, scripts/release/regenerate_local.py
    module docstring, ops/open_questions.jsonl entry OQ-029 (read only),
    plans/TC-829.yaml..TC-831.yaml, plans/TC-841.yaml and TC-842.yaml (why go/rust/cpp fixtures did
    not change).
  - >-
    Facts you must not invent: use only numbers and reasons in this card or in the files above; if a
    number cannot be confirmed, leave it out. Do not edit ops/, plans/, evidence/ or project/
    (supervisor-owned). REQ-G3-018 itself is added to ops/requirements.yaml by the supervisor in the
    same commit that authors this card; your test only reads it.
  - >-
    Run the card's check twice, ruff check / ruff format --check on the new test, make exactly ONE
    commit, report once. In a worktree without a venv use
    E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\.venv\Scripts\python.exe with PYTHONPATH set
    to your worktree root, src and infra.
actions:
  - >-
    Write the missing decision records and the regeneration how-to, and pin them with one offline
    test that also proves REQ-G3-018 has a card.
checks:
  - command: '{python} -m pytest tests/deploy/test_release_records.py tests/deploy/test_release_known_limitations.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-018
min_tests: 189
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['docs/DECISION_LOG.md', 'docs/RELEASE.md']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-855/receipt.json
closeout:
  - >-
    The programme's decisions are on record and REQ-G3-018 exists with a satisfying card and a
    proving check.
recovery: Re-run from a clean tree.
