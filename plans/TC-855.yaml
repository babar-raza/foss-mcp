id: TC-855
gate: G3
lane: verification
purpose: >-
  RW-21 (plan 'Reconciliation (2026-11-18)'): record the decisions the 2026-11-14..19 programme
  made but never wrote down, and give REQ-G3-018 (release proof) its first satisfying card and
  proving check. Documentation plus ONE offline test; no product code and no data. (1)
  docs/DECISION_LOG.md: append ONE new section headed '## 2026-11-19 - Remaining-work programme
  record (retired cards, regeneration route, size ceiling, baseline re-record)' containing, each
  as its own short paragraph: (a) the retirements of TC-834 (superseded by TC-835: the first fix
  attempt for the LONGQ-001 regression), TC-843 and TC-845 (no-ops: the go, rust and cpp
  extraction fixtures are byte-identical on regeneration, verified by the TC-841/TC-842 workers) -
  their plan files were removed and nothing was integrated; (b) the metadata note that
  plans/TC-713.yaml and plans/TC-715.yaml carry satisfies REQ-G3-017 although their work is
  disclosure-ledger work (REQ-G3-015) and are left unchanged because a card is immutable after
  acceptance; (c) the regeneration route: plan stage H6 was re-scoped from a regenerate_demo.py to
  scripts/release/regenerate_local.py (helm template + docker run in the ingestion image, no
  cluster; TC-829), with the served-answer comparator scripts/release/answer_diff.py (TC-831) as
  the 'no pilot gets worse' gate and the replay-only cached embedding provider restored (TC-830);
  (d) OQ-029: the lean baked-tree ceiling moves from 45 MB to 55 MB as a PROVISIONAL_ACCEPT
  (numbers: 44.46 MB after cohort C1, about 50 MB projected when all 32 pilots carry 4096-dim
  vectors; rejected: fewer vector decimals, a new vector encoding, keeping 45 MB with 20
  lexical-only pilots) - the operator still resolves it before gate exit; (e) DG-1: on 2026-11-19
  the operator authorised re-recording baseline_symbol_self_retrieval.json and
  baseline_sentence_wrapped_retrieval.json for cohort C1 under hard guards (only the prefix-3 /
  probe-artefact classes may gain entries, no non-cohort pilot may change, strict stays true) and
  the same guard for the later cohorts; (f) RD2-286 (LONGQ-001) stays OPEN by the operator's
  2026-11-01 deferral. Use the same heading style and tone as the neighbouring 2026-11-14
  sections. (2) docs/RELEASE.md: add a short section 'Regenerating the demo data without a
  cluster' that states the command (`python scripts/release/regenerate_local.py --cohort
  C1[,C2...]` or `--only <pilot>`), that it needs Docker, helm, the embedding-gateway variables
  (never printed) and an ingestion image built from the same tree, that it refuses anything not
  4096-dimensional, what answer_diff.py and generation_diff.py are for, and the rule that sidecars
  are committed history refreshed only by a deliberate data commit. Do not change any limitation
  text or number that another card owns. (3) New test tests/deploy/test_release_records.py
  (offline, reads committed files only): the DECISION_LOG section exists and names TC-834, TC-843,
  TC-845, OQ-029, DG-1 and regenerate_local.py; plans/TC-834.yaml, TC-843.yaml and TC-845.yaml do
  NOT exist; RELEASE.md names regenerate_local.py and answer_diff.py; ops/requirements.yaml
  contains REQ-G3-018 and at least one plan lists it in satisfies (parse with yaml, do not grep
  prose).
