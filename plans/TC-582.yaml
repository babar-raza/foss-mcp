id: TC-582
gate: G3
lane: storage-retrieval
purpose: >-
  A 2026-10-24 independent audit round reproduced a real, serious hazard: two goroutines mutating different cells of ONE shared
  cells/go Workbook - exactly how an agent could naively parallelize two independent column fills after reading the undocumented
  API - crashed the process 5 out of 5 runs with Go's always-on 'fatal error: concurrent map read and map write' / 'concurrent
  map writes', an UNRECOVERABLE fatal error (not a catchable panic). The real upstream repository (README, docs, source, AGENTS.md)
  was searched directly and carries ZERO mentions of thread-safety - this is a genuine, confirmed upstream documentation gap,
  not a foss-mcp server defect (foss-mcp never shares a Workbook across threads itself). But foss-mcp's own served `get_product_reference(limitations)`
  and `agent_guidance` for cells/go carry no warning either, so an agent following THIS project's own guidance has no way
  to anticipate the crash. This project has no existing mechanism for a project- authored, clearly-labeled addition to a pilot's
  served content (limitations/agent_guidance are both currently sourced ONLY from the upstream repository's own README/AGENTS.md
  text - confirmed by reading src/foss_mcp/mcp/tools/get_product_reference.py's `_limitations_from_readme` and the agent_guidance
  fetch path). FIX, bounded: add a minimal, narrow, project-authored 'known hazard' field to the product manifest schema,
  populate it for cells/go with the concurrency hazard (and nothing else, for no other pilot, in this card), and wire get_product_reference
  to merge it into the served limitations answer with framing that makes unmistakably clear this is foss-mcp's OWN verified
  finding, not a claim about what the upstream README says (never marked untrusted_upstream_content - it IS trustworthy, project-
  authored content, and must use its own distinct, honest framing).
depends_on:
- TC-536
- TC-561
- TC-574
- TC-577
- TC-581
write_paths:
- schemas/product/product-manifest.schema.json
- config/products/cells/go.yaml
- src/foss_mcp/mcp/tools/get_product_reference.py
- tests/mcp/tools/test_product_reference_known_hazards.py
- tests/schemas/test_product_manifest_schema.py
- infra/serve_http.py
- tests/infra/test_serve_http.py
satisfies:
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  REPRODUCE AND TRACE FIRST: read config/products/cells/go.yaml and schemas/product/product-manifest.schema.json in full (the
  manifest schema's `additionalProperties: false` means ANY new field needs a schema change, not just a YAML edit). Read src/foss_mcp/mcp/tools/get_product_reference.py's
  limitations path end to end (`_limitations_from_readme` and wherever ReferenceContent for the limitations section is finally
  assembled and returned) to find the exact, correct place to merge in an additional, project-authored paragraph alongside
  (never instead of) the real README-sourced limitations text. Do NOT invent a test harness to reproduce the original Go crash
  yourself - trust this card's own citation of it (5/5 reproduction, real upstream repository, zero thread-safety docs found);
  this card's own scope is the disclosure mechanism, not re-proving the upstream library's own behavior again.
- >-
  SCHEMA CHANGE: add an OPTIONAL `known_hazards` field to schemas/product/product-manifest.schema.json - an array of objects,
  each with at minimum a `text` string (the hazard, written plainly, verified by this project, not by the upstream repository)
  and a `verified_at` date-shaped string. Keep it optional (not in `required`) so every other pilot's manifest validates unchanged
  with no field added. Add it to config/products/cells/go.yaml ONLY, as the LAST top-level key in the file (after `storage_topology`,
  so a simple marker-based negative control can truncate it without depending on YAML indentation details), with one entry
  describing the concurrent-map-mutation crash plainly: state the real failure mode (an unrecoverable Go runtime fatal error,
  not a catchable panic), the real trigger (two goroutines mutating one shared Workbook instance), and the safe pattern (one
  Workbook per goroutine, or serialize access) - do not invent wording that oversells or undersells what was actually reproduced.
- >-
  WIRING: get_product_reference.py's limitations section for a pilot whose manifest carries `known_hazards` must include those
  hazard texts, clearly and distinctly framed as this project's own verified finding (e.g. a 'Known hazard (verified by this
  project):' lead-in, separate from the README-sourced paragraph, never merged into or mistaken for upstream prose) - and
  must NEVER be marked `untrusted_upstream_content` (that marking means 'this text came from the ingested repository and might
  contain anything'; this text is authored and verified by this project itself and is not upstream content in that sense).
  A pilot with NO `known_hazards` entries (every pilot except cells/go, today) must behave exactly as before - no change to
  the limitations answer shape or content for any other pilot.
- >-
  NEW TEST tests/mcp/tools/test_product_reference_known_hazards.py: (1) cells/go's live get_product_reference(limitations)
  answer includes the concurrency-hazard text, distinctly framed and not marked untrusted_upstream_content. (2) A synthetic
  manifest with NO known_hazards field produces a limitations answer byte-identical to before this card (no regression for
  the other 31 pilots - construct this via a real manifest fixture, not a mock of the function under test). (3) A synthetic
  manifest with 2 known_hazards entries produces both, in a stable, deterministic order.
- >-
  NEW TEST tests/schemas/test_product_manifest_schema.py (or extend an existing schema-validation test file if one already
  exists for this schema - check first): the schema accepts a manifest with no known_hazards field (today's 31 other pilots,
  unchanged), accepts config/products/cells/go.yaml exactly as this card leaves it, and rejects a known_hazards entry missing
  the required `text` field.
- Run the whole file; it must stay green. Never weaken a check to make it pass.
- >-
  REWORK NOTE (2026-10-24, supervisor, after reviewing commit 8c2d3f0f). Attempt 1 built a correct,
  well-tested merge mechanism inside get_product_reference.py (KnownHazard, known_hazards_from_manifest,
  _with_known_hazards) and proved it end-to-end ONLY by constructing ProductReferenceInputs directly
  from the real manifest + real baked sidecar in tests - the attempt's own report flagged, honestly and
  correctly, that infra/serve_http.py's `_serving_product_reference_inputs` (the function the live server
  actually calls per request) never populates `ProductReferenceInputs.known_hazards` from
  config/products/<family>/<platform>.yaml at all, since known_hazards is pure local, already-committed
  config - no GitHub fetch needed, unlike manifest_text/contributing/agent_guidance/license_document,
  which genuinely do go through infra/fetch_product_reference.py's ingestion-time sidecar. So today, in
  the real running cluster, cells/go's served limitations answer does NOT yet carry the disclosure - this
  card's own closeout claim is not yet true. FIX for attempt 2 (write_paths widened above to cover it):
  in infra/serve_http.py, read config/products/<family>/<platform>.yaml for the deployment's own identity
  (the file is already a committed, local file - no network call, no sidecar involved) and merge its
  known_hazards into whatever ProductReferenceInputs _serving_product_reference_inputs returns via
  known_hazards_from_manifest (attempt 1's own helper, read-only from your side - do not duplicate its
  logic). Apply this merge to EVERY return path of that function, including the None case (construct a
  fresh ProductReferenceInputs with the hazards merged in rather than returning None, so the disclosure
  survives even a missing/failed sidecar - known_hazards is independent local data, not something a
  broken ingestion fetch should be able to suppress) and the fetch_failed placeholder cases (consistent
  with the TC-575-established precedent that limitations is explicitly NOT degraded by a fetch_failed
  sidecar state). Do not change how manifest_text/contributing/agent_guidance/etc. are populated - only
  add the known_hazards merge, as a final step, to this one function's output. NEW/EXTENDED TEST in
  tests/infra/test_serve_http.py: with a real local config/products/cells/go.yaml and NO sidecar file at
  all (simulating a pilot that has never successfully ingested), _serving_product_reference_inputs still
  returns an inputs object whose known_hazards carries the real entry; with a real sidecar present (the
  normal case), the merge still happens; a pilot with no known_hazards field is unaffected either way.
  Then re-confirm cells/go's LIVE limitations answer (via the real serve_http.py code path this time, not
  a hand-constructed ProductReferenceInputs) discloses the hazard.
actions:
- >-
  Add a minimal, project-authored 'known hazard' disclosure mechanism to the product manifest, scoped to this card to cells/go's
  reproduced concurrency crash only.
checks:
- command: >-
    {python} -m pytest tests/mcp/tools/test_product_reference_known_hazards.py tests/schemas/test_product_manifest_schema.py
    -q -rfE
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp/tools/test_product_reference_known_hazards.py tests/schemas/test_product_manifest_schema.py
    tests/mcp/tools/test_product_reference_baked_contract.py tests/deploy/test_pilot_roster.py tests/infra/test_serve_http.py
    -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G3-008
min_tests: 10
network: false
requires:
- python
negative_control:
  mutate: >-
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/products/cells/go.yaml'); s = p.read_text(encoding='utf-8');
    marker = 'known_hazards:'; assert marker in s, 'fix text not found - card and source have diverged, known_hazards must
    be the last top-level key'; p.write_text(s[:s.index(marker)], encoding='utf-8')"
  rationale: >-
    Truncates the file at the known_hazards marker (added as the file's last top-level key, by the card's own instruction),
    stripping the block back out of cells/go's manifest, so the new test asserting the concurrency-hazard text is present
    in its live limitations answer must fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-582/receipt.json
closeout:
- >-
  cells/go's served limitations answer now discloses the real, reproduced concurrent-mutation crash hazard, clearly framed
  as this project's own verified finding; every other pilot's served content is unchanged.
recovery: Re-run from a clean tree.
