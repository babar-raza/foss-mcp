id: TC-546
gate: G3
lane: verification
purpose: >-
  REQ-G3-008 (closure of the independent pre-production review; process audit defect: a cut feature with no published consequence is a hidden defect, and a README that describes a release that no longer exists makes every peer's first hour a misreading). SUCCESSOR OF THE FOUR CUT CARDS: LIMITATIONS RECORD. The supervisor cuts plans TC-526 (Java and Rust fidelity), TC-527 (member-level documentation, Java and C#),
  TC-528 (member-level documentation, the other languages) and TC-531 (re-extraction of the five Java fixtures) from this release as ACCEPTED limitations and supersedes them with this card, so this card carries the one piece of their work that stays in scope: THE DOCUMENTATION OF THE LIMITATION - what each card would have fixed, the measured impact, what a peer sees, and what already tells an agent. Work of the cut cards NOT carried: all extraction code, all fixtures and all data regeneration
  (TC-530 and TC-532 to TC-536 keep their own scope and are re-based by the supervisor). (1) docs/RELEASE.md section 9 "Deferred extraction improvements" (the heading is pinned by tests/deploy/test_release_deferred_extraction.py and by card TC-537, which must keep it) gains four bullets, one per cut card in the existing format `- **TC-nnn** Would have ...`, and, AFTER the bullets, two plain-prose subsections (no bullets: the pinned test counts bullets) `### What tells an agent` (the coverage caveats that already exist) and
  `### Not part of this release` (the mcp-gateway statement and the cluster-only items); the section 8 bullet L-054 is reworded because card TC-543 changed the behaviour it describes (a one-word find_examples query used to return any example whose CODE uses the word; it now needs a title word). (2) tests/deploy/test_release_deferred_extraction.py is re-pinned from six to ten deferred cards. (3) The review ledger: docs/REVIEW_LEDGER.md is GENERATED by scripts/release/build_review_ledger.py, whose data table is the correct
  source; the cut cards carry no ledger row (the ledger tracks the 133 findings L-001..L-133 of the four earlier review rounds; the 85 findings of the pre-production review are tracked by docs/PREPROD_REVIEW.md of card TC-537, which also owns the new `L-134` and later RELEASE.md bullets), so only L-054's accepted reason changes there (its text names the old one-word behaviour, and tests/deploy/test_build_review_ledger.py pins the words "one-word query" and "60%"); the file is regenerated, and `build_review_ledger.py --check` must report 0 OPEN rows and no WARNING (drafter run at main d7b594fd: total 133, FIXED 84, ACCEPTED 49, OPEN 0). (4)
  README.md is rewritten: it still says "seven pilots", that G2 is in progress, that `get_product_reference` and `list_recent_changes` "answer NotAvailable/empty on every live deployment" and lists seven ports, none of which is true (the repository ships a 40-pilot image, `docker-compose.demo.yml` with 40 services on ports 8101 to 8140, and wired sidecars). The new README describes the 40-pilot image, how to pull and run one pilot, how to start a family, the endpoint and readiness paths, the nine tools, the statement that the server has no authentication and no TLS and must stay on a loopback or trusted
  network, and a pointer to RELEASE.md sections 8 and 9 and the review ledger. (5) New offline tests keep the README, RELEASE.md and the ledger consistent with the chart, the compose file and the tool registry. What does NOT change: any code under src/, infra/ or scripts/ other than the one ledger data row, the plans of the cut cards (the supervisor supersedes them), docs/DEPLOYMENT.md, docs/PREPROD_REVIEW.md and the L-134 and later bullets (card TC-537, which the supervisor orders AFTER this card).
depends_on:
- TC-348
- TC-440
- TC-443
- TC-489
- TC-490
- TC-491
- TC-492
- TC-543
write_paths:
- docs/RELEASE.md
- docs/REVIEW_LEDGER.md
- scripts/release/build_review_ledger.py
- tests/deploy/test_build_review_ledger.py
- tests/deploy/test_release_deferred_extraction.py
- tests/deploy/test_readme_matches_release.py
- README.md
satisfies:
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  Read, in full: docs/RELEASE.md (sections 1 to 9; section 7 holds the `docker run` command a peer uses, section 8 the L-nnn bullets in `### Standalone image`, section 9 the six deferred-card bullets), docs/REVIEW_LEDGER.md header and the L-054 row, scripts/release/build_review_ledger.py (the `L-054` `F(...)` row with `accepted=A8(...)`, `release_sections`, `compute`, `post_checks`), tests/deploy/test_release_deferred_extraction.py (every test: `DEFERRED_CARD_IDS`, `SECTION_9_HEADING`, the intro rule - the text before the first `- ` bullet contains "not in this release" and "docs/REVIEW_LEDGER.md" and no `**` -, `test_section_9_has_exactly_six_bullets`
  counts every line of section 9 that starts with `- `, `test_section_9_contains_no_other_bold_card_id`, `test_card_id_has_enough_text_after_it` needs at least 80 characters after the bold id, `test_sections_1_to_8_headings_are_unchanged` matches only `#` and `##` headings so `###` is free), tests/deploy/test_release_known_limitations.py (read only; it needs the bullet `**L-054**` to keep the key phrase `find_examples` and is OWNED by card TC-537: do not edit it), tests/deploy/test_build_review_ledger.py (`test_real_l054_acceptance_states_the_one_word_rule` asserts "one-word query" and "60%" in the reason;
  `test_real_ids_run_from_l_001_to_l_133_in_order`), tests/deploy/test_verified_examples_coverage.py (reads docs/REVIEW_LEDGER.md rows), plans/TC-526.yaml, TC-527.yaml, TC-528.yaml and TC-531.yaml (their purposes hold the measured numbers used below), docker-compose.demo.yml (header), infra/helm/foss-mcp/values.yaml (`ingestion.pilots`), src/foss_mcp/mcp/server.py (`TOOL_DESCRIPTIONS` keys are the nine tool names), and README.md. Never print or log any environment value.
- >-
  docs/RELEASE.md section 9: append four bullets after the existing six, in this order, each a single line starting `- **TC-nnn** Would have ...` with at least 80 characters after the id and the card id bold exactly once in the section. Use these facts and no others. TC-526: Java (3d/java, cells/java, jmap/java, pdf/java, slides/java) - a varargs parameter is dropped (`setPages(int... pages)` is served `setPages()`, 6 of 6 cases measured), generic bounds and `throws` clauses are not shown, public fields are not listed (34 properties of 3d/java such as the Quaternion `x`, `y`, `z`, `w`), no method is marked `static` (none of the 71, 76 and 159 static
  methods counted in three Java pilots) and a getter such as `isIdentity()` is also listed as a property `identity` that reads like a field; Rust (cells/rust, jmap/rust) - no method records its receiver, so cells/rust's 259 associated functions look like its 1,434 methods, the 10 mail methods of jmap/rust's `JmapClient` appear as separate receiver-less function chunks while the type lists 9, and 6 cells/rust chunks are derive boilerplate; the `API-Coverage` line counts types, so no response marks these gaps. TC-527: member documentation for Java and C# (13 pilots: the five Java and the eight .NET pilots) - the first sentence of each member's comment is
  already in the fixtures (pdf/net 3,887 of 4,887 members of the first 300 types, cells/java 2,199 of 2,677, words/net 3,363 of 3,506) but no symbol chunk renders it, and the Javadoc `@param`, `@return`, `@throws` and C# `<param>`, `<returns>`, `<exception>` text is dropped; in 65 blind coding tasks on 13 pilots the served signatures were never wrong (0 in 1,037 calls) but 8 of 13 option, error and format tasks forced a guess and none of the 13 was fully answered; a peer gets signatures without parameter meaning, units, index base or exceptions. TC-528: the same for Python (12 pilots), TypeScript and Node.js (5), Go (3), Rust (2) and C++ (5) - docstring Args, Returns and Raises, TSDoc, godoc, rustdoc and Doxygen text is not served;
  the second `Document.save` call of pdf/python raises FileExistsError because `overwrite` defaults to False, which its docstring states and the index does not; a Python summary wrapped over two lines is served cut mid-sentence and a sentence containing `e.g.` is cut there (cells/go `Cells`). TC-531: the re-extraction of the five Java fixtures at their pinned commits with the fidelity and documentation work, and pdf/java raised from 300 to its whole 1,239 types - the shipped pdf/java index holds 300 of 1,239 types, 193 of those 300 are engine internals (`org.aspose.pdf.engine.xfa.*`, `engine.script.js.interp.*`) and only a third of the type names its README uses can be found (top-3 recall 33 percent); a prototype
  extraction kept 1,239 of 1,239 types and left 4 of 914 README identifiers unresolved; a peer sees the earlier Java data, and for pdf/java a type the README names may be missing.
- >-
  `### What tells an agent` (plain paragraphs, no bullets, after the bullets): the coverage caveat that already exists - every symbol chunk of a partially indexed pilot carries an `API-Coverage:` line (for pdf/java `300 of 1239 types`), `get_symbol` misses carry a `coverage_note`, `search_symbols` and `lookup` misses carry it too (TC-515, TC-520), and `report_index_freshness` returns `indexed_types`, `total_types` and the same note; nothing marks a missing member, a dropped varargs parameter, a missing static mark or missing parameter documentation, so a peer must read the library's source or README for those. `### Not part of this release` (plain paragraph, no bullets): `mcp-gateway`, the nginx reverse proxy of the development cluster
  (it exists only in the cluster, is not in git and routes 14 of the 40 pilots), is NOT part of the release; neither is anything in the Kubernetes chart's cluster install beyond what section 8 already lists under the chart; the standalone image is the release. Also reword the section 8 bullet **L-054** (keep the bold id, the key phrase `find_examples` and at least 80 characters): a `find_examples` query of one or two distinctive words is answered only by an example whose title contains one of them (so `save` no longer returns every example whose code calls Save), a longer question needs 60% of its other words in the example, and every example states in `match_basis` what its coverage number means; the product-family word never counts.
- >-
  scripts/release/build_review_ledger.py and tests: change ONLY the `accepted=A8(...)` reason text of the `L-054` finding to the same new behaviour (keep it an `A8`, keep `check` and `sources`; the words "title" and "60%" must appear, the words "one-word query" need not; the script source must stay free of drive-letter paths and of the word scratchpad, which `test_real_script_source_has_no_machine_path_and_no_scratchpad` pins), then re-pin tests/deploy/test_build_review_ledger.py `test_real_l054_acceptance_states_the_one_word_rule` (keep its name, change its two assertions to "title" and "60%" with a comment naming TC-543 and TC-546) and regenerate docs/REVIEW_LEDGER.md with `python scripts/release/build_review_ledger.py docs/REVIEW_LEDGER.md` (the output is deterministic; commit exactly what the script writes). tests/deploy/test_release_deferred_extraction.py: `DEFERRED_CARD_IDS` gains TC-526, TC-527, TC-528, TC-531 (ten in all, set equality kept); rename `test_deferred_card_ids_are_exactly_the_six` to `..._exactly_the_ten` and `test_section_9_has_exactly_six_bullets` to `..._exactly_ten_bullets` and change their numbers; every other test stays and must pass with the four new bullets.
- >-
  README.md (rewrite; UTF-8, LF, ASCII hyphens, no emojis, about 120 lines; keep the sections `How it works`, `The three ingestion sources` and `Governance and contributing` and the license line as they are true today; remove `Current status`, `What's planned` and the seven-pilot port table). Required content, each as its own short section: (a) what the project is, in two sentences, and that it serves 40 pilots (family and platform pairs, 13 product families: 3d, barcode, cells, email, html, imaging, jmap, note, page, pdf, slides, tex, words) from ONE image; (b) `Run it` - the `docker run` command of docs/RELEASE.md section 7 (pull by digest, `--list`, then `docker run -d --rm --read-only --tmpfs /tmp --memory 256m --cpus 0.5 -p 127.0.0.1:8080:8080 -e FOSS_MCP_PILOT=pdf/net <image>`), wait for `/readyz`, the MCP endpoint `http://127.0.0.1:8080/mcp` (Streamable HTTP), `/healthz` and `/metrics`; the compose file `docker-compose.demo.yml` (`FOSS_MCP_DEMO_IMAGE`, one
  service per pilot, profiles per family and `all`, loopback ports 8101 to 8140, the header of that file is the source); (c) `Security`: the server has no authentication and no TLS - say it with the exact phrase `no authentication` once and the phrase `no TLS` once; plain HTTP, bind to loopback or a trusted network, browser Origins are rejected unless listed in `FOSS_MCP_ALLOWED_ORIGINS`, put a reverse proxy in front for TLS or authentication; (d) `The nine tools` table (the nine names of `TOOL_DESCRIPTIONS`, one line each, true today: lookup, search_docs, search_symbols, get_symbol, list_members, find_examples, get_product_reference, list_recent_changes, report_index_freshness); (e) `What to know before relying on it`: a pointer to `docs/RELEASE.md` sections 8 and 9 and `docs/REVIEW_LEDGER.md`, the per-pilot coverage note, and one sentence that `mcp-gateway` and the Kubernetes install are not part of the release (`docs/DEPLOYMENT.md` is the cluster runbook). No claim about a gate, a card or a status in the README.
- >-
  Tests (offline, deterministic, no skip/xfail/sleep/network/wall-clock; at least 30 tests with the parametrised cases). tests/deploy/test_readme_matches_release.py (NEW; reads README.md, docs/RELEASE.md, docker-compose.demo.yml, infra/helm/foss-mcp/values.yaml, src/foss_mcp/mcp/server.py as text, never imports a module with side effects): `test_the_readme_pilot_count_is_the_charts` (the number of `ingestion.pilots` entries appears in the README as `<n> pilots`), parametrised over the chart's families `test_the_readme_names_every_product_family`, parametrised over the nine tool names `test_the_readme_lists_every_tool` (and nothing in the tool table that is not in `TOOL_DESCRIPTIONS`), `test_the_readme_has_no_stale_phrases` (parametrised: `seven pilots`, `7 pilots`, `G2`, `in progress`, `Known integration gap`, `NotAvailable/empty on every live deployment`, `8082`, `no ingestion job yet`, `7×6`),
  `test_the_readme_docker_run_flags_are_the_release_runbooks` (every `--flag` of the README `docker run -d` line appears in the `docker run -d` line of RELEASE.md section 7), `test_the_readme_states_no_authentication_and_no_tls_once_each`, `test_the_readme_names_the_endpoint_and_probe_paths` (`/mcp`, `/readyz`, `/healthz`, `--list`, `FOSS_MCP_PILOT`), `test_the_readme_compose_facts_match_the_compose_header` (the file exists, the README names `FOSS_MCP_DEMO_IMAGE`, `8101` and `8140`, and both numbers are in the compose header), `test_every_docs_path_the_readme_mentions_exists`, `test_the_readme_points_at_release_sections_8_and_9_and_the_ledger`,
  `test_release_section_9_names_mcp_gateway_as_not_part_of_the_release`, `test_release_section_9_has_the_two_subsections_without_bullets`, parametrised over the four cut cards `test_the_cut_card_bullet_carries_its_measured_numbers` (TC-526: `6 of 6`, `34 properties`, `259`, `1,434`; TC-527: `8 of 13`, `1,037`; TC-528: `FileExistsError`, `e.g.`; TC-531: `1,239`, `193`, `33 percent`), `test_every_cut_card_has_a_plan_file_and_a_bullet`, `test_the_l054_bullet_describes_the_title_rule_and_not_the_old_behaviour` (contains `title`, `60%`, `match_basis`; does not contain `any verified example whose text uses that word`), `test_the_real_ledger_check_is_clean` (import scripts/release/build_review_ledger.py by path, `compute(REPO_ROOT, False)` over the real repository: no OPEN row and `post_checks` empty; the L-054 row's evidence mentions `title`).
- >-
  Run `{python} -m pytest tests/deploy/test_release_deferred_extraction.py tests/deploy/test_build_review_ledger.py tests/deploy/test_release_known_limitations.py tests/deploy/test_verified_examples_coverage.py -q -rfE -p no:cacheprovider` FIRST to see it green. Never delete, skip or xfail a test; the only existing assertions that change are the ones named above. Do not edit tests/deploy/test_release_known_limitations.py (card TC-537 owns it), docs/DEPLOYMENT.md, plans/, project/ or evidence/. Preserve line endings and encoding (LF, UTF-8, no BOM; README.md and docs/RELEASE.md are LF today); commit messages are UTF-8 without a byte-order mark.
actions:
- >-
  Publish what the four cut cards would have fixed, its measured impact, what a peer sees and what already warns an agent, in docs/RELEASE.md section 9, and state that mcp-gateway and the cluster are not part of the release.
- >-
  Reword the L-054 limitation (bullet and ledger reason) to the title rule, rewrite the stale README for the 40-pilot image, and pin README, release notes, compose file, chart and tool registry against each other.
checks:
- command: '{python} -m pytest tests/deploy/test_readme_matches_release.py tests/deploy/test_release_deferred_extraction.py tests/deploy/test_build_review_ledger.py -q -rfE -p no:cacheprovider'
  expect: exit 0
  timeout_seconds: 900
  junitxml: true
  proves:
  - REQ-G3-008
- command: '{python} -m pytest tests/deploy/test_readme_matches_release.py tests/deploy/test_release_deferred_extraction.py tests/deploy/test_build_review_ledger.py tests/deploy/test_release_known_limitations.py tests/deploy/test_verified_examples_coverage.py tests/test_layout.py -q -rfE -p no:cacheprovider'
  expect: exit 0
  timeout_seconds: 1200
  junitxml: true
  proves:
  - REQ-G3-008
min_tests: 30
network: true
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('README.md');s=p.read_text(encoding='utf-8');old='no authentication';assert s.count(old)==1;p.write_text(s.replace(old,'basic authentication'),encoding='utf-8')"
  rationale: >-
    Changes the README's security statement to claim authentication, so the test that the README says "no authentication" and "no TLS" once each fails. A real break of the card's central claim (the README tells the peer what the release is and is not).
evidence:
- evidence/build/G3/TC-546/receipt.json
closeout:
- >-
  docs/RELEASE.md publishes what the four cut cards would have fixed with the measured numbers, what a peer sees, what already tells an agent, and that mcp-gateway and the cluster install are not part of the release; the L-054 bullet and ledger row describe the title rule; README.md describes the 40-pilot image, how to run it and its no-authentication, no-TLS posture; tests pin the three documents against the chart, the compose file and the tool registry.
  The supervisor supersedes TC-526, TC-527, TC-528 and TC-531 with this card as successor once it is accepted, regenerates the ledger and state, and orders TC-537 after it.
recovery: Re-run from a clean tree.
