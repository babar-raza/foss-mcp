id: TC-044
gate: G2
lane: extraction
purpose: Run run_extraction.py's java path for real against pdf/java's actual public
  repository and pin the result as a reproducible offline fixture, exactly as done
  for every other onboarded pilot.
depends_on:
- TC-010
- TC-043
write_paths:
- tests/extraction/test_pdf_java_extraction.py
- tests/fixtures/pdf_java/**
satisfies:
- REQ-G2-024
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 4.7 Redesign: stop depending on `aspose.org`''s private repo for raw
    knowledge — extract it directly instead'
  sha256: 69aa477f81977e0fb19037faa34136c67f06e557075f585ea7b727f4a3882f21
inputs:
- 'run_extraction.py already has a fully generic CLI and API for this, unchanged since
  TC-011: extract_pinned_repository(manifest_path) clones shallowly, extracts, and
  returns an artifact; reduce_fixture(artifact, max_types=300) makes a deterministic,
  size-bounded subset. CLI: `python -m foss_mcp.extraction.run_extraction <manifest>
  <output> [--max-types N]`. Do NOT modify run_extraction.py, package_root.py, or
  any tree-sitter engine file - this card is run-and-pin only.'
- 'The manifest to pass is config/products/pdf/java.yaml (TC-043, already committed)
  - it pins repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-Java, platform: java.'
- Java has NEVER been proven against a real cloned repository through the actual extraction
  entrypoint before (unlike Go/Rust, which had at least shallow synthetic coverage)
  - this is the least-tested tree-sitter language path remaining besides cpp. There
  is a real, meaningful chance this reveals an undiscovered defect, exactly as happened
  with Python's namespace-package gap.
- IF THE LIVE EXTRACTION REVEALS A REAL DEFECT in code outside this card's write_paths
  - STOP, do not commit a broken/empty fixture, and report the exact defect with your
  diagnosis instead of patching a file outside your write_paths. This is the CORRECT
  outcome if it happens, not a failure - multiple prior cards in this project handled
  exactly this situation this way and it worked (a follow-up card gets dispatched
  to fix the real defect, then this card is retried).
- Commit a REDUCED fixture, not the whole surface - representative subset, under about
  2MB. Use the CLI's default --max-types unless the real output needs a smaller cap.
- The test file must run fully OFFLINE against the committed fixture only.
actions:
- Run `python -m foss_mcp.extraction.run_extraction config/products/pdf/java.yaml
  tests/fixtures/pdf_java/api_surface.json` for real (network access is available
  to you for this one-time generation step).
- 'IF it succeeds with real, non-empty content: write tests/extraction/test_pdf_java_extraction.py
  mirroring tests/extraction/test_pdf_go_extraction.py''s structure - the fixture
  parses and has the expected shape; records the exact 40-hex source commit and the
  repository matches the pinned manifest; is non-empty; contains real Java type/symbol
  names and real kind values you actually observed in your own run (do not guess or
  invent names).'
- 'IF it fails or produces a 0-type/empty result: diagnose the real root cause (read
  the actual tree-sitter java grammar/api_surface code path involved), do NOT commit
  anything, and report the defect in full instead - this stops the card honestly rather
  than faking success.'
checks:
- command: '{python} -m pytest tests/extraction/test_pdf_java_extraction.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-024
min_tests: 5
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('tests/fixtures/pdf_java/api_surface.json');p.write_text('{}',encoding='utf-8')"
  rationale: Emptying the pinned fixture must break the suite - a test that passes
    against an empty artifact is asserting the file exists, not that a real extraction
    ran. Same shape as every prior extraction card's falsifier, self-checked end-to-end
    before being persisted.
evidence:
- evidence/build/G2/TC-044/receipt.json
closeout:
- A real extraction ran against the real public pdf/java repo, OR a real defect was
  honestly diagnosed and reported instead of papered over.
- 'If a fixture was committed: it records the exact source commit and matches the
  pinned manifest, and emptying it fails the suite.'
recovery: Re-run from a clean tree; if the live clone/extraction step is not reproducible
  offline, the committed fixture and test are still idempotent from committed content
  alone.
