id: TC-835
gate: G3
lane: storage-retrieval
purpose: >-
  REAL REGRESSION of the originally reported long-sentence bug (LONGQ-001), found and bisected
  2026-11-14 by the TC-834 investigation (first-bad commit c290392a 'chore(release): re-ingest
  pdf/net for TC-747 authored examples'; reproduced at HEAD): on the committed pdf/net data
  `lookup()` of the literal LONGQ-001 sentence now returns a TaskAnswer of three 'partial' 'Key
  Capabilities and API Reference, Part N of 23' chunks with no Installation/Quick Start chunk,
  instead of the honest Miss it returned before (and before the earlier fix, the wrong-chunk flip
  that the comment on `PARTIAL_COVERAGE_THRESHOLD` (search_docs.py ~l.400-411, set above
  0.403166800478466) exists to prevent). Two tests are red because of it:
  tests/mcp/tools/test_search_docs_partial_tier.py::test_longq_001_literal_query_still_a_miss_from_search_docs_alone
  and
  tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py::test_longq_001_real_weighted_coverage_through_the_real_wired_search_docs
  (0.2913575860194603 vs pinned 0.29841659976076695). ROOT CAUSE (measured):
  `relevance.doc_scope_term_weights` computes N and df over DOCUMENTATION **and EXAMPLE** chunks
  (relevance.py ~l.1154-1179), so adding 5 authored `verified_example` chunks (943 -> 948) raised
  the weights of `file` (0.9057 -> 0.9746) and `reference` (0.7963 -> 0.8899); the generic 'Key
  Capabilities' chunks match `convert/file/reference` via title-folding and their best-passage
  coverage rose from 0.403167 to 0.417285, crossing the 0.41 threshold, while the install chunk
  (which lacks `file` and `reference`) fell from 0.298417 to 0.291358. Example chunks are a
  SEPARATE retrieval path (find_examples), they must not move doc-scope IDF for search_docs - and
  every future authored example (P4 corpus growth, TC-825/826/827 and the regeneration) would
  shift the numbers again, so a threshold bump is NOT acceptable (fragile). FIX
  (measurement-gated, root cause): make the doc-scope weights used by search_docs/lookup count
  DOCUMENTATION chunks only (add an explicit scope selector to `doc_scope_term_weights`, e.g. a
  `kinds` argument defaulting to the new documentation-only behaviour for the search_docs call,
  keeping the old DOCUMENTATION+EXAMPLE behaviour reachable only where a caller still needs it -
  grep every caller first, find_examples must be byte-identical in behaviour). Then run the full
  retrieval ratchet set and report before/after for: the LONGQ-001 literal (must be an honest Miss
  from search_docs alone and from lookup, as before c290392a, or, if the new weights make a better
  honest answer, labelled partial with the install/quick-start chunk and every required term -
  never a wrong generic chunk), the round-3 corpus (hit@3 >= 0.85, wrong-confident floors),
  forgiveness, nonsense-miss, sentence-wrapped conformance baselines, search_docs partial-tier
  tests. No ratchet floor may be lowered. The pinned coverage number in
  test_longq_001_real_weighted_coverage_through_the_real_wired_search_docs may be re-pinned ONLY
  to the value you derive from the new documentation-only scope and only with a comment explaining
  the mechanism change (the contract tests - the Miss test and the 'must not flip onto the wrong
  chunk' tests - stay unchanged and must pass).
depends_on:
