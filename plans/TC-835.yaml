  - src/foss_mcp/mcp/tools/relevance.py
  - src/foss_mcp/mcp/tools/search_docs.py
  - tests/mcp/tools/test_relevance_doc_scope_weights.py
  - tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py
  - tests/mcp/tools/test_search_docs_partial_tier.py
  - tests/mcp/tools/test_longq_doc_scope_excludes_examples.py
satisfies:
