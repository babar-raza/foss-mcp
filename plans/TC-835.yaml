source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: relevance.py `doc_scope_term_weights` and every caller (grep), search_docs.py
    (partial tier, PARTIAL_COVERAGE_THRESHOLD comment, `_partial_coverage`, `_doc_vector_fallback`),
    tests/mcp/tools/test_search_docs_partial_tier.py, test_relevance_doc_scope_weights.py and
    _enabled.py, tests/conformance/test_sentence_wrapped_retrieval.py (LONGQ literal),
    docs/DECISION_LOG.md LONGQ entries (grep LONGQ),
    tests/mcp/tools/test_round3_retrieval_corpus.py.
  - >-
    REPRODUCE FIRST on main: the two red tests (record exact output) and `lookup()` of the LONGQ-001
    literal on the committed pdf/net manifests (PowerShell after scripts/toolchain/activate.ps1; the
    TC-834 worker's scripts measure.py and lk.py are in the session scratchpad
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad
    - reuse them). Confirm the root cause by computing the weights with examples excluded.
  - >-
    NEW TEST tests/mcp/tools/test_longq_doc_scope_excludes_examples.py: (a) synthetic lexical
    payload: adding N example chunks does not change doc-scope weights for search_docs; (b) the real
    pdf/net LONGQ-001 literal stays a Miss from search_docs alone regardless of how many synthetic
    example chunks are added to a copy of the payload (a drift guard: add 5, 50 example chunks); (c)
    find_examples's own weighting is unchanged (byte-identical weights for a fixed payload).
  - >-
    Never loosen PARTIAL_COVERAGE_THRESHOLD or any floor. Commit EXACTLY ONE commit (the
    supervisor's negative control reverse-applies the src part). ruff format + ruff check on changed
    files, run the card's check command twice, report real counts. Do NOT use git stash. If
    measurement shows documentation-only scope does NOT restore the contract, stop with NO commit
    and report the measurements.
actions:
  - >-
    Compute doc-scope IDF over documentation chunks only so authored example growth can no longer
    flip LONGQ-001 onto a wrong chunk, with a drift-guard test.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_longq_doc_scope_excludes_examples.py tests/mcp/tools/test_search_docs_partial_tier.py tests/mcp/tools/test_relevance_doc_scope_weights.py tests/mcp/tools/test_relevance_doc_scope_weights_enabled.py tests/mcp/tools/test_search_docs_title_passage_coverage.py tests/mcp/tools/test_search_docs_query_normalization.py tests/mcp/tools/test_nonsense_queries_miss.py tests/mcp/tools/test_relevance_floor.py tests/mcp/tools/test_relevance_idf_synonyms.py tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py tests/conformance/test_sentence_wrapped_retrieval.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 2400
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 150
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/mcp/tools/relevance.py', 'src/foss_mcp/mcp/tools/search_docs.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-835/receipt.json
closeout:
  - >-
    The LONGQ-001 literal is again an honest Miss (or a correct labelled partial) from search_docs
    and lookup on pdf/net, and authored-example growth can no longer move doc-scope weights.
recovery: Re-run from a clean tree.
