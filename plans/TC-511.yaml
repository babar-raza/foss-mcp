id: TC-511
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, findings D-01 / GRR-02 writer side, D-02/GRR-03 writer side, D-05, D-11 items 2, 5, 6 and 8).
  SIDECAR WRITERS AND THE GITHUB CLIENT. Measured by the reviewer against the real code with a scripted GitHub fake (failsim.py) and a real 401:
  (1) infra/fetch_product_reference.py `main` has no try/except and writes NOTHING when any fetch fails (401: the process dies with an uncaught
  HTTPError and the output file is missing); the Helm Job step is `|| true` and the serving pod's init gate waits for that file forever, so a single
  failed fetch leaves the pod in Init:0/1 while the Job reports Complete (the gate exited 124 in the reviewer's repro). The releases fetcher already
  writes an empty `[]` placeholder plus a `.failed` marker, but a bare `[]` is indistinguishable from a truthful empty list (15 pilots really have 0
  releases) and nothing ever reads the marker. (2) Every sidecar is written with a plain `Path.write_text` (infra/fetch_product_reference.py L282,
  infra/fetch_recent_releases.py L198 and L209, infra/verify_package_registry.py L421, infra/verify_product_reference_install.py L104), so a kill
  mid-write leaves a truncated file that crashes serving at start (11 doctored-sidecar cases exit 1). (3) No sidecar records when or for which
  family it was fetched (`fetched_at`, `family`, `platform` are absent; the releases sidecar is a bare list), so staleness and wrong-family files are
  undetectable (pdf/go serves release v0.11.0 20 commits ahead of the indexed commit with no marker). (4) src/foss_mcp/extraction/github_http.py
  retries only HTTP 429 and 403-with-remaining-0 within 120 s: a 401 is not distinguished from any other error, a secondary-limit 403 (`Retry-After`
  with a non-zero remaining) is treated as a permission error and never waited out, 5xx answers and timeouts are never retried, there is no
  jitter, and the client never stops before it hits the limit (a cold 40-pilot install needs about 290 REST calls against 60 per hour
  unauthenticated). (5) fetch_recent_releases.py has the ETag plumbing (`fetch_releases(..., etag=...)`) but `main` never uses it. (6) A release
  record carries no commit information, so `list_recent_changes` cannot say whether a release is in the index (AGT-04/D-05): GitHub's list-releases
  answer carries `target_commitish` (a branch name or a 40-hex sha) and `created_at` with no extra call, and neither is kept. This card changes the
  WRITERS and the CLIENT only: (a) one atomic writer (temp file in the same directory, flush+fsync, `os.replace`) used by all four writers; (b) a
  typed `fetch_failed` placeholder for the product-reference sidecar, written only when no good file exists, plus a `<output>.failed` marker and a
  loud `ERROR` log line, never overwriting good data; (c) additive provenance (`fetched_at` UTC, `family`, `platform`, `source_repository`,
  `source_ref` where known) on every sidecar; the releases sidecar stays a bare JSON list (40 baked files, the loader and about 20 tests depend on
  it) and its provenance goes in a sibling `<output>.meta.json`; (d) the client classification above with injectable sleep/jitter/clock and a
  proactive stop below a remaining-request floor of 5; (e) ETag/If-None-Match on the releases refresh; (f) `target_commitish` and `created_at`
  recorded per release. What does NOT change: serving (infra/serve_http.py, the MCP tools: the tri-state answer, tolerance of corrupt sidecars and
  the wrong-family check are other cards), the Helm chart and docker-compose.yml (the Job tail keeps `|| true`; the init gate bound is TC-512), the
  baked demo-manifests, commit-pinned raw.githubusercontent.com reads (D-11 item 4), the Job parallelism, tags-only repositories, relevance. No
  schema changes: `schemas/` holds only governance schemas and three product-manifest schemas, none describes a sidecar. ORDERING DEPENDENCY: this card
  depends on TC-507 (serving). Today the loader `load_manifest_sidecar` indexes `data["manifest_text"]` and serve_http raises on any malformed sidecar by
  design, so a placeholder WITHOUT those keys would turn an Init:0/1 hang into a CrashLoopBackOff if it landed first. TC-507 degrades any sidecar
  problem, including a top-level `"state": "fetch_failed"` placeholder, a `.failed` marker with no data and a family/platform/repository mismatch, to a
  distinct fetch_failed answer and reads `fetched_at` and `family` from the file. The placeholder below therefore carries the key `state` (what TC-507
  reads) AND the key `status` (the name the review brief used), both equal to `fetch_failed`. The loaders in this card's files are deliberately NOT
  changed and still raise on a placeholder; serving's tolerance is TC-507's job.
depends_on:
- TC-507
- TC-220
- TC-388
- TC-427
- TC-332
- TC-251
- TC-353
