- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  Read, in full: src/foss_mcp/extraction/github_http.py, src/foss_mcp/extraction/github_release_reader.py (`Release`, `_get_json`, `fetch_releases`),
  infra/fetch_product_reference.py (`main`, `build_sidecar`, `load_manifest_sidecar`, `_existing_sidecar_source`), infra/fetch_recent_releases.py
  (`main`, `_sidecar_is_fresh`, `_sidecar_holds_a_list`, `_write_failure_marker`, `load_recent_releases_sidecar`), the `main` of
  infra/verify_package_registry.py (L388-425) and infra/verify_product_reference_install.py, and the tests that pin them:
  tests/extraction/test_github_http.py, tests/infra/test_fetch_product_reference.py, tests/infra/test_fetch_recent_releases.py,
  tests/infra/test_fetch_recent_releases_failure.py, tests/infra/test_verify_package_registry.py, tests/infra/test_verify_product_reference_install.py.
  Note the existing fakes of `fetch_releases` all have the shape `(repository, **kwargs)`, so adding keyword arguments to the call in
  `fetch_recent_releases.main` is safe. Only github_http.urlopen_with_backoff is used by the GitHub readers (verify_package_registry's registry
  checks call urllib directly, only `resolve_tag_commit` goes through the helper). Never print or log any environment value, URL query or token.
- >-
  github_http.py, CLASSIFICATION. Add `class GitHubAuthError(urllib.error.HTTPError)` and `class RateLimited(urllib.error.HTTPError)` (both are
  HTTPError subclasses so every existing `except urllib.error.HTTPError` and `exc.code == 404` branch keeps working), built from the original error
  (same url, code, msg, headers, fp) with the original attached as `__cause__`; `RateLimited` also carries `reset_at: float | None` (epoch
  seconds), `wait_seconds: float | None` and `proactive: bool`. Messages and reprs never contain the Authorization value. In `urlopen_with_backoff`
  (keep every existing parameter and its default; add `jitter=None`, `budget=None`, `min_remaining=DEFAULT_REMAINING_FLOOR` where
  `DEFAULT_REMAINING_FLOOR = 5`; make `sleep` and `now` default to None and resolve them at call time through module-level functions `_sleep`
  and `_now` so tests can monkeypatch them): (1) HTTP 401 raises `GitHubAuthError` at once, no retry, no sleep, classified by the single line
  `if exc.code == 401:`. (2) A rate-limit answer per `rate_limit_wait_seconds` (extend it: a 403 with a `Retry-After` header and a remaining that
  is absent or non-zero is a secondary limit and waits `Retry-After`; the existing cases and results are unchanged, 403 without hints is still None)
  whose wait fits the remaining `max_total_wait` budget (cumulative, as today) sleeps wait + 1 s and retries; a wait that does not fit, or running
  out of attempts, raises `RateLimited` with `reset_at` from `x-ratelimit-reset` when present and `wait_seconds`. So 403 with remaining 0 waits
  only when the reset is at most about 120 s away. (3) HTTP 500/502/503/504 and transient transport failures (`TimeoutError`, `ConnectionError`,
  `http.client.RemoteDisconnected`, and a `urllib.error.URLError` whose `reason` is one of those or `socket.gaierror`; NOT TLS/certificate errors)
  are retried up to `max_attempts` with `delay = min(30.0, 1.0 * 2 ** (attempt - 1) + jitter())` (jitter() in [0,1), default `random.random`),
  counted in the same cumulative budget; on exhaustion the LAST original error is re-raised unchanged (identity preserved). 404, 304, 422 and a
  hint-less 403/429 are raised unchanged on the first attempt exactly as today. (4) PROACTIVE STOP: a small `RateBudget` class (`observe(headers,
  now)`, `check(now, min_remaining)`) holds the last seen `x-ratelimit-remaining` and `x-ratelimit-reset`; after every successful response the
  helper observes the headers; before every request it checks, and when the last remaining was below `min_remaining` and the reset is still in the
  future it raises `RateLimited(proactive=True)` WITHOUT calling the opener; a past reset clears the state; `min_remaining=0` disables it. The
  default budget is a module-level instance, reset-able through `reset_default_budget()`; tests inject their own. (5) Add `failure_reason(exc) ->
  str` returning `auth_failed` for GitHubAuthError, `rate_limited` for RateLimited, `http_<code>` for any other HTTPError, `network` for URLError /
  TimeoutError / ConnectionError / OSError, else `error`; it never includes a message.
- >-
  github_release_reader.py. `Release` gains two trailing fields with default None: `target_commitish: str | None` and `created_at: str | None`,
  filled from the list-releases entry (`entry.get("target_commitish")`, `entry.get("created_at")`, empty string -> None) with NO extra API call, and a
  read-only property `target_commit` returning `target_commitish` when it is exactly 40 lowercase hex characters, else None (a branch name such as
  "main" is NOT a commit; a later card resolves tags to commits). `fetch_releases(repository, *, per_page=100, etag=None, meta=None)`: when `meta`
  (a dict) is given set `meta["etag"]` to page 1's response ETag and `meta["not_modified"] = True` on a 304; return values and the existing
  behaviour without `meta` are unchanged.
- >-
  ATOMIC WRITER. In infra/fetch_product_reference.py add `atomic_write_json(path: Path, doc: object) -> None`: serialise first (a serialisation
  error must leave the old file untouched), write to a `tempfile.mkstemp(dir=path.parent, prefix=".tmp-", suffix=".json")` file, flush and
  `os.fsync`, then `os.replace(tmp, path)`; remove the temp file in a `finally` when anything fails; create no other file; keep the compact
  `json.dumps` separators used today. Replace every `write_text(json.dumps(...))` of a sidecar in infra/fetch_product_reference.py,
  infra/fetch_recent_releases.py (both L198 and L209, plus the new meta file), infra/verify_package_registry.py and
  infra/verify_product_reference_install.py with it. infra/verify_product_reference_install.py imports it from fetch_product_reference (it
  already does `from fetch_product_reference import ...`); infra/fetch_recent_releases.py and infra/verify_package_registry.py each carry their OWN
  identical copy (the convention these modules already state: "duplicated rather than imported so this module stays inside its own write scope").
  Do NOT add a sibling import to those two: tests/infra/test_helm_sidecar_gate.py and tests/deploy/test_snapshot_demo_from_cluster.py load
  fetch_recent_releases.py with `importlib.util.spec_from_file_location` while infra/ is not on sys.path, so a sibling import would break them. A
  test asserts the three definitions are identical (compare `inspect.getsource`). The `.failed` marker text file may keep `write_text`.
- >-
  fetch_product_reference.py, FAILURE AND PROVENANCE. Add the one-line constant `FETCH_FAILED_STATUS = "fetch_failed"`. `main`: wrap
  `build_sidecar` in `try/except Exception`. On failure: (1) write `<output>.failed` containing `<ExceptionClass> <UTC timestamp>` (class name only,
  the same convention as the releases marker); (2) only when the existing output is NOT a good sidecar (absent, unparseable, not an object, or itself
  a placeholder) write `atomic_write_json(output, {"state": FETCH_FAILED_STATUS, "status": FETCH_FAILED_STATUS, "reason": failure_reason(exc),
  "error_class": type(exc).__name__, "fetched_at": <UTC ISO>, "family", "platform", "source_repository", "source_ref"})`, where unknown values are null; a good existing file (an
  object with neither `state` nor `status` equal to `fetch_failed`) is left byte for byte untouched; (3) print one line to stderr that starts with `ERROR ` and names the class, the
  reason, the repository and whether a placeholder was written or a good file kept, never a URL, token or exception message (the existing stdout
  lines stay); (4) `raise SystemExit(1)` (the Job step's `|| true` still keeps the Job green; the failure is now visible in the log and by the marker).
  On success: write the sidecar through `atomic_write_json` with the existing keys plus `fetched_at` (UTC, `...Z` seconds precision), `family` and
  `platform` (identity: `--family` when given, else parsed from an `--output` file name of the exact form `product_reference_<family>_<platform>.json`,
  else null; `platform` keeps its existing meaning) and delete the `.failed` marker. Add an optional `--family`. `_existing_sidecar_source` returns None
  for a placeholder and, so the pin-unchanged skip can never preserve a failure, `main` also refuses to skip while a `.failed` marker exists.
  Add `is_fetch_failed_placeholder(data: object) -> bool` (a dict whose `state` or `status` equals `FETCH_FAILED_STATUS`) and use it in
  `_existing_sidecar_source`, in the good-file test above and in infra/verify_product_reference_install.py. `load_manifest_sidecar` is unchanged (it
  ignores the additive keys of a good sidecar).
- >-
  fetch_recent_releases.py. The sidecar stays a JSON list. New sibling `<output>.meta.json` (helper `releases_meta_path(output)`), written
  atomically after the list: `{"schema": 1, "state": "ok", "fetched_at", "family", "platform", "source_repository", "release_count", "etag"}`;
  `family`/`platform` from optional `--family`/`--platform` else parsed from the `recent_releases_<family>_<platform>.json` file name else null. On a
  failed fetch with NO usable list: write `[]` as today, the `.failed` marker as today, and a meta with `state: "fetch_failed"`, `reason:
  failure_reason(exc)`, `error_class`, `fetched_at`; with a good list: change nothing but the marker (the list and its meta are kept), as today. In
  both cases print an additional stderr line starting `ERROR ` (class, reason, repository, outcome; no URL or token) and keep exit status 0
  (the existing tests call `main()` and expect no exception). ETag: when the existing list is good, the meta holds an `etag` and the file is merely
  stale (older than 24 h) or `--force` is given, call `fetch_releases(repository, etag=<stored>, meta=<dict>)`; when `meta["not_modified"]` is
  set keep the list bytes, refresh the file mtime (`os.utime`) and the meta `fetched_at`, delete the marker, and print `not modified`; otherwise
  write as usual with the new ETag. A call without a stored ETag is a plain `fetch_releases(repository, meta=<dict>)` so the first fetch stores one.
  `_serialize_release` writes `target_commitish` and `created_at` only when not None; `_deserialize_release` reads them with `.get`. The
  meta file has one production reader, this module's own ETag logic; serving does not read it (TC-507 judges the releases sidecar by the list, its release
  URLs and the `.failed` marker, all unchanged). The freshness cache logic and `load_recent_releases_sidecar` are otherwise unchanged.
- >-
  verify_package_registry.py `main` and verify_product_reference_install.py `main`: write through `atomic_write_json` and add `family`, `platform`
  and `fetched_at` (equal to the existing `checked_at` string) to the sidecar; verify_product_reference_install additionally adds
  `source_repository` and `source_ref` from the product-reference inputs it just loaded. `load_package_registry_sidecar` and its four required keys
  are unchanged. A placeholder product-reference sidecar (`is_fetch_failed_placeholder`) makes verify_product_reference_install print `nothing to verify:
  the product reference fetch failed` and exit 0 BEFORE it calls `load_manifest_sidecar`, which would raise on it.
- >-
  EXISTING TESTS TO RE-PIN (change ONLY the named assertions, say why in a comment, never delete, skip or xfail): tests/extraction/test_github_http.py:
  `test_a_wait_that_exceeds_the_budget_re_raises_the_original_error_without_sleeping`, `test_the_total_wait_budget_is_cumulative_across_attempts` and
  `test_after_max_attempts_the_last_rate_limit_error_is_raised` assert `caught.value is <error>`; a terminating rate limit now raises `RateLimited`, so
  assert `isinstance(caught.value, RateLimited)` and `caught.value.__cause__ is <error>` instead (sleep and call-count assertions stay);
  `test_a_500_is_raised_at_once` pinned "5xx is never retried": give the call `jitter=lambda: 0.0`, an opener holding four 500 errors, assert the
  last is raised unchanged, 4 calls and `sleep.delays == [1.0, 2.0, 4.0]`. tests/infra/test_fetch_product_reference.py
  `test_main_writes_the_real_sidecar_json_matching_build_sidecars_return_value`: `written == expected` now has the additive keys, so compare after
  removing `fetched_at`, `family` and `platform` from `written` (and assert `fetched_at` is a `...Z` string). tests/infra/test_verify_package_registry.py:
  add ONE autouse fixture that monkeypatches `github_http._sleep` to a no-op, because tests that raise 5xx/URLError through `resolve_tag_commit` would
  otherwise sleep for real; no assertion changes there.
- >-
  NEW TESTS (all offline and deterministic: injected openers or a monkeypatched `urllib.request.urlopen`, an injected sleep, jitter, clock and budget,
  `monkeypatch.setenv` for the token with a fake value such as `ghp_FAKE...`; no sockets, no real sleep, no skipped or xfailed test).
  tests/extraction/test_github_http_classification.py: `test_401_raises_github_auth_error_once_with_no_sleep`; `test_401_error_never_contains_the_token`;
  `test_403_remaining_zero_with_a_short_reset_waits_then_succeeds`; `test_403_remaining_zero_with_a_reset_over_two_minutes_raises_rate_limited_with_the_reset_time`;
  `test_rate_limited_is_an_http_error_and_keeps_the_original_as_its_cause`; `test_secondary_403_waits_the_retry_after_then_succeeds`;
  `test_secondary_403_with_a_long_retry_after_raises_rate_limited`; `test_plain_403_and_hintless_429_are_raised_unchanged`;
  parametrised over 500, 502, 503, 504 `test_5xx_is_retried_with_exponential_backoff_and_jitter` (jitter fixed at 0.5: sleeps [1.5, 2.5, 4.5]);
  `test_5xx_exhaustion_re_raises_the_last_error_unchanged`; `test_backoff_counts_against_the_total_wait_budget`;
  parametrised over `TimeoutError()`, `ConnectionResetError()`, `URLError(TimeoutError())`, `URLError(socket.gaierror())`
  `test_transient_transport_failures_are_retried_then_succeed`; `test_a_tls_certificate_error_is_not_retried`; `test_404_304_and_422_are_raised_unchanged_with_no_sleep`;
  `test_proactive_stop_raises_before_calling_the_opener_when_remaining_is_below_the_floor`; `test_remaining_equal_to_the_floor_does_not_stop`;
  `test_the_default_floor_is_five`; `test_a_past_reset_clears_the_proactive_state`; `test_min_remaining_zero_disables_the_proactive_stop`;
  `test_independent_budgets_do_not_share_state`; `test_sleep_and_jitter_defaults_are_resolved_at_call_time`;
  `test_secondary_limit_detection_in_rate_limit_wait_seconds`; parametrised `test_failure_reason_names` (7 inputs).
  tests/extraction/test_github_release_commit.py: `test_release_keeps_target_commitish_and_created_at`; `test_target_commit_is_only_a_forty_hex_sha`;
  `test_a_branch_name_is_not_a_commit`; `test_serialisation_omits_the_new_keys_when_none`; `test_an_old_sidecar_entry_loads_with_none`;
  `test_fetch_releases_fills_the_fields_from_the_list_answer_without_an_extra_call` (fake opener counts calls == 1);
  `test_fetch_releases_meta_receives_the_etag`; `test_fetch_releases_meta_flags_a_304`.
  tests/infra/test_sidecar_writers.py: `test_atomic_write_leaves_the_old_file_when_replace_fails_and_no_temp_file_remains`;
  `test_atomic_write_leaves_the_old_file_when_serialisation_fails`; `test_atomic_write_fsyncs_before_replace` (record os.fsync then os.replace order);
  parametrised over the four writer files `test_no_writer_uses_a_bare_write_text_for_a_sidecar` (source assertion: `atomic_write_json` is referenced and
  no match of the regular expression `write_text\(\s*json\.dumps` remains, which also catches the two-line form at fetch_recent_releases.py L209); `test_the_three_atomic_writer_definitions_are_identical`; `test_fetch_recent_releases_loads_without_infra_on_sys_path` (load it with `importlib.util.spec_from_file_location` in a subprocess-free way after removing infra/ from sys.path); `test_failed_product_reference_fetch_with_no_file_writes_the_typed_placeholder`;
  parametrised over 401, 403 with remaining 0 and a one-hour reset, secondary 403 with a long Retry-After, 502, a timeout
