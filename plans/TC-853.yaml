negative_control:
  mutate: 'python -X utf8 -c "import subprocess; paths = [''infra/helm/foss-mcp/values.yaml'', ''config/known_defects/tex__python.yaml'', ''tests/fixtures/tex_python'', ''infra/demo-manifests'']; patch = subprocess.run([''git'', ''show'', ''--format='', ''HEAD'', ''--''] + paths, capture_output=True, check=True).stdout; assert patch.strip(), ''the worker commit changes none of the production paths - the fix is missing''; subprocess.run([''git'', ''apply'', ''-R'', ''--whitespace=nowarn'', ''-''], input=patch, check=True)"

    '
  rationale: Reverse-applies the worker's own commit restricted to this card's production (non-test) paths, i.e. removes the fix itself while keeping the card's new tests; the suite must then fail. Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must therefore commit exactly ONE commit for this card.
