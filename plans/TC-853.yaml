- 'READ FIRST: docs/ROUND2_REVIEW.md rows TEX-PYTHON-* and RD2-258, config/known_defects/tex__python.yaml, plans/TC-561.yaml and plans/TC-847.yaml (the repair/stub history), plans/TC-786.yaml..TC-788.yaml (sidecar ''at the pin'' rule), plans/TC-848.yaml (how a cohort is regenerated; its inputs are your recipe for step 3), scripts/release/regenerate_local.py docstring, infra/fetch_product_reference.py, infra/fetch_recent_releases.py, infra/verify_package_registry.py.'
- 'ENVIRONMENT: PowerShell; run `. E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\scripts\toolchain\activate.ps1` first in every command that uses docker/helm/toolchains. Worktree has no venv: use E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\.venv\Scripts\python.exe with PYTHONPATH set to your worktree root, src and infra. NEVER print GITHUB_TOKEN/GH_TOKEN/GPT_OSS_* values. Clones and scratch work go outside the repository and OneDrive.'
- If the supervisor-pinned scope is too narrow for something you must change, report file + reason and stop; do not edit outside write_paths. Make exactly ONE commit. Report once, leave no container or background process running, delete your scratch clones.
- 'LESSONS FROM TC-849..TC-852 (read before you start; supersede nothing above, they add to it): (1) After the regeneration run tests/mcp, tests/indexing, tests/conformance, tests/config, tests/extraction, tests/release, tests/infra, tests/test_container_build.py and tests/e2e (e2e alone and last) under PowerShell activation (bash activation is a no-op) and fix every STALE DATA PIN you find that is in write_paths, re-pinning only to confirmed real values, never loosening, deleting or skipping an assertion; an out-of-scope break is reported with file + test + what it pins, then stop. (2) Regeneration honestly drops README examples whose run failed or printed nothing (TC-802); if a forgiveness row, recall pair or pinned test depended on one, restore it with an authored example in tests/fixtures/furnished/tex_python/authored_examples.yaml (cap 6, title distinct from every README candidate title or it is silently dropped) with its test tests/indexing/test_authored_examples_tex_python.py, never
  lower a floor. (3) Baked-tree budgets in tests/deploy/test_compact_demo_manifests.py (TREE_BYTES_BUDGET now 50_380_000, MEDIAN_FILE_BYTES_BUDGET 1_140_000) re-pin only upward to the measured value rounded up to the next 10k and report the margin to LEAN_CEILING_BYTES 55_000_000 (never raised by a worker); the 64-dim set in tests/indexing/test_cached_embedding_provider.py is empty and stays empty (tex_python must be 4096-dim); tests/deploy/test_fleet_consistency.py has an all-32-pilots-4096-dim test. (4) The image bakes tests/fixtures/verified_examples at build time: rebuild it (docker build -f Dockerfile.ingestion -t foss-mcp-ingestion:regen-tex .) before a re-run; a re-run with same content-derived id but different content gives ManifestImmutableError - restore that pilot scope from HEAD first. (5) DG-1 baselines (symbol-self-retrieval, sentence-wrapped, example-integrity, index-honesty): remove fixed entries, add only prefix-3 / probe-artefact entries, record a tc853_rationale key with
  per-pilot counts, strict stays true; any other regression class or lost answer stops the card and is reported. (6) Rebuild infra/demo-inputs/embeddings/tex__python.json from the new generation (recipe in plans/TC-601.yaml; it reproduces committed files byte for byte; never fabricate vectors). (7) tests/mcp/tools/test_post_regen_retrieval_ratchets.py stamped-count guard now compares simulated vs committed stamped counts per pilot (equal) - keep it meaningful. (8) If the newest upstream release does not parse and import clean, STOP and report with evidence (BLOCKED_UPSTREAM stays); do not re-pin. (9) Never print or write GPT_OSS_*, GITHUB_TOKEN or GH_TOKEN values. Rerun a single failing test alone before treating it as real.'
