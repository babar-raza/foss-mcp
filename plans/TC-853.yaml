    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: docs/ROUND2_REVIEW.md rows TEX-PYTHON-* and RD2-258,
    config/known_defects/tex__python.yaml, plans/TC-561.yaml and plans/TC-847.yaml (the repair/stub
    history), plans/TC-786.yaml..TC-788.yaml (sidecar 'at the pin' rule), plans/TC-848.yaml (how a
    cohort is regenerated; its inputs are your recipe for step 3),
    scripts/release/regenerate_local.py docstring, infra/fetch_product_reference.py,
    infra/fetch_recent_releases.py, infra/verify_package_registry.py.
  - >-
    ENVIRONMENT: PowerShell; run `.
    E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\scripts\toolchain\activate.ps1` first in every
    command that uses docker/helm/toolchains. Worktree has no venv: use
    E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\.venv\Scripts\python.exe with PYTHONPATH set
    to your worktree root, src and infra. NEVER print GITHUB_TOKEN/GH_TOKEN/GPT_OSS_* values. Clones
    and scratch work go outside the repository and OneDrive.
  - >-
    If the supervisor-pinned scope is too narrow for something you must change, report file + reason
    and stop; do not edit outside write_paths. Make exactly ONE commit. Report once, leave no
    container or background process running, delete your scratch clones.
actions:
  - >-
    Re-pin tex/python to the newest upstream release that parses clean, regenerate every artefact at
    that pin, re-verify and retire the stale disclosure, and report the before/after table.
checks:
  - command: '{python} -m pytest tests/deploy tests/extraction/test_tex_python_extraction.py tests/extraction/test_run_extraction_python_repair.py tests/infra/test_round3_install_sections.py tests/mcp/tools/test_coverage_note.py tests/mcp/tools/test_round3_install_truth.py tests/indexing/test_known_defects_completeness.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 3000
    junitxml: true
    proves:
      - REQ-G3-017
min_tests: 1000
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['infra/helm/foss-mcp/values.yaml', 'config/known_defects/tex__python.yaml', 'tests/fixtures/tex_python', 'infra/demo-manifests']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-853/receipt.json
closeout:
  - >-
    tex/python is served from an upstream commit that parses clean, with the blocked-upstream
    disclosure retired on evidence.
recovery: Re-run from a clean tree.
