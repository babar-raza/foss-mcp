lane: verification
purpose: 'RD2-258 (tex/python, P0): the served index is pinned at upstream commit 181015d2eee3e19f8af3d84e4a932ac84ad47c7c where 35 of 45 source files fail ast.parse (IndentationError), so the pilot is registered BLOCKED_UPSTREAM and carries the TEX-PYTHON-001 disclosure and a syntax-repair extraction (TC-561). The 2026-11-14 triage reproduced that upstream releases 26.11 (de943bc9) and 26.11.1 (07db3203) parse clean: 0 of 59 files fail. Re-pin tex/python to the latest upstream release that parses clean and regenerate it end to end, so users get real tex content instead of a repaired, partly blocked index. Investigation first, in this order: (1) resolve the exact full commit of the latest published release tag (gh api, GITHUB_TOKEN via the env var only), re-confirm by cloning it outside the repo that EVERY .py file under the package root passes `python -m py_compile`/ast.parse and that `import aspose_tex` style imports of the public API work in a clean venv (AGENTS.md: a disclosure is re-verified
  before it is removed or downgraded); if the newest release does not parse or import, stop and report - do not re-pin; (2) find every place the old pin is recorded (git grep 181015d2: infra/helm/foss-mcp/values.yaml, docker-compose.yml, config/known_defects/tex__python.yaml, tests/fixtures/round3_readmes/tex_python/PIN.json, tests/fixtures/furnished/tex_python/pages/_index.md, the product_reference/package_registry/recent_releases sidecars, tests that pin it) and update exactly those that must move; (3) regenerate the extraction fixture with the recipe in plans/TC-847.yaml / TC-559 at the new pin (tests/fixtures/tex_python/api_surface.json: expect as_written_failed to drop to 0 and the repaired-syntax list to be empty; no false stubs), regenerate the furnished page from the README at the new pin (infra/generate_furnished_page.py --source github --pilot tex/python, review the diff by eye), re-fetch the three sidecars AT the new pin with the fetch_*/verify_* scripts and the operator''s GITHUB_TOKEN
  (read TC-786..788 for the ''at the pin'' rule), re-verify the README/authored examples with regenerate_local.py (--only tex_python, image built from your worktree; see TC-848 inputs) and refresh tests/fixtures/verified_examples/tex_python.json and the baked generation; (4) update config/known_defects/tex__python.yaml: TEX-PYTHON-001 is removed (or downgraded to a version-scoped historical note with the re-verification evidence) ONLY if step 1 proved it fixed at the new pin, and any other TEX-PYTHON entry is re-checked against the new pin before it is kept; (5) re-pin tests that legitimately move (tex coverage counts, extraction fixture pins, install sections) to confirmed real values - never loosen a pin. ''No pilot ever gets worse'': compare old vs new with scripts/release/generation_diff.py and answer_diff.py (a lost answer or removed symbol must be explained by upstream genuinely removing it) and report the before/after table.'
