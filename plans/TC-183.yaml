id: TC-183
gate: G2
lane: transport-deployment
purpose: 'Give the ingestion Job the outbound HTTPS it needs, and nothing else. The chart''s only
  internet-capable egress rule is TCP 443 to namespaceSelector {}, which matches pods, not external
  addresses. On a cluster that enforces NetworkPolicy, every external download fails: NuGet
  (api.nuget.org), git fetches of the pinned reference library, and the registries the example
  verifier uses. Measured on the kind cluster on 2026-10-04: DNS resolves api.nuget.org, the HTTPS
  connection times out, and the ingestion Job fails with NU1301. Fix it with least privilege. The
  ingestion Job pods get TCP 443 to any destination. The serving pods keep DNS and same-namespace
  traffic only, and get no internet egress.'
depends_on:
- TC-177
- TC-179
write_paths:
- infra/helm/foss-mcp/templates/networkpolicy.yaml
- infra/helm/foss-mcp/templates/ingestion-job.yaml
- tests/infra/test_helm_chart.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read infra/helm/foss-mcp/templates/networkpolicy.yaml and ingestion-job.yaml in full, and the
  existing tests/infra/test_helm_chart.py. Keep every existing test and assertion except the one
  amended in the next input.'
- 'Amended by the supervisor on 2026-10-04 after the attempt-1 block. test_dns_egress_reaches_only_kube_dns_on_udp_and_tcp_53
  (line 305) asserts exactly one NetworkPolicy document. That counts documents as a proxy for where
  DNS egress lives, and this card splits egress across two policies by design, so the count is wrong
  and must change. Replace it with: take the policies whose podSelector selects the serving pods
  (use the existing _serving and _selects helpers), assert exactly one such policy, and run the
  existing kube-dns and port-53 assertions against that policy''s egress. Do not remove the kube-dns
  or the wide-port-53 assertion.'
- 'Decision recorded by the supervisor: the ingestion internet rule goes in a separate NetworkPolicy
  document, not as a scoped rule inside the shared policy. Kubernetes cannot scope an egress rule to
  a subset of the pods its policy selects, so a rule in the shared policy would reach the serving pods
  too. The separate document selects only app.kubernetes.io/component: ingestion. Policies that select
  the same pod combine by union, so the serving pods still receive no internet rule.'
- 'Label the ingestion Job pods with app.kubernetes.io/component: ingestion in ingestion-job.yaml, in
  the pod template metadata. The serving pods keep their existing labels.'
- 'In networkpolicy.yaml add one egress rule that applies only to pods labelled
  app.kubernetes.io/component: ingestion, allowing TCP 443 to any destination, with an ipBlock of
  0.0.0.0/0. Do not add it to the serving pods. The policy''s podSelector must still select the
  chart''s pods, and the component label is the only thing that distinguishes ingestion from serving,
  so the new rule must be a separate policy document or a clearly scoped rule. Read how the
  NetworkPolicy is structured before deciding, and say which you chose.'
- 'Add a test that renders the chart and asserts: the ingestion pod template carries the component
  label; an egress rule for TCP 443 with an ipBlock of 0.0.0.0/0 exists and is scoped to the
  ingestion component; the serving pods receive no such rule.'
- 'The test must render through helm template with image.tag set. helm is on PATH after activate.ps1.
  It must fail, not skip, when helm is missing.'
actions:
- Read the three files named in write_paths.
- Make the template changes described above.
- Add the test.
- Run the chart test file and report the exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_chart.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 17
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/templates/ingestion-job.yaml');s=p.read_text(encoding='utf-8');p.write_text(s.replace('app.kubernetes.io/component: ingestion','app.kubernetes.io/component: ingestion-off'),encoding='utf-8')"
  rationale: 'Changes the component label on the ingestion pods. The egress rule is scoped by that
    label, so the new test that checks the rule is tied to the ingestion pods must fail. This
    proves the test reads the rendered label and rule, not the template text alone.'
evidence:
- evidence/build/G2/TC-183/receipt.json
closeout:
- The ingestion pods can reach external HTTPS.
- The serving pods still cannot.
- The test checks the rendered policy, not the template text.
recovery: Re-run from a clean tree.
