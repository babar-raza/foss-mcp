id: TC-742
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a ninth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism eight sibling cards already proved for eight other pilots this session (different
  pilots, zero file overlap - do not touch anything any of them touch). Confirmed needing ZERO
  code change: `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads
  `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with README-derived
  candidates, and runs every entry through the exact same `verify_cpp_example` pipeline
  `TC-737`/`TC-739` already proved for `email/cpp`/`slides/cpp`, publishing only the ones that
  pass.

  `pdf/cpp` currently serves only 3 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/pdf__cpp__self_extracted` generation). Its real pinned
  repository is `aspose-pdf-foss/Aspose.PDF-FOSS-for-Cpp` (re-confirm the exact pinned commit
  yourself from `config/products/pdf/cpp.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust
  this card's own citation blindly). The real upstream repository has a genuine `examples/`
  directory of roughly 12 real C++ programs (per this project's own Appendix-C style accounting
  for this pilot - the richest C++ sample set this session has touched) - read enough of the real
  files to pick up to 5 genuinely distinct, valuable operations.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `pdf/cpp` from 3 to AT MOST 8 served examples, not to its own real
  floor (11-30, Appendix C). This card's job is the real, bounded, immediately shippable slice: up
  to 5 new, real, individually-verified authored examples, each passing the real ingestion
  verifier before being trusted to publish.

  VERIFY EACH EXAMPLE YOURSELF - this pilot's real verification toolchain needs a real C++
  compiler/CMake build against the real pinned library source (read `example_verifier.py`'s
  `prepare_cpp_library`/`verify_cpp_example` to confirm exactly what the real pipeline needs; two
  sibling C++ cards this session (`TC-737`/`TC-739`) both found Docker with a real `gcc:13-
  bookworm` + a modern CMake the practical path on this host, and both found a real, subtle trap
  worth repeating here: `CMAKE_BUILD_TYPE=Release` defines `NDEBUG`, silently turning every bare
  `assert()` into a no-op - build and run in Debug mode, or verify your assertions some other way
  that cannot be silently skipped, and confirm this explicitly (e.g. by checking `CMakeCache.txt`'s
  real `CMAKE_CXX_FLAGS_DEBUG` has no `-DNDEBUG`) before trusting any example "passed").
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/pdf_cpp/authored_examples.yaml
  - tests/indexing/test_authored_examples_pdf_cpp.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_cpp/authored_examples.yaml`,
    `tests/fixtures/furnished/email_cpp/authored_examples.yaml`, and `tests/fixtures/furnished/
    slides_cpp/authored_examples.yaml` (three real C++ sibling templates from this same session -
    pick whichever reads closest to what you end up writing) plus `tests/fixtures/furnished/
    cells_rust/authored_examples.yaml`/`tests/indexing/test_authored_examples_cells_rust.py` (the
    general schema/structure convention). Also read `src/foss_mcp/indexing/
    authored_examples.py` in full, `src/foss_mcp/indexing/example_verifier.py`'s C++ functions in
    full, and `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `pdf/cpp`'s real current served example count (3) and real pinned
    repository/commit yourself. Fetch the real upstream `examples/` directory at that exact
    commit and read enough of the real ~12 files to pick up to 5 real, genuinely distinct,
    valuable operations.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm a working C++ toolchain, fetch/build
    the real pinned library, actually compile and RUN each program in Debug mode (never Release -
    see the purpose text's own NDEBUG warning), confirm each one's real output matches what you
    claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `pdf/cpp`'s example-corpus work is complete. If fewer than 5 real
    candidates verify cleanly, submit the real number you got and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for pdf/cpp via the existing
    authored_examples.yaml mechanism, raising its served example count from 3 toward 8.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_pdf_cpp.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/pdf_cpp/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-742/receipt.json
closeout:
  - >-
    pdf/cpp gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 3 toward 8 - real, bounded progress toward its full floor.
recovery: Re-run from a clean tree.
