id: TC-024
gate: G2
lane: foundation
purpose: Author config/products/slides/python.yaml, the first per-pilot product manifest
  for a G2 onboarding, pinning the exact verified upstream repository and the already-decided
  storage_topology.
depends_on:
- TC-003
write_paths:
- config/products/slides/**
- tests/config/test_slides_python_manifest.py
satisfies:
- REQ-G2-004
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 11.2 Family-wise public GitHub distribution — preserved as a required
    outcome, not deferred'
  sha256: 230a252ade7d0c7eaf969af89192636e0905f79b15b780f65ad8797efbe5f427
inputs:
- 'VERIFIED upstream name, re-checked via a fresh anonymous `gh api repos/aspose-slides-foss/Aspose.Slides-FOSS-for-Python`
  read on 2026-09-24 (not reused from an earlier session without re-verifying): aspose-slides-foss/Aspose.Slides-FOSS-for-Python,
  public, default branch main, size ~1050KB. Pin this exact string; do not derive
  it from family/platform - this org''s naming is irregular (pdf/go uses a dash, not
  a dot, elsewhere in this same registry) so a pattern-derived name is not trustworthy.'
- 'storage_topology is ALREADY DECIDED - see docs/DECISION_LOG.md''s ''2026-09-24
  - Storage topology decision generalized to all pilots'' entry: write storage_topology:
  embedded directly. Do not write ''undecided_pending_TC-004'' or run any new topology_spike
  measurement - that decision generalizes structurally to every pilot and re-running
  it would prove nothing new.'
- 'Follow config/products/pdf/net.yaml''s exact shape (schemas/product/product-manifest.schema.json):
  family, platform, repository, schedule (a real cron, e.g. daily at a different hour
  than pdf/net''s 04:00 UTC to avoid every pilot''s ingestion contending for the same
  moment - pick any reasonable distinct hour), storage_topology.'
actions:
- 'Write config/products/slides/python.yaml: family: slides, platform: python, repository:
  aspose-slides-foss/Aspose.Slides-FOSS-for-Python, a real schedule.cron, storage_topology:
  embedded.'
- 'Write tests/config/test_slides_python_manifest.py asserting: the manifest validates
  against schemas/product/product-manifest.schema.json; repository equals the exact
  pinned literal string above (assert the literal, never reconstruct it from family/platform);
  storage_topology equals ''embedded''.'
checks:
- command: '{python} -m pytest tests/config/test_slides_python_manifest.py -q'
  expect: exit 0
  timeout_seconds: 60
  junitxml: true
  proves:
  - REQ-G2-004
min_tests: 3
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('config/products/slides/python.yaml');s=p.read_text(encoding='utf-8');s=s.replace('aspose-slides-foss/Aspose.Slides-FOSS-for-Python','aspose-slides-foss/wrong-repo-name');p.write_text(s,encoding='utf-8')"
  rationale: Corrupting the pinned repository string must break the suite - proves
    the test asserts the real literal rather than something derivable (family/platform)
    that would stay green even if the pin were wrong. Self-checked end-to-end before
    being persisted.
evidence:
- evidence/build/G2/TC-024/receipt.json
closeout:
- config/products/slides/python.yaml exists, validates, pins the exact repository.
- storage_topology is embedded, matching the generalized decision.
- Corrupting the repository string fails the suite.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
