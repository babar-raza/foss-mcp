id: TC-552
gate: G3
lane: verification
purpose: >-
  REQ-G3-005 and REQ-G3-008 (operator decision 2026-10-16: the eight jmap pilots, i.e. the whole jmap family, are
  removed from the product everywhere in the shipped repository; git history is untouched; their upstream repositories
  no longer exist, OWNER-15). THIS CARD IS THE TEXT HALF OF THE REMOVAL; TC-551 removed the pilots, their data and every
  roster and count. What is left after TC-551 is the family's NAME in places that are neither data nor roster: comments
  and docstrings of the extraction engine, the example verifier and build_chunks.py that cite the removed libraries as
  examples, and tests that use the family only as a SYNTHETIC name (a made-up client class, a made-up family of a
  sidecar test, a made-up third pilot of an entrypoint test). The operator's instruction is that nothing shipped keeps
  the name, so this card renames those, changes no behaviour, and adds the permanent guard:
  tests/deploy/test_removed_family_absent.py scans every file git tracks, case-insensitively, and allows the name only
  in the immutable history (plans/, evidence/, ops/, project/, docs/DECISION_LOG.md, docs/REVIEW_LEDGER.md and
  scripts/release/build_review_ledger.py, whose finding texts are the source docs/REVIEW_LEDGER.md is generated from
  byte for byte) and in the one removal sentence of docs/RELEASE.md. Measured by the drafter on main 7af2adb1 with
  TC-551 applied to a scratch copy: 29 tracked files still name the family outside that allowance - 4 under src/ and
  infra/ (comments and docstrings only: api_surface.py 19 lines, example_verifier.py 8, python_surface.py 1,
  infra/build_chunks.py 1; src/foss_mcp/mcp/identity.py is TC-551's), 22 test files and 3 fixture files of
  tests/fixtures/js_mixin_sample - and every rename below was applied and the named tests were run green on the scratch
  copy. What this card does NOT change: any behaviour (the code of src/ and infra/ is byte-identical apart from comment
  and docstring text, proved below), any fixture or manifest of a real pilot, ops/, project/, plans/, evidence/, docs/.
depends_on:
- TC-551
- TC-540
- TC-162
- TC-306
