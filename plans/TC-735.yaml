id: TC-735
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a second real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism `TC-733` uses for `cells/python` (a sibling card, different pilot, zero file overlap -
  do not touch anything `TC-733` touches). Confirmed by direct investigation this needs ZERO code
  change: `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads
  `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with README-derived
  candidates, and runs every entry through the exact same `verify_go_example` pipeline that already
  verifies every other example, publishing only the ones that pass. Three pilots (`cells/cpp`,
  `cells/rust`, `imaging/net`) already use this mechanism today -
  `tests/fixtures/furnished/cells_rust/authored_examples.yaml` is your exact schema/style template
  (adapt its Rust code to real Go, following `LANGUAGE_BY_PLATFORM`'s own `"go": "go"` mapping in
  `src/foss_mcp/indexing/authored_examples.py`).

  `pdf/go` currently serves only 6 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/pdf__go__self_extracted` generation) - its real pinned repository
  is `aspose-pdf-foss/Aspose-PDF-FOSS-for-Go` (re-confirm the exact pinned commit yourself from
  `config/products/pdf/go.yaml` - do not trust this card's own citation blindly). The real upstream
  repository has a genuine `_examples/` directory of roughly 21 real Go programs (per this
  project's own Appendix-C style accounting for this pilot) that `go build ./...` itself normally
  skips (the directory's own name starts with `_`, Go's own convention for excluding it from
  default builds) - these are real candidate PROGRAMS (likely closer to drop-in standalone `main`
  packages than `cells/python`'s unittest-wrapped methods were, but CONFIRM this directly by
  reading several of them yourself, do not assume either way) plus a `testdata/` directory that may
  supply real fixture files some examples need.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `pdf/go` from 6 to AT MOST 11 served examples, not to its own real
  floor (16, Appendix C); closing that floor fully needs the P4 program's own later, larger
  per-language-sample-adapter work (XA14, the Go sample adapter), explicitly out of this card's
  scope. This card's job is the real, bounded, immediately shippable slice: up to 5 new, real,
  individually-verified authored examples, each drawn from real upstream program logic, each
  passing the real ingestion verifier before being trusted to publish.

  PICK UP TO 5 real upstream programs/program-fragments covering genuinely DIFFERENT, valuable
  functionality (not 5 variations on the same feature) - your own judgment, informed by actually
  reading the real ~21 files, not guessed from their names alone. For each: write real, working,
  idiomatic standalone Go that performs the SAME real operation the original program does, with
  real, visible output and/or assertions proving it worked - and then ACTUALLY VERIFY each one
  yourself (fetch the real pinned module, actually build/run the code for real) BEFORE trusting it
  will pass the ingestion pipeline's own verifier; do not write a plausible-looking example and
  hope. If a candidate genuinely needs network/credentials/a real file on disk beyond what a
  self-contained example can supply, skip it honestly rather than forcing it past
  `FORBIDDEN_CODE_PATTERNS`.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/pdf_go/authored_examples.yaml
  - tests/indexing/test_authored_examples_pdf_go.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_rust/authored_examples.yaml` AND
    `tests/indexing/test_authored_examples_cells_rust.py` in full (your exact templates - note the
    test file's own docstring: pure offline well-formedness/symbol-resolution/pinned-commit checks,
    NEVER importing, building or running the example code itself - that is the real ingestion
    verifier's job, which you still must do by hand per the input below). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule it enforces -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, the `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs the real indexed fixture actually
    carries, `library_commit` must be the real 40-hex pinned commit), and `infra/build_chunks.py`'s
    `_load_authored_candidates` to confirm exactly how this sidecar gets picked up and verified.
  - >-
    REPRODUCE FIRST: confirm `pdf/go`'s real current served example count (6) and real pinned
    repository/commit yourself, do not trust this card's own citation. Fetch the real `_examples/`
    directory at that exact commit (via `gh api`) and read enough of the real files to pick up to
    5 real, genuinely distinct, valuable operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: fetch the real pinned Go module at the real
    commit, actually build and run each of your adapted programs, confirm each one's real output
    matches what you claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns
    before committing (check directly against the real regex list in `authored_examples.py`, don't
    guess).
  - >-
    This card does NOT claim `pdf/go`'s example-corpus work is complete - up to 11 served examples
    is real, bounded progress toward its real floor, not the floor itself. Scope your closeout
    accordingly; do not claim P4 or this pilot's XA18 floor is met. If fewer than 5 real candidates
    verify cleanly, submit the real number you got - do not pad with unverified ones.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for pdf/go via the existing
    authored_examples.yaml mechanism, raising its served example count from 6 toward 11.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_pdf_go.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/pdf_go/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file
    (a mismatched hash is exactly the tamper-detection this field exists to catch) - a pure data
    mutation, immune to the lockstep-rename vacuousness class this session's earlier reviews
    found, and it never touches any code path. Confirm by hand that the check files you named
    actually exercise this validation path (run the mutate against your real committed file and
    confirm a real test fails) before trusting it.
evidence:
  - evidence/build/G3/TC-735/receipt.json
closeout:
  - >-
    pdf/go gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 6 toward 11 - real, bounded progress toward its full floor, which remains separately
    open pending the P4 program's own later per-language sample-adapter work.
recovery: Re-run from a clean tree.
