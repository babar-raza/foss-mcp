id: TC-273
gate: G2
lane: storage-retrieval
purpose: 'Fix C5 of the third independent audit (2026-10-08): find_examples'' semantic (BM25) fallback path
  (src/foss_mcp/mcp/tools/find_examples.py) accepts any chunk with a strictly-positive BM25 score as a confident
  match, with no coverage or confidence threshold beyond "not exactly zero." A single shared common word between
  the query and an otherwise-unrelated example chunk (e.g. both mention "page") is enough to produce a
  full-confidence ExampleMatch for a query that has no real relevant example in the corpus at all. This violates
  the audit''s own stated invariant: "a search system that returns something for every query is worse than one
  that honestly misses" - the EXACT-match path (get_symbol-backed) is already precise and is NOT the problem; only
  the semantic fallback''s total absence of a relevance floor is. The fix must independently satisfy three distinct
  properties the audit requires tested separately: (1) a genuinely relevant example, when one exists, is still
  found: (2) retrieval can actually distinguish a relevant chunk from a merely-common-word-overlapping one, not
  just a zero-overlap one; (3) a query with no real relevant example gets an honest NoExampleFound, not a
  confident wrong answer - tested with deliberately unrelated/nonsense queries, not just queries that share zero
  tokens with anything.'
