negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/find_examples.py');s=p.read_text(encoding='utf-8');old='coverage';new='coverage_DISABLED';i=s.rindex(old);s=s[:i]+new+s[i+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: Renames the LAST occurrence of "coverage" in find_examples.py - the real threshold-comparison code,
    not an earlier docstring/comment mention - so the coverage gate this card adds is disabled and every new test
    proving the honest-miss/relevance-floor behavior must fail. Built with plain text, no backslash, using rindex
    so a docstring mention occurring earlier in the file is never what the falsifier accidentally targets (the
    exact vacuous-falsifier mistake TC-261 made and fixed this session).
