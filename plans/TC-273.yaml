source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 4.7 Redesign: stop depending on `aspose.org`''s private repo for raw
    knowledge — extract it directly instead'
  sha256: 69aa477f81977e0fb19037faa34136c67f06e557075f585ea7b727f4a3882f21
inputs:
- 'Read src/foss_mcp/indexing/lexical_index_writer.py''s query_lexical_index() (currently ~line 247-284) and
  src/foss_mcp/mcp/tools/find_examples.py (the whole file, ~96 lines) in full before changing anything. The exact-
  FQN-match branch (backed by get_symbol) is already precise and must be left behaviorally unchanged - this card''s
  fix applies ONLY to the semantic/BM25 fallback branch (the `example_doc_ids`/`query_lexical_index`/`hits` code
  path), which is the only one with no relevance floor.'
- 'Do NOT change query_lexical_index()''s existing signature or return type (list[str]) - it has two OTHER call
  sites (search_docs.py, search_symbols.py) outside this card''s write_paths, and changing its contract would widen
  this card''s blast radius into files it does not own. Instead, refactor its internal BM25 scoring loop into a
  private helper (e.g. `_bm25_scores(payload, query_text) -> list[tuple[float, str]]`) that query_lexical_index()
  itself now calls, and add a NEW, separate public function (e.g. `query_lexical_index_scored(payload, query_text,
  top_k) -> list[tuple[str, float]]`) built on the same helper, that find_examples.py alone uses. This keeps
  query_lexical_index()''s own existing behavior and every other caller byte-for-byte unchanged - prove this by
  running tests/indexing/test_index_writers.py''s full existing suite with zero changes to its pre-existing
  assertions.'
- 'In find_examples.py''s semantic-fallback branch, compute a coverage signal for each candidate: the fraction of
  the QUERY''s own distinct tokens (after this project''s existing `tokenize()` helper - do not invent a new
  tokenizer) that actually appear among the candidate document''s own tokens. Require BOTH a strictly-positive
  BM25 score (already required) AND coverage at or above a threshold you determine empirically, not guessed - see
  the next input for how.'
- 'Determine the coverage threshold empirically: using 3 real, already-ingested pilots'' own lexical indexes (pick
  from existing committed fixtures/generations - do not fabricate a corpus), construct three query categories per
  pilot: (a) a query that clearly names a real symbol/concept with a real verified example in that pilot
  (expected: found, with high coverage); (b) a query built ONLY from one or two very common words that also appear
  in several unrelated real example chunks (the exact "page"-style regression this card exists to close - expected:
  NOT found once your threshold is applied, even though BM25 score alone would be >0 today); (c) a deliberately
  unrelated/nonsense query naming a concept this pilot''s domain has nothing to do with (expected: NOT found,
  honestly, both before and after your change - confirm this was already correct and stays correct, it is not what
  this card fixes). Pick the lowest threshold that keeps (a) passing while making (b) correctly miss, verify against
  all 3 pilots, and record your measured numbers in your report - do not pick a round number you did not test.'
- 'Add a `coverage` field to the `ExampleMatch` dataclass (frozen, so a new field with no default is fine since it
  is only ever constructed inside find_examples.py itself - confirm this via grep before assuming) so the matched
  confidence is inspectable, not silently discarded. The exact-match branch (get_symbol-backed) should report
  coverage=1.0 (it is definitionally exact).'
- 'Update find_examples.py''s own module docstring to honestly state the semantic fallback''s now-real limitation:
  it returns a match only above a measured relevance floor, and returns NoExampleFound rather than a low-confidence
  guess otherwise - this is the audit''s own explicit "does the response contract state uncertainty honestly"
  requirement, and it must be true of the actual code, not just asserted in prose.'
- 'Add tests to tests/mcp/tools/test_retrieval_tools.py proving all three properties independently, using this
  project''s existing per-test synthetic-manifest-construction convention (read the existing find_examples-adjacent
  tests in this file for the pattern - do not invent a different fixture style): (1) a relevant example is still
  found when the query and the right chunk share enough real terms; (2) a query sharing only one or two common
  words with an unrelated chunk, where NO chunk clears the coverage threshold, returns NoExampleFound even though
  the old score>0 check alone would have returned a match (construct this as a direct regression: assert the OLD
  behavior would have wrongly matched, by computing the raw BM25 score is >0, then assert the NEW find_examples()
  call correctly misses); (3) a deliberately unrelated/nonsense query returns NoExampleFound (this should already
  hold before your change too - the test proves it still holds after).'
- 'Add tests to tests/indexing/test_index_writers.py for query_lexical_index_scored() directly: it returns scores
  paired correctly with their doc ids, in the same rank order query_lexical_index() would return for the same
  input, and is capped by top_k identically.'
- 'Run the full existing test_index_writers.py and test_retrieval_tools.py suites with zero changes to any
  pre-existing assertion, then run your own new tests, then the full project suite once, and report honestly. If
  the full-suite run shows some other existing test depended on the old no-threshold fallback behavior (e.g. a
  live e2e test whose query only clears the old score>0 bar), STOP and report exactly which test and why rather
  than guess-fixing or weakening your own new threshold to make it pass.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
- 'REWORK (attempt 2): attempt 1''s fix and empirical threshold (0.6, measured against real coverage ceilings of
  0.500 for false-positive-style queries and 0.667+ for genuinely relevant ones, across 3 real pilots) are correct
  and well-verified - do not weaken or re-derive the threshold. It surfaced one real, genuine conflict rather than
  a bug in the fix: tests/e2e/test_slides_python_live_content.py (now in your write_paths; also touched by TC-277,
  already integrated by the time you read this - confirm your worktree is rebased onto it) has
  test_lookup_composes_the_real_task_answer_for_the_rectangle_question, whose REAL_TASK_QUERY = "how do I insert a
  rectangle into a pptx file" only reaches 0.500 coverage against the one real verified example this pilot
  actually has ("Create a Presentation and Add a Shape", covering add_auto_shape) - numerically identical to the
  false-positive ceiling this card''s fix exists to close, so no threshold can admit this query without readmitting
  that exact bug. The test''s old expectation was built on the over-permissive pre-fix behavior, not a true
  invariant - per the audit''s own explicit priority ("a search system that returns something for every query is
  worse than one that honestly misses"), the test is what must change, not the fix. Reword REAL_TASK_QUERY to a
  realistic task question that genuinely shares enough real terms with the one real verified example this pilot
  has to clear 0.6 coverage honestly (verify the real coverage number yourself against your own real lexical
  index, do not guess a wording and hope) - e.g. something naming "add" + "shape" + "presentation"-style terms
  the real example chunk actually contains, while still reading as a natural user question. Update any other
  assertion in that test depending on the old wording. Re-run that file''s full live suite (a real docker rebuild
  - be patient) and confirm every test in it passes. If no realistic rewording can reach 0.6 against the one real
  example this pilot has, report that explicitly rather than inventing one - that would itself be a different,
  real finding about this pilot''s content coverage.'
actions:
- Read query_lexical_index() and find_examples.py in full before changing anything.
- Add query_lexical_index_scored() as an additive sibling function sharing the existing BM25 math, never changing
  query_lexical_index()'s own contract.
- Empirically measure a coverage threshold against 3 real pilots across the three required query categories.
- Wire the threshold into find_examples.py's semantic fallback only; add the coverage field; update the docstring.
- Add tests for all three required properties; run the full existing suites unchanged, then the full project suite once.
