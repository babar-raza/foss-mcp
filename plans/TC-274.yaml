closeout:
- A public symbol reached only through a re-export chain whose origin module is leading-underscore-prefixed
  carries its real bases/return_type/param_types/docstring/signature, the same as a symbol _module_symbols()
  scans directly - closing the measurement gap TC-265 left for the common "impl module plus package re-export"
  Python packaging convention.
recovery: Re-run from a clean tree.
