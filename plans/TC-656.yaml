negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/known_defects/cells__typescript.yaml'); s = p.read_text(encoding='utf-8'); marker = 'CELLS-TYPESCRIPT-013'; assert marker in s, 'CELLS-TYPESCRIPT-013 literal not found in config/known_defects/cells__typescript.yaml as expected - if your real file differs, anchor your own mutate on your own real id instead and note the substitution in your closeout'; idx = s.find('- id: ' + marker); assert idx != -1, 'the exact entry opener was not found'; end = s.find(chr(10) + '- id: ', idx + 1); segment = s[idx:end] if end != -1 else s[idx:]; s2 = s.replace(segment, '', 1); assert s2 != s, 'removal had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Removes the one real CELLS-TYPESCRIPT-013 entry this card adds. Any test proving this
    specific disclosure surfaces through get_symbol/search_symbols/load_known_defects must fail
    under this mutation; tests of the other 5 pre-existing entries in this same file are
    unaffected.
