id: TC-656
gate: G3
lane: extraction
purpose: >-
  HIGHEST PRIORITY (operator directive, 2026-11-02): a round-3 independent re-audit of this
  project's own already-pushed image (`foss-mcp-serving:demo-cac9288`, commit `cac92881a1ef`)
  found cells/typescript regressed from D to F - a brand-new, severe, undisclosed silent-data-
  loss defect in the real upstream library, independently confirmed by a dedicated investigation
  this supervisor ran before authoring this card: `aspose_cells/workbook.ts`'s `generateWorkbook()`
  builds `xl/workbook.xml`'s `<sheets>` index with exactly two hand-written, unconditional
  `if (this._sheets.worksheets.length > N)` blocks (N=0,1) and NO loop for index >= 2, while the
  SAME file's `writeToZip()` DOES loop over every real worksheet and writes a real
  `xl/worksheets/sheetN.xml` part for each one. Net effect: a 3rd+ worksheet's data is physically
  present in the saved .xlsx zip but never referenced by the one index (`workbook.xml`) any real
  OOXML reader (Excel included) uses to enumerate sheets - it is invisible, with zero exception
  and zero warning, to every consumer of the file. This is confirmed as entirely real (not a
  foss-mcp defect - a defect in the actual upstream `excel-cells` npm package) and genuinely new
  (not covered by any of the 5 existing `config/known_defects/cells__typescript.yaml` entries,
  nor by any round-2 finding - `docs/round2/issues.json` has no cells/typescript issue about this).

  Ledger id: `CELLS-TYPESCRIPT-013` (round-3 audit, `docs/round3/issues.json`, P0,
  category upstream-library-bug). Read that real record yourself before starting - do not take
  this card's own summary on faith.

  Add ONE real `known_defects` entry to `config/known_defects/cells__typescript.yaml`
  (schema: `schemas/product/known_defects.schema.json`, same shape every existing entry in that
  file already uses - read them first, they are your template) disclosing this defect plainly:
  the real failure mode (any workbook saved with 3 or more worksheets silently loses every sheet
  past the 2nd in the written file's own sheet index, though the data is technically present in
  the zip), the real trigger (calling `Workbook.save()` on a workbook with >= 3 worksheets), and
  the safe pattern (do not rely on `save()` for more than 2 worksheets in this version; verify a
  saved file's real sheet count by re-opening it, not by trusting in-memory state). `subject.ref`
  must be the bare type name `Workbook` (the public method is `Workbook.save()`, confirmed from
  `tests/fixtures/cells_typescript/api_surface.json` - its `methods` array lists `save` at line
  390 of `aspose_cells/workbook.ts` as a real public member of the `Workbook` class), matching
  every existing entry's own bare-type-name convention in this same file.

  This is a data-only card: the wiring that surfaces this disclosure through `get_symbol`,
  `search_symbols`, `get_product_reference`, and `report_index_freshness` for the `Workbook` type
  already exists and is already correct (independently re-verified by the supervisor directly
  against the real code before authoring this card - `get_symbol.py`, `search_symbols.py`,
  `get_product_reference.py`, and `report_index_freshness.py` all already call
  `load_known_defects`/`known_defect_lines` correctly). Do not modify any of those four files.
depends_on:
  - TC-645
  - TC-649
write_paths:
  - config/known_defects/cells__typescript.yaml
  - config/known_defects/3d__java.yaml
  - config/known_defects/cells__go.yaml
  - config/known_defects/page__python.yaml
  - config/known_defects/email__net.yaml
  - config/known_defects/pdf__net.yaml
  - tests/indexing/test_known_defects_data_cells_typescript_013.py
  - tests/indexing/test_known_defects_data_cells.py
  - tests/indexing/test_known_defects_completeness.py
  - tests/indexing/test_known_defects_data_3d.py
  - tests/indexing/test_known_defects_data_remaining.py
  - tests/mcp/tools/test_known_defects_round3_siblings.py
satisfies:
  - REQ-G3-015
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-10-30 — Round-2 portfolio audit remediation adopted: unified plan, governance decisions A-K
      recorded (supervisor)
    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST: the real `CELLS-TYPESCRIPT-013` record in `docs/round3/issues.json`. Then the 5
    real, already-committed entries in `config/known_defects/cells__typescript.yaml` (your exact
    template). Then `tests/fixtures/cells_typescript/api_surface.json`'s real `Workbook` type
    entry (confirm `save` is a real public method yourself). If you have real network access,
    confirm directly against the real pinned upstream source
    (`aspose-cells-foss/Aspose.Cells-FOSS-for-TypeScript`, file `aspose_cells/workbook.ts`,
    functions `generateWorkbook()` and `writeToZip()`) that the hardcoded-2-sheet / loops-all-
    sheets asymmetry is real; if you do not have network access, trust this card's own citation
    (already independently verified by the supervisor) but say so plainly in your report.
  - >-
    Write at least 7 tests in `tests/indexing/test_known_defects_data_cells_typescript_013.py`:
    the new entry parses and validates against the real schema; `load_known_defects('cells',
    'typescript')` returns an entry with `id == 'CELLS-TYPESCRIPT-013'` and `subject.ref ==
    'Workbook'`; a real end-to-end test proving `get_symbol(fqn='Workbook')` for the cells/
    typescript scope now surfaces this disclosure (reuse the real end-to-end pattern already
    established in `tests/mcp/tools/test_known_defects_in_get_symbol.py` or
    `tests/indexing/test_known_defects_data_cells.py` - read one first); a real end-to-end test
    proving `search_symbols('save')` or `search_symbols('Workbook')` for the same scope also
    surfaces it; no duplicate id within the file; `verified_at` is a valid calendar date; the
    disclosure text does not claim every save() call fails (only >= 3 worksheets) - this must
    not overstate the defect.
  - >-
    REWORK (attempt 2): your attempt-1 work (the real entry, the 12-test file) is correct and is
    preserved exactly as you wrote it - do not redo it. You correctly found and refused to touch
    a real, out-of-scope defect instead of working around it: `tests/indexing/
    test_known_defects_data_cells.py` (TC-645) and `tests/indexing/test_known_defects_completeness.py`
    (TC-649) were both written on the premise that `docs/round2/issues.json` is the ONLY,
    PERMANENT source of real `category: "upstream-library-bug"` ids a `known_defects` entry may
    ever correspond to - a premise this round-3-sourced entry necessarily breaks. Both files are
    now in your write_paths. Generalize both (a widening of what counts as a real source, never
    a weakening of what either test actually checks - every id must still trace to a real,
    committed audit record, round-2 or round-3, never an invented one):

    1. `test_known_defects_completeness.py`: `_real_upstream_library_bug_ids()` currently reads
    only `docs/round2/issues.json` (a flat list of issue objects). Also read
    `docs/round3/issues.json` (a DIFFERENT real shape - a dict with a `"pilots"` key, each pilot
    an object with its own `"issues"` list; read the file yourself to confirm the exact real
    shape before writing code against it) and union in every one of ITS issues whose `category`
    is also `"upstream-library-bug"`. The completeness assertion's real intent (every such id
    across BOTH committed audit rounds has exactly one entry, no orphans) is unchanged; only the
    source of truth widens from one file to the union of both. Update the `== 47` sanity anchor
    to the real new total you compute (expect 48, confirm directly - do not hardcode a guess).

    2. `test_known_defects_data_cells.py`: `_real_round2_cells_upstream_library_bug_ids()` has the
    identical round-2-only limitation, scoped to the cells family. Widen it the same way (union
    in round-3's cells-family upstream-library-bug ids too). Update `_EXPECTED_COUNTS["typescript"]`
    from `5` to the real new count, and the two hardcoded family totals (`== 12` in two places)
    to the real new total - confirm both numbers directly from the real data, do not guess.

    Neither file's actual assertions (every written id traces to a real audit finding; every real
    finding has exactly one entry; no duplicates) are weakened - only the definition of "a real
    audit finding" widens to cover both committed rounds. Re-run every test in both files (not
    just the ones you expect to be affected) twice to confirm nothing else broke, then re-run
    both of the card's own checks twice each before committing.
  - >-
    REWORK (attempt 3, final): your attempt-2 diagnosis is exactly right and your widened
    completeness logic is correct and is preserved - do not change it again. You correctly found,
    by mechanically applying the literal instruction (never by cherry-picking to make the check
    pass), that round 3 contributes 6 real new `upstream-library-bug` ids project-wide, not the 1
    this card originally assumed, and that 5 of them have no registry entry anywhere:
    `3D-JAVA-014` (3d/java), `CELLS-GO-012` (cells/go), `EML-NET-003` (email/net),
    `PAGE-PYTHON-010` (page/python), `PDF-NET-003` (pdf/net). This card's scope now explicitly
    includes disclosing all 5, using the real evidence already gathered (by this supervisor,
    independently, before this rework) below - the completeness lock's own job is to make this
    kind of gap impossible to miss silently, and it just did exactly that.

    Write_paths now also include `config/known_defects/3d__java.yaml`,
    `config/known_defects/cells__go.yaml`, `config/known_defects/page__python.yaml` (all three
    already exist, add one entry to each, following that file's own existing entries as your
    template) and `config/known_defects/email__net.yaml`,
    `config/known_defects/pdf__net.yaml` (NEITHER exists yet - create both from scratch,
    `schema_version: 1`, `pilot: email_net` / `pilot: pdf_net`, one entry each, matching every
    other file's real structure exactly), plus `tests/indexing/test_known_defects_data_3d.py`
    and `tests/indexing/test_known_defects_data_remaining.py` (both have the identical
    round-2-only `_EXPECTED_COUNTS`/hardcoded-total pattern you already fixed twice elsewhere in
    this card - widen them the same way: `test_known_defects_data_3d.py`'s java count 4->5 and
    total 14->15 two places; `test_known_defects_data_remaining.py`'s page/python count 1->2 and
    total 15->16 two places), plus a new `tests/mcp/tools/test_known_defects_round3_siblings.py`
    for the 2 brand-new pilot files (email/net, pdf/net have NO existing known_defects test
    coverage at all - write fresh tests here rather than shoehorning them into
    `test_known_defects_data_remaining.py`'s own pilot-specific assertions).

    Real entries, each independently confirmed by this supervisor before this rework (verify
    everything yourself anyway - do not simply transcribe this card's own text uncritically):

    - `3D-JAVA-014` (`subject.ref: Scene`, `kind: method`): `Scene.open()` on a valid OBJ file
      throws no exception yet imports 0 meshes/0 geometry - a silent-data-loss import failure,
      the same pattern as this pilot's already-disclosed export bugs.
    - `CELLS-GO-012` (`subject.ref: Worksheet`, `kind: method`): `Worksheet.AddPicture` embeds a
      real, valid image; the saver writes `xl/media/image1.png` and `xl/drawings/drawing1.xml`
      but `sheet1.xml` never emits the `<drawing r:id="..."/>` element its own `.rels` file
      declares, so the picture is orphaned - invisible both to this library's own loader and to
      real Excel. `DataValidation` and `Table` do NOT have this problem on the same API surface.
    - `EML-NET-003` (`subject.ref: MapiMessage`, `kind: method`): `SaveToEml` writes the `Bcc`
      header verbatim into the serialized message with no stripping and no documentation -
      real MTAs strip Bcc before transmission; this library does not, so a caller forwarding the
      raw output over SMTP as-is would leak the Bcc recipient.
    - `PAGE-PYTHON-010` (`subject.ref: PsDocument`, `kind: method`): `PsDocument.create(page_size=
      ...)` is silently ignored by both `to_pdf()` and `to_image()` - output is always rendered at
      the hardcoded default A4 size regardless of what `page_size` names. Root-caused in the real
      source: `page_geometry.py`'s `_DEFAULT_PAGE_SIZE`, `pipeline.py`'s "keep default A4 unless
      explicit DSC size" logic, and `as_bytes()` never emitting a size-carrying DSC comment at all.
    - `PDF-NET-003` (`subject.ref: TableAbsorber`, `kind: method`): a `Table` added to a page with
      no visible border set (no `Border`/`DefaultCellBorder`) is silently invisible to
      `TableAbsorber` - it reports 0 tables found, with no error, even though the table object was
      genuinely added; setting a visible border makes it detected correctly.

    Confirm the real `verified_at` date and each real package/commit version the same way every
    prior entry in this program did (read the real sidecar/manifest for that exact pilot - do not
    reuse a date or version from a different pilot's entry). Re-run EVERY test in every touched
    file (not just the obviously-affected ones) twice, then both of the card's own checks twice,
    before committing. This is the final round for this card - the completeness lock should now
    pass with zero remaining gaps; if it does not, report the exact remaining gap rather than
    weakening the check.
