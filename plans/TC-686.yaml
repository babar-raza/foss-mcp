network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/indexing/symbol_identity.py'); s = p.read_text(encoding='utf-8'); old = 'is_definition=(index == definition_index)'; assert s.count(old) == 1, 'the required literal was not found as expected - if your real code reads differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; p.write_text(s.replace(old, 'is_definition=True', 1), encoding='utf-8')"
  rationale: >-
    Forces every entry in every unit to report is_definition=True, so chunk_builder never thins
    ANY shell to a pointer (every entry looks like a definition to it) and every real alias in the
    fleet renders its old, full-duplicate content - any test proving a real shell is now a thin
    pointer, or that get_symbol/search_symbols dedupe a thinned shell correctly, must fail under
    this mutation; a pilot with no aliases at all is unaffected either way.
evidence:
  - evidence/build/G3/TC-686/receipt.json
closeout:
  - >-
    A re-export/alias chunk is now a thin pointer naming its real definition's canonical id
    (I1's own already-built, pure identity engine, consumed for the first time) instead of a full
    content duplicate; get_symbol and search_symbols both dedupe by that canonical id instead of
    re-parsing rendered content or hashing the whole body - closing I4 and I5 together, verified
    answer-identical across every real alias pair in all 32 pilots, not a sample.
recovery: Re-run from a clean tree.
