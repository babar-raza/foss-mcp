id: TC-686
gate: G3
lane: storage-retrieval
purpose: >-
  I4+I5 combined (index-truth sub-program, section 2.3: "alias pointer chunks" / "consume
  canonical ids in get_symbol/search_symbols"). Carded TOGETHER, deliberately, not split across
  two cards: a documented entanglement (recorded in this project's own memory before this session,
  re-confirmed directly against the real committed code below) makes I4 alone unsafe to integrate
  without I5 landing in the exact same commit - a world where chunk content has been thinned but
  the readers still dedupe by rendered content would silently corrupt real symbol answers on main
  between the two cards' acceptance points, which this project's "no pilot ever gets worse" rule
  forbids even as a transient state.

  CONFIRMED TODAY (supervisor, this session, reading the real code):

  1. `chunk_builder._format_type_text` (`src/foss_mcp/indexing/chunk_builder.py`) already renders
     a Python re-export shell with `members_from=<the real definition entry>`, so `source =
     members_from` and EVERY member section (`Methods:`/`Properties:`/`Members:`/doc/etc.) is
     built from the real definition's own fields - a FULL DUPLICATE of the definition's content,
     not a pointer. `Defined-In: <fqn>` is already added as a marker line alongside this
     duplicate, never instead of it.
  2. `get_symbol._owners` (`src/foss_mcp/mcp/tools/get_symbol.py:266-298`) groups matched chunks
     into "the same type" PRIMARILY by `other == members` - exact equality of
     `_declared_members(chunk.text)`, the member dict re-parsed back out of rendered text - with
     `chunk.is_reexport_shell` (a simple boolean: does `Defined-In:` appear at all) used only as a
     secondary OR-gate for the already-both-empty case. If a shell's content is thinned to a
     pointer with no declared members, `_declared_members` on it returns `{}`, which is NOT equal
     to the real definition's non-empty member dict - `_owners` would then treat the shell as a
     SEPARATE type, producing `len(owners) > 1` and an incorrectly "ambiguous" answer for a symbol
     that has exactly one real definition.
  3. `search_symbols._collapse_aliases` (`src/foss_mcp/mcp/tools/search_symbols.py:1297-1317`) has
     the identical class of problem via a different mechanism: it keys by `(short.casefold(),
     entry.body_hash)` - a hash of the WHOLE rendered chunk body. Thinning a shell's body changes
     its hash, so it would stop collapsing with its definition entirely, surfacing as a spurious,
     near-empty, duplicate "symbol" in search results.
  4. `list_members.py` imports and reuses `get_symbol`'s own resolution machinery directly - it has
     no independent entanglement and inherits whichever fix `_owners` gets, automatically.
     `find_examples.py` has no alias-handling of its own either (confirmed, no matches for
     `is_reexport_shell`/`Defined-In`/`body_hash`/`reexport` in either file).

  THE GOOD NEWS, confirmed by reading `src/foss_mcp/indexing/symbol_identity.py` (I1, `TC-612`,
  already accepted and integrated) in full: the hard part of this problem - deciding when two
  extracted entries are "the same symbol" - is ALREADY SOLVED, pure, deterministic, and tested.
  `compute_canonical_identities(entries)` returns one `SymbolIdentity(canonical_id, aliases,
  is_definition)` per entry, built on top of `chunk_builder._reexport_pairs`/`_slot_units` (the
  real, already-tuned grouping rules TC-382/522/532/541 established) - never re-deriving pairing
  logic. Its own module docstring says explicitly: "This module's later siblings (I2-I5) are what
  will let get_symbol/search_symbols consume the identity this module computes instead of
  re-deriving it from rendered text." This card IS that consumption - I1 built the engine, this
  card wires it to both ends (what chunk_builder renders, and what the two readers match on).
