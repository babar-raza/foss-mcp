- command: '{python} -m pytest tests/deploy/test_demo_entrypoint.py tests/deploy/test_demo_entrypoint_strays.py tests/infra/test_serve_http.py tests/infra/test_serve_logging.py tests/infra/test_serve_manifest_sidecar.py tests/infra/test_serve_stdio.py tests/infra/test_serve_startup_errors.py tests/infra/test_serve_stdio_parity.py tests/test_unwired_modules.py -q -rfE'
  expect: exit 0
  timeout_seconds: 1200
  junitxml: true
  proves:
  - REQ-G3-002
min_tests: 18
network: false
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/demo_entrypoint.py');s=p.read_text(encoding='utf-8');old='def _is_baked_scope(';assert old in s;p.write_text(s.replace(old,'def _is_baked_scopeX(',1),encoding='utf-8')"
  rationale: >-
    Renames the baked-scope test discover_pilots relies on, so no pilot can be discovered: the stray tests and the existing
    entrypoint tests fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-390/receipt.json
closeout:
- >-
  A stray directory can no longer stop the image from restarting, a wrongly-cased pilot name gets a hint, bad settings fail with one clear
  line, and stdio answers exactly like HTTP. Re-run harness checks C16 (stdio parity) and the restart probe on the rebuilt image.
recovery: Re-run from a clean tree.
