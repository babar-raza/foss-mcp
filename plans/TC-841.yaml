id: TC-841
gate: G3
lane: extraction
purpose: >-
  REGEN-A (python + typescript): regenerate the committed extraction fixtures
  `tests/fixtures/<pilot>/api_surface.json` for the 14 pilots of this cohort with the CURRENT
  extractor, at each pilot's pinned commit. Several extractor fixes were merged deliberately
  WITHOUT regenerating fixtures (their cards said 'fixtures are regenerated once per cohort'):
  Java enum constant arguments (TC-689), TypeScript constructor parameter properties (TC-690,
  class JSDoc paragraph TC-821), Python module-level constants (TC-700), try/except and if/else
  imports (TC-674), package-root re-export shells (TC-818), private dataclass init fields
  (TC-819), plus anything else under src/foss_mcp/extraction since the last fixture regeneration
  (`git log --oneline -- src/foss_mcp/extraction tests/fixtures/<pilot>/api_surface.json`). This
  is DATA regeneration only: no code change. Recipe (design record
  C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\regen1_design.md
  section 2 Stage A; plans/TC-559.yaml l.107): for each pilot, with the repo venv python, `python
  -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml
  tests/fixtures/<pilot>/api_surface.json --commit <pin> --keep-names-from
  tests/fixtures/furnished/<pilot>/pages/_index.md --max-types <maxTypes>`; the pin and maxTypes
  come from infra/helm/foss-mcp/values.yaml (`ingestion.pilots[].library.commit` and the pilot's
  max types) and must equal the fixture's current `source_commit` (assert it; the design record
  says all 32 match today). Clone upstream repos shallowly into a temp dir OUTSIDE the repo
  (gh/git; GITHUB_TOKEN is available as an env var - never print it), delete after. Normalise CRLF
  to LF. For each pilot report `git diff --stat` and a per-pilot before/after of: symbol count,
  type count, and a classification of what changed (new symbols, removed symbols - removed symbols
  must be explained or the pilot is a 'worse' blocker -, signature/doc changes) using `python
  scripts/release/generation_diff.py`-style comparison or your own script; NO pilot may lose
  public symbols without a documented cause (private-field removal TC-819, etc.). Then update
  every pinned test that counted the old fixture (tests/extraction/*,
  tests/deploy/test_served_coverage_matches_fixtures.py): re-pin to the new real values keeping
  each assertion's intent, with a comment naming this card; never delete/skip/weaken. If a test
  OUTSIDE write_paths fails because of the new fixtures, stop and report exact test ids and the
  diff cause so the supervisor can widen write_paths.
