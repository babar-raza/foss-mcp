      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST:
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\regen1_design.md
    section 2 Stage A and 6 (risks), src/foss_mcp/extraction/run_extraction.py CLI (`--help`),
    infra/helm/foss-mcp/values.yaml pilot entries, and how an earlier fixture regeneration card did
    it (git log --oneline -- tests/fixtures/<pilot>/api_surface.json; plans/TC-559.yaml,
    plans/TC-729.yaml).
  - >-
    Pilots in this cohort: 3d_python, barcode_python, cells_python, email_python, html_python,
    note_python, page_python, pdf_python, slides_python, tex_python, words_python, 3d_typescript,
    cells_typescript, pdf_typescript. words/net and pdf/java clones are slow: run them with their
    own bounded command; the machine is heavily loaded.
  - >-
    TESTS: before changing anything run `{python} -m pytest tests/extraction -q -p no:cacheprovider`
    and record the baseline; after regenerating, the same suite plus the card's checks must pass
    with only intentional re-pins. Add a test tests/extraction/test_fixture_regeneration_<cohort>.py
    only if it adds a real invariant (e.g. source_commit == pin for every fixture of the cohort);
    otherwise none.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies the fixture diff;
    the re-pinned tests must then FAIL, which they do if they pin the new values). ruff format +
    ruff check on changed Python files; run the card's checks twice; report real counts from junit.
    Do NOT use git stash. Never use PowerShell Set-Content to write repo files (BOM/CRLF) - write
    JSON via python with newline='\n'. Never skip a test.
actions:
  - >-
    Regenerate the python + typescript extraction fixtures with the current extractor at the pinned
    commits and re-pin the tests that counted the old data.
checks:
  - command: '{python} -m pytest tests/extraction tests/deploy/test_served_coverage_matches_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 3000
    junitxml: true
    proves:
      - REQ-G3-017
min_tests: 1000
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['tests/fixtures/3d_python/api_surface.json', 'tests/fixtures/barcode_python/api_surface.json', 'tests/fixtures/cells_python/api_surface.json', 'tests/fixtures/email_python/api_surface.json', 'tests/fixtures/html_python/api_surface.json', 'tests/fixtures/note_python/api_surface.json', 'tests/fixtures/page_python/api_surface.json', 'tests/fixtures/pdf_python/api_surface.json', 'tests/fixtures/slides_python/api_surface.json', 'tests/fixtures/tex_python/api_surface.json', 'tests/fixtures/words_python/api_surface.json', 'tests/fixtures/3d_typescript/api_surface.json', 'tests/fixtures/cells_typescript/api_surface.json', 'tests/fixtures/pdf_typescript/api_surface.json']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-841/receipt.json
closeout:
  - >-
    The python + typescript fixtures reflect the current extractor; every pinned count is re-pinned
    to real data.
recovery: Re-run from a clean tree.
