id: TC-860
gate: G3
lane: verification
purpose: 'RT5 (runtime and contract closure) (plan ''Reconciliation (2026-11-18)'', RT5, REQ-G3-016): ledger closure pass over 10 still-OPEN rows of `docs/ROUND2_REVIEW.md`, continuing the method of TC-777/TC-780/TC-781/TC-782 (read `docs/DECISION_LOG.md`''s four 2026-11-13 entries for the shape). Your rows (re-measure; the register may have shifted): RD2-020 (P2, 3d/net); RD2-079 (P2, cells/net); RD2-093 (P3, cells/python); RD2-154 (P2, imaging/net); RD2-175 (P3, page/python); RD2-216 (P2, pdf/python); RD2-226 (P3, pdf/typescript); RD2-024 (P3, 3d/net); RD2-060 (P3, cells/cpp); RD2-248 (P3, slides/net). Workstream L rows are latency findings (RT1-RT4): the plan''s own contract is FIXED with data or a measured, disclosed limitation; read `docs/DECISION_LOG.md` 2026-11-05 (RT4 measurement: the tail sits in the Cloudflare quick tunnel, OWNER-17) and `infra/hosting/`, and disposition each L row against it - never claim a latency fix you cannot measure; the honest end state for the tunnel tail
  is a RELEASE.md limitation (`L-` id, with its entry in `tests/deploy/test_release_known_limitations.py`''s tuple if that is where the existing limitations are pinned - then that test file is also yours to edit). Workstream K rows are tool-contract rows (RT3): verify the contract change (include_raw_text, confidence, members, reason enum) is live in the tool descriptions and responses, then flip.'
depends_on:
- TC-853
- TC-855
- TC-856
- TC-859
- TC-868
- TC-869
- TC-870
write_paths:
- docs/ROUND2_REVIEW.md
- docs/RELEASE.md
- tests/deploy/test_release_known_limitations.py
satisfies:
