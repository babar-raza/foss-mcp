    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/indexing/authored_examples.py', 'tests/fixtures/furnished/3d_net/authored_examples.yaml', 'tests/fixtures/furnished/3d_typescript/authored_examples.yaml', 'tests/fixtures/furnished/barcode_python/authored_examples.yaml', 'tests/fixtures/furnished/cells_cpp/authored_examples.yaml', 'tests/fixtures/furnished/cells_java/authored_examples.yaml', 'tests/fixtures/furnished/cells_typescript/authored_examples.yaml', 'tests/fixtures/furnished/email_python/authored_examples.yaml', 'tests/fixtures/furnished/page_python/authored_examples.yaml', 'tests/fixtures/furnished/pdf_cpp/authored_examples.yaml', 'tests/fixtures/furnished/pdf_java/authored_examples.yaml', 'tests/fixtures/furnished/pdf_net/authored_examples.yaml', 'tests/fixtures/furnished/pdf_python/authored_examples.yaml', 'tests/fixtures/furnished/pdf_typescript/authored_examples.yaml', 'tests/fixtures/furnished/slides_java/authored_examples.yaml', 'tests/fixtures/furnished/slides_net/authored_examples.yaml', 'tests/fixtures/furnished/words_net/authored_examples.yaml', 'tests/fixtures/furnished/words_python/authored_examples.yaml']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
