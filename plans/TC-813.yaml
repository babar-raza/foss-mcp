id: TC-813
gate: G3
lane: verification
purpose: >-
  Over-long authored-example titles (the ~141 'latent titles' flagged by TC-773, re-measured
  2026-11-14): the tightest conversational frame of
  tests/conformance/test_sentence_wrapped_retrieval.py (`was_wondering`) allows a title of at most
  12 words; every frame then stays within its 12-35 word bound. An exhaustive run over 417 baked
  titled chunks found 37 breaching titles, all authored examples; across the 146 fixture titles 40
  breach (37 baked + 3 in not-yet-baked pilots 3d_net, page_python, words_python) in 17 pilots
  (pdf_typescript and slides_java 5 each); no doc heading breaches (max 11 words). (The '~141' in
  DECISION_LOG was 97 baseline failures + 44 titles and does not reproduce.) Add the structural
  guard `_MAX_TITLE_WORDS = 12` (counted as `len(title.split())`) to
  src/foss_mcp/indexing/authored_examples.py's validator and retitle exactly those 40 titles with
  the investigation's replacements
  (C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\backlog_content\retitles.json:
  all <= 12 words, max rendered sentence 35 words, no duplicates, max Jaccard to any other title
  of the pilot 0.42, identifiers kept). Convert the in-loop word-count assert of
  test_sentence_wrapped_retrieval.py to a soft recorded failure as TC-775 did. The served chunks
  change only at the later coordinated regeneration, so do NOT touch
  baseline_sentence_wrapped_retrieval.json here.
