id: TC-751
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), an eighteenth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism seventeen sibling cards already proved for seventeen other pilots this session
  (different pilots, zero file overlap - do not touch anything any of them touch). Confirmed
  needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates` already
  auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through `verify_python_example`, the exact same
  pipeline `TC-733`/`TC-738`/`TC-750` already proved for `cells/python`/`barcode/python`/
  `slides/python`, publishing only the ones that pass.

  `pdf/python` currently serves only 14 real example chunks (the authoritative count - read
  `payload.stats.examples` directly from the real committed `infra/demo-manifests/
  pdf__python__self_extracted` generation's JSON via `json.load`, NEVER by grepping a literal
  string and counting raw occurrences, which overstates the real count by roughly 2x - a mistake
  made and caught earlier this session). This is the largest remaining real floor gap of any
  pilot with available headroom this session (own floor 20-40, Appendix C). Its real pinned
  repository is `aspose-pdf-foss/Aspose-PDF-FOSS-for-Python` (re-confirm the exact pinned commit
  yourself from `config/products/pdf/python.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust
  this card's own citation blindly).

  Check whether the real upstream repository ships a dedicated `examples/`-style sample directory
  at the pinned commit - CONFIRM this directly yourself rather than assuming (per this project's
  own Appendix-C style accounting for this pilot, it ships none, only tests and ~9 real PDF
  fixture files). If confirmed thin/absent, author examples directly from the real public API
  surface (`tests/fixtures/pdf_python/api_surface.json`) instead, the same approach `pdf/net`'s
  and `pdf/java`'s cards already used successfully this session for sample-thin pilots, and the
  same approach `TC-750`'s own `slides/python` card just used to adapt real upstream `tests/
  test_*.py` suite methods when no dedicated samples existed.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling. This card's job is the real, bounded, immediately shippable slice: up to 5 new, real,
  individually-verified authored examples, each passing the real ingestion verifier before being
  trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/pdf_python/authored_examples.yaml
  - tests/indexing/test_authored_examples_pdf_python.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-10 — real upstream library bug found while authoring cells/typescript examples
    sha256: 8df3a8bfc66641638fb11bd910058364faec2ebd735110b2195366ff985e1812
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/slides_python/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_slides_python.py` (the most relevant same-language sibling template,
    written moments ago this session for a pilot with no upstream samples either). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`,
    `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit, `LANGUAGE_BY_PLATFORM` maps `python` -> `python`), `src/foss_mcp/
    indexing/example_verifier.py`'s `verify_python_example`, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `pdf/python`'s real current served example count (via
    `payload.stats.examples`, not a grep) and real pinned repository/commit yourself. Fetch the
    real upstream repository tree at that exact commit and determine its real shape (samples
    directory, or test-suite/API-surface-derived) before planning your examples.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: install the real pinned package, actually run
    each of your adapted scripts, confirm each one's real assertions pass against real output. Do
    not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `pdf/python`'s example-corpus work is complete - this is this
    session's largest remaining floor gap among pilots with available headroom. If fewer than 5
    real candidates verify cleanly, submit the real number you got and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for pdf/python via the existing
    authored_examples.yaml mechanism, raising its served example count from 14 toward 19.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_pdf_python.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/pdf_python/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-751/receipt.json
closeout:
  - >-
    pdf/python gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 14 toward 19 - real, bounded progress toward its own larger (20-40) floor.
recovery: Re-run from a clean tree.
