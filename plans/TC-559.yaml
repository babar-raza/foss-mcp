source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: (a) the extractor flags a member whose entire body is a not-implemented raise/throw or an empty stub in Python, C#, Java, C++ (`throw std::logic_error("not implemented")`) and TypeScript (`throw
  new Error('not implemented')`); (b) the marker text is one fixed phrase ('not implemented in this build') so tests and agents can rely on it; (c) a symbol whose pilot scope document names it unsupported
  carries the marker (match by name from the documentation chunk, conservative: exact identifier match only); (d) the fixed phrase is the contract with TC-562, which surfaces it in search_symbols and applies
  the limitation-first rule in lookup; (e) no symbol is removed and no currently correct line changes. INDEPENDENT ORACLE: hand-written source snippets per language for the stub detector; the real pins
  (3d/python 734 stubs counted from the upstream source by ast, 3d/net Scene.Render, PolygonModifier) asserted on regenerated data.
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated names: in src/foss_mcp/extraction/tree_sitter_engine/api_surface.py the exact line `STUB_MARKERS_ENABLED = True` (a real switch: when False no
  member is flagged, exactly as before this card) and in src/foss_mcp/indexing/chunk_builder.py the exact line `NOT_IMPLEMENTED_PHRASE = "not implemented in this build"` (the contract phrase that TC-562
  also uses; do not alter its wording). The fixture records a boolean `stub` (with a short `stub_reason`) on a flagged member; the chunk carries the phrase on the member line and in the get_symbol / list_members
  results. (2) Python stubs live in python_surface.py (the body is only `raise NotImplementedError(...)`, `pass`, `...` or a docstring plus one of those); C#, Java, C++ and TypeScript stubs in api_surface.py
  (the bodies named in the acceptance); an abstract method, an interface member, a Protocol member, an `@overload` stub and a `@abstractmethod` are NOT stubs. (3) Unsupported-by-documentation (acceptance
  c): at chunk-build time, read the pilot's furnished scope/limitation page (tests/fixtures/furnished/<family>_<platform>/pages/ - read only, never edit) for identifiers it lists as unsupported or not implemented
  and mark exactly matching member or enum identifiers; conservative: exact identifier match only, never a substring. (4) RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or
  rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop): the pilots whose upstream has stubs or documented-unsupported members are 3d/python,
  pdf/python, 3d/net, words/net, slides/net, slides/cpp, slides/java and cells/cpp. For each run from the repository root `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml
  tests/fixtures/<family>_<platform>/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_<platform>/pages/_index.md --max-types 100000` where <pin> is `ingestion.pilots[].library.commit`
  of infra/helm/foss-mcp/values.yaml (never retype a commit); kept must equal total and the commit must equal the pin; normalise CRLF to LF; the earlier extractor cards (TC-532 to TC-558) have already regenerated
  these fixtures, so the only intended difference is the new `stub` data: show it with `git diff --stat` and report any other change as a defect. words/net needs a long clone: run it as its own command
  with a bounded wait. (5) Real pins to assert on the regenerated fixtures (read by the round-3 audit; verify each against the clone and report any that is wrong): 3d/python has about 734 of 3,743 public
  members with stub bodies (count them with `ast` directly on the cloned source in the test and assert equality); 3d/net `Scene.Render`, `PolygonModifier` and `PdfFormat` carry the marker; pdf/python `HtmlLoadOptions`
  and `SvgLoadOptions` are named unsupported by the scope documentation. (6) Existing tests may pin an old fact: change only such an assertion with the comment `TC-559: <old> -> <new>` and list it with
  its reason; never delete, skip or loosen. tests/fixtures/readme_identifier_allowlist.json only with the helper `python -X utf8 -m tests.extraction.docs_identifiers --write`. If a test outside write_paths
  fails, stop and report its name and the pinned fact. No symbol is removed from the index. (7) TEST COUNTS: min_tests is 24 for EACH check. The first check names only the three new files: you add at least
  24 tests (at least 10 stub-detector tests across the five languages in test_round3_stub_detection.py, at least 8 renderer tests in tests/indexing/test_round3_unsupported_markers.py, at least 6 tool-result
  tests in tests/mcp/tools/test_round3_unsupported_markers.py); the second check collects well over 2,500.
- >-
  PRE-EMPTED OUT-OF-SCOPE PINS (supervisor, 2026-10-19, learned from TC-533, whose worker met eight failures outside its write_paths). A regeneration of your fixtures may legitimately move facts pinned
  by these files, now in your write_paths: tests/extraction/test_reextracted_uncapped.py (chart cap equality, SIZE_FLOOR_BYTES and MEMBER_FLOOR per pilot: re-measure only the pilots of this card, floor
  = measured value rounded down to a round number, comment <card>: <old> -> <new> with the reason), tests/extraction/test_run_extraction_coverage_policy.py, tests/deploy/test_served_coverage_matches_fixtures.py
  (MIN_FUNCTION_ENTRIES and similar non-vacuity floors: set just below the new measured total, still well above zero), tests/deploy/test_served_provenance.py and tests/mcp/tools/test_freshness_provenance.py
  (these compare the BAKED generation with the fixture; the baked data stays stale until the supervisor re-ingests, so for a pilot listed in STALE_BAKED_PILOTS of tests/deploy/test_fleet_consistency.py
  do not assert the fixture-dependent comparison, but keep everything that does not depend on the fixture; never skip, delete or xfail), README.md (only the per-pilot type/function figures that tests/deploy/test_readme_matches_release.py
  compares), and infra/helm/foss-mcp/values.yaml, docker-compose.yml and src/foss_mcp/extraction/run_extraction.py RECOMMENDED_MAX_TYPES ONLY if a measured total no longer equals the one cap number (single-line
  replacements; chart, compose and extractor must carry the same number). Run the wider offline suites (tests/indexing, tests/infra, tests/deploy, tests/mcp and the top-level tests/test_*.py, usual -k filter)
  before you report: ALL must be green, and report each file of this paragraph that you changed with its reason.
actions:
- >-
  Add the unsupported/stub marker to extraction, chunk rendering and the three symbol tools, and the limitation-first rule to lookup.
checks:
- command: >-
    {python} -m pytest tests/indexing/test_round3_unsupported_markers.py tests/mcp/tools/test_round3_unsupported_markers.py tests/extraction/test_round3_stub_detection.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/extraction tests/mcp tests/indexing/test_chunk_builder.py tests/indexing/test_chunk_builder_honesty.py tests/infra/test_build_chunks.py tests/deploy/test_fleet_consistency.py
    tests/deploy/test_served_coverage_matches_fixtures.py tests/deploy/test_compact_demo_manifests.py -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native and not test_prepare_rust_library
    and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 24
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='STUB_MARKERS_ENABLED = True';assert s.count(old)==1;p.write_text(s.replace(old,'STUB_MARKERS_ENABLED = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch of the stub detector, so a member whose whole body is a not-implemented raise or throw is no longer flagged and no symbol carries the fixed phrase 'not implemented in this
    build': the per-language stub-detection tests, the renderer tests and the regenerated-fixture tests (3d/net Scene.Render must carry the marker) fail at once. A real break of the card's claim that unsupported
    capability is marked.
evidence:
- evidence/build/G3/TC-559/receipt.json
closeout:
- >-
  Stub, not-implemented and documented-unsupported symbols are marked wherever they are served, and a question about an unsupported capability finds the limitation first.
recovery: Re-run from a clean tree.
