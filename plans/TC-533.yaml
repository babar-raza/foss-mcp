inputs:
- >-
  ORDER AND FRESHNESS. TC-533 belongs to the strict chain TC-530 -> TC-531 -> TC-532 -> TC-533 -> TC-534 -> TC-535 -> TC-536 (dispatch in id order;
  the cards share infra/helm/foss-mcp/values.yaml, docker-compose.yml, tests/deploy/test_fleet_consistency.py,
  tests/fixtures/readme_identifier_allowlist.json, tests/indexing/test_chunk_builder_honesty.py and tests/extraction/reextraction_checks.py). It runs
  only after the extractor cards TC-520 to TC-528 are merged on main. Everything named below (command-line flags, module constants, fixture keys,
  helper functions, test names of other cards) was written from the specifications of those cards BEFORE they were implemented, and you must verify
  each name against the MERGED code before you rely on it: if a merged name differs, use the merged name and list the difference in your report; if a
  feature a step needs is simply not in the merged code, stop and report it as FAILED_INTERNAL, because src/ is not in your write_paths and you must
  not patch the extractor. Start from a clean tree at the commit the supervisor issues. Never print or log any environment value: the extraction
  clones with git over https and needs no token, and GITHUB_TOKEN is not read by it.
- >-
  READ FIRST (merged code, read only): src/foss_mcp/extraction/run_extraction.py (`main` and its flags `--commit`, `--keep-names-from`, `--max-types`;
  the constants `EXTRACTOR_VERSION`, `RECOMMENDED_MAX_TYPES`, `README_KEEP_FRACTION`; `reduce_fixture`; the keys the artifact carries:
  `extractor_version`, `symbol_counts`, `parse_failures` (TC-520), `counts` (TC-525), and on members `doc`, `params[].doc`, `return_doc`, `throws_doc`
  (TC-527, TC-528)); tests/extraction/docs_identifiers.py (TC-521: `docs_identifiers(pilot)`, `unresolved(pilot)`, `compare(pilot)`,
  `load_allowlist()` and the command `python -m tests.extraction.docs_identifiers --write`); src/foss_mcp/indexing/chunk_builder.py
  (`build_chunks_from_api_surface(fixture, title=..., max_types=...)`, the slot rule of TC-522 and the `API-Coverage:` line of TC-520);
  tests/deploy/test_fleet_consistency.py (TC-513); infra/helm/foss-mcp/values.yaml (`ingestion.pilots[]`: `family`, `platform`, `maxTypes`,
  `library.repository`, `library.commit`); docker-compose.yml (the `ingest-<family>-<platform>` services and their `--max-types` value);
  tests/infra/test_helm_pilots_match_compose.py (the parity rule).
- >-
  RE-EXTRACTION, one pilot at a time. Derive family, platform, pinned commit and cap from the chart and the merged constant, never retype them: the
  pilot key is `<family>_<platform>` (the directory name under tests/fixtures); the commit is `ingestion.pilots[].library.commit` of
  infra/helm/foss-mcp/values.yaml for that pilot; the cap is `RECOMMENDED_MAX_TYPES.get('<family>/<platform>', 300)` read from
  src/foss_mcp/extraction/run_extraction.py. The caps that differ from the default 300 for this card are (TC-520 `RECOMMENDED_MAX_TYPES`, key
  `<family>/<platform>`): pdf_typescript 1250. Read the real values from the merged constant rather than trusting this list. With the toolchain
  activated in the SAME shell command (`scripts/toolchain/activate.ps1`) and `PYTHONPATH=src` set, from the repository root run, for each pilot,
  exactly: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml tests/fixtures/<pilot>/api_surface.json
  --commit <pin> --keep-names-from tests/fixtures/furnished/<pilot>/pages/_index.md --max-types <cap>` (the command of the earlier re-extraction cards
  TC-400 and TC-401 plus the explicit cap; confirm the flags with `--help` first). Never regenerate or edit a furnished page. The command prints
  `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: the commit must equal the pin, and `<kept>` must be the smaller of the cap and
  `<total>` (a Python pilot may keep more than the cap because a re-export and its definition travel together). Runtime measured on 2026-10-15 with
  the pre-merge extractor: 4 to 60 seconds per pilot after the clone; words/net alone needed about 8 minutes for the clone and checkout; the merged
  extractor also parses doc comments, so allow twice that. Run each pilot as its own command, start slow ones in the background and poll with bounded
  waits (never a tail -F monitor on process output), and continue with the next pilot after a failure. If a clone or fetch fails (network, rate limit,
  an unreachable commit) do not retry in a loop: record `gatectl status-append` with BLOCKED_EXTERNAL and the exact resume predicate `git fetch of
  <repo>@<sha> succeeds`, keep every fixture you already regenerated, and stop. The CLI writes with the platform line ending and .gitattributes
  normalises to LF on commit: confirm `git diff --stat` shows each fixture as a content change and not as a whole-file line-ending rewrite.
  pdf_typescript is extracted with `--commit` equal to the chart pin 155bfc7a33f0ba23fb4252b6ba201828b02a5b9d (read it from values.yaml; the current
  fixture says c672b39 and is the thing being corrected); the printed commit must be the pin. Expected: pdf_typescript `1250/<total> types` with
  <total> about 4445 (truncated by design), cells_typescript `130/130`, 3d_typescript `153/153`, jmap_typescript `60/60`, jmap_nodejs `31/31`.
- >-
  CHART AND COMPOSE. For every pilot of this card whose cap differs from the `maxTypes` now in infra/helm/foss-mcp/values.yaml (300 everywhere today),
  set that pilot's `maxTypes` to the cap AND the `--max-types` value of its `ingest-<family>-<platform>` service in docker-compose.yml to the same
  number, with targeted single-line replacements inside that pilot's block or service only (tests/infra/test_helm_pilots_match_compose.py and the
  `two_step_chain` test of tests/infra/test_helm_chart.py compare the rendered chart command with the compose command and fail on any difference).
  Why: infra/build_chunks.py slices the fixture again with `--max-types`, so a 300 there would silently cut what the extraction kept. For this card
  that means pdf_typescript (1250). Every other byte of both files stays as it is, and you do not touch memory limits (the supervisor measures
  ingestion memory at the re-ingest). Pilots at the default cap are left untouched.
- >-
  README IDENTIFIER ALLOWLIST. tests/extraction/test_docs_identifiers_resolve.py (TC-521) fails for a pilot whose committed fixture resolves a
  different set of README-named identifiers than tests/fixtures/readme_identifier_allowlist.json lists, in both directions (a new gap, and a listed
  gap that is fixed). After re-extracting, regenerate the file with the helper only: `python -X utf8 -m tests.extraction.docs_identifiers --write`
  (never by hand), then read `git diff` of that file: only keys of pilots of this card may change. A key of a pilot you did not touch changing means
  the allowlist was already stale at your start commit: stop and report it. For every pilot of this card read the identifiers that remain listed and
  put in your report each one that looks like an API symbol of the library (each is an extraction defect to report, not something to leave allowlisted
  silently); the legitimate remainder is non-API text such as a build tool or a file name.
- >-
  GENERIC TESTS of tests/extraction/test_reextracted_ts.py (NEW, offline, deterministic, no skips; import the helper; parametrised over the module
  list `PILOTS = ['cells_typescript', 'pdf_typescript', '3d_typescript', 'jmap_typescript', 'jmap_nodejs']`; every test id carries the pilot):
  `test_fixture_is_extracted_at_the_chart_pin` (source_commit equals `pinned_commit(key)` and is 40 hex characters),
  `test_fixture_carries_the_current_extractor_keys` (`extractor_version >= REQUIRED_EXTRACTOR_VERSION`; `symbol_counts` is a dict with integer `types`
  and `functions`; when `parse_failures` exists its `engine` is `ast` or `tree-sitter` and `failed`, `total` are integers with failed <= total),
  `test_fixture_is_canonical_json` (the file text equals `json.dumps(data, indent=2, sort_keys=True) + chr(10)`, which is how the CLI writes it),
  `test_fixture_has_no_test_file_entries` (`test_file_entries` is empty), `test_cap_is_one_number_in_extractor_chart_and_compose` (`cap_problems` is
  empty), `test_ingestion_slice_keeps_every_extracted_entry` (`ingestion_slice_problems` is empty), `test_member_docs_reach_the_fixture` (against the
  module dicts `MEMBER_DOC_RATIO_FLOOR[key]` and `PARAM_DOC_FLOOR[key]`, literals YOU measure on the regenerated fixture and print in your report: the
  ratio `members_with_doc / members` rounded DOWN to two decimals and the integer `params_with_doc`; they are ratchets - a later extraction may raise
  them, never lower them), `test_no_description_is_cut_at_an_abbreviation` (`abbreviation_cut_docs` is empty), `test_readme_recall_has_a_floor`
  (against `RECALL_FLOOR[key]`: 0.90 for every pilot whose measured recall reaches it; a pilot that measures below 0.90 gets a floor equal to its
  measured recall rounded DOWN to two decimals AND a non-empty string in `RECALL_EXCEPTION_REASON[key]` that names the identifiers still unresolved
  and why none of them is an API symbol of the library (a build tool such as FetchContent, a file extension) or why the upstream cannot be parsed; if
  any remaining unresolved identifier looks like an API symbol, do not use an exception: report the pilot, its recall and the identifiers, and stop as
  FAILED_INTERNAL), and `test_recall_exceptions_are_real` (a pilot in RECALL_EXCEPTION_REASON really measures below 0.90, so an exception cannot
  outlive its cause). The helper tests/extraction/reextraction_checks.py already exists (created by TC-530): import it and extend it only additively.
  In `test_cap_is_one_number_in_extractor_chart_and_compose` pdf_typescript is the one pilot of this card with `truncated` true.
- >-
  TYPESCRIPT-SPECIFIC TESTS of tests/extraction/test_reextracted_ts.py (same file): `test_pdf_typescript_is_one_commit_with_the_chart_pin` (fixture
  source_commit == values.yaml library.commit == '155bfc7a33f0ba23fb4252b6ba201828b02a5b9d'; reduced_type_count 1250, type_count greater than 1250,
  truncated true; the unmerged extractor counted 4445 types at this commit, record the merged count in your report),
  `test_pdf_typescript_keeps_document_and_page` (the Document and Page entries are in the fixture; `Document.Open` has `static` in its `modifiers` and
  the parameter `opts` has a default), `test_internal_members_are_not_published` (no member `doc` and no type `doc` of any of the five fixtures
  contains `@internal`, `@hidden` or `@ignore`; the Document entry of pdf_typescript has no method named allocObject, replaceObject, markModified or
  installXmpText), `test_interface_properties_are_no_longer_all_read_only` (cells_typescript: at least 90 percent of the properties of entries of kind
  interface_declaration have `writable` true; the entry named `Style` whose kind is interface_declaration (there is also a class_declaration entry of
  that name) has a property `font` that is writable and has `optional` in its `modifiers`), `test_type_aliases_keep_their_value` (no
  type_alias_declaration entry of cells_typescript or pdf_typescript lacks a non-empty `alias_of`; the entry ArrowShapeType of cells_typescript has an
  `alias_of` containing the text `arrow`), `test_jmap_nodejs_client_lists_the_thirteen_mixin_methods` (the entry named JmapClient whose `file` ends
  with src/index.js has methods listMailboxes, getMailbox, createMailbox, deleteMailbox, listMessages, fetchMessage, moveMessage, setMessageKeyword,
  deleteMessage, listIdentities, send, cancelSend and listSubmissions, each with a non-empty `mixin` key naming its mixin; it also lists the methods
  inherited from the core client with `inherited_from`), `test_jmap_nodejs_mailbox_constructor_shows_its_fields` (the Mailbox entry's constructor has
  one object-typed parameter with a `destructured` list whose names include id, name, parentId and role, and the class has properties for those keys),
  `test_jmap_nodejs_class_descriptions_survive` (the share of jmap_nodejs entries with a non-empty `doc` is at least 0.25; it was 3 percent - if the
  merged extractor yields a lower share, report the measured share and the first undocumented exported class, do not lower the number),
  `test_pdf_typescript_and_cells_typescript_readme_recall_is_at_least_90_percent`. Generic 9 x 5 = 45 cases plus at least 9: the file has at least 54
  tests.
- >-
  THE DOCUMENTED GAPS TO FLIP. (1) tests/extraction/test_ts_fixture_gaps.py (TC-523): after the regeneration every TypeScript and JavaScript fixture
  is at or above the required `extractor_version`: delete all five KNOWN_GAP entries (cells_typescript, pdf_typescript, 3d_typescript,
  jmap_typescript, jmap_nodejs; leave `KNOWN_GAP = {}` with its comment) and let the parametrised per-pilot test take its 'at or above' branch. (2)
  tests/extraction/test_docs_identifiers_resolve.py (TC-521): its test `test_jmap_nodejs_mixin_methods_are_a_listed_gap` documents that listMailboxes,
  createMailbox and cancelSend are on the allowlist AND unresolved, and fails the day jmap_nodejs is regenerated: change it to its positive form (the
  three names are resolved by the committed fixture and are NOT on the allowlist) under the same name or a clearly renamed one; that is the intended
  update. The regenerated allowlist must no longer list any of the 13 mixin method names for jmap_nodejs.
- >-
  THE pdf_typescript EXCEPTION STAYS HERE. tests/deploy/test_fleet_consistency.py has COMMIT_EXCEPTIONS['pdf_typescript'], asserted (not skipped)
  while the pilot is inconsistent. After this card the fixture and the chart pin agree, but the BAKED generation in infra/demo-manifests still mixes
  c672b39 symbol chunks with 155bfc7 documentation until the supervisor re-ingests, so `problems_commit` stays non-empty and the exception must NOT be
  deleted in this card (deleting it makes `test_fixture_commit_equals_the_pin_equals_every_source_commit_line` fail for pdf_typescript, because the
  baked Source-Commit lines still mix two commits). Update only the reason string, to say: fixture re-extracted at the pin 155bfc7 by TC-533; the
  baked generation still mixes c672b39 symbols with 155bfc7 documentation until the re-ingest; TC-536 deletes this entry. Deleting the exception in
  the same commit as the re-extraction is not possible without re-baking first: say that in your report. Also add pdf_typescript to STALE_BAKED_PILOTS
  if its coverage lines now disagree with the fixture (they will: type_count 4445 against the baked 5342, 1250 against 300).
- >-
  FLEET CONSISTENCY TRANSITION (tests/deploy/test_fleet_consistency.py, owned by TC-513). The baked generations in infra/demo-manifests are produced
  by the supervisor's re-ingest AFTER the last re-extraction card, so between this card and TC-536 a re-extracted fixture and its old baked generation
  disagree on the API-Coverage line (the fixture's `type_count` and `truncated` change: pdf_net becomes 901 of 901 and not truncated while its baked
  chunks still say `300 of 901 types`), and `test_api_coverage_lines_are_present_and_honest` would fail for a reason that is not a defect. The
  mechanism exists (created by TC-530): `STALE_BAKED_PILOTS` and its three table tests. Add to the table EXACTLY the pilots of this card for which
  `coverage_problems(load_fixture(key), symbols)` is non-empty after your regeneration (run the test first; never list a pilot that is still
  consistent), with a reason string naming this card. UNRESOLVED table: after regenerating, for every pilot of this card that is listed in
  `UNRESOLVED_EXCEPTIONS` set the listed maximum to the new count of the fixture's `unresolved` list (never higher than the old maximum), and delete
  the entry when the count is 0 (the table test `test_every_unresolved_exception_still_applies` fails otherwise); the `unresolved` count of a pilot
  that is not listed must be 0.
- >-
  EXISTING TESTS THAT PIN A FACT OF THE OLD FIXTURES. Before you edit any test, run the second check command and keep the list of failures. For each
  failing test that reads a fixture of this card (the per-pilot tests tests/extraction/test_<pilot>_extraction.py and the reader files named in
  write_paths), change ONLY the assertion that pins an old fact the regeneration legitimately changed - the old source commit, an exact old type
  count, first type or member list, a count that was capped at 300, the string `300 of 901 types`, a slice index into the old ordering, or a defect
  the extractor cards fixed (for example an assertion that a test-file entry or a std trait function is present because the old fixture had it) - to
  the re-extracted fact, with a one-line comment `re-extracted by <this card>: <old> -> <new>`. List every changed assertion with its reason in your
  report. Never delete, skip or xfail a test, never loosen a check that guards a defect (a `>=` floor may be raised, never lowered), and never edit a
  test outside write_paths: if one fails and is not in write_paths, stop and report its name and the pinned fact.
  tests/indexing/test_chunk_builder_honesty.py builds its chunks with `max_types=10_000`, so after a cap is raised its real-fixture tests see the
  whole fixture: re-derive each expected number from the new fixture rather than from memory.
- >-
  KNOWN READERS of the TypeScript and JavaScript fixtures: tests/indexing/test_chunk_builder.py (the real-fixture test that checks pdf_typescript free
  function `A(a: Float32Array, ...) -> number` and the constant `M` with its value is pinned to entries that the new selection at the older commit may
  not keep: re-derive an equivalent real function and constant from the new fixture, keep the intent 'a free function and a constant render with their
  real parameters and value'), tests/indexing/test_chunk_builder_honesty.py (`test_real_jmap_nodejs_has_no_untyped_parameter_remnants`,
  `test_real_pdf_typescript_has_no_double_colon_and_no_repeated_property`, `test_real_pdf_go_and_pdf_typescript_fqns_are_unique`),
  tests/indexing/test_publisher.py, tests/infra/test_ingest_symbol_survival.py (pdf_typescript, jmap_typescript). The
  tests/e2e/test_pdf_typescript_live_content.py constants (REAL_SOURCE_COMMIT c672b39 and REAL_EXAMPLE_SOURCE_COMMIT 155bfc7) are NOT yours:
  docker-only, repinned by TC-536 after the re-ingest.
- >-
  Run the first check command, then the second (twice-identical results are required by the gate; the broad suite is slow under load - start it in the
  background and poll with bounded waits). Commit once with the subject `fix(extraction): re-extract the TypeScript and JavaScript fixtures at their
  pinned commits with the corrected extractor and raised caps (G3/TC-533)` ending with the Co-Authored-By trailer for the model that did the work;
  UTF-8 without a byte-order mark; preserve each file's line endings (LF in git). In your report list: the fixture sizes before and after, the
  measured floors you pinned, every changed assertion of an existing test with its reason, the identifiers still on the allowlist that look like API,
  and the pilots you added to STALE_BAKED_PILOTS. Do NOT edit any src/ file, any furnished page, plans/, project/, ops/, evidence/ or schemas/, and do
  not run an ingestion, docker or a cluster command.
