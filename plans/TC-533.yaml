negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='TS_READONLY_ONLY_WHEN_DECLARED = True';assert s.count(old)==1;p.write_text(s.replace(old,'TS_READONLY_ONLY_WHEN_DECLARED = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch by which an interface property is read-only only when its source says `readonly`, so every interface property is recorded read-only again (the cells/typescript defect,
    724 against 0): the synthetic-source interface test and the regenerated-fixture tests (Style.font must be writable) fail at once.
evidence:
- evidence/build/G3/TC-533/receipt.json
closeout:
- >-
  The three TypeScript fixtures are regenerated with the fixed extractor (extractor_version 5): read-only, optional, static, default and rest marks are faithful, alias bodies and generic bases are intact,
  private-method and inline-object phantom properties are gone, pdf/typescript serves exactly its export surface, and the tests prove each from an independent oracle. Nothing a peer sees changes until the
  supervisor re-ingests.
recovery: Re-run from a clean tree.
