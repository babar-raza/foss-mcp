id: TC-533
gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 and REQ-G3-008 (Round-3 rows RD3-010 to RD3-013; the earlier rows RST-07, RST-04, ISOPROV-02/03/06, AGT-07 TypeScript part, RST-01 pdf/typescript part). TYPESCRIPT EXTRACTION FIDELITY FOR THE
  THREE TYPESCRIPT PILOTS (cells, 3d, pdf; the jmap family no longer exists, so every jmap item of the earlier text is void). The round-3 differential (own oracle: upstream source parsed with the TypeScript
  compiler, `tsc` declaration output, and the pilots' own READMEs) found: (1) cells/typescript and 3d/typescript still serve fixtures of the OLD extractor (no extractor_version): every cells interface property
  is shown read-only (724 against 0 upstream), type-alias bodies are dropped (25 of 25), 768 property types carry a leading colon, 22 static flags, 28 optional parameters and 8 defaults are lost, `this`/iterator
  returns are empty, and `Workbook` lists about 12 of its 21 properties that really belong to private-method return types; 3d/typescript marks static 0 of 56 and optional 0 of 51 (91 static methods, 114
  static properties, 72 defaults, 69 optionals, 20 rest parameters lost): `scene.fromFile("m.obj")` fails `tsc` (TS2576) and `Mesh.createPolygon(...args)` is served as `createPolygon()`. The current extractor
  already reads readonly/optional/static/async tokens (api_surface.py), so for these two the fix is a re-extraction PLUS the new defects below. (2) The extractor harvests properties from the return types
  of PRIVATE methods and from inline object types (cells Workbook; 189 phantom inline-object properties of pdf/typescript). (3) pdf/typescript serves 3,060 function chunks of which 1,941 are not exported
  from the package entry (532 public exports): nearly two thirds of symbol results are internals; only symbols reachable from the entry point's export surface (export_surface in lang/typescript.py) may
  be served. (4) Generic utility-type bases are split at the comma inside the angle brackets (`Omit<StampOptions, 'align'|'rotate'>`): split at top-level commas only. (5) The cells/typescript `password`
  save option is a silent no-op upstream while the signature advertises it: the serving of that limitation is TC-559's marker mechanism; this card only reports, from the clone, whether the upstream source
  says so and where.
