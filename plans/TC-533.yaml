id: TC-533
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-07, RST-04 = ISOPROV-02 = AGT-01, ISOPROV-03 = FK8S-07 = RST-16, ISOPROV-06
  @internal members, AGT-07 TypeScript part, RST-01 pdf/typescript part). RE-EXTRACT THE FIVE TYPESCRIPT AND JAVASCRIPT FIXTURES AND END THE
  pdf/typescript MIXED COMMIT. Measured by the reviewers: 649 of 657 interface properties of cells/typescript and 944 of 948 of pdf/typescript are
  labelled read-only (upstream has 0 and 262 `readonly`), optionality and type-alias values are lost (`ArrowShapeType = 'arrow' | ...` has no
  right-hand side in 25 and 84 aliases), static and async are never marked (`Document.Open` is served as an instance method), parameter defaults are
  dropped, `@internal` members (allocObject, replaceObject, markModified, installXmpText) are served as API, and jmap/nodejs hides 13 of its 20 client
  methods (listMailboxes, getMailbox, createMailbox, deleteMailbox, listMessages, fetchMessage, moveMessage, setMessageKeyword, deleteMessage,
  listIdentities, send, cancelSend, listSubmissions) because they are object-literal mixins applied with Object.assign, and its Mailbox constructor
  shows no parameter. pdf/typescript serves a MIXED index: the fixture and the 300 symbol chunks come from c672b39 (2026-10-09) while the chart pin,
  the product-reference sidecar, 23 documentation chunks and the 4 verified examples are at 155bfc7 (2026-09-23), and the install answer tells an
  agent to build from 155bfc7. THE DECISION OF THIS CARD (drafter's reading of the facts, for the supervisor to confirm): re-extract pdf_typescript AT
  THE CHART PIN 155bfc7 and leave library.commit alone, so the fixture, the pin, the documentation, the examples and the sidecar are one commit.
  Reasons: (1) the install text builds from the pin, so symbols at the pin are the symbols a peer gets; (2) the 4 verified examples were
  compile-verified at the pin and the documentation page is a sealed candidate from the aspose.org subtree
  (tests/fixtures/furnished/pdf_typescript/manifest.json names source_repository Aspose/aspose.org), not a README of the library at c672b39, and the
  generator that builds a page from a README at a commit (infra/generate_furnished_page.py --source github) needs the network and GITHUB_TOKEN and
  would replace the page the verified examples came from, so it is not an offline, deterministic step; (3) moving the pin to c672b39 would also need
  new sidecars and re-verified examples at the new commit (619 files differ between the commits, 897 fewer types exist at the pin: 4445 against 5342);
  (4) all 35 API tokens the older documentation and examples use still exist at c672b39, so nothing true is lost for the documentation, only newer
  types leave the index. Advancing the pin is a separate, atomic data change for a later card. A prototype extraction on 2026-10-15 at 155bfc7 with
  the unmerged extractor kept 4445 of 4445 types with every one of the 48 README identifiers resolving. This card regenerates cells_typescript,
  pdf_typescript (at 155bfc7), 3d_typescript, jmap_typescript and jmap_nodejs with the merged extractor (TC-520 selection, TC-521 mixins and
  destructured constructors, TC-523 TypeScript fidelity, TC-527 and TC-528 member documentation), raises pdf_typescript to 1250 types in the extractor
  call, the chart and docker-compose, empties the TypeScript KNOWN_GAP table, regenerates the allowlist and turns the documented jmap_nodejs gap into
  a positive test. It does NOT delete COMMIT_EXCEPTIONS['pdf_typescript'] (see below), and it does not change src/, any furnished page, values.yaml
  `library.commit`, infra/demo-manifests or sidecars.
