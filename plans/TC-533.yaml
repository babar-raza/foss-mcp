source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md rows RD3-010 to RD3-013 and section 3.2, then src/foss_mcp/extraction/tree_sitter_engine/api_surface.py (the TypeScript member reading around the `readonly`/`optional`/`static`/`async`
  token helper, the interface/class/type-alias extraction and property harvesting), lang/typescript.py (`export_surface`, `export_groups`, `resolve_entry_point`), chunk_builder.py, the existing tests named
  in write_paths, and TC-532's merged work (the Python extractor already uses the same module: do not disturb the Python paths; all Python tests must stay green). Activate the toolchain (scripts/toolchain/activate.ps1)
  in the SAME shell command as every python or pytest call; set PYTHONPATH=src. Never print an environment value. Verify every name against the merged code and list differences in your report. Run ruff
  format and ruff check on every Python file you change. Do not edit plans/, project/, ops/, evidence/, schemas/ or docs/; no docker or cluster command. Source truth wins over fixtures: every new test takes
  its expectation from an INDEPENDENT oracle (a hand-written TypeScript source whose answer follows from the language rules, `tsc` declaration output, or the upstream facts quoted below), never from the
  extractor's own output.
- >-
  THE EXTRACTOR AND RENDERER WORK. Mandated names (the negative control and later cards rely on them): in api_surface.py the exact line `TS_READONLY_ONLY_WHEN_DECLARED = True`, a real switch: when True
  an interface or class property is read-only ONLY when its source carries the `readonly` modifier; when False every interface property is recorded read-only again (the behaviour of the old fixtures). Beyond
  that: property harvesting does NOT read the return types of private/protected methods or anonymous inline object types as properties of the enclosing class; type-alias declarations keep their right-hand
  side (`alias_of`, e.g. `'arrow' | 'line'`); no property type or return type carries a leading colon; `this` returns render as `this` and an iterator/generator return keeps its `Iterator<T>`/`IterableIterator<T>`
  text; static, optional, default and rest parameters/members are recorded and rendered (`static fromFile(path: string): Scene`, `createPolygon(...args: number[])`); generic base lists are split at top-level
  commas only (angle-bracket depth aware, also for `{}` and `()`); for a package with an entry point the symbols served are exactly the export surface (`export_surface`), types and functions alike, with
  re-exports resolved. ACCEPTANCE: each item has a synthetic-source test in tests/extraction/tree_sitter_engine/test_ts_surface_round3.py (at least 14 tests, hand-written sources: `interface I { readonly
  a: number; b?: string }` -> a read-only, b writable and optional; `class C { private f() { return { x: 1 }; } }` yields no property x; `type T = 'a' | 'b'` keeps its body; `class D extends Base<A, B>
  {}` has the base `Base<A, B>` once; a non-exported function next to an exported one is not served when an entry point exports only the second; `static async load(p: string, opts: O = {}): Promise<D>`
  keeps static, async and the default), and renderer tests in tests/indexing/test_chunk_builder_round3_typescript.py (at least 4). No currently faithful line changes: the existing TypeScript tests, test_ts_fidelity.py,
  the pdf/typescript pins that still hold and every non-TypeScript extractor test stay green.
- >-
  THE RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop).
  Regenerate THE THREE TypeScript fixtures with the fixed extractor, one pilot per command, from the repository root: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/typescript.yaml
  tests/fixtures/<family>_typescript/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_typescript/pages/_index.md --max-types 100000` where <pin> is `ingestion.pilots[].library.commit`
  of infra/helm/foss-mcp/values.yaml for that pilot (never retype a commit) and <family> is each of: cells, 3d, pdf. Each prints `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: kept
  must equal total and the commit must equal the pin. The CLI writes CRLF on Windows: normalise to LF so `git diff --stat` shows a content change. Every regenerated fixture must carry extractor_version
  5 (the current), `symbol_counts`, `counts` and `parse_failures`. Record old and new type, function and member counts and byte sizes in the report (at registration: cells 130 types / 359,705 bytes, 3d
  153 types / 664,959 bytes, pdf 4,393 types with 3,060 functions / 3,909,109 bytes at 155bfc7a). infra/helm/foss-mcp/values.yaml and docker-compose.yml are NOT in write_paths: if a measured total makes
  the chart `maxTypes` (pdf 4393) wrong or a fleet test fail on it, report it (the supervisor edits the chart); a lower total than the chart cap is fine.
- >-
  INDEPENDENT FACTS to assert on the REGENERATED real fixtures (each was read from the upstream source by the round-3 audit; verify each against the clone at the pin before you rely on it and report any
  that is wrong): cells/typescript: the interface entry `Style` has a property `font` that is writable and optional; the type alias `ArrowShapeType` keeps a body containing `arrow`; no property or return
  type text starts with a colon; `Workbook` lists only properties declared on the class (about 9 of the 21 the old fixture showed belong to private-method return types); static members are marked (22 in
  the audit's sample). 3d/typescript: `Scene.fromFile` (or the equivalent static factory the audit named) is static; `Mesh.createPolygon` has a rest parameter; defaults (72), optionals (69) and static properties
  (114) are recorded. pdf/typescript: the served symbol set equals the package entry's export surface (532 public exports in the audit; count what `export_surface` returns at the pin and assert equality,
  not the literal 532 unless the clone confirms it); `Omit<StampOptions, 'align'|'rotate'>`-style bases are one base; no entry has an inline-object phantom property (189 in the audit). `Document` and `Page`
  remain served.
- >-
  RE-PINS AND TABLES (only after the re-extraction): run the first check and keep the failures. Change ONLY the assertions that pin a fact the regeneration legitimately moved (old type counts, the old function
  count of pdf/typescript, a first-type or member list, internal symbols that are no longer served), each with the comment `TC-533: <old> -> <new>` and listed with its reason in the report; never delete,
  skip or xfail a test, never loosen a guard. tests/extraction/test_ts_fixture_gaps.py: cells and 3d leave the KNOWN_GAP table because they are now at the required extractor_version (the earlier jmap entries
  no longer exist). tests/deploy/test_fleet_consistency.py: add STALE_BAKED_PILOTS entries (wording as TC-550/TC-532: `re-extracted by TC-533: the fixture now holds ..., the baked generation still says
  ... until the supervisor re-ingests`) for exactly the pilots whose `coverage_problems` is non-empty after your regeneration, and UNRESOLVED_EXCEPTIONS from the regenerated `unresolved` lists (never higher
  than the old maximum). tests/fixtures/readme_identifier_allowlist.json only with the helper (`python -X utf8 -m tests.extraction.docs_identifiers --write`); read `git diff`: only keys of these three pilots
  may change, and list every identifier that remains and looks like an API symbol. COMMIT_EXCEPTIONS['pdf_typescript'] in the fleet test stays untouched (the baked generation still mixes commits until the
  supervisor re-ingests; TC-536 owns it). If a test outside write_paths fails, stop and report its name and the pinned fact.
- >-
  TEST COUNTS: min_tests is 430 for EACH check. At the issue revision the first check collects 406 existing tests (the nine existing files it names) plus the at least 24 you add in the three new files;
  the second check collects well over 2,500.
