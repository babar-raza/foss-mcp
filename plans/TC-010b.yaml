purpose: Fix the two confirmed C++ extraction bugs (is_public()'s missing free-function
  branch, _extract_bases()'s missing base_class_clause branch) that explicitly gate
  pdf/cpp's onboarding - the last remaining pilot for G2.
depends_on:
- TC-010
- TC-051
write_paths:
- src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py
- tests/extraction/tree_sitter_engine/test_api_surface_other_languages.py
