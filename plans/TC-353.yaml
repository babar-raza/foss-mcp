id: TC-353
gate: G3
lane: extraction
purpose: >-
  REQ-G3-005 (pilot completeness). On the first full live proof of the 40-pilot cluster, 15 pilots fail check 7 and nothing else:
  get_product_reference(section=install) returns an explicit absence because ingestion-time verification found the package coordinate
  (for example @aspose/3d on npm) does not resolve on its real registry. Withholding an unverified install command is correct and stays.
  But the answer is empty, and a truthful one exists: the product-reference sidecar already records source_repository and source_ref,
  the repository and the exact commit the symbols came from. This card makes the install section, when the registry check failed,
  return real content that says the registry package was not found, never presents the unresolved coordinate as an install command,
  and gives the repository, the pinned commit and the build-from-source instruction.
depends_on:
- TC-275
write_paths:
- src/foss_mcp/mcp/tools/get_product_reference.py
- infra/fetch_product_reference.py
- tests/mcp/tools/test_get_product_reference_unresolved.py
- tests/mcp/tools/test_get_product_reference_platforms.py
- tests/infra/test_fetch_product_reference.py
- tests/infra/test_serve_http.py
satisfies:
- REQ-G3-005
source_refs:
- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-11 — When a package coordinate does not resolve on its registry, the install answer must still be useful and true (supervisor, pre-TC-353)'
  sha256: a014953622af78f7c3d67111ad7a240ce0411f8d2f8ea255f3b06b81eb137157
inputs:
- >-
  Read src/foss_mcp/mcp/tools/get_product_reference.py in full (`ProductReferenceInputs`, the `install` branch at its end that returns
  NotAvailable when `install_verified is False`, `install_coordinate_for_verification`), infra/fetch_product_reference.py
  (`load_manifest_sidecar` and the sidecar shape: keys manifest_text, platform, contributing, agent_guidance, source_repository,
  source_ref), infra/serve_http.py `_serving_product_reference` (read only: it merges the registry-verification sidecar with
  dataclasses.replace), and the existing tests that assert the current absence (grep tests for `does not resolve` and `install_verified`).
  Every existing test that does NOT assert the old absence must pass UNMODIFIED. The tests that DO assert it (they pin the behaviour this
  card deliberately changes) are in your write_paths; change only those assertions, and list each one in your report.
- >-
  Add two optional fields to `ProductReferenceInputs`: `source_repository: str | None = None` and `source_ref: str | None = None`, and have
  `load_manifest_sidecar` populate them from the sidecar's `source_repository` and `source_ref` (absent keys give None; never raise for a
  sidecar written before this card). Do not change any other field or default.
- >-
  In the `install` branch, when `inputs.install_verified is False` and the verified coordinate equals the current coordinate (the existing
  condition), return a `ReferenceContent` instead of `NotAvailable` ONLY IF both `source_repository` and `source_ref` are known. Its text
  must, in plain prose: say the package `<coordinate>` was checked against `<ecosystem>` at `<checked_at>` and was not found there; say it
  should not be installed from that registry; give the repository (`https://github.com/<source_repository>` unless it already is a URL) and the
  exact commit `<source_ref>`; and say to build and install from that source following the repository's README. It must NOT contain any
  install command built from the unresolved coordinate (no `npm install <coordinate>`, `pip install`, `dotnet add package`, `go get`,
  `cargo add`, `mvn`/`gradle` snippet), and must never contain the registry coordinate inside a code fence. When the repository or commit is
  not known, keep today's explicit NotAvailable with its existing reason, unchanged.
- >-
  tests/mcp/tools/test_get_product_reference_unresolved.py (NEW): for each ecosystem the tool supports (npm, PyPI, NuGet, Go, crates.io,
  Maven) a coordinate verified False with a known repository and commit returns content that contains the repository URL, the exact commit,
  the words "not found" (or the exact phrase you choose, asserted literally) and the registry name, and contains NONE of the install-command
  prefixes listed above; verified False with unknown repository or commit still returns NotAvailable with the existing reason; verified True
  and None are served exactly as before (the original install command); a coordinate that changed since verification is served as before;
  cpp is unchanged. Also assert that for every one of those cases the returned object has non-empty `.text` where content is returned, because
  the live proof's check 7 reads `text`. Update the sidecar-loading tests in tests/infra/test_fetch_product_reference.py and
  tests/infra/test_serve_http.py to cover the two new fields (present and absent).
- >-
  Run `{python} -m pytest tests/mcp/tools/test_get_product_reference_unresolved.py tests/mcp/tools/test_get_product_reference_platforms.py
  tests/infra/test_fetch_product_reference.py tests/infra/test_serve_http.py -q -rfE`, then once
  `{python} -m pytest tests/mcp tests/infra/test_verify_product_reference_install.py -q -rfE`. Write commit messages as UTF-8 without a
  byte-order mark.
actions:
- Carry the sidecar's source repository and commit into the tool's inputs.
- Return real, honest, command-free install guidance (repository, pinned commit, build from source) when the registry coordinate is unresolved.
- Pin the behaviour per ecosystem, including that the unresolved coordinate is never offered as an install command.
checks:
- command: '{python} -m pytest tests/mcp/tools/test_get_product_reference_unresolved.py tests/mcp/tools/test_get_product_reference_platforms.py tests/infra/test_fetch_product_reference.py tests/infra/test_serve_http.py -q -rfE'
  expect: exit 0
  timeout_seconds: 900
  junitxml: true
  proves:
  - REQ-G3-005
- command: '{python} -m pytest tests/mcp tests/infra/test_verify_product_reference_install.py -q -rfE'
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-005
min_tests: 14
network: true
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py');s=p.read_text(encoding='utf-8');old='source_repository';assert old in s;i=s.rindex(old);p.write_text(s[:i]+'source_repositoryX'+s[i+len(old):],encoding='utf-8')"
  rationale: >-
    Renames the last use of source_repository in the tool, so the unresolved-coordinate answer no longer finds the repository it must
    cite: the content assertions fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-353/receipt.json
closeout:
- >-
  When a package is not on its registry, get_product_reference still answers: it says so, never offers the unresolved name as a command,
  and points at the repository and exact commit to build from.
recovery: Re-run from a clean tree.
