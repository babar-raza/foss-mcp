id: TC-739
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a sixth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism `TC-733`/`TC-735`/`TC-736`/`TC-737`/`TC-738` already proved for five other pilots
  (sibling cards, different pilots, zero file overlap - do not touch anything any of them touch).
  Confirmed needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates`
  already auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through the exact same `verify_cpp_example`
  pipeline `TC-737` already proved for `email/cpp`, publishing only the ones that pass.

  `slides/cpp` currently serves only 2 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/slides__cpp__self_extracted` generation) - tied with `email/cpp`
  for the lowest of any pilot touched this session. Its real pinned repository is
  `aspose-slides-foss/Aspose.Slides-FOSS-for-Cpp` (re-confirm the exact pinned commit yourself from
  `config/products/slides/cpp.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust this card's
  own citation blindly). The real upstream repository has a real `examples/consumer` sample (per
  this project's own Appendix-C style accounting for this pilot) - CONFIRM its real shape directly
  (read it yourself), and since this alone is unlikely to reach 5 genuinely distinct operations,
  also read the real public headers/API surface for additional real, valuable, self-contained
  operations - the same sample-plus-API-surface mix `TC-737`'s own `email/cpp` card already used
  successfully.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `slides/cpp` from 2 to AT MOST 7 served examples, not to its own real
  floor (6-15, Appendix C); closing that floor fully needs the P4 program's own later, larger
  per-language-sample-adapter work, explicitly out of this card's scope. This card's job is the
  real, bounded, immediately shippable slice: up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.

  VERIFY EACH EXAMPLE YOURSELF - this pilot's real verification toolchain needs a real C++
  compiler/CMake build against the real pinned library source (read `example_verifier.py`'s
  `prepare_cpp_library`/`verify_cpp_example` to confirm exactly what the real pipeline needs; `TC-
  737`'s own closeout for `email/cpp` found Docker with a real `gcc:13-bookworm` + a modern CMake
  was the practical path on this host, and found a real, subtle trap worth repeating here:
  `CMAKE_BUILD_TYPE=Release` defines `NDEBUG`, silently turning every bare `assert()` into a no-op
  - build and run in Debug mode, or verify your assertions some other way that cannot be silently
  skipped, and confirm this explicitly before trusting any example "passed").
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/slides_cpp/authored_examples.yaml
  - tests/indexing/test_authored_examples_slides_cpp.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_cpp/authored_examples.yaml` and
    `tests/fixtures/furnished/cells_rust/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_cells_rust.py` (your exact templates). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`,
    `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit), `src/foss_mcp/indexing/example_verifier.py`'s C++ functions in full, and
    `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `slides/cpp`'s real current served example count (2) and real pinned
    repository/commit yourself. Fetch the real upstream `examples/` content at that exact commit
    and read enough of the real public API surface to find real, valuable, self-contained
    operations.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm you have a working C++ toolchain
    available (Docker with a real gcc/CMake image is a proven path - see `TC-737`'s own closeout),
    fetch/build the real pinned library, actually compile and RUN each program in a build mode
    where assertions are NOT silently disabled, confirm each one's real output matches what you
    claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `slides/cpp`'s example-corpus work is complete. If fewer than 5 real
    candidates verify cleanly, submit the real number you got and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for slides/cpp via the existing
    authored_examples.yaml mechanism, raising its served example count from 2 toward 7.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_slides_cpp.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/slides_cpp/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-739/receipt.json
closeout:
  - >-
    slides/cpp gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 2 toward 7 - real, bounded progress toward its full floor.
recovery: Re-run from a clean tree.
