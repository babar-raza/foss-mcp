- 'This local clone is a READ-ONLY REFERENCE repository per AGENTS.md (''These repositories
  are read-only references. Never write to them: ... aspose.org ...''). You may ONLY
  run read-only git plumbing against it: `git -C <path> rev-parse HEAD`, `git -C <path>
