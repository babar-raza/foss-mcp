  `git add`/`commit`/`checkout`/`reset`/anything that writes to its working tree,
  index, or refs. Read via git plumbing (blob content at a pinned commit), never by
  reading raw working-tree files directly - this matches how the existing GitHub-API
  path already works (it fetches committed blobs, never an uncommitted working tree),
  and is unaffected if that clone''s working tree ever has local, uncommitted changes.'
- 'CONFIRMED real content exists at the exact subtree convention tests/fixtures/furnished/pdf_net/manifest.json
  already establishes (''source_subtree'': ''content/products.aspose.org/en/pdf/net''):
  for slides/python this is content/products.aspose.org/en/slides/python, which exists
  in the local clone and contains a real, substantial _index.md (~9KB, real Hugo front-matter
  and content blocks describing the actual library, not a stub).'
- 'Read scripts/pilot_manual_export.py in full first. It already has export_subtree/resolve_commit/_list_tree/_fetch_blob
  (GitHub-API-based), ExportedFile, verify_bundle (fully generic - checksum-only,
  works unchanged regardless of how a bundle was produced), the NON_PRODUCTION_BANNER,
  and a CLI in main(). Add PARALLEL local-clone equivalents: resolve_local_commit(clone_path,
  ref) using `git -C clone_path rev-parse ref`; a tree-listing function using `git
  -C clone_path ls-tree -r <sha> -- <subtree>` (parse the `<mode> <type> <sha>\t<path>`
  output format); a blob-fetch function using `git -C clone_path cat-file -p <blob_sha>`
  capturing raw BYTES (subprocess with capture_output, not text=True, to avoid encoding
  corruption of binary or non-UTF8 content). Reuse ExportedFile, the manifest-writing
  shape, and the banner exactly as export_subtree already does - refactor a small
  shared helper if that avoids real duplication, but do not force an awkward abstraction
  for its own sake.'
- 'Add a `--local-clone PATH` CLI flag to main() as an alternative to `--repository`/`--ref`:
  when given, export via the new local-clone path instead of the GitHub API path.
  Keep the existing API-based flow completely unchanged - this is additive.'
- The OFFLINE graded test suite must use a SYNTHETIC local git repo built fresh inside
