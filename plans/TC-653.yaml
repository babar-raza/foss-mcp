id: TC-653
gate: G3
lane: extraction
purpose: >-
  Workstream G (content truth). Closes `WORDS-NET-003` (P1, high confidence): words/net's
  `get_product_reference(section="limitations")` returns `{"reason": "limitations has no data
  source in this project yet"}` while `get_symbol`/`list_members` for `Aspose.Words.SaveFormat`
  lists all 41 indexed members with NO annotation at all - but on the real, installed
  Aspose.Words.FOSS 26.3.0, calling `doc.Save("x.pdf", SaveFormat.Pdf)` or `SaveFormat.Html`
  (and ~15+ other values: Xps, Odt, Rtf, Doc, Epub, image formats, etc.) throws
  `System.NotSupportedException: FOSS` at runtime, while `SaveFormat.Markdown` genuinely succeeds.
  The ONLY place this is written down anywhere today is inside the untrusted-content
  `agent_guidance` (AGENTS.md) text - never in a structured, queryable field. Read the real issue
  record yourself in `docs/round2/issues.json` (id `WORDS-NET-003`) before starting.

  Same safe, existing mechanism as TC-650 (G3/TC-582's `known_hazards`, read
  `config/products/cells/go.yaml`'s own entry as your template, and
  `src/foss_mcp/mcp/tools/get_product_reference.py`'s `KnownHazard`/
  `known_hazards_from_manifest`/`_with_known_hazards` - do not modify this code, it already
  works) - add ONE real `known_hazards` entry to `config/products/words/net.yaml` (as the LAST
  top-level key, same convention) stating plainly: the real failure mode (most `SaveFormat`
  values throw `NotSupportedException` in this FOSS edition, not every one), its real trigger
  (calling `doc.Save` with one of the unsupported values), and the safe pattern (check which
  values actually work before relying on one, or use a confirmed-working value such as
  `SaveFormat.Markdown`/whichever you confirm from the real repro). Confirm the real
  `verified_at` date the same way TC-650's worker did (TC-646's own `config/known_defects/
  pdf__java.yaml` uses `2026-10-29` for the same round-2 audit - confirm this is still right
  before reusing it, do not invent a date).

  You must ALSO widen the two pre-existing tests that enumerate every pilot WITHOUT a
  `known_hazards` entry - the exact same two files TC-650 already updated once (read their real,
  current `PILOTS_WITH_KNOWN_HAZARDS` frozenset in BOTH files first, it already lists 6 pilots):
  `tests/mcp/tools/test_product_reference_known_hazards.py` and
  `tests/schemas/test_product_manifest_schema.py`. Add `("words", "net")` to BOTH frozensets,
  and re-pin both `len(...)` counts from `26` to `25` (32 total minus the now-7 pilots that carry
  a real entry). Do not weaken either test's actual assertions - only widen the exclusion set and
  its count, exactly as TC-650 did.
depends_on:
  - TC-650
write_paths:
  - config/products/words/net.yaml
  - tests/mcp/tools/test_known_hazards_words_net.py
  - tests/mcp/tools/test_product_reference_known_hazards.py
  - tests/schemas/test_product_manifest_schema.py
satisfies:
  - REQ-G3-013
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-10-30 — Round-2 portfolio audit remediation adopted: unified plan, governance decisions A-K
      recorded (supervisor)
    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST: `config/products/cells/go.yaml`'s real known_hazards entry (your template),
    `tests/mcp/tools/test_product_reference_known_hazards.py` and
    `tests/schemas/test_product_manifest_schema.py`'s real, CURRENT `PILOTS_WITH_KNOWN_HAZARDS`
    frozenset and count pin (both already updated once by TC-650 - read them fresh, do not assume
    their shape from this card's own description). Then the real `WORDS-NET-003` issue record in
    `docs/round2/issues.json`, including its `repro` list (the real `doc.Save` calls and their
    real outcomes).
  - >-
    Write at least 7 tests in `tests/mcp/tools/test_known_hazards_words_net.py`: the manifest
    parses and validates against `schemas/product/product-manifest.schema.json`; a real
    end-to-end test proving `get_product_reference(section="limitations")` for words/net now
    surfaces the real hazard text (reuse the `tests/mcp/tools/test_product_reference_known_hazards.py`
    pattern - read it first); the hazard text names at least 2 of the real unsupported SaveFormat
    values from the issue's own repro (e.g. `Pdf`, `Html`) and does NOT claim every value is
    unsupported (the issue's own repro shows `Markdown` succeeds - the hazard text must not
    contradict that); `verified_at` is a valid calendar date.
actions:
  - >-
    Disclose WORDS-NET-003 (words/net's SaveFormat runtime-unsupported-values gap) through the
    existing known_hazards mechanism, and widen the two pre-existing "every pilot without one"
    tests to the real, now-7-pilot set.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_known_hazards_words_net.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 120
    junitxml: true
    proves:
      - REQ-G3-013
  - command: '{python} -m pytest tests/mcp/tools/test_product_reference_known_hazards.py tests/schemas/test_product_manifest_schema.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 120
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 7
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/products/words/net.yaml'); s = p.read_text(encoding='utf-8'); marker = 'known_hazards:'; idx = s.find(marker); assert idx != -1, 'known_hazards key not found in config/products/words/net.yaml as expected - if your real file differs, anchor your own mutate on your own real file instead and note the substitution in your closeout'; s2 = s[:idx] + 'known_hazards: []' + chr(10); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Empties words/net's known_hazards back to zero entries - the real WORDS-NET-003 disclosure
    must stop surfacing. Any end-to-end test proving it surfaces through get_product_reference
    must fail under this mutation; tests scoped to other pilots' files are unaffected.
evidence:
  - evidence/build/G3/TC-653/receipt.json
closeout:
  - >-
    WORDS-NET-003 is disclosed through the existing known_hazards mechanism, and the two
    pre-existing "no pilot but these carries known_hazards" tests now correctly name all 7 real
    pilots that do.
recovery: Re-run from a clean tree.
