id: TC-721
gate: G3
lane: transport-deployment
purpose: >-
  Closes CELLS-PY-004 (round-2, `docs/round2/issues.json`, severity P0, category
  "mcp-content-missing" - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor
  investigation): `cells/python`'s `FormulaEvaluator.evaluate()` silently returns `None` (no
  exception, no warning) for `SUM`, raw arithmetic (`B2+B3`), and `AVERAGE` - three of the most
  commonly-expected spreadsheet formula operations - with zero documentation anywhere this project
  serves of WHICH functions actually work. `get_symbol` on `FormulaEvaluator` shows only the class's
  own generic docstring ("Basic formula evaluator ... not a full spreadsheet calculation engine")
  and the bare `evaluate()` signature; `get_product_reference(section=limitations)` says nothing
  about formula-function coverage at all. The round-2 finding's own direct read of the real
  installed package's `_evaluate_function` source confirms the real, complete supported set is
  exactly `CONCATENATE`, `CONCAT`, `TEXT`, `IF`, `AND`, `OR`, `NOT`, `LEN`, `TRIM`, `UPPER`,
  `LOWER` - `SUM`/raw arithmetic/`AVERAGE` are simply absent from that implementation and the
  function silently falls through to `None` instead of raising. An agent that calls
  `evaluate("=SUM(A1:A3)")` expecting a number gets `None` with no signal anything went wrong.

  REPRODUCE FIRST: confirm this is still real. Install the real, currently-pinned
  `aspose-cells-foss` package (confirm the real pinned version via `config/products/cells/python.yaml`'s
  own comment first) and run the real repro:
  ```
  from aspose.cells_foss.formula_evaluator import FormulaEvaluator
  # construct however the real class requires, per its own real __init__ signature - read get_symbol's
  # real output for the exact construction shape before writing your own repro script
  ```
  then call `evaluate()` with a `SUM`/arithmetic/`AVERAGE` formula and confirm it returns `None`
  with no exception, while `evaluate("=CONCATENATE(...)")` or similar genuinely works. Report the
  real observed output, verbatim, in your closeout - if the real currently-installed version's
  behavior differs even slightly from the round-2 finding's own claimed function list (functions
  added or removed since round-2 ran), report that honestly and write the hazard text to match what
  you actually observed, never the finding's unverified claim.

  FIX (pure additive data, zero code change - same mechanism this project already uses for
  `cells/go`'s own project-authored hazard in `config/products/cells/go.yaml`'s `known_hazards`
  list; `cells/python` has no `known_hazards` key yet): add a NEW `known_hazards` key to
  `config/products/cells/python.yaml` (as the LAST top-level key, matching the established
  file-level comment convention: "Keep this the LAST top-level key"), with ONE entry stating
  plainly: the real trigger (calling `FormulaEvaluator.evaluate()` with `SUM`, raw arithmetic like
  `B2+B3`, or `AVERAGE` - or whichever exact set you personally re-confirm as unsupported), the real
  observed behavior (returns `None`, never raises), the real supported set you confirmed (the
  `CONCATENATE`/`CONCAT`/`TEXT`/`IF`/`AND`/`OR`/`NOT`/`LEN`/`TRIM`/`UPPER`/`LOWER` functions, or
  whatever you personally re-verify), and the safe pattern (never trust a `None` result as "zero"
  or "empty" - check whether the formula's function is in the real supported list before relying on
  a non-`None` result meaning the formula actually evaluated).
depends_on:
