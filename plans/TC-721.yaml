    READ FIRST: `docs/round2/issues.json` id `CELLS-PY-004` in full. Then
    `config/products/cells/go.yaml`'s own `known_hazards` entry (your exact template) and
    `tests/mcp/tools/test_known_hazards_round2_disclosures.py` in full - it already tests the
