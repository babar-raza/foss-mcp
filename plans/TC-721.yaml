    python -X utf8 -c "import pathlib; p = pathlib.Path('config/products/cells/python.yaml'); s = p.read_text(encoding='utf-8'); old = 'FormulaEvaluator'; count = s.count(old); assert count >= 1, 'the expected FormulaEvaluator literal was not found - if your real hazard text phrases this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, 'FormulaEvaluatorNOTREAL', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
