    for `cells/python`/`CELLS-PY-004`. Read `TC-720`'s own final diff first (search for
    "PAGE-PYTHON-003" in this test file) as your direct, most-recent template for exactly how a
    9th-style widening was done cleanly, including its own note about why it layered the new pilot
    on top of the original tuple rather than merging it in (a `verified_at` date mismatch).
  - >-
    REPRODUCE FIRST (do not skip): a real install + import + call of the real package, exactly as
    described above - a genuine network action, report the real printed output verbatim in your
    closeout. If your own re-verification finds the real supported/unsupported function list has
    changed since round-2's own text, write the hazard to match what you observed, not the
    finding's original claim, and note the discrepancy in your closeout.
  - >-
    This is a project-authored disclosure, not an upstream quote - write the hazard in your own
    words, matching the house style of every other `known_hazards` entry already committed.
  - >-
    Learn from `TC-720`'s own negative-control near-miss (recorded in its commit/evidence): a trace
    token that is a substring of another required phrase in the same hazard text, or a subject name
    repeated more than once before the mutate's target occurrence, can make the negative control
    vacuous. Run the card's own `negative_control.mutate` against your real committed file yourself
    BEFORE declaring done, and confirm it actually makes your new test fail.
