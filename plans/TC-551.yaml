  rationale: >-
    Rewrites the README's pilot count from 32 back to 40, so the document a peer reads no longer agrees with the chart:
    the new test_the_readme_says_32_pilots_and_12_families_and_no_longer_40 fails at once (it also requires that the
    number 40 appears nowhere in the README), and so do test_the_readme_pilot_count_is_the_charts and the pilot-roster
    consistency tests. A real break of the card's central claim (the roster the product ships is the chart's 32 pilots and
    every document says so). The drafter ran this mutate against the scratch tree: the named test fails in 0.5 s.
