  after TC-539 (tests/deploy/test_image_workflow_gate.py). The cards TC-532 to TC-537 (pending) share files with this
  card and the supervisor makes them depend on TC-551 and removes every jmap fixture, test and pin from them, so start
  from a clean tree at the commit the supervisor issues and build on what is there. Everything below was checked against
  main 7af2adb1, i.e. WITHOUT the TC-550 and TC-539 edits: TC-550 changes caps, KNOWN_GAP entries, fixtures and pins in
  some of the files named here, so apply the INTENT of each edit to the text you find and verify every name (test
  function, constant, table) against the merged code before you rely on it; if a name differs use the merged name and
  list the difference in your report. Never print or log any environment value. Activate the toolchain
  (scripts/toolchain/activate.ps1) in the SAME shell command as every python, helm, docker or pytest call; the helm
  tests FAIL without helm on PATH. Do not run an ingestion or a cluster command.
- >-
  THE REMOVAL SET, derived from the committed tree and never typed from memory: the removed pilots are the eight entries
  of ingestion.pilots in infra/helm/foss-mcp/values.yaml whose family is jmap (platforms cpp, go, java, net, nodejs,
  python, rust, typescript). The removed pilot keys are jmap_cpp, jmap_go, jmap_java, jmap_net, jmap_nodejs,
  jmap_python, jmap_rust, jmap_typescript; the removed scope directories are
  infra/demo-manifests/jmap__<platform>__self_extracted. The ONLY occurrences of the removed family allowed to remain in
  the whole repository after TC-551 and TC-552 are the immutable history (plans/, evidence/, ops/, project/,
  docs/DECISION_LOG.md, docs/REVIEW_LEDGER.md, scripts/release/build_review_ledger.py) and the single removal sentence
  of docs/RELEASE.md. TC-551 removes every occurrence it can only remove together with the data; TC-552 removes the rest
  and adds the repo-wide test.
- >-
  DELETIONS (git rm; list the deleted paths in your report). (a) tests/fixtures/jmap_<platform>/ for the eight platforms
  (api_surface.json each). (b) tests/fixtures/furnished/jmap_<platform>/ for the eight platforms (pages/_index.md each,
  plus authored_examples.yaml for the net and python ones). (c) tests/fixtures/verified_examples/jmap_<platform>.json (8
  files). (d) config/products/jmap/ (8 manifests). (e) infra/demo-manifests/jmap__<platform>__self_extracted/ (8
  directories: active_pointer.json and one generation file each) AND the root-level sidecars of the removed pilots:
  product_reference_jmap_<platform>.json (8), recent_releases_jmap_<platform>.json (8) and
  package_registry_jmap_<platform>.json (7: the C++ pilot has none by design). No verification_cache_jmap_* file is
  committed in infra/demo-manifests (the caches live in tests/fixtures/verified_examples), so there is nothing to delete
  for it. The write path infra/demo-manifests/** is deliberately wide because it replaces 31 exact paths: this card may
  only DELETE under it. Prove that with `git diff --name-status` before you commit: every entry under
  infra/demo-manifests must be a D, 39 of them, and no file of the 32 remaining scopes or of the 92 remaining sidecars
  may be modified, added or renamed; put the output counts in your report. (f)
  tests/extraction/test_jmap_<platform>_extraction.py (8) and tests/indexing/test_authored_examples_jmap_net.py and
  test_authored_examples_jmap_python.py (2): they test only the deleted fixtures and sidecars. Total 83 deleted files.
- >-
  CHART, COMPOSE, DEMO COMPOSE, DOCKERFILE (targeted edits only; every byte of every other pilot stays as it is,
  including the maxTypes / --max-types numbers TC-550 sets). (1) infra/helm/foss-mcp/values.yaml: delete the eight `-
  family: jmap` entries of ingestion.pilots, each from its `- family:` line to the line before the next `- family:`
  entry or comment block that belongs to the next entry; keep the comment blocks that head a group of later entries.
  `yaml.safe_load` must give 32 pilots and no other key may change (demo.pilots stays []). (2) docker-compose.yml:
  delete the eight `manifests-jmap-<platform>:` volumes, the eight `ingest-jmap-<platform>` services and the eight
  `serving-jmap-<platform>` services, each with the comment lines that head it. Do NOT renumber the host ports of the
  other serving services: the removed ones were 8092, 8096 and 8109 to 8114 and stay unused; the compose file must parse
  with 64 services (32 ingest, 31 serving-<family>-<platform> plus the plain `serving` service of pdf/net) and 32
  volumes. (3) docker-compose.demo.yml is GENERATED: regenerate it with `python
  scripts/release/generate_demo_compose.py` (never by hand) and prove it with `python
  scripts/release/generate_demo_compose.py --check`; its header then says 32 services and ports 8101 to 8132. (4)
  Dockerfile.ingestion: delete the eight `COPY tests/fixtures/jmap_<platform>/api_surface.json
  ./fixtures/jmap_<platform>/api_surface.json` lines and nothing else (a COPY of a missing file fails the image build;
  tests/test_container_build.py builds the ingestion image and is part of the second check). The node toolchain stays:
  pdf/typescript and cells/typescript still need it. (5) tests/infra/test_helm_pilots_match_compose.py and the
  `two_step_chain` test of tests/infra/test_helm_chart.py compare the rendered chart with compose; they must stay green.
- >-
  TOOLS AND TABLES. (1) scripts/deploy/pilots.py: `PILOT_COUNT = 40` -> 32 (no other number; the pilot table itself is
  the chart). scripts/deploy/install_pilots.py and scripts/deploy/prove_pilots.py: the words `forty` / `(40 today)` in
