purpose: >-
  REQ-G3-001, REQ-G3-002, REQ-G3-005, REQ-G3-007 and REQ-G3-008 (operator decision 2026-10-16, recorded by the
  supervisor in docs/DECISION_LOG.md: the eight jmap pilots - jmap/cpp, jmap/go, jmap/java, jmap/net, jmap/nodejs,
  jmap/python, jmap/rust and jmap/typescript, i.e. the whole jmap FAMILY - are REMOVED FROM THE PRODUCT everywhere in
  the shipped repository; git history is untouched. Their upstream GitHub repositories no longer exist (owner item
  OWNER-15, HTTP 404 with and without a token), so they can never be re-extracted, re-ingested or verified again. The
  shipped standalone image serves 32 pilots in 12 families instead of 40 in 13.) THIS CARD IS THE DATA AND ROSTER HALF
  OF THE REMOVAL; TC-552 is the text half (comments, docstrings, synthetic test names, the repo-wide zero-occurrence
  test). Measured by the drafter on main 7af2adb1 (TC-530 accepted, TC-550 and TC-539 in flight) with a scratch copy of
  the tree to which every edit below was applied and the whole suite run: the removal deletes 83 tracked files (26 under
  tests/fixtures: 8 api_surface.json, 8 furnished _index.md, 2 authored_examples.yaml, 8 verified_examples caches; 8
  config/products/jmap manifests; 39 under infra/demo-manifests: 8 pointers, 8 generations, 23 sidecars; 8
  tests/extraction/test_jmap_*_extraction.py; 2 tests/indexing/test_authored_examples_jmap_*.py), removes 8 entries of
  ingestion.pilots in infra/helm/foss-mcp/values.yaml, 8 volumes plus 8 ingest and 8 serving services in
  docker-compose.yml, 8 services in docker-compose.demo.yml and 8 COPY lines in Dockerfile.ingestion, and moves the
  derived counts: chart pilots 40 -> 32, families 13 -> 12, compose services 80 -> 64, demo services 40 -> 32 (demo host
  ports 8101..8140 -> 8101..8132 because they follow chart order), baked scope directories 40 -> 32, verification caches
  40 -> 32, python pilots 12 -> 11, tests collected by the second check 4072. After this card the scratch copy was green
  in every test directory (deploy, extraction, indexing, infra, mcp, poc, config, top-level, including the docker image
  build tests) except tests/indexing/test_example_verifier.py (real library builds, not run), tests/test_githooks.py
  (needs a git index) and three ops tests that need a git checkout, which fail identically on the untouched tree. What
  this card does NOT change: src/ other than the one family table in src/foss_mcp/mcp/identity.py (comments and
  docstrings that name the removed family are TC-552's), ops/, project/, plans/, evidence/, docs/DECISION_LOG.md,
  docs/REVIEW_LEDGER.md and scripts/release/build_review_ledger.py (history; the supervisor owns them), the tests that
  mention the removed family only as a synthetic name (TC-552), and nothing is re-extracted or re-ingested (the
  supervisor re-ingests and snapshots after the last re-extraction card; the baked data of the 32 remaining pilots is
  untouched byte for byte).
