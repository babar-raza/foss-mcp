  mutate: |
    python -X utf8 -c "import pathlib;q=chr(34);nl=chr(10);p=pathlib.Path('src/foss_mcp/extraction/run_extraction.py');s=p.read_text(encoding='utf-8');old='# TC-265: real bases';new='# TC-265: real bases - DISABLED';i=s.index(old);line_start=s.rfind(nl,0,i)+1;line_end=s.index(nl,i);s=s[:line_start]+'        entry['+q+'bases'+q+'] = []  '+new+s[line_end:];p.write_text(s,encoding='utf-8')"
  rationale: 'Finds this card''s own mandated "# TC-265: real bases" sentinel comment and replaces that whole line
    with a hard-coded empty list, regardless of the surrounding implementation''s exact variable names, so the new
    test asserting real base-class data is populated and improves centrality ranking must fail again. Built with
    plain text.'
evidence:
