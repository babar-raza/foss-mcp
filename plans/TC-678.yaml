id: TC-678
gate: G3
lane: storage-retrieval
purpose: >-
  C4 (content-truth sub-program, section 2.4: "one fence-aware truncation helper naming `chunk_id`
  + offset (reuse `response_budget.fence_blocks`)"). `src/foss_mcp/mcp/response_budget.py` (TC-515,
  TC-563) already has exactly this: `fence_blocks()` detects fenced code-block membership per line,
  `_documentation_excerpt()` snaps its cut point to never land inside an open fence
  (`snap_end`/`starts_inside_block`), and `_doc_marker()` names the exact `search_docs` call,
  `chunk_id` and offset needed to get the rest. CONFIRMED this mechanism is NOT what
  `get_product_reference.py` actually uses for its own long-content truncation.

  `get_product_reference.py` has its OWN SEPARATE, PARALLEL truncation helpers: `_cap_at_line`
  (cuts at the nearest `\n` boundary) and `_cap_at_paragraph` (cuts at the nearest `\n\n` or `\n`
  boundary), called at 6 real sites (`_limitations_from_readme`, the formats section, the install
  recipe at two call sites including a C++-specific one, `agent_guidance`, and a fallback raw
  README-text branch). NEITHER is fence-aware - both only ever look for a blank-line/newline
  boundary, never checking fence state at all. Their marker, `_TRUNCATED_MARKER = "[truncated; use
  search_docs for the rest]"`, is a single FIXED STRING - it never names a `chunk_id` or offset,
  unlike `response_budget`'s own marker.

  REPRODUCED directly (supervisor, this session): a synthetic limitations-style text (short prose
  then a 300-line fenced python block) truncated via the real, unmodified `_cap_at_line` at a
  600-character cap produces a result with exactly ONE ` ``` ` line (an opening fence with no
  matching close) - a genuinely malformed, mid-fence-cut markdown block, with a marker that gives
  no `chunk_id`/offset to retrieve the rest. No CURRENTLY COMMITTED pilot fixture happens to
  trigger this today (checked directly against every `tests/fixtures/furnished/**/_index.md`
  limitations/formats/install section: 0 of them currently combine a fence with a long-enough
  section to trip it) - this is a real, armed defect waiting for the next long-fenced
  limitations/install section, not a hypothetical. Fix it now, structurally, rather than waiting
  for a real pilot to demonstrate it in production.

  Fix: make `get_product_reference.py`'s truncation fence-aware and offset-naming by REUSING
  `response_budget.fence_blocks` directly (never re-implementing fence detection), and extend its
  marker to name a stable identifier of WHAT was cut (the section's own title/kind, since these
  call sites do not carry a `chunk_id` the way a `search_docs` chunk does - use what identity IS
  available, e.g. `README section '<title>'` plus a byte offset into that section, so a caller
  still knows exactly how much was shown and where the rest starts even without a chunk_id to call
  back with). This is a NARROWER ask than reusing the WHOLE `_documentation_excerpt` machinery
  (which is built around `search_docs`-specific chunk metadata this module does not have) - reuse
  only `fence_blocks` itself for the fence-awareness, write a new, small, local snap-to-fence-
  boundary step for `_cap_at_line`/`_cap_at_paragraph`, and improve the marker to carry an offset.
  Do not weaken either existing cap value or change what gets cut at (line vs paragraph boundary)
  otherwise - only add the fence-safety and the offset.
