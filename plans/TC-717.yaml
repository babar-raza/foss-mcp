      ## 2026-11-07 — CELLS-NET-001 confirmed the same version-drift class as PDF-NET-001; not an extractor defect (supervisor)
    sha256: b4529c50546393df804de5be972ec4fceb0c1d0d7756cd83a309aee5df9eff84
inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `WORDS-NET-006` in full. Then
    `tree_helpers.py`'s `_extract_enum_members` (around line 1321) and `_in_excluded_preproc_branch`/
    `_condition_definitely_false` (around lines 1071-1150) in full. Then `lang/csharp.py`'s
    `member_nodes` (around line 427) and its real, already-working call site in `api_surface.py`'s
    field/event extraction function (around line 1230-1247) - this is your exact template for the
    flatten-then-filter pattern, already proven correct and tested for class members; you are
    applying the identical pattern to enum bodies, not inventing new preprocessor-evaluation logic.
  - >-
    REPRODUCE FIRST (do not skip): confirm the real current gap in the committed fixture, and fetch
    the real upstream source text at the real pinned commit via `gh api`, exactly as described
    above. Report both real observations, verbatim, in your closeout.
  - >-
    Scope this to C# only. Prove, not assume, that every other language's enum extraction and every
    other C# pilot's enum extraction is byte-for-byte unaffected.
actions:
  - >-
    Make C# enum-member extraction preprocessor-aware, reusing the already-proven flatten/filter
    mechanism class and field extraction already use, closing the real `SaveFormat.WebP` gap for
    `words/net` without affecting any other language or pilot.
checks:
  - command: '{python} -m pytest tests/extraction/tree_sitter_engine/test_csharp_preproc_enum_members.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-012
  - command: '{python} -m pytest tests/extraction/ -q -rfE -p no:cacheprovider --ignore=tests/extraction/test_github_http.py --ignore=tests/extraction/test_github_http_gh_cli_transport.py --ignore=tests/extraction/test_repo_native.py'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 1
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; q = chr(34); p = pathlib.Path('tests/fixtures/words_net/api_surface.json'); s = p.read_text(encoding='utf-8'); old = q + 'WebP' + q; count = s.count(old); assert count >= 1, 'the expected WebP literal was not found in the real fixture - if your real fix names it differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, q + 'WebPNOTREAL' + q, 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the real `WebP` member name in the regenerated fixture so it no longer matches the
    real upstream name your new regression test asserts on, which must make that test fail - a pure
    data mutation, immune to the lockstep-rename vacuousness class this session's earlier reviews
    found, and it never touches the extractor code path itself.
evidence:
  - evidence/build/G3/TC-717/receipt.json
closeout:
  - >-
    C# enum-member extraction is now preprocessor-aware, closing WORDS-NET-006 (`SaveFormat.WebP`)
    by reusing the already-proven flatten/filter mechanism class and field extraction already use -
    every other language and every other C# pilot's enum extraction confirmed byte-for-byte
    unaffected.
recovery: Re-run from a clean tree.
