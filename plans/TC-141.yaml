    the check's pytest half - proving the check genuinely exercises this file's real
    content, not merely its formatting. Self-checked end-to-end before being persisted.
evidence:
- evidence/build/G2/TC-141/receipt.json
closeout:
- All 4 files are ruff-format clean.
- Each file's own tests show zero behavior change.
- scripts/ci_check.sh's own format step passes, unblocking the push.
- Renaming _rollback_argv fails the check again.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
