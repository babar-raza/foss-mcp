id: TC-516
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review; findings RST-02, RST-14, D-08, PS-08). LOOKUP AND SEARCH FORGIVENESS. Measured by the reviewers on the shipped
  image and re-measured offline by the drafter on the baked demo manifests at main 3155a7b4: of 390 phrased queries that name a type that exists, `lookup` returned that
  type's symbol 0 times (on the drafter's data-driven set of 375 "how do I use X" questions over all 40 pilots the symbol is returned in the top 3 for 0 of 375, 0 percent);
  cells/net `lookup("how do I use Workbook")` and `lookup("Workbook methods")` are misses although `lookup("Workbook")` returns the symbol; `lookup("convert pdf to docx")` misses but
  "docx conversion" answers (the stemmer does not map convert to conversion); "colour" misses against "color"; the tokenizer splits "PDFs" into the junk terms "pd" and "fs".
  On 78 verified-absent-feature probes (14 distinct questions such as "create a pivot table" or "send via SMTP" asked on every pilot of the six families that have them) the
  baked data gives 57 honest misses (73 percent), 11 relevant answers and 10 irrelevant answers (12.8 percent; reviewers measured 27 percent on their 37), for example
  cells/cpp "create a pivot table" answers with the quick-start text, jmap/nodejs "send via SMTP" answers with the OAuth example. 267 task questions for features that exist
  found only a README table 13.5 percent of the time as the sole evidence. `search_symbols("SetPassword")` on pdf/go ranks the type that actually declares the useful
  method (Document) 8th of 8, behind six field types that merely INHERIT `SetPassword(v: bool)` from TextBoxField (the register's wording "take it as a parameter" is
  wrong; the drafter read the chunks). find_examples accepts identifier queries on unrelated examples: pdf/python "DataSource example" returns three unrelated examples at 0.75
  (terms data, datasource, example, source: "example" and the sub-words match everything), pdf/go "Example: Nonexistent title" returns "Create Hierarchical Bookmarks" at
  0.67, and the bare query "Example:" returns five arbitrary examples at 1.0. Concise 3 to 5 word example queries reach the target example in the top 3 for 23 of 26 (drafter
  re-run: 23/26, 3 misses, 0 wrong examples); verbose queries 14/26 (10 misses, 2 wrong examples). This card makes the query side more forgiving where it is provably safe and
  stricter where it is provably lax, without touching the 0.6 threshold, document tokenisation or the index: (a) lookup includes the symbol(s) a query names; (b) search_symbols
  gets a gated per-token fallback and ranks declaring types before inheriting ones; (c) a small synonym map and a plural-acronym fix on the QUERY side only; (d) a documentation
  answer whose only evidence is a table chunk needs at least two distinctive query terms; (e) example and documentation relevance become IDF-weighted, with identifier-like
  query terms required, and "example", "sample", "use" and "how" join the generic words. Decisions recorded here. The "simple prefix tier" asked for in the findings is NOT added:
  tests/mcp/test_search_symbols_honest_miss.py pins "AFRelation" and "Watermar" as honest misses, and did-you-mean suggestions already rescue 63 percent of prefixes. The per-token
  fallback is gated (the query must contain whitespace, so a dotted or scoped name such as "PdfDocument.Rotate" stays a miss, as that test also pins) and only type-name tokens
  are admitted by lookup, so verified-absent probes keep their honest misses. What does NOT change: RELEVANCE_THRESHOLD (0.6), `tokenize` and every stored token, the index, any
  tool input schema, the miss `reason` texts, the response caps (card TC-515).
