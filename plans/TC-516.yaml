negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/relevance.py');s=p.read_text(encoding='utf-8');old='RELEVANCE_THRESHOLD = 0.6';assert s.count(old)==1;p.write_text(s.replace(old,'RELEVANCE_THRESHOLD = 0.3'),encoding='utf-8')"
  rationale: >-
    Lowers the relevance threshold to 0.3, so unrelated examples and documentation clear the floor again: the threshold-pin test, the fixed-negative example queries and the verified-absent-probe ceiling on irrelevant answers fail.
