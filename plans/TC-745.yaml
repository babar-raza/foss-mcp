id: TC-745
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a twelfth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism eleven sibling cards already proved for eleven other pilots this session (different
  pilots, zero file overlap - do not touch anything any of them touch). This is the FIRST brand-new
  sidecar for a TypeScript pilot this session (prior TypeScript-adjacent work was limited to
  README-derived candidates; no prior card has authored a TypeScript `authored_examples.yaml`).
  Confirmed needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates`
  already auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through `verify_typescript_example` in
  `example_verifier.py`, publishing only the ones that pass.

  `cells/typescript` currently serves only 6 real example chunks (confirmed directly against the
  real committed `infra/demo-manifests/cells__typescript__self_extracted` generation - note the
  plan's own Appendix C table says "3", which is now stale; re-confirm the real current count
  yourself before planning, do not trust either number blindly). Its real pinned repository is
  `aspose-cells-foss/Aspose.Cells-FOSS-for-TypeScript` (re-confirm the exact pinned commit yourself
  from `config/products/cells/typescript.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust
  this card's own citation blindly). The real upstream repository has a genuine `examples/`
  directory of roughly 9 real TypeScript modules (per this project's own Appendix-C style
  accounting for this pilot) - read enough of the real files to pick up to 5 genuinely distinct,
  valuable operations.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `cells/typescript` from 6 to AT MOST 11 served examples, not to its
  own real floor (10-25, Appendix C - this card may close or nearly close this pilot's own
  minimum floor if enough real examples verify, report honestly either way). This card's job is
  the real, bounded, immediately shippable slice: up to 5 new, real, individually-verified
  authored examples, each passing the real ingestion verifier before being trusted to publish.

  VERIFY EACH EXAMPLE YOURSELF - read `example_verifier.py`'s `verify_typescript_example` to
  confirm exactly what the real pipeline needs (likely `npm`/`node`/`tsc` or a strip-types run
  against the real pinned package). Do not assume a prior sibling card's exact toolchain shape
  applies unchanged - TypeScript has not been exercised by this mechanism before this session.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/cells_typescript/authored_examples.yaml
  - tests/indexing/test_authored_examples_cells_typescript.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_rust/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_cells_rust.py` (the general schema/structure convention, your closest
    available template despite being a different language). Also read `src/foss_mcp/indexing/
    authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`,
    `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal `normalised_code_sha256(code)`, `symbols`
    must be real FQNs, `library_commit` must be the real 40-hex pinned commit,
    `LANGUAGE_BY_PLATFORM` maps `typescript` -> `typescript`), `src/foss_mcp/indexing/
    example_verifier.py`'s `verify_typescript_example` in full, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `cells/typescript`'s real current served example count and real
    pinned repository/commit yourself. Fetch the real upstream `examples/` directory at that exact
    commit and read all of the real files to pick up to 5 real, genuinely distinct, valuable
    operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm a working Node/TypeScript toolchain,
    install the real pinned package, actually compile and RUN each program, confirm each one's
    real output matches what you claim. Do not submit an example you have not personally run
    successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `cells/typescript`'s example-corpus work is complete, even if it
    happens to reach this pilot's own floor - say so honestly either way, and do not pad with
    unverified examples just to hit a round number.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for cells/typescript via the existing
    authored_examples.yaml mechanism, raising its served example count toward 11.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_typescript.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_typescript/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-745/receipt.json
closeout:
  - >-
    cells/typescript gains up to 5 new, real, individually-verified authored examples via the
    existing, already-wired authored_examples.yaml mechanism (zero code change), raising its
    served example count toward 11 - real, bounded progress toward its full floor.
recovery: Re-run from a clean tree.
