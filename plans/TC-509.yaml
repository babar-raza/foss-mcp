actions:
- >-
  Add a stdlib Prometheus exposition (calls, misses, latency, sessions, rejections, readiness, generation info) behind /metrics while keeping the JSON
  default, and fold the call logging, usage event and metrics into one place in the tool dispatcher.
- >-
  Log and count session-cap rejections with a Retry-After header, cap the logged tool name, and make the production usage recorder a ring buffer.
