id: TC-509
gate: G3
lane: transport-deployment
purpose: >-
  REQ-G3-008 (independent pre-production review, findings PS-03, PS-04 and the logging and limits parts of PS-10). Observability of the shipped serving
  container is close to nil. Measured by the reviewer (protocol-security, ~17,000 soak calls and 770 sampled responses): /metrics is a JSON document with
  two numbers (`usage_events_queued`, `usage_events_dropped`) and no Prometheus exposition; the usage queue has no production consumer
  (`UsageRecorder.drain` is never called) so after 1,000 calls it sits at its cap forever, `queued` pinned at 1000 and `dropped` only growing, which
  carries no information; the per-call log line has the tool name, outcome, latency and a correlation id but no pilot, no error code and no hit or miss,
  so a 51 percent search_symbols miss rate (agentic review, 231 calls) is invisible to an operator; the client-chosen tool name of an unknown tool is
  logged unbounded; and the 200-session cap (`infra/serve_http.py` MAX_SESSIONS) is an unauthenticated lever whose 503 "Too many open sessions" has no
  Retry-After and no counter, so a flood of idle initialises or crashed agents holding slots for 5 minutes is not distinguishable from a healthy pod
  (the SDK writes its own bare WARNING without the pilot). This card makes the pod observable and changes no tool payload: (1) /metrics answers the
  Prometheus text exposition when the scraper asks for it (an Accept header naming text/plain or openmetrics, or `?format=prometheus`) and the
  EXISTING two-field JSON otherwise (several tests pin that exact body), with `foss_mcp_tool_calls_total{family,platform,tool,outcome,code}`,
  `foss_mcp_tool_misses_total{family,platform,tool}`, the histogram `foss_mcp_tool_latency_seconds`, the gauges `foss_mcp_open_sessions`,
  `foss_mcp_ready` and `foss_mcp_generation_info{generation_id,source_commit,build_revision}` (value 1) and the counter
  `foss_mcp_session_rejections_total`; (2) every tool-call log line also carries family, platform, the error code and hit (true, false or null), and the
  logged tool name is capped; (3) a session-cap rejection is counted, logged once per window at WARNING with the pilot, and answered with a Retry-After
  header; (4) the production usage recorder drops its OLDEST event when full (a ring buffer) so it can never be pinned at its cap by history. Readiness
  failure reasons are logged by TC-506 and are not duplicated here. What does NOT change: any tool result, the JSON body of /metrics, the default
  semantics of `UsageRecorder` (drop-new stays the default for existing callers and tests), the session limits themselves, and the Helm chart (a
  ServiceMonitor is not part of this card).
depends_on:
- TC-507
- TC-506
- TC-474
- TC-443
- TC-421
- TC-391
- TC-389
- TC-239
