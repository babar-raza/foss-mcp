- tests/infra/test_serve_metrics_prometheus.py
- tests/infra/test_serve_session_cap_observability.py
- tests/mcp/test_tool_call_log_fields.py
satisfies:
- REQ-G3-008
- REQ-G3-006
source_refs:
- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  Read, in full: infra/serve_http.py (`_metrics_route`, `build_app`, the MCP session limits and the middleware stack, plus the TC-506 readiness code and the
  TC-507 sidecar code now in it); src/foss_mcp/mcp/server.py (`_log_tool_call`, `_build_usage_event`, `_record_usage_safely`, `ToolErrorCode`, `create_server` and
  `_call_tool` with ALL of its exit paths as TC-506 and TC-507 left them); src/foss_mcp/telemetry/usage_recorder.py and tests/telemetry/test_usage_recorder.py;
  the SDK's session admission (`mcp/server/streamable_http_manager.py`, `_handle_stateful_request`, `_admit_session`, `_server_instances`) in the installed
  package. Existing tests that must stay green UNCHANGED: tests/infra/test_serve_http.py (the three /metrics tests assert the exact two-field JSON body),
  tests/mcp/test_server_wiring.py (`test_metrics_reflects_real_tool_calls_through_the_real_served_transport`, the usage-event tests, the
  `UsageRecorder(max_queued=1)` drop test), tests/infra/test_serve_http_session_limits.py, tests/infra/test_serve_logging.py. Never print or log any
  environment value, a query or a file content.
- >-
  NEW src/foss_mcp/telemetry/metrics.py (stdlib only, no new dependency: tests/test_serving_dependency_lock.py pins the serving dependencies). Module
  constants for the metric names, each on its own line, e.g. `TOOL_CALLS_TOTAL = "foss_mcp_tool_calls_total"` (the negative control edits this one),
  `TOOL_MISSES_TOTAL = "foss_mcp_tool_misses_total"`, `TOOL_LATENCY_SECONDS = "foss_mcp_tool_latency_seconds"`, `OPEN_SESSIONS = "foss_mcp_open_sessions"`,
  `SESSION_REJECTIONS_TOTAL = "foss_mcp_session_rejections_total"`, `GENERATION_INFO = "foss_mcp_generation_info"`, `READY = "foss_mcp_ready"`,
  `USAGE_EVENTS_QUEUED = "foss_mcp_usage_events_queued"`, `USAGE_EVENTS_DROPPED_TOTAL = "foss_mcp_usage_events_dropped_total"`, and
  `LATENCY_BUCKETS = (0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0)`; `CONTENT_TYPE = "text/plain; version=0.0.4; charset=utf-8"`. A class
  `MetricsRegistry(*, family: str, platform: str)` holding a `threading.Lock` and dicts: `observe_tool_call(*, tool: str, outcome: str, code: str,
  latency_seconds: float, miss: bool)` (increments the calls counter, adds the latency to the histogram, increments the misses counter when `miss`),
  `count_session_rejection()`, and `render_prometheus(*, open_sessions: int | None, ready: bool | None, generation_info: Mapping[str, str] | None,
  usage_queued: int, usage_dropped: int) -> str`. The text format is the standard one: a `# HELP` and a `# TYPE` line per metric family, counters as
  `name{labels} value`, the histogram as cumulative `_bucket{le="..."}` lines ending in `le="+Inf"` plus `_sum` and `_count`, label values escaped
  (backslash, double quote, newline), series sorted for stable output, `family` and `platform` as constant labels on every series, a gauge omitted when
  its value is None, and a trailing newline. Label values are bounded by construction: the tool label is a registered tool name or the literal
  "unknown", the code label one of ok, not_found, invalid_argument, internal, unavailable; never a query or an argument.
- >-
  src/foss_mcp/telemetry/usage_recorder.py: `UsageRecorder.__init__(self, max_queued=1000, *, overflow="drop_new")` with `overflow` in
  {"drop_new", "drop_oldest"} (anything else raises ValueError). "drop_new" is the current behaviour, unchanged and the default. "drop_oldest": when the
  queue is full, evict the oldest event, append the new one, increment `dropped_count` and return True. Update the class docstring (the production
  recorder is a ring so the queue always holds the latest events; nothing drains it today). tests/telemetry/test_usage_recorder.py is not edited.
- >-
  src/foss_mcp/mcp/server.py. (a) `create_server(..., metrics: MetricsRegistry | None = None)`: default a fresh `MetricsRegistry(family=scope.family,
  platform=scope.platform)`, so the signature stays backward compatible and `build_app` passes the SAME instance to its `/metrics` route (the same pattern
  as `usage_recorder`; do not use `or`, a registry is falsy-safe but keep the `is not None` form). (b) Replace the duplicated pairs of
  `_log_tool_call(...)` and `_record_usage_safely(...)` calls at EVERY exit path of `_call_tool` (unknown tool, validation error, value error, the TC-506
  unavailable branch, the TC-507 releases branch, the generic exception, success) with one inner function `_finish(...)` that takes the tool name, correlation
  id, started_at, outcome, code (None on success), result and arguments, and does the log line, the usage event (unchanged fields and the unchanged
  `_record_usage_safely`) and the metrics observation, in that order, each shielded so a failure in one never prevents the CallToolResult being returned.
  Keep `_log_tool_call` and `_record_usage_safely` as functions (tests import them) but give `_log_tool_call` the extra keyword arguments `family: str |
  None = None`, `platform: str | None = None`, `code: str | None = None`, `hit: bool | None = None`; its record keeps the message `tool call: %s (%s)` and the
  existing extras (`tool`, `correlation_id`, `outcome`, `latency_ms`) and adds `family`, `platform`, `code` ("ok" on success, the ToolErrorCode value
  otherwise) and `hit`. The logged `tool` extra is the tool name truncated to 64 characters (a client-chosen name is unbounded today), while the metrics
  tool label is "unknown" for an unregistered name. (c) `hit` is computed by a private `_result_hit(tool_name, result)`: for the six retrieval tools
  (lookup, search_docs, search_symbols, get_symbol, list_members, find_examples) it is False when `type(result).__name__` is Miss, NotFound or
  NoExampleFound or `getattr(result, "found", True) is False`, else True; for every other tool and for every error it is None. The metrics `miss` flag is
  `hit is False`. An empty list from list_recent_changes is NOT a miss. No result, payload, description or schema changes.
- >-
  infra/serve_http.py. (a) `_metrics_route(usage_recorder, registry, scrape)` where `scrape` is a small private object or closure set exposing
  `open_sessions() -> int | None`, `ready() -> bool | None` and `generation_info() -> dict[str, str] | None`, each shielded (an exception gives None and
  that gauge is omitted). The handler answers Prometheus text (`CONTENT_TYPE`) when `request.query_params.get("format") == "prometheus"`, or when the
  query parameter is absent and the Accept header contains `text/plain` or `application/openmetrics-text`; the JSON body (exactly the two existing fields)
  when `format=json` or neither condition holds (a client sending `*/*`, which is what the TestClient and curl send, keeps the JSON). `/metrics` stays
  exempt from the Origin rejection. (b) The gauges: open sessions is `len(server.session_manager._server_instances)` read through `getattr` with a safe
  default so an SDK change cannot break the scrape (a test pins the real value against the real SDK, which is the drift guard); ready is
  `readiness_report(generation_store).ready` from TC-506; generation_info is `{"generation_id": <active id>, "source_commit": <the indexed source commit
  from report_index_freshness for this scope, or "unknown">, "build_revision": <the part of `server_version()` after the "+", or "unknown">}`, None when no
  generation is active. (c) Session cap: a small ASGI middleware `SessionCapObserverMiddleware(app, on_reject)` placed INSIDE `ErrorSanitisingMiddleware`
  (wrapping `inner`): for HTTP requests whose path is not a probe path, when the response start has status 503, append the header `retry-after:
  5` (module constant `SESSION_CAP_RETRY_AFTER_SECONDS = 5`, one line, the negative control edits it) and call `on_reject()` once. `build_app`'s
  `on_reject` increments `registry.count_session_rejection()` and logs through `LOG` ONE WARNING "session cap reached, new session refused" with `extra={"family",
  "platform", "max_sessions", "open_sessions", "suppressed"}`, at most once per `_REJECT_LOG_INTERVAL_SECONDS = 10.0`, using a module-level `_monotonic =
  time.monotonic` that tests replace; the `suppressed` extra counts the rejections not logged since the previous record. (d) `build_app`: resolve ONE
  `MetricsRegistry` (a new `metrics: MetricsRegistry | None = None` parameter, default a fresh one) and pass it to both `create_server` and the route; when
  `usage_recorder` is None create `UsageRecorder(overflow="drop_oldest")`. Update the module and function docstrings.
