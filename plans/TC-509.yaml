  test_a_miss_is_counted_in_misses_total_and_a_hit_is_not; test_an_invalid_argument_error_has_the_invalid_argument_code;
  test_an_unregistered_tool_name_collapses_to_the_unknown_label (a 200-character name never appears in the output);
