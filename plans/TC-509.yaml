negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;m=pathlib.Path('src/foss_mcp/telemetry/metrics.py');h=pathlib.Path('infra/serve_http.py');a=m.read_text(encoding='utf-8');b=h.read_text(encoding='utf-8');o1='foss_mcp_tool_calls_total';o2='SESSION_CAP_RETRY_AFTER_SECONDS = 5';assert o1 in a and o2 in b;m.write_text(a.replace(o1,'foss_mcp_tool_calls',1),encoding='utf-8');h.write_text(b.replace(o2,'SESSION_CAP_RETRY_AFTER_SECONDS = 0',1),encoding='utf-8')"
  rationale: >-
    Renames the tool-call counter and zeroes the Retry-After value, so the tests that read the documented metric name from the exposition and the tests
    that assert the 503 carries Retry-After: 5 fail. A real break of the card's two central claims (an operator can scrape the documented series, and a
    refused session is told when to retry).
