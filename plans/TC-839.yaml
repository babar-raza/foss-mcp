source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: infra/build_chunks.py (`_build_verified_example_chunks`, `_single_example_chunk`,
    `_load_authored_candidates`, the chunk text format), src/foss_mcp/indexing (how the lexical
    index/doc_freq are produced from chunks - find the function ingest uses),
    tests/conformance/corpus.py (`manifests_root`, `copy_demo_manifests_to`, loaders),
    tests/mcp/tools/test_round3_retrieval_corpus.py, test_forgiveness_acceptance.py,
    test_find_examples_round2_recall_ratchet.py (TC-810) and the TC-827/TC-837 workers' simulation
    scripts in the session scratchpad
    (C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\tc827_probe
    and r837) which already do this for one pilot.
  - >-
    If any other pilot's sidecar (30 exist) fails the simulated ratchets, you may retitle ITS
    example too: add that pilot's sidecar and per-pilot test file to your list in the report and ask
    the supervisor to widen write_paths (do not edit outside the declared paths). Commit EXACTLY ONE
    commit (the supervisor's negative control reverse-applies the src/sidecar part; your new test
    must fail without it - i.e. with the offending retitle/policy reverted the simulated ratchet
    test fails). ruff format + ruff check; run the card's checks twice; report real counts. Do NOT
    use git stash. Never skip a test. Never use PowerShell Set-Content to write repo files.
actions:
  - >-
    Add a permanent post-regeneration retrieval simulation over all pilots and fix the pdf/java
    radio-example and words/python scope-size failures it exposes.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_post_regen_retrieval_ratchets.py tests/indexing/test_authored_examples_pdf_java.py tests/indexing/test_authored_examples_words_python.py tests/indexing/test_authored_examples_slides_python.py tests/mcp/tools/test_find_examples_rare_code_word.py tests/mcp/tools/test_find_examples_title_anchor.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 2400
    junitxml: true
    proves:
      - REQ-G3-014
  - command: '{python} -m pytest tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py tests/mcp/tools/test_find_examples_round2_recall_ratchet.py tests/mcp/tools/test_relevance_floor.py tests/mcp/tools/test_relevance_idf_synonyms.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 2400
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 60
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/mcp/tools/find_examples.py', 'src/foss_mcp/mcp/tools/relevance.py', 'tests/fixtures/furnished/pdf_java/authored_examples.yaml', 'tests/fixtures/furnished/words_python/authored_examples.yaml']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-839/receipt.json
closeout:
  - >-
    The retrieval ratchets pass on the post-regeneration (all authored examples baked) state of
    every pilot, and a permanent simulation guards it.
recovery: Re-run from a clean tree.
