id: TC-839
gate: G3
lane: verification
purpose: >-
  PRE-REGENERATION RETRIEVAL GATE. The retrieval ratchets
  (tests/mcp/tools/test_round3_retrieval_corpus.py, test_forgiveness_acceptance.py,
  test_find_examples_title_anchor.py, test_find_examples_round2_recall_ratchet.py,
  tests/conformance/*) read the COMMITTED `infra/demo-manifests`, in which many authored-sidecar
  examples are not baked yet (the sidecars grew by ~30 pilots since the last re-ingest). The
  TC-837 worker simulated the post-regeneration state for two pilots and found two latent failures
  that the regeneration will activate: (1) pdf/java: the radio-button example authored by TC-827
  ('Create a radio button form field and verify its selection after reload') makes
  `find_examples('add a button to a pdf')` answer wrongly (forgiveness concise table 23 hit / 2
  miss / 1 WRONG vs the required 0 wrong; fails test_concise_example_queries_still_hit_23_of_26
  and test_the_tc516_example_tables_are_unchanged) - the title word `button` anchors a generic
  query; (2) words/python: 11 README + 5 authored (+ restored) = 16 examples, above the
  `_RARE_CODE_WORD_MAX_SCOPE_EXAMPLES` = 12 cliff (TC-810), which drops round-2 recall pairs
  'header' and 'footer' and fails test_every_must_hit_pair_still_answers. Neither is visible
  today, both would appear the moment the data is regenerated. This card builds the simulation
  permanently and drives it to green BEFORE the regeneration: (A) add a reusable, offline test
  helper (tests/mcp/tools/post_regen_simulation.py, a plain module + a pytest plugin or fixture)
  that builds, for EVERY pilot, a copy of the committed generation in a temp dir whose authored
  `verified_example` chunks are replaced by the pilot's CURRENT authored_examples.yaml entries
  rendered in the real build_chunks chunk format (reuse infra/build_chunks.py's authored-chunk
  construction and TC-800's `_single_example_chunk`; mark them `Provenance: authored`; keep
  README-derived example chunks as committed; recompute the lexical index/doc_freq the way infra
  builds it so find_examples sees them) and repoints the corpus loaders (DEMO_MANIFESTS /
  tests/conformance/corpus.py `manifests_root`) at it; (B) new test
  tests/mcp/tools/test_post_regen_retrieval_ratchets.py that runs the SAME ratchet functions the
  committed-manifest tests run (import and call, do not copy numbers: the 729-case corpus
  wrong-confident <= the committed ceiling and per-family/per-pilot ceilings, forgiveness
  concise/verbose tables, round-2 recall must-hit pairs, title-anchor invariants) against the
  simulated tree, failing with the exact case ids; (C) make it GREEN by the narrowest
  evidence-based fixes, in order of preference: retitle an offending authored example (specific
  multi-word title, <= 12 words, grep the pilot's task queries for each word; sidecar title
  changes require updating that pilot's tests/indexing/test_authored_examples_<pilot>.py pins and
  keeping code_sha256 unchanged), then, only if a pilot's scope is legitimately above the
  12-example cliff, a measured per-scope policy in find_examples.py/relevance.py for the
  rare-code-word path (for example allow it for a term that is unique in the scope even above the
  cap, as TC-810 already does for the recurs-twice guard) - every such change must keep
  wrong-confident <= 43/729 and every round-2 must-hit pair, with before/after tables; never lower
  a floor, never weaken a ratchet, never edit an existing ratchet test's thresholds. Report every
  case that differs between committed and simulated trees, and the final pilot-by-pilot example
  counts. Do NOT touch infra/demo-manifests or tests/fixtures/verified_examples.
