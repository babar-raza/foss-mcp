    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top
      priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST: `src/foss_mcp/mcp/tools/get_product_reference.py`'s `_agent_guidance_section`,
    `_is_contributor_guidance`, `_cap_at_line`, `_CONTRIBUTOR_LABEL`,
    `_UNTRUSTED_UPSTREAM_NOTICE` in full. Confirm with your own eyes, against the real committed
    `infra/demo-manifests/product_reference_3d_net.json`, that the "Always follow the skill
    foss-agent..." line is served verbatim today, under the "## Notes" heading, in the real
    `agent_guidance.content` field.
  - >-
    REPRODUCE FIRST: write a test calling `get_product_reference` (or `_agent_guidance_section`
    directly) against the real 3d/net sidecar data and confirm the imperative line is present,
    unneutralized, in the result's text today, before changing anything.
  - >-
    Implement the strip, applied to `agent_guidance.content` BEFORE the existing cap/label/notice
    wrapping in `_agent_guidance_section` (so a stripped line never counts toward the character cap
    either, and the stripped placeholder itself is a normal line of the capped content). Measure
    your own real detection rule against ALL 32 real pilots' real `agent_guidance.content`
    (`infra/demo-manifests/product_reference_*.json`, the `agent_guidance.content` field) and
    report, per pilot, how many lines (if any) your rule strips - the only real case today must be
    the single 3d/net line; every other 31 pilots' agent_guidance content must be byte-for-byte
    unaffected (Decision E: no card lowers a floor - here, that means no card introduces a FALSE
    strip either).
  - >-
    Write real, deterministic unit tests in the new file proving: (a) the real 3d/net case is now
    stripped and replaced with the honest placeholder, the rest of that document's content
    unchanged; (b) a line containing "skill" WITHOUT any imperative cue (e.g. "the skill required to
    operate this library is minimal") is NOT stripped (your rule requires BOTH, not "skill" alone -
    even though "skill" alone is safe against today's real 32-pilot corpus, the rule itself must not
    rely on that coincidence); (c) a line containing an imperative cue WITHOUT "skill" (e.g. "Always
    run the tests before committing") is NOT stripped (this is ordinary, legitimate contributor
    guidance, not an agent-directed injection); (d) a document with no matching line at all (31 of
    32 real pilots) is byte-for-byte unaffected by this card, same `ReferenceContent` as before; (e)
    a document with the matching line appearing MORE THAN ONCE (synthetic case - construct your
    own) has every real occurrence stripped, not just the first.
  - >-
    MEASURE: re-run `tests/conformance/test_reference_content.py` and any existing test exercising
    `_agent_guidance_section`/`_is_contributor_guidance` (grep `tests/` for both names first) BEFORE
    and AFTER your change, and report real pass/fail counts.
actions:
  - >-
    Strip a real, reproduced prompt-injection-shaped line from `agent_guidance` content (the
    specific "skill" + imperative-cue pattern measured as the ONLY real occurrence across all 32
    pilots), replacing it with an honest placeholder, with zero behavior change for every other
    pilot's agent_guidance content. The companion stale-session-log cross-check (3D-JAVA-005) is
    explicitly deferred to a separate future card - it needs new cross-module access to the live
    symbol index, not a text transform.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_get_product_reference_agent_imperative_neutralization.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-013
  - command: '{python} -m pytest tests/conformance/test_reference_content.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 5
requires:
  - python
network: true
# NOTE (supervisor): tests/conformance/test_reference_content.py (check 2) does not actually reach
# the network - it contains a fixture string literal "git clone https://example.invalid/x.git"
# inside a markdown-fenced test case, which cardlint's own blunt NETWORK_HINTS substring scan
# cannot distinguish from a real invoked command (the same false positive TC-678/TC-680/TC-681 all
# hit on this exact file). Declared network: true per the tool's own suggested escape valve.
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; q = chr(34); p = pathlib.Path('infra/demo-manifests/product_reference_3d_net.json'); s = p.read_text(encoding='utf-8'); old = 'Always follow the skill foss-agent'; assert s.count(old) == 1, 'the required real literal was not found as expected - if the real sidecar text has shifted, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; p.write_text(s.replace(old, 'Always eat the pie foss-agent', 1), encoding='utf-8')"
  rationale: >-
    Removes the word "skill" from the one real sidecar line this card's own strip rule targets
    (replacing it with unrelated text that keeps the imperative cue "Always" but drops the
    co-occurring "skill" trigger), so the real production detection rule no longer matches this
    specific line and the strip never fires. Any test proving the real 3d/net line is stripped must
    fail under this mutation; every test using a synthetic fixture (not this real sidecar file) is
    unaffected.
evidence:
  - evidence/build/G3/TC-683/receipt.json
closeout:
  - >-
    `get_product_reference`'s `agent_guidance` section now strips a real, measured,
    prompt-injection-shaped line (the only one across all 32 real pilots) rather than serving it
    verbatim, with zero behavior change for every other pilot. The companion stale-session-log
    cross-check (3D-JAVA-005) remains flagged, not yet carded, pending new symbol-index access.
recovery: Re-run from a clean tree.
