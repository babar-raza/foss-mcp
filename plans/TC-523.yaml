negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='return readonly, optional, is_static, is_async';assert s.count(old)==1;p.write_text(s.replace(old,'return False, False, False, False',1),encoding='utf-8')"
  rationale: >-
    Makes the token helper report no readonly, optional, static or async member: interface members stay writable-by-default wrongly or lose their
    optional mark, `static async open` loses both marks, and the acceptance cases (`x?: number; readonly y: string`, `static async open(...)`) and the
    rendering tests fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-523/receipt.json
closeout:
- >-
  TypeScript and JavaScript chunks no longer call every interface member read-only, show optional members and parameters, type alias values, static
  and async marks and parameter defaults, and no longer publish @internal members. The committed TypeScript fixtures are still version 1 and listed
  in KNOWN_GAP; the re-extraction card must regenerate cells_typescript, pdf_typescript, 3d_typescript, jmap_typescript and jmap_nodejs (it must also
  pin pdf_typescript to ONE commit for the symbols and the documentation, which is another card), verify `extractor_version` 5 or higher, that
  `Style.font` is writable and `[optional]`, that ArrowShapeType carries its union, that Document.Open is `[static]`, delete the KNOWN_GAP entries and
  refresh the docs-identifiers allowlist, then the image is rebuilt.
recovery: Re-run from a clean tree.
