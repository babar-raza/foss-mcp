id: TC-237
gate: G2
lane: transport-deployment
purpose: 'Fix 3d/python''s manifestPath, a real live bug found by deploying TC-236''s own work: the pilot serves from poc14c but
  its serving pod''s wait-for-product-reference init container never completes, because the ingestion Job''s sidecar fetch step
  (fetch_product_reference.py, which supports the get_product_reference tool) requests pyproject.toml at the pinned commit and
  gets a real HTTP 404 - the real repository (aspose-3d-foss/Aspose.3D-FOSS-for-Python) has no pyproject.toml at all; it packages
  with the older setup.py convention (confirmed by a live GitHub contents read on 2026-10-07: the repo root holds setup.py,
  MANIFEST.in, an aspose/ package directory, no pyproject.toml anywhere). TC-236''s own card text stated "python -> pyproject.toml"
  as an unconditional default without requiring a survey for this specific repository, unlike the one platform (net) it did flag -
  this is the root cause, a supervisor authoring gap, not a worker defect. manifest_reader.py''s read_python_manifest already has
  a working setup.py-regex fallback (see its own docstring), so this is purely a one-value config fix, not an engine change.'
depends_on:
- TC-236
write_paths:
- infra/helm/foss-mcp/values.yaml
- tests/infra/test_helm_manifest_step.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'In infra/helm/foss-mcp/values.yaml, find the pilot entry with family: 3d and platform: python, and change its manifestPath
  from pyproject.toml to setup.py. Change nothing else about that entry and nothing about any other pilot.'
- 'Add exactly one new test to tests/infra/test_helm_manifest_step.py: test_the_rendered_3d_python_fetch_step_passes_its_manifest_path_literally,
  mirroring the existing literal-pin tests'' exact shape and reasoning (a literal expected value, never read back from values.yaml,
  since the generic per-pilot check is self-referential and cannot catch a wrong value). Look up the 3d/python pilot specifically
  (family == "3d" and platform == "python"), render the chart, and assert its fetch step''s --manifest-path flag equals the
  literal string "setup.py". This is the negative control''s real target.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Change the one manifestPath value.
- Add the one literal-pin test.
- Run the card check and report exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_manifest_step.py -q -rfE'
  expect: exit 0
  timeout_seconds: 120
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 15
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/values.yaml');s=p.read_text(encoding='utf-8');marker=chr(10).join(['    - family: 3d','      platform: python']);old='manifestPath: setup.py';new='manifestPath: setup_off.py';i=s.index(marker);j=s.index(old,i);s=s[:j]+new+s[j+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: 'Renames 3d/python''s manifestPath specifically (found via a two-line family+platform anchor), so the new literal-pinned test must fail. Built with plain text.'
evidence:
- evidence/build/G2/TC-237/receipt.json
closeout:
- 3d/python's serving pod completes its wait-for-product-reference init container against the real repository.
recovery: Re-run from a clean tree.
