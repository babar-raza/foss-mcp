id: TC-850
gate: G3
lane: verification
purpose: >-
  REGEN cohort C3 (pdf_java, slides_java, cells_java, 3d_java). The committed infra/demo-manifests
  data for these pilots was last baked before TC-700..TC-847 (one-chunk verified examples, honest
  verification levels, authored examples, python re-export shells TC-818, private dataclass init
  fields TC-819, stub detection TC-559/TC-844/TC-847, TS class docs TC-821, run steps TC-805..807,
  known_hazards, coverage-line clause split) and, for 31 of 32 pilots, carries 64-dim hashing
  vectors, which makes find_examples permanently lexical-only (docs/RELEASE.md,
  example_search_mode.py). Regenerate the cohort with the cluster-free route
  scripts/release/regenerate_local.py (helm template + docker run in the ingestion image built
  from THIS branch, gateway 4096-dim vectors, copy-back of pointer + active generation +
  verification caches, compaction), review what changed per pilot, and land the data together with
  the test pins it legitimately moves. No pilot may get worse (AGENTS.md): every regenerated pilot
  is compared with the committed one by generation_diff.py and answer_diff.py before the data is
  committed.
depends_on:
  - TC-808
  - TC-537
  - TC-575
  - TC-576
  - TC-579
  - TC-597
  - TC-602
  - TC-615
  - TC-678
