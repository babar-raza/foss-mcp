id: TC-755
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a twenty-second real pilot-adoption win via the
  EXISTING, already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the
  same mechanism twenty-one sibling cards already proved (different pilots, zero file overlap -
  do not touch anything any of them touch). Confirmed needing ZERO code change:
  `infra/build_chunks.py`'s `_load_authored_candidates` auto-loads `tests/fixtures/furnished/
  <pilot>/authored_examples.yaml`, merges it with README-derived candidates, and runs every entry
  through `verify_python_example`, publishing only the ones that pass.

  `email/python` currently serves only 3 real example chunks (the authoritative count - read
  `payload.stats.examples` directly from the real committed `infra/demo-manifests/
  email__python__self_extracted` generation JSON via `json.load`, NEVER by grepping a literal
  string, which overstates the count roughly 2x). Its own real floor is 5-8 (Appendix C). Its
  real pinned repository is `aspose-email-foss/Aspose.Email-FOSS-for-Python` (re-confirm the exact
  pinned commit from `config/products/email/python.yaml`/`infra/helm/foss-mcp/values.yaml` - do
  not trust this card's own citation blindly).

  Check whether the real upstream repository ships a dedicated `examples/`-style sample directory
  at the pinned commit - CONFIRM this directly. Per this project's Appendix-C accounting it
  should ship about 3 example scripts; if so, adapt them (as standalone, self-contained scripts)
  before reaching for API-surface-derived examples from `tests/fixtures/email_python/
  api_surface.json`.

  `_MAX_EXAMPLES = 5` is a hard ceiling. Up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/email_python/authored_examples.yaml
  - tests/indexing/test_authored_examples_email_python.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-10 — real upstream library bug found while authoring cells/typescript examples
    sha256: 8df3a8bfc66641638fb11bd910058364faec2ebd735110b2195366ff985e1812
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/slides_python/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_slides_python.py` (same-language sibling template, from TC-750).
    Also read `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit, `LANGUAGE_BY_PLATFORM` maps `python` -> `python`),
    `src/foss_mcp/indexing/example_verifier.py`'s `verify_python_example`, and
    `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `email/python`'s real current served count (via
    `payload.stats.examples`) and real pinned repository/commit yourself. Determine the upstream
    shape (examples/ scripts vs API-surface-only) before planning.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: install the real pinned package in a venv,
    run each adapted script, confirm its real output matches what you claim. Do not submit an
    example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input. Confirm none of your examples trips them. Email examples
    often need SMTP/IMAP: do NOT include anything that opens a network connection or needs
    credentials - use local .eml/.msg round trips instead.
  - >-
    Run `ruff format` and `ruff check` on the new test file before committing.
  - >-
    This card does NOT claim `email/python`'s example-corpus work is complete. If fewer than 5
    real candidates verify cleanly, submit the real number and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for email/python via the existing
    authored_examples.yaml mechanism, raising its served example count from 3 toward 8.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_email_python.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/email_python/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-755/receipt.json
closeout:
  - >-
    email/python gains up to 5 new, real, individually-verified authored examples via the
    existing, already-wired authored_examples.yaml mechanism (zero code change), raising its
    served example count from 3 toward 8 - real, bounded progress toward its own (5-8) floor.
recovery: Re-run from a clean tree.
