id: TC-071
gate: G2
lane: storage-retrieval
purpose: 'Fix lookup''s composition (REQ-G2-049): a task-oriented query with no prior
  API knowledge (e.g. ''how do I add a watermark to a PDF'') must be able to get back
  BOTH the relevant documentation guidance AND a verified example in one answer. Attempt
  1 correctly implemented lookup.py''s composition logic but proved, via its own negative
  control, that the branch is architecturally unreachable: search_symbols does an
  unfiltered lexical scan over the SAME generation find_examples''s pseudo-symbol
  example chunks live in (both use the identical ''self_extracted'' scope key), so
  search_symbols matches an example chunk''s own text and lookup takes the exact-symbol-match
  branch before ever reaching doc-fallback composition. This attempt fixes the actual
  root cause: search_symbols must exclude the honestly-labeled ''Example: <title>''
  pseudo-symbol convention TC-068 established from its own notion of a symbol match.'
depends_on:
- TC-017a
- TC-017b
write_paths:
- src/foss_mcp/mcp/tools/lookup.py
- src/foss_mcp/mcp/tools/search_symbols.py
- tests/mcp/tools/test_retrieval_tools.py
satisfies:
- REQ-G2-049
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 8.2 Common tools — present identically on every instance (9 tools —
    this table is the single authoritative registry; tool discovery, JSON schemas,
    and generated documentation are all derived from it, never restated independently)'
  sha256: fcc5e91a552d272bd617369066de6c312007c25806671af9c1ccbbfd6f574453
inputs:
- 'CONFIRMED by attempt 1''s own rigorous work (reproduced empirically, not a guess):
  search_symbols.py (src/foss_mcp/mcp/tools/search_symbols.py) does an UNFILTERED
  lexical scan (query_lexical_index) over scope_key(scope, ''self_extracted'') - the
  exact same generation infra/ingest.py''s real pdf/net run publishes BOTH real type-symbol
  chunks AND TC-068''s verified-example chunks into (both published under --source-kind
  self_extracted in the current real pipeline). find_examples.py (src/foss_mcp/mcp/tools/find_examples.py)
  reads the SAME scope key. TC-068''s example chunks are deliberately, honestly labeled
  with a pseudo-FQN of the exact literal shape ''Example: <title>'' (not a real class/method
  FQN, by design - see TC-068''s own card). search_symbols has no concept of this
  distinction and happily lexically matches an example chunk''s own descriptive text
  (e.g. a chunk titled ''Example: Add a Watermark Annotation'' matches the query ''watermark''
  just as strongly as a real symbol would), so lookup''s existing ''try search_symbols
  first'' dispatch takes that branch and returns before ever reaching the doc-fallback+find_examples
  composition path attempt 1 built.'
- 'The fix belongs in search_symbols.py alone, and must mirror find_examples.py''s
  own already-established pattern for the exact same problem (read find_examples.py''s
  existing `ranked = query_lexical_index(lexical_payload, query, top_k=len(documents))`
  line - it already searches the WHOLE corpus before filtering down, precisely to
  avoid losing real candidates to a premature top_k cut). Apply the same pattern in
  search_symbols(): query the whole corpus first, exclude any doc_id whose FQN (via
  get_symbol.py''s already-exported extract_fqn(text) function - import it, do not
  reimplement FQN parsing a second time) starts with the exact literal ''Example:
  '', THEN truncate to the caller''s real top_k. Write this literal using SINGLE quotes
  in the actual source: `.startswith(''Example: '')` (not double quotes) - the exact
  literal substring startswith(''Example: '') with single quotes is required in the
  committed file for the negative control below.'
- 'This is a real, honest exclusion, not a workaround: search_symbols''s own module
  docstring says it searches ''foss-mcp''s own self-extracted API surface for a symbol
  name'' - a pseudo-symbol explicitly labeled as an example in TC-068''s own design
  was never meant to be reported as a real symbol match. Excluding it is the CORRECT
  reading of search_symbols''s own contract, not a special case invented for this
  card.'
- 'Once this filter exists, lookup.py''s own composition logic (already correctly
  written in attempt 1 - do not change its shape) becomes genuinely reachable: a query
  like ''watermark'' that used to incorrectly win on the symbol branch now correctly
  returns a Miss from search_symbols (since the only lexical match was the now-excluded
  pseudo-symbol chunk), letting lookup fall through to search_docs, find a doc match
  (if the furnished/self_extracted corpus has one), and compose it with find_examples''s
  real result into a TaskAnswer.'
- Keep lookup.py's existing composition logic and its inputs from the original card
  authoring exactly as already implemented (TaskAnswer(scope, doc_matches, example),
  the exact literal `example_result[0] if isinstance(example_result, list) and example_result
  else None` deciding the example field) - attempt 1's implementation of this part
  was correct, only untestable until now.
actions:
- 'Fix search_symbols.py''s own matching to exclude ''Example: ''-prefixed pseudo-FQN
  chunks, exactly as described above.'
- 'Add a DIRECT test of this exclusion in search_symbols''s own test coverage (in
  tests/mcp/tools/test_retrieval_tools.py): publish a generation containing one real
  symbol chunk and one ''Example: <title>''-prefixed pseudo-symbol chunk that both
  lexically match the same query; search_symbols(query) returns ONLY the real symbol,
  never the pseudo-symbol. A query that ONLY the pseudo-symbol chunk matches returns
  an honest Miss from search_symbols, not the pseudo-symbol.'
- 'Now that this is genuinely reachable, implement (or fix, if attempt 1 left a placeholder
  in its place) a real scenario-3 test for lookup: no real symbol matches the query,
  a real doc match exists, AND a real example chunk exists for the same query - lookup
  returns a TaskAnswer with doc_matches populated AND example populated with the real
  ExampleMatch. Construct this with a real published generation containing all three
  kinds of chunk (a real symbol, a doc chunk, an Example:-prefixed chunk) so the test
  proves the full, real dispatch priority - not an isolated mock of any one tool.'
- Keep every other test from attempt 1 (content_type unchanged, exact-symbol-match
  unchanged, no-example honest miss, full miss unchanged) - this is additive plus
  one root-cause fix, not a rewrite.
- Run the full existing test suite yourself and confirm nothing else broke - especially
  any existing search_symbols test that legitimately expects a REAL symbol match to
  keep working exactly as before.
checks:
- command: '{python} -m pytest tests/mcp/tools/test_retrieval_tools.py -q'
  expect: exit 0
  timeout_seconds: 120
  junitxml: true
  proves:
  - REQ-G2-049
min_tests: 6
network: false
negative_control:
  mutate: 'python -X utf8 -c "import pathlib;p=pathlib.Path(''src/foss_mcp/mcp/tools/search_symbols.py'');s=p.read_text(encoding=''utf-8'');s=s.replace(''startswith(''+chr(39)+''Example:
    ''+chr(39)+'')'',''startswith(''+chr(39)+''Example: DISABLED_''+chr(39)+'')'');p.write_text(s,encoding=''utf-8'')"'
  rationale: Corrupting the exclusion literal so it never matches any real pseudo-symbol
    prefix must break BOTH the direct search_symbols exclusion test AND the lookup
    scenario-3 composition test (since search_symbols would once again incorrectly
    intercept the query) - proving the fix is the actual load-bearing mechanism connecting
    both, not a coincidental pass. This replaces attempt 1's negative control, which
    attempt 1 itself proved vacuous via gatectl review's own mechanical VACUOUS CHECKS
    verdict - not overridden, corrected. Self-checked end-to-end against a fixture
    implementing the exact prescribed literal before being persisted.
evidence:
- evidence/build/G2/TC-071/receipt.json
closeout:
- search_symbols never reports a TC-068-style pseudo-symbol as a real symbol match.
- A task-oriented query can genuinely reach lookup's composition path and get back
  both documentation guidance and a verified example in one answer, when both exist.
- An exact real-symbol match and an explicit content_type request are completely unaffected.
- No example is ever fabricated when none exists - an honest partial answer.
- Corrupting the exclusion literal fails both the direct search_symbols test and the
  lookup composition test.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
