id: TC-536
gate: G3
lane: verification
purpose: >-
  REQ-G3-008 and REQ-G3-001 (independent pre-production review: the data-budget, e2e-pin and self-expiring-exception tail of the extraction
  remediation). DATA BUDGETS, CHART CAPS, E2E PINS, EXPIRED EXCEPTIONS. The re-extraction cards TC-530 to TC-535 raise 13 per-pilot caps, add member
  documentation and rewrite 40 fixtures; none of them can measure the baked tree, because the ingestion is a supervisor step. The supervisor
  re-ingests all 40 pilots and commits the refreshed, compacted infra/demo-manifests AFTER TC-535, and only then dispatches this card (the dispatch
  instruction names that commit and the image revision). Facts to keep in view: tests/deploy/test_compact_demo_manifests.py pins the tree at
  29,500,000 bytes (TREE_BYTES_BUDGET), the largest generation file at 2,950,000 and the median at 640,000, and
  tests/deploy/test_demo_manifests_sidecars.py pins the tree at 29,500,000; the measured tree was 28,069,555 bytes, largest 2,944,920, median 577,817
  on 2026-10-14 (TC-503). TC-527's estimate for the finished data is a tree of about 35,000,000, a largest file of about 3,300,000 and a median of
  about 760,000 (member documentation is capped at 300 characters per member, 4,000 per type, 48,000 per pilot; a generation file holds each chunk's
  text and its token list). The review's measured file sizes: the fixtures alone grow (pdf_net 2.1 to about 6 MB, pdf_java 3.3 to about 12 MB) but the
  baked generations hold only chunk text. This card (1) measures the committed tree and re-pins the three budgets of the two tests to the measured
  values plus 5 percent headroom, with comments, exactly as TC-503 did, changing constants and comments only; (2) adds an offline all-40-pilots test
  that the chart's maxTypes, docker-compose's --max-types and the extractor's recommended cap are one number per pilot and that the ingestion slice
  drops nothing; (3) removes every temporary exception the chain created or the review listed that the refreshed data no longer needs
  (STALE_BAKED_PILOTS, COMMIT_EXCEPTIONS['pdf_typescript'], COVERAGE_EXCEPTIONS['jmap_go'], stale UNRESOLVED entries) and brings the API-Coverage
  check of tests/deploy/test_fleet_consistency.py to the grammar the merged chunk builder writes; and (4) adds an offline test that the literal pins
  of the seven docker end-to-end files (symbol, enum member, method fragment, source commits, example symbol, documentation fragment) still hold in
  the shipped baked data, and repins those that do not. It does NOT change src/, fixtures, the baked manifests, the chart, docker-compose or any
  furnished page.
