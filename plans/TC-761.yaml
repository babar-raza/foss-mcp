id: TC-761
gate: G3
lane: storage-retrieval
purpose: >-
  Investigation-first: close the remaining find_examples wrong-confident gap TC-760's retitling
  could not close (see `docs/DECISION_LOG.md`, 2026-11-11 "title-only remediation has a measured
  ceiling..."). Measured state after TC-760: 55/729 wrong-confident (0.0754), ceiling 0.059,
  pre-campaign baseline 42/729 (0.0576). Three independent attempts at retitling (the supervisor's
  own plan, the TC-760 worker's pass, and a candidate-title sweep) all measured that almost no
  replacement title of reasonable length avoids colliding with SOME other real query in the same
  family, because `title_anchored`'s single-shared-distinctive-word admission (TC-543/586) combined
  with a dense per-family query corpus makes title wording a losing lever at this corpus density.

  Design and measure a SCOPE-LOCAL mitigation to `title_anchored` (or its caller in
  `find_examples.py`) mirroring the exact rigor and scoping discipline TC-672's own rare-code-word
  mechanism already established for the CODE path: a shared title word anchors only when it is
  genuinely RARE among THIS SCOPE's OWN example titles (not a global stopword list, not a hardcoded
  exclusion list, computed fresh per call from this scope's own titles, never cached, never
  cross-scope) - the natural title-side analog of `_RARE_CODE_WORD_MAX_SCOPE_EXAMPLES`/
  `code_example_frequency`. A word present in most of a scope's own titles carries little specific
  anchoring signal for that scope; a word present in only one or two does.

  FROZEN ACCEPTANCE (measured against the full corpus, not assumed): the real fleet-wide
  wrong-confident rate (`tests/mcp/tools/test_round3_retrieval_corpus.py::
  test_find_examples_non_empty_answers_that_miss_the_intended_api_stay_rare`) must drop to at or
  below 0.059 (42/729 or fewer), AND no existing ratchet floor anywhere in
  `tests/mcp/tools/test_round3_retrieval_corpus.py` or `tests/mcp/tools/test_forgiveness_acceptance.py`
  may regress (hit@3, the 26-pilot verbose-hit floor, every per-family wrong_conf ceiling, every
  per-pilot floor) - every one must hold or improve, verified by running BOTH files in full, twice,
  before and after. If the measured numbers do not clear this bar after a genuinely careful attempt,
  STOP and report the real numbers honestly rather than shipping a weakened check, a narrowed
  ceiling, or a guess presented as a fix - this is explicitly permitted and preferred over a false
  "done" claim (AGENTS.md: "a confident report is not evidence of anything").
depends_on:
  - TC-670
  - TC-688
  - TC-760
inputs:
  - >-
    READ FIRST, in full: `src/foss_mcp/mcp/tools/relevance.py`'s `title_anchored`,
    `TITLE_ANCHOR_MAX_TERMS`, `TITLE_ANCHOR_GRADUATED_MAX_TERMS`, `distinctive_terms`,
    `present_terms`, `tokenize` (every comment explaining WHY the current design is what it is -
    this mechanism has been measured and adjusted three times before, TC-543/586, and a fourth
    change must respect everything the first three already proved, never undoing their own
    measured trade-offs). Read `src/foss_mcp/mcp/tools/find_examples.py`'s TC-672 block in full
    (`rare_code_required`, `code_example_frequency`, `_RARE_CODE_WORD_MAX_SCOPE_EXAMPLES`,
    `_RARE_CODE_WORD_EXCLUDED_TERMS`) - this is your exact scoping-discipline template, applied to
    code; you are building the analogous thing for titles.
  - >-
    READ `docs/DECISION_LOG.md`'s 2026-11-11 entries in full (both the "full scope" one and the
    "measured ceiling" one cited in source_refs) for the exact real data: 19 remaining cases, 16
    genuine title-word shares, 3 unfixable-by-title coverage-floor cases (leave those 3 alone -
    they are out of this card's scope, already accepted as a residual).
  - >-
    REPRODUCE FIRST: run the real fleet ratchet yourself against the current committed corpus and
    confirm the real current wrong-confident count before touching anything (do not trust the
    number in this card's own text without checking - state may have moved since this was
    written).
  - >-
    DESIGN: for a given scope and a given candidate title word, compute how many of that SAME
    scope's own served example titles (every example doc in this generation, both authored and
    README-derived - not a cached or global set) contain that same stemmed/synonym word. A title
    word anchors only when its own-scope title frequency is below some measured threshold. Pick the
    threshold by MEASURING, not guessing: try at least two candidate thresholds (e.g. "present in
    at most 1 other title" and "present in fewer than half of this scope's titles," mirroring
    `code_example_frequency.get(t, 0) * 2 < len(example_doc_ids)`'s own halving rule) and report
    the real wrong_conf number each one produces before picking.
  - >-
    This change must be ADDITIVE and NARROWING ONLY: a query/title pair that anchors today for a
    genuinely rare, specific word (the overwhelming majority of correct title-anchor hits fleet-
    wide) must keep anchoring. Only a shared word that is common within ITS OWN scope's titles
    loses its anchoring power. Never touch the graduated escape (`TITLE_ANCHOR_GRADUATED_MAX_TERMS`)
    or `title_prefix_anchored` unless your own measurement proves one of those needs the identical
    treatment - state explicitly if you leave them untouched and why.
  - >-
    Measure against the SAME 729-case corpus (`test_round3_retrieval_corpus.py`) and the 26-pilot
    forgiveness table (`test_forgiveness_acceptance.py`) before AND after, twice each. Report every
    number, not just the ones that improved. If any existing floor regresses even slightly, you may
    NOT lower that floor to compensate - find a narrower version of the mitigation, or stop and
    report that no safe version exists.
  - >-
    Write a focused new test file asserting the new scope-local rarity mechanism directly (unit-
    level: a synthetic small scope where a word appears in most titles vs. a scope where it appears
    in only one, proving the threshold behaves as designed) - this is additive, narrow coverage,
    never a replacement for the fleet-wide ratchets which remain the real acceptance gate. Write at
    least 5 test functions in that new file (the common-word-does-not-anchor case, the rare-word-
    still-anchors case, a scope-boundary proof that one scope's title frequency never leaks into
    another scope's decision, the graduated-escape path staying untouched, and a direct comparison
    against at least two candidate thresholds) so `min_tests: 5` is met by that file alone.
write_paths:
  - src/foss_mcp/mcp/tools/relevance.py
  - src/foss_mcp/mcp/tools/find_examples.py
  - tests/mcp/tools/test_title_anchor_scope_rarity.py
satisfies:
  - REQ-G3-011
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-11 — title-only remediation has a measured ceiling; the remaining gap needs a scope-local algorithm change, not more retitling
    sha256: 66b4901d59bcc6c2b49d1174817e646cd8f01452c6c372b241af3ebf5b613d44
actions:
  - >-
    Design, measure, and (only if the measured numbers clear the frozen acceptance bar) implement a
    scope-local title-rarity narrowing of title_anchored, closing the remaining find_examples
    wrong-confident gap without regressing any existing ratchet floor.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_title_anchor_scope_rarity.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-011
  - command: '{python} -m pytest tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 1800
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/relevance.py'); s = p.read_text(encoding='utf-8'); old = 'def title_anchored(query: str, family: str, title: str) -> bool:'; assert s.count(old) == 1, 'title_anchored signature not found exactly once - re-anchor this mutate on the real post-fix signature line before trusting it'; new = old + chr(10) + '    return True  # TC-761 negative control: force every title to anchor unconditionally'; s2 = s.replace(old, new, 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Inserts an unconditional `return True` as the first statement of title_anchored, re-introducing
    the worst possible version of the regression this card fixes (every example in every scope
    anchors every query). The fleet-wide wrong-confident ratchet must then fail hard. The anchor is
    the function's own public signature line, which must stay stable since other modules call it -
    if the worker's own fix changes that signature, they must re-anchor this mutate and say so,
    never leaving a silently-vacuous falsifier.
evidence:
  - evidence/build/G3/TC-761/receipt.json
closeout:
  - >-
    EITHER a scope-local title-rarity mitigation is implemented, measured against the full 729-case
    corpus and the 26-pilot forgiveness table, and the fleet-wide wrong-confident rate is back at or
    below 0.059 with every existing floor held or improved; OR the card stops and reports the real
    measured numbers for every candidate tried, with no check weakened and no floor lowered.
recovery: Re-run from a clean tree.
