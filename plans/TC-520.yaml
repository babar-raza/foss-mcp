purpose: >-
  REQ-G3-008 (independent pre-production review, findings RST-01 selection part, RST-03 = ISOPROV-01, AGT-03, ISOPROV-06; RST-17 is NOT
  addressed). COVERAGE POLICY AND PARSE-FAILURE HONESTY. Measured by the reviewer on the shipped image: (1) 12 pilots index a capped slice of
  their API and the cap is blind to what the library's own README names: pdf/net 300 of 901, pdf/java 300 of 1239, words/net 300 of 618, pdf/python
  300 of 867, pdf/cpp 300 of 361; search_symbols PdfFileEditor, PdfFileSignature, PageCollection, TextBuilder, PngDevice, TableAbsorber (pdf/net),
  PdfFileEditor (pdf/python), FindReplaceOptions, JoinRunsOptions (words/net) are honest misses although the README names them; README recall top-3
  is 33 percent on pdf/net and pdf/java. Root: `reduce_fixture` in src/foss_mcp/extraction/run_extraction.py (L499-548) ranks groups by how many
  OTHER types reference them (`_group_centrality_scores`), so leaf entry points score zero, and `must_keep` is fed only with the types used inside
  the furnished page's code fences (`names_used_in_examples`, L652). (2) The cap is spent on engine internals: 193 of pdf/java's 300
  (org.aspose.pdf.engine.xfa.*), 50 of pdf/cpp's 300 under include/internal/, 22 of slides/net under .Internal., 13 of pdf/python from
  aspose_pdf/generated/, cells/typescript carries the vendored xmldom.d.ts. Measured on the committed fixtures with reduce_fixture at a cap of 100:
  pdf/java keeps 83 engine types of 100, pdf/cpp keeps 5 include/internal types of 150. (3) The coverage line counts anything extracted as a
  "type": pdf/go says `API-Coverage: 300 of 2313 types` although the 300 kept entries of the committed fixture are 216 type_spec plus 84
  function entries and about 259 exported types exist upstream (functions and methods whose receiver is not indexed are counted as types). (4) tex/python: 35 of the
  45 .py files of the package src/aspose_tex (102 of 119 repo-wide) do not parse at the pinned commit 181015d (IndentationError), so the pilot
  indexes 4 exception classes, yet `report_index_freshness` says indexed_types 4 and total_types 4 with coverage_note null (reads as 100 percent),
  `get_symbol aspose_tex.TeXJob` answers found false with no suggestions and no coverage_note, and the committed fixture records the problem only as
  two `:syntax-error:` strings inside `unresolved`, because python_surface skips modules with a leading underscore before it parses them
  (aspose_tex/_input/reader.py is reached only through the re-export origin check). This card changes selection and honesty and nothing about
  signatures: (a) a README/furnished-page mention tier in `reduce_fixture`: identifiers inside the page's code fences and inline code spans,
  ranked by mention count, are kept after the example-used types and before centrality, up to a fraction of the cap; (b) a demotion of
  internal/engine/generated/vendored groups so they only fill slots nothing else wants; (c) the coverage line of every symbol chunk separates types
  from functions and states unparsed source files; (d) the extraction records per-file parse failures in the fixture; (e) one shared
  `coverage_note` helper used by get_symbol and report_index_freshness so a miss and the freshness report state the failure; (f) the proposed
  per-pilot caps as a constant wired into the extraction CLI. What does NOT change: the committed fixtures (a later re-extraction card regenerates
  them), values.yaml and docker-compose.yml (maxTypes is already per pilot; raising it is a data card), any signature rendering (TC-521, TC-522,
  TC-523 and the C++/Go/Java/Rust cards), the search_symbols and lookup miss text (sibling serving cards import the new helper), the wording of
  an existing note for a fixture that has none of the new keys.
