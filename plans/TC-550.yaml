- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  ORDER AND FRESHNESS. TC-550 runs only after TC-530 is ACCEPTED and integrated on main (it imports the shared helper tests/extraction/reextraction_checks.py and copies the STALE_BAKED_PILOTS mechanism
  of tests/deploy/test_fleet_consistency.py that TC-530 creates) and after TC-541 and TC-545 (they change what the Python re-extraction must contain). The cards TC-532, TC-533, TC-534, TC-535 and TC-536
  share files with this card (infra/helm/foss-mcp/values.yaml, docker-compose.yml, tests/deploy/test_fleet_consistency.py, tests/fixtures/readme_identifier_allowlist.json and the fixtures above) and the
  supervisor makes them depend on TC-550 and removes from them every fixture and pin this card now owns; start from a clean tree at the commit the supervisor issues and build on what is there. Everything
  named below (flags, constants, helper functions, test names) was checked against main 44b46d54 PLUS the TC-530 worker branch; verify each name against the MERGED code before you rely on it: if a merged
  name differs, use the merged name and list the difference in your report; if a feature a step needs is simply not in the merged code, stop and report FAILED_INTERNAL (src/ is not yours beyond the one
  constant). Never print or log any environment value. The extraction clones with git over https and does not read GITHUB_TOKEN; if a clone is refused or rate limited do not look for a token, follow the
  BLOCKED_EXTERNAL rule below.
- >-
  READ FIRST (merged code, read only): src/foss_mcp/extraction/run_extraction.py (`main` and its flags `--commit`, `--keep-names-from`, `--max-types`; `EXTRACTOR_VERSION`, `RECOMMENDED_MAX_TYPES`,
  `README_KEEP_FRACTION`, `reduce_fixture`, `_is_test_entry`; the keys the artifact carries: `extractor_version`, `symbol_counts`, `counts`, `parse_failures`), tests/extraction/reextraction_checks.py (TC-530:
  `pilot_key`, `chart_pilot`, `pinned_commit`, `recommended_cap`, `chart_max_types`, `compose_max_types`, `load_fixture`, `fixture_text`, `type_names`, `fqns`, `members`, `member_doc_stats`, `test_file_entries`,
  `ingestion_slice_problems`, `cap_problems`, `readme_recall`, `REQUIRED_EXTRACTOR_VERSION`), tests/extraction/test_reextracted_dotnet.py (the template of your new file), tests/extraction/docs_identifiers.py
  (`PILOTS`, `docs_identifiers`, `unresolved`, `compare`, `load_allowlist`, `python -m tests.extraction.docs_identifiers --write`), src/foss_mcp/indexing/chunk_builder.py
  (`build_chunks_from_api_surface(fixture, title=..., max_types=...)` counts SLOTS: a Python re-export shell and its definition are one slot; `_coverage_line`), infra/build_chunks.py (`--max-types`, the one
  slice; `MAX_CHUNK_TEXT_CHARS = 24_000` and `_sanitize_chunk_text`: a chunk text longer than that is cut with an explicit `Truncated: N characters omitted` line, a second, smaller truncation layer this card
  must MEASURE, see below), tests/deploy/test_fleet_consistency.py (`COMMIT_EXCEPTIONS`, `UNRESOLVED_EXCEPTIONS`, `COVERAGE_EXCEPTIONS`, `STALE_BAKED_PILOTS`, `coverage_problems`), infra/helm/foss-mcp/values.yaml
  (`ingestion.pilots[]`: `family`, `platform`, `maxTypes`, `library.repository`, `library.commit`), docker-compose.yml (the `ingest-<family>-<platform>` services and their `--max-types` value),
  tests/infra/test_helm_pilots_match_compose.py (the parity rule), config/products/<family>/<platform>.yaml (the manifest each pilot is extracted from) and
  tests/fixtures/furnished/<pilot>/pages/_index.md (the README page `--keep-names-from` reads). Run `python -X utf8 -m foss_mcp.extraction.run_extraction --help` first with `PYTHONPATH=src` to confirm the flags.
- >-
  RE-EXTRACTION, one pilot at a time, in this order (largest and riskiest first so a failure shows early): pdf_java, pdf_typescript, pdf_go, pdf_python, slides_python, html_python, 3d_python, pdf_cpp,
  slides_cpp, cells_cpp, words_python. Derive the pilot key `<family>_<platform>` (the directory under tests/fixtures), the commit and the manifest from the chart and the layout, never retype a commit. With the
  toolchain activated in the SAME shell command (`scripts/toolchain/activate.ps1`) and `PYTHONPATH=src` set, from the repository root run for each pilot exactly:
  `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml tests/fixtures/<pilot>/api_surface.json --commit <pin> --keep-names-from
  tests/fixtures/furnished/<pilot>/pages/_index.md --max-types 100000` where `<pin>` is `ingestion.pilots[].library.commit` of infra/helm/foss-mcp/values.yaml for that pilot (for pdf_typescript it is
  155bfc7a33f0ba23fb4252b6ba201828b02a5b9d, DO NOT move it and do not extract the repository's HEAD). The cap 100000 exceeds every possible total, so the fixture is the whole surface; it is byte-identical to
  a run with the cap set to the total because the selection order does not depend on the cap once nothing is cut. The command prints `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: the
  commit must equal the pin and `<kept>` must EQUAL `<total>` (TOTAL is the measured cap of this pilot). If `<kept>` is smaller than `<total>` the extractor is dropping entries it also counts (for example
  test-directory entries that `_is_test_entry` removes but `type_count` still counts): that is an extractor defect, not yours to patch: keep the pilots already done, record `gatectl status-append` FAILED_INTERNAL
  with the pilot, kept and total, and stop. Run each pilot as its own command, start slow ones in the background and poll with bounded waits (never a tail -F monitor on process output; allow up to 30 minutes
  for a clone and extraction of the large Java and TypeScript repositories), and continue with the next pilot after a failure. If a clone or fetch fails (network, rate limit, an unreachable commit) do not retry
  in a loop: record `gatectl status-append` with BLOCKED_EXTERNAL and the exact resume predicate `git fetch of <repo>@<sha> succeeds`, keep every fixture you already regenerated, and stop. The CLI writes with
  the platform line ending and .gitattributes normalises to LF on commit: confirm `git diff --stat` shows each fixture as a content change and not as a whole-file line-ending rewrite. After each run record the
  printed total in a scratch note for the chart/compose step and for your report together with the old total, and the byte size.
- >-
  SIZE. The fixtures grow roughly in proportion to the type count and the v5 extractor adds fields (pdf_net grew from 2.1 MB to 5.7 MB for 300 to 901 types). Estimates from the old files scaled to the old
  totals, for orientation only (the real numbers differ, Go in particular shrinks): pdf_java about 14 MB, pdf_typescript about 11 MB, html_python about 10.5 MB, pdf_go about 4 MB, pdf_cpp about 3 MB, slides_python
  about 2 MB, pdf_python about 2 MB, slides_cpp about 1.6 MB, 3d_python about 1.4 MB, cells_cpp about 1 MB, words_python about 0.7 MB. You cannot know the final sizes before the extraction, so the test
  pins MEASURED floors and a generous ceiling: `SIZE_FLOOR_BYTES[key]` = the measured size of the regenerated fixture (the LF-normalised text, `len(fixture_text(key).encode('utf-8'))`, NOT the CRLF bytes on disk)
  multiplied by 0.9 and rounded DOWN to a multiple of 10 KB, and `SIZE_CEILING_BYTES = 25 * 1024 * 1024` for every pilot plus `TOTAL_CEILING_BYTES = 120 * 1024 * 1024` for the eleven together (GitHub rejects a
  file over 100 MB and the Dockerfile.ingestion image copies every fixture, so an unbounded fixture is a delivery risk). If any single fixture exceeds 25 MB do not raise the ceiling: stop and report
  FAILED_INTERNAL with the sizes, because the supervisor must then decide on a different representation. Print the old and new size of every fixture in your report.
- >-
  CHART AND COMPOSE AND THE EXTRACTOR CONSTANT. For every pilot of this card set, to its MEASURED total (`<total>` printed by the CLI): (a) that pilot's `maxTypes` in infra/helm/foss-mcp/values.yaml, (b) the
  `--max-types` value of its `ingest-<family>-<platform>` service in docker-compose.yml, (c) its entry in `RECOMMENDED_MAX_TYPES` of src/foss_mcp/extraction/run_extraction.py (key `<family>/<platform>`; the
  dictionary has 13 keys today and keeps 13 keys; the values for pdf/go (450) and pdf/typescript (1250) are older proposals, the others (3d/python 697, cells/cpp 346, html/python 323, pdf/cpp 361, pdf/java 1239,
  pdf/python 867, slides/cpp 323, slides/python 1023, words/python 391) are the old totals: replace each by the measured total even when it is unchanged, and rewrite the comment above the dictionary so that it says
  the values are the totals the committed fixtures were extracted with and that the chart and compose carry the same numbers; edit NOTHING else in that file). Use targeted single-line replacements inside that
  pilot's block or service only, anchored on the pilot's own `--api-surface /app/fixtures/<pilot>/api_surface.json` line (compose) and `apiSurface: /app/fixtures/<pilot>/api_surface.json` line (chart); the
  `maxTypes`/`--max-types` line follows the `title` line two lines below. tests/infra/test_helm_pilots_match_compose.py and the `two_step_chain` test of tests/infra/test_helm_chart.py compare the rendered chart
  command with the compose command and fail on any difference. Every other byte of the three files stays as it is, you do not touch memory limits, and pilots outside this card (including pdf_net and words_net,
  which TC-530 owns) are left untouched. If a measured total is below 300 keep 300 in all three places for that pilot (nothing is cut at the default) and say so in the report. The equality of the
  three numbers for the eleven is proven by tests/extraction/test_reextracted_uncapped.py `test_cap_is_one_number_in_extractor_chart_and_compose`.
- >-
  README IDENTIFIER ALLOWLIST. tests/extraction/test_docs_identifiers_resolve.py (TC-521) fails for a pilot whose committed fixture resolves a different set of README-named identifiers than
  tests/fixtures/readme_identifier_allowlist.json lists, in both directions. BEFORE you regenerate anything, save `git show HEAD:tests/fixtures/readme_identifier_allowlist.json` outside the repository: it lists
  today's gaps and is the source of the README_TYPES seeds below. After re-extracting all eleven pilots regenerate the file with the helper only: `python -X utf8 -m tests.extraction.docs_identifiers --write` (never by
  hand), then read `git diff` of that file: only keys of the eleven pilots of this card (and, if TC-530 left them, none of its dotnet keys) may change. A key of any other pilot changing means the allowlist was already
  stale at your start commit: stop and report it. For every pilot of this card read the identifiers that remain listed and put in your report each one that looks like an API symbol of the library (each is an
  extraction defect to report, not something to leave allowlisted silently); the legitimate remainder is non-API text such as a build tool (FetchContent, CMAKE_PREFIX_PATH, add_subdirectory), a file extension, a
  Python builtin exception (AttributeError, NotImplementedError, RuntimeError, ValueError, UserWarning) or a standard-library type (BytesIO, StringIO).
- >-
  THE NEW TEST FILE tests/extraction/test_reextracted_uncapped.py (YOU CREATE IT; offline, deterministic, no skips, no network, no wall clock; import the TC-530 helper, do NOT edit tests/extraction/reextraction_checks.py,
  keep any extra helper private inside your file; model it on tests/extraction/test_reextracted_dotnet.py). At least 150 tests. Module tables, all keyed by pilot key and all with the literal values YOU measure after
  the regeneration and print in your report: `PILOTS` (the eleven, in a fixed order; the docstring states the jmap exclusion and OWNER-15), `README_TYPES`, `RECALL_FLOOR`, `RECALL_EXCEPTION_REASON`,
  `SIZE_FLOOR_BYTES`, `SIZE_CEILING_BYTES`, `TOTAL_CEILING_BYTES`, `MEMBER_FLOOR` (the integer count of `methods` plus `properties` over all entries, measured, multiplied by 0.95 and rounded down), and
  `OVERSIZE_CHUNK_CEILING` (the number of symbol chunks of `build_chunks_from_api_surface(fixture, title=key, max_types=chart_max_types(key))` whose text is longer than
  `infra.build_chunks.MAX_CHUNK_TEXT_CHARS`, MEASURED, expected 0; any pilot above 0 gets its measured count as the ceiling and its FQNs in your report). Every table value is a ratchet: a later extraction may raise it, never lower it.
  Parametrised over PILOTS (every test id carries the pilot): `test_fixture_is_extracted_at_the_chart_pin` (source_commit equals `pinned_commit(key)` and is 40 hex characters; for pdf_typescript that is the
  155bfc7 commit), `test_fixture_carries_the_current_extractor_keys` (`extractor_version == REQUIRED_EXTRACTOR_VERSION` (5 today: the fixtures must be regenerated by the current extractor, not merely at least
  version 1); `symbol_counts` a dict with integer `types` and `functions`; `counts` a dict with integer `types`, `functions`, `methods`; when `parse_failures` exists its `engine` is `ast` or `tree-sitter`, `failed`
  and `total` are integers with failed <= total), `test_fixture_is_canonical_json` (the file text equals `json.dumps(data, indent=2, sort_keys=True) + chr(10)`), `test_fixture_has_no_test_file_entries`
  (`test_file_entries` is empty), `test_cap_is_one_number_in_extractor_chart_and_compose` (`cap_problems` is empty), `test_ingestion_slice_keeps_every_extracted_entry` (`ingestion_slice_problems` is empty),
  `test_surface_is_complete_and_not_truncated` (`truncated` is false, `type_count == reduced_type_count == len(types)`, `chart_max_types(key) == max(type_count, 300)` because the cap is the measured total (300 when the total is below the default), and
  `symbol_counts.types + symbol_counts.functions == type_count`), `test_symbol_counts_and_counts_agree_with_the_entries` (recount the entries by `kind == 'function'` and the methods in the file and compare with
  `symbol_counts` and `counts`), `test_coverage_line_states_the_complete_surface` (every symbol chunk of `build_chunks_from_api_surface(fixture, title=key, max_types=chart_max_types(key))` ends with exactly ONE
  `API-Coverage:` line, all chunks carry the same line, and the line matches `^API-Coverage: (\d+) of (\d+) types(; (\d+) of (\d+) functions)?(; (\d+) of (\d+) source files could not be parsed)?$` with the two numbers of the types clause and of the
  functions clause EQUAL (for example `901 of 901 types` for pdf_net in TC-530; a Go or TypeScript pilot adds the functions clause; the optional third clause only appears when `parse_failures` is over the engine
  threshold, state it in the report when a pilot has it), `test_readme_named_types_resolve` (every name of `README_TYPES[key]` is in `type_names(fixture)`; at least 5 names per pilot, 4 for pdf_typescript), `test_readme_recall_has_a_floor`
  (`readme_recall(key) >= RECALL_FLOOR[key]`: 0.90 for every pilot whose measured recall reaches it; a pilot that measures below 0.90 gets a floor equal to its measured recall rounded DOWN to two decimals AND a
  non-empty string in `RECALL_EXCEPTION_REASON[key]` that names the identifiers still unresolved and why none of them is an API symbol of the library (a build tool, a file extension, a builtin exception, a standard
  library type) or why the upstream cannot be parsed; if any remaining unresolved identifier looks like an API symbol of the library, do not use an exception: report the pilot, its recall and the identifiers, and
  stop as FAILED_INTERNAL), `test_fixture_size_is_between_floor_and_ceiling` (`SIZE_FLOOR_BYTES[key] <= size <= SIZE_CEILING_BYTES`), `test_member_count_has_a_floor` (`MEMBER_FLOOR[key]` as above) and
  `test_no_symbol_chunk_is_cut_by_the_sanitiser_cap` (the measured count of oversize chunks is at most `OVERSIZE_CHUNK_CEILING[key]`). Single tests: `test_pdf_go_indexes_every_exported_package_function` (TC-525
  measured 98 exported package-level functions upstream and 16 indexed: the entries with `kind == 'function'`, no `receiver_type` and an exported (upper-case first letter) name number at least 98, or the exact
  number you measure from the clone at the pin if it is larger; if it is smaller than 98 check the clone before you pin a smaller number and say so), `test_pdf_go_indexes_the_open_family_by_name` (`Open`,
  `OpenWithPassword`, `OpenStream`, `OpenStreamWithPassword`, `NewDocument`, `NewDocumentFromFormat` and `NewTable` are package functions of the fixture: TC-525 named them as the misses), `test_slides_python_contains_presentation_with_members`
  (an entry named `Presentation` with a non-empty `methods` or `properties`), `test_pdf_python_contains_document_with_members` (the entry with `class_import == 'aspose_pdf.Document'` exists and has at least 20
  methods plus properties, and `aspose_pdf.facades.PdfFileSecurity` has `encrypt_file`, `decrypt_file` and `change_password`: the 8 facade classes whose definitions the old cap cut), `test_words_python_and_3d_python_index_their_readme_classes`
  (the seeds below for these two pilots, each as its own assertion message), `test_pdf_typescript_stays_at_the_chart_pin_and_not_the_newer_commit` (the fixture commit is the chart pin and is NOT
  c672b3918318ccd0c13bc9dc619620cac2674c9e), `test_every_recall_exception_names_what_is_unresolved` (a non-empty reason that contains at least one unresolved identifier of that pilot), `test_recall_exceptions_are_real`
  (a pilot in RECALL_EXCEPTION_REASON really measures below 0.90, so an exception cannot outlive its cause), `test_no_committed_fixture_is_truncated` (over all 40 pilots of `docs_identifiers.PILOTS`,
  `truncated` is not true and `reduced_type_count == type_count`: after TC-530 and this card no fixture is partial), `test_the_eleven_fixtures_together_are_below_the_total_ceiling`. HELPER TESTS (synthetic, same file,
  at least 6): the coverage-line parser accepts a complete line with and without a functions clause, `test_coverage_line_parser_flags_a_partial_line` (`299 of 300 types`), the size check flags a file above the ceiling and
