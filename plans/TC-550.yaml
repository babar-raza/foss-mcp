gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (operator decision 2026-10-16: partial indexes are rejected, every pilot must index its WHOLE public surface; independent pre-production review RST-01,
  AGT-03, AGT-05, RST-13). FULL COVERAGE FOR THE ELEVEN STILL-TRUNCATED PILOTS. Measured on the committed tree at main 44b46d54: 13 of the 40 tests/fixtures/<pilot>/api_surface.json files carry
  `truncated: true` (kept of total types at the OLD extractor: 3d_python 520/697, cells_cpp 300/346, html_python 302/323, pdf_cpp 300/361, pdf_go 300/2313, pdf_java 300/1239, pdf_net 300/901,
  pdf_python 419/867, pdf_typescript 300/5342, slides_cpp 300/323, slides_python 569/1023, words_net 300/618, words_python 360/391); the other 27 are complete. TC-530 regenerates pdf_net and words_net with
  their cap raised to the total. THIS CARD DOES THE SAME FOR THE ELEVEN THAT ARE LEFT: 3d_python, cells_cpp, html_python, pdf_cpp, pdf_go, pdf_java, pdf_python, pdf_typescript, slides_cpp, slides_python,
  words_python. Each is re-extracted at its CHART-PINNED commit (ingestion.pilots[].library.commit of infra/helm/foss-mcp/values.yaml) with the merged extractor (EXTRACTOR_VERSION 5: README-mention selection of
  TC-520, Python fidelity and re-export pairing of TC-522, TypeScript fidelity of TC-523, C++ of TC-524, Go function/constant/receiver handling of TC-525, class-level constants of TC-545) and with the type cap raised
  so that EVERY public type is kept (kept == total, `truncated` false). The cap is one number in four places and this card moves all four together for the eleven: the extraction call, the extractor constant
  `RECOMMENDED_MAX_TYPES` (src/foss_mcp/extraction/run_extraction.py), the chart `maxTypes` and the compose `--max-types` (infra/build_chunks.py slices the fixture AGAIN with `--max-types`, so a 300 left there would
  silently cut what the extraction kept; `build_chunks_from_api_surface` is the only slice and is bounded by that argument alone, the `API-Coverage:` line is computed from the same fixture and states
  `N of N types`). Measured facts that shape the card. (1) All eleven committed fixtures are extractor version 1: none carries `extractor_version`, `symbol_counts`, `counts` or `parse_failures`, none has Python
  parameter defaults or static/classmethod marks (tests/extraction/test_python_fixture_gaps.py lists five of them in KNOWN_GAP), none has TypeScript writable/alias/static marks (tests/extraction/test_ts_fixture_gaps.py
  lists pdf_typescript in KNOWN_GAP), pdf_go still holds 39 `_test.go` entries of the 300 (TC-392 removed them from the engine, so a regenerated fixture holds none) and counts 2313 entries of which most are
  methods of unexported receivers that TC-525 now drops, so the new pdf_go total is far below 2313 and RECOMMENDED_MAX_TYPES' 450 for pdf/go is an older proposal. (2) The totals quoted above are the OLD extractor's;
  the worker MEASURES the real totals (the CLI prints `<kept>/<total>`) and every cap in this card is that measured total, never a number typed from this text. (3) pdf_typescript: the committed fixture is at
  c672b3918318 while the chart pin, the four compile-verified examples, the furnished page and the sidecar are all at 155bfc7a33f0ba23fb4252b6ba201828b02a5b9d. DECISION (docs/DECISION_LOG.md, 2026-10-15
  "Remediation program for the pre-production review", decision 1): pdf/typescript is re-extracted AT THE CHART PIN 155bfc7 and the pin is NOT moved; one consistent commit wins over freshness (cost: about 4445 instead
  of 5342 types, README identifiers all resolve). This card therefore ends the fixture/pin disagreement for pdf_typescript but NOT the baked generation's, which stays at c672b39 until the supervisor re-ingests, so the
  COMMIT_EXCEPTIONS entry of pdf_typescript in tests/deploy/test_fleet_consistency.py STAYS (reworded). (4) The eleven README-named gaps today are large: pdf_java leaves 765 README identifiers unresolved, slides_python
  202, pdf_python 129, 3d_python 62, html_python 44, pdf_go 41, words_python 24, slides_cpp 21, pdf_cpp 11, cells_cpp 3, pdf_typescript 3 (tests/fixtures/readme_identifier_allowlist.json); a complete fixture
  resolves nearly all of them. (5) OUT OF SCOPE: the nine jmap pilots (owner item OWNER-15: their upstream repositories return HTTP 404, jmap_net included, so they cannot be re-extracted; none of them is truncated
  anyway). What this card does NOT change: any other src/ file (the ONLY src/ edit is the values and the comment of `RECOMMENDED_MAX_TYPES`), any furnished page, infra/demo-manifests (the supervisor re-ingests and
  snapshots after the last re-extraction card), any sidecar, any memory limit (`ingestionMemoryLimit`: the supervisor measures Job memory at the re-ingest, pdf_java and pdf_typescript are the pilots to watch),
  the chart pins, docs/ (the supervisor records the decision).
