  it directly yourself rather than assuming) and for REAL_ENUM_FQN/REAL_ENUM_MEMBER (used by
  test_get_symbol_returns_the_real_enum_members_for_afrelationship - needs a real enum with real members still
  present in the kept 300; many exist, e.g. Aspose.Pdf.HorizontalAlignment - verify your own choice''s real
  member names directly from the fixture, do not guess one). Rename
  test_get_symbol_returns_the_real_enum_members_for_afrelationship to match whichever real enum you pick (the
  test name itself names AFRelationship specifically - this must not go stale again the same way). Update every
  docstring that names AFRelationship/EncryptedPayload/905-905-ish TC-011-specific prose to describe your real
  replacement instead - do not leave a stale docstring pointing at a symbol the test no longer checks.'
- 'REAL_EXAMPLE_SYMBOL ("AddWatermarkAnnotation") and REAL_TASK_QUERY ("how do I add a watermark to a PDF") are
  about the compile-verified watermark EXAMPLE content, not about which type survived centrality truncation -
  confirm directly whether these are still correct (the watermark example chunk is a separate, furnished
  verified-example artifact, not one of the 300 centrality-selected types) before assuming they need no change
  either way; do not change them without first confirming whether they are actually still stale or already
  correct.'
- 'Run this file''s FULL live suite (a real docker rebuild of ingest-pdf-net + serving-pdf-net - be patient) and
  confirm every test passes. Run the full project suite once afterward and report honestly; if it surfaces
  anything else outside this card''s single write_path, STOP and report rather than patching around it.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
