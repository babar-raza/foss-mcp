id: TC-280
gate: G2
lane: storage-retrieval
purpose: 'Fix a real, pre-existing live-e2e staleness bug found as a side effect of TC-278''s C7 investigation
  (recorded in docs/DECISION_LOG.md 2026-10-09): tests/e2e/test_pdf_net_live_content.py hardcodes
  REAL_SOURCE_COMMIT = "b7172877651413cff57a8bfe41fb8a8befb2406b" and REAL_SYMBOL/REAL_ENUM_FQN/REAL_ENUM_MEMBER
  anchored on the enum Aspose.Pdf.AFRelationship ("EncryptedPayload" member) - both stale since TC-263
  regenerated pdf/net''s fixture with the fixed, centrality-ranked selection days ago (evidence commit 97c8639).
  Live-confirmed directly against the current committed fixture: the real source_commit is now
  10a363830fea952c29df20fdb37d35ad3a881433 (971 real types, 300 kept, 899->971 real upstream growth), and
  "AFRelationship" does not survive the centrality-ranked cut at all (it is absent from the kept 300 entirely -
  not merely renamed or moved). This is the exact same "stale anchor after a centrality-ranked regeneration"
  pattern this session already found and fixed for slides/python (TC-264/TC-277''s AutoShape -> Shape) and for
  the commit-pin-divergence class (TC-256/TC-262/TC-268/TC-272) - just never caught for pdf/net because its own
  live e2e file was not run as part of TC-263''s own review at the time (the file passed then because this
  staleness had not yet been introduced - TC-263 landed before this particular regeneration, and nothing re-ran
  this specific e2e file against the newer content until TC-278''s worker happened to run the full suite).'
