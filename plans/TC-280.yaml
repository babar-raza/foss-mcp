  currently committed tests/fixtures/pdf_net/api_surface.json (do not trust this card''s numbers blindly) the
  real current source_commit, and confirm "AFRelationship" is genuinely absent from the kept 300 (not just
  moved/renamed).'
- 'Update REAL_SOURCE_COMMIT to the real current source_commit (verify directly from the committed fixture).'
- 'Pick real replacement anchors directly from the current committed fixture for REAL_SYMBOL (used by
  test_search_symbols_returns_real_content_from_the_real_fixture and test_lookup_returns_real_content_from_the_
  real_fixture - needs a real, simply-named class/type whose own name is unambiguous and present in
