    python -X utf8 -c "import pathlib;q=chr(34);p=pathlib.Path('tests/e2e/test_pdf_net_live_content.py');s=p.read_text(encoding='utf-8');old='REAL_SOURCE_COMMIT = ';new='REAL_SOURCE_COMMIT = '+q+'0'+q+' + ';i=s.index(old);s=s[:i]+new+s[i+len(old):];p.write_text(s,encoding='utf-8')"
