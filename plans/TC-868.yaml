purpose: 'REGEN cohort C0 (imaging_net), the one pilot no cohort card has re-baked: its three README examples carry no Verification-Level line (tests/mcp/tools/test_find_examples_verification_level_label.py LEGACY_PILOTS = [imaging__net]; tests/mcp/tools/test_post_regen_retrieval_ratchets.py NOT_REGENERATED_PILOTS) so it serves unstamped, unverified-by-label examples while the other 31 pilots serve honest levels. The committed infra/demo-manifests data for these pilots was last baked before TC-700..TC-847 (one-chunk verified examples, honest verification levels, authored examples, python re-export shells TC-818, private dataclass init fields TC-819, stub detection TC-559/TC-844/TC-847, TS class docs TC-821, run steps TC-805..807, known_hazards, coverage-line clause split) and, for 31 of 32 pilots, carries 64-dim hashing vectors, which makes find_examples permanently lexical-only (docs/RELEASE.md, example_search_mode.py). Regenerate the cohort with the cluster-free route scripts/release/regenerate_local.py
  (--cohort C0), review the per-pilot diff, and land the data with the test pins it legitimately moves. The card also supplies the determinism proof (RW-11): the same pilot regenerated twice with the fixed --source-date-epoch must give an identical active-generation tree hash. No pilot may get worse (AGENTS.md).'
