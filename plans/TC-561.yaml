- command: >-
    {python} -m pytest tests/mcp/tools/test_round3_install_truth.py tests/infra/test_round3_install_sections.py tests/mcp/tools/test_product_reference_baked_contract.py tests/mcp/tools/test_product_reference_truthful.py
    tests/mcp/tools/test_product_reference_install_pin.py tests/infra/test_verify_package_registry.py tests/infra/test_verify_product_reference_install.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp tests/infra tests/extraction/test_run_extraction_python_repair.py tests/deploy/test_readme_matches_release.py -q -rfE -p no:cacheprovider -k "not live and not github_http
    and not repo_native and not test_prepare_rust_library and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
