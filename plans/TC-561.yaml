id: TC-561
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-009 (rows RD3-080 to RD3-092; decision OQ-012). INSTALL GUIDANCE AND PRODUCT-REFERENCE TRUTH. Round-3 agents followed the MCP install text and failed or needed outside help: cells/cpp gives no
  repository URL, commit, SOURCE_SUBDIR Aspose.Cells.Foss.Cpp or CMake target and omits the NuGet package Aspose.Cells.Cpp.FOSS (TC-518's benefit was lost at the re-ingest and the test rewritten to accept
  it); slides/cpp names a CMake target that does not exist (the right one is in the same section); pdf/cpp repeats an add_subdirectory route that is broken upstream (the working route is standalone build,
  cmake --install, find_package); email/cpp has no repository URL; imaging/net says 'not found on NuGet' and then quotes the failing `dotnet add package`; words/python `pip install` fails on Python 3.13
  and only the compatibility section has the bound; pdf/typescript has no build steps (npm install, npm run build, dist/index.js); Java Maven coordinates have no version (slides/java pom 26.8.0 vs Central
  26.7.0); 3d/net compatibility comes from the converter project; formats and limitations answer 'no data source' for cells/cpp, pdf/typescript, imaging/net, words/net, barcode, tex, slides/net though the
  README has the section; agent_guidance is NotAvailable for pdf/go though CLAUDE.md exists upstream and is a contributor porting prompt for 3d/python and 3d/typescript; deprecation replacements are not
  named (pdf/java getOrCreateInfo). tex/python: the library does not import at the pinned commit (35 of 45 files unparseable) while the notice says 11 of 45. FIX: install sections always carry repository
  URL, commit, subdirectory and exact target for source builds, the python_requires/engine bounds, a verified-working route, and for packages the registry check proves (name, version served); a conflict
  between the README's install line and the registry result suppresses or annotates the README line; formats/limitations/agent_guidance extraction finds the README sections that exist; the tex notice states
  plainly that the library cannot be imported at this commit and gives the real count of unparseable files; contributor-prompt guidance is labelled. FINALISED for dispatch on 2026-10-19 by the supervisor
  (min_tests calibrated per check, negative control authored, write_paths checked).
depends_on:
- TC-550
- TC-553
- TC-554
- TC-555
- TC-556
- TC-560
- TC-532
write_paths:
- infra/fetch_product_reference.py
- infra/verify_product_reference_install.py
- infra/verify_package_registry.py
- infra/build_chunks.py
- src/foss_mcp/mcp/tools/get_product_reference.py
- src/foss_mcp/mcp/tools/readme_sections.py
- tests/mcp/tools/test_round3_install_truth.py
- tests/infra/test_round3_install_sections.py
- tests/deploy/test_readme_matches_release.py
- src/foss_mcp/extraction/run_extraction.py
- tests/extraction/test_run_extraction_python_repair.py
- tests/fixtures/round3_readmes/**
- tests/mcp/tools/test_product_reference_baked_contract.py
- tests/mcp/tools/test_product_reference_install_pin.py
- tests/mcp/tools/test_product_reference_readme_content.py
- tests/mcp/tools/test_product_reference_truthful.py
- tests/mcp/tools/test_product_reference_fetch_failed.py
- tests/mcp/tools/test_product_reference_license_support.py
