id: TC-561
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-009 (rows RD3-080 to RD3-092; decision OQ-012). INSTALL GUIDANCE AND PRODUCT-REFERENCE TRUTH. Round-3 agents followed the MCP install text and failed or needed outside help: cells/cpp gives no
  repository URL, commit, SOURCE_SUBDIR Aspose.Cells.Foss.Cpp or CMake target and omits the NuGet package Aspose.Cells.Cpp.FOSS (TC-518's benefit was lost at the re-ingest and the test rewritten to accept
  it); slides/cpp names a CMake target that does not exist (the right one is in the same section); pdf/cpp repeats an add_subdirectory route that is broken upstream (the working route is standalone build,
  cmake --install, find_package); email/cpp has no repository URL; imaging/net says 'not found on NuGet' and then quotes the failing `dotnet add package`; words/python `pip install` fails on Python 3.13
  and only the compatibility section has the bound; pdf/typescript has no build steps (npm install, npm run build, dist/index.js); Java Maven coordinates have no version (slides/java pom 26.8.0 vs Central
  26.7.0); 3d/net compatibility comes from the converter project; formats and limitations answer 'no data source' for cells/cpp, pdf/typescript, imaging/net, words/net, barcode, tex, slides/net though the
  README has the section; agent_guidance is NotAvailable for pdf/go though CLAUDE.md exists upstream and is a contributor porting prompt for 3d/python and 3d/typescript; deprecation replacements are not
  named (pdf/java getOrCreateInfo). tex/python: the library does not import at the pinned commit (35 of 45 files unparseable) while the notice says 11 of 45. FIX: install sections always carry repository
  URL, commit, subdirectory and exact target for source builds, the python_requires/engine bounds, a verified-working route, and for packages the registry check proves (name, version served); a conflict
  between the README's install line and the registry result suppresses or annotates the README line; formats/limitations/agent_guidance extraction finds the README sections that exist; the tex notice states
  plainly that the library cannot be imported at this commit and gives the real count of unparseable files; contributor-prompt guidance is labelled. REGISTERED AS A DRAFT on 2026-10-17 from docs/ROUND3_REVIEW.md:
  before dispatch the supervisor re-reads this card against the merged code, calibrates min_tests (it applies to EACH check), replaces the placeholder negative control with a real falsifier that has no
  backslash, and verifies every file named in write_paths (Supervisor rule 5). Nothing here has been executed.
depends_on:
- TC-550
- TC-553
- TC-554
- TC-555
- TC-556
- TC-560
write_paths:
- infra/fetch_product_reference.py
- infra/verify_product_reference_install.py
- infra/verify_package_registry.py
- infra/build_chunks.py
- src/foss_mcp/mcp/tools/get_product_reference.py
- src/foss_mcp/mcp/tools/readme_sections.py
- tests/mcp/tools/test_round3_install_truth.py
- tests/infra/test_round3_install_sections.py
- tests/deploy/test_product_reference_baked_contract.py
- tests/deploy/test_readme_matches_release.py
satisfies:
- REQ-G3-009
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: 79a36f6c8885f87bffc9a79b6d6fdedadecd7b4860735bdd1723072caa4f3970
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE per pilot (asserted on the regenerated sidecars after the supervisor's re-ingest and, offline, on synthetic README/manifest/registry inputs): cells/cpp, slides/cpp, pdf/cpp, email/cpp install
  text contains a cloneable URL, the commit, the CMake target that exists in the indexed commit's CMakeLists (checked by parsing them), and for pdf/cpp the find_package route first; imaging/net contains
  no README install line for a package the registry says does not exist; words/python install contains `<3.13`; pdf/typescript contains the build steps from its README; Java coordinates contain the version
  served by the registry or the instruction to read it; formats and limitations are present for every pilot whose README has a matching heading; tex/python states 'cannot be imported at this commit'. INDEPENDENT
  ORACLE: the upstream README and manifest text at the pinned commit fetched in the test fixture (committed snippets of the real files), and the registry answers recorded as committed fixtures.
- >-
  REVERSE the weakened test: tests/deploy/test_product_reference_baked_contract.py `test_cpp_installs_are_the_readme_recipe` must again cover cells_cpp (RD3-154 W2).
actions:
- >-
  Fix install sections, README-section extraction and the tex not-importable disclosure; restore the cells/cpp install assertion.
checks:
- command: >-
    {python} -m pytest tests/mcp/tools/test_round3_install_truth.py tests/infra/test_round3_install_sections.py tests/deploy/test_product_reference_baked_contract.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp tests/infra tests/deploy/test_readme_matches_release.py -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native and not test_prepare_rust_library
    and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 8
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "print('negative control to be authored before dispatch')"
  rationale: >-
    PLACEHOLDER written at registration. The supervisor replaces it, before dispatch, with a falsifier that breaks the card's central claim in the code the worker writes (a mandated constant or function
    name) so that a named new test fails.
evidence:
- evidence/build/G3/TC-561/receipt.json
closeout:
- >-
  Every pilot's install and product-reference sections are true, complete and verified against the registry and the indexed commit; tex/python states that the library cannot be imported.
recovery: Re-run from a clean tree.
