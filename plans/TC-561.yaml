- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE per pilot (asserted on the regenerated sidecars after the supervisor's re-ingest and, offline, on synthetic README/manifest/registry inputs): cells/cpp, slides/cpp, pdf/cpp, email/cpp install
  text contains a cloneable URL, the commit, the CMake target that exists in the indexed commit's CMakeLists (checked by parsing them), and for pdf/cpp the find_package route first; imaging/net contains
  no README install line for a package the registry says does not exist; words/python install contains `<3.13`; pdf/typescript contains the build steps from its README; Java coordinates contain the version
  served by the registry or the instruction to read it; formats and limitations are present for every pilot whose README has a matching heading; tex/python states 'cannot be imported at this commit'. INDEPENDENT
  ORACLE: the upstream README and manifest text at the pinned commit fetched in the test fixture (committed snippets of the real files), and the registry answers recorded as committed fixtures.
- >-
  REVERSE the weakened test: tests/deploy/test_product_reference_baked_contract.py `test_cpp_installs_are_the_readme_recipe` must again cover cells_cpp (RD3-154 W2).
- "FINALISATION NOTES (supervisor, 2026-10-19). (1) This card now depends on TC-532 (accepted before you start) because run_extraction.py (python_parse_health) is in your write_paths for the tex statement;\
  \ the test file of TC-555, tests/extraction/test_run_extraction_python_repair.py, is yours to re-pin. (2) The existing contract tests live under tests/mcp/tools/ (the earlier draft named tests/deploy/test_product_reference_baked_contract.py\
  \ by mistake): tests/mcp/tools/test_product_reference_baked_contract.py (120 tests) holds the weakened `test_cpp_installs_are_the_readme_recipe` (cells_cpp was dropped from its parametrisation by TC-553\
  \ to accept the install loss): restore cells_cpp, with the recipe asserted as in the acceptance below. (3) Mandated name: in src/foss_mcp/mcp/tools/get_product_reference.py the exact line `README_INSTALL_GUARD\
  \ = True` guarding the suppress-or-annotate rule. (4) REAL INPUTS: for each pilot named below clone the upstream repository at the chart pin (ingestion.pilots[].library.commit of infra/helm/foss-mcp/values.yaml;\
  \ network; no token) and commit the README and the manifest/CMake/agent-guidance files that the rule reads, unchanged, under tests/fixtures/round3_readmes/<family>_<platform>/ (keep each file as in the\
  \ repository; they are test inputs). Pilots and the facts to assert (each was read from the upstream by the round-3 audit; verify against the clone and report any that is wrong): "
- "cells/cpp: README Installation section documents NuGet package Aspose.Cells.Cpp.FOSS (26.4.0 and 26.4.1 exist) and a find_package snippet; the library lives in the subdirectory Aspose.Cells.Foss.Cpp\
  \ of the repository (no root CMakeLists), the link target is aspose_cells_foss, repository URL https://github.com/aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp; plain FetchContent adds nothing without SOURCE_SUBDIR. "
- "slides/cpp: the real targets are AsposeSlidesFoss and AsposeSlidesFoss::AsposeSlidesFoss (the README's FetchContent snippet names aspose_slides_foss, which does not exist). pdf/cpp: the working route\
  \ is standalone build, `cmake --install`, `find_package(aspose_pdf_foss 1.0 CONFIG)`; add_subdirectory/FetchContent fail because the upstream CMakeLists uses ${CMAKE_SOURCE_DIR}; NuGet package Aspose.PDF.Cpp.FOSS.\
  \ email/cpp: no URL in the MCP; repository https://github.com/aspose-email-foss/Aspose.Email-FOSS-for-Cpp, target AsposeEmailFoss::AsposeEmailFoss. "
- "imaging/net: NuGet Aspose.Imaging.Foss does not exist (HTTP 404) yet the README says `dotnet add package Aspose.Imaging.Foss`. words/python: PyPI aspose-words-foss requires Python >=3.10,<3.13; install\
  \ must say so. pdf/typescript: not on npm; README build steps `npm install`, `npm run build`, entry `dist/index.js`, `import { Document } from '@asposefoss/pdf'`. "
- "Java pilots (3d, cells, pdf, slides): Maven coordinate org.aspose:aspose-<product>-foss without a version; slides/java pom 26.8.0 while Maven Central serves 26.7.0. 3d/net: the published Aspose.3D.FOSS\
  \ targets net6.0, net8.0 and net10.0 while the compatibility section reads net10.0 from src/converter/Converter.csproj (PackageId Aspose.3D.Converter). formats and limitations: cells/cpp, pdf/typescript,\
  \ imaging/net, words/net, barcode/python, tex/python, slides/net have a README section ('Scope and Limitations', 'Supported formats') that the extraction missed. agent_guidance: pdf/go has CLAUDE.md at\
  \ the pin; 3d/python and 3d/typescript's guidance is a contributor porting prompt ('implement a python module called org.aspose.threed', 'port Aspose.3D for Python FOSS to TypeScript'): label it `contributor\
  \ guidance for the library's own repository, not instructions for using it`. Deprecation: pdf/java `Document.getOrCreateInfo` is deprecated with the javadoc `use getInfo()`; the replacement must be named. "
- >-
  (5) tex/python: add to python_parse_health (run_extraction.py) an `as_written_failed` count (files that do not parse BEFORE the indentation repair) next to the existing post-repair `failed`, and make
  the install section, report_index_freshness coverage note and the extraction notice state, for a pilot whose `as_written_failed` is more than zero for the package's own files, `N of M source files do
  not parse as written; the API was recovered by a textual repair of the lost indentation; the library cannot be imported at this commit` with the real N (35 of 45 for tex/python at 181015d2); the data
  for the baked tex generation changes only at the supervisor's re-ingest. (6) ACCEPTANCE, offline, on the committed real inputs from step (4): the install text of cells/cpp contains the repository URL,
  the commit, `SOURCE_SUBDIR Aspose.Cells.Foss.Cpp` and the target `aspose_cells_foss`, and names the NuGet package; slides/cpp's text contains `AsposeSlidesFoss::AsposeSlidesFoss` and no `aspose_slides_foss`
  target; pdf/cpp's text leads with the find_package route; imaging/net's text has no `dotnet add package Aspose.Imaging.Foss` line; words/python contains `<3.13`; pdf/typescript contains the three build
  steps; the four Java install texts contain a version or the instruction to read the registry's version; 3d/net's compatibility names net6.0, net8.0 and net10.0; formats/limitations are present for the
  seven pilots; agent_guidance for pdf/go is present and the two 3d guidance texts carry the contributor label; the pdf/java deprecated member names `getInfo()`. (7) min_tests is 380 for EACH check: the
  first check collects 120 + 28 + 149 + 64 + 9 = 370 existing tests plus the at least 24 you add; the second check collects thousands. The real-clone step is the only network use; the tests themselves are
  offline.
actions:
- >-
  Fix install sections, README-section extraction and the tex not-importable disclosure; restore the cells/cpp install assertion.
