negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py');s=p.read_text(encoding='utf-8');old='README_INSTALL_GUARD = True';assert s.count(old)==1;p.write_text(s.replace(old,'README_INSTALL_GUARD = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated guard that suppresses or annotates a README install line naming a package the registry check says does not exist, so imaging/net quotes `dotnet add package Aspose.Imaging.Foss`
    again next to 'not found on NuGet': the contradiction tests fail at once. A real break of the card's claim that the install text never contradicts the registry.
evidence:
- evidence/build/G3/TC-561/receipt.json
closeout:
- >-
  Every pilot's install and product-reference sections are true, complete and verified against the registry and the indexed commit; tex/python states that the library cannot be imported.
recovery: Re-run from a clean tree.
