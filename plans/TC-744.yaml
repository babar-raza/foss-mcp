  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: the real, current `tests/fixtures/furnished/cells_cpp/authored_examples.yaml` and
    `tests/indexing/test_authored_examples_cells_cpp.py` in full (your exact starting point - this
    is an EXTEND, not a from-scratch author; preserve all 3 existing entries byte-for-byte unless
    you find and report a real defect in one). Also read `src/foss_mcp/indexing/
    authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`,
    `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal `normalised_code_sha256(code)`, `symbols`
    must be real FQNs, `library_commit` must be the real 40-hex pinned commit, and must match the
    existing 3 entries' own `library_commit` unless the real pin has genuinely moved - check this
    explicitly), and `src/foss_mcp/indexing/example_verifier.py`'s C++ functions in full
    (`prepare_cpp_library`, `verify_cpp_example`, `_msvc_environment`), and
    `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `cells/cpp`'s real current served example count (6) and real pinned
    repository/commit yourself (cross-check against the 3 existing sidecar entries' own
    `library_commit` field - do not assume they still match today's real pin without checking).
    Fetch the real upstream `samples/` content at that exact commit, and read enough of the real
    public API surface to find up to 2 more real, genuinely distinct, valuable operations not
    already covered by the 3 existing entries' own `symbols`/`title` fields.
  - >-
    VERIFY EACH NEW EXAMPLE YOURSELF before committing: confirm a working C++ toolchain (Docker
    with a real gcc/CMake image has been the proven path for this pilot's C++ siblings this
    session - confirm whether cells/cpp's own verifier path matches or genuinely needs MSVC),
    fetch/build the real pinned library, actually compile and RUN each program in a build mode
    where assertions are NOT silently disabled, confirm each one's real output matches what you
    claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your new examples trips any of these patterns.
  - >-
    This card does NOT claim `cells/cpp`'s example-corpus work is complete, even if it happens to
    reach this pilot's own stretch target - say so honestly either way. If fewer than 2 new
    candidates verify cleanly, submit the real number you got (which may be 0 or 1) rather than
    padding to hit a round number.
actions:
  - >-
    Author up to 2 new, real, individually-verified examples for cells/cpp via the existing
    authored_examples.yaml mechanism, appended after the 3 existing entries, raising its served
    example count from 6 toward 8.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_cpp.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_cpp/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing'; old = 'code_sha256:'; count = s.count(old); assert count >= 4, 'fewer than 4 code_sha256 fields found - fewer than 1 new example was added on top of the 3 existing ones'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. The count>=4 assertion also guards against
    a vacuous pass where the worker reported 0 new examples but the check commands still happen to
    pass trivially - confirm by hand that the check files you named actually exercise this
    validation path before trusting it.
evidence:
  - evidence/build/G3/TC-744/receipt.json
closeout:
  - >-
    cells/cpp gains up to 2 new, real, individually-verified authored examples appended to its 3
    existing ones via the existing, already-wired authored_examples.yaml mechanism (zero code
    change), raising its served example count from 6 toward 8 - real, bounded progress reported
    honestly against its own 5/10 floor/stretch.
recovery: Re-run from a clean tree.
