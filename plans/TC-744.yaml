id: TC-744
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), an eleventh real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism ten sibling cards already proved for ten other pilots this session, including the
  identical "top up an existing sidecar" shape `TC-743` just proved for `cells/rust` (different
  pilot, zero file overlap - do not touch anything any of them touch). Confirmed needing ZERO
  code change: `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads
  `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with README-derived
  candidates, and runs every entry through the exact same `verify_cpp_example` pipeline
  `TC-737`/`TC-739`/`TC-742` already proved for `email/cpp`/`slides/cpp`/`pdf/cpp`, publishing only
  the ones that pass.

  Like `cells/rust`, `cells/cpp` already HAS an existing `authored_examples.yaml` (originally
  authored by `TC-462`, most recently re-claimed in `write_paths` by `TC-534`/`TC-550` for the
  sibling test file - re-confirm both files' real current content yourself before touching
  anything, do not assume `TC-462`'s original content is still exactly what is on disk). It
  currently has only 3 of the mechanism's `_MAX_EXAMPLES = 5` slots used, and serves 6 real
  example chunks today (confirmed directly against the real committed
  `infra/demo-manifests/cells__cpp__self_extracted` generation) - already past its own real floor
  of 5 (Appendix C of the master plan: class B, min 5, stretch 10), but there is real additional
  headroom toward the stretch target with only 2 new slots to fill, not 5. Its real pinned
  repository is `aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp` (re-confirm the exact pinned commit
  yourself from `config/products/cells/cpp.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust
  this card's own citation blindly, and do not assume it matches the commit already pinned in the
  3 existing sidecar entries without checking). The real upstream repository has a real but thin
  `samples/` directory (per this project's own Appendix-C style accounting for this pilot, roughly
  1 real sample program) - read it, and since this alone is very unlikely to yield 2 more
  genuinely distinct operations beyond the 3 existing entries, also read the real public
  headers/API surface (`tests/fixtures/cells_cpp/api_surface.json`) for additional real, valuable,
  self-contained operations not already covered - the same sample-plus-API-surface mix
  `TC-737`'s own `email/cpp` card and `TC-739`'s own `slides/cpp` card already used successfully.

  `_MAX_EXAMPLES = 5` is a hard, already-enforced ceiling - this card raises `cells/cpp` from 6 to
  AT MOST 8 served examples (3 existing authored + up to 2 new = at most 5 authored total), not to
  its own stretch target of 10; closing that fully needs the P4 program's own later, larger
  per-language-sample-adapter work, explicitly out of this card's scope. This card's job is the
  real, bounded, immediately shippable slice: up to 2 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish, appended to
  (never replacing or reordering) the 3 that already exist.

  VERIFY EACH NEW EXAMPLE YOURSELF - this pilot's real verification toolchain needs a real C++
  compiler/CMake build against the real pinned library source (read `example_verifier.py`'s
  `prepare_cpp_library`/`verify_cpp_example` to confirm exactly what the real pipeline needs; this
  session's prior C++ cards (`TC-737`/`TC-739`/`TC-742`) all found Docker with a real `gcc:13-
  bookworm` + a modern CMake the practical path on this host, and all found a real, subtle trap
  worth repeating here: `CMAKE_BUILD_TYPE=Release` defines `NDEBUG`, silently turning every bare
  `assert()` into a no-op - build and run in Debug mode, or verify your assertions some other way
  that cannot be silently skipped, and confirm this explicitly (e.g. by checking `CMakeCache.txt`'s
  real `CMAKE_CXX_FLAGS_DEBUG` has no `-DNDEBUG`) before trusting any example "passed"). Note this
  pilot uses MSVC-specific paths in some of this project's own tooling (`_msvc_environment` in
  `example_verifier.py`) - confirm which real toolchain path the verifier actually takes for
  cells/cpp before assuming it matches the gcc/Docker pattern of the other C++ pilots.
depends_on:
  - TC-460
  - TC-565
  - TC-566
  - TC-462
  - TC-534
  - TC-550
