id: TC-045
gate: G2
lane: extraction
purpose: Pin pdf/java's real GitHub-presence data (releases, packaging manifest, governance
  docs) as fixtures and prove the existing, already-generic readers (github_release_reader,
  manifest_reader.read_java_manifest, repo_native_reader) work correctly against a
  fifth, differently-shaped repository - no reader code changes needed.
depends_on:
- TC-012
- TC-022
- TC-043
- TC-027
- TC-033
- TC-039
write_paths:
- tests/extraction/test_repo_native.py
- tests/fixtures/repo_native/**
satisfies:
- REQ-G2-025
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 8.6 New ingestion source: the FOSS repo''s own GitHub presence (distinct
    from `aspose.org`)'
  sha256: 3ffc905bc422c49676e488f41ef71e7ebdd8ac18a2eeb18b1ed83a27578c7fc3
inputs:
- 'VERIFIED by a fresh anonymous GitHub API read on 2026-09-24 against the real repository
  (config/products/pdf/java.yaml pins it): aspose-pdf-foss/Aspose.PDF-FOSS-for-Java
  has 2 releases, newest tagged v26.8.0 with a real, specific, non-templated body
  describing a genuine feature (a new Structured Document Model subsystem, 122 new
  public classes) - must classify as classify_richness''s ''detailed'' value.'
- 'VERIFIED pom.xml content (fetch via the Contents API, decode base64): groupId ''org.aspose'',
  artifactId ''aspose-pdf-foss'', version ''26.8.0''. Use manifest_reader.read_java_manifest
  (added in TC-022) against this real text and assert it extracts group_id/artifact_id/version
  correctly. Check the FULL real pom.xml text yourself (not just the snippet quoted
  here) for whether a maven.compiler.release/target/source property is present - if
  none is found, assert runtime_min_version is honestly empty rather than assuming
  either way.'
- 'VERIFIED presence via the Contents API: README.md present, AGENTS.md present (~8.3KB),
  CONTRIBUTING.md returns a real 404 (DocumentNotPresent) - the SAME presence pattern
  as cells/rust (AGENTS.md present, CONTRIBUTING.md absent), the opposite of slides/python
  and pdf/go''s pattern. Mirror the existing pinning approach.'
- Fetch these five real API responses yourself (releases list, pom.xml contents, README.md
  contents, AGENTS.md contents, CONTRIBUTING.md contents [expect 404]) via plain anonymous
  curl/urllib against api.github.com - no auth needed. Save each raw JSON response
  as a fixture file under tests/fixtures/repo_native/, named with a pdf_java_ prefix
  mirroring the existing naming convention in that directory.
- Do not modify github_release_reader.py, manifest_reader.py, or repo_native_reader.py
  - all three are already generic and confirmed correct; this card is fixtures + tests
  only.
actions:
- Fetch the five real GitHub API responses named above and save them as new fixture
  files under tests/fixtures/repo_native/, following the naming convention of the
  existing fixtures in that same directory.
- 'Extend tests/extraction/test_repo_native.py (add tests, do not remove or modify
  any existing test for another pilot) with: the real newest pdf/java release classifies
  as ''detailed''; manifest_reader.read_java_manifest against the real pom.xml text
  extracts group_id=''org.aspose'', artifact_id=''aspose-pdf-foss'', version=''26.8.0'';
  the pinned AGENTS.md fixture yields DocumentPresent with real, non-empty content;
  the pinned CONTRIBUTING.md fixture yields DocumentNotPresent.'
checks:
- command: '{python} -m pytest tests/extraction/test_repo_native.py -q'
  expect: exit 0
  timeout_seconds: 120
  junitxml: true
  proves:
  - REQ-G2-025
min_tests: 23
network: false
negative_control:
  mutate: 'python -X utf8 -c "import pathlib;p=pathlib.Path(''src/foss_mcp/extraction/github_release_reader.py'');s=p.read_text(encoding=''utf-8'');s=s+chr(10)+''classify_richness
    = lambda body: ''+chr(39)+''detailed''+chr(39)+chr(10);p.write_text(s,encoding=''utf-8'')"'
  rationale: Forcing classify_richness to always return 'detailed' must break the
    suite if any test asserts a non-detailed value anywhere - proves richness classification
    is genuinely exercised. Same falsifier shape as every prior GitHub-presence card's,
    self-checked end-to-end before being persisted.
evidence:
- evidence/build/G2/TC-045/receipt.json
closeout:
- Real pdf/java GitHub-presence fixtures are pinned and committed.
- The existing generic readers are proven correct against a fifth, differently-shaped
  repository.
- Forcing richness classification to always be 'detailed' fails the suite.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
