negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/relevance.py');s=p.read_text(encoding='utf-8');old='def stem_token(';assert old in s;p.write_text(s.replace(old,'def stem_tokenX(',1),encoding='utf-8')"
  rationale: >-
    Renames the stemmer every relevance computation goes through, so search_docs, lookup and find_examples can no longer compute
    a query's terms: the new relevance tests and the existing retrieval tests fail. A real break of the card's central claim.
