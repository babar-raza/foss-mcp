source_refs:
- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-11 — Documentation pages for every pilot come from its README at the pinned commit; supersedes OQ-002''s ''sealed candidates only'' (supervisor, pre-TC-351)'
  sha256: f29ce7eecf52723c064aa1050d00aee1e5ad9233dd0987f06abb715207202a9a
inputs:
- >-
  Read src/foss_mcp/mcp/tools/search_docs.py, lookup.py, find_examples.py (all of it, including `_EXAMPLE_MARKER`,
  `_extract_example`, `_coverage`, `_COVERAGE_THRESHOLD`, the exact-match branch through `get_symbol`, and `_vector_fallback`),
  get_symbol.py's `extract_fqn`, and `foss_mcp.indexing.lexical_index_writer.tokenize`/`query_lexical_index_scored`. Read the
  tests that cover them: tests/mcp/tools/test_retrieval_tools.py, tests/indexing/test_lookup_doc_fallback_query_safety.py,
  tests/indexing/test_vector_scope.py, tests/mcp/test_server_wiring.py. Look at real chunk shapes in
  infra/demo-manifests/pdf__go__self_extracted/ (symbol chunks start `FQN: <name>`, examples `FQN: Example: <title>` with a line
  that is exactly `Example:` before the code, documentation `FQN: Doc: <title>`, every chunk ends with `Source-Commit: <sha>`).
  Never print or log any environment value.
- >-
  NEW MODULE src/foss_mcp/mcp/tools/relevance.py (imported by the three tools, so it is wired), pure and deterministic:
  `chunk_kind(text)` returning `symbol`, `example` or `documentation` (`example` when the FQN line starts with `Example: `;
  `documentation` when the FQN line starts with `Doc: ` OR there is no FQN line at all, which keeps hand-written documentation
  chunks in tests working; `symbol` otherwise); a light stemmer named exactly `stem_token` (defined as `def stem_token(`) that
  lowercases and strips, in this order, `ations`/`ation`, `ings`/`ing` (only when at least 3 characters remain), `ies`->`y`,
  `es` after s/x/z/ch/sh, a final `s` not preceded by `s` (only when more than 3 characters), `ed` (only when more than 4
  characters) - so install, installs, installing, installation all give `install`, pages gives `page`, images gives `image`;
  `query_terms(query, family)`: the stemmed `tokenize(query)` set minus the stemmed tokens of the scope's family name and minus
  the fixed generic set {aspose, foss, library, api}; when that leaves nothing, the stemmed set before removal (so the bare query
  "pdf" still works); `coverage(terms, document_tokens)`: the fraction of terms present among the stemmed document tokens;
  `RELEVANCE_THRESHOLD = 0.6` (TC-273's measured value, unchanged; with two terms both must be present, with three at least two).
- >-
  search_docs: only `documentation` chunks are candidates (a symbol or example chunk is never documentation, whatever its words);
  `classify_content_type` is applied to documentation chunks only. A candidate is a hit only when
  `coverage(query_terms(query, scope.family), document["tokens"]) >= RELEVANCE_THRESHOLD`; hits are ordered by coverage
  descending, then the existing BM25 score descending (0 for a document BM25 did not score), then doc_id, and cut to top_k.
  Candidate selection must not depend on BM25 having scored the document, so stemmed matches ("install" vs "Installation") are
  found. The Miss shapes and reasons stay as they are.
- >-
  find_examples: an example chunk is one whose `chunk_kind` is `example` and which has a line that is exactly `Example:`; the
  exact-match branch keeps working for a query that equals an example's pseudo-FQN but looks the FQN up directly over the
  generation's documents (no longer through `get_symbol`, so a later card can stop get_symbol from returning pseudo-symbols
  without breaking this); the lexical branch uses `query_terms`/`coverage`/`RELEVANCE_THRESHOLD` instead of the raw token
  coverage, so the family word no longer counts. `_extract_example` returns the text after the LAST line that is exactly
  `Example:`, with trailing `Source-Commit:` lines and trailing blank lines removed and nothing else changed. `NoExampleFound`
  gains two additive fields with defaults, `found: bool = False` and `reason: str` (for example "no verified example matches
  this query" / "no published generation for this scope"); `ExampleMatch` gains `found: bool = True`. The vector fallback is
  unchanged apart from using the same snippet extraction.
- >-
  lookup: `_compose_from_docs` keeps its order and shapes; with the rules above it can no longer return symbol or example chunks
  as `doc_matches`. When the answer is the fall-through symbol Miss, leave its fields as they are.
- >-
  tests/mcp/tools/test_relevance_floor.py (NEW, offline, deterministic, nothing written inside the repository): (a) unit tests
  for `stem_token`, `query_terms` (family word removed; generic words removed; fallback when nothing remains) and `coverage`;
  (b) REAL-DATA tests that copy the committed scope directories infra/demo-manifests/pdf__net__self_extracted,
  pdf__go__self_extracted, pdf__typescript__self_extracted and cells__cpp__self_extracted into tmp_path with shutil.copytree and
  open a GenerationManifestStore there, asserting each QA case: pdf/net `search_docs("Document", "developer_guide")` and
  `lookup("how do I save a document")` contain no chunk whose kind is `symbol`; cells/cpp `lookup("how do I save a document")`
  has no `doc_matches` drawn from symbol chunks; pdf/go `lookup("rotate a page")`, `lookup("convert a pdf to images")` and
  `lookup("how do I extract text from a pdf")` never carry "Example: Split and Merge PDFs" as a doc match and never attach "Fill
  AcroForm Fields" as the example; pdf/net `find_examples("split a pdf into pages")` is not "Add a Watermark Annotation";
  pdf/typescript `find_examples("how do I extract text from a pdf")` is not "Create a New PDF from Scratch"; and the true
  positives still hold: pdf/net `find_examples("add a watermark to a PDF")` returns "Example: Add a Watermark Annotation",
  pdf/net and pdf/go `search_docs("install", "getting_started")` return an Installation page, pdf/typescript
  `find_examples("convert a pdf to html")` returns its Convert example; (c) the snippet of a real pdf/go and slides/python example
  starts with code (not the title, not `Kind:`), contains no `Source-Commit:` line and no `{{<` shortcode text that lives only in
  the description; (d) NoExampleFound carries `found` false and a non-empty reason. At least 24 tests, none skipped.
- >-
  tests/mcp/tools/test_retrieval_tools.py: keep every test passing UNMODIFIED except exactly one assertion, in
  `test_lookup_composes_example_only_answer_when_no_doc_content_exists_anywhere`: it asserts
  `isinstance(result.doc_matches, tuple) and result.doc_matches` and its own docstring explains this pins the very defect this card
  fixes (an example pseudo-symbol counted as developer_guide documentation). Change only that assertion to
  `assert result.doc_matches == ()`, leave its docstring and every other assertion alone, and say in your report that you did so.
  If any other existing test fails, stop and report it; do not weaken it.
- >-
  LIVE-CONTENT E2E TESTS (found by the first review: the review gate runs the related tests of every file a card touches, and this card's
  behaviour change legitimately breaks assertions that pin the OLD behaviour; the first worker counted nine). They are now in your write_paths and
  you must update them, changing ONLY the assertions that encode the old behaviour and keeping the tests' purpose: (a) tests that assert the
  source-commit hash appears INSIDE a returned example snippet (`test_lookup_composes_the_real_task_answer*` in the pdf_go, cells_rust, pdf_net
  and pdf_java live-content files; `test_find_examples_returns_the_real_compile_verified_shape_example` in the slides_python one): snippets are
  now the code alone, so assert instead that the snippet is exactly the verified code (no `Kind:`, no `Source-Commit:`, no `FQN:` lines) and
  that the example is still the compile-verified one; if the test wanted to prove provenance, assert it on a field the response really
  carries (the chunk/provenance fields), not in the snippet text; (b) `test_lookup_returns_real_doc_matches_for_an_api_naive_query` in the
  cells_rust, pdf_net and slides_python files: a query that reduces to two meaningful terms no longer reaches the 0.6 floor; change the QUERY
  text to a natural question with at least three meaningful terms that the page really answers, keep the assertions about what comes back.
  These tests start the real compose stack and a real container, so run each failing file ONCE ALONE (never in parallel with another docker job)
  and report the results; run the whole `tests/e2e/*_live_content.py` set once at the end. If a file fails for a reason unrelated to this
  card (an environment or port problem), say so with the error text instead of changing it. Do not delete or skip any test.
- >-
  Run `{python} -m pytest tests/mcp/tools/test_relevance_floor.py -q -rfE`, then once the second check command below. Write commit
  messages as UTF-8 without a byte-order mark.
actions:
- One shared relevance rule for documentation, lookup and examples, immune to symbol chunks and the product-family word, with light stemming.
- Clean example snippets and an explicit, additive miss marker, pinned by tests on the real committed demo data.
