- command: '{python} -m pytest tests/mcp/tools/test_relevance_floor.py tests/mcp/tools/test_retrieval_tools.py tests/indexing/test_lookup_doc_fallback_query_safety.py tests/indexing/test_vector_scope.py tests/mcp/test_server_wiring.py tests/mcp/tools/test_symbol_tools.py -q -rfE'
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-005
min_tests: 24
network: false
