id: TC-381
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-005 (pilot completeness). The preferred entry point returns near-constant noise. Reproduced on the committed demo
  manifests: `search_docs.classify_content_type` defaults EVERY chunk, API-symbol chunks included, to `developer_guide`, and an
  example chunk that contains "install " becomes `getting_started`; any positive BM25 score counts as a hit; `lookup` takes the
  first category with a hit. So pdf/net `lookup("how do I save a document")` answers with 10 symbol chunks as documentation,
  cells/cpp (no documentation page at all) answers with 10 "developer_guide" matches, and pdf/go answers "rotate a page", "convert a
  pdf to images" and "extract text" with the same Installation page and "Example: Split and Merge PDFs". `find_examples`'
  coverage floor (0.6) is defeated by the product-family word: after stop words, "split a pdf into pages" is {split, pdf, pages},
  "pdf" occurs in nearly every example, and one more shared word reaches 0.67, so pdf/net returns "Add a Watermark Annotation",
  pdf/go returns "Fill AcroForm Fields" for "extract text", pdf/typescript returns "Create a New PDF from Scratch". There is no
  plural/stem tolerance: `search_docs("install", "getting_started")` misses although "Installation..." pages exist. The
  find_examples snippet is not clean code: `_extract_example` splits at the first "Example:" substring, which is the
  `FQN: Example: <title>` line, so the snippet begins with the title, `Kind: verified_example` and prose and ends with the
  `Source-Commit:` line. And the miss shape promised by the tool description (`NoExampleFound`) carries no reason and no
  found marker. This card gives documentation search, lookup composition and example search one shared, deterministic relevance
  rule that symbol chunks can never satisfy and the product-family word cannot defeat, with light stemming, and makes the
  example snippet the code alone. Serving-side only: no re-ingestion is needed.
