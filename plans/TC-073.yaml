id: TC-073
gate: G2
lane: storage-retrieval
purpose: 'Fix the actual, final gap preventing lookup(''how do I add a watermark to
  a PDF'') from returning the real, compile-verified example - confirmed live and
  then diagnosed precisely via a direct script against the real tokenize/query_lexical_index
  functions after TC-072''s stopword fix alone was insufficient. Two distinct, confirmed
  causes: (1) the tokenizer never splits camelCase/PascalCase identifiers, so the
  query term ''add'' can never match the single merged token ''addwatermarkannotation''
  at all; (2) the scoring formula divides raw term frequency by total document length
  with no saturation, so a real code example''s longer body (code, boilerplate, a
  41-character commit-hash token) dilutes its own matching terms'' density below a
  much shorter, terser enum chunk that happens to share one matching word - a real,
  well-known bias of raw TF-IDF against longer relevant documents, for which Okapi
  BM25 is the standard, well-established fix.'
depends_on:
- TC-015
- TC-072
write_paths:
- src/foss_mcp/indexing/lexical_index_writer.py
- tests/indexing/test_index_writers.py
satisfies:
- REQ-G2-049
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 8.2 Common tools — present identically on every instance (9 tools —
    this table is the single authoritative registry; tool discovery, JSON schemas,
    and generated documentation are all derived from it, never restated independently)'
  sha256: fcc5e91a552d272bd617369066de6c312007c25806671af9c1ccbbfd6f574453
inputs:
- 'CONFIRMED by a direct diagnostic script run against the real functions today (not
  assumed): tokenize(''...AddWatermarkAnnotation...'') produces the single token ''addwatermarkannotation''
  - the query token ''add'' (from ''how do I add a watermark to a PDF'', after TC-072''s
  stopword filter correctly reduces it to [''add'',''watermark'',''pdf'']) never matches
  it at all. Separately, scoring a real ~66-token example chunk against a real ~19-token
  enum chunk that both contain ''watermark'' once/twice respectively: the CURRENT
  formula (`score += (count/len(tokens)) * idf`) ranks the SHORT enum chunk higher
  purely because dividing by len(tokens) rewards brevity over relevance - confirmed
  by running query_lexical_index directly against both real chunk texts and observing
  the enum chunk wins.'
- 'Fix 1 - camelCase/PascalCase-aware tokenization: for each alphanumeric run tokenize()
  finds, in ADDITION to the existing whole lowercased token (kept, for an exact-identifier
  query to still work), also emit its case-boundary-split sub-words as additional
  tokens (e.g. ''AddWatermarkAnnotation'' -> also ''add'', ''watermark'', ''annotation'').
  Probe the real regex behavior yourself against real identifiers from tests/fixtures/pdf_net/api_surface.json
  (e.g. ''AddWatermarkAnnotation'', ''GetOrCreateMetadata'', a plain lowercase name,
  an ALL-CAPS acronym like ''URI'') before trusting your split pattern - this project''s
  own standing discipline for exactly this kind of pattern-matching work, do not guess.'
- 'Fix 2 - replace the raw TF-IDF-ish scoring in query_lexical_index with standard
  Okapi BM25 (well-known, standard formula, no new dependency - pure arithmetic):
  for each query term t with document frequency df(t) and each document d with term
  count f(t,d) and length |d|, using avgdl = the corpus''s average document length:
  `idf(t) = ln((N - df(t) + 0.5) / (df(t) + 0.5) + 1)`, `score(d) += idf(t) * (f(t,d)
  * (k1+1)) / (f(t,d) + k1 * (1 - b + b * |d| / avgdl))`, standard defaults k1=1.5,
  b=0.75 (name them `_BM25_K1`/`_BM25_B` module constants - the exact name `_BM25_K1
  = ` is required for the negative control below). N is the total document count.
  Sum over all query terms exactly as the current implementation already sums - only
  the per-term formula and the module constants are new.'
- Do not touch search_symbols.py, find_examples.py, or lookup.py - this card is scoped
  to the shared tokenizer/scorer alone. Every existing exact-technical-term test (querying
  'Document', 'AFRelationship', etc.) must keep passing - BM25 still ranks an exact,
  rare term highly, it only removes the unwarranted bias against longer documents.
actions:
- Probe real identifier case-splitting behavior yourself, then implement it in tokenize().
- Replace query_lexical_index's scoring with real BM25 exactly as specified, computing
  avgdl from the actual corpus passed in.
- 'Add real tests: (1) tokenize(''AddWatermarkAnnotation'') includes ''add'', ''watermark'',
  and ''annotation'' as separate tokens, plus the whole merged token; (2) reproduce
  today''s real finding as a regression test - build a real lexical index from a short
  enum-like chunk and a longer, real example-shaped chunk (reuse actual chunk text
  shapes from this project''s own fixtures/prior cards, not an invented example) both
  containing the query''s matching term, and assert the longer, more specifically
  relevant chunk now ranks first under BM25 where it previously lost under raw TF-IDF;
  (3) an exact rare-term query (e.g. ''AFRelationship'') still returns the correct
  chunk, proving BM25 didn''t regress exact matching.'
- Run the FULL existing test suite (not just your own two files) yourself and confirm
  no regressions, exactly as TC-072's worker did - report what you ran.
- 'FINAL REQUIRED PROOF: bring up the real ingest-pdf-net + serving containers yourself
  (docker compose, real network/dotnet build, matching TC-069''s established pattern)
  and call the REAL lookup tool with the REAL query ''how do I add a watermark to
  a PDF'' over a real MCP session. It must return a TaskAnswer whose example field
  contains the real, compile-verified AddWatermarkAnnotation code. This is the concrete,
  bounded target - do not consider further ranking refinements beyond making this
  exact real query work correctly. Tear down containers afterward.'
checks:
- command: '{python} -m pytest tests/indexing/test_index_writers.py -q'
  expect: exit 0
  timeout_seconds: 120
  junitxml: true
  proves:
  - REQ-G2-049
min_tests: 5
network: true
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/indexing/lexical_index_writer.py');s=p.read_text(encoding='utf-8');s=s.replace('_BM25_K1
    = ','_BM25_K1_DISABLED = ');p.write_text(s,encoding='utf-8')"
  rationale: Renaming _BM25_K1 so it is never referenced must break the BM25-dependent
    tests with a NameError, proving they genuinely exercise the real BM25 implementation,
    not merely that some scoring function exists. Self-checked end-to-end against
    a fixture implementing the exact prescribed name before being persisted.
evidence:
- evidence/build/G2/TC-073/receipt.json
closeout:
- A camelCase/PascalCase identifier's constituent words are indexed and matchable
  by a natural-language query, in addition to the whole identifier.
- A longer, genuinely more relevant document (a real code example) is no longer unfairly
  outranked by a much shorter, more tangentially-related one purely due to raw length
  normalization.
- An exact rare-term query still works correctly.
- The full existing test suite still passes.
- A real, live query for 'how do I add a watermark to a PDF' against the real running
  pdf/net container returns the real, compile-verified example.
- Renaming _BM25_K1 fails the suite.
recovery: Re-run from a clean tree; if the network clone/build step is flaky, re-running
  is safe and idempotent.
