id: TC-804
gate: G3
lane: storage-retrieval
purpose: >-
  XA9a - description-derived example titles, MEASUREMENT-GATED. 21 served examples have a '(N)'
  counter title ('Additional Examples (2..5)', 'Quick Start (2)') and 46 (16%) have a generic
  title; every one of the 21 has a usable first sentence. Derive a specific title from the
  example's own description sentence at candidate-extraction time. HARD GATE (hard-won lesson of
  TC-760/761: retitling interacts with `title_anchored` and the find_examples wrong-confident
  ratchet has ~2 cases of headroom, 41/729 vs ceiling 43): BEFORE committing any production
  change, simulate the retitled corpus IN MEMORY against
  tests/mcp/tools/test_round3_retrieval_corpus.py (wrong_conf <= 43/729, every per-pilot ceiling)
  and tests/mcp/tools/test_forgiveness_acceptance.py (MIN_CONCISE_HITS >= 23). If the simulation
  cannot clear both, the card is SUPERSEDED: commit nothing but a short report with the numbers
  (the plan allows this for measurement-gated cards) - never loosen a ratchet.
depends_on:
  - TC-803
  - TC-802
  - TC-801
  - TC-800
  - TC-760
  - TC-458
  - TC-460
  - TC-565
write_paths:
  - src/foss_mcp/indexing/example_candidates.py
  - infra/build_chunks.py
  - tests/indexing/test_example_titles_description_derived.py
satisfies:
  - REQ-G3-011
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    The measured design record for this stage is in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\decision.md
    (section 2 for your stage, section 3 for the card breakdown; per-pilot corpus table in
    C:\Users\babar\AppData\Local\Temp\claude\ba7a97aae65a293e\697bcd44-50ef-4b4a-9cc0-f2541ed92371\scratchpad\infra_decision\per_pilot_table.md).
    Its numbers were measured on 2026-11-14 - re-measure what you rely on. Where the record and the
    code disagree, the code wins; say so in your report.
  - >-
    READ FIRST: how titles are derived in example_candidates.py (they feed the chunk FQN `Example:
    <title>`), tests/mcp/tools/test_find_examples_title_anchor.py (44; the invariant stays), the
    title-anchor logic in src/foss_mcp/mcp/tools/relevance.py, DECISION_LOG entries on TC-760/TC-761
    (a retitling attempt that collided), and search tests/ and tests/fixtures/ for the OLD title
    strings (`Example: Quick Start (2)` etc.) that exact-title tests may pin.
  - >-
    MEASURE FIRST (no repo changes): list the 21 counter titles and 46 generic titles with their
    first sentences; build the retitled set in memory; run the retrieval-corpus and
    forgiveness-acceptance logic against the retitled corpus by loading the committed generations,
    rewriting only the example chunk titles in memory, and reporting wrong_conf, MIN_CONCISE_HITS
    and per-pilot ceilings before/after. State the go/no-go decision explicitly in your report with
    the numbers.
  - >-
    IF GO: implement the derivation (deterministic, unique per pilot - never introduce a title
    collision; keep the counter only as a last-resort tiebreak), update only the exact-title
    assertions that pinned old titles, and add
    tests/indexing/test_example_titles_description_derived.py (derivation unit tests + an in-memory
    ratchet simulation test that fails if titles collide or the ratchet would be exceeded). IF
    NO-GO: commit nothing; report the numbers and stop.
  - >-
    Do NOT regenerate or touch anything under infra/demo-manifests/ or
    tests/fixtures/verified_examples/ - a single coordinated regeneration of all pilots happens in a
    later card; this card changes code and tests only. Chunk text produced by the new code will
    therefore differ from the committed generations - tests must exercise the code path directly,
    never rely on the committed generations being regenerated.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies that commit's
    production-code part). Before committing run `ruff format` and `ruff check` on changed Python
    files, then run the card's check command twice and report the real results. Keep every
    pre-existing test unchanged unless a test pinned the now-corrected behavior as 'correct' - then
    change only that assertion and say so.
actions:
  - >-
    Derive specific example titles from the description sentence if and only if an in-memory
    simulation proves the retrieval ratchets still hold; otherwise supersede with the measured
    numbers.
checks:
  - command: '{python} -m pytest tests/indexing/test_example_titles_description_derived.py tests/indexing/test_example_candidates.py tests/indexing/test_example_candidates_supply.py tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py tests/mcp/tools/test_find_examples_title_anchor.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 1800
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 305
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/indexing/example_candidates.py', 'infra/build_chunks.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-804/receipt.json
closeout:
  - >-
    Example titles are description-derived and unique, with the retrieval ratchets proven intact by
    simulation - or the card is superseded with the measured reason.
recovery: Re-run from a clean tree.
