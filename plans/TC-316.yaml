inputs:
- 'Read `_extract_bases()`''s full generic child-type loop (~line 867-924) before changing anything, including
  the class_heritage sub-clause handling above it and the comma-split/preprocessor-stripping logic below the
  tuple membership check. Reproduce the gap yourself first: run a live parse probe (tree-sitter-typescript,
  already a project dependency) on a small synthetic `export interface Child extends Parent {}` snippet and
  confirm directly, in your own session, that the real node type is `extends_type_clause` and that it is
  currently NOT in the recognized-child-types tuple at ~line 893-902.'
- 'Add `"extends_type_clause"` to that tuple. The existing generic-path logic immediately after the tuple
  membership check already strips a leading `extends`/`implements`/`:` keyword and comma-splits for multiple
  bases (`interface Foo extends A, B {}`) - this should be the ONLY change needed, reusing that logic exactly
  as every other recognized node type in the tuple already does. Do not duplicate or special-case the
  stripping/splitting logic for this new node type unless your own live verification shows a real structural
  difference that requires it - report explicitly if you find one.'
- 'Verify live against the real, pinned cells/typescript repository (network access available; do NOT
  regenerate any committed fixture as part of this card - that is explicitly deferred to a re-dispatch of
  TC-306 once this lands, mirroring every other root-cause-then-repin split this session has already used) that
  at least one of the 19 real `interface X extends ShapeInfo` relationships now correctly extracts `bases:
  ["ShapeInfo"]`, and that ShapeInfo''s own real members are available for `_flatten_inheritance()` to copy
  once TC-306 re-runs (you do not need to run the flattening step yourself - just confirm bases now populates
  correctly, which is this card''s own scope).'
- 'Also check (do not assume) whether pdf/typescript''s own real pinned source has any genuine interface-
  extends-interface relationship that was silently missed the same way, per the worker''s own finding that this
  gap is cross-cutting. If you find one, report it explicitly; do not regenerate that fixture either (also
  deferred to its own follow-up card) - this card''s job is the engine fix and its own verification only.'
- 'Add tests to tests/extraction/tree_sitter_engine/test_tree_helpers.py (read this file''s own existing
  class_heritage/extends_clause test conventions first and mirror them): a synthetic interface-extends-interface
  case correctly extracting bases, a multi-interface-extends case (`interface Foo extends A, B {}`) correctly
  splitting into two bases, and a regression test proving every other recognized node type in the tuple
  (class_heritage, extends_clause, implements_clause, superclass, base_list, etc.) is completely unchanged by
  this addition.'
- 'Run the full existing test suite once and report honestly. If anything outside your two write_paths breaks,
  STOP and report rather than patching around it.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Reproduce the extends_type_clause gap yourself with a live parse probe before writing a fix.
- Add "extends_type_clause" to _extract_bases()'s recognized-child-types tuple; verify live against the real
  cells/typescript repository that a real interface-extends-interface relationship now correctly populates bases.
- Check whether pdf/typescript has the same gap and report honestly either way, without regenerating its fixture.
- Add tests for the new node type and a regression test for every existing recognized type; run the full suite once.
