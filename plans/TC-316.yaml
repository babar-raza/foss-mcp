id: TC-316
gate: G2
lane: extraction
purpose: 'A second, independent genuine extraction-engine defect found by TC-306''s worker while attempting to
  re-pin cells/typescript''s fixture (recorded in docs/DECISION_LOG.md 2026-10-09): tree_sitter_engine/
  tree_helpers.py''s `_extract_bases()` generic child-type loop (~line 893-902) recognizes TypeScript''s class-
  level `class_heritage`/`extends_clause`/`implements_clause` nodes, but NOT `extends_type_clause` - the real
  tree-sitter-typescript node type for an INTERFACE extending another interface (confirmed via a live parse
  probe: `export interface ChartInfo extends ShapeInfo {}` parses as
  `interface_declaration -> type_identifier, extends_type_clause[extends, type_identifier], interface_body`).
  Live-confirmed on the real, pinned cells/typescript repository: `aspose_cells/types.ts` has 19 real
  `interface X extends ShapeInfo { ... }` declarations, and `ShapeInfo` itself declares 15+ real members
  (name/fromCol/fill/lineColor/x/y/cx/cy/xfrmX/xfrmY/picCx/picCy/...) that the child interfaces do not
  redeclare - a real, substantial inheritance relationship that currently extracts as `bases: []` for every one
  of the 19 children, with no trace anywhere in the fixture. The worker also found this is cross-cutting, not
  pilot-specific: pdf/typescript (an already-closed sibling pilot) has no interface-extends-interface `bases`
  entries tagged either, consistent with the identical gap being silently present there too, undetected until
  now because that pilot''s own real inheritance happened to be entirely class-level (`class_heritage`, already
  handled).'
