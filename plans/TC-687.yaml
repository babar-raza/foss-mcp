id: TC-687
gate: G3
lane: extraction
purpose: >-
  C12 (content-truth sub-program, section 2.4: "C12 adds a `gh` transport to the sidecar
  fetchers: the operator's existing `gh` login does the reads (no token read, written or logged
  by an agent), which removes the OWNER-14 dependency for the demo image (OWNER-14 stays open for
  the cluster path only)").

  CONFIRMED (supervisor, this session): all 4 real GitHub-fetching call sites in this repo funnel
  through ONE shared transport module, `src/foss_mcp/extraction/github_http.py`'s `with_auth` +
  `urlopen_with_backoff` - the identical `urllib.request.Request(url, headers=with_auth(...))`
  then `urlopen_with_backoff(request, ...)` shape, in `repo_native_reader.py` (README/file
  contents), `manifest_reader.py` (manifest file contents), `github_release_reader.py` (releases/
  tags), and `verify_package_registry.py` (commit lookup for drift detection). `with_auth` adds a
  bearer `Authorization` header ONLY when the `GITHUB_TOKEN` env var is set and non-empty -
  otherwise every call runs fully unauthenticated, at GitHub's much lower unauthenticated rate
  limit (60/hour vs 5,000/hour authenticated).

  `OWNER-14` itself (read directly in `docs/DECISION_LOG.md`/`ops/open_questions.jsonl`'s
  `OQ-015`) is about a SPECIFIC CLUSTER Kubernetes Secret's token being rejected (HTTP 401) - it
  is about the CLUSTER deployment path specifically, already marked RESOLVED there via a
  carry-forward fallback (OQ-015), not currently an open demo-image blocker in the sense of
  something actively broken today. C12's real, still-available value for the LOCAL/demo path is
  different and additive: using the operator's own already-authenticated `gh` CLI session (no
  agent ever reads, writes, or logs a token) raises the EFFECTIVE rate limit for local re-ingest
  runs from 60/hour to whatever the operator's own `gh auth status` already grants, without any
  agent handling a credential at all.

  Fix, additive and risk-bounded by design: add ONE new helper to the shared module,
  `gh_cli_json(path: str) -> Any | None` (its own docstring makes explicit that it NEVER reads,
  writes, or logs `GITHUB_TOKEN` or any other credential - it only shells out to the operator's
  own `gh` CLI, which manages its own separate, already-authenticated session). It runs
  `gh api <path>` via `subprocess.run`, returns the parsed JSON on a clean exit 0, and returns
  `None` on ANY failure whatsoever (gh not installed, not authenticated, non-zero exit, a timeout,
  malformed output) - deliberately never raising, never distinguishing WHY it failed, so every
  real call site can try it first and fall through to the EXISTING, UNCHANGED urllib-based code
  path on any failure, including a genuine 404 (which the existing code already handles
  correctly). This must never WEAKEN or WRAP `urlopen_with_backoff` itself - that function's
  retry/backoff/rate-limit-budget/401-handling semantics are tuned from real past incidents
  (`docs/DECISION_LOG.md`'s own 2026-10-19/2026-10-22 OWNER-14 entries) and must stay byte-for-byte
  unchanged.
