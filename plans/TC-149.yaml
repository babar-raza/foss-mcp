id: TC-149
gate: G2
lane: verification
purpose: TC-144/145/146/147/148, this round's five wiring fixes (resolve_anchor, fetch_manifest_file
  + read_repo_document, build_manifest, with_validation, new_correlation_id), each
  made a previously-genuinely-unreachable symbol real-callable - confirmed directly
  by re-running tests/test_unwired_modules.py's own real ast-based import-graph walk
  against current main, which now correctly FAILS (three separate assertions) because
  the pinned _KNOWN_UNWIRED frozenset has gone stale, exactly as this test is designed
  to force. Additionally, TC-145's new infra/fetch_product_reference.py is a real,
  legitimate production entrypoint (an operator-run CLI, exactly like infra/ingest.py
  and infra/rollback.py already are) that is not yet registered in this file's own
  ENTRYPOINTS tuple, which is why fetch_manifest_file and read_repo_document still
  show as unreachable despite TC-145's real wiring. Register the new entrypoint and
  re-pin both frozensets to the walk's own current, verified output - do not guess
  the new set by hand; recompute it directly from the real, current code.
