id: TC-149
gate: G2
lane: verification
purpose: 'TC-144/145/146/147/148, this round''s five wiring fixes (resolve_anchor,
  fetch_manifest_file + read_repo_document, build_manifest, with_validation, new_correlation_id),
  each made a previously-genuinely-unreachable symbol real-callable - confirmed directly
  by re-running tests/test_unwired_modules.py''s own real ast-based import-graph walk
  against current main, which now correctly FAILS (three separate assertions) because
  the pinned _KNOWN_UNWIRED frozenset has gone stale, exactly as this test is designed
  to force. Additionally, TC-145''s new infra/fetch_product_reference.py is a real,
  legitimate production entrypoint (an operator-run CLI, exactly like infra/ingest.py
  and infra/rollback.py already are) that is not yet registered in this file''s own
  ENTRYPOINTS tuple, which is why fetch_manifest_file and read_repo_document still
  show as unreachable despite TC-145''s real wiring. Register the new entrypoint and
  re-pin both frozensets to the walk''s own current, verified output - do not guess
  the new set by hand; recompute it directly from the real, current code. FURTHER
  FINDING (from this card''s own attempt 1, reported back by the worker, confirmed
  correct by the supervisor): TC-148 made src/foss_mcp/mcp/server.py import foss_mcp.telemetry.usage_recorder
  directly (UsageRecorder, build_event, new_correlation_id), which means that module''s
  FILE is now genuinely on the production-reachable path for the very first time (confirmed
  directly: usage_recorder.py is now in _PROD_REACHABLE). The module''s own step 3
  scan therefore now correctly classifies UsageRecorder''s wiring status on its own.
  This makes the separate step-4 special case - _usage_recorder_has_any_production_or_infra_reference()
  and its hardcoded `assert not ...` in test_the_real_import_graph_walk_finds_exactly_the_known_unwired_symbols,
  which exists (per its own docstring) ONLY because that file used to sit entirely
  outside the production-reachable set - now obsolete and, worse, actively wrong:
  it unconditionally asserts the file is never referenced, which is no longer true
  and can never be true again now that server.py depends on it directly. Retire the
  step-4 special case entirely: step 3''s general scan is now a strict superset of
  what it checked.'
