negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('tests/test_unwired_modules.py');s=p.read_text(encoding='utf-8');s=s.replace('    INFRA_ROOT
    / \"fetch_product_reference.py\",\n', '');p.write_text(s,encoding='utf-8')"
  rationale: Removes the new ENTRYPOINTS line this card adds (INFRA_ROOT / 'fetch_product_reference.py'),
    reverting the entrypoint registration while leaving the re-pinned frozensets in
    place - this makes the real import-graph walk once again find fetch_manifest_file/read_repo_document
    as unreachable, which no longer matches the (now-shrunk) _KNOWN_UNWIRED, failing
    test_the_real_import_graph_walk_finds_exactly_the_known_unwired_symbols. Proves
    the checks genuinely depend on this card's specific entrypoint-registration change,
    not merely on the frozenset literals changing. Self-checked end-to-end before
    being persisted.
evidence:
- evidence/build/G2/TC-149/receipt.json
closeout:
- infra/fetch_product_reference.py is registered in ENTRYPOINTS.
- _KNOWN_UNWIRED contains exactly the real, current import-graph walk's output - verified
  by running the test, not merely asserted.
- _KNOWN_UNWIRED_AND_UNTESTED is an empty frozenset.
- tests/test_unwired_modules.py passes clean on current main.
- Reverting the ENTRYPOINTS addition fails the suite again.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
