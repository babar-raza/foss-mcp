inputs:
- 'Read tests/test_unwired_modules.py in full: its module docstring, the ENTRYPOINTS
  tuple, _KNOWN_UNWIRED, _KNOWN_UNWIRED_AND_UNTESTED, and every test function that
  references them.'
- 'Run `{python} -m pytest tests/test_unwired_modules.py -q` against the current,
  real tree BEFORE making any change, to see exactly which assertions fail and why
  (three failures expected: UsageRecorder now has a real reference, read_repo_document
  now has a real caller, fetch_manifest_file is now test-reachable).'
- Do NOT hand-compute the new _KNOWN_UNWIRED set from reading the source. After adding
  the new entrypoint (action 1 below), recompute the real set by importing this test
  module and calling its own `_compute_unwired_from_production_reachable_files()`
  plus checking `_usage_recorder_has_any_production_or_infra_reference()` directly
  in a throwaway Python shell - then transcribe exactly that computed result into
  the frozenset literal, never a guess.
actions:
- Add `INFRA_ROOT / "fetch_product_reference.py"` as a new entry in the ENTRYPOINTS
  tuple (it is a real, legitimate operator-run CLI entrypoint from TC-145, exactly
  like ingest.py/rollback.py already registered there).
- 'Recompute the real unwired set per the inputs above (import the module fresh after
  your ENTRYPOINTS edit, or just run the test file and read its own failure diff,
  whichever is more direct) and replace _KNOWN_UNWIRED''s frozenset literal with exactly
  that computed set, removing: foss_mcp.extraction.claim_id_bridge.resolve_anchor,
  foss_mcp.extraction.manifest_reader.fetch_manifest_file, foss_mcp.extraction.repo_native_reader.read_repo_document,
  foss_mcp.indexing.generation_manifest.build_manifest, foss_mcp.normalization.chunker.with_validation,
  foss_mcp.telemetry.usage_recorder.UsageRecorder. Five symbols should remain: prepare_cpp_library,
  verify_cpp_example, query_vector_index, document_schema.from_dict, document_schema.to_dict
  (verify this list against your own recomputation - do not simply trust this card''s
  own prediction of it).'
- Update _KNOWN_UNWIRED_AND_UNTESTED to an empty frozenset() - both symbols that were
  in it (fetch_manifest_file, with_validation) are removed from _KNOWN_UNWIRED entirely
  now, and _KNOWN_UNWIRED_AND_UNTESTED must stay a subset of _KNOWN_UNWIRED.
- Run `{python} -m pytest tests/test_unwired_modules.py -q` and confirm all tests
  pass clean, twice.
checks:
- command: '{python} -m pytest tests/test_unwired_modules.py -q'
  expect: exit 0
