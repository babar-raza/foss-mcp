requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/python_surface.py');s=p.read_text(encoding='utf-8');old='defaults = [None] * (len(positional) - len(args.defaults)) + list(args.defaults)';assert s.count(old)==1;p.write_text(s.replace(old,'defaults = [None] * len(positional)',1),encoding='utf-8')"
  rationale: >-
    Makes the extractor see no default for any positional parameter, the exact failure the reviewer measured (every defaulted parameter rendered as
    required): the default-capture tests, the ast oracle test and the rendering tests that expect `= None` fail. A real break of the card's central claim.
evidence:
- evidence/build/G3/TC-522/receipt.json
closeout:
- >-
  Python signatures keep defaults, the `*` and `/` markers and static/classmethod/async marks; a facade exported from a package `__init__` carries its
  own methods; the symbol cap cannot separate a re-export from its definition. The 12 committed python fixtures are still version 1 and listed in
  KNOWN_GAP; the re-extraction card must regenerate at least pdf_python, cells_python, jmap_python and slides_python (and ideally all 12), verify
  `extractor_version` 4 or higher, that aspose_pdf.facades.PdfFileSecurity and PdfFileEditor are present with encrypt_file and merge methods, that
  defaults and modifiers are non-zero, and delete the matching KNOWN_GAP entries and refresh the docs-identifiers allowlist, then the image is rebuilt.
recovery: Re-run from a clean tree.
