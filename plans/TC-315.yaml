inputs:
- 'Read the existing per-language canonical_namespace/class_import branches (~line 3867-4027), paying closest
  attention to the `typescript` branch (~line 3961-3995, added by TC-DUPIDX-06 for the identical reason: "no
  namespace-equivalent field at all"). Also read consolidate_classes'' Category 2/3 logic (~line 2300-2385) so
  you understand exactly how the missing branch causes the real failure mode described above - reproduce it
  yourself first (either against a small synthetic two-file fixture mirroring the real jmap/nodejs shape, or
  directly against the real pinned jmap/nodejs repository over the network) before writing a fix.'
- 'Add an `elif language == "javascript":` branch mirroring the typescript branch''s file-path-derived
  module_path logic (NOT its `_ts_namespace_chain()` call - that reads a TypeScript-only `namespace { }`
  construct that has no JavaScript equivalent and whose tree-sitter node type will not exist in a JS parse
  tree; skip that part entirely for this branch). Derive module_path from the file''s path relative to
  pkg_root, stripping the `.js`/`.mjs`/`.cjs`/`.jsx` extension and collapsing an `index` file segment exactly
  as the typescript branch already does for `.ts`/`.tsx`/`index` - check yourself whether this project''s own
  JS extraction path actually emits any of `.mjs`/`.cjs`/`.jsx` for a real pilot, or only `.js`, and handle
  whichever you confirm live rather than guessing the full set blindly.'
- 'Verify live against the real, pinned jmap/nodejs repository (network access available; do NOT regenerate the
  committed fixture as part of this card - that is explicitly deferred to a re-dispatch of TC-311 once this
  lands, mirroring every other root-cause-then-repin split this session has already used) that `client-core.js`
  and `index.js` now derive DIFFERENT canonical_namespace/class_import values for their respective `JmapClient`
  entries (e.g. `client-core.JmapClient` vs `index.JmapClient`), so they no longer collide in the same
  consolidate_classes dedup group at all, and confirm the real, full JmapClient implementation (with its real
  methods) now survives extraction rather than being discarded.'
- 'If, after adding the javascript branch, you find the two entries STILL collide for some reason you did not
  anticipate (e.g. both files genuinely deriving to an identical module_path), THEN also address
  consolidate_classes'' Category 2 heuristic itself - but treat the namespace branch as the primary, expected
  fix and the heuristic as a secondary fallback only if genuinely still needed; report explicitly which one(s)
  you ended up touching and why.'
- 'Add tests to a new file, tests/extraction/tree_sitter_engine/test_api_surface_javascript.py (check whether an
  analogous test_api_surface_typescript.py or similar already exists and mirror its own construction convention
  if so) - at minimum: two same-bare-name classes in different files deriving distinct canonical_namespace/
  class_import values and NOT being merged by consolidate_classes; a regression test proving the existing
  typescript/python/rust branches are completely unchanged by this addition.'
- 'Run the full existing test suite once and report honestly. If anything outside your two write_paths breaks,
  STOP and report rather than patching around it.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
