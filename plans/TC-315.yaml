id: TC-315
gate: G2
lane: extraction
purpose: 'A genuine extraction-engine defect found by TC-311''s worker while attempting to re-pin jmap/nodejs''s
  fixture (recorded in docs/DECISION_LOG.md 2026-10-09): src/foss_mcp/extraction/tree_sitter_engine/api_surface.py''s
  per-language canonical_namespace/class_import derivation (~line 3867-4027) has explicit branches for cpp,
  java, csharp, python, typescript, and rust - but NONE for javascript, the language this project''s own
  "nodejs" pilots actually extract under (confirmed live: jmap/nodejs''s fresh extraction reports
  `"language": "javascript"`). Without a namespace signal, two files'' worth of same-bare-name classes collide
  into one `consolidate_classes()` dedup group as if they were the same type. Live-confirmed on the real,
  pinned jmap/nodejs repository: `src/client-core.js` declares the real, full `JmapClient` (bases=[], the real
  session/request/echo/uploadBlob/downloadBlob implementation); `src/index.js` separately declares a near-empty
  wrapper also named `JmapClient` (`class JmapClient extends CoreClient {}`, via
  `import { JmapClient as CoreClient } from "./client-core.js"`, so the alias defeats
  consolidate_classes'' own Category 3 shim-detection, which only matches a base literally named after the
  dropped duplicate). Both entries land in the same `ns=""` group and hit Category 2 ("stub vs full": a class
  with `bases` is assumed more complete than one without) - which is backwards here, so the real, full
  implementation is discarded and the near-empty wrapper survives with zero real methods. The committed fixture
  would silently lose the entire real JmapClient API if regenerated as-is; TC-311''s worker correctly stopped
  rather than commit over this.'
