id: TC-670
gate: G3
lane: storage-retrieval
purpose: >-
  Closes the real majority of round-2's own #1 cross-cutting finding ("find_examples is broken
  almost everywhere... matches on example title words only, not body/code content", ~49 issues,
  `docs/round2/HANDOFF.md`) - re-scoped 2026-11-03 after this supervisor found, by direct testing
  against the real `relevance.required_terms()`, that the existing fix (`TC-635`/Q10,
  `code_anchored`) only admits a query term that is syntactically COMPOUND (a camelCase hump, an
  underscore, or a letter+digit mix - confirm this yourself by reading `required_terms()` and
  `_IDENTIFIER_RUN_RE`/`_LOWER_THEN_CAPITAL_RE` in `relevance.py`). Tested directly:
  `required_terms()` returns an EMPTY set for `watermark`, `formula`, `Workbook`, `Box`, and every
  one of pdf/python's 18 missed verbs (`encrypt`, `sign`, `rotate`, `crop`, ...) - i.e. every
  PLAIN capitalized-or-lowercase word, which is the overwhelming majority of real class/concept
  names in this portfolio (`Workbook`, `Document`, `Scene`, `Table`, `Cell`, `Page`,
  `Presentation`, ...). Q10 closed a real but minority slice (compound identifiers only); this
  card closes the dominant case.

  The right fix is NOT a bigger regex. The right question `code_anchored` should ask is "is this
  query term a REAL SYMBOL NAME in this pilot's own index" - not "does this term look
  syntactically like code". `find_examples()` already receives the exact same
  `documents` dict (`manifest.payload["lexical_index"]["documents"]`) that `search_symbols.py`'s
  own Miss-path already iterates to build a `known_fqns` list for `suggest_similar_fqns`
  (`search_symbols.py` ~line 1400-1404: `extract_fqn(documents[doc_id]["text"])`, filtered by
  `_NON_SYMBOL_FQN_PREFIXES`) - read that real loop as your template, do not invent a different
  one. Build the scope's real set of short symbol names (the final dotted/`::`-separated segment
  of each real, non-pseudo FQN) from that same data, and extend the required-terms mechanism so a
  query's own word that case-sensitively matches a real short name ALSO anchors `code_anchored`,
  in addition to (never instead of) the existing compound-identifier check. The code side of the
  check (the example's own snippet must actually CONTAIN the term, per `code_anchored`'s existing
  contract) is unchanged - only which query terms get WATCHED for is widened.

  Also wire `known_defects` into `find_examples` - confirmed by this supervisor to have ZERO
  wiring today (`grep known_defect find_examples.py` returns nothing), the one surface among
  `get_symbol`/`search_symbols`/`get_product_reference`/`report_index_freshness`/`find_examples`
  that was never given it. `ExampleMatch` (the dataclass this tool returns) has no `known_defects`
  field at all yet - add one the same way every other additive field on this dataclass already
  works (default `()`, documented in the class docstring, last field). Call the real
  `known_defect_lines(scope, fqn, text)` (same function `get_symbol.py`/`search_symbols.py`
  already call, now also benefiting from `TC-658`'s multi-ref mechanism) for the matched example's
  own `fqn`/`text`, for every returned match (exact and lexical).

  Do not touch the title anchor, the coverage floor, or any existing admission tier's own
  thresholds - this card is additive only, exactly like Q10 was. The "no pilot ever gets worse"
  rule applies in full: every existing ratchet-bundle test (title anchor, nonsense-miss,
  forgiveness acceptance, round3-retrieval corpus) must still pass unchanged, proving this widens
  recall without weakening precision anywhere it already worked.
