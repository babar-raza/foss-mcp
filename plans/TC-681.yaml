id: TC-681
gate: G3
lane: storage-retrieval
purpose: >-
  C6 (content-truth sub-program, section 2.4: "one `install` recipe, guard no longer strips
  `git clone`, manifest extras (`[pdf]`), CMake version check"). This wave-table item bundles 4
  separate sub-claims; 2 of them are already fixed or fully covered by existing, already-reviewed
  mechanisms (verified directly against real code and real pilot data this session, not assumed):

  - "guard no longer strips `git clone`": ALREADY FIXED, by TC-561 (long before this remediation
    program started) - confirmed via `git log -S"git clone"` and the current, committed
    `_cpp_build_guidance`/`_drift_notice`, both of which deliberately EMIT `git clone` as part of
    structured build guidance. No guard strips it anywhere in the current codebase.
  - "CMake version check": ALREADY DONE, via the existing generic `_MIN_VERSION_PATTERNS`/
    `_drift_notice` mechanism (`_CMAKE_MIN_RE` is one of 7 platform entries, same mechanism
    TC-652 already extended and measured for a different platform). No separate card needed.

  The other 2 are real, confirmed-live gaps with DIFFERENT root causes - this card closes the
  narrower, more surgical one; the other (multi-install-recipe reconciliation, most visible on
  cpp, already measured by `tests/conformance/test_reference_content.py`'s own "multi-recipe"
  failure class, which fires on real cpp pilots today) is explicitly OUT OF SCOPE here and flagged
  for a separate future card - it needs a TC-680-shaped "disclose, never silently resolve"
  mechanism for a genuinely different code path (`_cpp_build_guidance`'s own recipe generation vs.
  this card's `_python_install_text`), not a extension of this card's fix.

  REPRODUCED directly (supervisor, this session, against real, committed sidecar manifest text):
  `note/python`'s real, committed `infra/demo-manifests/product_reference_note_python.json` manifest
  text contains a genuine, real, user-facing feature extra: `pdf = ["reportlab>=3.6"]` under
  `[project.optional-dependencies]` (PDF export support). `html/python` has `js =
  ["quickjs>=1.19,<2"]`; `pdf/python` has `images`/`woff2`/`text-layout` extras. None of these real,
  meaningful extras are ever mentioned anywhere in `get_product_reference`'s install guidance -
  `_python_install_text` always emits the bare `pip install <name>` (plus an optional upper-bound-
  version caveat), with zero awareness that `PythonManifest` (via `read_python_manifest`,
  `src/foss_mcp/extraction/manifest_reader.py`) does not even parse `extras_require`/
  `[project.optional-dependencies]` at all today - confirmed: `PythonManifest`'s own dataclass has
  only `name`/`version`/`license`/`requires_python` fields. A user asking this tool how to install
  `note/python` is never told that PDF export needs `pip install <name>[pdf]` specifically - the
  exact "[pdf]" extras-syntax gap the plan's own wording names.

  Several pilots' extras are dev/test-only noise (`dev`, `test`, `tests`, `test-pdf` where it is
  itself a TEST dependency grouping, not a real user feature) and must NOT be surfaced - only a
  REAL, user-facing feature extra should ever appear in install guidance. Measure the real 32-pilot
  corpus to decide your own exclusion list (starting point: `dev`, `test`, `tests` - the project's
  own precedent, e.g. `excluded_dirs`, for distinguishing dev/test scaffolding from real content);
  report what you chose and why, the same Decision-F discipline every other card this session used.
