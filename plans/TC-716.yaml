id: TC-716
gate: G3
lane: extraction
purpose: >-
  Closes 3D-JAVA-007 (round-2, `docs/round2/issues.json`, severity P1, category "mcp-content-wrong"
  - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation): `Mesh.isManifold()` in
  `com.aspose.threed.Mesh` always returns `false` regardless of input (a confirmed stub, per this
  pilot's own `agent_guidance`/`AGENTS.md` stub table and a live repro with a closed box, which IS a
  manifold mesh yet still reports `false`), but `get_symbol`/`list_members` present it identically to
  a fully working method, with zero caveat - unlike `License.setLicense` and `Torus.toMesh`, which
  this project's existing mechanism already correctly flags with `"  (not implemented in this build)"`.

  ROOT CAUSE (independently re-verified): this project has TWO separate, independent stub-detection
  mechanisms feeding the same `"stub": true` / `"stub_reason"` fields (`chunk_builder.py`'s
  `_stub_text`, which is what `get_symbol`/`list_members` actually render): (1) `_is_stub_throw`
  (api_surface.py) - a method body that only throws; confirmed this is how `License.setLicense` AND
  `Torus.toMesh` are ALREADY correctly marked today (both have `"stub": true` with no
  `"stub_reason"` key - the throw-path signature, not the doc-path signature). (2)
  `mark_documented_unsupported` (`run_extraction.py:1589`, `DOC_UNSUPPORTED_REASON = "the scope
  documentation lists it as not implemented"`) - reads the pilot's own furnished page
  (`tests/fixtures/furnished/<pilot>/pages/_index.md`) for an explicit claim naming a dotted
  `Type.member` (or a bare member clearly owned by a type named in the same sentence/section) as
  not-implemented, and marks exactly that member. `isManifold()` NEVER THROWS (confirmed: it
  unconditionally returns `false`), so mechanism (1) cannot and does not catch it. Mechanism (2)
  COULD catch it, but `tests/fixtures/furnished/3d_java/pages/_index.md`'s own "Scope and
  Limitations" section currently contains only a vague, unnamed sentence about "a handful of
  primitive-shape classes" having an unimplemented mesh-conversion method (line 487) - it never
  names `Mesh.isManifold()` specifically, so mechanism (2) has nothing to match. This is a
  documentation-completeness gap in the furnished page, not a defect in either detection mechanism.

  REPRODUCE FIRST: confirm this is still real on current `main`. Load the real committed
  `tests/fixtures/3d_java/api_surface.json`, find the `Mesh` type's `isManifold` method entry, and
  confirm it has no `"stub"` key at all (while `Torus`'s `toMesh` entry, in the same file, has
  `"stub": true`, confirming mechanism (1) IS active in this fixture and this is specifically an
  `isManifold` gap, not a whole-mechanism failure). Confirm the real served chunk index
  (`infra/demo-manifests/3d__java__self_extracted/`) agrees (grep it for `"isManifold"` - it is
  present, unflagged). Read `docs/round2/issues.json` id `3D-JAVA-007` in full for the exact repro
  steps and quoted agent_guidance stub-table text.

  REAL WORKING PRECEDENT (study this before writing anything): the SAME mechanism (2) already fires
  correctly for a comparable case in a SIBLING pilot - `tests/fixtures/3d_net/api_surface.json`'s
  `NurbsSurface.ToMesh` has `"stub_reason": "the scope documentation lists it as not implemented"`
  (the doc-path signature), triggered by `tests/fixtures/furnished/3d_net/pages/_index.md`'s own
  line (search for "NurbsSurface.ToMesh" in that file): "`NurbsCurve.Evaluate`/`EvaluateAt` and
  `NurbsSurface.ToMesh` throw `NotImplementedException` —". This is your real, proven template for
  the dotted-`Type.member`-plus-cue-phrase shape the claims parser
  (`run_extraction.documented_unsupported_claims`) actually recognizes. **Important difference**:
  `isManifold()` does NOT throw (confirmed by the round-2 repro and by `Mesh.isManifold()`'s own
  real source body, which only returns a hardcoded `false`) - do NOT write a sentence claiming it
  throws `NotImplementedException` (that would be a new false claim, exactly the kind of error this
  card exists to prevent). Use one of this same file's own "is not yet implemented" / "is not
  implemented" cue phrases instead (e.g. lines 134, 442, 487-488 of
  `tests/fixtures/furnished/3d_java/pages/_index.md` show the established local convention), paired
  with the real observed behavior ("always returns `false`"), in a dotted `Mesh.isManifold()` form.

  FIX (four real steps, matching the exact precedent `TC-659`'s commit `bb31d2fc` already used for
  `CELLS-CPP-010` - read that commit's message and diff in full first, it is your direct template for
  steps 2-3 below):
  1. Add ONE new, factually accurate sentence to `tests/fixtures/furnished/3d_java/pages/_index.md`'s
     "Scope and Limitations" section (near the existing line 487 primitive-mesh-conversion bullet,
     or its own new bullet) naming `Mesh.isManifold()` explicitly as not implemented, stating the
     real observed behavior (always returns `false`, confirmed live against a real closed box which
     IS genuinely manifold). Before touching anything else, call
     `run_extraction.documented_unsupported_claims("tests/fixtures/furnished/3d_java/pages/_index.md")`
     directly (a quick throwaway script, pure Python, no toolchain needed) and confirm your new
     sentence produces a claim naming `Mesh`/`isManifold` - do not proceed until this is confirmed;
     if your first phrasing is not detected, adjust it to more closely match the real working
     `NurbsSurface.ToMesh` precedent's cue-phrase shape, never bypass the parser by hand-editing the
     fixture's `"stub"` field directly.
  2. Call `run_extraction.mark_documented_unsupported` against the real committed
     `tests/fixtures/3d_java/api_surface.json`'s `types` list with the updated furnished page, and
     confirm it marks exactly `Mesh.isManifold` (and nothing else newly marked) - diff the fixture
     before/after and confirm the ONLY change is `isManifold` gaining `"stub": true` plus a
     `"stub_reason"` of exactly `"the scope documentation lists it as not implemented"`.
  3. Re-ingest `infra/demo-manifests/3d__java__self_extracted/` for real (never hand-edit the baked
     generation JSON): run the real `infra/build_chunks.py` doc/symbol chunk builder against the
     corrected fixture and furnished page (no Java toolchain is needed for this step - confirmed by
     `TC-659`'s own precedent for an analogous C++ case; the existing example chunks, if any, are
     carried forward unchanged since their content is untouched by this fix), then publish through
     the real `infra/ingest.py` + `scripts/release/compact_demo_manifests.py` pipeline exactly as
     `TC-659`'s commit did for `cells/cpp`. Diff the new generation file against the old one and
     confirm the ONLY real content change is `isManifold`'s member line gaining the
     `"  (not implemented in this build: the scope documentation lists it as not implemented)"`
     suffix - report any other difference you find rather than assuming it is benign.
  4. Add end-to-end tests to `tests/mcp/tools/test_round3_unsupported_markers.py` proving
     `get_symbol(fqn="com.aspose.threed.Mesh.isManifold")` and
     `list_members(fqn="com.aspose.threed.Mesh")` now render the stub suffix for `isManifold`. That
     file already has the exact real-data template to follow:
     `test_real_data_get_symbol_and_list_members_agree_on_3d_net_scene_render` and
     `test_real_data_a_type_the_scope_page_names_is_flagged_for_every_tool` (both for `3d/net`'s own
     `Scene.Render` - real corpus, real registry, not a synthetic in-memory fixture, the discipline
     this session's own `TC-702` investigation found missing elsewhere). Write the `3d/java`
     equivalent against the real post-fix corpus.
