source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-07 — PDF-NET-001 investigated: genuine upstream source drift between the finding's own verification version and the pinned indexed commit, not an extractor defect (supervisor)
    sha256: 2f21ad8ac39a222ac9bc5d79261c2b241e107d40d3710f1a82dd912bd069f406
inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `3D-JAVA-007` in full. Then git commit `bb31d2fc` in
    full (`git show bb31d2fc`) - this is your exact template for steps 2-3 of the fix (re-ingesting
    one pilot's baked generation from a corrected fixture, without a toolchain). Then
    `run_extraction.py`'s `mark_documented_unsupported`/`documented_unsupported_claims`/`_mark`
    functions (around lines 1460-1630) in full, and the real working precedent in
    `tests/fixtures/furnished/3d_net/pages/_index.md` (search "NurbsSurface.ToMesh") plus its
    resulting fixture entry in `tests/fixtures/3d_net/api_surface.json`.
  - >-
    REPRODUCE FIRST (do not skip): confirm the real current gap in the committed fixture and served
    chunk index exactly as described above, and confirm your new furnished-page sentence is actually
    detected by `documented_unsupported_claims` BEFORE marking anything. Report both real
    observations, verbatim, in your closeout.
  - >-
    Never claim `isManifold()` throws an exception - it does not, and that would be a new false
    claim. Never hand-edit the baked generation JSON directly; it must be the real output of
    `build_chunks.py` + `infra/ingest.py` + `compact_demo_manifests.py` run against the corrected
    fixture and furnished page, matching `TC-659`'s own precedent. Confirm no other member or pilot
    is affected by your furnished-page edit.
actions:
  - >-
    Add the missing furnished-page disclosure for `Mesh.isManifold()`, let the existing
    `mark_documented_unsupported` mechanism mark it as a stub, re-ingest 3d/java's baked generation
    for real, and add end-to-end test coverage proving `get_symbol`/`list_members` now disclose it.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_round3_unsupported_markers.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-012
  - command: '{python} -m pytest tests/extraction/test_round3_stub_detection.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 12
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; q = chr(34); p = pathlib.Path('tests/fixtures/3d_java/api_surface.json'); s = p.read_text(encoding='utf-8'); anchor = q + 'name' + q + ': ' + q + 'isManifold' + q; i = s.find(anchor); assert i >= 0, 'the expected isManifold name literal was not found - if your real fixture renders the name entry differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; window_end = i + 400; window = s[i:window_end]; needle = q + 'stub' + q + ': true'; j = window.find(needle); assert j >= 0, 'no stub: true literal was found within 400 chars after the isManifold name - the real fix may place it further away or the mutate window is too small; adjust this mutate and note the substitution in your closeout'; abs_j = i + j; s2 = s[:abs_j] + q + 'stub' + q + ': false' + s[abs_j + len(needle):]; assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Flips the real `isManifold` fixture entry's `"stub": true` back to `"stub": false` (a plain
    substring replace, no regex, immune to the earlier backslash-in-mutate issue this session
    already hit once), which must make the new end-to-end `get_symbol`/`list_members` disclosure
    test fail (the stub suffix no longer renders) - a pure data mutation, immune to the
    lockstep-rename vacuousness class this session's earlier reviews found, and it never touches
    `mark_documented_unsupported` or any other code path. If the real fixture's formatting puts the
    `stub` field further than 400 characters after the `name` field, the worker must widen the
    window or re-anchor and note the substitution in their closeout.
evidence:
  - evidence/build/G3/TC-716/receipt.json
closeout:
  - >-
    `Mesh.isManifold()` is now disclosed as a stub (`"  (not implemented in this build: ...)"`) by
    `get_symbol`/`list_members` for `3d/java`, closing 3D-JAVA-007 via the existing, already-proven
    `mark_documented_unsupported` mechanism (same mechanism already correctly flagging
    `License.setLicense`/`Torus.toMesh`), with the real baked generation re-ingested from the
    corrected furnished page - not a hand patch.
recovery: Re-run from a clean tree.
