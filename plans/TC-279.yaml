closeout:
- 'search_symbols correctly matches a query naming a real method or property, not just a class, by recognizing
  the member inside its containing chunk''s own already-rendered Methods:/Properties: blocks - a query naming a
  symbol that genuinely exists no longer returns a confusing, wrong Miss merely because it named a method
  instead of a class, while a query naming nothing real still Misses honestly.'
