id: TC-847
gate: G3
lane: extraction
purpose: >-
  Found by the TC-841 worker (2026-11-14): the regenerated tex/python extraction fixture carries
  38 FALSE `stub: true` members ('empty body (pass)'). Upstream
  `src/aspose_tex/presentation/__init__.py` (and `font_manager.py`) do not parse because of broken
  indentation; the extractor's syntax repair (`repaired-syntax` entries in the fixture) closes
  header lines with `pass`, and the stub detector (python_surface.py `stub_reason`) then reads
  REAL implemented methods as empty `pass` bodies - e.g. `DviDevice.finalize`, `get_bytes`,
  `OutputDevice.destination` and 14 `FontManager` methods, which the worker verified have real
  bodies at the pinned commit. Baking that fixture would serve a false 'not implemented in this
  build: empty body (pass)' disclosure for tex/python (the 'no pilot ever gets worse' honesty
  class; TC-844 fixed the analogous slides/python false positives). FIX: a `pass` (or any
  statement) that the syntax REPAIR inserted must never count as the author's empty body: make the
  repair path record which function bodies it synthesised (or run `stub_reason` against the
  ORIGINAL source slice for repaired functions, or skip stub classification for any function whose
  body lies in a repaired span) so a method whose body was synthesised by repair gets NO stub flag
  - while a genuinely written `pass`/`...`/`raise NotImplementedError` in a repaired file is still
  flagged when detectable from the original text. Choose the narrowest correct mechanism after
  reading how repair works (grep `repaired-syntax`, `_repair` in
  src/foss_mcp/extraction/run_extraction.py and python_surface.py). Then regenerate ONLY the
  tex_python fixture: `python -X utf8 -m foss_mcp.extraction.run_extraction
  config/products/tex/python.yaml tests/fixtures/tex_python/api_surface.json --commit <pin from
  infra/helm/foss-mcp/values.yaml> --keep-names-from
  tests/fixtures/furnished/tex_python/pages/_index.md --max-types 100000` (clone at the pin
  outside the repo; GITHUB_TOKEN env var available, never print it), assert source_commit == pin,
  kept == total, LF line endings, and report the stub-flag count before/after (expected: the 38
  false flags gone; list any that remain with the reason). Re-pin tests that counted the old tex
  fixture's stub flags/coverage (tests/extraction/test_tex_python_extraction.py,
  test_round3_python_fidelity.py ... only what actually fails; report anything outside
  write_paths).
