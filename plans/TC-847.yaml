      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: how the syntax repair works (grep `repaired-syntax` / `repair` in
    src/foss_mcp/extraction/), python_surface.py `stub_reason` and its callers,
    tests/extraction/test_tex_python_extraction.py, tests/extraction/test_round3_stub_detection.py,
    TC-844's test tests/extraction/test_python_stub_interface_and_inheritance.py (pattern), and the
    TC-841 worker's scratch in the session scratchpad (tc841_regen.py, tc841_out/).
  - >-
    REPRODUCE FIRST: extract tex/python at its pin in-process and list the 38 stub flags with their
    reasons; confirm by reading the pinned source that e.g. `DviDevice.finalize` has a real body.
  - >-
    NEW TEST tests/extraction/test_python_repaired_stub_false_positive.py with a hand-authored
    micro-library: a module with broken indentation that the repair fixes, containing methods with
    real bodies (must NOT be stubs) and a genuine `pass` method on an unbroken region (stub) and a
    genuine `raise NotImplementedError` (stub); plus an assertion over the regenerated tex fixture
    that no member has `stub: true` with reason 'empty body (pass)' unless the original upstream
    text at that member is really `pass`/`...` (list the survivors in your report).
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies the src and fixture
    diff). ruff format + ruff check; run the card's check command twice; report real counts. Do NOT
    use git stash. Never skip a test. Never use PowerShell Set-Content to write repo files. If a
    test outside write_paths fails, stop and report exact ids.
actions:
  - >-
    Stop syntax-repair-synthesised `pass` bodies from being flagged as 'not implemented' stubs and
    regenerate the tex/python fixture.
checks:
  - command: '{python} -m pytest tests/extraction tests/deploy/test_served_coverage_matches_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 3000
    junitxml: true
    proves:
      - REQ-G3-012
min_tests: 1000
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/extraction/tree_sitter_engine/python_surface.py', 'src/foss_mcp/extraction/run_extraction.py', 'tests/fixtures/tex_python/api_surface.json']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-847/receipt.json
closeout:
  - >-
    tex/python's fixture no longer carries false 'empty body (pass)' stubs from syntax repair.
recovery: Re-run from a clean tree.
