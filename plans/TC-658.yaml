id: TC-658
gate: G3
lane: storage-retrieval
purpose: >-
  Closes the round-3 audit's own #1 recommended fix (`docs/round3/HANDOFF3.md`, section "#1
  finding") - the single highest-leverage item it found across the whole 32-pilot portfolio.
  Read that section in full first, and the ~20 real `mcp-content-missing`-category issues in
  `docs/round3/issues.json` it is describing, before starting - do not take this card's own
  summary on faith.

  The disclosure program's (KD1-KD10) WIRING is correct - independently re-verified by this
  supervisor before authoring this card: `get_symbol.py`, `search_symbols.py`,
  `get_product_reference.py`, `report_index_freshness.py`, and `list_members.py` (via
  composition through `get_symbol.py`) all correctly surface a `known_defects` entry when its
  `subject.ref` matches a real query. The real, confirmed gap: `subject.ref` is a single string
  today, so an entry can only ever name ONE symbol, even when the same real upstream bug (as
  described in the entry's OWN `summary`/`user_action` prose, already committed) affects several
  real sibling symbols in the identical causal chain. Confirmed concrete example: pdf/java's
  `PDF-JAVA-001` entry's own `user_action` text already says "...use TextStamp on a reopened
  Document instead" - `TextStamp` is a real, separate, directly-queryable type in
  `tests/fixtures/pdf_java/api_surface.json`, confirmed by this supervisor, but nothing surfaces
  this disclosure when a caller queries `TextStamp` directly, only `WatermarkArtifact`.

  Fix: change `subject.ref` (a single string) to `subject.refs` (a non-empty array of strings,
  the exact same type `applies_to.package_versions` already uses for the identical "one or
  several" semantic - reuse that field's own JSON Schema shape as your template, confirm it in
  `schemas/product/known_defects.schema.json` yourself first) everywhere: the schema, the
  `Subject` dataclass in `src/foss_mcp/indexing/known_defects.py`, and the TWO real exact-match
  call sites that currently do `if defect.subject.ref != fqn` (`get_symbol.py` line ~176,
  `search_symbols.py` line ~656 - confirm the real current line numbers yourself) - change both
  to admit when `fqn` is a member of `defect.subject.refs` (membership, not equality).
  `get_product_reference.py`'s one render line (around line 699, `f"Known defect
  ({defect.subject.ref}): ..."` - confirm the real current text yourself) never matches by ref
  at all (it surfaces every package/commit-scoped defect for the pilot unconditionally); update
  it to render every name in `refs` (e.g. joined with ", ") rather than a single value, so the
  rendered text stays accurate once `refs` has more than one entry. Do NOT touch
  `report_index_freshness.py` in this card - confirmed it never filters by ref at all, and a
  different card (`TC-657`) is already in flight touching that exact file; a write-path
  collision with an in-flight card is not acceptable.

  Migrate all 23 real, already-committed `config/known_defects/*.yaml` files mechanically:
  every existing `ref: <value>` line becomes `refs: [<value>]` (or the equivalent multi-line
  array form if you judge it more readable - your call, consistently applied) - a lossless,
  purely syntactic change, NOT a content judgment call. Do not add any NEW sibling symbol to any
  entry's `refs` in this card - that is deliberately separate, larger, future content-authoring
  work (research each pilot's real siblings), explicitly out of this card's scope. This card
  proves the MECHANISM works for a list of one; populating richer lists with real sibling
  symbols is the next card after this one, not this one.
