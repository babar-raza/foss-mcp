source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST, in full: `docs/round3/HANDOFF3.md`'s "#1 finding" section. Then
    `schemas/product/known_defects.schema.json`'s current `subject`/`applies_to` definitions
    (confirm `package_versions` really is an array, your template). Then
    `src/foss_mcp/indexing/known_defects.py`'s `Subject`/`KnownDefect` dataclasses and loader in
    full. Then the two real exact-match call sites in `get_symbol.py` and `search_symbols.py`,
    and `get_product_reference.py`'s one render line. Then at least 3 real
    `config/known_defects/*.yaml` files to confirm the real current `ref:` shape before writing
    your migration.
  - >-
    Write a small, standalone migration (a short Python script run once, or hand-edit each of
    the 23 files directly - your judgment, but every file's real content must end up
    byte-equivalent in meaning to its pre-migration form, `ref: X` becoming `refs: [X]`, nothing
    else changed) and confirm every file still validates against the updated schema and every
    existing completeness/data test in `tests/indexing/test_known_defects_data_*.py` and
    `tests/indexing/test_known_defects_completeness.py` still passes after the rename (update
    those test files' own `Subject`/`.ref` references to `.refs`/`refs=(...)` wherever they
    construct or assert one directly - this is a mechanical rename in test code, not a logic
    change).
  - >-
    Write at least 10 tests in `tests/mcp/tools/test_known_defects_multi_ref.py`: a synthetic
    `KnownDefect` with 2+ `refs` is found by `get_symbol`/`known_defect_lines` under EITHER real
    name, not just the first; the same for `search_symbols`; a single-ref entry (migrated from
    the old shape) behaves identically to before the migration (no regression for every existing
    entry - this is the single most important test in this file, run it against at least 3 real,
    already-committed pilots' real entries); `get_product_reference`'s rendered text for a
    multi-ref entry names every ref, not just one; the schema rejects an empty `refs` array; the
    schema rejects the OLD `ref:` key name now that it has been fully migrated (confirm this is
    the real intended behavior - a schema that still silently accepts the old key alongside the
    new one would hide a future authoring mistake, so `additionalProperties: false` on `subject`
    should already make this impossible, verify it directly rather than assuming).
actions:
  - >-
    Change known_defects' subject.ref from a single string to a non-empty array (refs), fixing
    the round-3 audit's #1 recommended, highest-leverage finding across the whole portfolio -
    proves the mechanism for a list of one; a later card populates real sibling symbols.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_known_defects_multi_ref.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-015
  - command: '{python} -m pytest tests/indexing/test_known_defects.py tests/indexing/test_known_defects_data_3d.py tests/indexing/test_known_defects_data_cells.py tests/indexing/test_known_defects_data_pdf_slides.py tests/indexing/test_known_defects_data_remaining.py tests/indexing/test_known_defects_completeness.py tests/mcp/tools/test_known_defects_in_get_symbol.py tests/mcp/tools/test_known_defects_in_search_symbols.py tests/mcp/tools/test_known_defects_in_product_reference.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-015
min_tests: 10
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/get_symbol.py'); s = p.read_text(encoding='utf-8'); marker = 'defect.subject.refs'; assert marker in s, 'defect.subject.refs not found in get_symbol.py as expected - if your real code differs, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(marker, 'defect.subject.ref', 1); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Reverts get_symbol.py's one real matching call site back to the old single-value attribute
    name, which no longer exists on the migrated Subject dataclass - a real AttributeError at
    the first known-defect-bearing query. Every test proving multi-ref matching (or even
    single-ref matching after the rename) works through get_symbol must fail under this
    mutation; tests scoped only to search_symbols/get_product_reference's own call sites are
    unaffected (if your real fix touches those differently, verify this mutation still reaches a
    real behavioral break for at least the get_symbol path, and say so in your closeout).
evidence:
  - evidence/build/G3/TC-658/receipt.json
closeout:
  - >-
    known_defects' subject can now name every real sibling symbol a disclosed bug affects, not
    only the one its original finding happened to cite - the mechanism fix for the round-3
    audit's #1 recommendation. All 23 existing entries migrated losslessly; a future card adds
    the real sibling names the audit already identified.
recovery: Re-run from a clean tree.
