id: TC-201
gate: G2
lane: transport-deployment
purpose: 'Make the ingestion Job write each product''s packaging-manifest sidecar into the shared manifests volume, so
  that TC-200''s serving side has something to read. Today nothing in the ingestion Job reads a manifest:
  fetch_product_reference.py exists and writes the sidecar, but no Job runs it. This card adds that step to the
  ingestion Job for each pilot that names a manifest path in values.yaml, and gives each pilot that path. A pilot
  without a manifest path gets no step and serves NotAvailable with its reason, which is explicit rather than silent.'
depends_on:
- TC-200
- TC-195
write_paths:
- infra/helm/foss-mcp/templates/ingestion-job.yaml
- infra/helm/foss-mcp/values.yaml
- tests/infra/test_helm_manifest_step.py
- Dockerfile.serving
- Dockerfile.ingestion
- infra/fetch_product_reference.py
- infra/serve_http.py
- tests/infra/test_serve_manifest_sidecar.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read infra/helm/foss-mcp/templates/ingestion-job.yaml in full, and the way each pilot''s command is built. Read
  infra/fetch_product_reference.py for its command-line arguments and the file it writes. Read the ingestion.pilots
  entries in infra/helm/foss-mcp/values.yaml.'
- 'For each pilot in ingestion.pilots that has a manifestPath key, add a second step to that Job, after the existing
  build and ingest steps, that runs fetch_product_reference.py with the pilot''s repository, commit and manifestPath,
  and writes its sidecar to the manifests volume. The Job already mounts that volume read-write. The step must not run
  for a pilot without manifestPath.'
- 'Give the six POC pilots their manifestPath values from the repository''s own manifest file at the pinned commit, as
  listed in tests/fixtures/repo_native. If a pilot has no such file in the fixtures, leave manifestPath out and say so in
  your report. Do not invent a path.'
- 'Add tests/infra/test_helm_manifest_step.py as a new file, offline. It renders the chart with helm template, using
  image.tag set, and checks: (1) a pilot with manifestPath gets the fetch step in its Job, on the read-write claim; (2) a
  pilot without manifestPath gets no fetch step; (3) the serving Deployment mounts the manifests claim read-only.
  It must fail, not skip, when helm is missing. Source scripts/toolchain/activate.ps1 in the same command as pytest.'
- 'Two gaps that TC-200 left, found by its worker and recorded here by the supervisor. (1) serve_http.py now imports
  fetch_product_reference at module top, but Dockerfile.serving copies only serve_stdio.py and serve_http.py, so the serving image
  would fail to start with ModuleNotFoundError. Add the COPY line for infra/fetch_product_reference.py to Dockerfile.serving, the
  same way the other infra files are copied. Do not change anything else in that Dockerfile. (2) The ingestion step must write
  its sidecar to the manifests volume under the exact name PRODUCT_REFERENCE_SIDECAR_NAME, which TC-200 defined in
  infra/fetch_product_reference.py (the value is "product_reference.json"). Pass that name to the fetch command, or read the
  constant, so the serving side and the ingestion side agree. Add an offline test that asserts the Job passes the same
  file name the serving code reads.'
- 'Rework, attempt 2, by the supervisor after the attempt-1 review. The attempt-1 commit shares one file name across all
  pilots. That is a defect: each run overwrites the last, and serving can answer with another product''s manifest. Fix it
  with these numbered changes, in order.
  R1. Dockerfile.ingestion does not COPY infra/fetch_product_reference.py, so every ingestion Job fails its new step. Add the COPY
      line the same way the other infra files are copied. Change nothing else in that Dockerfile.
  R2. Replace the single PRODUCT_REFERENCE_SIDECAR_NAME with one function, sidecar_name(family, platform), in
      infra/fetch_product_reference.py. It returns product_reference_<family>_<platform>.json. Ingestion (the Job step) and serving
      (infra/serve_http.py) both call that function, so they cannot disagree.
  R3. Serving reads only the file for its own identity, from the FAMILY and PLATFORM environment variables the chart already sets.
      It must not fall back to another file, and it must not replace the platform with a different value. If the identity is unset,
      it fails at start, rather than defaulting.
  R4. Ingestion writes only its own pilot''s file, named by R2, so the six pilots never collide on the shared claim.
  R5. Tests: (a) two pilots'' sidecar names differ; (b) serving with the pdf/java identity never reads the pdf/net file; (c) the Job
      step writes the name that sidecar_name returns for its pilot; (d) Dockerfile.ingestion copies infra/fetch_product_reference.py.
  Replace the earlier single-name test with these. Keep every existing chart test and assertion.'
- 'Contract restatement, by the supervisor after the attempt-2 block. The five tests in tests/infra/test_serve_manifest_sidecar.py
  (TC-200) encode the single-name contract that R2 and R3 retire: they use the removed constant, and they call the serving
  signature with only FOSS_MCP_PLATFORM set. Restate those five, and only those five, to the identity contract: the sidecar is
  sidecar_name(family, platform), and serving takes the FAMILY and PLATFORM it is started with. Keep each test name and its
  intended check: exact TargetFramework answer for a present sidecar; NotAvailable with its reason and no exception when there
  is no sidecar; the TypeScript sidecar reaches the engines.node branch; the input schema exposes only section; and a present
  sidecar with the identity unset fails at start. Record the five restatements in the commit body.'
- 'Commit your rework first, as one commit, and only then rebase it onto main, so the rebase runs on a clean tree. Do not stash.
  Your commit must descend from this card''s issue revision after the rebase.'
- 'Keep every existing chart test and assertion.'
actions:
- Read the template, the values entries, and the fetch command in full.
- Add the step, the values keys, and the test file.
- Run the chart and manifest tests, and report the exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_manifest_step.py tests/infra/test_helm_chart.py tests/infra/test_helm_pilots_match_compose.py -q'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 25
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/templates/ingestion-job.yaml');s=p.read_text(encoding='utf-8');p.write_text(s.replace('fetch_product_reference.py','fetch_product_reference_off.py',1),encoding='utf-8')"
  rationale: 'Renames the fetch command in the ingestion Job template, so the step would call a missing script. The
    manifest step test looks for the real command in the rendered Job and must then fail. The replace is limited to the
    first match, which is the one in the template. Built with plain text, since it has no quote or backslash.'
evidence:
- evidence/build/G2/TC-201/receipt.json
closeout:
- Each pilot with a manifest path writes its sidecar during ingestion, and its serving pod reads it.
- A pilot without one serves an explicit NotAvailable.
recovery: Re-run from a clean tree.
