  which the 'csharp' entry three lines below already has.
- Read tests/extraction/tree_sitter_engine/test_api_surface_csharp.py for this project's
  existing test conventions for a record_declaration regression (if it has one) -
  mirror that structure for the new Java test file.
- 'Required, exact fix: add the single string ''record_declaration'' to _CLASS_TYPES[''java'']''s
  set literal. Do not touch any other language''s entry, do not touch consolidate_classes
  or any other function in this file or api_surface.py - this is a single-set-literal
  addition, nothing else.'
- 'Two required, real proofs - not just a synthetic unit test: (1) A new unit test
  file, tests/extraction/tree_sitter_engine/test_api_surface_java.py, parsing a small,
  hand-written Java snippet containing a `public record Point(int x, int y) { public
  int sum() { return x + y; } }`-shaped record with at least one explicit method,
  and asserting: the record itself appears as its own top-level entry (not missing,
  not misattributed), its method (`sum`) is scoped as that record''s own member (not
  a stray top-level function), and ordinary Java classes/interfaces/enums are completely
  unaffected (run a case exercising those three as they exist today and assert identical
  behavior to before this change). (2) A REAL end-to-end regression against real slides/java
  data: clone aspose-slides-foss/Aspose.Slides-FOSS-for-Java at a pinned commit (confirm
  the current HEAD of its default branch ''main'' via a fresh `gh api repos/aspose-slides-foss/Aspose.Slides-FOSS-for-Java`
  read, or reuse the commit 620a2614418854b4a18966a361e6907ddc88c7cb TC-167''s worker
  already observed if it is still the real HEAD) and run this project''s real extraction
  pipeline; assert that `Relationship` and `FontData` now appear as their own entries
  (not absent, not kind=''function''), and that no stray top-level kind=''function''
  entries remain for their known method names (e.g. a constructor-shaped or `getFontName`-named
  stray entry). This test needs network access to clone the real repository - follow
  this project''s own established pattern for marking that (see tests/indexing/test_example_verifier.py
  or TC-092''s own test for the convention).'
- Run the FULL existing tests/extraction/ test suite (every language, every already-onboarded
  pilot's fixture-based test) and confirm nothing regresses - if any existing accepted
  fixture's own test now behaves differently, investigate and report honestly rather
  than assume it's fine.
