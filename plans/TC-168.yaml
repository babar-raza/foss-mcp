id: TC-168
gate: G2
lane: extraction
purpose: 'Fix a real, general defect in _CLASS_TYPES[''java''] (src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py:70):
  it omits ''record_declaration'', unlike the sibling ''csharp'' entry three lines
  below which already includes it. Confirmed today (TC-167''s own worker, onboarding
  slides/java beyond the original 7 pilots) against the real, live aspose-slides-foss/Aspose.Slides-FOSS-for-Java
  repository: two real Java record declarations - internal/opc/Relationship.java''s
  `Relationship` and FontData.java''s `FontData` - are completely invisible as their
  own types (never appear as a class/record-kind entry), and their constructor/methods
  leak out as spurious top-level kind=''function'' entries instead of being correctly
  scoped as that record''s own members. This is the same general class of bug already
  fixed for C++''s consolidate_classes (TC-092) and for C#''s own _CLASS_TYPES entry
  (already correct) - an unscoped collect_nodes() search finding no class_types ancestor
  and silently falling through to ''this must be a free function''. This fix, not
  a product swap or a narrower fixture cap, is the actual prerequisite for onboarding
  any Java pilot or product that uses Java 16+ records (slides/java specifically,
  and any future Java onboarding card).'
