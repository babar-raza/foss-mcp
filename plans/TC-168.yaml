id: TC-168
gate: G2
lane: extraction
purpose: 'Fix a real, general defect in _CLASS_TYPES[''java''] (src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py):
  it omits ''record_declaration'', unlike the sibling ''csharp'' entry, which already
  includes it. Against the real aspose-slides-foss/Aspose.Slides-FOSS-for-Java repository
  (TC-167''s worker, commit 620a2614418854b4a18966a361e6907ddc88c7cb), two Java record
  declarations - `Relationship` and `FontData` - were invisible as their own types, and
  their methods leaked out as spurious top-level kind=''function'' entries. This is the
  same class of bug fixed for C++ (TC-092) and already correct for C#. This card is
  the corrected attempt 2. Attempt 1 (worker commit 2c3b898 on branch worker/TC-168) was
  rejected for card defects, not worker defects: its checks ran all of tests/extraction/
  offline, which pulls in network-only pinned-commit fixtures, and its negative-control
  mutate used backslash-escaped quotes that do not survive the shell. The verified code
  change from attempt 1 is reusable. The real-repository regression is moved out of the
  offline check path.'
depends_on:
- TC-010b
- TC-051
- TC-058
- TC-059
write_paths:
- src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py
- tests/extraction/tree_sitter_engine/test_api_surface_java.py
- tests/extraction/tree_sitter_engine/test_api_surface_java_live.py
satisfies:
- REQ-G2-047
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '## 22. Verification obligations mapped to gates (extends §10''s and §18''s
    acceptance tests with the items §8 of the Round-6 review specifically required)'
  sha256: b417ef557a656b43c9fec9afeb5cbb1d856e9db8f3056ec331c464c5e0ab0d23
inputs:
- 'Step 1 (reuse, do not redo): run `git cherry-pick 2c3b89824836479344217eaf88ed74fc91ea536c`.
  That commit is the attempt-1 code change. It modifies only tree_helpers.py (adds
  ''record_declaration'' to _CLASS_TYPES[''java''] and nothing else) and adds
  tests/extraction/tree_sitter_engine/test_api_surface_java.py. Confirm from its diff that
  it touches nothing outside your write_paths. If the cherry-pick conflicts or the diff
  differs from this description, stop and report.'
- 'Step 2 (required, offline): tests/extraction/tree_sitter_engine/test_api_surface_java.py
  must contain the synthetic tests only: the record is its own top-level entry, its method
  is scoped to the record, and ordinary Java class/interface/enum behavior is unchanged.
  It must have no skip markers.'
- 'Step 3 (required): move the real-repository regression `test_java_record_live_regression`
  (and any helper only it uses) out of test_api_surface_java.py into the new file
  tests/extraction/tree_sitter_engine/test_api_surface_java_live.py. Keep its
  skip-unless-FOSS_MCP_NETWORK_TESTS=1 marker there. Do not weaken, delete or rewrite its
  assertions.'
- 'Step 4 (required): run the live test once with FOSS_MCP_NETWORK_TESTS=1 on the pinned
  commit 620a2614418854b4a18966a361e6907ddc88c7cb and report its exact result. The
  supervisor does not count it toward the gate; the gate evidence is the offline check.'
actions:
- Run the Step 1 cherry-pick and read its diff.
- Perform Steps 2 and 3 as described.
- Run the Step 4 live test and record its result in your report.
- Commit the moved and updated test files together with any required change (explicit paths only).
checks:
- command: '{python} -m pytest tests/extraction/tree_sitter_engine/test_api_surface_java.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-047
min_tests: 3
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;q=chr(34);p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py');s=p.read_text(encoding='utf-8');p.write_text(s.replace(q+'record_declaration'+q,q+'record_declaration_DISABLED'+q,1),encoding='utf-8')"
  rationale: 'Renames the FIRST occurrence of ''record_declaration'' in tree_helpers.py, which is the
    java entry (the csharp entry sits below it). This reverts the fix to the pre-fix state, and the
    synthetic record-scoping test must then fail. Built with chr() so no backslash reaches the shell.'
evidence:
- evidence/build/G2/TC-168/receipt.json
closeout:
- _CLASS_TYPES['java'] includes 'record_declaration', matching the sibling 'csharp' entry.
- The offline synthetic tests prove Java records are scoped correctly and ordinary Java types are unchanged.
- The real-repository regression lives in its own file, runs when opted in, and is not part of the offline gate.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
