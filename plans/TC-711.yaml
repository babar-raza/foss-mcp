source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-06 — PDF-NET-002/EML-NET-002 investigated: a correct fix exists but is structurally inert against TC-543's own invariant; declined, not integrated (supervisor)
    sha256: ce92e388e50e1f33bb6ea845e51aed931be8deec21d65b768acbc296916e1e9a
inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `WORDS-NET-001` in full. Then `TC-706`'s and `TC-707`'s
    own final committed diffs (both already integrated when you start, since both are this card's
    dependencies) - reuse their exact widening pattern for the completeness lock and their exact
    known_defects entry shape rather than inventing a new one. Then `config/known_defects/words__python.yaml`'s
    existing entries, as the template for a brand-new `words__net.yaml` file's own top-level shape
    (`schema_version`, `pilot: words_net`, `defects: [...]`).
  - >-
    REPRODUCE FIRST (do not skip): the real reflection/byte-search steps against the real pinned
    package, exactly as described above. Report the real version you confirmed, and the real
    verification output (reflection member list and/or grep byte counts), verbatim, in your
    closeout - do not paraphrase from round-2's own text without re-confirming.
  - >-
    Re-derive the full `subject.refs` list yourself from the real current
    `tests/fixtures/words_net/api_surface.json` fixture (and cross-check against the real committed
    `infra/demo-manifests/words__net__self_extracted/` manifest) rather than trusting this card's
    own 42-name list unchanged - report any difference you find and why.
  - >-
    Never weaken the completeness lock's actual guarantee. The widening is additive and explicit,
    building on `TC-706`'s already-widened mechanism.
actions:
  - >-
    Add the new `words/net` known_defects entry for the real phantom `GetAncestorOf` method;
    extend the already-existing completeness-lock allowlist with `WORDS-NET-001`; add end-to-end
    coverage proving `get_symbol` now discloses this for at least one real affected class.
checks:
  - command: '{python} -m pytest tests/indexing/test_known_defects_completeness.py tests/mcp/tools/test_known_defects_in_get_symbol.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-015
min_tests: 7
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/known_defects/words__net.yaml'); s = p.read_text(encoding='utf-8'); old = 'Aspose.Words.Body'; assert s.count(old) == 1, 'the expected literal was not found exactly once - if your real fix lists Aspose.Words.Body in a different exact form, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; p.write_text(s.replace(old, 'Aspose.Words.Body.NOTREAL', 1), encoding='utf-8')"
  rationale: >-
    Corrupts one real ref (`Aspose.Words.Body`) in the new entry so it no longer matches the real
    FQN `get_symbol` resolves for that class, which must make the new end-to-end `get_symbol`
    disclosure test fail (the disclosure silently stops surfacing for that class) - a pure data
    mutation, immune to the lockstep-rename vacuousness class this session's earlier reviews found.
evidence:
  - evidence/build/G3/TC-711/receipt.json
closeout:
  - WORDS-NET-001's phantom GetAncestorOf method is disclosed via the existing known_defects mechanism.
  - The completeness-lock allowlist (from TC-706/TC-707) is extended, never duplicated; exact-equality holds.
recovery: Re-run from a clean tree.
