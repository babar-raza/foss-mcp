source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top
      priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST: `src/foss_mcp/mcp/tools/lookup.py`'s `lookup()` function in full, including
    `_looks_like_a_task_question`, `_compose_from_docs`, `_answer_naming_a_type`, `_lookup_miss`,
    and the real dispatch order at the end of the function (confirm the real current line numbers
    - they may have shifted). Confirm with your own eyes, by actually calling `lookup` and
    `search_symbols` against the real committed `words/net` pilot data (same
    `GenerationManifestStore`/`infra/demo-manifests` pattern used throughout this session), that
    `lookup(..., "StyleIdentifier.Normal")` returns a `TaskAnswer` with empty `symbols` while
    `search_symbols(..., "StyleIdentifier.Normal")` returns a real `Miss` naming
    `Aspose.Words.StyleIdentifier` as a suggestion, BEFORE changing anything.
  - >-
    Read `src/foss_mcp/mcp/server.py`'s `TOOL_DESCRIPTIONS` dict in full, specifically the
    `"get_symbol"` and `"search_symbols"` entries, and confirm no sentence explaining the
    `Qualified:` chunk-metadata line exists in either today.
  - >-
    Implement the lookup fix as described in the card's own purpose text. Write real,
    deterministic unit tests in the new file proving: (a) the real `StyleIdentifier.Normal` case
    against the real words/net data now surfaces `Aspose.Words.StyleIdentifier` somewhere in the
    result (not necessarily identical to `search_symbols`'s own `Miss` shape - your own choice of
    final shape, report which); (b) a genuine multi-word task question (e.g. "how do I add a
    watermark to a document") that happens to ALSO contain a dotted-looking substring is still
    correctly routed through the existing task-question path, unaffected - this card must not
    weaken `_looks_like_a_task_question`'s own existing precedence; (c) a dotted query where
    `search_symbols` returns a genuine HIT (not a `Miss`) is completely unaffected, same result as
    before this card; (d) a non-dotted bare identifier query with no symbol match and no
    suggestions is unaffected (no new behavior introduced where there was never a suggestion to
    surface); (e) a dotted query where `search_symbols` returns a `Miss` with NO suggestions at
    all (empty tuple) falls through exactly as it does today, unaffected.
  - >-
    Add the one-sentence `Qualified:` explanation to both `TOOL_DESCRIPTIONS` entries named above.
    Add at least one test (in the same new test file or an existing tool-surface test - your
    choice, report which) asserting the sentence is present in both descriptions, worded clearly
    enough that `test_tool_surface_truthful.py` (if it checks description content at all - read it
    first) is not broken by the addition.
  - >-
    MEASURE: re-run `tests/mcp/test_search_symbols_honest_miss.py`,
    `tests/mcp/tools/test_lookup_miss_reason.py`, and any other existing test exercising `lookup`'s
    own dispatch order (grep `tests/` for `_looks_like_a_task_question`/`lookup(` first - do not
    guess the list) BEFORE and AFTER your change, and report real pass/fail counts. Every existing
    task-question routing decision and every existing non-dotted miss must be byte-for-byte
    unchanged (Decision E: never regress).
actions:
  - >-
    Fix `lookup` to surface a real `search_symbols` suggestion for a dotted/colon-scoped
    `Type.Member` query instead of silently discarding it in favor of a lower-confidence docs
    answer (closing the real, reproduced `WORDS-NET-004`), and add the audit's own suggested
    one-sentence `Qualified:` clarification to `get_symbol`'s and `search_symbols`'s tool
    descriptions - both real, grounded Q16 sub-items; the other 2 nominal sub-items are confirmed
    not real defects and excluded from this card's scope.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_lookup_dotted_enum_member_suggestion.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-011
  - command: '{python} -m pytest tests/mcp/test_search_symbols_honest_miss.py tests/mcp/tools/test_lookup_miss_reason.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/server.py'); s = p.read_text(encoding='utf-8'); old = 'Qualified:'; count = s.count(old); assert count >= 1, 'no reference to the Qualified: line was found in server.py as expected - if your real wording differs, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, 'QualifiedZZZDISABLED:', count); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Breaks every reference to the literal "Qualified:" in the tool descriptions this card adds (or
    any other file-local reference to that exact string), so the required one-sentence explanation
    this card adds no longer contains the real literal it must name. Any test asserting the
    sentence's real wording is present must fail under this mutation; the lookup fix's own tests
    (which do not depend on this literal) are unaffected - acceptable, since this card requires at
    least the Qualified:-wording tests to fail, not every test in the file.
evidence:
  - evidence/build/G3/TC-684/receipt.json
closeout:
  - >-
    `lookup` now surfaces a real `search_symbols` suggestion for a dotted `Type.EnumMember`-shaped
    query instead of silently discarding it (closing the real, reproduced WORDS-NET-004), and
    `get_symbol`/`search_symbols`'s own tool descriptions now explain the `Qualified:`
    chunk-metadata line - both real, grounded Q16 sub-items. "Doubled final segment" and
    "package-root alias" are confirmed not real defects, not carded.
recovery: Re-run from a clean tree.
