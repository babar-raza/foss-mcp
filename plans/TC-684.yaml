id: TC-684
gate: G3
lane: storage-retrieval
purpose: >-
  Q16 (findability sub-program, section 2.2 item 6: "alias-form resolution (`Qualified:`, doubled
  final segment, package-root alias, `Type.EnumMember`)"). Of the 4 nominal sub-items, 2 are NOT
  grounded in any real round-2 finding and were not reproduced this session: "doubled final
  segment" (a hand-tried `Workbook.Workbook` query against the real cells/java index already
  resolves correctly today, via the existing `get_symbol._resolve_name` owner/member split - no
  distinct defect found) and "package-root alias" (a bare namespace-root query like `Aspose.Cells`
  correctly returns an honest `NotFound` today; nothing in `docs/round2/issues.json` describes
  this as a real defect). Neither is carded here.

  The other 2 are real, grounded in specific round-2 findings, looked up directly (never guessed
  from the plan's paraphrase):

  - **`Type.EnumMember` via `lookup` - IN SCOPE.** Round-2's `WORDS-NET-004` ("lookup fails to
    resolve dotted Type.EnumMember queries that search_symbols resolves fine", P2) is CONFIRMED
    STILL REAL today (supervisor, this session): `lookup(store, Scope("words","net"),
    "StyleIdentifier.Normal")` returns `TaskAnswer(symbols=())` - the real suggestion
    `search_symbols` itself offers for this exact query (`Miss(suggestions=
    ('Aspose.Words.StyleIdentifier',), ...)`) is silently discarded. Root cause, read directly in
    `lookup.py`: the dispatch order IS already "try `search_symbols` first" (line ~589, matching
    the audit's own suggested fix's premise) - but when `search_symbols` returns a `Miss` (not an
    empty list, a `Miss` object carrying real suggestions) rather than a non-empty list, `lookup`
    treats that identically to "no symbol evidence at all" and falls through unconditionally to
    `_compose_from_docs()`, which happens to return a `TaskAnswer` (a lower-quality, partial
    `developer_guide` match per the real audit evidence) - so the function returns that at line
    ~594-595 and the `Miss`'s own real suggestion is never reached, never surfaced, never
    mentioned anywhere in the final answer.
  - **`Qualified:` line - IN SCOPE, doc-only.** Round-2's own second issue at this location
    (looked up directly, the one quoting `"Qualified: cells_foss.Workbook"`) is a self-consistency
    complaint, not a resolution bug: `get_symbol(fqn="Workbook")` on Go/Rust pilots resolves
    correctly, but the response's own `Qualified:` chunk-metadata line (produced by
    `chunk_builder.py` for Go/Rust specifically) shows the package-qualified form, which can read
    as contradictory to a caller who queried the bare name. The audit's OWN suggested fix is
    explicitly cheap and textual: "Add one sentence to get_symbol's and search_symbols's tool
    descriptions ... 'fqn is the bare Go identifier without the package prefix shown in the
    Qualified: line.'" Confirmed this sentence does not exist anywhere in
    `TOOL_DESCRIPTIONS['get_symbol']`/`TOOL_DESCRIPTIONS['search_symbols']` in `server.py` today.

  Fix: (1) in `lookup.py`, when `search_symbols` returns a `Miss` carrying one or more real
  `suggestions` for a query lookup treats as identifier-like (not a task question per
  `_looks_like_a_task_question`), that suggestion must be surfaced somewhere in the final answer
  rather than silently dropped when a lower-confidence docs answer happens to exist - your own
  choice of exact mechanism (prefer the symbol miss's suggestions over a merely-partial docs
  answer; or merge the suggestion into whatever `TaskAnswer`/`Miss` is ultimately returned; report
  which and why), as long as the real `StyleIdentifier.Normal` case now mentions
  `Aspose.Words.StyleIdentifier` somewhere in `lookup`'s own result, and every CURRENTLY-PASSING
  lookup behavior (including genuine task questions that correctly prefer docs over an incidental
  lexical symbol collision - the whole reason `_looks_like_a_task_question` exists) is unchanged.
  (2) in `server.py`, add one sentence (the audit's own suggested wording, or your own equivalent)
  to `TOOL_DESCRIPTIONS['get_symbol']` and `TOOL_DESCRIPTIONS['search_symbols']` explaining the
  `Qualified:` chunk-metadata line.
