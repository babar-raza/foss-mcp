  definitions in full, and the real furnished page tests/fixtures/furnished/pdf_java/pages/_index.md''s troubleshooting-
  shaped content (the "Scope and Limitations" block the current fragment comes from) to understand what real content
  this test exists to prove reachable.'
- 'Bring up the real stack with today''s code exactly as the test''s own real_generation fixture does (docker compose
  -p foss-mcp-e2e-tc099 down -v --remove-orphans, then up --build --exit-code-from ingest-pdf-java ingest-pdf-java,
  then up -d --build serving-pdf-java, wait for /readyz) and, through a real MCP session against it, by hand: try
  candidate natural-language queries related to the SAME real troubleshooting content (the "Scope and Limitations"
  section) until you find one where search_symbols AND find_examples both return an honest miss (confirming no real
  symbol or example competes for it), AND lookup composes the doc-fallback TaskAnswer whose doc_matches contains the
  real troubleshooting fragment. Tear the stack down (docker compose -p foss-mcp-e2e-tc099 down -v --remove-orphans)
  when done, whether you succeed or not.'
- 'Update REAL_DOC_TASK_QUERY (and REAL_DOC_FRAGMENT only if the new query happens to surface a different, equally
  real sentence from the same section - prefer keeping REAL_DOC_FRAGMENT unchanged if the existing fragment still
  matches under the new query) to the new, confirmed-safe values. Update the test''s own docstring to describe the
  new query and to record, honestly, why the old one stopped working (TC-238 made a real competing symbol reachable)
  - do not leave the old, now-inaccurate docstring claim in place. Do not change this test''s assertions'' shape or
  weaken what it checks.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
