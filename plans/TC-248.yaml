purpose: 'Fix a real, live-confirmed test staleness, found while re-running the full offline+live suite after TC-238
  (the symbol-index truncation fix) landed. tests/e2e/test_pdf_java_live_content.py''s
  test_lookup_returns_real_doc_matches_for_an_api_naive_query picks the query "what functionality is unsupported"
  specifically because, at the time it was written, this query matched no real symbol or example for pdf/java (so
  lookup''s doc-composition fallback was the only path that could answer it) - confirmed, by hand, against a live
  rebuild of the real ingest-pdf-java/serving-pdf-java docker-compose stack with today''s code: this is no longer
  true. TC-238 raised the live symbol index from 20 to 300 types, and pdf/java''s own real GenericAction class
  ("Represents a PDF action of an unknown or unsupported type") is now genuinely reachable and genuinely contains the
  word "unsupported" - lookup now correctly surfaces that real symbol-adjacent doc match first, a GENUINE
  IMPROVEMENT (more real content is now findable, exactly what TC-238 set out to fix), not a regression. The test''s
  own hardcoded query/fragment pair is simply stale against the fixed system. This card picks a new query that still
  has no real competing match today, confirmed the same way the original test''s own docstring says it was
  confirmed: by hand, against the real running container.'
