inputs:
- 'CONFIRMED today by a real, hands-on clone+build of each real pinned repository
  (not assumed): slides/python is `aspose-slides-foss/Aspose.Slides-FOSS-for-Python`
  @ 4e63447ba79d1c27a5192844847d9f872c5b92ad (matches tests/fixtures/slides_python/api_surface.json''s
  own source_commit - confirm this yourself) - manifest pyproject.toml, `pip install
