  ecosystems - Python (slides/python), Rust (cells/rust), Go (pdf/go) - the three
  with the simplest, most standard build tooling, confirmed by a real, hands-on clone+build
  of each real repo today, not assumed. This is real replication toward the operator''s
  explicit goal: all pilots working exactly as proven for pdf/net.'
