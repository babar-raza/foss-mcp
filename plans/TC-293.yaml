closeout:
- _flatten_inheritance() correctly resolves a short-name base-class reference to the real, structured-data-
  bearing definition instead of an empty re-export shell on a name collision, closing the deeper root cause
  that made inheritance flattening a near-total no-op for Python packages using the common per-class-file +
  package-level-re-export convention, even after TC-281 made the function execute for Python at all.
recovery: Re-run from a clean tree.
