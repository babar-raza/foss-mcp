negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='_prefers_structured_data';new='_prefers_structured_data_DISABLED';i=s.rindex(old);s=s[:i]+new+s[i+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: Renames the LAST occurrence of "_prefers_structured_data" in api_surface.py - the real call site
    this card adds at the point of short-name insertion, not the function's own def line - so calling it raises
    a NameError and the short-name insertion reverts to unconditional first-writer-wins, failing every new test
    proving the collision now resolves to the real definition. Built with plain text, no backslash, using
    rindex per this session's established vacuous-falsifier safeguard. If the worker names the helper
    differently than `_prefers_structured_data`, this falsifier must be updated to match - report this
    explicitly rather than silently renaming the helper to fit a pre-written falsifier.
