id: TC-756
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a twenty-third real pilot-adoption win via the
  EXISTING, already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the
  same mechanism twenty-two sibling cards already proved (different pilots, zero file overlap -
  do not touch anything any of them touch). Confirmed needing ZERO code change:
  `infra/build_chunks.py`'s `_load_authored_candidates` auto-loads `tests/fixtures/furnished/
  <pilot>/authored_examples.yaml`, merges it with README-derived candidates, and runs every entry
  through `verify_typescript_example`, the exact same pipeline `TC-745`/`TC-746` proved for the
  TypeScript pilots, publishing only the ones that pass.

  `3d/typescript` currently serves only 3 real example chunks (the authoritative count - read
  `payload.stats.examples` directly from the real committed `infra/demo-manifests/
  3d__typescript__self_extracted` generation JSON via `json.load`, NEVER by grepping a literal
  string, which overstates the count roughly 2x). Its own real floor is 6-14 (Appendix C). Its
  real pinned repository is `aspose-3d-foss/Aspose.3D-FOSS-for-TypeScript` (re-confirm the exact
  pinned commit from `config/products/3d/typescript.yaml`/`infra/helm/foss-mcp/values.yaml` - do
  not trust this card's own citation blindly).

  Check whether the real upstream repository ships a dedicated `examples/`-style directory at the
  pinned commit - CONFIRM directly. If it ships none, author from the real public API surface
  (`tests/fixtures/3d_typescript/api_surface.json`) and/or adapt real upstream test-suite methods.
  Avoid any operation that the 3d/typescript library itself documents as unsupported (the
  known-defect registry for this pilot, `config/known_defects/3d__typescript.yaml` if present,
  lists upstream gaps - do not build an example around a disclosed-broken export path).

  `_MAX_EXAMPLES = 5` is a hard ceiling. Up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/3d_typescript/authored_examples.yaml
  - tests/indexing/test_authored_examples_3d_typescript.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-10 — real upstream library bug found while authoring cells/typescript examples
    sha256: 8df3a8bfc66641638fb11bd910058364faec2ebd735110b2195366ff985e1812
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/pdf_typescript/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_pdf_typescript.py` (same-language TypeScript sibling, TC-746) and
    `tests/fixtures/furnished/cells_typescript/authored_examples.yaml` (TC-745). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit, `LANGUAGE_BY_PLATFORM` maps `typescript` -> `typescript`),
    `src/foss_mcp/indexing/example_verifier.py`'s `verify_typescript_example`, and
    `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm the real current served count (`payload.stats.examples` via
    `json.load`) and the real pinned commit yourself. Determine the upstream shape before planning.
  - >-
    VERIFY EACH EXAMPLE YOURSELF: use PowerShell with `scripts/toolchain/activate.ps1` (Bash has
    no node/npm on this host). Install the real pinned package, compile and RUN each program, and
    confirm each one's real output matches what you claim. Do not submit an example you have not
    personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input. Confirm none of your examples trips them.
  - >-
    Check for the getter-backed-field object-spread trap found by TC-745 (see the 2026-11-10
    DECISION_LOG entry). If an operation is genuinely broken, decline it and flag it in your
    report rather than building an example around broken behavior.
  - >-
    Run `ruff format` and `ruff check` on the new test file before committing.
  - >-
    This card does NOT claim `3d/typescript`'s example-corpus work is complete. If fewer than 5
    real candidates verify cleanly, submit the real number and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for 3d/typescript via the existing
    authored_examples.yaml mechanism, raising its served example count from 3 toward 8.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_3d_typescript.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/3d_typescript/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-756/receipt.json
closeout:
  - >-
    3d/typescript gains up to 5 new, real, individually-verified authored examples via the
    existing, already-wired authored_examples.yaml mechanism (zero code change), raising its
    served example count from 3 toward 8 - real, bounded progress toward its own (6-14) floor.
recovery: Re-run from a clean tree.
