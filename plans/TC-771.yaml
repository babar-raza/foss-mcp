  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-12 — PAGE-PYTHON-011: PsDocument.to_pdf()/to_image() silently merges an EPS document's pages onto one output page, found while authoring page/python examples
    sha256: eb07c383b8f27e9d8f307991753e6b99b807be80eade51f55175cdde9fe3ae75
inputs:
  - >-
    READ FIRST: `config/known_defects/3d__python.yaml` in full (all 5 existing entries, their
    exact schema shape), `schemas/product/known_defects.schema.json`, and
    `tests/indexing/test_known_defects_data_3d.py` / `tests/indexing/
    test_known_defects_completeness.py` (their exact pinned id-set/count assertions and the
    `_ADDITIONAL_DISCLOSABLE_IDS` widening pattern already used for `3D-TYPESCRIPT-STL-001`/
    `PAGE-PYTHON-011`).
  - >-
    RE-VERIFY THE ID NUMBER YOURSELF before writing anything: `grep -o '"3D-PYTHON-[0-9]*"'
    docs/round2/issues.json docs/round3/issues.json | sort -u` and confirm the highest is still
    `3D-PYTHON-012` (so this entry is `3D-PYTHON-013`). If a higher number now exists, use the
    next one above it instead - never guess.
  - >-
    REPRODUCE FIRST, YOURSELF, FRESH - do not trust `TC-768`'s worker report blindly: install the
    real pinned `aspose-3d-foss` package at the pinned commit (confirm from `infra/helm/foss-mcp/
    values.yaml`), build a real `Mesh` from a primitive (e.g. `Box(2,2,2).to_mesh()`), attach it
    to a scene node, call both `mesh.get_bounding_box()` directly (confirm it returns an empty/
    default `BoundingBox`, not real bounds) and `node.get_bounding_box()` (confirm the real
    `AttributeError` crash). Read the installed package's own source for `Mesh.get_bounding_box`
    to confirm the stub, and for `Node.get_bounding_box` to confirm exactly how it crashes.
  - >-
    Verify the real FQN(s) to cite in `subject.refs` against the REAL indexed corpus (live
    `get_symbol`/`search_symbols` calls, or direct inspection of the committed `infra/
    demo-manifests/3d__python__self_extracted` generation JSON) - do not guess.
  - >-
    This entry must NOT weaken, remove, or contradict any of the 5 existing 3d/python entries -
    it is purely additive. Update `test_known_defects_data_3d.py`'s id set and any pinned total
    count arithmetically (old count + 1), and widen `test_known_defects_completeness.py`'s
    `_ADDITIONAL_DISCLOSABLE_IDS` the same additive way its own docstring documents for prior
    additions, updating its own pinned total the same way.
  - >-
    If you cannot reproduce the bug, or find the real root cause is different from what was
    reported, say so honestly and do not force a disclosure entry that doesn't match what you
    actually verified - accurate non-reproduction is a valid, honest outcome.
actions:
