network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/known_defects/3d__python.yaml'); s = p.read_text(encoding='utf-8'); old = '3D-PYTHON-013'; count = s.count(old); assert count >= 1, '3D-PYTHON-013 not found - this card must add it before this mutate can run'; s2 = s.replace(old, '3D-PYTHON-999', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Renames the new entry's own id so it no longer matches what the completeness-lock tests
    expect to find in the registry, which must make the completeness test(s) fail - a pure data
    mutation, immune to the lockstep-rename vacuousness class found earlier this session (it
    renames only the YAML id, never a Python symbol and its call site together), and it never
    touches any code path.
evidence:
  - evidence/build/G3/TC-771/receipt.json
closeout:
