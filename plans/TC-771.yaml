    3d/python gains a sixth, real, independently-verified known-defects disclosure
    (`3D-PYTHON-013`) for the `Mesh.get_bounding_box()` stub / `Node.get_bounding_box()` crash,
    additive to the five existing entries, wired into both completeness locks.
recovery: Re-run from a clean tree.
