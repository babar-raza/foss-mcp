id: TC-771
gate: G3
lane: storage-retrieval
purpose: >-
  P5 upstream-defect disclosure program (REQ-G3-015), closing a real, previously-undisclosed
  defect found and confirmed live while authoring `TC-768`'s 3d/python examples (see that card's
  own worker report, 2026-11-12): `Mesh.get_bounding_box()` in the real pinned
  `aspose-3d-foss/Aspose.3D-FOSS-for-Python` package is a literal stub (`return BoundingBox()`)
  that never computes real bounds from the mesh's own control points. This cascades: calling
  `Node.get_bounding_box()` on a node holding such a mesh raises
  `AttributeError: 'NoneType' object has no attribute 'x'` while trying to merge the always-empty
  box - a confirmed crash, not merely a wrong-but-harmless value.

  CRITICAL ID-COLLISION CHECK ALREADY DONE BY THE SUPERVISOR - DO NOT REPEAT OR SECOND-GUESS
  WITHOUT RE-VERIFYING: the highest real `3D-PYTHON-NNN` id used anywhere in `docs/round2/
  issues.json` or `docs/round3/issues.json` is `3D-PYTHON-012` (confirmed by direct grep of both
  files). This new entry MUST use `3D-PYTHON-013` - never reuse a lower number, which would
  silently collide with an unrelated, already-real round-2/round-3 audit finding (this is exactly
  the TC-757 mistake this project has already made once and retired a card over - re-verify this
  yourself with the same grep before writing anything, do not trust this paragraph blindly if the
  files may have changed).

  `config/known_defects/3d__python.yaml` already exists (5 entries: `3D-PYTHON-001/002/006/008/
  010`). This card adds exactly one new entry, `3D-PYTHON-013`, additive only.
depends_on:
  - TC-658
  - TC-660
  - TC-644
  - TC-707
  - TC-727
  - TC-758
  - TC-767
write_paths:
