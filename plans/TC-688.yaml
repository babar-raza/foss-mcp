  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top
      priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST, in full: `docs/DECISION_LOG.md`'s 2026-11-01 "Workstream K" entry (search for that
    exact heading) - this is the authority that pre-approves closing 3D-NET-014/SLIDES-NET-005 now.
    Then `get_symbol.py`'s `SymbolSignature`/`ResolvedSignature`/`get_symbol()` in full;
    `find_examples.py`'s `ExampleMatch`, `confidence` assignment (~line 1034-1057),
    `_NO_MATCH_REASON`/`NOT_CONFIGURED_REASON`, and
    `tests/mcp/tools/test_find_examples_verified_only.py::test_confidence_is_not_applicable_outside_the_vector_branch`
    (the test this card deliberately, knowingly reverses - confirm its exact current assertion
    before changing it); `api_surface.py`'s 2 real `"kind": cnode.type` call sites (grep for that
    exact string, do not guess line numbers); `server.py`'s `GetSymbolInput` schema and
    `TOOL_DESCRIPTIONS["get_symbol"]`.
  - >-
    (1) `raw_text` opt-in: add `include_raw_text: bool = False` as a new parameter to
    `get_symbol()` and a new optional field to `server.py`'s `GetSymbolInput` schema (default
    `False`/absent). When `False` (the new default), `raw_text` is omitted from the response
    entirely (not merely emptied - a caller must not be able to tell "opted out" apart from "field
    didn't exist before this card" by checking for an empty string; omit the field/key, or set it
    to a clearly-documented sentinel your own choice, report which and why). When `True`, behavior
    is byte-for-byte identical to today's always-on behavior. Update `TOOL_DESCRIPTIONS["get_symbol"]`
    to document the new parameter. This is a DELIBERATE default-response-shape change - do not try
    to make it backward-compatible by keeping the old default; the whole point is shrinking the
    default response.
  - >-
    (2) `confidence` for every source: extend `ExampleMatch.confidence`'s assignment so EVERY
    match (lexical and vector) gets a real, non-empty value distinguishing at least "confident"
    from "loose"/"partial" lexical matches (reuse whatever quality signal is already closest to
    hand for a lexical match - `match_basis`, `coverage`, or similar; your own choice of the exact
    two-or-more-value scheme, report which and why) - never leave the lexical branch's confidence
    as a bare `""` going forward. This REQUIRES updating
    `test_confidence_is_not_applicable_outside_the_vector_branch` (named in this card's own
    write_paths) to assert the NEW, intended behavior - rewrite it, do not delete it, and name the
    rewritten test's own docstring explaining this is a deliberate TC-688/RT3 reversal of TC-584's
    original scope, with a citation to this card.
  - >-
    (3) one reason enum: add named constants unifying every "no verified example" reason string
    behind one real, importable set (e.g. a small `Enum`/`Literal`/frozen set of named constants -
    your own choice of mechanism, report which and why) that every real call site in
    `find_examples.py` uses, replacing the 4 independently-worded strings you found. The caller-
    visible TEXT of each distinct reason may stay worded as it is today (do not invent new prose
    you have not measured against real pilot behavior) - the fix is giving each one a single,
    stable, named identity a caller can match against, not rewording the messages themselves.
    The `kind`-leak item is explicitly OUT OF SCOPE for this card (see the purpose text's own
    amendment note) - do not touch `api_surface.py`.
  - >-
    REWORK (post-amendment): fix the measured collateral consequence of item 1's default-shape
    change in the 6 widened write_paths. In `tests/mcp/tools/test_member_lookup.py`,
    `tests/mcp/tools/test_round3_unsupported_markers.py`, and `tests/mcp/test_response_envelope.py`:
    for each real `get_symbol(...)` call whose result is checked for `.raw_text` content, add
    `include_raw_text=True` to that specific call (never change what the test is actually
    verifying). `test_response_envelope.py`'s `test_upstream_text_results_are_marked_untrusted` may
    need `include_raw_text=True` added to make a text-shaped field exist again at all; if, even
    with it added, there genuinely is no text-shaped field left to mark untrusted for some other
    reason, say so explicitly rather than silently deleting the assertion. In the 3 e2e files
    (`tests/e2e/test_pdf_go_live_content.py`, `tests/e2e/test_pdf_typescript_live_content.py`,
    `tests/e2e/test_slides_python_live_content.py`): add `"include_raw_text": True` to the real
    `session.call_tool("get_symbol", {...})` args dict at each call site whose result is checked
    for `result["raw_text"]`. These 3 files need a live docker-compose stack to actually execute
    and are not part of this card's own `checks:` - edit them correctly anyway, since they encode
    a real production assumption that would otherwise silently break at the next live deploy; say
    so explicitly in your closeout rather than claiming them "tested" by this card's own checks.
  - >-
    Write real, deterministic unit tests in the 3 named test files proving: (a) `get_symbol`
    without `include_raw_text` omits `raw_text` from the response, with `include_raw_text=True`
    byte-for-byte reproducing today's always-on output; (b) a real lexical `find_examples` match
    now gets a real, non-empty, documented confidence value, distinct from a vector match's own
    value; (c) the rewritten `test_confidence_is_not_applicable_outside_the_vector_branch` passes
    against the new behavior with a clear docstring citing this card; (d) `find_examples`'s 4 real
    reason call sites now each reference one of the new named constants; (e)
    `tests/mcp/test_tool_surface_truthful.py` (if it checks response-shape/description content at
    all - read it first) is not broken by the `include_raw_text` parameter addition.
  - >-
    MEASURE: re-run `tests/mcp/tools/test_round3_retrieval_corpus.py`,
    `tests/mcp/tools/test_find_examples_title_anchor.py`,
    `tests/mcp/tools/test_find_examples_code_anchor.py`,
    `tests/mcp/tools/test_find_examples_symbol_aware_matching.py`,
    `tests/mcp/test_tool_surface_truthful.py`, `tests/mcp/tools/test_member_lookup.py`,
    `tests/mcp/tools/test_round3_unsupported_markers.py`, `tests/mcp/test_response_envelope.py`,
    and any other existing test exercising `get_symbol`'s `raw_text` field or `find_examples`'s
    `confidence` field (grep `tests/` for both names first - do not guess the list) BEFORE and
    AFTER your change, and report real pass/fail counts. Decision E (never regress) applies to
    everything EXCEPT the one test this card deliberately, knowingly rewrites
    (`test_confidence_is_not_applicable_outside_the_vector_branch`) - name every other test whose
    assertion changes, if any, and justify each one individually; an unplanned change elsewhere is
    a real regression, not an acceptable side effect of this card.
actions:
  - >-
    Close RT3's 3 real, scoped contract items: make `get_symbol`'s `raw_text` opt-in (3D-NET-014),
    give every `find_examples` match a real confidence value (SLIDES-NET-005) - both explicitly
    pre-authorized reversals of a 2026-11-01 deferral, not fresh unapproved risk - and unify
    `find_examples`'s 4 independent "no verified example" reason strings behind one named set of
    constants, while fixing the measured real collateral fallout of the raw_text default change
    in 6 widened write_paths (3 unit test files, 3 real e2e files). "members documented/renamed"
    and the `kind`-leak item are both excluded, left for their own future cards.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_get_symbol_raw_text_opt_in.py tests/mcp/tools/test_find_examples_verified_only.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 240
    junitxml: true
    proves:
      - REQ-G3-016
  - command: '{python} -m pytest tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_find_examples_title_anchor.py tests/mcp/tools/test_find_examples_code_anchor.py tests/mcp/tools/test_find_examples_symbol_aware_matching.py tests/mcp/test_tool_surface_truthful.py tests/mcp/tools/test_member_lookup.py tests/mcp/tools/test_round3_unsupported_markers.py tests/mcp/test_response_envelope.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-016
min_tests: 6
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/get_symbol.py'); s = p.read_text(encoding='utf-8'); old = 'include_raw_text'; assert s.count(old) >= 1, 'the required include_raw_text parameter was not found as expected - if your real code names this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, 'include_raw_textDISABLED', s.count(old)); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Renames every reference to the new `include_raw_text` parameter, so get_symbol can no longer
    accept it and any test exercising the opt-in behavior fails (NameError/TypeError at the call
    site or a test asserting the new default-omitted behavior breaks). Tests of the other 2
    in-scope items (confidence, reason enum) that do not depend on this exact name may be
    unaffected - acceptable, since this card requires at least the raw_text-specific tests to
    fail, not every test in the file.
evidence:
  - evidence/build/G3/TC-688/receipt.json
closeout:
  - >-
    `get_symbol`'s `raw_text` is now opt-in (default omitted, shrinking every default response)
    and every `find_examples` match now carries a real confidence value - both deliberate,
    pre-authorized reversals of a 2026-11-01 deferral recorded for exactly this card.
    `find_examples`'s 4 independent "no verified example" reason strings are unified behind one
    named set of constants. The real, measured collateral fallout of the raw_text default change
    (6 files: 3 unit tests, 3 e2e tests) is fixed in the same card. "members documented/renamed"
    and the `kind`-leak item in `api_surface.py` remain open, deliberately excluded - the former
    too vague to scope safely, the latter a real, broad, unmeasured regression risk the dispatched
    worker correctly declined to force without its own test coverage.
recovery: Re-run from a clean tree.
