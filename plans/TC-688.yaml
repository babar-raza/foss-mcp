id: TC-688
gate: G3
lane: storage-retrieval
purpose: >-
  RT3 (runtime/contract sub-program, section 2.7: "Contract: `raw_text` opt-in
  (`include_raw_text`; tool-surface test updated in the same card), `confidence` for every source,
  `members` documented/renamed, one reason enum for 'no verified example', `kind` stops leaking
  tree-sitter node names"). RT3's own wave-table dependency is `KD11` - investigated this session
  and found NOT achievable as a literal closure ticket (it needs an unfinished program, XA19, and
  a ledger mechanism that does not exist; recorded directly in `docs/DECISION_LOG.md`, 2026-11-05).
  RT3 does not actually NEED KD11's formal closure - none of its 4 real items below touch
  disclosure content at all; the wave table's `KD11` link is sequencing, not a functional
  dependency, so RT3 is unblocked the same way C12 proceeded once C10 was confirmed to add nothing
  further to depend on.

  Of RT3's 5 nominal items, 4 are REAL, CONFIRMED-OPEN gaps (checked directly against the real
  committed code this session, not guessed); "members documented/renamed" is excluded from this
  card - its own ask is too vague to scope safely without further investigation, left for a future
  card.

  TWO of the four are DELIBERATE, NAMED, PRE-AUTHORIZED reversals of a prior supervisor deferral -
  read `docs/DECISION_LOG.md`'s 2026-11-01 "Workstream K" entry in full before touching either:
  that entry explicitly deferred both findings "not now, in the final hours before a public demo
  deployment" and named them "real, deliberate, measured future work... for whoever picks up RT3
  next" - this IS that card, not a fresh, unauthorized risk:

  - **3D-NET-014 (`raw_text` opt-in)**: `get_symbol.py`'s `SymbolSignature`/`ResolvedSignature`
    dataclasses always carry a `raw_text: str` field, always populated with the FULL duplicate
    text of the structured `methods`/`properties` fields - roughly doubling response size for
    every single `get_symbol` call across all 32 pilots, for zero additional information a caller
    cannot already get from the structured fields.
  - **SLIDES-NET-005 (`confidence` for every source)**: `find_examples.py`'s `ExampleMatch.confidence`
    (TC-584) is `""` for EVERY lexical (non-vector) match, by design - confirmed this is the exact
    behavior `tests/mcp/tools/test_find_examples_verified_only.py::test_confidence_is_not_applicable_outside_the_vector_branch`
    pins today.

  A third item, "no single reason enum for 'no verified example'", is also in scope and lower-risk
  (no caller can reasonably depend on a free-text reason string's exact spelling): `find_examples.py`
  has at least 4 distinct, independently-worded free-text reason strings for "nothing matched"
  (`_NO_MATCH_REASON`, `NOT_CONFIGURED_REASON`, a bare field default, and "no verified example
  exists in this generation" inline) - never unified into one named constant/enum a caller could
  match against reliably.

  **AMENDMENT (post-dispatch, before acceptance): the 4th nominal item, "`kind` leaks a raw
  tree-sitter/clang-AST node type" in `api_surface.py`, is EXCLUDED from this card's scope.** The
  dispatched worker measured directly that both real `"kind": cnode.type` call sites are NOT the
  low-risk edge case this card's purpose text originally assumed: one is pinned by 2 existing
  tests outside this card's write_paths, and the other is the GENERAL class/struct/enum/interface/
  record/delegate path for every language, serving 20+ distinct raw grammar strings already
  committed and tested across the real 32-pilot fixture set. Changing it blind, with no test file
  of its own inside this card's write_paths to prove a safe replacement, would be a real, broad,
  unmeasured regression - correctly declined rather than forced. Left for its own dedicated future
  card with write access to the affected extraction tests and a careful, per-language mapping.

  **AMENDMENT (post-dispatch, before acceptance): widened write_paths to absorb a measured,
  real collateral consequence of item 1's deliberate default-shape change.** The dispatched worker
  found 10 real test failures (`test_member_lookup.py` x7, `test_round3_unsupported_markers.py`
  x1, `test_response_envelope.py` x2) plus 3 real e2e tests
  (`test_pdf_go_live_content.py`/`test_pdf_typescript_live_content.py`/
  `test_slides_python_live_content.py`) that assume `raw_text` is always present without passing
  `include_raw_text=True` - a real, Decision-E-relevant regression if left unfixed, not a false
  positive. These 6 files are added to write_paths for a follow-up rework: for each, pass
  `include_raw_text=True` at the specific call sites whose result is checked for `.raw_text`
  content (the e2e tests via the real tool-call args dict; the unit tests via the real
  `get_symbol(...)` call), never change what each test is actually verifying.
