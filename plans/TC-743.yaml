id: TC-743
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a tenth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism nine sibling cards already proved for nine other pilots this session (different
  pilots, zero file overlap - do not touch anything any of them touch). Confirmed needing ZERO
  code change: `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads
  `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with README-derived
  candidates, and runs every entry through the exact same verifier pipeline this session has
  already proved for Rust (`example_verifier.py`'s rust path), publishing only the ones that pass.

  Unlike the other nine cards this session, `cells/rust` already HAS an existing
  `authored_examples.yaml` (authored by `TC-501`, most recently re-claimed in `write_paths` by
  `TC-535` - re-confirm both files' real current content yourself before touching anything, do not
  assume `TC-501`'s original content is still exactly what is on disk). It currently has only 3 of
  the mechanism's `_MAX_EXAMPLES = 5` slots used, and serves 8 real example chunks today
  (confirmed directly against the real committed `infra/demo-manifests/cells__rust__self_extracted`
  generation) against its own real floor of 15-30 (Appendix C of the master plan) - the LARGEST
  remaining headroom-per-card-effort ratio of any pilot this session has found with an EXISTING
  sidecar, since only 2 new slots need filling, not 5. Its real pinned repository is
  `aspose-cells-foss/Aspose.Cells-FOSS-for-Rust` (re-confirm the exact pinned commit yourself from
  `config/products/cells/rust.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust this card's
  own citation blindly, and do not assume it matches the commit already pinned in the 3 existing
  sidecar entries without checking). The real upstream repository has a rich `samples/` directory
  of roughly 14 real Rust binaries plus a shared `common.rs` helper (per this project's own
  Appendix-C style accounting for this pilot, the richest real sample set of any pilot touched
  this session) - read enough of the real files NOT already adapted by the 3 existing entries to
  pick up to 2 more genuinely distinct, valuable operations.

  `_MAX_EXAMPLES = 5` is a hard, already-enforced ceiling - this card raises `cells/rust` from 8 to
  AT MOST 10 served examples (3 existing authored + up to 2 new = at most 5 authored total), not to
  its own real floor (15-30); closing that floor fully needs the P4 program's own later, larger
  per-language-sample-adapter work, explicitly out of this card's scope. This card's job is the
  real, bounded, immediately shippable slice: up to 2 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish, appended to
  (never replacing or reordering) the 3 that already exist.
depends_on:
  - TC-460
  - TC-565
  - TC-566
  - TC-501
  - TC-535
write_paths:
  - tests/fixtures/furnished/cells_rust/authored_examples.yaml
  - tests/indexing/test_authored_examples_cells_rust.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: the real, current `tests/fixtures/furnished/cells_rust/authored_examples.yaml` and
    `tests/indexing/test_authored_examples_cells_rust.py` in full (your exact starting point - this
    is an EXTEND, not a from-scratch author; preserve all 3 existing entries byte-for-byte unless
    you find and report a real defect in one). Also read `src/foss_mcp/indexing/
    authored_examples.py` in full (every structural rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`,
    `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal `normalised_code_sha256(code)`, `symbols`
    must be real FQNs, `library_commit` must be the real 40-hex pinned commit, and must match the
    existing 3 entries' own `library_commit` unless the real pin has genuinely moved - check this
    explicitly), and `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `cells/rust`'s real current served example count (8) and real pinned
    repository/commit yourself (cross-check against the 3 existing sidecar entries' own
    `library_commit` field - do not assume they still match today's real pin without checking).
    Fetch the real upstream `samples/` directory at that exact commit and read the real files NOT
    already covered by the 3 existing entries' own `symbols`/`title` fields to find up to 2 more
    real, genuinely distinct, valuable operations.
  - >-
    VERIFY EACH NEW EXAMPLE YOURSELF before committing: install/build against the real pinned
    crate, actually run each of your adapted programs, confirm each one's real output matches what
    you claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your new examples trips any of these patterns.
  - >-
    This card does NOT claim `cells/rust`'s example-corpus work is complete - even after this card
    it will still sit far below its own 15-30 floor. Say so honestly. If fewer than 2 real new
    candidates verify cleanly, submit the real number you got (which may be 0 or 1) rather than
    padding to hit a round number.
actions:
  - >-
    Author up to 2 new, real, individually-verified examples for cells/rust via the existing
    authored_examples.yaml mechanism, appended after the 3 existing entries, raising its served
    example count from 8 toward 10.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_rust.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_rust/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing'; old = 'code_sha256:'; count = s.count(old); assert count >= 4, 'fewer than 4 code_sha256 fields found - fewer than 1 new example was added on top of the 3 existing ones'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. The count>=4 assertion also guards against
    a vacuous pass where the worker reported 0 new examples but the check commands still happen to
    pass trivially - confirm by hand that the check files you named actually exercise this
    validation path before trusting it.
evidence:
  - evidence/build/G3/TC-743/receipt.json
closeout:
  - >-
    cells/rust gains up to 2 new, real, individually-verified authored examples appended to its 3
    existing ones via the existing, already-wired authored_examples.yaml mechanism (zero code
    change), raising its served example count from 8 toward 10 - real, bounded progress reported
    honestly against its own much larger (15-30) floor.
recovery: Re-run from a clean tree.
