id: TC-736
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a third real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism `TC-733`/`TC-735` already proved for `cells/python` and `pdf/go` (sibling cards,
  different pilots, zero file overlap - do not touch anything either of them touches). Confirmed
  needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates` already
  auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through the exact same `verify_dotnet_example`
  pipeline that already verifies every other example, publishing only the ones that pass. Three
  pilots (`cells/cpp`, `cells/rust`, `imaging/net`) already use this mechanism today -
  `tests/fixtures/furnished/cells_rust/authored_examples.yaml` is your exact schema/style template
  (adapt its Rust code to real C#/.NET, following `LANGUAGE_BY_PLATFORM`'s own `"dotnet": "csharp"`
  mapping in `src/foss_mcp/indexing/authored_examples.py`).

  `cells/net` currently serves only 8 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/cells__net__self_extracted` generation) - its real pinned
  repository is `aspose-cells-foss/Aspose.Cells-FOSS-for-.NET` (re-confirm the exact pinned commit
  yourself from `config/products/cells/net.yaml` - do not trust this card's own citation blindly).
  The real upstream repository has a genuine `samples/` directory of roughly 15 real C# sample
  projects (per this project's own Appendix-C style accounting for this pilot) - CONFIRM their
  real shape directly (standalone `Program.cs`/console-app style, or something else) by reading
  several of them yourself, do not assume.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `cells/net` from 8 to AT MOST 13 served examples, not to its own real
  floor (18, Appendix C); closing that floor fully needs the P4 program's own later, larger
  per-language-sample-adapter work (XA13, the .NET sample adapter), explicitly out of this card's
  scope. This card's job is the real, bounded, immediately shippable slice: up to 5 new, real,
  individually-verified authored examples, each drawn from real upstream sample logic, each
  passing the real ingestion verifier before being trusted to publish.

  PICK UP TO 5 real upstream samples covering genuinely DIFFERENT, valuable functionality (not 5
  variations on the same feature) - your own judgment, informed by actually reading the real ~15
  real sample projects, not guessed from their names alone. For each: write real, working,
  idiomatic standalone C# (a single `Program.cs`-style top-level or `Main`-method script - check
  `verify_dotnet_example`'s own real expectations for what "standalone" means in this pipeline)
  that performs the SAME real operation the original sample does, with real, visible output and/or
  assertions proving it worked - and then ACTUALLY VERIFY each one yourself (fetch the real pinned
  NuGet package/module, actually build/run the code for real) BEFORE trusting it will pass the
  ingestion pipeline's own verifier; do not write a plausible-looking example and hope. If a
  candidate genuinely needs network/credentials/a real file on disk beyond what a self-contained
  example can supply, skip it honestly rather than forcing it past `FORBIDDEN_CODE_PATTERNS`.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/cells_net/authored_examples.yaml
  - tests/indexing/test_authored_examples_cells_net.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_rust/authored_examples.yaml` AND
    `tests/indexing/test_authored_examples_cells_rust.py` in full (your exact templates - note the
    test file's own docstring: pure offline well-formedness/symbol-resolution/pinned-commit checks,
    NEVER importing, building or running the example code itself - that is the real ingestion
    verifier's job, which you still must do by hand per the input below). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule it enforces -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, the `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs the real indexed fixture actually
    carries, `library_commit` must be the real 40-hex pinned commit), `src/foss_mcp/indexing/
    example_verifier.py`'s `verify_dotnet_example`/`_assemble_dotnet_source` to confirm exactly what
    shape of C# this pipeline expects, and `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `cells/net`'s real current served example count (8) and real pinned
    repository/commit yourself, do not trust this card's own citation. Fetch the real upstream
    sample directory at that exact commit (via `gh api`) and read enough of the real files to pick
    up to 5 real, genuinely distinct, valuable operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: fetch the real pinned package, actually build
    and run each of your adapted programs, confirm each one's real output matches what you claim.
    Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns
    before committing (check directly against the real regex list in `authored_examples.py`, don't
    guess).
  - >-
    This card does NOT claim `cells/net`'s example-corpus work is complete - up to 13 served
    examples is real, bounded progress toward its real floor, not the floor itself. Scope your
    closeout accordingly. If fewer than 5 real candidates verify cleanly, submit the real number
    you got - do not pad with unverified ones.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for cells/net via the existing
    authored_examples.yaml mechanism, raising its served example count from 8 toward 13.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_net.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_net/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-736/receipt.json
closeout:
  - >-
    cells/net gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 8 toward 13 - real, bounded progress toward its full floor, which remains separately
    open pending the P4 program's own later per-language sample-adapter work.
recovery: Re-run from a clean tree.
