id: TC-749
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a sixteenth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism fifteen sibling cards already proved for fifteen other pilots this session (different
  pilots, zero file overlap - do not touch anything any of them touch). Confirmed needing ZERO
  code change: `infra/build_chunks.py`'s `_load_authored_candidates` already auto-loads
  `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with README-derived
  candidates, and runs every entry through `verify_go_example`, the exact same pipeline `TC-735`
  already proved for `pdf/go`, publishing only the ones that pass.

  `cells/go` currently serves only 8 real example chunks (the authoritative count - read
  `payload.stats.examples` directly from the real committed `infra/demo-manifests/
  cells__go__self_extracted` generation's JSON via `json.load`, NEVER by grepping a literal
  string and counting raw occurrences, which overstates the real count by roughly 2x - a mistake
  made and caught earlier this session). Its real pinned repository is
  `aspose-cells-foss/Aspose.Cells-FOSS-for-Go` (re-confirm the exact pinned commit yourself from
  `config/products/cells/go.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust this card's own
  citation blindly). The real upstream repository has a genuine `examples/` directory of roughly
  10 real Go programs (per this project's own Appendix-C style accounting for this pilot) - read
  enough of the real files to pick up to 5 genuinely distinct, valuable operations.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `cells/go` from 8 to AT MOST 13 served examples, not to its own real
  floor (14-30, Appendix C - this card may nearly close this pilot's own minimum floor if enough
  real examples verify, report honestly either way). This card's job is the real, bounded,
  immediately shippable slice: up to 5 new, real, individually-verified authored examples, each
  passing the real ingestion verifier before being trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/cells_go/authored_examples.yaml
  - tests/indexing/test_authored_examples_cells_go.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-10 — real upstream library bug found while authoring cells/typescript examples
    sha256: 8df3a8bfc66641638fb11bd910058364faec2ebd735110b2195366ff985e1812
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/pdf_go/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_pdf_go.py` (your exact same-language sibling template from `TC-735`).
    Also read `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit, `LANGUAGE_BY_PLATFORM` maps `go` -> `go`), `src/foss_mcp/indexing/
    example_verifier.py`'s `verify_go_example` in full, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `cells/go`'s real current served example count (read
    `payload.stats.examples` directly via `json.load`, not by grepping a literal string) and real
    pinned repository/commit yourself. Fetch the real upstream `examples/` directory at that exact
    commit and read enough of the real files to pick up to 5 real, genuinely distinct, valuable
    operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm a working Go toolchain, fetch/build
    the real pinned module, actually compile and RUN each program, confirm each one's real output
    matches what you claim. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `cells/go`'s example-corpus work is complete, even if it happens to
    nearly reach this pilot's own floor - say so honestly either way, and do not pad with
    unverified examples just to hit a round number.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for cells/go via the existing
    authored_examples.yaml mechanism, raising its served example count from 8 toward 13.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_go.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_go/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-749/receipt.json
closeout:
  - >-
    cells/go gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 8 toward 13 - real, bounded progress toward its full floor.
recovery: Re-run from a clean tree.
