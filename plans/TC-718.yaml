id: TC-718
gate: G3
lane: storage-retrieval
purpose: >-
  Closes IMAGING-NET-006 (round-2, `docs/round2/issues.json`, severity P2, category
  "mcp-content-wrong" - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation):
  `get_product_reference(section=install)` for `imaging/net` inserts the
  `"[README install line removed: ... was not found on the ... registry.]"` placeholder TWICE -
  once before and once after the Usage section's own ```csharp code block - even though the real
  committed README (commit `c5e77bdc7b4a`) has the real nuget install line exactly ONCE, inside a
  separate `## Install` section's own fence, misrepresenting the notice's own claim ("Verbatim
  README section ... 1 part, in original order").

  ROOT CAUSE (independently traced): `get_product_reference.py`'s `_guard_unresolved_install`
  (around line 1413) runs TWO separate passes over the merged "Installation and Quick Start" text
  (the README's `## Install` and `## Usage` headings, already combined upstream before this
  function sees them): (1) `_replace_fences(text, strip_block)` correctly finds the real nuget
  command inside its OWN fenced code block and replaces it with exactly one removal note, placed
  right after that fence closes; (2) a second, separate line-by-line scan over the WHOLE merged
  text (fenced or not) that inserts ANOTHER removal note on any line matching BOTH the coordinate
  name and `_INSTALL_LINE_VERBS_RE` (a broad verb pattern: `install|add\s+package|\badd\b|...`) -
  this second pass is not restricted to genuine install-COMMAND-shaped lines, so it also fires on
  ordinary PROSE that merely mentions the package name alongside a word like "install" (e.g. an
  introductory sentence in the Usage section such as "Install the package as shown above, then use
  the API below:"). The existing back-to-back dedup guard
  (`if not lines or lines[-1] != note: lines.append(note)`) does not help here because the two
  notes are not adjacent - real content (the fence's closing line, the Usage heading, etc.) sits
  between them.

  REPRODUCE FIRST: confirm this is still real on current `main`. Call
  `get_product_reference(section="install")` for `imaging/net` against the real committed data
  (same pattern `tests/mcp/tools/test_round3_install_truth.py`'s existing helpers already use) and
  confirm the removal-note placeholder appears twice in the rendered text. Separately, read the
  real committed `imaging/net` README fixture/manifest text directly and confirm the real nuget
  install line occurs exactly once. Then confirm the EXISTING cross-pilot test
  `test_every_pilot_the_registry_lacks_quotes_no_install_line_for_it` (same file, around line 280)
  does NOT catch this - it only asserts no genuine install-command line survives, never that the
  removal note appears the RIGHT NUMBER of times, which is why this bug slipped through. Report
  both real observations, verbatim, in your closeout.

  FIX (narrow, scoped to the one function that has the bug, never touching the fence pass which is
  already correct): tighten the SECOND pass's line-matching condition in `_guard_unresolved_install`
  so it only matches a genuine install-COMMAND-shaped line, not ordinary prose that merely mentions
  the coordinate near an install-shaped word. Reuse the SAME stricter, already-proven command-shape
  regex `test_every_pilot_the_registry_lacks_quotes_no_install_line_for_it` itself already uses to
  verify a genuine install command (`(?:\binstall|\badd(?:\s+package)?|\bi)\s+["']?{coordinate}`,
  anchored so the verb immediately precedes the coordinate) instead of the current broad
  `_INSTALL_LINE_VERBS_RE` (which matches the coordinate and a verb word ANYWHERE on the same line,
  in either order, with no proximity requirement) - do not simply delete the second pass outright;
  confirm first (and report in your closeout) whether any OTHER real pilot's committed data
  currently depends on the second pass catching a genuine UN-fenced install line (a bare command not
  inside a code fence) before narrowing its condition, so you do not silently stop removing a real
  line somewhere else. Re-run the full existing cross-pilot test
  (`test_every_pilot_the_registry_lacks_quotes_no_install_line_for_it`) and confirm it still passes
  with `checked >= 3` exactly as before - a narrower match must never let a real install command
  through un-redacted.

  TEST: add a real-fixture-backed regression test to `tests/mcp/tools/test_round3_install_truth.py`
  proving `imaging/net`'s real install answer now contains the removal-note placeholder EXACTLY
  ONCE (not just "a genuine command never appears," which the existing cross-pilot test already
  checks and would not have caught this) - this is the one assertion that was always missing.
