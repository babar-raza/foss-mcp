      ## 2026-11-07 — five more round-2 findings investigated: real, but none boundable as a quick card without more design work (supervisor)
    sha256: 41fbd9f03c6e8b3d1d0c9181a25afb7f3eb5a23a25175b1e029eff57d6952593
inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `IMAGING-NET-006` in full. Then
    `get_product_reference.py`'s `_guard_unresolved_install` (around line 1413) and the
    `_INSTALL_LINE_VERBS_RE` pattern it uses (around line 1402) in full, and
    `test_every_pilot_the_registry_lacks_quotes_no_install_line_for_it`'s own already-proven
    command-shape regex (same test file, around line 307) - that is your direct template for the
    tighter pattern to reuse, not a pattern you invent from scratch.
  - >-
    REPRODUCE FIRST (do not skip): confirm the real double-insertion against the real committed
    imaging/net data, and confirm the real README has the line exactly once. Report both real
    observations, verbatim, in your closeout.
  - >-
    Never weaken the guard's actual guarantee - a real, un-fenced install command for an absent
    registry coordinate must still always be caught and redacted. Check whether any other real
    pilot's committed data currently relies on the second pass's current broad matching before
    narrowing it, and report what you found.
actions:
  - >-
    Tighten `_guard_unresolved_install`'s bare-line removal pass to match only genuine
    install-command-shaped lines, closing the double-insertion defect for `imaging/net` without
    weakening the guard for any other pilot.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_round3_install_truth.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
  - command: '{python} -m pytest tests/conformance/test_reference_content.py -q -rfE -p no:cacheprovider -m "not live"'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 14
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py'); s = p.read_text(encoding='utf-8'); old = '_INSTALL_LINE_VERBS_RE.search(line)'; count = s.count(old); assert count == 1, 'the expected literal was not found exactly once - if your real fix renames or restructures this condition, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; new = old.replace('_INSTALL_LINE_VERBS_RE', '_INSTALL_LINE_VERBS_RE_DISABLED_FOR_TEST'); s2 = s.replace(old, new, 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Breaks the second pass's own matching condition (renames the regex it references to a
    nonexistent name, causing a NameError the moment that code path runs), which must make the new
    regression test fail - if your real fix replaces this exact literal with a different
    expression, anchor your own mutate on your own real post-fix literal instead and note the
    substitution in your closeout, per this card's own authoring convention.
evidence:
  - evidence/build/G3/TC-718/receipt.json
closeout:
  - >-
    `get_product_reference(section=install)` for `imaging/net` now inserts the removal-note
    placeholder exactly once, matching the real single removed line, closing IMAGING-NET-006
    without weakening the guard for any other pilot's genuine un-fenced install line.
recovery: Re-run from a clean tree.
