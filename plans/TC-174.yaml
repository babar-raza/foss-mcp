id: TC-174
gate: G2
lane: verification
purpose: 'Redesign D3 from the 2026-10-04 production analysis (DECISION_LOG). Pin the container
  inputs that currently float, so that the ingestion and serving images rebuild the same way on
  a rerun. The base images become digests. Every downloaded tool is checked against a sha256
  recorded in scripts/toolchain/toolchain.lock.json. The Dockerfile version defaults must equal
  the lock values, and a static test enforces that, so host and image cannot drift silently.'
depends_on:
- TC-138
- TC-172
write_paths:
- Dockerfile.ingestion
- Dockerfile.serving
- scripts/toolchain/toolchain.lock.json
- tests/infra/test_container_pins.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model â€” an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes Â§1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Current floating inputs, confirmed by reading the files on 2026-10-04: Dockerfile.ingestion
  and Dockerfile.serving use the tag python:3.13-slim with no digest. Node (ARG NODE_VERSION) and
  Go (ARG GO_VERSION) are downloaded with curl and no checksum check. Rust is installed from
  https://sh.rustup.rs with the floating channel stable. dotnet-install.sh is fetched at a floating
  channel. Apt packages float with the mirror. Only the pip layer uses --require-hashes.'
- 'Observed version drift, which the lock must settle. Host and image disagree: Go 1.26.4 on host
  versus 1.27.1 in the Dockerfile; Node 24.13.1 versus 24.21.0; Rust cargo 1.98.1 versus floating
  stable. The lock is the single source. Set the Dockerfile ARG defaults to the lock values, and
  change the lock only where you can cite an official release. Do not pick a version to match a
  Dockerfile by accident.'
- 'Digests and checksums must come from official sources, never from a copy you typed. Image digest:
  `docker buildx imagetools inspect python:3.13-slim`, then record the sha256 manifest digest for
  linux/amd64. Go: the sha256 field in https://go.dev/dl/?mode=json for the chosen version. Node:
  the SHASUMS256.txt file at https://nodejs.org/dist/v<version>/. rustup-init: its .sha256 file at
  https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/. If a checksum cannot be
  fetched from an official source, leave that row UNPINNED in the lock and say so in your report.
  Do not invent a checksum.'
- 'Apt (base packages for build-essential, openjdk-21 and maven): pinning to a Debian snapshot date
  is preferred. If you cannot do it here, record the residual risk in the lock under
  residual_risks and state the reason in your report. Do not pretend it is pinned.'
- 'The test tests/infra/test_container_pins.py is new and offline. It must parse both Dockerfiles and
  the lock, and assert: (a) every FROM line uses a sha256 digest; (b) each ARG version default
  equals the lock value; (c) every curl download in a Dockerfile is followed by a sha256 check
  against the lock value; (d) no `stable` channel or floating `latest` tag is used. Each assertion
  must fail for the matching mutation.'
- Do not weaken the existing pip --require-hashes layer. It already works, and it is part of
  what the analysis says to preserve.
actions:
- Read Dockerfile.ingestion and Dockerfile.serving in full before editing.
- Read scripts/toolchain/toolchain.lock.json in full. It has a container_pins_observed section
  from the analysis. Keep that section, and make its rows match what you pin.
- Fetch the digests and checksums from the official sources listed above, and record them.
- 'Edit the two Dockerfiles: digest FROM lines, ARG defaults equal to the lock, and a sha256 check
  after each download.'
- Write tests/infra/test_container_pins.py to the assertions above.
- Run the new test. It must pass on your edited files. Do NOT run docker build here. That is
  heavy, and the live test is a separate step.
checks:
- command: '{python} -m pytest tests/infra/test_container_pins.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 4
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('Dockerfile.ingestion');s=p.read_text(encoding='utf-8');p.write_text(s.replace('ARG GO_VERSION=','ARG GO_VERSION_OFF='),encoding='utf-8')"
  rationale: 'Renames the Go version ARG so the Dockerfile no longer carries the locked Go version.
    The pin test must then fail on the ARG-equals-lock assertion, which proves it checks the
    Dockerfile and not just that the file exists. Built without backslashes or nested quotes.'
evidence:
- evidence/build/G2/TC-174/receipt.json
closeout:
- Both base images are pinned by digest.
- Each download is checked by sha256, or recorded in the lock as UNPINNED with a reason.
- The Dockerfile ARG defaults equal the lock values, and a test enforces that.
- Renaming the Go ARG makes the pin test fail.
recovery: Re-run from a clean tree. The test is offline and idempotent.
