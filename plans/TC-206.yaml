id: TC-206
gate: G2
lane: transport-deployment
purpose: 'Give the pdf/cpp pilot the packaging manifest its product-reference check needs, so the C++ pilot passes the full
  MCP workflow like the others. The C++ product''s own packaging manifest is CMakeLists.txt at the repository root. At the pinned
  commit 4b83c9fec1e37fd205156770161f6843bac00ceb it declares project(Aspose_PDF_FOSS) and CMAKE_CXX_STANDARD 20, and the
  manifest reader already parses it (manifest_reader.read_cpp_manifest). Without a manifestPath the pdf/cpp pilot gets no sidecar,
  so get_product_reference answers "no packaging manifest" and check 7 fails. This card sets that one path. It adds no compile step:
  the MCP workflow does not need a verified C++ example, and the example check accepts an honest no-example answer.'
depends_on:
- TC-205
- TC-203
write_paths:
- infra/helm/foss-mcp/values.yaml
- infra/helm/foss-mcp/templates/ingestion-job.yaml
- tests/infra/test_helm_manifest_step.py
- tests/infra/test_helm_pilots_match_compose.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read the pdf/cpp entry in infra/helm/foss-mcp/values.yaml under ingestion.pilots in full. Read the ingestion-job template where
  manifestPath is consumed, and infra/fetch_product_reference.py. Confirm, by reading, that the reader for the cpp platform is
  read_cpp_manifest and that it parses CMakeLists.txt.'
- 'Add manifestPath: CMakeLists.txt to the pdf/cpp pilot entry only. Change no other entry and no other key.'
- 'Contract restatement, by the supervisor after the attempt-1 block. The pdf/cpp entry has library: {}, and the ingestion template reads
  library.repository and library.commit inside the fetch step, so a manifest path on an entry with an empty library renders an empty
  repository and fails the test. Add these three keys inside the pdf/cpp entry''s library block, and only there: repository:
  aspose-pdf-foss/Aspose.PDF-FOSS-for-Cpp, commit: "4b83c9fec1e37fd205156770161f6843bac00ceb", platform: cpp. These are the values
  recorded in tests/fixtures/pdf_cpp/api_surface.json (source_repository and source_commit). Copy them exactly. No other entry changes.'
- 'Restate the fixed pilot count in tests/infra/test_helm_manifest_step.py, around line 162, from six to seven, since seven pilots now have
  a manifest path. Keep the test name and its check.'
- 'Final-attempt contract, by the supervisor after the attempt-2 block. The ingestion template emits --library-repository,
  --library-commit and --library-platform to the builder whenever a pilot''s library.repository is set. The builder requires a furnished
  page with those flags (infra/build_chunks.py, the library flag check). pdf/cpp has no furnished page, so those flags must not be emitted
  for it. The fetch step needs only the repository and commit, so it must stay. Make two changes. (1) In
  infra/helm/foss-mcp/templates/ingestion-job.yaml, emit the --library-* build flags only when the pilot also has furnishedPage set,
  and keep the manifest fetch step conditioned on manifestPath as it is. Change nothing else in that template. (2) In
  tests/infra/test_helm_pilots_match_compose.py, the pdf/cpp pilot test compares its library block with the compose service, and compose
  defines no library flags for C++. Change only that comparison, for pdf/cpp, to compare library.repository and library.commit with the
  fixture''s source_repository and source_commit in tests/fixtures/pdf_cpp/api_surface.json. Keep every other assertion in that file and
  keep the test name. Record both changes in the commit body.'
- 'In tests/infra/test_helm_manifest_step.py, if a test asserts the number of pilots with manifestPath as a fixed count, restate
  that count to match the new value, keeping the test name and what it checks. Change nothing else. Record any such restatement in
  the commit body. If no test asserts a fixed count, change nothing in that file.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Read the entry and the consumers.
- Add the one key and, only if needed, the one count restatement.
- Run the chart and manifest tests, and helm lint and template, and report exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_manifest_step.py tests/infra/test_helm_chart.py tests/infra/test_helm_pilots_match_compose.py -q -rfE'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 30
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/values.yaml');s=p.read_text(encoding='utf-8');p.write_text(s.replace('manifestPath: CMakeLists.txt','manifestPath: CMakeLists_off.txt',1),encoding='utf-8')"
  rationale: 'Renames the pdf/cpp manifest path, so the rendered sidecar step would read a file that does not exist at the repository
    root. The manifest step test must then fail, because it checks the rendered Job against the pilot''s manifest path. The replace is
    limited to the first match, which is the one this card adds. Built with plain text, since it has no quote or backslash.'
evidence:
- evidence/build/G2/TC-206/receipt.json
closeout:
- The pdf/cpp pilot writes its own product-reference sidecar during ingestion, and its serving pod reads it.
recovery: Re-run from a clean tree.
