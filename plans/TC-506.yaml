  `build_app`); src/foss_mcp/mcp/server.py (`ToolErrorCode`, `_GENERIC_ERROR_FALLBACK`, `create_server` and its inner `_call_tool`);
  src/foss_mcp/indexing/generation_manifest.py (`GenerationKey`, `GenerationManifestStore._read_json`, `read_active`, `read_generation`);
  src/foss_mcp/mcp/tools/relevance.py (`chunk_kind` returns "symbol", "documentation" or "example"); src/foss_mcp/indexing/lexical_index_writer.py
  (`doc_id` is `<generation_id>::doc::<chunk_id>`). Read the doctored-state fixtures you will mirror: scratchpad review/generation-readiness-recovery/
  lib/scen.py (scenarios S02 to S08, S20a to S20d) and deep_ready_proto.py. Read tests/infra/test_demo_manifests.py (how the 40 pilots are
  derived from infra/helm/foss-mcp/values.yaml ingestion.pilots). Never print or log any environment value.
- >-
  src/foss_mcp/indexing/generation_manifest.py: change ONE thing, `GenerationManifestStore._read_json` reads with `encoding="utf-8-sig"` instead
  of `"utf-8"`, so a pointer or generation file saved with a byte-order mark parses. Nothing else in this file changes (the publish guard,
  leases and CAS belong to other cards). The new BOM test in tests/mcp/test_health_readiness_depth.py pins it.
- >-
  src/foss_mcp/mcp/health.py. Module constants, each on its own line: `READINESS_SYMBOL_FLOOR = 3` and `READINESS_DOCUMENTATION_FLOOR = 1`.
  A frozen dataclass `ReadinessReport` with fields `ready: bool`, `reasons: tuple[str, ...]`, `warnings: tuple[str, ...]`,
  `composition: dict[str, int]` with exactly the keys "symbol", "doc", "example" (counts of chunk_kind symbol, documentation, example), and
  `generation_id: str | None`, plus a method `to_dict()` returning {"ready", "reasons" (list), "composition", "generation_id", "warnings" (list)}.
  New public function `readiness_report(store: DeploymentGenerationStore) -> ReadinessReport` that NEVER raises (wrap the whole body; an
  unexpected exception becomes the single reason "readiness check failed (<ExceptionClassName>)"). Order of checks, collecting every reason that
  applies once the generation is readable: (a) read the pointer through `store.manifest_store.read_active(store.scope_key)`: an exception gives
  "active pointer is unreadable (<ExceptionClassName>)" and returns; None gives "no active generation" and returns; a non-string or empty value
  gives "active pointer is malformed" and returns. (b) the pointer must start with `store.scope_key + "::"`, else "active pointer names a
  generation of another scope". (c) read the generation; an exception gives "generation file is unreadable (<ExceptionClassName>)" and returns.
  (d) the generation key's (family, platform, source_kind) must equal `tuple(store.scope_key.split("::"))`, else "generation identity does not
  match this deployment". (e) `payload["lexical_index"]` must be a dict whose "documents" is a non-empty dict, else "generation has no lexical
  documents" and returns. (f) lexical_index["generation_id"] must equal the active generation id, else "lexical index belongs to a different
  generation". (g) lexical_index["doc_freq"] must be a dict, else "lexical index has no doc_freq". (h) every document must be a dict with a
  non-empty chunk_id, a str text and a list tokens, else "<N> documents are malformed (chunk_id, text, tokens)" and the composition floors are
  skipped. (i) every document id must start with `<generation_id>::doc::`, else "<N> document ids are not under this generation". (j) with
  well-formed documents compute the composition; "symbols <N> below the floor 3" and "documentation <N> below the floor 1" are reasons.
  Warnings (never reasons): "no verified examples" when the example count is 0; "generation mixes <N> source commits" when the distinct
  `Source-Commit: <sha>` lines across document texts number more than one. `ready` is True exactly when there are no reasons. Write the
  four identity assignments of steps (b), (d), (f) and (i) as single short lines of the exact form
  `    pointer_in_scope = <expr>`, `    identity_matches = <expr>`, `    index_generation_matches = <expr>` and
  `    document_ids_in_generation = <expr>` (each at most 110 characters, a boolean used by the following `if not ...:`), because the negative
  control edits them by text. `round_trip_check(store)` keeps its signature and returns `readiness_report(store).ready` (a real bool). New
  public function `generation_unavailable_reason(manifest_store, scope_key: str) -> str | None` that never raises and is CHEAP: it calls only
  `manifest_store.read_active(scope_key)` and `manifest_store.read_generation(scope_key, gid)` and returns None when the pointer is a non-empty
  string and the generation's `payload["lexical_index"]["documents"]` is a non-empty dict, else a short reason ("no active generation",
  "active pointer is unreadable (<ExceptionClassName>)", "generation file is unreadable (<ExceptionClassName>)", "generation has no lexical
  documents"). It must work with the duck-typed stores of tests/mcp/test_tool_surface_truthful.py, which implement only `read_active` and
  `read_generation` returning an object with a `payload` dict, so it must not touch `.key` or private members. Add the constant
  `GENERATION_UNAVAILABLE_MESSAGE` = "This deployment's documentation index is temporarily unavailable. Retry later; this is not a statement
  that the API or documentation does not exist." No reason or message may ever contain a filesystem path or an exception message, only
  exception class names. Update the module docstring (round_trip_check is no longer the only probe).
- >-
  infra/serve_http.py `_readyz_route`: the handler calls `readiness_report(generation_store)` and returns a `JSONResponse` with
  `report.to_dict()` as the body, status 200 when `report.ready` else 503, and the unchanged `X-Example-Search` header (still computed by
  `_active_example_search_mode`, still attached to BOTH statuses). Wrap the handler body so no exception can escape. Keep a per-route
  closure `last` (the previous `(ready, reasons)` pair, initially None). On the first probe and whenever the pair changes: log ONE record
  through `LOG` with `extra={"ready", "reasons", "generation_id", "family", "platform"}`: level WARNING and message "readiness failed" when
  not ready, level INFO and message "readiness restored" when ready after a failure, level INFO "readiness ok" for a first ready probe. A
  repeated identical probe logs nothing. Add a function `_log_startup_readiness(generation_store, deployment_config)` called once from
  `build_app` next to `_log_example_search_mode`: it calls `round_trip_check(generation_store)` and, when False, logs one WARNING
  "readiness failed at startup" with the reasons from `readiness_report` (this is also what keeps `round_trip_check` reachable from a
  production entrypoint, tests/test_unwired_modules.py pins that). Update the module docstring and the `/readyz` docstrings. `/healthz` is
  unchanged.
- >-
  src/foss_mcp/mcp/server.py. Add `UNAVAILABLE = "unavailable"` to `ToolErrorCode`. In `_call_tool`, AFTER input validation and INSIDE the
  worker thread (so a validation error still reads no generation, which tests/mcp/test_dispatch_offload.py pins with its
  `generation_reads` fixture), run the handler through a small module-level function that first calls
  `generation_unavailable_reason(store, scope_key)` for these six tools only: lookup, search_docs, search_symbols, get_symbol, list_members,
  find_examples (a module-level frozenset `_GENERATION_TOOLS`; `scope_key` is `search_symbols.scope_key(scope, SOURCE_KIND)` exactly as the
  tools compute it). report_index_freshness (which honestly reports "never published"), get_product_reference and list_recent_changes are NOT
  gated. When a reason comes back, raise a private exception class `_GenerationUnavailableError` (subclass of RuntimeError, carrying the
  reason) and handle it in a new `except` branch placed BEFORE the generic `except Exception`: log ONE WARNING through `logger` with the tool
  name, the reason and the correlation id (the reason is a class name or a fixed phrase, never an exception message), log the call with
  outcome "error", record the usage event exactly as the other error branches do, and return `CallToolResult(is_error=True, content=[TextContent
  with GENERATION_UNAVAILABLE_MESSAGE], structured_content={"code": "unavailable", "message": GENERATION_UNAVAILABLE_MESSAGE,
  "correlation_id": correlation_id})`. Import from foss_mcp.mcp.health only what is used. Do not change any other tool behaviour, the
  descriptions, or `SERVER_INSTRUCTIONS`.
- >-
