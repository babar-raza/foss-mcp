id: TC-506
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review, findings GRR-01, GRR-04 and the readiness part of GRR-10). The reviewer drove the shipped
  image through 40 doctored store states and found that /readyz answers "some lexical document exists" and nothing more. Measured
  (generation-readiness-recovery results_deep_ready_scen.txt): a generation of ANOTHER product placed behind this deployment's pointer
  (jmap/go content under pdf/go, scenarios S20a, S20c, S20d) gives /readyz 200 and the agent is answered under the wrong banner; documents
  with no tokens, no text or no doc_freq (S07b, S07c, S07d) give 200 although 4 to 6 of the 8 tools then throw KeyError; a generation with
  zero symbols, one symbol, or no documentation (S08a, S08c, S08d, S08e) gives 200. A pointer file written by Windows PowerShell with a UTF-8
  byte-order mark (S06b) or an empty pointer (S06h) gives HTTP 500 and one ASGI traceback per probe. When no usable generation exists the
  tools answer isError false with found false (an agent reads "this API does not exist") or with raw exception text. A prototype of the
  stronger check (scratchpad review/generation-readiness-recovery/deep_ready_proto.py) passed all 40 baked pilot scopes with zero false
  positives; the smallest real pilots are imaging/net with 3 symbols and 4 documentation chunks and tex/python with 4 symbols.
  This card changes readiness, nothing else about serving. (1) src/foss_mcp/mcp/health.py gains `readiness_report`: /readyz is 200 only when
  the pointer parses (a UTF-8 BOM is tolerated), the pointer and the generation both name THIS deployment's family/platform/source_kind, the
  lexical index belongs to the active generation, every document has chunk_id, text and tokens under a generation-prefixed id, doc_freq
  exists, there are at least 3 symbol chunks and at least 1 documentation chunk. Missing examples, a sidecar gap and mixed source commits are
  WARNINGS only, never a failure. (2) /readyz answers a JSON body with the reasons and the composition, keeps the X-Example-Search header and
  the 200/503 codes, and logs the failure reasons at WARNING on state transitions only; a corrupt pointer is a clean 503, never a traceback.
  (3) When no usable generation exists every generation-backed tool answers isError true with one fixed sanitised message and the new code
  "unavailable" instead of found false or raw exception text. What does NOT change: the tool payload shapes for a usable generation, the
  publish guard (generation_manifest.publish is another card), the sidecars (TC-507), metrics (TC-509), and the 40 baked generations.
