negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/health.py');s=p.read_text(encoding='utf-8');lines=s.split(chr(10));heads=('    pointer_in_scope =','    identity_matches =','    index_generation_matches =','    document_ids_in_generation =');new=[(l.split('=')[0]+'= True') if l.startswith(heads) else l for l in lines];assert new!=lines;p.write_text(chr(10).join(new),encoding='utf-8')"
  rationale: >-
    Forces the four scope-identity booleans of readiness_report (pointer prefix, generation identity, lexical-index generation id, document id
    prefix) to True, so a generation of another product behind the pointer is reported ready again. The reviewer's wrong-scope scenarios S20a to
    S20d, the unit tests and the HTTP tests then fail. A real break of the card's central claim.
