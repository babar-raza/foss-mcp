  test_each_generation_tool_is_an_error_over_an_empty_store (parametrised over the six tools; asserts is_error true, structured code
  "unavailable", message equal to GENERATION_UNAVAILABLE_MESSAGE, a correlation_id, and that the text does not contain "found",
