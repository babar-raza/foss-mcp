  isError false (the nine-tool smoke tests, the tool-call log-record tests at lines 619 to 680, the get_symbol miss test, the internal-error test that
  patches `foss_mcp.mcp.server.search_symbols`); with no usable generation the six generation tools now correctly answer isError true. Make `_store`
  publish one ready generation (`ready_chunks` from tests/infra/readiness_support.py through `publish_generation`, as tests/mcp/test_tool_input_hardening.py
  publishes one) so the honest-miss semantics those tests mean to pin still hold over a tiny real index; change NO assertion and update the comment
  that says "intentionally empty store". The one assertion that does change: the closed-vocabulary test at line 442 gains "unavailable" in its expected
  set. The empty-store behaviour is covered by the new tests/mcp/test_generation_unavailable_tool_error.py. (3) tests/infra/test_serve_http.py: `_chunks()` must satisfy the
  floors, use `ready_chunks(PROVENANCE)`; the 503 tests keep their meaning. (4) tests/infra/test_serve_example_search_mode.py: its generations
  hold one or two chunks; make `_publish` append the three floor-filler texts from tests/infra/readiness_support.py (two extra symbol chunks
  and one documentation chunk, none an example) to the texts it is given, adjusting only the one assertion that compares the chunk texts
  to the texts given; the six assertions `response.text == "ready"` / `"not ready"` / `(503, "not ready")` / `(200, "ready")` become
