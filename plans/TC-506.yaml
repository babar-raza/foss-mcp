  removed); test_reasons_carry_no_path_and_no_exception_message (feed a pointer holding the tmp path text and assert no reason contains
  the tmp path or a quote of the file content); test_generation_unavailable_reason_is_none_for_a_usable_generation;
  test_generation_unavailable_reason_names_each_unusable_state (parametrised: empty store, corrupt pointer, corrupt generation, zero
  documents); test_generation_unavailable_reason_works_with_a_duck_typed_store. At least 35 tests after parametrisation.
- >-
  NEW tests/mcp/test_generation_unavailable_tool_error.py (offline). Dispatch through `server.get_request_handler("tools/call")` exactly
