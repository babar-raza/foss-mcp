id: TC-573
gate: G3
lane: verification
purpose: >-
  A stale-metadata correction found by the 2026-10-23 independent readiness audit. docs/RELEASE.md's Kubernetes-chart section
  bullet L-115 says the init container 'waits without a deadline' - this is stale: infra/helm/foss-mcp/templates/deployment.yaml's
  init-gate wait is bounded by `initGate.timeoutSeconds` and exits 0 (degraded, not stuck) on timeout, confirmed live in the
  chart today. Correct L-115's text to describe the real, current bounded behavior; keep the bold id and subsection, change
  only the prose. Do not touch any other RELEASE.md bullet. (TC-399's own stale min_tests, found in the same audit, is a SEPARATE
  supervisor-only fix - plans/ is globally denied to every worker's write_paths, so it cannot be a card; it is handled directly
  by the supervisor.)
depends_on:
- TC-537
- TC-553
write_paths:
- docs/RELEASE.md
satisfies:
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  Read docs/RELEASE.md's Kubernetes-chart section, find the bullet starting `- **L-115**`, and read infra/helm/foss-mcp/templates/deployment.yaml's
  init-container wait logic yourself to confirm the real current bound (initGate.timeoutSeconds) before rewriting the sentence
  - keep the bold id and subsection exactly, change only the prose describing the behavior. This is a one-sentence textual
  correction with zero behavior change.
- >-
  Run the whole file; it must stay green. There is no test assertion to weaken here, only one sentence to correct to match
  the chart's real current behavior.
actions:
- >-
  Correct docs/RELEASE.md's L-115 bullet to describe the init-gate's real, current bounded-wait behavior.
checks:
- command: '{python} -m pytest tests/deploy/test_release_known_limitations.py -q -rfE'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/deploy/test_release_known_limitations.py tests/deploy/test_release_deferred_extraction.py tests/deploy/test_pilot_roster.py
    -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 900
  junitxml: true
  proves:
  - REQ-G3-008
min_tests: 170
network: false
requires:
- python
negative_control:
  mutate: >-
    python -X utf8 -c "import pathlib; nl = chr(10); p = pathlib.Path('docs/RELEASE.md'); s = p.read_text(encoding='utf-8');
    assert '**L-115**' in s; marker = '**L-115**'; start = s.index(marker); end = s.index(nl + '- **', start); s = s[:start]
    + '**L-115** The init container waits without a deadline.' + s[end:]; p.write_text(s, encoding='utf-8')"
  rationale: >-
    Reverts the L-115 bullet text to the stale 'waits without a deadline' claim this card corrects; any test asserting the
    real bounded-wait wording (or simply the old key phrase's absence) must fail. A real break of the card's claim.
evidence:
- evidence/build/G3/TC-573/receipt.json
closeout:
- L-115 describes the init gate's real current bounded behavior. Nothing else changed.
recovery: Re-run from a clean tree.
