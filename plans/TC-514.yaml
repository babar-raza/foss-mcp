id: TC-514
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review; findings PS-01, PS-06, PS-07, ISOPROV-04, and the unusable-argument-error part of PS-10). HANDSHAKE
  IDENTITY AND TRUTHFUL TOOL METADATA. Measured by the reviewers on the shipped image: `initialize` and `tools/list` are byte-identical for all pilots
  tested (pdf/go, cells/rust, slides/java, email/python, imaging/net, words/net, jmap/cpp): serverInfo is "foss-mcp" with no title, the
  instructions (src/foss_mcp/mcp/server.py SERVER_INSTRUCTIONS, L75-82) say "one open-source product" without naming it, and the tool descriptions
  and field descriptions (TOOL_DESCRIPTIONS L196-307, _TOOL_FIELD_DESCRIPTIONS L571-637) hard-code "Aspose.Pdf.Document (a pdf/net example)" and the
  task examples "add a watermark to a PDF" / "add a digital signature to a PDF" / "save fails with a font error" even on pdf/go, cells/rust and
  words/net. The last of those examples answers NoExampleFound on 40 of 40 pilots, so the description's own example misleads. The find_examples
  description says "lexical/semantic" while `example_search` is "lexical-only" in the standalone image (no gateway). The report_index_freshness
  `source_kind` enum offers three values (furnished, repo_native_manifest, repo_native_release_notes) that always answer "never published", and the
  get_product_reference description (corrected by card TC-507, not here) said formats and limitations are NotAvailable for every product and to
  "treat NotAvailable as authoritative absence". Only get_product_reference marks upstream text as untrusted (untrusted_upstream_content); search_docs, lookup,
  find_examples, search_symbols, get_symbol and list_recent_changes (verbatim release bodies) return third-party README and release text unmarked. Three
  payloads carry no scope at all: get_product_reference (0 of 320 sampled), list_recent_changes (0 of 40) and the found case of list_members (a bare
  string list; 434 of 17,218). A client that sends an unknown argument gets "unexpected argument" without the name or the valid names (the name is
  deliberately not echoed today because it is client-chosen). This card changes ONLY what the server says about itself and how every response is
  wrapped: (1) a new pure module src/foss_mcp/mcp/identity.py renders serverInfo.title, the instructions and every advertised description from the
  deployment's scope plus facts read from its own active generation (a real indexed symbol, a real verified-example title, and
  `example_search_mode`), with a documented neutral wording when no generation is readable; (2) a new pure module
  src/foss_mcp/mcp/response_envelope.py adds, to every successful tool response, a sibling `scope` object in structuredContent, an in-band `scope`
  key on dict results that lack one, and the `untrusted_upstream_content` marker (plus a `content_origin` string) on every result that carries repository
  text; (3) the unknown-argument message names the argument (sanitised, at most 40 characters) and lists the valid ones. Decisions recorded here. (a) The
  envelope is ADDITIVE: result payload shapes do not change (a bare list stays a bare list; list_members still returns a list of names; no key is
  removed or renamed), so the e2e and proof clients that read structuredContent.result keep working; for bare lists the scope lives only in the sibling
  structuredContent.scope, and the text channel (content[0].text, which stays equal to structuredContent.result) carries the marker on each dict item.
  (b) The dead source_kind values are DOCUMENTED, not removed: the enum is derived from SourceKind, and an existing test pins that equality. (c) The JSON-RPC
  error -32602 "Invalid request parameters" with data "" is raised inside the MCP SDK (site-packages mcp/server/runner.py L213 and
  mcp/shared/jsonrpc_dispatcher.py L101), not by this repository; it cannot be changed here and this card does not touch it. What does NOT change: tool
  names, input schemas (types, bounds, enums), the ToolErrorCode set, the result dataclasses, tool behaviour, the response size (card TC-515), any
  ranking, the stdio and HTTP transports.
depends_on:
