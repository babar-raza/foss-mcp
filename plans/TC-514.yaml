negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/server.py');s=p.read_text(encoding='utf-8');old='title=deployment_title(scope)';assert s.count(old)==1;p.write_text(s.replace(old,'title=None'),encoding='utf-8')"
