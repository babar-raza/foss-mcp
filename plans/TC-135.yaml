inputs:
- Read TC-133's own already-accepted fix in tests/mcp/test_server_wiring.py and tests/infra/test_serve_http.py
  first - mirror its exact approach (rename the test to reflect the corrected behavior,
  add a small `_assert_request_is_allowed(response)` helper asserting `response.status_code
  != 400`, use a real initialize body).
- 'REQUIRED, exact shape (function name load-bearing for the negative control): each
  of the 6 files gets its own `def _assert_request_is_allowed(response) -> None: assert
  response.status_code != 400, response.text` helper (independent per file, same name
  in each), used in place of the old `assert response.status_code == 400` in each
  file''s own test_a_missing_protocol_version_is_rejected (rename it too, matching
  TC-133''s own naming convention, e.g. test_a_missing_protocol_version_is_allowed_through).'
- These are real, Docker-based container tests (per the file names) - run each file's
  own real test suite for real (not a mock) to confirm the fix; allow real time for
  container lifecycle per file.
- Do not weaken any assertion's real intent - every test must keep testing the same
  real Origin/protocol-version behavior it always did, just against the now-correct
  expected outcome for a missing header specifically. Any present-but-invalid-header
  rejection test in these same files is unaffected and must keep passing unchanged.
- Do not touch src/foss_mcp/mcp/transport_security.py or any other src/ file - purely
  test-assertion maintenance in these 6 already-existing test files.
actions:
- Update all 6 files' own test_a_missing_protocol_version_is_rejected tests to assert
  the corrected, real behavior using each file's own required helper.
- Run each file's own full real container-based test suite and confirm every test
  passes, including every test that was already passing before this card.
