  and tests/infra/test_serve_http.py, now confirmed present in 6 MORE files: every
  one of the 6 pilots'' own tests/e2e/test_<pilot>_container_session.py (and the generic
  tests/e2e/test_container_session.py) has its own test_a_missing_protocol_version_is_rejected
