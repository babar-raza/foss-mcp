  ingestion time through a real Job step - never a live per-request registry query - with every piece (the Helm
  template, docker-compose.yml, serve_http's sidecar loading, and the entrypoint list) genuinely wired, not just
  unit-tested in isolation.
recovery: Re-run from a clean tree.
