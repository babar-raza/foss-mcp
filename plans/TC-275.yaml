negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py');s=p.read_text(encoding='utf-8');old='install_verified';new='install_verified_DISABLED';i=s.rindex(old);s=s[:i]+new+s[i+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: Renames the LAST occurrence of "install_verified" in get_product_reference.py - the real suppression-
    branch comparison this card adds, not an earlier docstring/field-declaration mention - so a confirmed-false
    verification result is silently ignored and every new test proving the suppression behavior must fail. Built
    with plain text, no backslash, using rindex to avoid the exact vacuous-falsifier mistake TC-261 made and fixed
    this session.
