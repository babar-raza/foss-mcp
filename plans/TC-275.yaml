- command: '{python} -m pytest tests/mcp/tools/test_get_product_reference_platforms.py tests/infra/test_verify_product_reference_install.py
    tests/infra/test_serve_http.py tests/infra/test_helm_manifest_step.py tests/test_unwired_modules.py -q -rfE'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
