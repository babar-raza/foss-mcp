id: TC-276
gate: G2
lane: extraction
purpose: 'Fix C1-out-of-line (found by the TC-271/cells-cpp worker, recorded in docs/DECISION_LOG.md
  2026-10-09): TC-259 fixed C1 (fabricated member names from reference/pointer return types) for inline-bodied
  class members and genuine free functions, but the identical shape recurs through a path TC-259 does not cover
  - an out-of-line, qualified member definition (`ReturnType ClassName::Method(...) { ... }` in a .cpp file).
  src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py''s _cpp_is_free_function() walks the node''s ancestor
  chain and returns True for such a definition (it is textually outside any class body, so the walk never passes
  through a field_declaration_list) even though it is semantically a member, not a free function.
  _cpp_free_function_name() then fails to find a name (the function_declarator''s name child is a
  qualified_identifier - `ClassName::Method` - a node type it does not check for among
  identifier/field_identifier/destructor_name/operator_name), returns "", and _node_name() falls through to the
  generic return-type fallback, fabricating a phantom top-level type entry named after the return type. Live-
  confirmed against cells/cpp: `Workbook& Worksheet::GetWorkbook()` fabricates a phantom top-level entry literally
  named "Workbook"; `OperatorType FormatCondition::GetOperator()`, `DiagnosticSeverity LoadIssue::GetSeverity()`,
  and `CellAddress CellAddress::Parse(...)` reproduce the identical shape for value returns. The real method is
  already correctly captured from the class''s own header declaration in every spot-checked case - confirmed
  present in the ALREADY-ACCEPTED main fixture (this predates this session''s regeneration work; it was newly
  surfaced, not introduced, by TC-271''s required careful inspection).'
depends_on:
- TC-259
- TC-215
