  sha256: 69aa477f81977e0fb19037faa34136c67f06e557075f585ea7b727f4a3882f21
inputs:
- 'Read tree_helpers.py''s _cpp_is_free_function() (~line 369-400+), _cpp_free_function_name() (~line 334-366),
  and _node_name()''s cpp branch (~line 287-331, including the TC-259 comment block) in full before changing
  anything. Also read src/foss_mcp/extraction/tree_sitter_engine/api_surface.py''s dedicated C++
  field_declaration_list member loop TC-259''s own comment references, to confirm (do not assume) that a class''s
  header-declared member is ALREADY the sole source of that member''s real, correctly-named entry - this card
  must never create a second source of truth for it.'
- 'Extend _cpp_is_free_function() to recognize a qualified_identifier as the function_declarator''s name child
  (optionally through the same reference_declarator/pointer_declarator wrapping _cpp_free_function_name() already
  tolerates) - this identifies an out-of-line `ClassName::Method` definition, which is semantically a member, not
  a free function, regardless of where it sits in the file. Return False for it, exactly as the function already
  returns False upon reaching a field_declaration_list ancestor - both cases mean "this is a member," and
  _node_name()''s existing `else: return ""  # TC-259: member case` branch already does the right thing once
  _cpp_is_free_function correctly reports that. Verify via a live tree-sitter-cpp parse probe (the same technique
  TC-010b/TC-058/TC-059/TC-259 each used and documented in their own comments) that a qualified_identifier really
  is the node type tree-sitter-cpp produces for this declarator shape - do not assume the name without checking.
  Your new early-return statement for this case MUST be written as the exact literal line
  `return False  # TC-276: out-of-line member` (this card''s negative control finds this exact string, return
  statement plus trailing comment together, so it targets exactly this line regardless of indentation and never
  the unrelated, pre-existing "qualified_identifier" substring that already appears earlier in this file at
  ~line 836 - the same class of mistake TC-261 made and fixed earlier this session, just avoided here by matching
  the full statement text, not a bare substring).'
- 'Before committing, empirically verify (grep/inspect the real cells/cpp clone, or any other already-cloned
  C++ pilot available to you) whether every out-of-line qualified member definition in real source has a
  corresponding header declaration that already captures the real member - this card''s fix assumes exactly that
  (so excluding the out-of-line definition entirely from the top-level extraction path loses nothing). If you
  find a real counter-example (an out-of-line definition with no header-declared counterpart, meaning this fix
  would silently drop a real member with no replacement), STOP and report it rather than proceeding on the
  assumption - that would need different handling (recovering the real name from the qualified_identifier itself,
  not just suppressing the phantom).'
- 'Add tests to tests/extraction/tree_sitter_engine/test_cpp_reference_return_member_naming.py (TC-259''s own
  file - extend it, do not create a parallel one): a real-shaped out-of-line reference-returning member
  definition (mirroring `Workbook& Worksheet::GetWorkbook()`) must never produce a phantom top-level entry named
  after its return type; a real-shaped out-of-line value-returning member definition (mirroring `OperatorType
  FormatCondition::GetOperator()`) must never produce a phantom entry named after its return type either; a
  genuine out-of-line CONSTRUCTOR (`Foo::Foo(...)  { ... }`, whose qualified_identifier''s final component
  legitimately equals the class name) must still be handled correctly - confirm what the existing constructor
  path already does for this case and that this card''s fix does not disturb it, this is a direct regression
  check, not just absence of a new failure. Add a regression test proving TC-259''s own inline-member and genuine-
  free-function cases are completely unchanged by this card.'
- 'Run the full existing test_cpp_reference_return_member_naming.py suite with zero changes to any pre-existing
  assertion, then your new tests, then the full project suite once, and report honestly. Do NOT regenerate any
  committed C++ fixture as part of this card - every C++ pilot needs independent re-measurement and re-pinning in
  a follow-up wave once this fix is reviewed and accepted, exactly mirroring how TC-259 itself was followed by a
  separate regeneration wave rather than regenerating fixtures as part of the root-cause fix itself.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
- 'REWORK (attempt 2): attempt 1''s fix is correct and well-verified (live parse probe, negative-control self-check,
  regression coverage for TC-259''s own cases and the pre-existing out-of-line-constructor path). Full suite
  surfaced exactly one real, directly-attributable failure: tests/extraction/tree_sitter_engine/
  test_consolidate_classes_free_functions.py::test_real_cells_cpp_free_function_count_increases_substantially
  (now in your write_paths) asserts `len(cells_cpp_free_functions) >= 250`; your fix correctly removes the
  phantom out-of-line-member entries this test''s own docstring (from TC-092) already names and explicitly defers
  ("This is a real, distinct, pre-existing defect... It is not fixed here... consider it for a follow-up
  taskcard") - TC-276 IS that follow-up. The real count after your fix is legitimately lower (confirmed by you:
  146) because the removed ~100+ entries were never genuine free functions. Update that test''s threshold to
  reflect the real, current, post-fix count (measure it yourself directly from your own fix''s output, do not
  reuse the 146 figure blindly - confirm it independently) and update its docstring to record that this
  recalibration is a direct, intended consequence of TC-276 closing the exact gap TC-092''s own docstring flagged,
  not a weakening of the check''s intent (the check still proves free functions are found and counted; it no
  longer counts phantoms as thought they were free functions). Re-run this test file, plus your original check
  command, then the full suite once more.'
