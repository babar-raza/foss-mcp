  - >-
    READ FIRST: `tests/conformance/test_sentence_wrapped_retrieval.py` in full, especially the
    `FRAMES` tuple (12 templates) and `_default_sample_cases`/`_render`, to understand WHY the
    word bound exists even though you cannot make this specific test pass from inside
    `write_paths` alone (it reads the baked corpus, not your sidecar - confirm this yourself by
    reading `tests/conformance/corpus.py::load_demo_manifests_corpus`).
  - >-
    Retitle ONLY the 2 named examples (`cells/java`'s hyperlink title, `pdf/python`'s
    input-field/checkbox title) to real titles of 12 words or fewer (the tightest real bound
    across all 12 real sentence frames and all real platform/family display strings - re-derive
    this yourself with a scratch script rendering the real `FRAMES` against real
    `_PLATFORM_DISPLAY`/`_FAMILY_DISPLAY` values if you want to confirm 12 is still correct;
    attempt 1 computed 12 and its own two retitles - "Attach a hyperlink and screen tip to a
    cell, then reload" (11 words) and "Edit an input field and checkbox across a save and
    reload" (11 words) - may be reused verbatim if you independently confirm they are still
    correct and still collision-safe).
  - >-
    Before finalizing either title, re-verify collision-safety against `title_anchored`
    (`src/foss_mcp/mcp/tools/relevance.py`) and this pilot's own real task queries in
    `tests/mcp/tools/test_round3_retrieval_corpus.py` - the exact discipline `TC-760`/`TC-762`/
    `TC-763` already established. Do not touch `code`/`symbols`/`code_sha256`/`library_commit` or
    any other example in either file.
  - >-
    Do NOT add any structural word-count guard to `src/foss_mcp/indexing/authored_examples.py` or
    any new test to `tests/indexing/test_authored_examples.py` in this card - that work is
    correctly deferred to a dedicated future sweep card (see `purpose` above). Do NOT touch
    `infra/demo-manifests/**` - the supervisor re-bakes that separately after integration.
  - >-
    Before committing: run the sidecar-level checks below, each twice, and report the real
    results. Do NOT run or rely on `tests/conformance/test_sentence_wrapped_retrieval.py` as a
    gate for this card - it cannot pass until the supervisor re-bakes the demo manifests after
    integration, which is expected and not a defect in your work.
