id: TC-773
gate: G3
lane: storage-retrieval
purpose: >-
  URGENT, live CI break found immediately after closing the P4 example-corpus campaign
  (`TC-764`-`TC-772`): `tests/conformance/test_sentence_wrapped_retrieval.py::
  test_sentence_wrapped_retrieval_default_sample` FAILS on current `main` (confirmed directly by
  the supervisor, not inferred): `cells__java:id_like_to_understand rendered a 39-word sentence
  (want 12-35)` for the title "Attach a hyperlink with a screen tip to a cell and confirm it
  after a save and reload" (18 title words). `pdf/python`'s "Create an Input Field and a
  Checkbox and Edit Their Values Across a Save/Reload Round Trip" (16 title words) is also
  independently confirmed over the same bound.

  SUPERSEDES attempt 1 of this card (never committed): attempt 1 correctly retitled both
  examples AND correctly, honestly reported two real blockers rather than forcing a wrong fix -
  (a) `test_sentence_wrapped_retrieval_default_sample` reads the real BAKED
  `infra/demo-manifests/**` corpus (a plain `shutil.copytree`, confirmed in
  `tests/conformance/corpus.py::load_demo_manifests_corpus`), never the live sidecar YAML
  directly - exactly like every other sibling card this session (`TC-760`/`762`/`763`/etc.), the
  retitle can only be PROVEN against this specific test after the supervisor re-bakes
  `infra/demo-manifests/**` post-integration, which is outside any worker's `write_paths` and
  always a separate supervisor action in this project, never a worker's job; (b) a retroactive,
  fleet-wide `_MAX_TITLE_WORDS` structural guard wired into `validate_authored_examples` would
  immediately break `test_authored_examples_fixtures.py` for 44 OTHER pre-existing titles across
  20 pilots this card does not touch, plus the cells_java/pdf_python sidecars' OWN other,
  untouched examples - a real, structural retroactivity problem with no narrow fix, correctly
  not forced through.

  THIS ATTEMPT (2) IS DELIBERATELY NARROWED to resolve both: this card now ONLY retitles the 2
  offending examples (attempt 1's own retitle work is correct and may be reused verbatim if still
  valid) and verifies via sidecar-level and title-collision-regression checks that do NOT depend
  on the baked corpus. The general structural word-count guard, and the other 97 latent
  violations across 12 pilots (counting attempt 1's newly-found 44 more, found only because the
  guard was wired in - a strictly larger number once counted this way), are EXPLICITLY DEFERRED
  to a dedicated future sweep card, not this one. The supervisor will re-bake
  `infra/demo-manifests/cells__java__self_extracted/**` and
  `infra/demo-manifests/pdf__python__self_extracted/**` and independently re-verify
  `test_sentence_wrapped_retrieval_default_sample` passes for real, as a separate action after
  this card integrates - this is not part of this card's own required checks.
