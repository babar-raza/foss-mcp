negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_java/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; q = chr(34); s2 = re.sub('code_sha256: ' + q + '?[0-9a-f]{64}' + q + '?', 'code_sha256: ' + chr(48)*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class found earlier this
    session, and it never touches any code path. Tolerates either a quoted or unquoted hash value
    (TC-768 found some sidecars quote it) - confirm by hand which form this file actually uses
    before trusting the review.
evidence:
  - evidence/build/G3/TC-773/receipt.json
closeout:
  - >-
    The 2 titles causing the real, live `test_sentence_wrapped_retrieval_default_sample` break
    are fixed at the source (sidecar) level. The supervisor re-bakes the baked demo-manifests
    corpus for these 2 pilots immediately after integration and independently re-verifies the
    live test passes for real - that verification is tracked separately, not as part of this
    card's own checks. A structural word-count guard and the full fleet-wide sweep (97+44 other
    latent violations across pilots) remain explicitly deferred to a dedicated future card.
recovery: Re-run from a clean tree.
