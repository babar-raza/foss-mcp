id: TC-194
gate: G2
lane: extraction
purpose: 'Make the Java verifier honour the page''s own import lines when it wraps a candidate. Live
  evidence (2026-10-04, pdf/java, pinned commit db2d3f0622f035825419c6d46727022064f39f15): 2 of 3
  candidates fail with "cannot find symbol: class WidgetAnnotation" and "class RadioButtonField". The
  wrapper emits only "import org.aspose.pdf.*;" (example_verifier.py, verify_java_example), and a wildcard
  on the top-level package does not reach org.aspose.pdf.annotations or org.aspose.pdf.forms. The page''s
  own overview imports those classes. A documentation example does not repeat its imports, so this is a
  verifier defect, not a content defect. The candidate text stays byte-identical, so the single.block bytes
  that plans/TC-119.yaml freezes do not change.'
depends_on:
- TC-189
- TC-191
- TC-190
- TC-115
- TC-123
write_paths:
- src/foss_mcp/indexing/example_verifier.py
- infra/build_chunks.py
- tests/indexing/test_java_page_imports.py
- tests/e2e/test_pdf_java_live_content.py
satisfies:
- REQ-G2-048
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '## 22. Verification obligations mapped to gates (extends §10''s and §18''s
    acceptance tests with the items §8 of the Round-6 review specifically required)'
  sha256: b417ef557a656b43c9fec9afeb5cbb1d856e9db8f3056ec331c464c5e0ab0d23
inputs:
- 'Read verify_java_example in src/foss_mcp/indexing/example_verifier.py in full, including the wrapper text it
  writes. Read the java entry of _PLATFORM_DISPATCH and its verify_kwargs in infra/build_chunks.py. Read
  tests/e2e/test_pdf_java_live_content.py in full, to see what it asserts about the verified count.'
- 'Add a pure helper _java_wrapper_source(candidate_code, class_name, page_imports) in
  src/foss_mcp/indexing/example_verifier.py. It returns the full source. The source begins with the wildcard
  import org.aspose.pdf.*; as today, then each line of page_imports in order, then the class. The wrapping
  text, including the main method and the indentation, stays as it is today. The helper name must be exactly
  _java_wrapper_source, and it must be called exactly once, from verify_java_example.'
- 'verify_java_example takes a new keyword argument page_imports, a tuple of import lines, default empty. A
  candidate that already declares its own public class is compiled as-is, as today, and page_imports is not
  added to it.'
- 'In infra/build_chunks.py, add a helper _page_java_imports(path) that returns the import lines of the
  furnished page, in document order, as the stripped lines that start with import and end with a semicolon.
  The java verify_kwargs passes it as page_imports. Keep the other java kwargs.'
- 'Add tests/indexing/test_java_page_imports.py as a new file, offline. Test 1: _java_wrapper_source with a
  page import puts that import before public class Candidate. Test 2: _page_java_imports on a short sample page
  returns its import lines and not the prose. Test 3: verify_java_example, with _run monkeypatched to return 0,
  writes a Candidate.java that contains the page import.'
- 'After the offline tests pass, read tests/e2e/test_pdf_java_live_content.py. If it asserts a fixed count of
  verified candidates for pdf/java, update that number to the count the live build will produce, and say in your
  report that it was updated and why. Do not weaken the assertion. Do not change any furnished fixture.'
- 'Keep every existing test and assertion. Do not change the candidate text, or any other verifier.'
actions:
- Read the files named in inputs in full.
- Add the helper, the argument, the build_chunks helper, and the offline test file.
- Run the offline test file and report the exact counts.
checks:
- command: '{python} -m pytest tests/indexing/test_java_page_imports.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-048
min_tests: 3
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/indexing/example_verifier.py');s=p.read_text(encoding='utf-8');p.write_text(s.replace('_java_wrapper_source(','_java_wrapper_source_off(',1),encoding='utf-8')"
  rationale: 'Renames the first match of _java_wrapper_source(, which is its definition, so the call in
    verify_java_example raises a NameError and no Candidate.java is written. Test 1 and test 3 then fail. Test 2
    is in build_chunks and is not affected, which is expected. Built with plain text, since it has no quote or
    backslash.'
evidence:
- evidence/build/G2/TC-194/receipt.json
closeout:
- A pdf/java candidate that uses a class from a package its page imports compiles, with the page import in place.
- A candidate whose text is unchanged is compared with its recorded javac output before and after.
- The live pdf/java build, run after integration, reports every candidate with its verdict.
recovery: Re-run from a clean tree.
