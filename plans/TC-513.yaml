  its own id, and every document key starts with `<generation_id>::doc::`); `sidecar_problems(pilot, product_reference, releases, registry)`
  (platform equals the pilot's platform; `source_repository` equals the chart's `library.repository` case-insensitively and `source_ref` equals the pin;
  a `family` key, when present, equals the pilot's family; every release `url` contains `github.com/<repository>/` case-insensitively; the registry
