id: TC-513
gate: G3
lane: verification
purpose: >-
  REQ-G3-008 (independent pre-production review, findings FK8S-03, FK8S-12, FK8S-07 (its test), FK8S-06 and the proof-suite blind spots). PROOF
  SUITE AND FLEET CONSISTENCY. The fleet proof (scripts/deploy/prove_pilots.py -> scripts/poc/pilot_workflow_proof.py -> the `_McpSession` client of
  tests/e2e/test_cells_rust_live_content.py) scored 25 of 40 on the live cluster: 14 find_examples ReadTimeouts at the client's fixed 15 s limit
  (root cause FK8S-02, fixed server-side by TC-508) and one transport artefact. Two client defects made that run harder to read: (1) `_McpSession.call_tool`
  defaults `request_id` to 1 for every call (L323) and `LiveMcpClient._rpc` sends `"id": 1`, so a late answer to a timed-out call is indistinguishable
  from the answer to the next one (the reviewer could not reproduce a poisoned answer in 300 same-id calls, because each call is its own HTTP exchange,
  but nothing in the client would notice one: two flaky checks, 3d_python check 7 and jmap_net check 7, were attributed to it), and (2) the 15 s limit is
  hard-coded, so a proof run behind a slow embedding gateway cannot be given more time without editing the file. FK8S-12: the tool docstrings still say
  "fourteen pilots" (scripts/deploy/prove_pilots.py, scripts/deploy/pilots.py) while the chart has 40. The proof is also fixture-circular: it takes
  the symbol, commit and title from the very fixtures the generation was built from, so a pilot whose data is mixed (pdf/typescript: 300 symbol chunks
  at c672b39 and 27 documentation/example chunks at 155bfc7, with the chart pin at 155bfc7), one that serves 3 symbols, or one that carries 38
  unresolved symbols (email/python; tex/python 13 with an upstream that does not parse) passes 11 of 11. Measured on the committed tree (a one-off
  script over tests/fixtures, infra/demo-manifests and values.yaml): for 39 of 40 pilots the fixture `source_commit`, the chart pin
  (`ingestion.pilots[].library.commit`) and EVERY `Source-Commit:` line of the baked generation are identical; the exception is pdf_typescript. All 40
  pilots have `product_reference_*.json` with the pilot's own platform, `source_repository` and `source_ref` equal to the pin, release URLs inside the
  pilot's own repository, and a package-registry ecosystem that matches the platform (cpp has none). All 40 symbol-chunk sets carry
  `API-Coverage: N of M types` with N the number of symbol chunks and M the fixture `type_count` (13 pilots are truncated: pdf_net 300 of 901, ...). All
  40 meet symbols >= 3 and documentation >= 1 (imaging/net 3 and 4, tex/python 4 and 20). Fixture `unresolved` counts are 13 (tex_python), 38
  (email_python), 10 (words_python), 4 (pdf_python), 1 (html_python) and 0 elsewhere. This card (a) gives the proof client monotonically increasing
  JSON-RPC ids and rejects any response whose id is not the request's, with a per-call timeout and a per-tool timeout (find_examples) that default to
  today's 15 s and change ONLY through parameters and two new command-line flags; (b) adds an opt-in `--min-content` check 12 to the workflow proof
  (served `indexed_types` at least 3, served `total_types` equal to the fixture's `type_count`, documentation reachable where a furnished page exists) and
  an always-on, never-failing `warnings` list in the proof report (unresolved symbols in the fixture); (c) fixes the stale counts in the two docstrings;
  and (d) adds tests/deploy/test_fleet_consistency.py, an offline test over fixtures + chart + the baked generations asserting, for every pilot, the
  three-way commit agreement, scope identity, sidecar identity, API-Coverage honesty, the composition floor and an unresolved-count table, with
  documented exceptions that FAIL when they no longer apply (as TC-440 does for tex_python). It adds no new live check by default: the default proof
  is still eleven checks with the same argv. What does NOT change: serving, the chart, any fixture or generation, relevance, the existing eleven
  checks, and the pdf/typescript data itself (its re-pin is another card, which must delete the exception below in the same commit).
