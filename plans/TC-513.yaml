  `coverage_problems(fixture, symbol_texts)` (every symbol chunk has exactly one `API-Coverage: N of M types` line, N equals the number of symbol chunks, M
  equals the fixture's `type_count`, and N < M exactly when the fixture is truncated); `composition_problems(symbols, docs)`; `unresolved_problems(key,
  actual)`. Chunk kinds use the rule of `relevance.chunk_kind` (first line matching `^FQN:\s*(.+)$` with MULTILINE; none -> documentation; `Example: ` ->
