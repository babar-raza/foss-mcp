  proof checks) and tests/deploy/test_verified_examples_coverage.py (the exception-table pattern to copy). Never print or log any environment value.
- >-
  tests/e2e/test_cells_rust_live_content.py, `_McpSession` (this file is imported by the proof tools, the live docker tests themselves are not run by this
  card): add `import itertools`; a module constant `DEFAULT_CALL_TIMEOUT_SECONDS = 15.0`; `__init__(self, *, call_timeout: float =
  DEFAULT_CALL_TIMEOUT_SECONDS, tool_timeouts: Mapping[str, float] | None = None)` keeping the existing handshake exactly; an id source
  `self._request_ids = itertools.count(1)` and a method `next_request_id(self) -> int`; `call_tool(self, name, arguments, *, request_id: int | None =
  None, timeout: float | None = None)` which uses `request_id` when given and `self.next_request_id()` otherwise (so ids increase by one per call
  within a session, across tools), resolves the timeout as the explicit `timeout`, else `tool_timeouts[name]`, else `call_timeout`, and after parsing
  the SSE body raises `AssertionError(f"JSON-RPC response id {got!r} does not answer request id {sent!r} ...")` when `body.get("id") != sent` (a late
  answer to a timed-out call, or any foreign answer, can never be taken for the current call). A `ReadTimeout` still propagates unchanged. The 15 s
  default stays; no timeout constant for find_examples is hard-coded anywhere. Do not change any other function in the file and no live test.
- >-
  scripts/poc/pilot_workflow_proof.py: (1) `LiveMcpClient.__init__(self, e2e, url, *, call_timeout=15.0, tool_timeouts=None)` builds
  `e2e._McpSession(call_timeout=call_timeout, tool_timeouts=tool_timeouts)`; `_rpc` takes its id from `self._session.next_request_id()`, uses
  `self._call_timeout`, and applies the same response-id check (raise `RuntimeError` naming method, sent id and received id). (2)
  `open_live_client(url, *, call_timeout=15.0, tool_timeouts=None)` passes them through (the one-argument call keeps working). (3) New flags
  `--call-timeout SECONDS` (default 15), `--find-examples-timeout SECONDS` (default: the call timeout) and `--min-content` (store_true, default off);
  `main` builds the default factory as `functools.partial(open_live_client, call_timeout=..., tool_timeouts={"find_examples": ...} if given)` and
  still calls an injected `client_factory` with the URL only. (4) `Pilot` gains two trailing fields with defaults, `type_count: int | None = None`
  and `unresolved_count: int = 0`, loaded in `load_pilot` from the fixture's `type_count` (an int) and the length of its `unresolved` list. (5)
  `pilot_warnings(pilot) -> list[str]`: one string per fact that passes the eleven checks but is not a clean fixture, today `"<name>: the extraction left
  N unresolved symbol(s) (see the fixture's unresolved list)"` when `unresolved_count > 0`; `build_report` adds `"warnings": pilot_warnings(pilot)` (an
  empty list when `pilot` is None) and `main` prints each as a line starting `WARNING `. Warnings never change the exit code. (6) `check_12(run)`,
  registered ONLY when `--min-content` is given (`CHECKS` and the eleven checks are unchanged; add `CHECKS_MIN_CONTENT = ((12, check_12),)`, `CHECK_TITLES[12]
  = "minimum content: at least 3 indexed types, served coverage equals the fixture, documentation reachable"`, and `run_checks(client, pilot, *,
  min_content=False)`, `unrunnable_checks(reason, *, min_content=False)`): it calls `report_index_freshness` the way check 8 does, fails unless the
  answer's `indexed_types` is an int of at least 3 (`MIN_INDEXED_TYPES = 3`), fails when the fixture has a `type_count` and the answer's `total_types`
  differs, and - only for a pilot with a furnished page - fails when `search_docs` for the furnished title returns an empty list; for a pilot without
  one it records in its evidence that the documentation floor is enforced offline by tests/deploy/test_fleet_consistency.py (a note, not a failure).
  (7) Update the module docstring ("eleven checks", plus a sentence for `--min-content` and the new flags).
- >-
  scripts/deploy/prove_pilots.py: add `--call-timeout`, `--find-examples-timeout` (both float, default None) and `--min-content` (store_true); when a
  value is given (or the flag set) `run_proof(..., *, extra_args=())` appends exactly `--call-timeout X`, `--find-examples-timeout X`, `--min-content` to the
  proof argv, and when none is given the argv is byte for byte today's. After the table and the existing error lines print `WARNING <release>: <text>`
  for every entry of the proof report's `warnings` list (read from the report file, tolerating its absence). Replace "fourteen" in the module docstring
  and the argparse description by "foss-mcp" pilot wording that is true for any chart size, e.g. "Prove the pilot releases of the foss-mcp chart (40
  today)"; the "eleven-check" docstring becomes "the workflow proof (eleven checks, twelve with --min-content)". Do the same "fourteen" correction in the
  docstring of scripts/deploy/pilots.py (a docstring-only edit there). `ProofRow`, the table and every exit code stay as they are.
- >-
  tests/deploy/test_fleet_consistency.py (NEW, offline, deterministic, no network, no wall-clock, no skipped or xfailed test; reads tests/fixtures/<key>/api_surface.json,
  infra/helm/foss-mcp/values.yaml and infra/demo-manifests only; parse each baked generation once through a module-level cache). Module constants:
  `EXPECTED_PILOTS = 40`, `SYMBOL_FLOOR = 3`, `DOC_FLOOR = 1` (the same floors TC-510 and TC-506 enforce), `ECOSYSTEM_BY_PLATFORM = {"net": "nuget", "python":
