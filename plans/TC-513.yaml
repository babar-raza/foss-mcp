  L540-560 and L860-870 (it imports `load_pilot`, `run_checks`, `open_live_client`, `unrunnable_checks` and calls `open_live_client(url)`,
  `run_checks(client, pilot)`, `unrunnable_checks(reason)` with exactly those signatures: they must keep working unchanged), the existing tests
