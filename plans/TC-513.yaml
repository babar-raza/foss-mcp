  `test_live_client_passes_the_timeouts_to_the_session`; `test_parse_args_defaults_leave_every_timeout_at_fifteen_and_min_content_off`;
  `test_main_builds_the_default_client_with_the_flag_values` (monkeypatch `open_live_client` with a recorder; fixtures written under tmp_path as
