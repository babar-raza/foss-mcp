  each entry carrying a reason string: `COMMIT_EXCEPTIONS = {"pdf_typescript": "mixed commits: fixture and 300 symbol chunks at c672b39, chart pin, 23 doc and 4
  example chunks and sidecar at 155bfc7 (FK8S-07 / ISOPROV-03); the card that re-pins the pilot must delete this entry"}`, `UNRESOLVED_EXCEPTIONS =
  {"tex_python": 13, "email_python": 38, "words_python": 10, "pdf_python": 4, "html_python": 1}` (the allowed MAXIMUM of the fixture's `unresolved` list,
  with a comment naming the cause of each: tex/python upstream does not parse (ISOPROV-01), the others unresolved references) and
