negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('tests/e2e/test_cells_rust_live_content.py');s=p.read_text(encoding='utf-8');old='self._request_ids = itertools.count(1)';assert s.count(old)==1;p.write_text(s.replace(old,'self._request_ids = itertools.repeat(1)'),encoding='utf-8')"
  rationale: >-
    Makes the id source return 1 for every call again (the reviewed defect), so the monotonic-id test, the timed-out-call regression test and the
    live-client id test fail. A real break of the card's client claim; the fleet test's own claim is proven by its synthetic tests.
