  `test_scope_has_one_generation_a_matching_pointer_and_its_own_identity`, `test_sidecars_identify_this_pilot`, `test_api_coverage_lines_are_present_and_honest`,
  `test_the_composition_floor_holds`, `test_unresolved_symbols_stay_within_the_documented_table`; the table tests `test_every_exception_names_a_pilot_of_the_chart`,
