closeout:
- >-
  The proof client numbers its requests, rejects an answer that is not for the request, and takes its time limits from parameters; the proof can be run
  with `--min-content` and always reports unresolved symbols as warnings; tests/deploy/test_fleet_consistency.py pins commit, identity, coverage,
  composition and unresolved counts on the shipped data. SUPERVISOR: (1) the card that re-pins pdf/typescript to one commit must delete the pdf_typescript
  entry of COMMIT_EXCEPTIONS in tests/deploy/test_fleet_consistency.py in the same commit (the test fails otherwise, by design), so give that card
  write access to the file and a dependency on this one; (2) the next cluster proof should run `python scripts/deploy/prove_pilots.py --namespace
