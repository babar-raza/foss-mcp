id: TC-723
gate: G3
lane: transport-deployment
purpose: >-
  Closes SLIDES-CPP-003 (round-2, `docs/round2/issues.json`, severity P1, category
  "mcp-docs-quality" - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation):
  `slides/cpp`'s `ShapeCollection::add_table()` is REAL and works (the table is genuinely added and
  physically present in the saved PPTX's `ppt/slides/slide1.xml`), but Tables are silently excluded
  from the uniform `shapes()` collection - `shapes().size()`/`shapes()[i]`/`operator[]` never grow
  or include a table, before or after a save+reload round trip. This project's own served
  `search_docs` "Key Capabilities and API Reference" text (`content_type=developer_guide`)
  describes `add_table()` alongside `add_auto_shape()`/`add_connector()`/`add_picture_frame()` with
  zero indication Table is the one shape kind excluded from the uniform list. `get_symbol`/
  `list_members` for `ShapeCollection` ARE individually accurate (they correctly show
  `table_count()`/`table_at()` as a separate accessor pair) - the gap is specifically that the
  prose a reader is most likely to check FIRST never connects the two facts. An agent who mirrors
  the `add_auto_shape`/`add_picture_frame` pattern with `add_table()`, then writes a
  `shapes()`-based loop to read the presentation back, silently never sees any table added this
  way, with no error and no warning.

  REPRODUCE FIRST: confirm this is still real. Build the real repro the round-2 finding itself
  used (its own `work/main2.cpp`/`evidence/t6_run_output.log` describe the exact steps): construct
  a real `Presentation`, call `shapes().add_auto_shape(...)` (confirm `shapes().size()` becomes 1),
  then `shapes().add_table(...)` (confirm `shapes().size()` STAYS at 1, unchanged), then
  `shapes().add_picture_frame(...)` (confirm `shapes().size()` becomes 2 - the table was never
  counted). Save to a real PPTX and confirm (via Python's `zipfile`, reading `ppt/slides/slide1.xml`
  directly) that the table IS physically present in the saved file despite `shapes().size()` never
  reflecting it. If a real C++ compile is practical in your environment (the pinned ingestion
  toolchain), attempt this live; the round-2 finding's own already-detailed repro steps are
  sufficient to proceed from if a live compile isn't readily available - report which you did and
  the real result, verbatim, in your closeout.

  FIX (pure additive data, zero code change - same mechanism this project already uses for `cells/go`/
  `page/python`/`cells/python`/`email/cpp`'s own entries; `slides/cpp` has no `known_hazards` key
  yet): add a NEW `known_hazards` key to `config/products/slides/cpp.yaml` (as the LAST top-level
  key, matching the established file-level comment convention), with ONE entry stating plainly: the
  real trigger (calling `ShapeCollection::add_table()` and then expecting the uniform `shapes()`
  collection - `size()`/`operator[]`/any `shapes()`-based iteration - to include it, the way
  `add_auto_shape()`/`add_connector()`/`add_picture_frame()` genuinely do), the real observed
  behavior (the table is genuinely added and saved, but invisible to `shapes()` forever, even after
  a save+reload round trip), the real correct accessor pair (`table_count()`/`table_at()`), and the
  safe pattern (never rely on a `shapes()`-based loop to discover or count tables; check
  `table_count()` separately).
