  - >-
    Disclose the real shapes()-excludes-tables behavior for slides/cpp's ShapeCollection via a new
    known_hazards entry, reusing the already-proven, already-wired mechanism with zero code change.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_known_hazards_round2_disclosures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-015
min_tests: 30
requires:
  - python
network: true
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/products/slides/cpp.yaml'); s = p.read_text(encoding='utf-8'); old = 'ShapeCollection'; count = s.count(old); assert count >= 1, 'the expected ShapeCollection literal was not found - if your real hazard text phrases this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, 'ShapeCollectionNOTREAL', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the real hazard text's own subject name so it no longer names the real class the new
    regression test asserts on, which must make that test fail - a pure data mutation, immune to
    the lockstep-rename vacuousness class this session's earlier reviews found, and it never
    touches any code path. If your real hazard text repeats "ShapeCollection" more than once before
    the mutate's target occurrence, or your chosen trace token is a substring of another required
    phrase (note: the mutate appends "NOTREAL" onto the matched word, so a token that is only a
    PREFIX of "ShapeCollection" would remain a substring of the mutated text and keep matching -
    the exact TC-722 near-miss class), re-anchor the mutate or your trace token so the mutation
    genuinely breaks your new test.
evidence:
  - evidence/build/G3/TC-723/receipt.json
closeout:
  - >-
    `slides/cpp`'s real shapes()-excludes-tables behavior is now disclosed via a new
    project-authored known_hazards entry, closing SLIDES-CPP-003 with zero code change.
recovery: Re-run from a clean tree.
