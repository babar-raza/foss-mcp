inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `SLIDES-CPP-003` in full. Then
    `config/products/cells/go.yaml`'s own `known_hazards` entry (your template) and
    `tests/mcp/tools/test_known_hazards_round2_disclosures.py` in full, especially the most recent
    widening for `TC-722`/`EMAIL-CPP-004` (search for "EMAIL-CPP-004" in that file) as your direct,
    most-recent template for adding an 11th entry cleanly, including that worker's own hard-won
