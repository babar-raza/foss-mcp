  - >-
    READ FIRST: `docs/round2/issues.json` id `PDF-TS-002` in full, and this session's own
    `docs/DECISION_LOG.md` entry titled "PDF-TS-002 root-caused precisely..." (search for
    "PDF-TS-002" in that file) for the full earlier investigation this card builds directly on -
    do not re-derive the root cause from scratch, it is already fully diagnosed there. Then
    `chunk_builder.py`'s `_stub_text`/`_stub_suffix`/`_STUB_REASON_LIMIT` (around lines 225-243)
    as your EXACT template, and `_method_line` (around line 246) where you add the new call.
  - >-
    REPRODUCE FIRST: confirm the real committed `tests/fixtures/pdf_typescript/api_surface.json`'s
    `Document.New` entry still has its real, non-empty `doc` field, and confirm `get_symbol`/
    `list_members` for it on current `main` still show no doc text anywhere in the member line.
    Report the real observed before-state, verbatim, in your closeout.
  - >-
    This card's own write_paths list is a best-effort enumeration from a supervisor-level grep -
    it may be incomplete or include files that turn out not to need any change once you actually
    run the suite. If you find a test file that needs updating but is NOT in this list, that is a
    scope violation per this project's own worker rules - stop and report it rather than editing
