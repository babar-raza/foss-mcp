id: TC-727
gate: G3
lane: storage-retrieval
purpose: >-
  Closes PDF-TS-002 (round-2, `docs/round2/issues.json`, severity P1, category
  "mcp-content-missing" - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation):
  method-level JSDoc summaries (e.g. `pdf/typescript`'s own `Document.New` - "Create a new document
  from scratch: zero pages when `format` is omitted, or one blank page of that size when given." -
  the exact behavior distinction that caused a round-1 agent to need a runtime fix-iteration after
  being surprised by an unexpected blank first page) are NEVER surfaced by `get_symbol`/
  `list_members`, for ANY method, on ANY pilot - not because extraction is missing them (it is
  not: the real committed `tests/fixtures/pdf_typescript/api_surface.json` fixture already has
  321 of 433 real methods carrying a correct, non-empty `doc` field, `Document.New`'s own entry
  matching the real source JSDoc word-for-word), but because `chunk_builder.py`'s `_method_line`
  (the ONE function every language's member-line rendering funnels through) never reads
  `method.get("doc")` at all. Its returned line is built entirely from name/params/return-type plus
  a fixed, already-established chain of OPTIONAL suffix functions (`_throws_suffix`,
  `_modifiers_suffix`, `_generics_suffix`, `_mixin_suffix`, `_inherited_from_suffix`,
  `_deprecated_suffix`, `_stub_suffix`) - a doc summary is simply never one of them, for any
  language, any pilot. This was investigated and deliberately NOT carded earlier in this same
  session pending a measured blast-radius pass before committing to the fix; that measurement is
  now done (see below) and the fix is ready to specify precisely.

  MEASURED BLAST RADIUS (do this measurement yourself again, do not trust this number blindly -
  re-confirm it, since fixtures may have changed since this card was authored): a supervisor-level
  grep for the member-line-shaped literal pattern `"  - .*->"` across `tests/` found 25 files that
  contain a hardcoded, exact member-line string, MANY using the fragile `"<exact line>" in
  text.splitlines()` idiom (confirmed directly in `tests/indexing/test_chunk_builder_round3_typescript.py`:
  `assert "  - fromFile(fileName: string) -> Scene [static]" in scene.splitlines()`) - this idiom
  requires the asserted line to appear VERBATIM, so any method whose real fixture carries a
  non-empty `doc` and is checked by one of these tests will break once a doc suffix is added,
  unless that specific assertion is updated to include the new suffix.

  FIX (additive, mirrors the EXACT pattern every sibling suffix in this file already uses - never
  touches the fenced logic of any other suffix function): add a new `_doc_suffix(entry)` function
  to `chunk_builder.py`, modeled directly on `_stub_suffix`/`_stub_text`'s own two-function shape
  (a `_doc_text` helper returning "" when `entry.get("doc")` is empty/missing, else the doc text
  with internal whitespace collapsed via `" ".join(text.split())` exactly like `_stub_text` already
  does for `stub_reason`, capped at a new `_DOC_SUMMARY_LIMIT` constant mirroring `_STUB_REASON_LIMIT`'s
  own value and truncation-with-"..." convention; then `_doc_suffix` wraps it as
  `f"  ({text})"` exactly like `_stub_suffix` does). Call `_doc_suffix(method)` from `_method_line`
  as one more term appended to the existing suffix chain (place it LAST, after `_stub_suffix`, so
  every existing suffix's own relative ordering and content stays byte-for-byte unchanged, and a
  method with no `doc` field renders its line exactly as before - confirm this explicitly: a
  method with every OTHER suffix field present but no `doc` must produce byte-identical output to
  today). Scope this card to METHODS ONLY (`_method_line`) - do not also change `_property_line`,
  `_member_line`, or any other rendering function; a future card can extend this to properties if
  warranted, once this one is proven safe in production.

  THEN, for ALL 25 files this card's own grep found (re-discover the real, current list yourself -
  do not trust this card's list is still complete or accurate), run the full affected test suite
  WITH your fix applied and get the real, authoritative list of now-failing tests (do not guess
  which ones break from reading alone - the grep only finds literal-string candidates, not which
  ones actually correspond to a method with a real non-empty `doc` field). For EACH real failure:
  if the test's own real fixture method has a non-empty `doc`, update ONLY that specific assertion
  to include the new `_doc_suffix`'s real output (reusing the REAL doc text from the real fixture,
  never inventing text) - every other assertion in that same test, and every other test in that
  file, must stay byte-for-byte unchanged. If a test's own PURPOSE is specifically to pin the
  ABSENCE of extra suffix content (e.g. a "no pilot ever gets worse"-style regression guard), do
  not silently update it to tolerate new content - stop and report that specific case rather than
  guessing whether it should change.

  FINALLY, add new, real-corpus-backed end-to-end tests (in `tests/mcp/tools/`, following whichever
  existing test file's own convention for real-pilot-data `get_symbol`/`list_members` assertions
  most closely matches this shape - e.g. `test_round3_unsupported_markers.py`'s own real-data
  template) proving the ORIGINAL round-2 case: `get_symbol`/`list_members` for `pdf/typescript`'s
  real `Document.New` now shows its real doc summary text, and a method with no doc (pick a real
  one from the same fixture) renders with no suffix at all, exactly as before.

  ADDED after attempt 1 (same card, widened - not a new card, per the supervisor's own
  "never weaken a check" rule): attempt 1's real fix is correct and complete, but
  `tests/deploy/test_served_provenance.py`'s own `test_p1_and_p2_over_the_committed_data_of_every_pilot`
  now genuinely fails for 15 real pilots (`3d_java`, `3d_net`, `cells_cpp`, `cells_go`, `cells_java`,
  `cells_net`, `cells_rust`, `pdf_go`, `pdf_java`, `pdf_net`, `pdf_typescript`, `slides_cpp`,
  `slides_java`, `slides_net`, `words_net`) - confirmed by the supervisor running it directly in
  both the TC-727 worktree (16 failures) and a clean `main` checkout (0 failures, same command) -
  because each pilot's committed BAKED `infra/demo-manifests` generation was built before this
  card's fix and so lacks the new doc-suffix text its own fixture's `doc` field would now produce;
  this is a genuine, already-precedented infra-staleness gap (TC-533/TC-536's own documented
  pattern: fixture/renderer correctly ahead of a baked generation, the baked data not yet
  re-ingested), never a code defect to fix in `chunk_builder.py` itself. A 16th failure
  (`test_p2_fails_when_a_served_generation_was_edited_after_the_fact`, hardcoded to `cells_net`
  specifically, not parametrized) fails for the identical root cause: its own "unedited" expected
  line now includes a doc suffix that `cells_net`'s stale baked generation does not yet have.

  FIX (reusing the EXISTING, already-wired `STALE_BAKED_PILOTS` mechanism in
  `tests/deploy/test_fleet_consistency.py` - `tests/deploy/test_served_provenance.py` already
  imports and consults it at its own line ~580; do not invent a new mechanism): add all 15 real
  affected pilot keys to `STALE_BAKED_PILOTS` with a dated reason citing this card and the real
  root cause (re-verify the real 15 yourself - do not trust this list blindly, re-run the
  parametrized test first to get the authoritative current list). For the 16th, hardcoded-pilot
  test: re-verify independently which of the 17 unaffected pilots' first `sample_method_pairs`
  entry is unaffected (the supervisor's own quick check suggests `cells_python`, but confirm this
  yourself before committing to it - do not swap to a pilot that turns out to also be stale), then
  change the test's hardcoded `key, family, platform = "cells_net", ...` tuple to that pilot, with
  a one-line comment citing this card and explaining why - the test's own invariant (a post-hoc
  edit to a served generation is detected) is pilot-agnostic, so this is a scope-preserving subject
  swap, never a weakening of what the test actually asserts. Do NOT silently touch
  `chunk_builder.py` or any other production file to "fix" this - it is not a code defect.
