negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/indexing/chunk_builder.py'); s = p.read_text(encoding='utf-8'); old = '_doc_suffix(method)'; count = s.count(old); assert count == 1, 'the expected call-site literal was not found exactly once - if your real fix calls this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; p.write_text(s.replace(old, '', 1), encoding='utf-8')"
  rationale: >-
    Removes the new doc-suffix call from `_method_line` entirely, which must make the new
    end-to-end test for `Document.New` fail (its doc text no longer renders) - a targeted removal
    of exactly the new behavior this card adds, never touching any pre-existing suffix function.
