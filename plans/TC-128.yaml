id: TC-128
gate: G2
lane: transport-deployment
purpose: 'Add a real .github/workflows/ci.yml - confirmed directly that .github/workflows/
  today contains only mirror-gitlab.yml, even though scripts/ci_check.sh (this project''s
  own pre-push gate) already defines exactly what CI should run: lint, format, typecheck,
  pytest (excluding e2e/infra, which need Docker/network this runner may not have),
  and gatectl validate. Every commit in this repo''s history has so far only ever
  been checked locally by whoever pushed it.'
depends_on: []
write_paths:
- .github/workflows/ci.yml
satisfies:
- REQ-G2-047
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '## 22. Verification obligations mapped to gates (extends §10''s and §18''s
    acceptance tests with the items §8 of the Round-6 review specifically required)'
  sha256: b417ef557a656b43c9fec9afeb5cbb1d856e9db8f3056ec331c464c5e0ab0d23
inputs:
- Read scripts/ci_check.sh in full first - it is the real, already-working local gate;
  the workflow should run the SAME steps (lint, format, typecheck, pytest, gatectl),
  not reinvent them, so local and CI can never silently diverge.
- Install from requirements.lock with --require-hashes (matching this project's own
  documented hash-pinning convention - see docs/DECISION_LOG.md's 2026-09-11 requirements.lock
  entry) - never a bare `pip install -e .` that could pull unpinned versions.
- Scope pytest to exclude tests/e2e and tests/infra (both need Docker/real network
  clones a GitHub-hosted runner cannot reliably provide) - run the exact scope this
  project's own supervisor sessions already use for a fast sanity pass.
- Trigger on push and pull_request against main. Use actions/checkout and actions/setup-python
  (Python 3.13, matching pyproject.toml's requires-python).
- Do not touch scripts/ci_check.sh itself or mirror-gitlab.yml - purely a new, additive
  workflow file.
actions:
- Add .github/workflows/ci.yml exactly as specified.
- Validate it with a YAML parse (actionlint if available, otherwise a plain yaml.safe_load)
  to catch a syntax error before it ever reaches GitHub.
checks:
- command: '{python} -c "import yaml,pathlib;d=yaml.safe_load(pathlib.Path(''.github/workflows/ci.yml'').read_text(encoding=''utf-8''));assert
    d.get(''jobs''), ''no jobs defined'';steps=[s for j in d[''jobs''].values() for
    s in j.get(''steps'',[])];runs='' ''.join(s.get(''run'','''') for s in steps);assert
    ''ruff'' in runs or ''ci_check'' in runs, ''no lint/format/ci_check step found'';assert
    ''pytest'' in runs or ''ci_check'' in runs, ''no pytest step found'';assert ''require-hashes''
    in runs, ''dependency install does not use --require-hashes'';print(''ci.yml structurally
    valid'')"'
  expect: exit 0
  timeout_seconds: 30
  junitxml: false
  proves:
  - REQ-G2-047
min_tests: 0
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('.github/workflows/ci.yml');s=p.read_text(encoding='utf-8');s=s.replace('scripts/ci_check.sh','scripts/ci_check_DISABLED.sh');p.write_text(s,encoding='utf-8')"
  rationale: Renaming the scripts/ci_check.sh reference the workflow depends on (if
    the worker's real implementation invokes ci_check.sh directly - if instead it
    reimplements the same steps inline, the worker must adapt this exact mutate to
    target whatever real, load-bearing string its own implementation actually contains,
    self-checking it the same way before persisting) breaks the structural check's
    own 'no lint/format/ci_check step found' assertion. Self-checked before being
    persisted.
evidence:
- evidence/build/G2/TC-128/receipt.json
closeout:
- .github/workflows/ci.yml exists, is valid YAML, and runs real lint/format/typecheck/pytest/gatectl
  steps with hash-pinned dependency installation.
- Breaking the reference to the real check step fails the structural check.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
