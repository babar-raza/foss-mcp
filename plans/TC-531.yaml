  mutate: |
    python -X utf8 -c "import json,pathlib;p=pathlib.Path('tests/fixtures/3d_java/api_surface.json');d=json.loads(p.read_text(encoding='utf-8'));[t.__setitem__('properties',[q for q in t.get('properties',[]) if q.get('name')!='x']) for t in d['types'] if t.get('name')=='Quaternion'];p.write_text(json.dumps(d,indent=2,sort_keys=True)+chr(10),encoding='utf-8')"
