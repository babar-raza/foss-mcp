id: TC-531
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-10, RST-01 pdf/java part, AGT-05, AGT-07 Java part). RE-EXTRACT THE FIVE JAVA
  FIXTURES. Measured by the reviewers on the shipped index: varargs are dropped in 6 of 6 cases (`setPages(int... pages)` is served `setPages()`);
  generic bounds and `throws` clauses are never rendered; public fields are not exposed (Quaternion.x, y, z, w and Vector3.x, y, z are public doubles:
  34 properties missing in 3d/java) while getter-derived pseudo-properties (`identity`, `zero`, `length`) read like fields; `static` is marked on none
  of the 71, 76 and 159 static methods counted, so a static `multiply(a, b)` and an instance `multiply(q)` are indistinguishable; pdf/java indexes 300
  of 1239 types and 193 of those 300 are engine internals (org.aspose.pdf.engine.xfa.*, engine.script.js.interp.*) while its README names types that
  are not indexed (README recall top-3 was 33 percent). A prototype extraction on 2026-10-15 with the unmerged extractor at the pin and no cap kept
  1239 of 1239 pdf/java types (640 of them under an `engine` segment, 11.6 MB of JSON) and left 4 of 914 README identifiers unresolved (99.6 percent).
  This card regenerates 3d_java, cells_java, jmap_java, pdf_java and slides_java at their pinned commits with the merged extractor (TC-520 selection,
  TC-526 Java fidelity, TC-527 Javadoc member documentation), raises pdf_java to its whole surface (cap 1239 in the extractor call, the chart and
  docker-compose), regenerates the allowlist, and pins the Java facts at fixture level. What it does NOT change: src/, any furnished page,
  infra/demo-manifests, sidecars, memory limits (the supervisor re-measures the pdf/java Job at 1239 types).
