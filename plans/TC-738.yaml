id: TC-738
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a fifth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism `TC-733`/`TC-735`/`TC-736`/`TC-737` already use for other pilots (sibling cards,
  different pilots, zero file overlap - do not touch anything any of them touch). Confirmed
  needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates` already
  auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through the exact same `verify_python_example`
  pipeline `TC-733` already proved for `cells/python`, publishing only the ones that pass.

  `barcode/python` currently serves only 6 real example chunks (confirmed directly against the
  real committed `infra/demo-manifests/barcode__python__self_extracted` generation) - its real
  pinned repository is `aspose-barcode-foss/Aspose.BarCode-FOSS-for-Python` (re-confirm the exact
  pinned commit yourself from `config/products/barcode/python.yaml` - do not trust this card's own
  citation blindly). The real upstream repository has a genuine `examples/` directory of roughly 4
  real sample files (per this project's own Appendix-C style accounting for this pilot) - CONFIRM
  their real shape directly (standalone scripts, or `unittest`-wrapped like `cells/python`'s own
  samples turned out to be - `TC-733`'s own closeout is your direct precedent for how to handle
  either shape) by reading all of them yourself, do not assume.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `barcode/python` from 6 to AT MOST 11 served examples, not to its own
  real floor (9, Appendix C - already close; this card may fully close this pilot's floor if even
  a few real examples verify, report honestly either way). This card's job is the real, bounded,
  immediately shippable slice: up to 5 new, real, individually-verified authored examples, each
  drawn from real upstream sample logic (plus real additional API-surface-derived operations if
  the shipped sample count alone is too small to reach 5 - the same `cells/rust`-style mixing
  `TC-737` also allows), each passing the real ingestion verifier before being trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/barcode_python/authored_examples.yaml
  - tests/indexing/test_authored_examples_barcode_python.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_rust/authored_examples.yaml` AND
    `tests/indexing/test_authored_examples_cells_rust.py` in full (your exact templates). Also
    read `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit), and `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `barcode/python`'s real current served example count (6) and real
    pinned repository/commit yourself. Fetch the real upstream `examples/` directory at that exact
    commit and read all of the real files to pick up to 5 real, genuinely distinct, valuable
    operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: install the real pinned package, actually run
    each of your adapted scripts, confirm each one's real assertions pass against real output. Do
    not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns
    before committing.
  - >-
    This card does NOT claim `barcode/python`'s example-corpus work is complete, even if it
    happens to reach this pilot's own 9-example floor - say so honestly either way, and do not pad
    with unverified examples just to hit a round number.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for barcode/python via the existing
    authored_examples.yaml mechanism, raising its served example count from 6 toward 11.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_barcode_python.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/barcode_python/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-738/receipt.json
closeout:
  - >-
    barcode/python gains up to 5 new, real, individually-verified authored examples via the
    existing, already-wired authored_examples.yaml mechanism (zero code change), raising its
    served example count from 6 toward 11 - real, bounded progress reported honestly against its
    own floor.
recovery: Re-run from a clean tree.
