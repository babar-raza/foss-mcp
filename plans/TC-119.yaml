id: TC-119
gate: G2
lane: storage-retrieval
purpose: 'Replace the NON-PRODUCTION pilot-workaround content in all 6 pilots'' furnished
  fixtures with real content sourced directly from each pilot''s own pinned FOSS repository
  README - closing a real, confirmed defect two independent investigations just surfaced:
  TC-013 (2026-09, mission plan #4.7''s own ''Redesign'' section) always documented
  this fixture as ''a PILOT workaround'' standing in for ''a public export bundle
  that Aspose''s own CI must eventually produce'', required to print a NON-PRODUCTION
  banner precisely because it was known to originate from the private Aspose/aspose.org
  reference repo. A direct byte-for-byte comparison (2026-09-28) confirmed all 6 committed
  tests/fixtures/furnished/<pilot>/pages/_index.md files are verbatim, md5-identical
  copies of aspose.org''s own products.aspose.org marketing pages - unreviewed (reviewed:
  false on 11 of the source pages), generated by an internal content skill with no
  mechanism tying it to the real FOSS library''s actual releases (its own provenance.evidence.model_sha
  identifies the generation skill''s model checkpoint, never a commit of the real
  open-source repo). Since the planned search_docs content pipeline (TC-109-118, committed,
  not yet dispatched) will index this exact content, shipping it unchanged means search_docs
  would serve stale, unreviewed marketing copy as if it were real project documentation.
  All 6 pilots'' real READMEs were confirmed fetchable at their exact pinned commits
  via https://raw.githubusercontent.com/<repository>/<commit>/README.md and share
  one common generated heading structure across all 6 repos: an opening paragraph,
  ''## Installation''/''## Quick Start''/''## Dependencies'', ''## Key Capabilities''/''##
  API Reference'', and ''## Scope and Limitations'' (present verbatim in all 6). None
  of the 6 READMEs has an FAQ.md or ''## FAQ'' heading.'
depends_on:
- TC-013
- TC-018
- TC-028
- TC-034
- TC-040
- TC-046
- TC-053
write_paths:
- infra/generate_furnished_page.py
- tests/infra/test_generate_furnished_page.py
- tests/fixtures/furnished/pdf_net/pages/_index.md
- tests/fixtures/furnished/pdf_typescript/pages/_index.md
- tests/fixtures/furnished/pdf_java/pages/_index.md
- tests/fixtures/furnished/pdf_go/pages/_index.md
- tests/fixtures/furnished/slides_python/pages/_index.md
- tests/fixtures/furnished/cells_rust/pages/_index.md
satisfies:
- REQ-G2-047
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 4.7 Redesign: stop depending on `aspose.org`''s private repo for raw
    knowledge — extract it directly instead'
  sha256: 69aa477f81977e0fb19037faa34136c67f06e557075f585ea7b727f4a3882f21
inputs:
- Read scripts/pilot_manual_export.py (TC-013) first, and every pilot's real tests/fixtures/furnished/<pilot>/pages/_index.md
  file in full - both the fields you will replace (overview, content.block[], faq)
  and, just as importantly, the fields you must NOT touch.
- 'ABSOLUTE CONSTRAINT, the single most important rule of this card: single.block[]
  (the worked code examples) in every one of the 6 files MUST remain byte-for-byte
  IDENTICAL after your change. This field is already the real, live source for src/foss_mcp/indexing/example_candidates.py''s
  compile-verified example pipeline (TC-066/079/090, all ACCEPTED and in production),
  and every one of the 6 pilots'' own already-accepted E2E tests (tests/e2e/test_<pilot>_live_content.py)
  hardcodes a REAL_EXAMPLE_SYMBOL constant naming a specific symbol/example that already-published
  pipeline currently produces from this exact, unchanged text. Changing single.block
  AT ALL - even reformatting - risks silently breaking 6 already accepted, already-pushed-to-main
  gates. Read each file''s own single.block first, and prove in your own test that
  it is unchanged (e.g. hash it before and after, or diff it directly).'
- 'REQUIRED, exact shape (function name load-bearing for the negative control): `readme_derived_doc_fields(repository:
  str, commit: str) -> dict` in infra/generate_furnished_page.py. It must: (1) fetch
  the real README.md at https://raw.githubusercontent.com/{repository}/{commit}/README.md
  over a real HTTP request (use urllib.request from the standard library - no new
  dependency), (2) parse it by the confirmed common heading structure into the same
  3 fields the existing Hugo front matter already carries: overview (title+content
  from the opening paragraph), content.block[] (Installation/Quick Start/Dependencies
  as one title_left/content_left pair, Key Capabilities/API Reference as a second
  title_right/content_right pair - or whatever grouping is real and faithful to each
  README''s actual real section boundaries; do not force an artificial split if the
  real structure doesn''t support one), plus one more block sourced from ''## Scope
  and Limitations'' (this is real source content, map it to search_docs''s own troubleshooting
  content_type bucket - check src/foss_mcp/mcp/tools/search_docs.py''s own classify_content_type
  hints first so your block''s own text actually classifies the way you intend), (3)
  return faq with enable: false and an empty list for every pilot, since no real FAQ
  source exists in any of the 6 READMEs - do not fabricate FAQ content.'
- 'A second, real, already-available source for extra developer_guide depth: each
  pilot''s own tests/fixtures/<pilot>/api_surface.json already carries a real ''doc''
  field with doc-comment prose on many types/methods (confirmed present for all 6
  pilots, coverage varies 37%-97%). Using it is optional and only additive - the README-only
  path alone is sufficient to close this card; do not block on parsing api_surface.json
  if it adds meaningfully more complexity than value.'
- Apply readme_derived_doc_fields's real output to each pilot's own real (repository,
  commit) pin (the same ones already used by every ingest-<pilot> docker-compose service
  and by _build_verified_example_chunks) and write the result back into that pilot's
  own _index.md - replacing only overview/content/faq, leaving single.block, layout,
  title, github_url, and every structural/identity field as they are today (or update
  provenance.content_origin honestly to reflect the new real source, e.g. 'readme-derived',
  if you judge that valuable - optional, not required).
- Do not touch scripts/pilot_manual_export.py or any file outside this card's own
  write_paths.
actions:
- Implement readme_derived_doc_fields exactly as specified, fetching each pilot's
  real pinned README for real over the network.
- Regenerate all 6 pilots' overview/content/faq fields from real fetched README content,
  leaving single.block byte-identical in every file - prove this explicitly in your
  own test.
- Run the full existing test suite yourself, especially tests/indexing/test_example_candidates.py
  and any test reading these 6 fixture files, and confirm zero regressions.
checks:
- command: '{python} -m pytest tests/infra/test_generate_furnished_page.py tests/indexing/test_example_candidates.py
    -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-047
min_tests: 8
network: true
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('infra/generate_furnished_page.py');s=p.read_text(encoding='utf-8');s=s.replace('def
    readme_derived_doc_fields','def readme_derived_doc_fields_DISABLED');p.write_text(s,encoding='utf-8')"
  rationale: Renaming readme_derived_doc_fields leaves every reference to it undefined,
    breaking the new test with a NameError, proving the test genuinely depends on
    this concrete function rather than passing for an unrelated reason. Self-checked
    against a realistic synthetic fixture via the real subprocess.run(..., shell=True)
    path before being persisted.
evidence:
- evidence/build/G2/TC-119/receipt.json
closeout:
- All 6 pilots' overview/content/faq fixture content is now real, sourced directly
  from each pilot's own pinned README - no longer a copy of aspose.org's own unreviewed
  marketing pages.
- single.block is proven byte-identical in every one of the 6 files - zero regression
  risk to the already-accepted, already-in-production example-extraction pipeline.
- faq honestly stays empty/disabled for every pilot (no real FAQ source exists) rather
  than fabricating content.
- Renaming readme_derived_doc_fields fails the suite.
recovery: Re-run from a clean tree; if the GitHub raw-content fetch is flaky, re-running
  is safe and idempotent (same pinned commit, same content, every time).
