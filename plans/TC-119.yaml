id: TC-119
gate: G2
lane: storage-retrieval
purpose: 'Replace the NON-PRODUCTION pilot-workaround content in 5 of the 6 proven
  pilots'' furnished fixtures with real content sourced from repository-presenter''s
  own locally SEALED candidate README - not a live upstream GitHub fetch. This supersedes
  this card''s own prior design (originally: fetch README.md directly from raw.githubusercontent.com
  at each pilot''s pinned commit). Superseded because: two independent investigations
  (2026-09-28) first confirmed the existing aspose.org-copied fixtures were unsound
  (verbatim, unreviewed marketing-page copies), then a follow-up investigation confirmed
  the project owner''s own observation that the live upstream README at every one
  of these pilots'' pinned commits was ALREADY produced by repository-presenter (or
  its legacy predecessor foss-readme-optimizer) - matched structurally section-for-section
  against repository-presenter''s own documented 20-section README contract (# title
  / ## Navigation / ## At a Glance / ## Key Capabilities / ## Installation / ## Dependencies
  / ## Quick Start / ## Additional Examples / ## API Reference (### Core API / ####
  Detailed Member Reference) / ## Documentation & Resources / ## Scope and Limitations
  / ## Development and Testing / ## License). repository-presenter''s own README.md
  documents real grounding discipline distinct from aspose.org''s process: it ''reads
  the repository''s own source, manifests, tests, examples, license, and releases
  as ground truth'', runs ''validation against a fixed set of blocking checks and
  an independent, non-authoring review before it can be sealed'', and proves reproducibility
  (byte-identical rerun, zero further LLM calls). BUT repository-presenter''s own
  project status says it ''does not yet open pull requests against target repositories
  - today it produces and seals local README candidates only'' - there is today no
  tag, Co-Authored-By trailer, or other machine-checkable marker on a live upstream
  commit that would let an automated pipeline verify a given live README actually
  came from repository-presenter versus being edited by anyone else afterward. Until
  that marker exists, this card reads repository-presenter''s own local, already-validated
  sealed candidate directly (a real, more strongly grounded, and directly verifiable
  source) rather than trusting the live upstream copy''s unverifiable provenance.'
depends_on:
- TC-013
- TC-018
- TC-028
- TC-034
- TC-040
- TC-046
- TC-053
write_paths:
- infra/generate_furnished_page.py
- tests/infra/test_generate_furnished_page.py
- tests/fixtures/furnished/pdf_net/pages/_index.md
- tests/fixtures/furnished/pdf_java/pages/_index.md
- tests/fixtures/furnished/pdf_go/pages/_index.md
- tests/fixtures/furnished/slides_python/pages/_index.md
- tests/fixtures/furnished/cells_rust/pages/_index.md
satisfies:
- REQ-G2-047
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 4.7 Redesign: stop depending on `aspose.org`''s private repo for raw
    knowledge — extract it directly instead'
  sha256: 69aa477f81977e0fb19037faa34136c67f06e557075f585ea7b727f4a3882f21
inputs:
- 'FUTURE MIGRATION PATH - record this in the script''s own module docstring verbatim
  so it is never lost: once repository-presenter gains the ability to push README
  changes to the real upstream repositories, and the resulting live commit/README
  carries an identifying tag or a `Co-Authored-By: Repository Presenter <...>`-style
  trailer marking its origin, this script''s source should switch from repository-presenter''s
  local sealed-candidate store to a live fetch from raw.githubusercontent.com/<repository>/<commit>/README.md
  (this card''s own original, now-superseded design) - because a live, tagged, upstream-committed
  README is a stronger source once it is verifiable: it is the same file every real
  consumer of the library also sees. This exact trigger is also recorded as a formal,
  schema-tracked open question (see ops/open_questions.jsonl) that blocks G2 gate
  exit until consciously revisited - do not treat this bullet as the only record of
  it.'
- 'REQUIRED, exact shape (function name load-bearing for the negative control): `sealed_candidate_doc_fields(repository:
  str, presenter_root: Path) -> tuple[dict, str]` in infra/generate_furnished_page.py,
  returning (fields, source_commit). repository is the same ''org/repo-name'' string
  already used for --library-repository elsewhere in this project (e.g. ''aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET'').
  Map it to repository-presenter''s own candidate directory naming by replacing ''/''
  with ''__'' (confirmed real convention: ''aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET''
  -> ''aspose-pdf-foss__Aspose.PDF-FOSS-for-.NET''). Read `<presenter_root>/candidates/<mapped-name>/CURRENT`
  (a plain text file containing the sealed candidate''s own commit hash) then `<presenter_root>/candidates/<mapped-name>/<that-commit>/README.md`.
  If CURRENT or README.md is missing for a given repository, raise a clear, real error
  naming exactly which repository and path is missing - do not fall back to fabricated
  or cached content.'
- 'IMPORTANT, confirmed real fact: repository-presenter''s sealed candidate for a
  pilot is NOT necessarily at the same commit this project pins for compile-verified
  examples (--library-commit). Confirmed directly: pdf/net''s sealed candidate is
  at d10e2c829e1e41d3a9529057ad2ea7c7f53b1095 while this project''s own --library-commit
  pin for pdf/net is b7172877651413cff57a8bfe41fb8a8befb2406b (they differ); pdf/java,
  pdf/go, and cells/rust''s sealed candidates happen to already match this project''s
  own pins exactly; slides/python''s differs. Never conflate the two: the doc chunks
  this card''s content feeds into (TC-112''s _build_doc_chunks) must record the CANDIDATE''s
  own source commit in their own Provenance.commit - NOT args.library_commit, which
  stays reserved for the compile-verified example chunks in single.block, completely
  unaffected by this card.'
- 'ABSOLUTE CONSTRAINT, unchanged from this card''s prior design: single.block[] (the
  worked code examples) in every regenerated file MUST remain byte-for-byte IDENTICAL.
  It is the live source for src/foss_mcp/indexing/example_candidates.py''s compile-verified
  example pipeline (TC-066/079/090, ACCEPTED, in production) and every pilot''s own
  accepted E2E test hardcodes a REAL_EXAMPLE_SYMBOL derived from it. Prove this explicitly
  in your own test (hash or diff single.block before/after).'
- 'Parse the sealed candidate''s real, confirmed section structure into the existing
  3 fields: overview (from ''## At a Glance''), content.block[] (one pair from ''##
  Installation'' + ''## Dependencies'' + ''## Quick Start'', a second pair from ''##
  Key Capabilities'' + ''## API Reference''), and a further block from ''## Scope
  and Limitations'' mapped toward search_docs''s troubleshooting content_type (check
  src/foss_mcp/mcp/tools/search_docs.py''s classify_content_type hints first so the
  block''s own text actually classifies as intended). No ''## FAQ'' heading exists
  in repository-presenter''s own README contract - return faq with enable: false and
  an empty list; do not fabricate FAQ content. ''## Additional Examples'' is real
  content but must NOT be fed into any example/compile-verification path (single.block
  is permanently the only source for that) - folding its prose (minus raw code fences)
  into developer_guide content is optional, not required.'
- 'SCOPE, deliberately 5 of the 6 proven pilots: pdf/typescript is excluded from this
  card''s write_paths because repository-presenter has no sealed candidate for it
  yet (confirmed 2026-09-28: only an unsealed runs/clones/ checkout and a runs/transactions/<rev>/source/
  snapshot exist, no candidates/aspose-pdf-foss__Aspose.PDF-FOSS-for-TypeScript/CURRENT).
  Do not attempt to work around this by fetching pdf/typescript''s live upstream README
  instead - that reintroduces the unverifiable-provenance problem this card exists
  to avoid for the other 5. pdf/typescript''s fixture is left untouched (still its
  prior content) and is tracked separately as its own open question - do not add it
  to this card''s write_paths.'
- Take repository-presenter's root as a required `--repository-presenter-root` CLI
  argument (no hardcoded default - keep the script portable). In this real environment
  today it is the sibling checkout at H:\Users\prora\OneDrive\Documents\GitHub\repository-presenter.
actions:
- Implement sealed_candidate_doc_fields exactly as specified, reading real sealed
  candidate files for real.
- Regenerate the 5 in-scope pilots' overview/content/faq fields from real sealed-candidate
  README content, leaving single.block byte-identical in every file - prove this explicitly
  in your own test.
- Run the full existing test suite yourself, especially tests/indexing/test_example_candidates.py
  and any test reading these 5 fixture files, and confirm zero regressions.
checks:
- command: '{python} -m pytest tests/infra/test_generate_furnished_page.py tests/indexing/test_example_candidates.py
    -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-047
min_tests: 8
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('infra/generate_furnished_page.py');s=p.read_text(encoding='utf-8');s=s.replace('def
    sealed_candidate_doc_fields','def sealed_candidate_doc_fields_DISABLED');p.write_text(s,encoding='utf-8')"
  rationale: Renaming sealed_candidate_doc_fields leaves every reference to it undefined,
    breaking the new test with a NameError, proving the test genuinely depends on
    this concrete function rather than passing for an unrelated reason. Self-checked
    against a realistic synthetic fixture via the real subprocess.run(..., shell=True)
    path before being persisted.
evidence:
- evidence/build/G2/TC-119/receipt.json
closeout:
- 5 of the 6 proven pilots' overview/content/faq fixture content is now real, sourced
  directly from repository-presenter's own sealed, validated, reviewed README candidate
  - no longer a copy of aspose.org's own unreviewed marketing pages.
- pdf/typescript is explicitly, visibly left on its prior content, tracked by its
  own open question - not silently stale.
- single.block is proven byte-identical in every regenerated file - zero regression
  risk to the already-accepted, already-in-production example-extraction pipeline.
- Each regenerated doc chunk's own Provenance.commit correctly names the sealed candidate's
  real source commit, not this project's own --library-commit pin, wherever the two
  differ.
- Renaming sealed_candidate_doc_fields fails the suite.
recovery: Re-run from a clean tree; this card is idempotent from committed content
  and the local repository-presenter checkout's own sealed candidates.
