negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/indexing/generation_manifest.py');s=p.read_text(encoding='utf-8');old='PRODUCTION_MIN_SYMBOLS = 3';assert s.count(old)==1;p.write_text(s.replace(old,'PRODUCTION_MIN_SYMBOLS = 0'),encoding='utf-8')"
  rationale: >-
    Drops the symbol floor of the production policy to 0, so a generation with two (or zero) symbols is accepted: the refusal tests, the constants
    test and the CLI default-refusal test fail. A real break of the card's central claim (a production publish may not ship a symbol-less
    generation).
evidence:
- evidence/build/G3/TC-510/receipt.json
closeout:
- >-
  A production publish refuses generations that lose a whole kind, fall under 3 symbols or 1 doc, erode by repeated cuts, duplicate or blank chunks,
  or change repository; an intentional shrink is accepted only with an exactly matching, logged `--accept-regression ... --reason`; rollback has
  --list and --previous and validates its target; lease and CAS are serialised; writes are fsynced; old generations are pruned. Supervisor, after
  integration: rebuild the ingestion image and run one real re-ingest of one pilot on the kind cluster to confirm the floors do not refuse a real
  generation (the 40 baked ones were checked offline); the DEPLOYMENT.md rollback Job manifest has never been applied on the cluster.
recovery: Re-run from a clean tree.
