inputs:
- >-
  Read, in full, src/foss_mcp/indexing/generation_manifest.py (`GenerationManifestStore._read_json` / `_atomic_write_json` / `acquire_lease` /
  `cas_activate` / `read_active` / `generation_exists`, `assert_publish_is_safe`, `_document_count`, `publish`, `rollback`),
  src/foss_mcp/indexing/publisher.py (`publish_generation`, `rollback_generation`), infra/ingest.py (`main`, argparse block L263-306),
  infra/rollback.py, and the section headings of docs/DEPLOYMENT.md. Read the existing tests that pin what must stay true:
  tests/indexing/test_generation_manifest.py (TC-242 / TC-253 guard tests: `assert_publish_is_safe(0, None)` raises, `(1, 4)` raises, `(2, 4)` and
  `(5, 4)` pass; a refused publish writes no generation file), tests/indexing/test_generation_manifest_containment.py (L196-214 pins the exact
  scope-directory listing `active_pointer.json, generation__v1.json, lease_state.json` after a plain `publish(...)`: so a `publish` WITHOUT a policy
  must write no `publish_log.jsonl` and must leave no lock file behind), tests/indexing/test_publisher.py (L648-689 compares the published payload with
  `{vector_index, lexical_index}` exactly: so `payload.stats` is added ONLY when a policy is given), tests/infra/test_ingest.py and tests/infra/test_rollback.py.
  The reviewer's working prototypes are the base for the new tests and are NOT importable by the worker: the scenarios are P1-P12 of a script that
  builds chunks `mk(kind, i)` in three kinds (symbol: text starts `FQN: Sym<i>` / `Kind: type_spec`; doc: `FQN: Doc: Guide<i>`; example:
  `FQN: Example: Demo<i>`), publishes them with `publish_generation` and a `HashingEmbeddingProvider`, and then checks the pointer. Rebuild that
  helper inside the new test files. Never print or log any environment value.
- >-
  KIND CLASSIFICATION (one function, used for new and for legacy generations so baselines are comparable). In generation_manifest.py define
  `classify_chunk_text(text: str) -> str` returning "example" when the text starts with `FQN: Example: `, "doc" when it starts with `FQN: Doc: `,
  "symbol" for any other text starting with `FQN: `, else "other". Verified on the 40 baked generations (infra/demo-manifests/*/generation__*.json):
  6840 symbol, 748 doc, 183 example, 12 other documents in total. Define `payload_stats(payload) -> dict` returning
  `{"symbols", "docs", "examples", "other", "total"}` computed from `payload["lexical_index"]["documents"][*]["text"]` (a payload without a lexical
  index yields all zeros). A document whose `text` is not a str counts as "other".
- >-
  POLICY AND CONSTANTS in generation_manifest.py, each on ONE line exactly as written (the negative control edits the first): `PRODUCTION_MIN_SYMBOLS = 3`,
  `PRODUCTION_MIN_DOCS = 1`, `RETENTION_KEEP_LAST = 3`, `MIN_BASELINE_FOR_PERCENT_RULE = 5`, `POINTER_MAX_BYTES = 64 * 1024`,
  `PUBLISH_LOG_NAME = "publish_log.jsonl"`. Add `@dataclass(frozen=True) class PublishPolicy` with fields and defaults:
  `min_symbols: int = PRODUCTION_MIN_SYMBOLS`, `min_docs: int = PRODUCTION_MIN_DOCS`, `max_drop: float = 0.5`, `max_symbol_drop: float = 0.2`,
  `history: int = RETENTION_KEEP_LAST`, `accept_regressions: tuple[tuple[str, int, int], ...] = ()`, `reason: str | None = None`,
  `held_by: str = ""`, `prune: bool = True`, `generation_min_age_seconds: float = 3600.0`. `PublishPolicy()` IS the production policy; the legacy
  behaviour is `policy=None`. Add no new exception type: the single existing `PublishSafetyError` is raised for every refusal.
- >-
  `publish(store, scope, expected_active, generation, lease, policy: PublishPolicy | None = None)`. With `policy=None` the function is byte for byte
  today's behaviour (validate_manifest, `assert_publish_is_safe` against the active document count, write_and_validate, cas_activate) and writes no
  log. With a policy: (1) `validate_manifest`; (2) `stats = generation.payload.get("stats") or payload_stats(generation.payload)`; (3) baseline =
  per-kind MAX over the stats of the ACTIVE generation (its `payload.stats`, else `payload_stats(its payload)`) and of the last `policy.history`
  `published` entries of the scope's publish_log.jsonl, scanning newest to oldest and STOPPING after (and including) the first entry that carries a
  non-empty `overrides` list, so an accepted shrink resets history and the next ordinary publish at the new size is not refused; (4) refusals, each
  raising `PublishSafetyError` BEFORE anything is written, and each also appending one `{"event": "refused", ...}` line to the log: total == 0;
  `stats.symbols < policy.min_symbols`; `stats.docs < policy.min_docs`; `stats.duplicate_chunk_ids > 0`; `stats.empty_text_chunks > 0`; the stats
  `repositories` list differs from the ACTIVE generation's `repositories` list when both exist (a legacy active generation without the field skips
  this check; this refusal is never overridable and its message says a deliberate repository change needs a new store); for each kind in
  symbols/docs/examples/total where baseline >= MIN_BASELINE_FOR_PERCENT_RULE: new < baseline * (1 - limit) with limit `policy.max_symbol_drop` for
  symbols and `policy.max_drop` for the others; and examples baseline >= 3 with new == 0. The equality cases are accepted (symbols 40 -> 32 is exactly
  20 percent and passes; 100 -> 50 total passes; the existing `assert_publish_is_safe` contract is unchanged). (5) An override
  `(kind, old, new)` in `policy.accept_regressions` waives ONLY the percent/zero-example refusal of that kind (kind in symbols, docs, examples,
  total), and only when `old` equals the observed baseline and `new` equals the observed new value; a non-matching override raises
  `PublishSafetyError` naming the observed numbers. The floors, duplicates, empty text, repository identity and the empty-generation refusal can
  never be waived. `policy.accept_regressions` without `policy.reason` raises `PublishSafetyError`. (6) Every percent refusal message ends with the
  exact flags that would accept it, for example `to accept deliberately: --accept-regression symbols:100->46 --reason TEXT`; floor/identity/
  duplicate/empty messages carry no such hint. (7) After `cas_activate` succeeds append `{"ts", "event": "published", "scope", "generation_id",
  "previous_active": expected_active, "held_by", "stats", "baseline", "overrides": ["symbols:100->46", ...], "reason", "floors": {"symbols", "docs"}}`
  and, if `policy.prune`, call `store.prune(scope, protect=(expected_active,), generation_min_age_seconds=policy.generation_min_age_seconds)`.
- >-
  STORE METHODS on `GenerationManifestStore`: `append_publish_log(scope, entry)` (one json line, key-sorted, then flush and fsync; creates the scope
  directory), `read_publish_log(scope) -> list[dict]` (a missing file is `[]`, a malformed line is skipped), `list_generations(scope) -> list[str]`
  (generation ids found as `generation__*.json` in the scope directory, newest version first by descending version string, ids read from the files'
  own `generation_id`), `previous_generation(scope) -> str | None` (the `previous_active` of the newest `published` or `rollback` log entry if that
  generation still exists; else the second entry of `list_generations`; else None), `prune(scope, *, keep_last=RETENTION_KEEP_LAST,
  tmp_max_age_seconds=3600.0, generation_min_age_seconds=3600.0, protect=(), now=None) -> list[str]` (keeps the active generation, every id in
  `protect`, the log-derived previous generation, and the `keep_last` newest by version; deletes every other `generation__*.json` older than
  `generation_min_age_seconds` and every `.tmp-*` file older than `tmp_max_age_seconds` (by mtime); NEVER deletes an active or protected file even if
  old; appends one `{"event": "pruned", "removed": [...]}` log line when it removed anything; returns the removed file names), and
  `_fsync_directory(path)` (staticmethod; on `os.name == "posix"` open the directory read-only and `os.fsync` it, swallowing OSError; a no-op
  elsewhere). All of these use the contained scope directory from `_scope_dir`; none may follow a path outside the store root.
- >-
  DURABILITY AND READS. `_atomic_write_json`: `fh.flush()` then `os.fsync(fh.fileno())` before `os.replace`, and `_fsync_directory(path.parent)`
  after it. `_read_json(path, max_bytes=None)`: open in binary, if `max_bytes` is given read `max_bytes + 1` bytes and raise
  `GenerationManifestError("... exceeds 64 KiB")` when longer, decode with `utf-8-sig` (so a BOM written by PowerShell is tolerated; generation
  files too), then `json.loads`; a missing file still returns None. `read_active`, `current_fencing_token` (lease_state) pass `max_bytes=POINTER_MAX_BYTES`.
  A pointer with a BOM now reads; an oversized pointer raises `GenerationManifestError` (the serving layer's handling of that is TC-5xx, not here).
- >-
  EXCLUSIVE LOCK. Add `GenerationManifestStore.scope_lock(scope)` (a context manager) and constructor keywords `lock_timeout: float = 60.0` and
  `lock_stale_seconds: float = 30.0`. The lock is an `os.open(..., O_CREAT | O_EXCL | O_WRONLY)` file `.publish.lock` in the scope directory holding
  the pid and a timestamp, removed in `finally`. A lock whose mtime is older than `lock_stale_seconds` is removed and taken (a crashed holder); a
  caller that cannot get it within `lock_timeout` raises `GenerationManifestError`; retry on FileExistsError and PermissionError with a short sleep.
  Wrap in it the whole read-increment-write of `acquire_lease` and the whole token-check / compare / write of `cas_activate`. Nothing else holds it
  (generation writes, log appends and prune take no lock, so the lock is held for milliseconds). Because it is removed on exit, the scope directory
  listing after `publish` is unchanged.
- >-
  ROLLBACK. `rollback(store, scope, expected_active, target_generation_id, lease, *, validate: bool = False)`: in all cases, after the existing
  `generation_exists` check (keep its order and its `UnknownGenerationError`), refuse a target whose id is not of the form `<scope>::<version>` (the id
  minus its last `::` component must equal `scope`) with `UnknownGenerationError` (GRR-08). With `validate=True` also read the generation and
  require `check_generation_shape(manifest) == []`, else raise `ManifestValidationError` listing the problems. Define `check_generation_shape(manifest)
  -> list[str]`: `lexical_index.documents` is a non-empty dict; each document has a str `chunk_id`, a list `tokens` and a non-empty str `text`;
  `lexical_index.doc_freq` is a dict; the manifest's inside `generation_id` equals the requested one. Append a `{"event": "rollback", "scope",
  "generation_id", "previous_active": expected_active}` log line after every successful rollback (with or without `validate`).
  Existing tests call `rollback(...)` with `_lexical_index` documents whose text is empty: with `validate=False` they must pass unchanged.
- >-
  src/foss_mcp/indexing/publisher.py: `publish_generation(..., policy: PublishPolicy | None = None)`. When `policy` is given, after building the
  payload add `payload["stats"] = build_generation_stats(chunks, chunk_ids)` where `build_generation_stats` (module-level, in publisher.py) returns
  `{**payload_stats({"lexical_index": <the built lexical index>}), "duplicate_chunk_ids": len(chunk_ids) - len(set(chunk_ids)),
  "empty_text_chunks": <count of chunks whose text is not a str or is blank after strip>, "repositories": sorted(set of
  chunk.provenance.repository)}` and pass `policy` to `manifest_publish`. Chunks with `text=None` (reviewer scenario P6b raised an
  `AttributeError` out of `tokenize`) must be counted as empty text and must not raise: with a policy, FIRST compute the duplicate and empty-text
  counts from the chunks, and when either is above zero append a `refused` line via `store.append_publish_log` and raise `PublishSafetyError`
  BEFORE building any index (share one small helper in generation_manifest.py with `publish` so the refusal and its log line are written in one
  place). With `policy=None` nothing changes. `rollback_generation(..., validate=False)`
  passes the new keyword through.
- >-
  infra/ingest.py: import `PublishPolicy`, `PRODUCTION_MIN_SYMBOLS`, `PRODUCTION_MIN_DOCS`. New options: `--min-symbols` (int, default
  PRODUCTION_MIN_SYMBOLS), `--min-docs` (int, default PRODUCTION_MIN_DOCS) with help text saying they exist for tiny test fixtures and must not be
  lowered for a pilot; `--accept-regression KIND:OLD->NEW` (repeatable, action append; parse with a function raising `argparse.ArgumentTypeError`
  for anything but `symbols|docs|examples|total`, a non-negative integer old and new, the exact `->` separator) and `--reason TEXT`. After parsing:
  if any `--accept-regression` is given without a non-blank `--reason`, call `parser.error(...)` (exit 2). Build `PublishPolicy(min_symbols=...,
  min_docs=..., accept_regressions=tuple(...), reason=args.reason, held_by=args.held_by)` and pass `policy=policy` to `publish_generation`. Do not catch
  `PublishSafetyError`. Do not add a floor or override to docker-compose.yml or the chart (they take the production defaults; a test below asserts it).
- >-
  infra/rollback.py: make `--target-generation` optional and add `--list` and `--previous` in one required mutually exclusive group with it (none of
  them given, or two given, is an argparse error, exit 2). `--list` prints, for the scope, one line per generation newest first: the generation id, the
  word `ACTIVE` next to the active one, and `symbols=N docs=N examples=N total=N` taken from `payload.stats` or else `payload_stats(payload)`; it
  takes no lease and writes nothing. `--previous` resolves `store.previous_generation(scope)` (raising `UnknownGenerationError` when None) and rolls
  back to it. `--target-generation` keeps its behaviour. All rollbacks call `rollback_generation(..., validate=True)`. Keep the printed line
  `rolled back to <id>`.
- >-
  docs/DEPLOYMENT.md: insert, immediately BEFORE the `## Troubleshooting` heading (tests/deploy/test_runbook.py slices the text between
  `## Troubleshooting` and `## Known limits`, so the new sections must not be inside that slice), two sections. `## Rolling back a generation`:
  the ingestion image already contains `infra/rollback.py`; the manifests claim is `foss-mcp-<family>-<platform>-manifests` mounted read-only by
  serving, `ReadWriteOnce`, so the rollback Job must run on the same node (add a `nodeName`); show one complete Job manifest (kind Job, image =
  the chart's ingestion image and tag, runAsUser 10001, fsGroup 10001, volume from that claim at /data/manifests, `command: ["python",
  "/app/infra/rollback.py", ...]`) and the three argument forms `--list`, `--previous`, `--target-generation <id>`, with the exact flags
