id: TC-510
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review, findings GRR-05, GRR-06, GRR-07, GRR-08, GRR-09, GRR-14). PUBLISH SAFETY. The reviewer drove the real
  publisher (`publish_generation`) with synthetic generations on a scratch store. The guard in src/foss_mcp/indexing/generation_manifest.py
  (`assert_publish_is_safe`, called from `publish`) compares only the TOTAL document count with the active generation. Measured: a generation that
  lost ALL symbols (40 symbols, 50 docs, 10 examples -> 0/50/10), or ALL docs, or ALL examples, or went 40 -> 1 symbols, was ACTIVATED; a generation
  with the same count but wholly different content (another product) was ACTIVATED; 50 chunks with empty text were ACTIVATED; 50 chunks of unrelated
  prose with no FQN line were ACTIVATED; 100 identical chunks collapsed into 1 document and were ACTIVATED on a fresh scope; a first publish of ONE
  trivial chunk was ACTIVATED; repeated 50 percent cuts erode a scope without ever tripping the check (each is compared only to the previous
  generation). There is no supported way to accept a legitimate shrink: the jmap_go pilot shrank 153 -> 58 documents and was published only by
  renaming active_pointer.json aside by hand, which disables every guard, and a PowerShell-written pointer with a UTF-8 byte-order mark makes
  /readyz answer 500. infra/rollback.py can name any generation id: a foreign-prefix id with an existing version suffix was accepted and left the
  pointer on content that does not exist (GRR-08), and nothing lists the retained generations. The lease/CAS pair is unlocked: in 3 of 30 concurrent
  two-process trials both publishers held fencing token 2 (GRR-07). No write is fsynced (0 occurrences of fsync in the module), nothing deletes
  orphans (.tmp-* files, unactivated generation files) or old generations (PVCs retain 3 to 5 each) (GRR-09), and the pointer is read whole on every
  probe (a 20 MB file was read per call) (GRR-14). Verified GOOD and preserved: the current total-count behaviour (empty refused, more than 50 percent
  regression refused, exactly half accepted), refused publishes are never written (TC-253), CAS and fencing order, atomic pointer flip. Also
  measured on the 39 inspected cluster ingest logs: `citation: published N` equals the baked generation document count for 39 of 39 pilots, so no real
  pilot contains duplicate chunk ids, and every one of the 40 baked generations has at least 3 symbol chunks and at least 2 documentation chunks (the
  smallest are imaging/net with 3 symbols and 4 docs and tex/python with 4 symbols), so the floors below produce no false positive on the shipped
  fleet. This card adds a `PublishPolicy` that production opts into (infra/ingest.py does; `policy=None` keeps today's behaviour byte for byte so every
  existing caller and test is unchanged): per-kind statistics persisted in the generation (`payload.stats`, additive) and appended to a
  `publish_log.jsonl` beside the pointer; hard floors (symbols at least 3, documentation at least 1); per-kind regression limits against the MAX of the
  last 3 retained generations; refusal of duplicate chunk ids, empty text and a changed provenance repository; an explicit, logged, exactly-matching
  `--accept-regression kind:old->new --reason TEXT` override that never waives the floors, identity, duplicates or empty text; `infra/rollback.py
  --list / --previous` and a validated rollback target; an exclusive lock around lease acquisition and CAS; fsync of files and directories; retention
  (active + previous + last 3, stale .tmp-* removed after 1 hour); a 64 KiB BOM-tolerant pointer read; and the runbook procedures. What does NOT
  change: the sync/async behaviour of serving, any serving code, the Helm chart, docker-compose.yml, the extraction, the shape of lexical_index and
  vector_index, `PublishSafetyError` as the single refusal type, `publish_generation`/`publish`/`rollback` called without the new arguments.
