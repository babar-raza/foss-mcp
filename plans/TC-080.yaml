id: TC-080
gate: G2
lane: verification
purpose: 'Close REQ-G2-050: make the developer-context vision''s live proof a PERMANENT,
  automated, checked artifact - not only the supervisor''s own manual, ephemeral hand-verification
  (done repeatedly today, real, but never committed as a regression test). A real,
  API-naive task question against the real running pdf/net container must return a
  real, composed answer with a genuine verified example - the exact concrete target
  the whole day''s corrective sequence (TC-060 through TC-079) converged on.'
depends_on:
- TC-069
- TC-075
- TC-079
write_paths:
- tests/e2e/test_pdf_net_live_content.py
satisfies:
- REQ-G2-050
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '## 22. Verification obligations mapped to gates (extends §10''s and §18''s
    acceptance tests with the items §8 of the Round-6 review specifically required)'
  sha256: b417ef557a656b43c9fec9afeb5cbb1d856e9db8f3056ec331c464c5e0ab0d23
inputs:
- 'CONFIRMED live, by hand, multiple times today: a real MCP session''s `lookup` tool
  call with the query ''how do I add a watermark to a PDF'' against the real running
  pdf/net container (real docker compose, real ingest-pdf-net then serving) returns
  a real TaskAnswer whose example field contains the real, compile-verified AddWatermarkAnnotation
  C# code and the real source commit b7172877651413cff57a8bfe41fb8a8befb2406b. This
  has never been captured as a real, automated, repeatable test until now - every
  prior proof was a manual, ephemeral verification, real but not durable.'
- Read tests/e2e/test_pdf_net_live_content.py's existing real pattern (the docker
  compose up/down lifecycle, the MCP-over-HTTP session helper, the existing find_examples('watermark')
  test from TC-069) and mirror it exactly for lookup - do not reinvent the container
  lifecycle or session handling.
- The new test must call the real `lookup` tool (not find_examples directly) with
  the exact literal query 'how do I add a watermark to a PDF' (this exact literal
  is required for the negative control below), and assert the structuredContent.result
  shape is a TaskAnswer (has 'doc_matches' and 'example' keys) whose example.snippet
  contains the real string 'AddWatermarkAnnotation' and the real source commit.
- Also assert, in the same or a companion test, that get_symbol('Aspose.Pdf.AFRelationship')
  returns real member values (at minimum the real string 'EncryptedPayload', one of
  its 7 real enum members) - closing the loop on REQ-G2-047's own live proof as a
  permanent artifact too, not just REQ-G2-049's.
actions:
- Add the new lookup-based task-composition test to tests/e2e/test_pdf_net_live_content.py
  exactly as described, reusing the file's existing container-lifecycle fixtures.
- Add the get_symbol richness regression test alongside it.
- Run this yourself for real (real docker compose, real network, real dotnet build)
  and confirm both pass before committing - this is the definitive proof, not a claim.
- Run the full existing file's test suite and confirm nothing else broke.
checks:
- command: '{python} -m pytest tests/e2e/test_pdf_net_live_content.py -q'
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G2-050
min_tests: 6
network: true
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('tests/e2e/test_pdf_net_live_content.py');s=p.read_text(encoding='utf-8');s=s.replace('how
    do I add a watermark to a PDF','how do I add a watermark to a PDF please answer
    nothing useful');p.write_text(s,encoding='utf-8')"
  rationale: Corrupting the exact query text so it no longer matches the real AddWatermarkAnnotation
    example's own indexed content must break the new test's assertion, proving it
    genuinely depends on the real query returning the real, specific content, not
    merely that lookup returns some response. Self-checked end-to-end against a fixture
    implementing the exact prescribed literal before being persisted.
evidence:
- evidence/build/G2/TC-080/receipt.json
closeout:
- A real, automated, permanent test proves a real task question against the real running
  pdf/net container returns a real, composed answer with a genuine verified example
  - the developer-context vision's own concrete target, now a checked artifact rather
  than a one-time manual proof.
- A companion permanent test proves get_symbol's own richness (real enum values) the
  same way.
- Corrupting the query text fails the new test.
recovery: Re-run from a clean tree; if the network clone/build step is flaky, re-running
  is safe and idempotent.
