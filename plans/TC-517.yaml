  SEQUENCING NOTE (supervisor, added at install): TC-520 is ACCEPTED BEFORE this card and already edited infra/build_chunks.py (extraction notice and coverage clauses). Read the merged file on main and keep those changes intact.
- >-
  SUPERVISOR AMENDMENT (after the first report; rework attempt 2). The worker's offline run showed the new chunker breaks nine existing pins in two files the draft did not list; both files and a new survival test are now in
  write_paths. (1) tests/infra/test_ingest_furnished_survival.py: `test_installation_quick_start_and_scope_chunks_are_published_unchanged_but_for_backticks` asserts `"Quick Start" in titles`; merging short neighbours means one
