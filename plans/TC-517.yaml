  asserted one 70,000+ character chunk titled "Core API"; re-pin it to the new contract: the Core API table's first row and its last row are each in some published chunk, no published chunk of that section is over 8,000
  characters, and the section's chunks together are not lost. (2) tests/infra/test_build_chunks.py `test_furnished_page_doc_chunks_survive_real_citable_chunks_pass`: this one is NOT merely a pin. `citable_chunks` drops a WHOLE
  chunk when any single inline-code anchor in it is unsupported (src/foss_mcp/normalization/citation.py `validate_chunk`), so merging sections into 3,000-character chunks widens the blast radius of one bad anchor and can shrink
  the documentation that is actually published. Therefore: write the new offline test tests/infra/test_furnished_chunk_survival.py. For every shipped pilot whose committed furnished page has a committed `api_surface.json`
  fixture (find them under tests/fixtures; the tests in test_build_chunks.py show how pdf/net loads one), compute the SURVIVING doc-chunk characters (sum of the text of the chunks `citable_chunks` keeps, using the real
  `symbol_index_from_api_surface`, `validate_document`, `known_counts_from_fixture`) with the NEW chunker and with the OLD behaviour (the one-chunk-per-section chunker as of `git show dc638072:infra/build_chunks.py`; copy that
  small old function into the test module as `_old_chunks`, clearly named), and assert new_surviving >= 0.9 * old_surviving for each such pilot and that the content origin still has at least one surviving chunk. If a pilot
  misses the 0.9 floor, you MAY lower `TARGET_DOC_CHUNK_CHARS` (never below 1,500, never change MIN or MAX) until every pilot meets it, and say in the commit body which value you chose and the measured ratios per pilot. If no
  value of at least 1,500 meets the floor, STOP and report the measured table (do not weaken the floor). Then re-pin `test_furnished_page_doc_chunks_survive_real_citable_chunks_pass` to assert the content origin survives
  (it should pass again once the target is right; if it only passes after weakening it, report instead). (3) The e2e `REAL_DOC_TASK_QUERY` constants for pdf_net and pdf_typescript may be re-pinned together with the content
  type, with the replay evidence in the comment (the worker found the old wording stops at the developer_guide overview chunks); no other e2e change. (4) All of these new and re-pinned tests are part of check 2.
