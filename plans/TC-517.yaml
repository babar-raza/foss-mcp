id: TC-517
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review; finding RST-09, with RST-12 for the chunk size). DOCUMENTATION CHUNKING AND CATEGORIES. Measured by the reviewers on the shipped
  image and re-measured offline by the drafter on the 40 committed furnished pages (tests/fixtures/furnished/*/pages/_index.md) through the real code path (`extract_doc_sections` ->
  `chunk_document` -> the `FQN: Doc: <title>` prefix of infra/build_chunks.py `_build_doc_chunks`): 753 documentation chunks, of which 123 are shorter than 200 characters, 20 are longer than
  8,000 and 5 are longer than 24,000 (pdf/java 87,160, pdf/net 71,643, words/net 30,922, slides/python 30,365, 3d/python 27,816). The 24,000 cap of `_sanitize_chunk_text` (infra/build_chunks.py
  L337-385, TC-385) then silently cuts the README class tables: pdf/net's chunk ends "Truncated: 47835 characters omitted", so every class after the cut (PdfFileEditor among them) is in neither the
  symbol index (300 of 901) nor the documentation. The cause of the stubs is `chunk_document` (src/foss_mcp/normalization/chunker.py): a body without markdown headings is split at EVERY blank
  line, so (a) the generated lead-in sentence of the "Scope and Limitations" block ("Known issues, unsupported functionality, and other troubleshooting-relevant scope boundaries for X, straight
  from its own sealed, reviewed documentation candidate:", 272-276 characters) becomes a chunk of its own, apart from the list it introduces; because `search_docs.classify_content_type`
  (src/foss_mcp/mcp/tools/search_docs.py) assigns a category by keyword hints found in the chunk TEXT, only that stub lands in "troubleshooting" (16 of 19 reviewed pilots have a single troubleshooting chunk, the
  stub) and the real list lands in "developer_guide"; (b) a FAQ candidate `FAQ: <question>\n\n<answer>` becomes TWO chunks - the question (154 characters) classified faq and the answer classified by whatever words it
  happens to contain; only cells/cpp and pdf/typescript have a FAQ at all; (c) a heading-free table is one paragraph and one chunk. This card changes how documentation candidates are chunked and
  how a documentation chunk is categorised, and nothing else. (1) A new pure module src/foss_mcp/indexing/doc_chunking.py splits one candidate: it takes the sections `chunk_document` already yields,
  keeps a FAQ question and its answer in ONE chunk, joins a section that ends with ":" to the one after it, merges neighbouring sections shorter than 400 characters until a chunk reaches about 3,000
  characters (never inside a fenced code block), and splits anything longer than 7,600 characters at table-row boundaries (repeating the table header and separator rows in every part) or, failing that, at
  line boundaries, finally at the character limit; every chunk of a candidate that has more than one carries the line `Part: <i> of <n>` as its last body line, so the original order is recoverable (the
  product-reference card TC-518 reads it). A measured prototype on the 40 pages gives 368 chunks, none over 8,000 characters (with the FQN, Part and Source-Commit lines), no line of any candidate body lost
  (headings aside, which `chunk_document` already drops), none ending in a colon, and only 10 chunks under 200 characters, all of them complete FAQ question-and-answer pairs. (2) `classify_content_type` decides
  by the SECTION TITLE in the `FQN: Doc: <title>` line when there is one: a first body line starting "FAQ:" is faq; otherwise a title containing troubleshoot, known issue, limitation, unsupported, error or problem is
  troubleshooting; install, quick start, getting started, prerequisite, setup, dependenc or requirement is getting_started; everything else is developer_guide; a chunk with no `Doc:` title keeps the
  old keyword rule (hand-written chunks and every test that builds one are unchanged). With the 40 pages this moves every "Scope and Limitations" chunk to troubleshooting (that is what the page generator
  intended, infra/generate_furnished_page.py L277-285) and every "Installation, Dependencies, and Quick Start" chunk to getting_started. Decisions recorded here. The classification change takes effect on the BAKED data
  at once (the category is computed at serving time from the stored text); the chunking change needs a re-ingest of the pilots, which is a later supervisor step, NOT part of this card - the baked demo manifests are
  not edited. Six live e2e files pin the category of real chunks (they build the real chunks through docker compose and cannot run here): the worker must replay each one OFFLINE (committed furnished page ->
  `_build_doc_chunks` -> an in-memory generation -> `search_docs`) and edit only a pin whose replay shows a different category; the supervisor runs the e2e files at the next image build.
  What does NOT change: the chunker module, symbol and example chunks, the `Doc:` prefix, the 24,000-character guard in `_sanitize_chunk_text` (it stays as a last resort for non-documentation chunks), any
  ranking.
