  e2e files named in write_paths (their REAL_DOC_QUERY / REAL_DOC_CONTENT_TYPE / REAL_DOC_FRAGMENT pins). Never print or log any environment value.
- >-
  src/foss_mcp/indexing/doc_chunking.py (NEW, pure, stdlib plus foss_mcp.normalization). Constants written as exactly these lines: `MIN_DOC_CHUNK_CHARS = 400`, `TARGET_DOC_CHUNK_CHARS = 3000`, `MAX_DOC_CHUNK_CHARS = 7600`
  (the negative control edits the third). `chunk_doc_candidate(candidate: DocCandidate) -> list[Chunk]` builds the document with `make_document` exactly as `_build_doc_chunks` does today (same source_kind,
  content_type "doc", provenance and evidence arguments - pass them in as parameters so the module stays pure), obtains the sections through `chunk_document`, then: (1) FAQ origin: the sections are joined back into ONE
  text (question, blank line, answer); (2) otherwise merge: a buffer takes the next section while it is shorter than MIN_DOC_CHUNK_CHARS, or its last non-empty line ends with ":", or adding the next keeps it
  at or under TARGET_DOC_CHUNK_CHARS; never flush in the middle of a fenced code block (an odd number of ``` lines so far); a final buffer shorter than MIN joins the previous chunk unless that would
  open a fence; (3) split any chunk longer than MAX_DOC_CHUNK_CHARS: a chunk in which at least half of the non-empty lines start with `|` splits at row boundaries and every part after the first starts with the first
  two `|` lines (header and separator) of the original table; any other chunk splits at the last line boundary below the limit; a single line longer than the limit is cut at the limit; (4) when the candidate
  yields more than one chunk, append `\nPart: <i> of <n>` (1-based) to each chunk's text; a single chunk gets no marker. Never drop, reorder or rewrite a line (the only added lines are the Part marker and the
  repeated table header). Deterministic: the same candidate always gives byte-identical chunks.
- >-
  infra/build_chunks.py `_build_doc_chunks`: replace the `for chunk in chunk_document(doc)` loop by `chunk_doc_candidate(...)` and keep the prefix `FQN: Doc: {candidate.title}\n` on every chunk, the printed
  summary line and the return type. The production call site must be this function (a source test asserts `from foss_mcp.indexing.doc_chunking import` and `chunk_doc_candidate(` appear in infra/build_chunks.py).
  `_sanitize_chunk_text` is not changed.
- >-
  src/foss_mcp/mcp/tools/search_docs.py `classify_content_type(text)`: if the first line starts with `FQN: Doc: `, take the title (the rest of that line) and the first body line (the next line, skipping nothing); rules in
  this order: first body line starts with `FAQ:` -> "faq"; title matches (case-insensitive) `troubleshoot|known issue|limitation|unsupported|error|problem` -> "troubleshooting"; title matches `install|quick ?start|getting started|prerequisite|setup|dependenc|requirement`
  -> "getting_started"; else "developer_guide". A text whose first line is not a `Doc:` FQN line goes through the unchanged keyword rule. Update the module docstring of
  src/foss_mcp/indexing/doc_candidates.py ONLY if it is in write_paths - it is not, so leave it (its FAQ-prefix convention stays true and required).
- >-
  Tests, offline, deterministic, no skip/xfail/sleep/network. tests/indexing/test_doc_chunking.py (NEW, synthetic candidates): `test_a_faq_question_and_answer_are_one_chunk`, `test_a_lead_in_ending_with_a_colon_joins_the_list_after_it`,
  `test_small_sections_merge_up_to_about_3000_characters`, `test_a_code_fence_is_never_split_by_a_merge`, `test_a_long_pipe_table_splits_at_row_boundaries_and_repeats_its_header`, `test_a_long_bullet_list_splits_at_line_boundaries`,
  `test_a_single_line_over_the_limit_is_cut_at_the_limit`, `test_part_markers_number_the_chunks_in_order_and_a_single_chunk_has_none`, `test_no_line_is_lost_or_reordered`, `test_chunking_is_deterministic`,
  `test_every_chunk_is_at_most_max_chars`. tests/mcp/tools/test_doc_classification_by_title.py (NEW): one parametrised test over (title, first body line, expected) rows - "Scope and Limitations" -> troubleshooting, "Installation,
  Dependencies, and Quick Start" -> getting_started, "Key Capabilities and API Reference" -> developer_guide, a FAQ question title with a `FAQ:` first body line -> faq even when the title says install, the product title ->
  developer_guide - plus `test_a_text_without_a_doc_title_keeps_the_keyword_rule` (the pre-existing hint behaviour, three cases), `test_the_part_marker_does_not_change_the_category`, `test_search_docs_troubleshooting_now_returns_the_scope_and_limitations_list`
  (an in-memory generation built from one real furnished page as the replica in tests/indexing/test_lookup_doc_fallback_query_safety.py does, but through the NEW chunker: query "known issues" under troubleshooting returns a chunk that
  contains the list, not just the lead-in). tests/infra/test_furnished_chunk_quality.py (NEW, data-driven over EVERY directory of tests/fixtures/furnished except sealed_current, at least 40, through
  `build_chunks._build_doc_chunks` with an `argparse.Namespace(library_repository="o/r", library_commit="0"*40, furnished_page=<path>)`, then `_sanitize_chunk_text` and `_with_source_commit_line` exactly as `main` does; import
  `build_chunks` the way tests/infra/test_build_chunks_sanitize.py does): `test_every_shipped_pilot_has_a_furnished_page`, then per pilot (parametrised) `test_no_doc_chunk_is_over_8000_characters_or_truncated`, `test_no_candidate_line_is_lost`
  (every non-empty, non-heading line of every candidate body appears, stripped, in some chunk of that candidate), `test_troubleshooting_chunks_have_a_real_body` (the text between the FQN line and the Part/Source-Commit lines has at
  least 200 characters for every chunk whose category is troubleshooting), `test_faq_chunks_keep_question_and_answer_together` (a faq chunk has the `FAQ: <question>` line AND a non-empty answer of at least 10 characters; the number of faq
  chunks equals the number of FAQ candidates in the page), `test_categories_derive_from_titles` (the test restates the title rules in its own table and compares), `test_no_chunk_ends_with_a_dangling_colon`, plus
  `test_the_class_table_of_the_longest_pages_is_split_not_cut` for pdf_java, pdf_net, words_net, slides_python and 3d_python (no chunk contains "Truncated:" and the concatenated chunks contain the last row of the original table) and
  `test_build_chunks_calls_the_new_chunker` (the source assertion). At least 35 tests with the parametrised cases.
