  uses it), src/foss_mcp/mcp/tools/relevance.py (`chunk_kind`), infra/generate_furnished_page.py L277-285 and L320-360 (the generated "Scope and Limitations" lead-in), tests/infra/test_build_chunks.py,
  tests/infra/test_build_chunks_sanitize.py, tests/infra/test_build_chunks_extraction_notice.py, tests/indexing/test_lookup_doc_fallback_query_safety.py (its offline replica builds its own doc chunks and calls
