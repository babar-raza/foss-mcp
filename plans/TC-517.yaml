- >-
  Read: infra/build_chunks.py (`_build_doc_chunks` L1108-1168, `_sanitize_chunk_text` L356-385 and `MAX_CHUNK_TEXT_CHARS`, `_with_source_commit_line`, the end of `main` that sanitises then appends the Source-Commit
  line), src/foss_mcp/indexing/doc_candidates.py (`extract_doc_sections`, `DocCandidate.origin` is "overview", "content" or "faq"; a FAQ body is exactly `FAQ: <question>\n\n<answer>`),
