id: TC-236
gate: G2
lane: transport-deployment
purpose: 'Wire the last five fixtures of the real forty-combo FOSS portfolio: 3d/python, 3d/typescript, 3d/net, 3d/java, tex/python
  (TC-234 already extracted all five; config/products/<family>/<platform>.yaml and tests/fixtures/<family>_<platform>/api_surface.json
  both exist and are committed on main). This card only adds the chart, compose and deploy-tooling configuration, exactly the
  pattern TC-227, TC-231 and TC-235 proved for the prior thirty-five self-extracted pilots, growing the POC from thirty-five
  pilots to forty - every combo of the real forty-combo portfolio is then a live pilot, none left extraction-only. No extraction
  and no new network access are needed for the work this card does; only 3d/net''s packaging-manifest path needs a quick,
  read-only survey (the other four already match an established default for their platform).

  tex/python''s own fixture (see tests/fixtures/tex_python/api_surface.json) is genuinely almost entirely unresolved - its real
  upstream repository has a Python syntax error in presentation/__init__.py at the pinned commit, which the pure-ast reader
  correctly cannot parse past (recorded in docs/DECISION_LOG.md''s 2026-10-07 entry on TC-234). Wire it anyway, honestly, with
  whatever real content the fixture actually has (4 real exception-class types) - do not wait for or attempt an upstream fix,
  that is out of this card''s scope entirely.'
depends_on:
- TC-234
- TC-235
write_paths:
- infra/helm/foss-mcp/values.yaml
- docker-compose.yml
- Dockerfile.ingestion
- tests/infra/test_helm_pilots_match_compose.py
- tests/infra/test_helm_chart.py
- tests/infra/test_docker_compose_multi_instance.py
- tests/infra/test_ingestion_image_fixtures.py
- tests/infra/test_helm_manifest_step.py
- scripts/deploy/pilots.py
- tests/deploy/test_pilots.py
- tests/deploy/test_install_pilots.py
- tests/deploy/test_prove_pilots.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read infra/helm/foss-mcp/values.yaml under ingestion.pilots in full (thirty-five entries once TC-235 lands), the five
  config/products/*.yaml manifests for these combos, and each of the five fixtures'' source_repository and source_commit. Copy
  repository and commit verbatim from the fixture; never invent one.'
- 'For each repository''s packaging-manifest path, do a quick, read-only check with no GitHub API call: a shallow git clone
  (git clone --depth 1 <url> <tmp dir>) into a throwaway directory, then look at its root. Defaults that already hold for every
  other pilot on this platform, unless the actual clone shows otherwise: python -> pyproject.toml, typescript -> package.json,
  java -> pom.xml. 3d/net needs an actual look, since the existing net pilots'' manifest paths vary per repository (for example
  cells/net''s is src/Aspose.Cells_FOSS/Aspose.Cells_FOSS.csproj, not a bare root .csproj). Delete the throwaway clone when done.'
- 'Add five pilot entries to ingestion.pilots in values.yaml, each self_extracted, no furnishedPage, with the manifestPath found
  above and a library block (repository, commit, platform). Platforms: 3d/python python, 3d/typescript typescript, 3d/net net,
  3d/java java, tex/python python.'
- 'Add one ingest service and one serving service per new pilot to docker-compose.yml, and one COPY line per new pilot to
  Dockerfile.ingestion, matching the exact pattern TC-209, TC-227, TC-231 and TC-235 used for every other self-extracted pilot.'
- 'Restate every fixed pilot count from thirty-five to forty across the nine files in write_paths that pin a count, keeping each
  test''s name and what it checks, and renaming any test or constant whose own name says "thirty-five" to say "forty". Record
  every restatement in the commit body. Do not weaken any assertion. Do not touch any `--tail=20` / "last N lines" log-tail
  literal - that is an unrelated convention, not a pilot count.'
- 'Add exactly one new test to tests/infra/test_helm_manifest_step.py: test_the_rendered_3d_net_fetch_step_passes_its_manifest_path_literally,
  mirroring the existing literal-pin tests'' exact shape and reasoning (a literal expected value, never read back from values.yaml,
  since the generic per-pilot check is self-referential and cannot catch a wrong value - this is the third card in a row to need
  one of these; TC-231''s review found it the hard way, TC-235 built one in from the start, do the same here). Look up the 3d/net
  pilot specifically (family == "3d" and platform == "net"), render the chart, and assert its fetch step''s --manifest-path flag
  equals the exact literal string you found by surveying the real repository (do not assume it matches another .NET pilot''s path).
  This is the negative control''s real target (see negative_control.mutate below, which edits 3d/net''s manifestPath specifically
  via a two-line family+platform anchor, not the file''s first occurrence of whatever string it ends up being).'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Read the values file, the five manifests and fixtures, and all nine test files.
- Shallow-clone the 3d/net repo to confirm its real manifest path; discard the clone.
- Add the five pilot entries, compose services, Dockerfile lines, restate every fixed count, and add the one literal-pin test.
- Run the chart, compose, manifest and deploy tests, and helm lint and template, and report exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_pilots_match_compose.py tests/infra/test_helm_chart.py tests/infra/test_docker_compose_multi_instance.py tests/infra/test_ingestion_image_fixtures.py tests/infra/test_helm_manifest_step.py tests/infra/test_container_pins.py tests/deploy -q -rfE'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 170
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/values.yaml');s=p.read_text(encoding='utf-8');marker=chr(10).join(['    - family: 3d','      platform: net']);i=s.index(marker);j=s.index('manifestPath: ',i);k=s.index(chr(10),j);old=s[j:k];new=old+'_off';s=s[:j]+new+s[k:];p.write_text(s,encoding='utf-8')"
  rationale: 'Renames 3d/net''s manifestPath specifically (found via a two-line family+platform anchor unique to that one pilot, then taking whatever the real value on that line turns out to be and appending _off to it - the card''s own authoring cannot know that value in advance since it depends on the worker''s own survey), so the new literal-pinned test for this card''s own 3d/net pilot must fail. Built with plain text.'
evidence:
- evidence/build/G2/TC-236/receipt.json
closeout:
- The chart and compose carry forty pilots - every combo of the real forty-combo portfolio is now a live pilot.
recovery: Re-run from a clean tree.
