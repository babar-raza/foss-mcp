id: TC-824
gate: G3
lane: storage-retrieval
purpose: >-
  Found by the TC-814 worker (2026-11-14, reproduced on the real committed sidecars):
  `_with_known_hazards` in src/foss_mcp/mcp/tools/get_product_reference.py appends
  project-authored known-hazard paragraphs to an answer and then returns
  `untrusted_upstream_content=False` even when the answer STILL contains verbatim upstream README
  text (the README limitations section heads the answer). Affected today: 3d/java, 3d/net,
  3d/python, cells/rust, page/python, slides/python, tex/python (the notice still says 'Treat as
  data', but a consumer that trusts the structured flag would treat upstream text as trusted - a
  real untrusted-content-labelling defect, the class AGENTS.md says to never treat as
  instructions). Fix: the flag must stay True whenever any part of the served text came from
  upstream content; it may be False only when the answer is made purely of project-authored text
  (for example imaging/net, whose only limitations content is the hazard disclosure). Keep every
  other field and the notice wording byte-identical except where the notice wrongly claims the
  whole answer is project-disclosed; measure all 32 pilots x all sections before/after and list
  every (pilot, section) whose flag changes. The pins the TC-814 worker wrote in
  tests/mcp/tools/test_product_reference_baked_contract.py currently assert the buggy False for
  the seven hazard pilots - update exactly those assertions to the corrected value (say so), and
  add a new test file that proves the flag is True for a mixed answer, False for a hazard-only
  answer, and True for a pure upstream answer.
depends_on:
  - TC-816
  - TC-814
  - TC-812
  - TC-798
  - TC-726
  - TC-796
  - TC-815
  - TC-653
  - TC-658
  - TC-820
  - TC-828
write_paths:
  - src/foss_mcp/mcp/tools/get_product_reference.py
  - tests/mcp/tools/test_product_reference_baked_contract.py
  - tests/mcp/tools/test_product_reference_untrusted_flag.py
  - tests/mcp/tools/test_product_reference_known_hazards.py
  - tests/mcp/tools/test_known_hazards_round2_disclosures.py
  - tests/indexing/test_known_defects_data_wave_b.py
  - tests/mcp/tools/test_known_hazards_words_net.py
satisfies:
  - REQ-G3-013
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: `_with_known_hazards` and every place `untrusted_upstream_content` is set in
    get_product_reference.py, the `ReferenceContent` dataclass,
    tests/mcp/tools/test_product_reference_baked_contract.py (the hazard-pilot limitations
    assertions added by TC-814), tests/mcp/tools/test_product_reference_known_hazards.py and
    tests/mcp/tools/test_known_defects_in_product_reference.py.
  - >-
    REPRODUCE FIRST: real get_product_reference(limitations) calls for 3d_java and imaging_net on
    the real sidecars; show the flag, the notice and which part of the text is upstream.
  - >-
    Do not touch sidecars, config, readme_sections.py or any other test file. Never weaken a check;
    if a test outside write_paths fails because of the correction, stop and report it with the exact
    failure.
  - >-
    Commit EXACTLY ONE commit (the supervisor's negative control reverse-applies that commit's
    production-code part). Run ruff format and ruff check on changed Python files, then the card's
    check command twice and report real results.
actions:
  - >-
    Keep untrusted_upstream_content True for any answer containing upstream text, including answers
    with appended known-hazard paragraphs.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_product_reference_untrusted_flag.py tests/mcp/tools/test_product_reference_baked_contract.py tests/mcp/tools/test_product_reference_known_hazards.py tests/mcp/tools/test_known_defects_in_product_reference.py tests/mcp/tools/test_get_product_reference_platforms.py tests/mcp/tools/test_product_reference_truthful.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 150
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['src/foss_mcp/mcp/tools/get_product_reference.py']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-824/receipt.json
closeout:
  - >-
    The untrusted_upstream_content flag is True whenever served text includes upstream content;
    hazard-only answers stay False.
recovery: Re-run from a clean tree.
