id: TC-854
gate: G3
lane: verification
purpose: >-
  Operator-ceiling decision OQ-029 (recorded by the supervisor as PROVISIONAL_ACCEPT in
  ops/open_questions.jsonl): the lean baked-tree ceiling is raised from 45 MB to 55 MB so the
  whole fleet can carry gateway-dimension (4096) example vectors. After regeneration cohort C1
  (TC-848, 11 of 32 pilots) the committed infra/demo-manifests tree is 44.46 MB; the ~21 pilots
  still on 64-dim hashing vectors hold ~160 example points at ~33 KB each, so the finished tree is
  ~49.7 MB. Quantising vectors to fewer decimals (a unit 4096-dim vector has components near
  0.016, so 5 decimals keep only ~3 significant figures) and changing the on-disk vector encoding
  were rejected. Change exactly the ceiling and its documentation:
  tests/deploy/test_compact_demo_manifests.py LEAN_CEILING_BYTES 45_000_000 -> 55_000_000 and
  every assertion that restates it (test_the_tree_budgets_stay_under_the_agreed_lean_ceiling,
  test_the_ceiling_helper_rejects_a_budget_above_the_ceiling - keep its relative cases meaningful
  around the NEW ceiling, test_release_md_names_the_lean_ceiling_and_this_test_file: the text must
  now say 55 MB), the comment above the constant (state who decided, when and why: OQ-029; the
  operator can still overrule it), the matching sentence in docs/RELEASE.md (line ~50, 'stays
  under 45 MB (the lean ceiling)') and a new docs/DECISION_LOG.md section recording the decision,
  the numbers above and the rejected alternatives. TREE_BYTES_BUDGET values (both files) are NOT
  changed by this card: they stay the measured pins TC-848 set; later regeneration cohorts re-pin
  them against the new ceiling. No budget may exceed the new ceiling.
