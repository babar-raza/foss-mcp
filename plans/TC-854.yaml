write_paths:
  - tests/deploy/test_compact_demo_manifests.py
  - tests/deploy/test_demo_manifests_sidecars.py
  - docs/RELEASE.md
  - docs/DECISION_LOG.md
satisfies:
  - REQ-G3-017
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-14 — TC-790 (chunk-truncation API-Coverage preservation) lands, plus 2 more pre-existing stale-fixture breaks
    sha256: 13bbc08926dd377f4940bfa06350eeff74eb1c324787a81d3a2d8b8bdd76e3da
inputs:
  - >-
    READ FIRST: tests/deploy/test_compact_demo_manifests.py (LEAN_CEILING_BYTES,
    budget_is_within_the_lean_ceiling and the three tests that name it),
    tests/deploy/test_demo_manifests_sidecars.py (TREE_BYTES_BUDGET and any ceiling reference),
    docs/RELEASE.md around the 'lean' section, the OQ-029 entry in ops/open_questions.jsonl (read
    only), and the last sections of docs/DECISION_LOG.md for the heading/style.
  - >-
    Grep the whole repo for other restatements of the ceiling ('45 MB', '45_000_000', '45,000,000')
    and report any that are outside write_paths instead of editing them. Do not touch
    TREE_BYTES_BUDGET values, any data under infra/ or the open_questions file (ops/ is
    supervisor-owned).
  - >-
    Run the card's check twice, ruff check / ruff format --check on both test files, and make
    exactly ONE commit. In a worktree without a venv use
    E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\.venv\Scripts\python.exe with PYTHONPATH set
    to your worktree root, src and infra. Report once.
actions:
  - >-
    Raise the lean baked-tree ceiling to 55 MB with its tests, RELEASE.md sentence and a
    DECISION_LOG entry (OQ-029).
checks:
  - command: '{python} -m pytest tests/deploy/test_compact_demo_manifests.py tests/deploy/test_demo_manifests_sidecars.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 1200
    junitxml: true
    proves:
      - REQ-G3-017
min_tests: 20
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import subprocess; paths = ['docs/RELEASE.md']; patch = subprocess.run(['git', 'show', '--format=', 'HEAD', '--'] + paths, capture_output=True, check=True).stdout; assert patch.strip(), 'the worker commit changes none of the production paths - the fix is missing'; subprocess.run(['git', 'apply', '-R', '--whitespace=nowarn', '-'], input=patch, check=True)"
  rationale: >-
    Reverse-applies the worker's own commit restricted to this card's production (non-test) paths,
    i.e. removes the fix itself while keeping the card's new tests; the suite must then fail.
    Anchored on the real committed diff, so it cannot be vacuous or literal-fragile. The worker must
    therefore commit exactly ONE commit for this card.
evidence:
  - evidence/build/G3/TC-854/receipt.json
closeout:
  - >-
    The lean ceiling is 55 MB, decided and recorded as OQ-029, with tests and docs agreeing.
recovery: Re-run from a clean tree.
