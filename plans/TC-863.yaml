id: TC-863
gate: G3
lane: verification
purpose: 'R7 (final ledger closure) (plan ''Reconciliation (2026-11-18)'', R7 part 3 of 5, REQ-G3-013): ledger closure pass over 18 still-OPEN rows of `docs/ROUND2_REVIEW.md`, continuing the method of TC-777/TC-780/TC-781/TC-782 (read `docs/DECISION_LOG.md`''s four 2026-11-13 entries for the shape). Your rows (re-measure; the register may have shifted): RD2-005 (P1, 3d/java); RD2-015 (P1, 3d/net); RD2-021 (P2, 3d/net); RD2-049 (P3, barcode/python); RD2-050 (P3, barcode/python); RD2-053 (P1, cells/cpp); RD2-056 (P1, cells/cpp); RD2-062 (P1, cells/go); RD2-068 (P2, cells/go); RD2-069 (P2, cells/go); RD2-074 (P2, cells/java); RD2-083 (P1, cells/python); RD2-084 (P1, cells/python); RD2-092 (P3, cells/python); RD2-103 (P3, cells/rust); RD2-111 (P2, cells/typescript); RD2-116 (P2, cells/typescript); RD2-122 (P2, email/cpp). Workstream G rows are reference-content truth (`get_product_reference` sections, README projection, install, agent guidance, false README claims). Call the real function for
  the row''s pilot and section, compare with the real upstream repository content at the pinned commit (the committed `tests/fixtures/round3_readmes/<pilot>/` copy is the README evidence; do not re-fetch unless the row concerns something not in it), and cite the card that fixed it where the Cards column names one (C1-C12, KD4).'
