negative_control:
  mutate: 'python -X utf8 -c "import pathlib; p = pathlib.Path(''docs/ROUND2_REVIEW.md''); s = p.read_text(encoding=''utf-8''); old = ''| RD2-005 |''; assert s.count(old) == 1, ''row marker not found exactly once''; idx = s.index(old); line_end = s.index(chr(10), idx); line = s[idx:line_end]; parts = line.rsplit(''|'', 2); assert len(parts) == 3; corrupted = parts[0] + ''|BOGUS_STATUS'' + ''|'' + parts[2]; p.write_text(s[:idx] + corrupted + s[line_end:], encoding=''utf-8'')"

    '
  rationale: Corrupts row RD2-005's Status cell to a value that is not any real disposition, which must make the permanent test_every_row_status_is_a_real_disposition_value check fail - a pure data mutation, immune to the lockstep-rename vacuousness class, and it never touches any code path.
evidence:
- evidence/build/G3/TC-863/receipt.json
closeout:
- 'R7 part 3: every listed G row is dispositioned on live evidence, or left OPEN with a concrete reason.'
recovery: Re-run from a clean tree.
