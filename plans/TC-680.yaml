source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top
      priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST: `src/foss_mcp/mcp/tools/get_product_reference.py`'s `_formats_from_readme`,
    `_format_statements`, `_FORMAT_WORD_RE`, `_FORMAT_VERB_RE`, `_FORMAT_WORDS` in full (confirm with
    your own eyes that the verb regex has zero negation-awareness, exactly as described above).
    Confirm the REPRODUCE-FIRST case above fails today (both lines appear, no annotation) before
    changing anything - write this as your first new test.
  - >-
    Design `reconcile_format_claims` so it is called from `_formats_from_readme` AFTER the existing
    per-source statement extraction (do not change `_format_statements`'s own extraction logic -
    only add a reconciliation pass over its output, tagged by source section). It must never change
    which lines are selected or their relative order when there is no contradiction - prove this
    with a test using real-shaped non-contradictory capabilities+limitations text, asserting
    byte-for-byte identical output to a saved snapshot of the CURRENT (pre-change) function's result
    on that same input.
  - >-
    Write real, deterministic unit tests in the new file proving: (a) the REPRODUCE-FIRST case is
    now annotated - the answer's text or notice explicitly names the format word and the
    contradiction, without removing either original line; (b) a case with NO contradiction (two
    format words, no negation anywhere) is completely unaffected, byte-for-byte; (c) a negation cue
    in a NON-limitations section (e.g. capabilities itself says "does not yet support X") does not
    wrongly trigger reconciliation against itself - only a genuine cross-section (limitations
    negative vs capabilities/formats positive) contradiction counts; (d) a limitations statement
    using a negation cue you chose NOT to include in your list (report which you tested and why it's
    out of scope, if any) is handled gracefully (no crash, no false contradiction) rather than
    silently mis-detected; (e) at least 2 distinct real format words can each be independently
    reconciled when a README mentions several contradictory pairs in one answer.
  - >-
    MEASURE: re-run `tests/conformance/test_reference_content.py` (the real 32-pilot sweep) and any
    other existing test exercising `_formats_from_readme`/`_format_statements` (grep `tests/` for
    both names first - do not guess the list) BEFORE and AFTER your change, and report both real
    pass/fail counts. Every existing non-contradictory formats answer across all 32 real pilots must
    be byte-for-byte unchanged (Decision E: never regress) - if your own measurement finds a REAL
    pilot DOES contain a genuine contradiction today (possible - not checked exhaustively by the
    supervisor), report it explicitly rather than silently treating a changed answer as a bug; this
    is new, correct disclosure, not a regression, and the baseline (strict:false) will not fail on
    a newly-added, non-regressing entry either way.
actions:
  - >-
    Add `reconcile_format_claims`, wired into `_formats_from_readme`, to explicitly disclose (never
    silently resolve) a contradiction between a limitations-sourced negative format claim and a
    capabilities/formats-sourced positive one for the same format, closing a real, reproduced gap
    with zero behavior change for the non-contradictory case.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_get_product_reference_format_claim_reconciliation.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-013
  - command: '{python} -m pytest tests/conformance/test_reference_content.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 5
requires:
  - python
network: true
# NOTE (supervisor): tests/conformance/test_reference_content.py (check 2) does not actually reach
# the network - it contains a fixture string literal "git clone https://example.invalid/x.git"
# inside a markdown-fenced test case, which cardlint's own blunt NETWORK_HINTS substring scan
# cannot distinguish from a real invoked command (the same false positive TC-678 hit on this exact
# file). Declared network: true per the tool's own suggested escape valve.
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py'); s = p.read_text(encoding='utf-8'); old = 'def reconcile_format_claims'; assert s.count(old) == 1, 'the required function definition was not found as expected - if your real code names this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; new = 'def reconcile_format_claims_renamed_by_negative_control'; s2 = s.replace(old, new, 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Renames the real function's own definition, so every real call site that still refers to it as
    `reconcile_format_claims` (required to exist unrenamed, per this card's own spec) raises a
    NameError at the moment `_formats_from_readme` tries to call it. Any test proving a real
    contradiction gets annotated must fail under this mutation; a non-contradictory case that never
    reaches the call (if the implementation short-circuits when there is nothing to reconcile) may
    be unaffected - acceptable, since this card requires at least the contradiction-detection tests
    to fail, not every test in the file.
evidence:
  - evidence/build/G3/TC-680/receipt.json
closeout:
  - >-
    `get_product_reference`'s formats answer now explicitly discloses a real capability/limitations
    contradiction for the same format, rather than silently presenting both claims
    undifferentiated - with zero behavior change when no contradiction exists.
recovery: Re-run from a clean tree.
