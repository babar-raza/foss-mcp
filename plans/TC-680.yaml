id: TC-680
gate: G3
lane: storage-retrieval
purpose: >-
  C5 (content-truth sub-program, section 2.4: "formats extraction... with `reconcile_format_claims()`
  (annotate, never silently resolve, when limitations ... contradict a capability claim)"). No
  `reconcile_format_claims` function, or anything resembling one, exists anywhere in the repo today
  (confirmed: `grep -r "reconcile" src/` and `grep -r "format_claim" src/` both return zero matches).

  REPRODUCED directly (supervisor, this session, against the real, unmodified `_formats_from_readme`
  in `src/foss_mcp/mcp/tools/get_product_reference.py`): a synthetic `capabilities` section reading
  "Exports documents to STL format." and a `limitations` section reading "STL export is not
  currently supported for textured meshes." both pass `_FORMAT_WORD_RE`
  (matches "stl") and `_FORMAT_VERB_RE` (matches "export"/"support" - a bare verb list with NO
  negation-awareness: "not", "no", "cannot", "never", "unsupported" are not excluded or even
  detected). Both sentences are emitted as plain, undifferentiated bullets in the `formats` answer,
  with zero indication that the second sentence negates the first. A caller reading the answer alone
  has no way to tell these two lines describe a genuine capability versus its own contradiction.

  Fix: add `reconcile_format_claims(statements: list[tuple[str, bool]]) -> ...` (shape and exact
  return type your choice, report which) that takes the format statements already extracted from
  EACH source section (capabilities/formats vs limitations) tagged by which section they came from,
  and for every real format word (`_FORMAT_WORDS`) that appears in at least one statement from a
  LIMITATIONS-sourced statement containing a negation cue near the verb (your own negation-cue list,
  starting point: "not", "no", "cannot", "can't", "never", "unsupported", "n't" - measure against
  real README prose before freezing the list, report what you chose) AND at least one statement from
  a capabilities/formats-sourced statement WITHOUT such a cue mentioning the SAME format word,
  ANNOTATE the answer to disclose this specific contradiction explicitly (e.g. a line prepended or
  appended naming the conflicting format and which two sections disagree) - NEVER drop, merge, or
  silently prefer either statement. When no contradiction is found, the answer is completely
  unaffected (byte-for-byte identical to today's output) - this mechanism only ever ADDS a
  disclosure, never changes which lines appear or their order.
