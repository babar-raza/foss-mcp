- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read infra/helm/foss-mcp/values.yaml under ingestion.pilots in full (twenty entries today), the eight config/products/*.yaml
  manifests for these combos, and each of the eight fixtures'' source_repository and source_commit. Copy repository and commit
  verbatim from the fixture; never invent one.'
- 'For each repository''s packaging-manifest path, do a quick, read-only check with no GitHub API call: a shallow git clone
  (git clone --depth 1 <url> <tmp dir>, matching run_extraction.py''s own clone_shallow) into a throwaway directory, then look at
  its root and, for the two .NET ones (email/net, imaging/net), its src/ directory - the same place cells/net, slides/net and
  words/net''s own project files turned out to live. Delete the throwaway clone when done. For the six self-extracted pilots that
  are Python, the manifest path is pyproject.toml, matching every Python pilot added so far, unless the actual clone shows
  otherwise. For email/cpp, check whether CMakeLists.txt sits at the repository root, matching pdf/cpp and slides/cpp.'
- 'Add eight pilot entries to ingestion.pilots in values.yaml, each self_extracted, no furnishedPage, with the manifestPath found
  above and a library block (repository, commit, platform). Platforms: email/python python, email/cpp cpp, email/net dotnet,
  barcode/python python, note/python python, html/python python, page/python python, imaging/net dotnet.'
- 'Add one ingest service and one serving service per new pilot to docker-compose.yml, and one COPY line per new pilot to
  Dockerfile.ingestion, matching the exact pattern TC-209 and TC-227 used for every other self-extracted pilot.'
- 'Contract restatement, by the supervisor after attempt 1''s review. Attempt 1''s own work was correct and is kept; this adds exactly
  one new test. In tests/infra/test_helm_manifest_step.py, add test_the_rendered_email_python_fetch_step_passes_its_manifest_path_pyproject_toml,
  mirroring test_the_rendered_pdf_cpp_fetch_step_passes_its_manifest_path_CMakeLists_txt''s exact shape and its own comment''s
  reasoning (a literal expected value, never read back from values.yaml, since the generic per-pilot check is self-referential and
  cannot catch a wrong value): look up the email/python pilot specifically (family == "email" and platform == "python"), render the
  chart, and assert its fetch step''s --manifest-path flag equals the literal string "pyproject.toml". Do not change
  test_every_pilot_with_a_manifest_path_gets_the_fetch_step_on_the_read_write_claim or the existing CMakeLists.txt test. This is the
  negative control''s real target now (see the revised negative_control.mutate below, which edits email/python''s manifestPath
  specifically rather than the file''s first occurrence, which turned out to be a pre-existing pilot no test pins).'
- 'Restate every fixed pilot count from twenty to twenty-eight across the nine test files in write_paths, keeping each test''s name
  and what it checks, and renaming any test or constant whose own name says "twenty" (for example a PINNED_RELEASES list and any
  test named for the exact count) to say "twenty-eight". Record every restatement in the commit body. Do not weaken any assertion.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Read the values file, the eight manifests and fixtures, and all nine test files.
- Shallow-clone each of the two .NET repos and the C++ repo to confirm its real manifest path; discard the clones.
- Add the eight pilot entries, compose services, Dockerfile lines, and restate every fixed count.
- Run the chart, compose, manifest and deploy tests, and helm lint and template, and report exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_pilots_match_compose.py tests/infra/test_helm_chart.py tests/infra/test_docker_compose_multi_instance.py tests/infra/test_ingestion_image_fixtures.py tests/infra/test_helm_manifest_step.py tests/infra/test_container_pins.py tests/deploy -q -rfE'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 145
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/values.yaml');s=p.read_text(encoding='utf-8');old='manifestPath: pyproject.toml';new='manifestPath: pyproject_off.toml';i=s.index('family: email');j=s.index(old,i);s=s[:j]+new+s[j+len(old):];p.write_text(s,encoding='utf-8')"
  rationale: 'Renames email/python''s manifestPath specifically (found by first locating "family: email" in the file, then the next manifestPath after it), so a literal-pinned test for this card''s own new pilot must fail. Supervisor restatement (2026-10-07, after attempt 1''s review): the original version replaced the FIRST "manifestPath: pyproject.toml" match in the whole file, which turned out to be slides/python, a pre-existing pilot from an earlier card - and nothing in the suite pins any Python pilot''s manifestPath as a literal except test_the_rendered_pdf_cpp_fetch_step_passes_its_manifest_path_CMakeLists_txt''s own CMakeLists.txt case (see that test''s own comment: the generic per-pilot check at test_every_pilot_with_a_manifest_path_gets_the_fetch_step_on_the_read_write_claim is deliberately self-referential - it reads its own expected value back out of the same values.yaml the mutation edits - and by that comment''s own admission cannot catch a wrong value). Attempt 1''s suite genuinely passed under the original mutation: VACUOUS CHECKS, correctly caught by gatectl review, not a worker defect. Built with plain text.'
evidence:
- evidence/build/G2/TC-231/receipt.json
closeout:
- The chart and compose carry twenty-eight pilots, each matching its already-extracted fixture.
recovery: Re-run from a clean tree.
