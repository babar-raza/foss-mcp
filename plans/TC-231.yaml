lane: transport-deployment
purpose: 'Wire the eight self-extracted fixtures that already exist but were never deployed as pilots: email/python, email/cpp,
  email/net, barcode/python, note/python, html/python, page/python, imaging/net. An earlier card already ran real extraction for
  each (config/products/<family>/<platform>.yaml and tests/fixtures/<family>_<platform>/api_surface.json both exist and are
  committed); this card only adds the chart, compose and deploy-tooling configuration, exactly the pattern TC-227 proved for the
  previous six, growing the POC from twenty pilots to twenty-eight. No extraction and no new network access are needed for the
  work this card does; only each repository''s packaging-manifest path needs a quick, read-only survey.'
