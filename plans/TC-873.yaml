- 'SAMPLE SOURCE: clone aspose-cells-foss/Aspose.Cells-FOSS-for-Python with the authenticated gh CLI or git over https into a scratch directory OUTSIDE the repository and OneDrive, check out the pinned commit exactly, read examples/*.py there, delete the clone when done. The repository is MIT and bundles no font or image. NEVER print or write GITHUB_TOKEN / GPT_OSS_* values. If the auto-mode classifier denies an action do not work around it: report it.'
