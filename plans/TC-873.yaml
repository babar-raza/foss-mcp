- 'DEFINITION OF DONE: after your final edit run the FULL directory sweeps WITHOUT -x, one directory at a time (tests/mcp tests/indexing tests/extraction tests/conformance tests/config tests/release tests/infra tests/deploy tests/poc tests/normalization tests/test_container_build.py) then tests/e2e ALONE and LAST with no other docker work; tests/infra must be green; fix every stale pin that is in write_paths to a confirmed real value (never loosen/skip/delete); a failure outside write_paths: report file + test + what it pins and stop. Add tests/deploy/test_adopted_samples_cells_python.py (offline, committed files only): cells_python serves >= 30 examples (or the reported measured number), every adopted entry has a source block with the pinned commit, every example chunk has Verification-Level / Verified-With, one example per chunk, 4096-dim vector point per example chunk. One commit with FOSS_MCP_WORKER=TC-873; report once with before/after counts, honest losses, generation_diff / answer_diff
  results, DG-1 churn by class with the pass->fail count, tree size and margins, check and sweep results.'
