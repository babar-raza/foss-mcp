gate: G3
lane: verification
purpose: 'P4-B adoption, pilot cells/python (the largest gap: 10 served examples against the Appendix C minimum of 30). TC-866 measured the real yield of the pilot''s upstream examples/ directory at the pinned commit 4f6768a7b349a1309644f456eb43bc35f70c16d7: 27 of 32 verify (23 ran-produced-output, 4 ran-exit0; rejected: __init__.py empty, test_xlsx_to_json.py and test_xlsx_to_markdown.py need input/*.xlsx fixtures, test_create_all_charts.py needs pytest, test_csv_import_export.py asserts a FileNotFoundError the library does not raise) - see docs/P4B_YIELD.md on main after TC-866 integrates. TC-872 added the `kind: upstream-sample` entry type to the authored sidecar (cap 40, mandatory source block, UPSTREAM_SAMPLE_LABEL, Sample-Source line). This card adopts at least 20 FOCUSED upstream samples into tests/fixtures/furnished/cells_python/authored_examples.yaml and regenerates cells_python so the pilot serves at least 30 examples. ''Focused'' matters: the upstream files are unittest modules;
  each adopted entry must be ONE standalone program that shows ONE capability (take one test method or script section, remove the unittest/pytest scaffolding and asserts that only guard the test, inline any fixture via the product''s example_fixtures generators or build the workbook in code), with a title of at most 12 words that names the task a user would ask for (not ''test_xyz''), distinct from every README and authored title, and a `source` block {path, commit, license: MIT, adaptation}. Prefer samples that exercise symbols the pilot''s current examples do not cover (read the pilot''s served symbol list and its current examples first); never adopt a sample twice under two titles. Regenerate with the cluster-free route scripts/release/regenerate_local.py --only cells_python (image built from THIS worktree, gateway 4096-dim vectors), then compare old and new with scripts/release/generation_diff.py and scripts/release/answer_diff.py: no removed symbol, no lost answer (lost must be 0),
  every adopted example chunk carries Verification-Level / Verified-With / Sample-Source lines, one example per chunk and a 4096-dim vector point. Every example whose run fails or prints nothing is honestly NOT published (TC-802): if fewer than 20 verify, adapt more samples until the served total reaches 30 or report the measured shortfall with the reasons - never lower the pilot''s floor or publish an unverified example. No pilot ever gets worse: the retrieval ratchets (hit@3, wrong-confident ceilings, forgiveness 23/14, recall pairs, nonsense-miss, title-anchor) must hold, the DG-1 guard applies to the conformance baselines (only prefix-3 / probe-artefact / sentence-wrapped sample-key churn with 0 pass->fail; any other regression class stops the card), and the baked-tree budgets in tests/deploy/test_compact_demo_manifests.py and test_demo_manifests_sidecars.py are re-pinned only upward to the measured value rounded up to the next 10k (report the margin to LEAN_CEILING_BYTES 55_000_000,
  which a worker never raises; about 33 KB per 4096-dim example point).'
