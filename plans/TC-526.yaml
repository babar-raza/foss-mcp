      /// Gets the session id.
      pub fn session(&self) -> u32 { 0 }
      /// Sets the token.
      pub fn set_token(&mut self, token: &str) {}
      /// Consumes the client.
      pub fn into_inner(self) -> String { self.url }
      pub(crate) fn hidden(&self) {}
  }

  impl std::fmt::Display for JmapClient {
      fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result { Ok(()) }
  }

  pub trait Mailer {
      fn send(&self, to: &str) -> bool;
      fn name() -> String;
  }

  impl Mailer for JmapClient {
      fn send(&self, to: &str) -> bool { true }
      fn name() -> String { String::new() }
  }

  pub struct Other;

  impl Default for Other {
      fn default() -> Self { Other }
  }

  impl Clone for Other {
      fn clone(&self) -> Self { Other }
  }

  impl PartialEq for Other {
      fn eq(&self, other: &Self) -> bool { true }
  }

  impl std::hash::Hash for Other {
      fn hash<H: std::hash::Hasher>(&self, state: &mut H) {}
  }

  pub struct Wrapper<T> {
      pub inner: T,
  }

  impl<T> Wrapper<T> {
      pub fn get(&self) -> &T { &self.inner }
  }

  struct Hidden;

  impl Hidden {
      pub fn run(&self) {}
  }

  /// Adds one.
  pub fn free_function(x: i32) -> i32 { x + 1 }

