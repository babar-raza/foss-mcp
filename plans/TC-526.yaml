id: TC-526
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, findings RST-10 and RST-11). JAVA AND RUST FIDELITY. JAVA (3d/java, pdf/java; same adapter for
  cells/java, slides/java, jmap/java). Measured by the reviewer against upstream: varargs are dropped in 6 of 6 cases (`setPages(int... pages)` is
  served `setPages()`), because the Java grammar gives a varargs parameter its own `spread_parameter` node that `_extract_method_params` does not
  list; generic bounds (`<T extends Deformer>`) and `throws` clauses are never rendered; public fields are not exposed (`Quaternion.x/y/z/w` and
  `Vector3.x/y/z`, public doubles: 34 properties missing in 3d/java), because only `final` fields are read by `_extract_const_fields`; the
  getter-derived pseudo-properties `identity`, `zero` and `length` (synthesized from `isIdentity()`, `isZero()`, `getLength()` by
  `_synthesize_java_properties`) are listed exactly like fields and suggest an invalid `Quaternion.identity`; and `static` is marked on 0 of
  71/76/159 methods, so the static `multiply(a, b)` and the instance `multiply(q)` are indistinguishable. Everything else is exact (cells/java 99.7
  percent, 3d/java 97.7, pdf/java 96.9). Reproduced on this checkout with a small package and `extract_api_surface`: `setPages` comes back with
  `params: []`, `apply` with `return_type: T` and no bound or throws, the constructor `Document(String path) throws IOException` without its throws,
  the public field `x` absent, and `length`/`zero` present as properties. RUST (cells/rust, jmap/rust). cells/rust has all 1693 inherent public
  methods but 0 `self` markers, so 259 associated functions and 1434 methods look identical (an agent cannot tell `Workbook::new(path)` from
  `workbook.save()`); jmap/rust `JmapClient` shows 9 methods while the mail methods defined in `impl JmapClient` in client_mail.rs are 10 separate
  receiver-less `Kind: function` chunks, because `_extract_rust_impl_context` (api_surface.py L2185) keeps a path-qualified impl target such as
  `crate::JmapClient` verbatim and `_associate_rust_impl_methods` (L2219) then cannot match it to the extracted type (reproduced: an `impl
  crate::JmapClient` block leaves `list_mailboxes` and `mailbox_count` as top-level functions with `receiver_type: crate::JmapClient`); and cells/rust
  carries 6 noise chunks from standard-trait boilerplate (`eq`, `fmt`, `hash`, `default`). This card makes Java render varargs as `pages: int...`,
  generic type parameters, throws clauses, static, abstract and default marks, public fields as properties, and getter-derived properties with an
  explicit accessor mark that never reads as a field; and makes Rust record `&self`, `&mut self` and `self` receivers and mark associated functions,
  attach path-qualified and generic impl blocks (in any file) to their type, exclude the std derive-style trait impls (`Debug`, `Display`,
  `Clone`, `Copy`, `PartialEq`, `Eq`, `PartialOrd`, `Ord`, `Hash`, `Default`, `Drop`) from the members while still listing the trait under the
  type's bases, attach every other trait impl under the type with an `impl <Trait>` mark, and drop impl members whose type is not an extracted
  public type. It does NOT change any other language, the committed fixtures, the type selection (TC-520 to TC-523) or the coverage line.
