id: TC-609
gate: G3
lane: storage-retrieval
purpose: >-
  Build F9 (REQ-G3-010): the example-integrity conformance invariant. Measures, against all 32 real
  baked pilots, two already-confirmed defects: the chunker splits an example's code at a column-0 `#`
  comment as if it were a markdown heading, orphaning the real code after it (reproduced on 3d/python,
  pdf/python, slides/python - 12 orphan fragments total, already confirmed); and a chunk's
  `Kind: verified_example` label is written even when the recorded run actually failed (3d/java,
  3d/net, pdf/cpp each have at least one such chunk, already confirmed). This card only measures and
  pins today's real numbers; XA1-XA19 (later cards) do the fixing. Read
  C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1 (M4), 1.4 and 2.1 (F9) first.
depends_on:
  - TC-001
  - TC-598
write_paths:
  - tests/conformance/test_example_integrity.py
  - tests/fixtures/conformance/baseline_example_integrity.json
satisfies:
  - REQ-G3-010
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-10-30 — Round-2 portfolio audit remediation adopted: unified plan, governance decisions A-K
      recorded (supervisor)
    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST: C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 1.1 (M4) and 2.5 (the
    P4 Example corpus design, context for XA1-XA19 which do the actual fixing later - implement none
    of it here). Also read `src/foss_mcp/normalization/chunker.py`'s `chunk_document` function and
    `src/foss_mcp/mcp/tools/find_examples.py`'s `is_verified_example_text`/`_extract_example` functions
    in full, confirming against the CURRENT code the exact mechanism (a line matching
    `^#{1,6}[ \t]+` is read as a markdown heading, splitting the chunk even inside a code block; a
    chunk's `Kind: verified_example` line is set whenever a candidate compiled, regardless of its
    recorded `Runtime-Status`).
  - >-
    READ `tests/conformance/corpus.py`/`baseline.py` in full; use `ConformancePilot.example_chunks()`
    for every pilot's real example chunks (no sampling needed here - example counts per pilot are
    small, typically single digits to low tens, so this card can exhaustively check every real
    example chunk in every pilot by default, no `exhaustive_enabled()` gating needed; confirm this
    assumption against the real counts you observe and note in your closeout if any pilot's example
    count is large enough to make that impractical).
  - >-
    Orphan-fragment sub-case: for every example chunk across all 32 pilots, extract its code body the
    same way `find_examples.py`'s own `_extract_example` does (reuse that exact function, do not write
    a second extraction), and separately reconstruct what `chunk_document`'s own heading-split logic
    would do if given that chunk's FULL original doc text (if you can recover it - the baked
    generation stores the chunk already split, so to detect THIS specific defect you need to look for
    its SYMPTOM rather than re-run the splitter on data you no longer have in its pre-split form: scan
    each example chunk's code body for a column-0 `#` comment line, which is the exact marker the real
    splitter keys on - any example chunk whose extracted code body ends abruptly right before such a
    line, OR any chunk in the same generation that has no `FQN:`/`Kind:` header at all but DOES contain
    what looks like a continuation of code (an "orphan" chunk), is evidence of this defect). Count and
    record, per pilot, how many orphan-looking chunks and truncated-before-a-comment example bodies
    you find (3d/python, pdf/python, slides/python are the three pilots already confirmed to have
    this - confirm they still do, and check whether any OTHER pilot also does, which would be a new
    finding worth flagging explicitly in your closeout).
  - >-
    Mislabelled-verified sub-case: for every example chunk across all 32 pilots, check whether it
    carries `Kind: verified_example` and, if it ALSO carries a `Runtime-Status:` line, whether that
    status is anything other than a success value (confirm the real success/failure vocabulary
    `example_verifier.py` or `build_chunks.py` writes by reading it - prior research cited `failed` and
    `no_output` as failure values). Record a FAILURE for every chunk that is labelled
    `Kind: verified_example` while its own `Runtime-Status` says the run did not succeed (3d/java,
    3d/net, pdf/cpp are the three pilots already confirmed to have at least one such chunk - confirm
    and report the real current count per pilot, which may differ from prior research if anything has
    changed).
  - >-
    Record every sub-case's findings into the one combined baseline via
    `assert_no_new_failures(load_baseline(...), observed_failures)`, `case_id` naming the pilot and
    the specific chunk's title/FQN. Generate the real baseline JSON from your own actual measured run,
    `"strict": false` to start.
actions:
  - >-
    Measure, against every real example chunk in all 32 baked pilots, how many are orphaned by the
    chunker's heading-split defect and how many are labelled verified despite a recorded failed run -
    pinning today's real, exhaustive numbers as a committed baseline for XA1-XA19 to improve against.
checks:
  - command: '{python} -m pytest tests/conformance/test_example_integrity.py -q -rfE'
    expect: 'exit 0'
    timeout_seconds: 120
    junitxml: true
    proves:
      - REQ-G3-010
  - command: '{python} -m pytest tests/conformance/test_example_integrity.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 120
    junitxml: true
    proves:
      - REQ-G3-010
min_tests: 3
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib, json; p = pathlib.Path('tests/fixtures/conformance/baseline_example_integrity.json'); d = json.loads(p.read_text(encoding='utf-8')); assert d.get('known_failures'), 'fix text not found - the real baseline has no known_failures to empty, card and source have diverged'; p.write_text(json.dumps({'strict': d.get('strict', False), 'known_failures': []}, indent=2) + chr(10), encoding='utf-8')"
  rationale: >-
    Rewrites the committed baseline to an empty known_failures list, so every real measured orphan
    chunk or mislabelled-verified chunk becomes "new" and unexpected. The check must then fail,
    proving the baseline file is actually consulted rather than decorative.
evidence:
  - evidence/build/G3/TC-609/receipt.json
closeout:
  - >-
    A real, exhaustive measurement across every example chunk in all 32 pilots exists, confirming
    (or correcting) the exact orphan-chunk and mislabelled-verified counts this plan's prior research
    cited, and naming any additional pilot found to have either defect that was not previously known.
recovery: >-
  If the negative-control mutate script's JSON assumption does not match your real baseline file's
  actual shape, write a simpler, reliable one yourself in the same chr()/json-based style used
  elsewhere in this plan and report the substitution in your closeout.
