id: TC-710
gate: G3
lane: storage-retrieval
purpose: >-
  Q10c (findability sub-program, follow-on to Q10/TC-635 and Q10b/TC-672). Round-2's own #1
  cross-cutting finding ("find_examples matches on example title words only, not body/code
  content") is still PARTIALLY open after TC-635/TC-670/TC-672, for the exact two issues that name
  it directly: `EML-NET-002` and `PDF-NET-002` (see `docs/round2/issues.json`).

  REPRODUCED LIVE this session, right now, against the real committed `infra/demo-manifests` data
  (not the plan's paraphrase): `find_examples(Scope("pdf","net"), "create document")`,
  `find_examples(Scope("pdf","net"), "save")` and `find_examples(Scope("pdf","net"), "hello
  world")` all still return `NoExampleFound`, exactly as `PDF-NET-002` originally filed, even
  though `pdf/net`'s "Example: Installation, Dependencies, and Quick Start" example's own code
  body genuinely contains all three concepts. `EML-NET-002` is 9 of 14 originally-missing repro
  words FIXED by TC-670/TC-672 (`attachment`, `SenderName`, `Alice`, `Bob`, `input`, `FromFile`,
  `Hello` now hit via the real-symbol-name and rare-code-word anchors) but 7 still MISS:
  `Subject`, `roundtrip`, `recipient`, `body`, `html`, `validation`, `load`.

  ROOT CAUSE, confirmed by reading `src/foss_mcp/mcp/tools/find_examples.py` directly (do not
  re-derive this, it is already known): TC-672's own `_RARE_CODE_WORD_EXCLUDED_TERMS` deliberately
  excludes exactly 8 words ("save", "open", "create", "page", "add", "text", "document", "load")
  from its rarity-gated plain-code-word anchor, because TC-672's own measurement found that
  admitting them via "present in fewer than half of this scope's own example documents" alone
  still produced real false matches on OTHER pilots (3d/java, cells/net, note/python,
  barcode/python, cells/java) where the word happened to be locally rare in THAT pilot's own
  corpus but not genuinely about that document's own topic. `PDF-NET-002`'s own missing words
  (`create`, `save`, `document`) are three of those exact 8 excluded words. `load` (one of
  `EML-NET-002`'s 7 remaining misses) is also one of the 8. This is NOT neglect - TC-672's card
  explicitly scoped these 8 words out after measuring the danger - so a safe fix needs a STRICTER
  test than "fewer than half", not a removal of the existing guard.

  `Subject`, `roundtrip`, `recipient`, `body`, `html`, `validation` (the remaining `EML-NET-002`
  misses that are NOT in `_RARE_CODE_WORD_EXCLUDED_TERMS`) must each be checked directly against
  the real `email/net` example corpus before assuming they are the same class of bug: confirm
  whether each word actually occurs in the relevant example's own CODE body (the same
  `_extract_example(text)` + `tokenize()` scoping `code_anchored` already uses) or only in
  surrounding prose/title - a word that never occurs in the code body at all is NOT this
  mechanism's job to fix (same as `slides/cpp`'s "watermark" miss, which TC-672 correctly declared
  out of scope as a missing-corpus-data problem, not a matcher defect). Do not assume any of these
  6 words is fixable by this card without that direct check.

  CANDIDATE MECHANISM (to be measured, narrowed, or abandoned per real numbers - this is new
  design space, not a pre-validated fix like TC-672's own card was): a FOURTH additive admission
  path, beside the title anchor, the prefix anchor, the identifier/symbol code anchor (TC-635/
  TC-670), and the rarity-gated plain-code-word anchor (TC-672) - never replacing or weakening any
  of them. Reuse `_RARE_CODE_WORD_EXCLUDED_TERMS`'s own 8 words as the candidate pool (a term
  already excluded from the existing rare-code-word path specifically because "present in fewer
  than half of this scope's documents" was not a strict enough test for it) and admit one of them
  through this new path only under a STRICTER uniqueness test than TC-672's own `< half`: the term
  occurs in EXACTLY ONE of this scope's own example documents' code (`code_example_frequency.get(t,
  0) == 1`, not merely a minority), recurs at least twice in that one document's own code (reusing
  TC-672's own existing "`>= 2` occurrences in the same document" guard, unchanged), and no other
  document in this scope's own example corpus contains the term in its code at all. This is
  strictly tighter than TC-672's existing rarity test (which already requires `* 2 < n`; this adds
  "and in fact exactly 1, with zero elsewhere") - whether it is tight enough to avoid reopening
  TC-672's own measured false-positive classes (3d/java, cells/net, note/python, barcode/python,
  cells/java) is NOT assumed here and MUST be measured by re-running the exact same ratchet bundle
  TC-672 used, on the real committed data, before and after. If measurement finds ANY regression on
  any pilot, narrow further (e.g. additionally require the admitting document's own title is not
  one of a GENERIC set the scope's OTHER documents also share - note carefully: `pdf/net`'s own
  real target document's title, "Installation, Dependencies, and Quick Start", IS itself one of
  `_is_generic_example_title`'s own generic titles, so "require a non-generic title" as a blanket
  guard would WRONGLY exclude this card's own primary target case - verify this yourself against
  the real data before adopting any title-based guard, do not copy a plausible-sounding guard
  without checking it against the real `pdf/net` case first) or report the real numbers and decline
  the fix for whichever specific word(s) cannot be made safe, exactly like `docs/DECISION_LOG.md`'s
  2026-11-06 PDF-JAVA-005 entry did for a different mechanism. A partial fix (closing `PDF-NET-002`
  and some but not all of `EML-NET-002`'s 7 remaining words) is an acceptable, honestly-reported
  outcome - do not force every word through if the real numbers do not support it.
depends_on:
  - TC-672
  - TC-688
write_paths:
  - src/foss_mcp/mcp/tools/find_examples.py
  - tests/mcp/tools/test_find_examples_rare_code_word.py
satisfies:
  - REQ-G3-011
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-06 — PDF-JAVA-005 investigated: a measured fix exists but regresses a ratchet floor; declined, not carded (supervisor)
    sha256: bb8002c9c4ba750378941c5b7038f54730da01a8c78ec2fb0023047f3c90e6a0
inputs:
  - >-
    READ FIRST: `src/foss_mcp/mcp/tools/find_examples.py`'s `find_examples()` function in full,
    especially the existing `rare_code_required` block and its three measured safety guards
    (the comments directly above and inside it explain each one's own real regression history -
    do not re-derive them, read them). Also read `docs/round2/issues.json`'s `EML-NET-002` and
    `PDF-NET-002` entries in full (their own `repro` lists are the ground truth for what must hit
    after your fix, not this card's paraphrase).
  - >-
    REPRODUCE FIRST (pin the failing fixture, per this project's own standing rule): write tests
    against the REAL committed `infra/demo-manifests` data proving, BEFORE your change: (a)
    `find_examples(store, Scope("pdf","net"), "create document")` returns `NoExampleFound`; (b) the
    same for `"save"` and for `"hello world"`; (c) for each of `EML-NET-002`'s 7 still-missing
    words (`Subject`, `roundtrip`, `recipient`, `body`, `html`, `validation`, `load`), record
    directly in your report whether the word occurs in the relevant email/net example's own CODE
    body at all (use `_extract_example` + `tokenize` by hand in a scratch script, do not guess) -
    this determines which of the 7 are even theoretically in this card's scope versus a
    missing-corpus-data problem like `slides/cpp`'s "watermark".
  - >-
    Implement the candidate mechanism described in this card's purpose. Add this exact block
    (verbatim shape required - the supervisor's negative control anchors on the comparison literal
    shown; you may add your own comments, and may factor logic into a small private helper if you
    prefer, but the comparison itself, `code_example_frequency.get(t, 0) == 1`, must appear
    character-for-character somewhere in the committed file), placed directly after
    `rare_code_required` is computed and before `code_anchor_required` is assembled:

        unique_code_required = frozenset(
            t for t in terms if t in _RARE_CODE_WORD_EXCLUDED_TERMS and code_example_frequency.get(t, 0) == 1
        )
        code_anchor_required = required | symbol_required | rare_code_required | unique_code_required

    (replacing the existing `code_anchor_required = required | symbol_required | rare_code_required`
    line with the 4-way union shown). In the per-document admission loop, add a new branch beside
    the existing `rare_hits` check that admits via `unique_code_required` ONLY when (a) the term is
    present in THIS document's own code tokens, AND (b) it recurs at least twice in this same
    document's own code (`example_code_token_counts[doc_id].get(_term, 0) >= 2`, reusing the exact
    guard `rare_hits` already uses) - give this branch its own `code_basis` value (e.g. `"unique"`)
    distinct from `"identifier"` and `"rare"`. Give it its own `MATCH_BASIS_*` constant (your own
    literal, following the existing `MATCH_BASIS_RARE_CODE_WORD` naming pattern, e.g.
    `MATCH_BASIS_UNIQUE_CODE_WORD`) and assign it only for documents admitted through this new
    branch - never relabel an existing match. Reuse `code_example_frequency`, `example_code_tokens`,
    and `example_code_token_counts` (already computed once per call) rather than re-tokenizing
    anything. If your own measurement (next step) finds this exact mechanism still regresses
    something, you may ADD a further guard condition (e.g. an additional corpus-size ceiling, by
    analogy with `_RARE_CODE_WORD_MAX_SCOPE_EXAMPLES`) alongside the mandated block above, but the
    mandated block's own two literals (`code_example_frequency.get(t, 0) == 1` and the `>= 2`
    recurrence check) must remain present unchanged - narrow by adding conditions, never by
    rewriting or removing the mandated comparison itself. If no narrowing makes a given word safe,
    leave that word out of `_RARE_CODE_WORD_EXCLUDED_TERMS`'s coverage by this new path (do not
    touch `_RARE_CODE_WORD_EXCLUDED_TERMS` itself) and report it as declined, per this card's
    purpose.
  - >-
    MEASURE, do not assume (same discipline as TC-672's own card): re-run the full existing ratchet
    bundle (`test_find_examples_title_anchor.py`, `test_find_examples_code_anchor.py`,
    `test_find_examples_symbol_aware_matching.py`, `test_find_examples_rare_code_word.py`,
    `test_forgiveness_acceptance.py`, `test_round3_retrieval_corpus.py`) BEFORE your change
    (baseline) and AFTER, and report both real number sets (hit@3, wrong-confident rate, and
    anything else that bundle measures) in your closing report. Every existing floor must hold or
    improve, never regress (Decision E, "no pilot ever gets worse"). If your first design
    regresses anything, narrow it (report what you tried and why it failed) until it does not, or
    - if no safe narrowing exists for a given word - leave that specific word unfixed and report
    it honestly as a declined case, the same way `docs/DECISION_LOG.md`'s PDF-JAVA-005 entry
    declined a different mechanism. Do not weaken, skip, or relabel any existing ratchet to make
    this card pass.
  - >-
    Write real, deterministic unit tests in the existing test file proving: (a) the real `pdf/net`
    `"create document"`/`"save"`/`"hello world"` cases now hit (or, if your measurement found they
    cannot be safely fixed, a test proving they correctly remain an honest miss, with your reasoning
    in the closing report); (b) a synthetic fixture where one of the 8 previously-excluded words
    appears in exactly one of several documents' code, recurring twice, with zero other documents
    containing it at all, correctly admits through the new path; (c) a synthetic fixture where the
    same word appears in TWO OR MORE documents' code (even if each individually would pass TC-672's
    own `< half` rarity test) does NOT admit through this new path (the exact precision guard this
    card's whole design depends on - get this wrong and you reopen TC-672's own measured
    false-positive class); (d) every existing `MATCH_BASIS_*` case from TC-635/TC-670/TC-672 is
    completely unaffected - byte-for-byte the same label as before this card.
actions:
  - >-
    Add a fourth, strictly narrower additive admission path to `find_examples` for the 8 words
    TC-672 deliberately excluded from its own rarity anchor, gated by a true scope-wide uniqueness
    test rather than a minority test, closing `PDF-NET-002` and as many of `EML-NET-002`'s 7
    remaining words as the real measured numbers support without regressing any existing floor.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_find_examples_rare_code_word.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-011
  - command: '{python} -m pytest tests/mcp/tools/test_find_examples_title_anchor.py tests/mcp/tools/test_find_examples_code_anchor.py tests/mcp/tools/test_find_examples_symbol_aware_matching.py tests/mcp/tools/test_forgiveness_acceptance.py tests/mcp/tools/test_round3_retrieval_corpus.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 7
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/find_examples.py'); s = p.read_text(encoding='utf-8'); old = 'code_example_frequency.get(t, 0) == 1'; assert s.count(old) == 1, 'the mandated literal was not found exactly once - if your real code reads differently (e.g. you added a further guard condition as the card permits), anchor your own mutate on your own real, equivalent comparison instead and note the substitution in your closeout'; p.write_text(s.replace(old, 'code_example_frequency.get(t, 0) == 999999', 1), encoding='utf-8')"
  rationale: >-
    Forces `unique_code_required` to always be empty (no real term count can ever equal 999999),
    disabling only this card's new fourth admission path without touching the title anchor, the
    prefix anchor, the identifier/symbol anchor, or TC-672's own rarity-gated anchor. Any test
    proving admission through the unique-code-word path alone (one none of the other three
    mechanisms would admit, since the term is one of TC-672's own deliberately excluded words) must
    fail under this mutation; every test of an existing mechanism is unaffected.
evidence:
  - evidence/build/G3/TC-710/receipt.json
closeout:
  - >-
    `PDF-NET-002` is closed (or honestly declined with measured reasoning) and as many of
    `EML-NET-002`'s 7 remaining missing words as the real numbers support are fixed, without
    reopening any of TC-672's own measured false-positive classes - report the real before/after
    ratchet numbers and which specific words were fixed, declined, or found out-of-scope
    (missing corpus data).
recovery: Re-run from a clean tree.
