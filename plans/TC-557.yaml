negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/indexing/chunk_builder.py');s=p.read_text(encoding='utf-8');old='JAVA_THROWS_RENDERED = True';assert s.count(old)==1;p.write_text(s.replace(old,'JAVA_THROWS_RENDERED = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch by which a Java method or constructor renders its `throws` clause, so every checked exception disappears from the served signatures again (0 of 609 rendered, the defect
    that makes an MCP-only program fail javac with 'unreported exception'): the renderer tests and the regenerated-fixture tests (pdf/java CompactionOptions and the other checked-exception pins must show
    their throws clause) fail at once.
