source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: for each of the four fixtures, regenerated at the chart pin, the served chunk text (a) renders `T...` for varargs, (b) renders a `throws` clause, (c) marks static methods and fields, (d) lists
  public non-final instance fields as properties with their type, (e) renders generic method type parameters with bounds, (f) attributes anonymous-class methods to no outer type, (g) renders record components,
  canonical constructor and accessors, (h) renders an implicit default constructor only when the language provides one (a class with no declared constructor and a public/protected class), without changing
  any currently faithful line. INDEPENDENT ORACLE for the tests: small Java sources compiled with javac in the test (skip nothing: if javac is absent the check command declares it in `requires`) and enumerated
  with javap/reflection, compared with the extractor's rendering; plus the four real pins listed in the purpose (Line.fromPoints, CompactionOptions.setPages, Color.fromArgb, Vector3.x).
- >-
  RE-PINS: change only the fixture facts the regeneration legitimately moves, with the comment `TC-557: <old> -> <new>`; add the four pilots to STALE_BAKED_PILOTS with the TC-550 wording until the supervisor
  re-ingests (TC-536 deletes the entries). Never loosen a check.
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated name: in src/foss_mcp/indexing/chunk_builder.py the exact line `JAVA_THROWS_RENDERED = True`, a real switch: when False a Java signature renders
  without any `throws` clause, exactly as before this card; all other items of the acceptance have their own tests. The extractor must record `throws` (a list of type names) per method and constructor in
  the fixture. (2) The acceptance's javac sentence is replaced: the new tests must NOT call javac, javap or maven (the oracle is a hand-written Java source whose answer follows from the Java language rules,
  written in the test, run through the extractor offline, plus assertions on the committed real fixtures). Real pins to assert on the regenerated fixtures (the round-3 audit read them from the compiled
  libraries; verify each against the clone at the chart pin and report any that is wrong): 3d/java `Line.fromPoints(Vector3...)` is varargs; 3d/java `Vector3` has public instance fields x, y, z; slides/java
  `Color.fromArgb` is static; pdf/java `CompactionOptions.setPages` and the 9 varargs methods of pdf/java render their varargs; pdf/java renders `throws IOException` where the source declares it; slides/java
  `FontData` is a record with its components. (3) RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of
  <repo>@<sha> succeeds`, never a retry loop): for each pilot in 3d, cells, pdf, slides run from the repository root `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/java.yaml
  tests/fixtures/<family>_java/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_java/pages/_index.md --max-types 100000` where <pin> is `ingestion.pilots[].library.commit`
  of infra/helm/foss-mcp/values.yaml for that pilot (never retype a commit). Each prints `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: kept must equal total and the commit must equal
  the pin; normalise CRLF to LF. Every regenerated fixture carries extractor_version 5, symbol_counts, counts and parse_failures. At registration: 3d/java 266 types, cells/java 191, slides/java 241 (these
  three still come from the OLD extractor: no extractor_version), pdf/java 1,239 (version 5). Record old and new type, function and member counts and byte sizes in the report. The chart and compose are
  not in write_paths: chart caps are 300, 300, 300, 1239; if a measured total exceeds a cap, report it. (4) EXISTING TESTS: the per-pilot Java tests (3d, pdf, cells, slides), test_api_surface_java.py, test_chunk_builder.py,
  test_chunk_builder_honesty.py and test_build_chunks.py may pin an old fact; change only such an assertion with the comment `TC-557: <old> -> <new>`, list each with its reason, never delete, skip or loosen.
  test_api_surface_java_live.py is network-gated and not yours. tests/fixtures/readme_identifier_allowlist.json only with the helper `python -X utf8 -m tests.extraction.docs_identifiers --write`; only keys
  of these four pilots may change. If a test outside write_paths fails, stop and report its name and the pinned fact. (5) TEST COUNTS: min_tests is 370 for EACH check. The first check collects 347 existing
  tests (the seven existing files it names, the two new files do not exist yet) plus the at least 23 you add in the two new files (at least 16 extractor tests in test_round3_java_fidelity.py and at least
  7 renderer tests in test_chunk_builder_round3_java.py); the second check collects well over 2,500.
- >-
  PRE-EMPTED OUT-OF-SCOPE PINS (supervisor, 2026-10-19, learned from TC-533, whose worker met eight failures outside its write_paths). A regeneration of your fixtures may legitimately move facts pinned
  by these files, now in your write_paths: tests/extraction/test_reextracted_uncapped.py (chart cap equality, SIZE_FLOOR_BYTES and MEMBER_FLOOR per pilot: re-measure only the pilots of this card, floor
  = measured value rounded down to a round number, comment <card>: <old> -> <new> with the reason), tests/extraction/test_run_extraction_coverage_policy.py, tests/deploy/test_served_coverage_matches_fixtures.py
  (MIN_FUNCTION_ENTRIES and similar non-vacuity floors: set just below the new measured total, still well above zero), tests/deploy/test_served_provenance.py and tests/mcp/tools/test_freshness_provenance.py
  (these compare the BAKED generation with the fixture; the baked data stays stale until the supervisor re-ingests, so for a pilot listed in STALE_BAKED_PILOTS of tests/deploy/test_fleet_consistency.py
  do not assert the fixture-dependent comparison, but keep everything that does not depend on the fixture; never skip, delete or xfail), README.md (only the per-pilot type/function figures that tests/deploy/test_readme_matches_release.py
  compares), and infra/helm/foss-mcp/values.yaml, docker-compose.yml and src/foss_mcp/extraction/run_extraction.py RECOMMENDED_MAX_TYPES ONLY if a measured total no longer equals the one cap number (single-line
  replacements; chart, compose and extractor must carry the same number). Run the wider offline suites (tests/indexing, tests/infra, tests/deploy, tests/mcp and the top-level tests/test_*.py, usual -k filter)
  before you report: ALL must be green, and report each file of this paragraph that you changed with its reason.
