id: TC-557
gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 (rows RD3-040 to RD3-047, RD3-044 shared with .NET). JAVA EXTRACTION FIDELITY for 3d/java, cells/java, pdf/java, slides/java. Measured by the round-3 differential against javap and reflection
  on the compiled libraries: varargs parameters dropped (3d/java Line.fromPoints(Vector3...) served fromPoints(); pdf/java 9 of 9; an MCP-literal call yields an empty object), `throws` never rendered (0
  of 609; an MCP-only program fails javac with 'unreported exception IOException'), `static` never marked (0 of 799), public mutable instance fields never served (3d/java 55, pdf/java 133, slides/java 10),
  generic method type parameters and bounds dropped (14), anonymous-inner-class methods attributed to the outer type (pdf/java about 21, cells/java 6), record members lost (slides/java FontData), implicit
  default constructors not rendered (pdf/java 84, cells/java 55, 3d/java 19, slides/java 9). The cut cards TC-526/527/528/531 never fixed this; the successor TC-546 only documented it. Everything else in
  these four Java pilots was verified faithful (return types 14,583 of 14,583, inheritance, overloads), so the change must not regress it. FINALISED for dispatch on 2026-10-19 by the supervisor (min_tests
  calibrated per check, negative control authored, write_paths checked).
