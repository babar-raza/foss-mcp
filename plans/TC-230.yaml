id: TC-230
gate: G2
lane: transport-deployment
purpose: 'Make install_pilots.py re-roll a release onto a new image tag without manual intervention. The 2026-10-07 re-roll of all
  twenty local pilots onto one consistent tag failed with "cannot patch ... with kind Job: ... spec.template: Invalid" until the
  supervisor deleted each release''s ingestion Job by hand first - a Job''s pod template is immutable, and helm upgrade cannot patch it.
  The operator''s instruction was explicit: shipping on local must have no blockers. This card makes install_pilots.py delete the
  release''s own ingestion Job (by label, scoped to that one release) immediately before the helm upgrade, every time, so a re-roll
  never needs a manual kubectl command again. A release with no existing Job (a first install) is unaffected.'
depends_on:
- TC-227
- TC-223
write_paths:
- scripts/deploy/install_pilots.py
- tests/deploy/test_install_pilots.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read scripts/deploy/install_pilots.py in full, especially install_one, helm_install_command, and the --dry-run path in main. Read
  tests/deploy/test_install_pilots.py in full.'
- 'Add a function job_delete_command(namespace, release) returning the argv list: kubectl, delete, job, -n, namespace, -l,
  "app.kubernetes.io/instance=" + release + ",app.kubernetes.io/component=ingestion", --ignore-not-found. --ignore-not-found makes a
  first install (no existing Job) a no-op, never a failure.'
- 'In install_one, run that delete command (via the same _run helper) immediately before the helm upgrade command, every time. Its
  exit code does not gate the helm step: only the helm command''s rc feeds into InstallResult. Record the delete''s own command and rc
  in a new InstallResult field job_delete_rc (int), so a real delete failure is visible in install-results.json without blocking the
  install. In --dry-run mode, print the delete command on its own line immediately before each pilot''s helm command, and run neither.'
- 'Add tests to tests/deploy/test_install_pilots.py, keeping every existing test: job_delete_command builds the exact argv with the
  label selector naming the release and --ignore-not-found; install_one (subprocess mocked) issues the delete call before the helm
  call, for every pilot, and a delete failure (mocked nonzero rc) still lets the helm call run and still produces an InstallResult with
  rc 0 when helm succeeds; dry-run prints one delete line and one helm line per pilot, in that order, and makes no subprocess call.'
- 'Contract restatement, by the supervisor after the attempt-1 block. Attempt 1 correctly stopped: three existing tests in
  tests/deploy/test_install_pilots.py pin the old guarantee that this tool never deletes anything, which this card deliberately
  narrows to "never uninstalls a helm release, and the only delete it ever runs is its own scoped Job delete." Restate exactly these
  three, by name, and no other test:
  (1) test_dry_run_covers_all_twenty_pilots_and_never_builds_an_uninstall (line ~119): rename to
  test_dry_run_prints_one_delete_and_one_upgrade_line_per_pilot_and_never_a_release_uninstall. The dry-run now prints 40 lines (two
  per pilot): assert len(lines) == 40; taking the lines in pairs, the first of each pair has tokens[:3] ==
  ["kubectl", "delete", "job"] and the second has tokens[:3] == ["helm", "upgrade", "--install"]; neither line contains the word
  "uninstall"; no line''s tokens start with ["helm", "uninstall"].
  (2) test_no_command_is_ever_an_uninstall_or_a_delete_even_when_installs_fail (line ~266): rename to
  test_no_command_is_ever_a_helm_uninstall_and_every_delete_is_this_releases_own_job_delete. For every recorded command: it is never
  (cmd[0] == "helm" and cmd[1] == "uninstall"); and whenever cmd[0] == "kubectl" and "delete" in cmd, cmd[:3] == ["kubectl", "delete",
  "job"] and "--ignore-not-found" in cmd (i.e. it is exactly a job_delete_command call, never any other delete).
  (3) test_the_installer_source_names_no_uninstall_or_delete_command (line ~281): rename to
  test_the_installer_source_names_no_helm_uninstall_and_delete_appears_only_in_job_delete_command. Keep
  assert ''"uninstall"'' not in text and assert "helm uninstall" not in text. Replace the removed
  assert ''"delete"'' not in text with: assert text.count(''"delete"'') == 1, and that the one occurrence sits inside
  job_delete_command''s own source (for example by checking it falls between that function''s def line and the next top-level def).
  (4) test_dry_run_prints_the_helm_command_for_one_pilot_and_runs_nothing (line ~96): rename to
  test_dry_run_prints_the_delete_and_helm_commands_for_one_pilot_and_runs_nothing. Change len(out) == 1 to len(out) == 2; keep
  "--set image.tag=t1" in out[1] and not values_dir.exists(); add out[0].split()[:3] == ["kubectl", "delete", "job"]; change
  out[0].startswith(...) to out[1].startswith("helm upgrade --install foss-mcp-pdf-net ").
  (5) test_missing_namespace_is_created_before_any_install (line ~152): rename to
  test_missing_namespace_is_created_before_any_install_and_before_the_job_delete. Change the kube equality to: kube ==
  [["kubectl", "get", "namespace", "fresh"], ["kubectl", "create", "namespace", "fresh"],
  ["kubectl", "delete", "job", "-n", "fresh", "-l",
  "app.kubernetes.io/instance=foss-mcp-pdf-net,app.kubernetes.io/component=ingestion", "--ignore-not-found"]]. Keep the existing
  ordering assertion (the create-namespace call still precedes the first helm call) unchanged.
  This is now five named tests in total, (1) through (5). Do not change any other test in the file. Record this restatement in the
  commit body, and say explicitly that attempt 2 found two more pre-existing tests the first restatement missed, exactly as its own
  report described - that is this card''s own process working as intended, not a defect to hide.'
actions:
- Read the tool and its tests.
- Add the delete step and the dry-run line, and the four tests.
- Run the card check and report exact counts.
checks:
- command: '{python} -m pytest tests/deploy/test_install_pilots.py -q -rfE'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 21
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('scripts/deploy/install_pilots.py');s=p.read_text(encoding='utf-8');p.write_text(s.replace('--ignore-not-found','--ignore-not-present'),encoding='utf-8')"
  rationale: 'Renames the flag that makes a missing Job a no-op, so the test that pins the exact delete command must fail. The text appears once in the file. Built with plain text.'
evidence:
- evidence/build/G2/TC-230/receipt.json
closeout:
- Re-rolling a pilot onto a new image tag needs no manual kubectl command, on any number of releases.
recovery: Re-run from a clean tree.
