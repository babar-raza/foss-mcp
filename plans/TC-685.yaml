id: TC-685
gate: G3
lane: transport-deployment
purpose: >-
  RT2 (runtime/contract sub-program, section 2.7: "Hosting config is versioned into
  `infra/hosting/**` (secret scan first); fixes only on measured evidence (RT4)"). The
  nginx-gateway + cloudflared-tunnel layer that sits in front of the 32-pilot demo fleet exists
  TODAY only as operator-local files outside this repository
  (`C:\Users\babar\.foss-mcp-tools\hosting\{nginx.conf,compose.yaml,pilots.txt}`), confirmed by
  this session's own direct read of those real files - not reconstructed from memory, not
  fabricated. `docker-compose.demo.yml` (already committed, auto-generated by
  `scripts/release/generate_demo_compose.py`) covers only the 32 per-pilot containers themselves
  (confirmed: zero occurrences of "nginx"/"cloudflared" in it) - the gateway/tunnel layer is a
  real, separate, currently-unversioned gap.

  SECRET SCAN PERFORMED (supervisor, this session, on the real files before bringing them in):
  zero tokens, credentials, or account-identifying strings in any of the three files.
  `mcp-tunnel`'s own command (`cloudflared tunnel --no-autoupdate --url http://mcp-gateway:8080`)
  is the anonymous, no-account Cloudflare quick-tunnel invocation - nothing to redact.

  DIAGNOSTIC VALUE, confirmed directly against the real file (read verbatim, not paraphrased -
  this directly corroborates section 2.7/2.9's own latency hypothesis and will matter to RT4):
  `nginx.conf` has `worker_processes 1;` (exactly the "one worker" finding), a `resolver
  127.0.0.11 valid=10s` directive (per-request DNS re-resolution of the upstream container name,
  not a cached/keepalive upstream), and `proxy_pass http://mcp-$pilot:8080/$rest$is_args$args;`
  with `$pilot` taken from the request path on every single request - a VARIABLE proxy_pass,
  which nginx cannot pool/reuse connections for, forcing a fresh upstream connection (and the
  DNS lookup above) on every request. This is real, read evidence for RT4's eventual fix, not a
  guess.
depends_on:
  - TC-018
  - TC-599
write_paths:
  - infra/hosting/nginx.conf
  - infra/hosting/compose.yaml
  - infra/hosting/pilots.txt
  - infra/hosting/README.md
  - tests/infra/test_hosting_config.py
satisfies:
  - REQ-G3-016
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top
      priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    The supervisor has already read the real, current operator-local files and reproduces their
    exact content below - copy them VERBATIM (byte-for-byte, do not "improve" or re-derive them;
    this card versions the real, known-working config, it does not redesign it) into
    `infra/hosting/`:

    `infra/hosting/nginx.conf` (verbatim copy of
    `C:\Users\babar\.foss-mcp-tools\hosting\nginx.conf`):

        worker_processes 1;
        pid /tmp/nginx.pid;
        events { worker_connections 1024; }
        http {
            access_log /dev/stdout;
            error_log  /dev/stderr warn;
            client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
            resolver 127.0.0.11 valid=10s ipv6=off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            server {
                listen 8080;
                location = / { default_type text/plain; return 200 "foss-mcp gateway (image demo-ce89954): /<family>-<platform>/mcp\n"; }
                location ~ ^/(?<pilot>[a-z0-9]+-[a-z0-9]+)/(?<rest>.*)$ {
                    proxy_set_header Host mcp-$pilot;
                    proxy_pass http://mcp-$pilot:8080/$rest$is_args$args;
                }
            }
        }

    `infra/hosting/compose.yaml`: verbatim copy of
    `C:\Users\babar\.foss-mcp-tools\hosting\compose.yaml` (858 lines in the operator path is
    `docker-compose.demo.yml`'s own line count, not this file's - this file is ~438 lines: 32
    per-pilot services each named `mcp-<family>-<platform>` with `image:
    foss-mcp-serving:demo-cac9288`, `read_only: true`, `tmpfs: [/tmp]`, `mem_limit: 256m`, `cpus:
    0.5`, `cap_drop: [ALL]`, `security_opt: ["no-new-privileges:true"]`,
    `environment.FOSS_MCP_PILOT: "<family>/<platform>"`, `networks: [mcp]`; plus 2 more services -
    `mcp-gateway` (`nginxinc/nginx-unprivileged:1.27-alpine`, `volumes:
    ["./nginx.conf:/etc/nginx/nginx.conf:ro"]`, same hardening flags) and `mcp-tunnel`
    (`cloudflare/cloudflared:latest`, `command: tunnel --no-autoupdate --url
    http://mcp-gateway:8080`, `depends_on: [mcp-gateway]`); top-level `name: foss-mcp-hosting` and
    `networks: {mcp: {}}`. READ THE REAL FILE YOURSELF at the real operator path before copying -
    this description is a guide to what you should find, not a substitute for reading it;
    if what you find differs in any way, copy the REAL content and note the discrepancy in your
    closeout.

    `infra/hosting/pilots.txt`: verbatim copy of
    `C:\Users\babar\.foss-mcp-tools\hosting\pilots.txt` (the 32 pilot identifiers, one per line,
    `family/platform` form, matching `docker-compose.demo.yml`'s own pilot list exactly - verify
    this cross-check yourself, report any mismatch rather than silently resolving it).
  - >-
    Write `infra/hosting/README.md`: a short, factual note (not marketing copy) explaining what
    this directory is (a versioned, reviewable copy of the real local hosting gateway
    configuration used for the demo's public-URL path - nginx reverse proxy + cloudflared quick
    tunnel in front of the 32 per-pilot containers `docker-compose.demo.yml` already defines),
    that it is NOT currently wired into any automated deploy (redeploying for real still means
    copying these files to the operator-local path and running `docker compose -p
    foss-mcp-hosting -f compose.yaml up -d` there, per this session's own prior practice), and
    the diagnostic note about `worker_processes 1`/`resolver ... valid=10s`/variable `proxy_pass`
    from this card's own purpose text (verbatim or your own equivalent wording) so RT4's future
    work does not have to re-derive it.
  - >-
    Write `tests/infra/test_hosting_config.py` with REAL, OFFLINE (no docker/network) tests
    proving: (a) `infra/hosting/nginx.conf` contains the 3 real directives named above
    (`worker_processes 1`, the `resolver` line, the variable `proxy_pass` pattern) - this pins the
    diagnostic evidence itself, not just the file's existence; (b) `infra/hosting/compose.yaml`
    parses as valid YAML and defines exactly 34 services (32 pilots + `mcp-gateway` +
    `mcp-tunnel`), each pilot service's `FOSS_MCP_PILOT` env value is a real, valid `family/platform`
    string that appears in `infra/hosting/pilots.txt`; (c) `mcp-gateway`'s service definition
    mounts `./nginx.conf` read-only and `mcp-tunnel` depends on `mcp-gateway` and uses the
    anonymous (`--url`, no token flag) quick-tunnel command; (d) every pilot name in
    `infra/hosting/pilots.txt` has a matching service in `compose.yaml` and vice versa (symmetric
    difference is empty) - this is the "secret scan first" card's own real, lasting regression
    guard: a future accidental mismatch (a pilot added to one file but not the other) fails loudly
    rather than drifting silently.
  - >-
    Re-run a secret scan over the 3 new config files yourself (reuse
    `ops/gatectl.py secret-scan` if it can be pointed at arbitrary paths, or `ops/gatecli.py`'s own
    `secret_scan` helper - check how the pre-commit hook invokes it) before committing, and report
    the real result in your closeout, even though the supervisor already did this once - a second,
    independent check on the committed bytes (not the operator-local original) costs nothing and
    catches a copy-paste mistake.
actions:
  - >-
    Version the real, currently operator-local-only nginx-gateway + cloudflared-tunnel hosting
    configuration into `infra/hosting/`, verbatim, with a real-content regression test (not just an
    existence check) and a documented diagnostic note connecting it to RT1's own latency
    measurement for RT4's future use - closing RT2 for the demo's public-URL hosting path.
checks:
  - command: '{python} -m pytest tests/infra/test_hosting_config.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 120
    junitxml: true
    proves:
      - REQ-G3-016
min_tests: 4
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('infra/hosting/nginx.conf'); s = p.read_text(encoding='utf-8'); old = 'worker_processes 1;'; assert s.count(old) == 1, 'the required literal was not found as expected - if your real committed file formats this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; p.write_text(s.replace(old, 'worker_processes 4;', 1), encoding='utf-8')"
  rationale: >-
    Changes the committed config's real worker-count directive away from the real operator-local
    value, so the test asserting this specific diagnostic fact is present must fail - proving the
    test actually reads the committed file's real content, not a hardcoded expectation divorced
    from it.
evidence:
  - evidence/build/G3/TC-685/receipt.json
closeout:
  - >-
    The demo's gateway/tunnel hosting layer is now versioned, reviewable, and reproducible under
    `infra/hosting/`, verbatim from the real operator-local config, with a real-content regression
    test and a documented diagnostic note (one worker, per-request DNS resolution, a non-poolable
    variable `proxy_pass`) directly supporting RT4's future fix.
recovery: Re-run from a clean tree.
