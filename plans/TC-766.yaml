id: TC-766
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), continuing the same real pilot-adoption pattern this
  session has already proven on 25 other sibling pilots (zero file overlap with any of them -
  do not touch anything any of them touch) via the EXISTING, already-wired
  `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`). Confirmed needing ZERO code
  change: `infra/build_chunks.py`'s `_load_authored_candidates` auto-loads `tests/fixtures/
  furnished/<pilot>/authored_examples.yaml`, merges it with README-derived candidates, and runs
  every entry through `verify_dotnet_example`, publishing only the ones that pass.

  `3d/net` currently serves only 5 real example chunks (the authoritative count - read
  `payload.stats.examples` directly from the real committed `infra/demo-manifests/
  3d__net__self_extracted` generation JSON via `json.load`, NEVER by grepping a literal string,
  which overstates the count roughly 2x). Its own real floor is 8-16 (Appendix C of the foss-mcp
  unified plan). Its real pinned repository is `aspose-3d-foss/Aspose.3D-FOSS-for-.NET`
  (re-confirm the exact pinned commit from `infra/helm/foss-mcp/values.yaml` or
  `infra/demo-inputs/` - do not trust this card's own citation blindly).

  Per the project's own Appendix-C accounting, 3d/net ships NO dedicated `examples/`-style sample
  directory upstream (class C: none; 16 tests) - seed from the library's own test suite / API
  surface instead. Note `3d/net`'s own known upstream limits already disclosed in
  `config/known_defects/3d__net.yaml` (3D-NET-001: many rendering-engine types absent from the
  real published package; RVM/AMF/HTML5/Universal export genuinely broken) - do not author an
  example that exercises any already-disclosed broken path; stick to construction, scene-graph,
  transform, and format round-trips that genuinely work.

  `_MAX_EXAMPLES = 5` is a hard ceiling. Up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.

  ADDED after attempt 1 (same card, widened and corrected - not a new card, since the real root
  cause and fix mechanism are unchanged): attempt 1's worker correctly authored and personally
  verified all 5 examples (compiled AND run against the real pinned package) and correctly found
  a real, out-of-scope structural blocker rather than guessing past it: `3d_net` is one of exactly
  two `_BUILTIN_PILOTS` (`src/foss_mcp/indexing/authored_examples.py`, alongside `3d_java`) whose
  authored examples are currently hardcoded in that module rather than a sidecar file, specifically
  so `tests/indexing/test_authored_examples.py::test_tc565_build_chunks_loads_the_builtin_
  examples_for_a_pilot_without_a_sidecar` can prove the builtin-fallback path is genuinely
  reachable (`TC-565`'s own integration-liveness proof). The moment a real sidecar exists for
  `3d_net`, that test's own assertion ("no sidecar may exist for a builtin pilot") correctly fails
  - this is the test doing its job, not a bug to work around.

  `write_paths` is now widened to include both of those two files. The fix: drop the `"3d_net"`
  entry from BOTH `_BUILTIN_PILOTS` dicts (`src/foss_mcp/indexing/authored_examples.py`'s own
  dict, and `tests/indexing/test_authored_examples.py`'s own parallel `BUILTIN_PILOTS` dict at
  line ~1195) while leaving `"3d_java"` untouched in both, so `TC-565`'s own liveness proof still
  holds for the one pilot still genuinely on the builtin path. `build_chunks.py`'s
  `_load_authored_candidates` already prefers a real sidecar over the builtin fallback whenever
  one exists (`use_builtin = not sidecar.is_file() and has_builtin_authored_examples(...)`) - so
  this is a pure, safe supersession: the 2 old builtin 3d_net examples are replaced by attempt 1's
  5 new, individually-verified sidecar examples (a real net gain), and nothing about 3d_java's own
  path changes at all.
depends_on:
  - TC-460
  - TC-530
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/3d_net/authored_examples.yaml
  - tests/indexing/test_authored_examples_3d_net.py
  - src/foss_mcp/indexing/authored_examples.py
  - tests/indexing/test_authored_examples.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-12 — find_examples wrong-confident regression fully closed: 41/729 (0.0562), under the 0.059 ceiling
    sha256: 9d9e4ee89b864fe77bbb35f84f660ce91c72fbe569c5c5e6bb38da447dd2d794
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_net/authored_examples.yaml` and its sibling test
    file (same-language .NET template, from `TC-760`/`TC-762`). Also read
    `src/foss_mcp/indexing/authored_examples.py` in full (every structural rule -
    `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit, `LANGUAGE_BY_PLATFORM` maps `net` -> `csharp`),
    `src/foss_mcp/indexing/example_verifier.py`'s `verify_dotnet_example`, and
    `infra/build_chunks.py`'s `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `3d/net`'s real current served count (via `payload.stats.examples`)
    and real pinned repository/commit yourself. Read `config/known_defects/3d__net.yaml` in full
    so you do not accidentally author an example around an already-disclosed broken feature.
  - >-
    CRITICAL - BEFORE TITLING ANY EXAMPLE: this session closed a real, severe fleet-wide
    regression (see `docs/DECISION_LOG.md`'s 2026-11-10 through 2026-11-12 entries) caused by
    earlier authored-example titles using common generic words (e.g. "page", "read", "set", "add",
    "save", "node") that collided with unrelated queries via `title_anchored`
    (`src/foss_mcp/mcp/tools/relevance.py`). `3d/net`'s own sibling `3d/typescript` was one of the
    pilots this regression hit hardest (via the word "node" - see `TC-763`). Give each new example
    a SPECIFIC, multi-word, low-collision title, and before finalizing any title, grep
    `tests/mcp/tools/test_round3_retrieval_corpus.py`'s real 3d/net task queries and this pilot's
    OWN existing example titles for the exact words you plan to use. Run the real `find_examples`
    corpus check locally after adding your titles (not just the card's own listed check) to
    confirm you have not reintroduced a title-collision regression.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: install the real pinned package in a throwaway
    .NET project, run each adapted example, confirm its real output matches what you claim. Do not
    submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input. Confirm none of your examples trips them.
  - >-
    Run `ruff format` and `ruff check` on the new Python test file before committing (the test
    file itself is Python even though the examples it verifies are C#).
  - >-
    This card does NOT claim `3d/net`'s example-corpus work is complete. If fewer than 5 real
    candidates verify cleanly, submit the real number and say so honestly - as several prior
    sibling cards this session correctly did (e.g. `TC-764` published 4 of 5 after finding and
    correctly dropping a candidate that exercised a real, previously-unknown upstream bug rather
    than shipping a wrong assertion).
  - >-
    ADDED after attempt 1: drop exactly the `"3d_net"` entry from `_BUILTIN_PILOTS`
    (`src/foss_mcp/indexing/authored_examples.py`) and from the parallel `BUILTIN_PILOTS` dict in
    `tests/indexing/test_authored_examples.py` - leave `"3d_java"` (and everything else in both
    files) completely untouched. Re-run the full `tests/indexing/test_authored_examples.py` suite
    (not just the one previously-failing test) to confirm nothing else keyed off the now-removed
    `"3d_net"` entry breaks. If attempt 1's own two files (the sidecar YAML and its test) are
    already correct and verified, do not redo that work - just make this one additional, narrowly
    scoped change and re-run both of the card's required checks.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for 3d/net via the existing
    authored_examples.yaml mechanism, raising its served example count from 5 toward 10, with
    titles deliberately checked against the fleet-wide title-anchor collision class this session
    already closed once, and none exercising an already-disclosed broken upstream feature.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_3d_net.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
  - command: '{python} -m pytest tests/mcp/tools/test_round3_retrieval_corpus.py tests/mcp/tools/test_forgiveness_acceptance.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 900
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/3d_net/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class found earlier this
    session, and it never touches any code path. Confirm by hand that the check files named
    actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-766/receipt.json
closeout:
  - >-
    3d/net gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 5 toward 10 - real, bounded progress toward its own (8-16) floor, with titles
    deliberately verified against the fleet-wide title-anchor regression class this session
    already closed once, so as not to reopen it.
recovery: Re-run from a clean tree.
