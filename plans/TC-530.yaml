gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-01, AGT-03, AGT-05, RST-13, RST-15 .NET part). RE-EXTRACT THE EIGHT .NET FIXTURES.
  The extractor cards TC-520 to TC-528 change nothing a peer sees until the committed fixtures are regenerated. Measured on the committed tree on
  2026-10-15: pdf_net keeps 300 of 901 types and words_net 300 of 618, because the old cap is spent by centrality, which scores leaf entry points
  zero; the README of pdf/net names PdfFileEditor, PngDevice, TextBuilder, PdfFileSignature, PageCollection and TableAbsorber and none of them is
  indexed, the README of words/net names FindReplaceOptions, JoinRunsOptions, PaperSize and Orientation and none of them is indexed; with the
  definition of the TC-521 helper (single-backtick, API-shaped identifiers of the furnished page) 553 of 935 pdf_net identifiers and 215 of 637
  words_net identifiers do not resolve (recall 41 and 66 percent). A prototype extraction on 2026-10-15 with the UNMERGED extractor at the pin and no
  cap kept 901 of 901 pdf_net types and left 12 of 935 identifiers unresolved (98.7 percent) and 618 of 618 words_net types with 9 of 637 unresolved
  (98.6 percent), so the 90 percent target below is reachable; it also confirmed that Aspose.Pdf.Facades.PdfFileEditor, Aspose.Pdf.Devices.PngDevice,
  Aspose.Pdf.Text.TextBuilder, Aspose.Pdf.Facades.PdfFileSignature, Aspose.Pdf.PageCollection, Aspose.Pdf.Text.TableAbsorber,
  Aspose.Pdf.Document.MergeOptions, Aspose.Words.Replacing.FindReplaceOptions, Aspose.Words.JoinRunsOptions, Aspose.Words.PaperSize and
  Aspose.Words.Orientation exist at the pins. Today a member keeps only the first sentence of its comment (3,887 of the 4,887 members in pdf_net's
  first 300 types have one) and no parameter, return or exception text. This card regenerates pdf_net, words_net, cells_net, email_net, imaging_net,
  jmap_net, 3d_net and slides_net at their pinned commits with the merged extractor (README-mention selection of TC-520, member documentation of
  TC-527), raises the extraction cap and the ingestion maxTypes in step for pdf_net (901) and words_net (618), regenerates the README-identifier
  allowlist, updates the existing tests that pinned the old fixtures, creates the shared fixture-test helper of the whole chain and creates the
  fleet-consistency transition mechanism. What it does NOT change: src/ (the extractor), any furnished page, infra/demo-manifests (the supervisor
  re-ingests after TC-535), any sidecar, memory limits.
