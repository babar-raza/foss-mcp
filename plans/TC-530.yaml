  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  ORDER AND FRESHNESS. TC-530 belongs to the strict chain TC-530 -> TC-531 -> TC-532 -> TC-533 -> TC-534 -> TC-535 -> TC-536 (dispatch in id order;
  the cards share infra/helm/foss-mcp/values.yaml, docker-compose.yml, tests/deploy/test_fleet_consistency.py,
  tests/fixtures/readme_identifier_allowlist.json, tests/indexing/test_chunk_builder_honesty.py and tests/extraction/reextraction_checks.py). It runs
  only after the extractor cards TC-520 to TC-528 are merged on main. Everything named below (command-line flags, module constants, fixture keys,
  helper functions, test names of other cards) was written from the specifications of those cards BEFORE they were implemented, and you must verify
  each name against the MERGED code before you rely on it: if a merged name differs, use the merged name and list the difference in your report; if a
  feature a step needs is simply not in the merged code, stop and report it as FAILED_INTERNAL, because src/ is not in your write_paths and you must
  not patch the extractor. Start from a clean tree at the commit the supervisor issues. Never print or log any environment value: the extraction
  clones with git over https and needs no token, and GITHUB_TOKEN is not read by it.
- >-
  READ FIRST (merged code, read only): src/foss_mcp/extraction/run_extraction.py (`main` and its flags `--commit`, `--keep-names-from`, `--max-types`;
  the constants `EXTRACTOR_VERSION`, `RECOMMENDED_MAX_TYPES`, `README_KEEP_FRACTION`; `reduce_fixture`; the keys the artifact carries:
  `extractor_version`, `symbol_counts`, `parse_failures` (TC-520), `counts` (TC-525), and on members `doc`, `params[].doc`, `return_doc`, `throws_doc`
  (TC-527, TC-528)); tests/extraction/docs_identifiers.py (TC-521: `docs_identifiers(pilot)`, `unresolved(pilot)`, `compare(pilot)`,
  `load_allowlist()` and the command `python -m tests.extraction.docs_identifiers --write`); src/foss_mcp/indexing/chunk_builder.py
  (`build_chunks_from_api_surface(fixture, title=..., max_types=...)`, the slot rule of TC-522 and the `API-Coverage:` line of TC-520);
  tests/deploy/test_fleet_consistency.py (TC-513); infra/helm/foss-mcp/values.yaml (`ingestion.pilots[]`: `family`, `platform`, `maxTypes`,
  `library.repository`, `library.commit`); docker-compose.yml (the `ingest-<family>-<platform>` services and their `--max-types` value);
  tests/infra/test_helm_pilots_match_compose.py (the parity rule).
- >-
  RE-EXTRACTION, one pilot at a time. Derive family, platform, pinned commit and cap from the chart and the merged constant, never retype them: the
  pilot key is `<family>_<platform>` (the directory name under tests/fixtures); the commit is `ingestion.pilots[].library.commit` of
  infra/helm/foss-mcp/values.yaml for that pilot; the cap is `RECOMMENDED_MAX_TYPES.get('<family>/<platform>', 300)` read from
  src/foss_mcp/extraction/run_extraction.py. The caps that differ from the default 300 for this card are (TC-520 `RECOMMENDED_MAX_TYPES`, key
  `<family>/<platform>`): pdf_net 901, words_net 618. Read the real values from the merged constant rather than trusting this list. With the toolchain
  activated in the SAME shell command (`scripts/toolchain/activate.ps1`) and `PYTHONPATH=src` set, from the repository root run, for each pilot,
  exactly: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml tests/fixtures/<pilot>/api_surface.json
  --commit <pin> --keep-names-from tests/fixtures/furnished/<pilot>/pages/_index.md --max-types <cap>` (the command of the earlier re-extraction cards
  TC-400 and TC-401 plus the explicit cap; confirm the flags with `--help` first). Never regenerate or edit a furnished page. The command prints
  `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: the commit must equal the pin, and `<kept>` must be the smaller of the cap and
  `<total>` (a Python pilot may keep more than the cap because a re-export and its definition travel together). Runtime measured on 2026-10-15 with
  the pre-merge extractor: 4 to 60 seconds per pilot after the clone; words/net alone needed about 8 minutes for the clone and checkout; the merged
  extractor also parses doc comments, so allow twice that. Run each pilot as its own command, start slow ones in the background and poll with bounded
  waits (never a tail -F monitor on process output), and continue with the next pilot after a failure. If a clone or fetch fails (network, rate limit,
  an unreachable commit) do not retry in a loop: record `gatectl status-append` with BLOCKED_EXTERNAL and the exact resume predicate `git fetch of
  <repo>@<sha> succeeds`, keep every fixture you already regenerated, and stop. The CLI writes with the platform line ending and .gitattributes
  normalises to LF on commit: confirm `git diff --stat` shows each fixture as a content change and not as a whole-file line-ending rewrite. Order of
  work: pdf_net and words_net first (the two capped pilots), then the other six. Expected on pdf_net: `901/901 types`; on words_net: `618/618 types`.
- >-
  CHART AND COMPOSE. For every pilot of this card whose cap differs from the `maxTypes` now in infra/helm/foss-mcp/values.yaml (300 everywhere today),
  set that pilot's `maxTypes` to the cap AND the `--max-types` value of its `ingest-<family>-<platform>` service in docker-compose.yml to the same
  number, with targeted single-line replacements inside that pilot's block or service only (tests/infra/test_helm_pilots_match_compose.py and the
  `two_step_chain` test of tests/infra/test_helm_chart.py compare the rendered chart command with the compose command and fail on any difference).
  Why: infra/build_chunks.py slices the fixture again with `--max-types`, so a 300 there would silently cut what the extraction kept. For this card
  that means pdf_net (901), words_net (618). Every other byte of both files stays as it is, and you do not touch memory limits (the supervisor
  measures ingestion memory at the re-ingest). Pilots at the default cap are left untouched.
- >-
  README IDENTIFIER ALLOWLIST. tests/extraction/test_docs_identifiers_resolve.py (TC-521) fails for a pilot whose committed fixture resolves a
  different set of README-named identifiers than tests/fixtures/readme_identifier_allowlist.json lists, in both directions (a new gap, and a listed
  gap that is fixed). After re-extracting, regenerate the file with the helper only: `python -X utf8 -m tests.extraction.docs_identifiers --write`
  (never by hand), then read `git diff` of that file: only keys of pilots of this card may change. A key of a pilot you did not touch changing means
  the allowlist was already stale at your start commit: stop and report it. For every pilot of this card read the identifiers that remain listed and
  put in your report each one that looks like an API symbol of the library (each is an extraction defect to report, not something to leave allowlisted
  silently); the legitimate remainder is non-API text such as a build tool or a file name.
- >-
  THE SHARED HELPER (YOU CREATE IT): tests/extraction/reextraction_checks.py, a plain module (not collected as tests) that TC-531 to TC-535 import.
  Keep it small, typed, and free of any import from tests/deploy. It defines: `REPO_ROOT`; `FIXTURES_DIR`; `pilot_key(family, platform)`;
  `chart_pilot(key) -> dict` (the `ingestion.pilots[]` entry whose family_platform is `key`, read from infra/helm/foss-mcp/values.yaml);
  `pinned_commit(key) -> str`; `recommended_cap(key) -> int` (`run_extraction.RECOMMENDED_MAX_TYPES.get('<family>/<platform>', 300)`);
  `chart_max_types(key) -> int`; `compose_max_types(key) -> int` (yaml.safe_load docker-compose.yml, take
  `services['ingest-<family>-<platform>']['command']`, shlex.split the joined text and read the value after `--max-types`); `load_fixture(key) ->
  dict` (functools.cache; parse tests/fixtures/<key>/api_surface.json); `fixture_text(key) -> str`; `type_names(fixture) -> set[str]` (every entry
  `name` and the last segment of every `class_import`, splitting on `.`, `::` and `/`); `fqns(fixture) -> set[str]` (every non-empty `class_import`);
  `members(fixture)` yielding `(entry, member)` for every dict in an entry's `methods` and `properties`; `member_doc_stats(fixture) -> dict` with the
  integer keys `members`, `members_with_doc` (non-empty `doc`), `params`, `params_with_doc` (a parameter dict with a non-empty `doc`),
  `methods_with_return_doc`, `methods_with_throws_doc`; `abbreviation_cut_docs(fixture) -> list[str]` (every `doc`, parameter doc, `return_doc` or
  throws text whose stripped value ends in `e.g.`, `i.e.`, `e.g` or `i.e`); `test_file_entries(fixture) -> list[str]` (the `class_import` or `name` of
  every entry for which `foss_mcp.extraction.run_extraction._is_test_entry` is true); `ingestion_slice_problems(key) -> list[str]` (build the chunks
  twice with `build_chunks_from_api_surface(fixture, title=key, max_types=chart_max_types(key))` and with `max_types=10**6`; a problem string if the
  counts differ - the ingestion slice must drop nothing the extraction kept); `cap_problems(key) -> list[str]` (the chart's maxTypes, the compose
  value and `recommended_cap(key)` are one number; `reduced_type_count == len(types)`; `truncated == (reduced_type_count < type_count)`; `type_count
  <= cap` implies `truncated` is false); `readme_recall(key) -> float` (`1 - len(unresolved(key)) / len(docs_identifiers(key))` from
  tests.extraction.docs_identifiers, 1.0 when the page names no identifier); `REQUIRED_EXTRACTOR_VERSION: int` set to the value
  `run_extraction.EXTRACTOR_VERSION` has in the merged code you start from (5 if only TC-520 to TC-523 bumped it; use the merged value). Every
  function returning problems returns an empty list when all is well. The helper gets its own synthetic tests in
  tests/extraction/test_reextracted_dotnet.py (see below).
- >-
  GENERIC TESTS of tests/extraction/test_reextracted_dotnet.py (NEW, offline, deterministic, no skips; import the helper; parametrised over the module
  list `PILOTS = ['pdf_net', 'words_net', 'cells_net', 'email_net', 'imaging_net', 'jmap_net', '3d_net', 'slides_net']`; every test id carries the
  pilot): `test_fixture_is_extracted_at_the_chart_pin` (source_commit equals `pinned_commit(key)` and is 40 hex characters),
  `test_fixture_carries_the_current_extractor_keys` (`extractor_version >= REQUIRED_EXTRACTOR_VERSION`; `symbol_counts` is a dict with integer `types`
  and `functions`; when `parse_failures` exists its `engine` is `ast` or `tree-sitter` and `failed`, `total` are integers with failed <= total),
  `test_fixture_is_canonical_json` (the file text equals `json.dumps(data, indent=2, sort_keys=True) + chr(10)`, which is how the CLI writes it),
  `test_fixture_has_no_test_file_entries` (`test_file_entries` is empty), `test_cap_is_one_number_in_extractor_chart_and_compose` (`cap_problems` is
  empty), `test_ingestion_slice_keeps_every_extracted_entry` (`ingestion_slice_problems` is empty), `test_member_docs_reach_the_fixture` (against the
  module dicts `MEMBER_DOC_RATIO_FLOOR[key]` and `PARAM_DOC_FLOOR[key]`, literals YOU measure on the regenerated fixture and print in your report: the
  ratio `members_with_doc / members` rounded DOWN to two decimals and the integer `params_with_doc`; they are ratchets - a later extraction may raise
  them, never lower them), `test_no_description_is_cut_at_an_abbreviation` (`abbreviation_cut_docs` is empty), `test_readme_recall_has_a_floor`
  (against `RECALL_FLOOR[key]`: 0.90 for every pilot whose measured recall reaches it; a pilot that measures below 0.90 gets a floor equal to its
  measured recall rounded DOWN to two decimals AND a non-empty string in `RECALL_EXCEPTION_REASON[key]` that names the identifiers still unresolved
  and why none of them is an API symbol of the library (a build tool such as FetchContent, a file extension) or why the upstream cannot be parsed; if
  any remaining unresolved identifier looks like an API symbol, do not use an exception: report the pilot, its recall and the identifiers, and stop as
  FAILED_INTERNAL), and `test_recall_exceptions_are_real` (a pilot in RECALL_EXCEPTION_REASON really measures below 0.90, so an exception cannot
  outlive its cause).
- >-
  DOTNET-SPECIFIC TESTS of tests/extraction/test_reextracted_dotnet.py (same file): `test_pdf_net_is_the_complete_surface` (type_count 901,
  reduced_type_count 901, len(types) 901, truncated false), `test_words_net_is_the_complete_surface` (618 in the same four places),
  `test_pdf_net_indexes_the_types_the_readme_names` (the fixture's `fqns` contain Aspose.Pdf.Facades.PdfFileEditor, Aspose.Pdf.Devices.PngDevice,
  Aspose.Pdf.Text.TextBuilder, Aspose.Pdf.Facades.PdfFileSignature, Aspose.Pdf.PageCollection, Aspose.Pdf.Text.TableAbsorber,
  Aspose.Pdf.Document.MergeOptions), `test_words_net_indexes_the_types_the_readme_names` (Aspose.Words.Replacing.FindReplaceOptions,
  Aspose.Words.JoinRunsOptions, Aspose.Words.PaperSize, Aspose.Words.Orientation; if one of these is absent from the regenerated fixture, check the
  upstream clone at the pin before you drop it and say so), `test_pdf_net_and_words_net_readme_recall_is_at_least_90_percent` (readme_recall >= 0.90
  for exactly these two pilots, no exception allowed), `test_static_methods_are_marked_in_pdf_net` (at least one method has `static` in its
  `modifiers`), `test_cells_net_worksheet_methods_carry_return_docs` (the `Worksheet` entry has at least one method with a non-empty `return_doc`; the
  XML `<returns>` element must exist upstream for it - read Worksheet.cs in a temporary clone at the pin if the first candidate has none),
  `test_dotnet_parameter_text_comes_from_param_elements` (params_with_doc > 0 for cells_net, pdf_net and words_net),
  `test_imaging_net_keeps_its_three_types` (type_count 3, symbol_counts.types 3), `test_no_dotnet_fixture_is_truncated_except_by_design` (truncated is
  false for all eight). HELPER TESTS (synthetic, same file, at least 8): `test_member_doc_stats_counts_documented_members_and_params`,
  `test_member_doc_stats_counts_return_and_throws_docs`, `test_abbreviation_cut_docs_flags_eg_and_ie`,
  `test_abbreviation_cut_docs_ignores_a_complete_sentence`, `test_type_names_uses_the_last_segment_of_class_import`,
  `test_cap_problems_flags_a_chart_compose_mismatch` (monkeypatch the two readers),
  `test_cap_problems_flags_a_truncated_flag_that_disagrees_with_the_counts`, `test_readme_recall_is_one_when_nothing_is_unresolved` (monkeypatch
  docs_identifiers and unresolved). The generic tests give 9 x 8 = 72 cases, the rest at least 20: the file has at least 90 tests.
- >-
  FLEET CONSISTENCY TRANSITION (tests/deploy/test_fleet_consistency.py, owned by TC-513). The baked generations in infra/demo-manifests are produced
  by the supervisor's re-ingest AFTER the last re-extraction card, so between this card and TC-536 a re-extracted fixture and its old baked generation
  disagree on the API-Coverage line (the fixture's `type_count` and `truncated` change: pdf_net becomes 901 of 901 and not truncated while its baked
  chunks still say `300 of 901 types`), and `test_api_coverage_lines_are_present_and_honest` would fail for a reason that is not a defect. YOU CREATE
  THE MECHANISM. Add a module table `STALE_BAKED_PILOTS: dict[str, str] = {}` (pilot key -> reason; a comment states: fixture re-extracted by a TC-53x
  card, the baked generation still reflects the previous fixture until the supervisor's re-ingest and snapshot, TC-536 deletes this table) and list in
  it EXACTLY the pilots of this card for which `coverage_problems(load_fixture(key), symbols)` is non-empty after your regeneration (run the test
  first; never list a pilot that is still consistent). Behaviour: (1) in `test_api_coverage_lines_are_present_and_honest` a pilot in the table is
  checked against its OWN baked lines instead of the fixture: build a view dict `{'type_count': <the M every baked line states>, 'truncated': <N <
  M>}` from the baked chunks and require `coverage_problems(view, symbols) == []` (every symbol chunk has exactly one API-Coverage line, N equals the
  number of symbol chunks, all lines agree), so the baked data stays honest about itself; (2) new test `test_every_stale_baked_pilot_still_applies`, a
  loop like the other table tests: for each listed pilot `coverage_problems(load_fixture(key), symbols)` is non-empty, failing with the text `the
  baked generation matches the fixture again; delete the pilot from STALE_BAKED_PILOTS`; (3) new test
  `test_stale_baked_pilots_are_disjoint_from_the_coverage_exceptions` (a pilot is in at most one of STALE_BAKED_PILOTS and COVERAGE_EXCEPTIONS); (4)
  new synthetic test `test_baked_self_view_flags_an_inconsistent_generation` proving the self-check can fail (lines that disagree on M, and an N that
  is not the symbol-chunk count). The commit test, the sidecar test, the composition floor and the other tables are not relaxed for any pilot.
  UNRESOLVED table: after regenerating, for every pilot of this card that is listed in `UNRESOLVED_EXCEPTIONS` set the listed maximum to the new count
