id: TC-733
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), first real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - confirmed by
  direct investigation that this mechanism needs ZERO code change: `infra/build_chunks.py`'s
  `_load_authored_candidates` already auto-loads `tests/fixtures/furnished/<pilot>/
  authored_examples.yaml`, merges it with README-derived candidates, and runs every entry through
  the exact same `verify_python_example` pipeline that already verifies every other example,
  publishing only the ones that pass. Three pilots (`cells/cpp`, `cells/rust`, `imaging/net`)
  already use this mechanism today - `tests/fixtures/furnished/cells_rust/authored_examples.yaml`
  is your exact template, read it in full first.

  `cells/python` currently serves only 6 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/cells__python__self_extracted` generation: "Quick Start (2)",
  "Additional Examples", "Export to CSV", "Password-Protect a Workbook", "Quick Start", one more) -
  the furthest below its own Appendix-C floor (30) of any pilot with real upstream samples to draw
  from. `cells/python`'s real pinned repository (`config/products/cells/python.yaml`'s own
  `repository`/pinned commit - re-confirm directly, do not trust this card's own citation blindly)
  has a real `examples/` directory with 31 real files at the pinned commit
  (`4f6768a7b349a1309644f456eb43bc35f70c16d7` - re-verify this is still the real pin) - CONFIRMED
  by direct investigation that these are `unittest.TestCase`-based test SUITES, not standalone
  scripts (e.g. `test_csv_import_export.py` is a 20-feature test class with `setUp`) - none are
  drop-in; each real example you author must extract ONE genuinely meaningful test method's real
  logic, strip the `unittest`/`sys.path` scaffolding, and wrap it as a standalone `if __name__ ==
  "__main__":` script with real, visible assertions - reusing the REAL logic and REAL assertions
  the test already makes, never inventing new behavior.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `cells/python` from 6 to AT MOST 11 served examples (6 + up to 5
  newly-authored), not to its full 30-example floor; closing that floor fully needs the P4
  program's own later, larger per-language-sample-adapter work (XA11+), explicitly out of this
  card's scope. This card's job is the real, bounded, immediately shippable slice: exactly 5 new,
  real, individually-verified authored examples, each drawn from real upstream test logic, each
  passing the real ingestion verifier before being trusted to publish.

  PICK 5 real upstream test methods covering genuinely DIFFERENT, valuable functionality (not 5
  variations on the same feature) - your own judgment, informed by actually reading the real 31
  files, not guessed from their names alone. For each: write real, working, idiomatic standalone
  Python that performs the SAME real operation the original test method does, with real assertions
  proving it worked (mirroring `authored_examples.yaml`'s own existing convention across every
  pilot that has one - a short header comment, real API calls, a `print`, real `assert` statements)
  - and then ACTUALLY VERIFY each one yourself (install the real pinned package from the real
  commit, run the code for real) BEFORE trusting it will pass the ingestion pipeline's own
  verifier; do not write a plausible-looking example and hope.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/cells_python/authored_examples.yaml
  - tests/indexing/test_authored_examples_cells_python.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_rust/authored_examples.yaml` in full (your exact
    schema/style template) AND `tests/indexing/test_authored_examples_cells_rust.py` in full (your
    exact template for the new, per-pilot OFFLINE test file this card also requires - note its own
    docstring: these tests are pure offline well-formedness/symbol-resolution/pinned-commit checks,
    NEVER importing, compiling or running the example code themselves - that is the real ingestion
    verifier's job, which you still must run by hand per the input below before trusting any
    example will actually publish). Also read `src/foss_mcp/indexing/authored_examples.py` in full
    (every structural rule it enforces - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`,
    `FORBIDDEN_CODE_PATTERNS`, the `code_sha256` must equal `normalised_code_sha256(code)` from
    `example_candidates.py`, `symbols` must be real FQNs the real indexed fixture actually carries,
    `library_commit` must be the real 40-hex pinned commit), and `infra/build_chunks.py`'s
    `_load_authored_candidates` to confirm exactly how this sidecar gets picked up and verified.
  - >-
    REPRODUCE FIRST: confirm `cells/python`'s real current served example count (6) and real
    pinned repository/commit yourself, do not trust this card's own citation. Fetch the real 31
    upstream `examples/*.py` files at that exact commit (via `gh api`) and read enough of them to
    pick 5 real, genuinely distinct, valuable operations to adapt.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: install the real pinned `aspose-cells-foss`
    package (or whatever its real package name is - confirm from the real repo) at the real pinned
    commit, actually run each of your 5 adapted scripts, confirm each one's real assertions pass
    against real output. Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your 5 examples trips any of these patterns
    before committing (check directly against the real regex list in `authored_examples.py`, don't
    guess).
  - >-
    This card does NOT claim `cells/python`'s example-corpus work is complete - 11 served examples
    is real, bounded progress toward its real 30-example floor, not the floor itself. Scope your
    closeout accordingly; do not claim P4 or this pilot's XA18 floor is met.
actions:
  - >-
    Author exactly 5 new, real, individually-verified examples for cells/python via the existing
    authored_examples.yaml mechanism, raising its served example count from 6 toward 11.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_cells_python.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/cells_python/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file
    (a mismatched hash is exactly the tamper-detection this field exists to catch) - a pure data
    mutation, immune to the lockstep-rename vacuousness class this session's earlier reviews
    found, and it never touches any code path. Confirm by hand that the check files you named
    actually exercise this validation path (run the mutate against your real committed file and
    confirm a real test fails) before trusting it.
evidence:
  - evidence/build/G3/TC-733/receipt.json
closeout:
  - >-
    cells/python gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 6 toward 11 - real, bounded progress toward its full 30-example floor, which remains
    separately open pending the P4 program's own later per-language sample-adapter work.
recovery: Re-run from a clean tree.
