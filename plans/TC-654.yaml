inputs:
  - >-
    READ FIRST, in full: `search_symbols.py`'s module docstring (every TC-### entry describing the
    tier ladder - this is dense, load-bearing prose, not filler), `_match_tier`'s full docstring
    and body, `search_symbols()`'s full body (the admission loop, the tier-combination logic at
    the `class_tier`/`member_declaration`/`tier` block, the sort key, `qualities` dict). Then
    `tests/mcp/test_search_symbols_honest_miss.py` in full - find every pinned "a partial word is
    a miss" assertion yourself, do not trust this card's own list as exhaustive. Then at least 5
    of the 10 real issue ids named above in `docs/round2/issues.json`.
  - >-
    Write at least 12 tests in `tests/mcp/tools/test_search_symbols_prefix_tier.py`: a real
    >=3-char prefix of a real type name is now found, `match_quality == MATCH_PARTIAL`; the exact
    same query as a WHOLE word (not a prefix) still gets `MATCH_EXACT` (tier 4 never shadows a
    stronger tier); a <3-char query gets the new explicit length-floor Miss reason; a query
    sharing no prefix with any real word stays Miss with its existing reason, unchanged; a
    multi-word query where ONE word is a real whole-word match and another is only a valid prefix
    is admitted (mixed whole-word+prefix); a multi-word query where one word matches NEITHER
    whole nor prefix is NOT admitted at tier 4 (every word must be explained, same discipline as
    tier 2); a tier-4 hit never outranks a tier-0/1/2/3 hit for the same query when both exist;
    BM25 still breaks ties within tier 4; the real measurement test(s) against your >=3-pilot
    sample, reporting the real hit-rate (this is the test the card's own negative control and your
    own closing report both reference).
  - >-
    REWORK (attempt 2): attempt 1's real implementation (the new tier, the length-floor Miss
    reason, MATCH_PARTIAL labelling, the full-corpus BM25 scan pass for a fragment sharing no
    token with its real word, and all 4 updates in `tests/mcp/test_search_symbols_honest_miss.py`)
    is correct and is preserved - do not redo it. The only gap: this card's own write_paths did
    not originally include every file this real, deliberate behavior change touches. You already
    found and correctly reported 3 more test files with pinned "this prefix stays a Miss"
    assertions that are now structurally false by this card's own design, not by a defect:
    `tests/mcp/tools/test_search_symbols_forgiveness.py::test_partial_words_stay_misses` (the
    `"Watermar"`/`"AFRelation"` single-word cases must become hits exactly as you already did in
    the honest-miss file; check whether the two-word cases `"Watermar annotation"`/`"AFRelation
    type"` also flip - read what `_search` does with an added unrelated word and decide from the
    real behavior, not from assumption), `tests/mcp/tools/test_round3_retrieval.py::test_dotted_and_partial_names_stay_honest_misses`
    (`"Workboo"` is a real >=3-char prefix of `Workbook` and must become a hit; check
    `"Cells::Merg"` the same way - it may or may not flip depending on whether a real `Merge*`
    member/type exists in that pilot's real fixture, verify directly rather than guessing), and
    `tests/mcp/tools/test_retrieval_tools.py` (the `"Annotatio"` dropped-trailing-character probe
    around line 289-317 is the exact same "did-you-mean demo relies on zero token overlap" issue
    you already fixed once in your own new test file - apply the SAME fix here: change the probe
    to a same-length, different-last-character variant that is never a valid prefix, preserving
    the test's real intent). Do NOT touch `tests/conformance/test_symbol_self_retrieval.py` or
    `tests/fixtures/conformance/baseline_symbol_self_retrieval.json` - confirmed from
    `tests/conformance/baseline.py`'s own docstring that a baseline entry which no longer
    reproduces is tolerated, not a failure, until a program's own closure card flips `"strict":
    true` (not this card's job); leave that file exactly as it is.
actions:
  - >-
    Add the plan's own missing prefix tier to search_symbols (weakest evidence, explicit length
    floor, never exact), closing 10 real round-2 audit issues that all share this one root cause.
