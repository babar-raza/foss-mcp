  - command: '{python} -m pytest tests/mcp/tools/test_search_symbols_prefix_tier.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-011
  - command: '{python} -m pytest tests/mcp/test_search_symbols_honest_miss.py tests/mcp/tools/test_search_symbols_forgiveness.py tests/mcp/tools/test_search_symbols_digit_words.py tests/mcp/tools/test_search_symbols_memberless_last.py tests/mcp/tools/test_search_symbols_query_normalization.py tests/mcp/tools/test_known_defects_in_search_symbols.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 12
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/search_symbols.py'); s = p.read_text(encoding='utf-8'); marker = '_PREFIX_MIN_LENGTH = '; idx = s.find(marker); assert idx != -1, 'the literal _PREFIX_MIN_LENGTH = <int> assignment was not found - if you named or wrote your own length-floor constant differently, anchor your own mutate on your own real assignment line instead and note the substitution in your closeout'; start = idx + len(marker); end = next((i for i in range(start, len(s)) if not s[i].isdigit()), len(s)); old_number = s[start:end]; assert old_number, 'no integer literal immediately follows _PREFIX_MIN_LENGTH = as expected'; s2 = s[:start] + '999' + s[end:]; assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Raises the prefix-tier's own length floor to 999 characters, a genuine runtime behavior
    change (not merely a rename every usage shares, which an attempt-1 draft of this mutate
    found would leave the mechanism itself working - only an import in a new test file would
    break): no real symbol word is ever 999 characters long, so the floor check now rejects
    every real query at this tier and the prefix tier is functionally disabled for every caller,
    not only one test file's own import statement. Every test proving a real prefix query now
    finds its symbol must fail under this mutation; tests of the pre-existing tiers 0-3
    (unaffected by this card) and of genuinely unrelated names stay green.
evidence:
  - evidence/build/G3/TC-654/receipt.json
closeout:
  - >-
    search_symbols now has the plan's own prefix tier - the weakest, most honestly-labelled
    evidence, with an explicit length floor - closing 10 real round-2 findability issues. State
    the real measured hit-rate against your real multi-pilot sample.
recovery: Re-run from a clean tree.
