source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-10-30 — Round-2 portfolio audit remediation adopted: unified plan, governance decisions A-K
      recorded (supervisor)
    sha256: 62cf1403a592118e3fb6bd14c5336f8a997cc3181d44a585323ec9f1d385a931
inputs:
  - >-
    READ FIRST, in full: `search_symbols.py`'s module docstring (every TC-### entry describing the
    tier ladder - this is dense, load-bearing prose, not filler), `_match_tier`'s full docstring
    and body, `search_symbols()`'s full body (the admission loop, the tier-combination logic at
    the `class_tier`/`member_declaration`/`tier` block, the sort key, `qualities` dict). Then
    `tests/mcp/test_search_symbols_honest_miss.py` in full - find every pinned "a partial word is
    a miss" assertion yourself, do not trust this card's own list as exhaustive. Then at least 5
    of the 10 real issue ids named above in `docs/round2/issues.json`.
  - >-
    Write at least 12 tests in `tests/mcp/tools/test_search_symbols_prefix_tier.py`: a real
    >=3-char prefix of a real type name is now found, `match_quality == MATCH_PARTIAL`; the exact
    same query as a WHOLE word (not a prefix) still gets `MATCH_EXACT` (tier 4 never shadows a
    stronger tier); a <3-char query gets the new explicit length-floor Miss reason; a query
    sharing no prefix with any real word stays Miss with its existing reason, unchanged; a
    multi-word query where ONE word is a real whole-word match and another is only a valid prefix
    is admitted (mixed whole-word+prefix); a multi-word query where one word matches NEITHER
    whole nor prefix is NOT admitted at tier 4 (every word must be explained, same discipline as
    tier 2); a tier-4 hit never outranks a tier-0/1/2/3 hit for the same query when both exist;
    BM25 still breaks ties within tier 4; the real measurement test(s) against your >=3-pilot
    sample, reporting the real hit-rate (this is the test the card's own negative control and your
    own closing report both reference).
actions:
  - >-
    Add the plan's own missing prefix tier to search_symbols (weakest evidence, explicit length
    floor, never exact), closing 10 real round-2 audit issues that all share this one root cause.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_search_symbols_prefix_tier.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-011
  - command: '{python} -m pytest tests/mcp/test_search_symbols_honest_miss.py tests/mcp/tools/test_search_symbols_forgiveness.py tests/mcp/tools/test_search_symbols_digit_words.py tests/mcp/tools/test_search_symbols_memberless_last.py tests/mcp/tools/test_search_symbols_query_normalization.py tests/mcp/tools/test_known_defects_in_search_symbols.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-011
min_tests: 12
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/search_symbols.py'); s = p.read_text(encoding='utf-8'); marker = 'def _match_tier'; idx = s.find(marker); assert idx != -1, '_match_tier not found as expected - if your real function differs, anchor your own mutate on your own real name instead and note the substitution in your closeout'; needle = '_PREFIX_MIN_LENGTH'; assert needle in s, 'your fix does not reference _PREFIX_MIN_LENGTH as expected - if you named your own constant differently, anchor your own mutate on your own real name instead and note the substitution in your closeout'; s2 = s.replace(needle, '_DISABLED_' + needle); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Breaks every reference to the prefix-tier length floor constant by renaming it to an
    undefined symbol, so the prefix tier can never run (a NameError at the first real prefix
    query). Every test proving a real prefix query now finds its symbol must fail under this
    mutation; tests of the pre-existing tiers 0-3 (unaffected by this card) and of genuinely
    unrelated names stay green.
evidence:
  - evidence/build/G3/TC-654/receipt.json
closeout:
  - >-
    search_symbols now has the plan's own prefix tier - the weakest, most honestly-labelled
    evidence, with an explicit length floor - closing 10 real round-2 findability issues. State
    the real measured hit-rate against your real multi-pilot sample.
recovery: Re-run from a clean tree.
