id: TC-654
gate: G3
lane: storage-retrieval
purpose: >-
  Q12 (findability, workstream B, REQ-G3-011) - the plan's own frozen acceptance for this stage
  (section 2.2): "prefix tier (>= 3 chars)" admitted as the weakest evidence, "an explicit Miss
  reason below" that floor, target "prefix >= 3 finds the type in top 10 for >= 95%". Q11
  (digit/acronym-aware symbol words, TC-637) is already done; this is the next, independent
  mechanism - a genuinely MISSING tier, not a bug in an existing one. Confirmed directly:
  `search_symbols.py`'s own module docstring states "There is no prefix tier:
  `tests/mcp/test_search_symbols_honest_miss.py` pins those partial words as misses" (search for
  this exact sentence before starting). Closes 10 real round-2 audit issues sharing this one root
  cause (read each yourself in `docs/round2/issues.json`, do not take this card's summary alone):
  `3D-JAVA-008`, `3D-TYPESCRIPT-002`, `BARCODE-PY-003`, `CELLS-TYPESCRIPT-010`, `EMAIL-CPP-008`,
  `EML-NET-001`, `NOTE-PY-004`, `PDF-TS-001`, `SLIDES-JAVA-005`, `SLIDES-NET-003`. Two of these
  (`EMAIL-CPP-008`, `NOTE-PY-004`) specifically complain about 1-2 CHARACTER queries - these must
  stay honest misses (the floor is >= 3, never lowered), but with a reason that actually says so,
  not a generic "no symbol matches" message that gives no hint why.

  `_match_tier`'s existing tier 2 (bag-of-words) already requires every query word to be a WHOLE
  word of the FQN (`_symbol_words`); a query word that is only a case-insensitive PREFIX (never a
  whole-word match) of exactly one or more of the FQN's own words is currently rejected entirely
  (`Watermar` against `PdfDocument.AddWatermarkAnnotation`'s word `Watermark`). Add a new,
  STRICTLY WEAKER tier below the existing tier 3 (bag-of-words, inside `search_symbols`'s own
  combined numbering - read the function's full docstring and body first, you will renumber
  nothing that exists, only add tier 4 beneath it): every word of the query (after the existing
  fold/normalize steps) that is NOT a whole-word match must be at least `_PREFIX_MIN_LENGTH`
  (your own constant, 3) characters AND a genuine case-insensitive prefix of at least one of the
  FQN's own words (reuse `_symbol_words`, never reimplement word-splitting), for ALL of the
  query's words combined (same "every query word must be explained" discipline tier 2 already
  has - a query is not admitted at this tier if even one of its words matches nothing, whole or
  prefix). A query shorter than 3 characters (after fold/strip) must short-circuit to an explicit
  Miss reason naming the floor (e.g. "query must be at least 3 characters to match a name
  fragment") BEFORE any tier is attempted for it - this is a real, visible change for
  `EMAIL-CPP-008`/`NOTE-PY-004`'s own single-letter probes, which must stay misses but with this
  new, honest reason instead of whatever generic one they get today (check what they get today
  first, do not assume).

  A tier-4 (prefix) hit's `match_quality` must be `MATCH_PARTIAL`, never `MATCH_EXACT` - the
  weakest tier gets the most honest label, exactly the spirit of this plan's own "namespace words
  never exact" rule for a different tier. Tier-4 hits still compete on BM25 within their own tier,
  same as every other tier (`candidate[3]` in the existing sort key) - do not special-case this.

  You must UPDATE (never delete or weaken the intent of) every pinned test in
  `tests/mcp/test_search_symbols_honest_miss.py` that currently asserts a genuine >=3-char prefix
  of a real word is a Miss - this card's own investigation found at least THREE such assertions
  (`test_a_partial_name_is_not_a_match`'s `"Watermar"`/`"Annotat"`, `test_a_cpp_partial_word_is_not_a_hit`'s
  `"AFRelation"`, `test_a_dotted_fqn_still_matches_whole_words_only`'s `"Watermar"`) - search the
  WHOLE file yourself for every such case, there may be more. Each must become a positive
  assertion that the real symbol is now found (tier-4, `match_quality == MATCH_PARTIAL`), with a
  clear docstring/comment explaining this is Q12's deliberate, reviewed overturning of the
  previous "no prefix tier" design (a RAISED floor - recall went up, nothing that worked before
  stopped working - never a silently weakened check). A query that shares NO prefix relationship
  with any real word (the file's genuine not-a-real-name cases, e.g.
  `"Tc197AbsentSymbolProbe"`/`"Aspose::Pdf::Nonexistent"`) must stay exactly as pinned today -
  untouched.

  Measure for real against the existing corpus before claiming this closes the plan's own
  acceptance number: pick at least 3 real pilots already used elsewhere in this module's own
  measurement protocol (pdf/net, cells/cpp, slides/python - same 3 this module's own docstring
  already cites for TC-278's measurement) and, for a sample of real >=3-char prefixes of real
  type names in each (your own sample, at least 10 per pilot, seeded/reproducible), report the
  real hit-rate in your closing report. State the real number; if it falls short of 95%, say so
  honestly rather than rounding up - this is Decision F's own rule (a measurement-gated stage
  reports its real number, it does not get silently waved through).
