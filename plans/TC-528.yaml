  for every method, constructor, free function and property that `_extract_cpp_members` / `_extract_cpp_free_functions` build). lang/typescript.py: `parse_doc` returns
  `"throws": [{"type": T, "doc": text}]` for `@throws {T} text` and `@throws T text` (key present only when the tag is), `_first_sentence` delegates to `member_docs.first_sentence`; the other
  keys and the summary-only round trip are unchanged. python_surface.py: add the field `doc_full: str | None = None` to `PublicSymbol` (the cleaned full docstring, at most 2,000
  characters, from a new `_full_docstring(node)` next to `_first_docstring_line`) and fill it wherever `docstring=` is filled from a node (module, class, function, method and the
  re-export copy); `docstring` (the first line) keeps its exact meaning, so every existing python_surface test is untouched. run_extraction.py `_python_types_from_surface`: when a symbol
  has `doc_full`, call `parse_python_docstring` and `apply_member_doc` on the class, function, method and property dicts (parameter docs are matched by name after removing a leading `*`
  or `**`); symbols without it keep today's `doc`.
