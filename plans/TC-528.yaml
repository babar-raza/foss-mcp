  python/pyproject.toml:
  [project]
  name = "pdfsample"
  version = "0.1.0"

  python/pdfsample/__init__.py:
  """Sample package."""

  from .document import Document

  __all__ = ["Document"]

  python/pdfsample/document.py:
  class Document:
      """A PDF document."""

      def save(self, destination, overwrite=False):
          """Save the document, e.g. to a file.

          Args:
              destination (str): Target path of the output file.
              overwrite (bool): Replace an existing file when True.

          Returns:
              bool: True when a file was written.

          Raises:
              FileExistsError: If the target exists and overwrite is False.
          """

      def merge(self, other, *, keep_bookmarks=True):
          """Merge another document into this one.

          Parameters
          ----------
          other : Document
              The document to append.
          keep_bookmarks : bool
              Whether bookmarks are kept.

          Returns
          -------
          Document
              This document.

          Raises
          ------
          ValueError
              If other is the same object.
          """

      def split(self, pages):
          """Split the document.

          :param pages: Page numbers, 1-based.
          :type pages: list
          :returns: The new documents.
          :raises ValueError: If pages is empty.
          """

      def long_summary(self):
          """Compute a value that needs a long
          description spread over two lines. More text.
          """

      def plain(self):
          """Plain."""

      def undocumented(self):
          pass

