id: TC-528
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, findings AGT-05 and RST-13, part 2 of 2; TC-527 built the core). MEMBER-LEVEL DOCUMENTATION for
  Python, TypeScript/JavaScript, Go, Rust and C++. TC-527 added the renderer, the caps, the abbreviation-aware first sentence and the Javadoc and C#
  XML-doc parsers, and wired Java and C#. The reviewer's evidence for the other languages: pdf_python has docstrings with Args/Returns/Raises sections
  that never reach the index (the second `Document.save` raised FileExistsError because `overwrite` defaults to False, stated in the docstring);
  the pure-`ast` Python reader keeps only the first LINE of a docstring (`python_surface._first_docstring_line`, python_surface.py L61), so a summary
  wrapped over two lines is served cut mid-sentence (`Compute a value that needs a long`); TypeScript's TSDoc enrichment (`_apply_ts_tsdoc_enrichment`,
  api_surface.py L948) already keeps `@param` and `@returns` text but `lang/typescript.parse_doc` deliberately ignores `@throws`, and the member `doc`
  of a comment that starts with a tag is the tag text; Rust's `///` reader keeps only the first sentence of the first paragraph and nothing of the
  `# Arguments`, `# Returns`, `# Errors` sections; the Go godoc reader cuts at `e.g.` (cells/go `Cells ... (e.g.`; fixed centrally by TC-527's
  `first_sentence`, pinned here for Go); and the C++ reader accepts neither `///` (TC-524 adds that) nor Doxygen or XML tags. This card adds, in the
  shared extraction helper module, `parse_python_docstring` (Google, NumPy and Sphinx styles, simple and regex based), `parse_rustdoc` and
  `parse_doxygen` (also accepting the XML elements that cells/cpp uses); wires each language into the additive keys TC-527 defined (`doc`,
  `params[i].doc`, `return_doc`, `throws_doc`); makes the Python reader keep the full docstring; makes `parse_doc` for TypeScript return `@throws`; and lets the
  renderer print a typeless thrown error (Rust `# Errors`) as `Throws: <text>`. No new size cap: the caps of TC-527 (300 per member, 4,000 per type, 48,000 per
  pilot) bound everything this card adds, so the budget decision of TC-527 stands (re-pin the demo-manifests tree budgets in the re-ingest data card). It does
  NOT change the committed fixtures, the selection of types, the Python fidelity work owned by other cards (defaults, keyword-only markers, facade members),
  or any tool contract.
