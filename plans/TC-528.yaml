- >-
  EXPECTED RESULT (the worker pins these exact rendered descriptions, produced by `member_doc_text` from the extracted member dicts). Python `Document.save`:
  `Save the document, e.g. to a file. Params: destination: Target path of the output file; overwrite: Replace an existing file when True. Returns: True when a file
  was written. Throws: FileExistsError: If the target exists and overwrite is False.` (a Google `Returns:` line `bool: text` loses the `bool:` type prefix); `merge`
  (NumPy): `Merge another document into this one. Params: other: The document to append; keep_bookmarks: Whether bookmarks are kept. Returns: This document. Throws:
  ValueError: If other is the same object.`; `split` (Sphinx): `Split the document. Params: pages: Page numbers, 1-based. Returns: The new documents. Throws:
  ValueError: If pages is empty.`; `long_summary`: `Compute a value that needs a long description spread over two lines.` (the whole first sentence, not the first line); `plain`:
  `Plain.`; `undocumented`: nothing. The class `Document` doc stays `A PDF document.`. TypeScript `Sheet.freezePanes`: `Freezes panes at the cell, e.g. before scrolling. Params:
  row: zero-based row index; column: zero-based column index. Returns: true when the panes were frozen. Throws: RangeError: if the index is negative.`; `getName`:
  `Gets the name.`; `undocumented`: nothing. Go `Doc.Save`: `Save writes the document to w, e.g. a file or a buffer.` (not cut at `e.g.`), `Open`: `Open opens the
  file at path.`, `Undocumented`: nothing. Rust `Client.open`: `Opens a session, e.g. over HTTP. Params: url: the server URL; timeout: the timeout in seconds. Returns: The
  session handle. Throws: Returns an error if the server is unreachable.` (the `# Errors` text is a thrown entry with an empty type, rendered without a type), `close`:
  `Closes the session.`, `undocumented`: nothing. C++ `Sheet.FreezePanes` (XML elements): `Freezes panes at the cell, e.g. before scrolling. Params: row: Zero-based row index;
  column: Zero-based column index. Returns: True when the panes were frozen.`, `SetWidth` (Doxygen `@param` in a block comment): `Sets the width. Params: column: the column index;
  width: the width in characters.`, `GetName` (plain `///`): `Gets the name.`, `Undocumented`: nothing. (The Python sample's `__init__.py` re-export also yields a second, member-less `Document` shell entry: every Python test selects the `Document` entry that has methods.) The members the golden tests list as documented are: Python save,
  merge, split, long_summary, plain (5); TypeScript freezePanes, getName (2); Go Save, Open (2); Rust open, close (2); C++ FreezePanes, SetWidth, GetName (3). Each language must
  render a non-empty description for at least 80 percent of its listed members (it is 100 percent on the samples).
- >-
  PARSERS in member_docs.py (pure, no tree-sitter), all returning the TC-527 shape `{"summary", "params": {name: desc}, "returns", "throws": [{"type", "doc"}]}` with the
  empty keys omitted and all text whitespace-collapsed. (1) `def parse_python_docstring(` (exact name: the negative control renames it) takes the cleaned docstring text. The
  summary is `first_sentence` of the first paragraph (lines up to the first blank line, joined by spaces). The style is detected by markers. SPHINX: lines starting `:param
  name:` or `:param type name:` (the last word before the colon is the name), `:returns:` or `:return:`, `:raises Type:` or `:raise Type:`; continuation lines indented deeper belong to the
  field; `:type` and `:rtype` are ignored. GOOGLE: a header line `Args:`, `Arguments:`, `Parameters:` or `Params:` followed by indented items `name (type): desc` or `name: desc`
  (deeper-indented following lines continue the description); `Returns:` or `Return:` followed by an indented block whose first paragraph is the description, with a leading `type:`
  prefix removed when the text before the first colon is a single type-like token (letters, digits, brackets, commas, dots, `|`, at most 40 characters, no spaces after trimming);
  `Raises:` or `Raise:` followed by items `Type: desc`. NUMPY: a header `Parameters`, `Returns` or `Raises` followed by a line of three or more dashes; under Parameters items `name : type`
  (the name is the text before ` : `, a leading `*` or `**` kept) each followed by indented description lines; under Returns an optional type line followed by indented description lines
  (a block with only one line uses that line as the description); under Raises a type line followed by indented description lines. Text with none of these markers gives the summary
  only. (2) `def parse_rustdoc(` takes the joined `///` text (prefix stripped, blank `///` lines kept as blank lines): summary as above from the first paragraph; the `# Arguments`
  (also `# Parameters`) section's bullets `* \`name\` - desc` or `- name: desc` give params; `# Returns` gives returns; `# Errors` gives ONE throws entry with an empty type and the
  section text as doc; `# Panics` and every other section are ignored. (3) `def parse_doxygen(` takes either a joined `///` run or a `/** */` block: when it contains
  `<summary>` or `<param` it delegates to `parse_xml_doc`, otherwise it reads the tags `@param name text`, `@return` or `@returns`, and `@throws` or `@exception Type text` (the
  backslash spelling of the same tags is also accepted), exactly as `parse_javadoc` does (a `/** */` block may simply
  call it). The renderer change: in member_doc_text.py a `throws_doc` item whose `type` is empty renders as just its `doc` (`Throws: <doc>.`) instead of `: <doc>`.
- >-
  WIRING. api_surface.py: extend `_raw_doc_block(node, language)` and the `_apply_member_doc` dispatcher (Python does not use it: it goes through python_surface, below) for
  `typescript`/`javascript` (keep `_apply_ts_tsdoc_enrichment`: make it also set `entry["doc"]` to the parsed summary (the first sentence of the text BEFORE the first tag, so a
