id: TC-786
gate: G3
lane: transport-deployment
purpose: >-
  Completes the write-side half of the dead known-defects merge fix `TC-783` (KD4/REQ-G3-015)
  landed on the READ side, 2026-11-13: `load_manifest_sidecar` now correctly reads back a
  sidecar's `family` field, but all 32 real, already-committed
  `infra/demo-manifests/product_reference_<family>_<platform>.json` sidecars currently have ZERO
  `"family"` key at all (confirmed, not guessed - `TC-783` itself verified this directly before
  fixing the read side). Until these 32 real files are regenerated, `get_product_reference`'s
  `family is None` guard still silently short-circuits the known_defects merge for every real
  pilot in production, exactly as before `TC-783` - the read-side fix is correct but inert
  against today's real data, the same "fix is correct, data hasn't caught up" shape this session
  saw repeatedly (`TC-785`).

  This card re-fetches all 32 sidecars via the already-correct, already-tested
  `infra/fetch_product_reference.py` CLI, at EACH PILOT'S OWN ALREADY-INDEXED COMMIT (the real
  `source_ref` value already recorded in that pilot's own current sidecar - never a newer
  commit), so the fetch is a true no-content-change refresh: the only field that should change is
  the newly-added `family` (plus the `fetched_at` timestamp and possibly `drift`, which the CLI's
  own `_existing_drift_for` already preserves/recomputes safely, exactly as `TC-715`/`TC-785`
  already proved for the sibling `fetch_recent_releases.py` tool). This is DATA regeneration, not
  a code or test change - `fetch_product_reference.py`'s own mechanism needs no change.

  KNOWN HAZARD, stated explicitly because it bit this exact family of card twice already this
  session (`TC-659`'s CELLS-CPP-010 finding; `TC-785`'s real-new-release finding): re-fetching
  LIVE data can legitimately surface MORE than just the `family` field changing, if anything
  about the pinned commit's own content was previously fetched with a wrong path, or if a
  dependent field (like `fetch_recent_releases.py`'s drift) has independently moved since the
  last fetch. This card's own verification gate (see `inputs`) requires a per-pilot diff check
  BEFORE committing anything, and treats any unexpected diff as a reason to skip that one pilot
  and report it - never to force, guess, or silently accept a wider change than intended.
depends_on:
