id: TC-527
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 (independent pre-production review, findings AGT-05 and RST-13; the reviewer's highest-yield item, part 1 of 2 - TC-528 does the other
  languages). MEMBER-LEVEL DOCUMENTATION. The agentic reviewer ran 65 blind coding tasks on 13 pilots; the MCP gave a wrong signature 0 times in 1,037
  calls, but 8 of 13 option, error and format tasks (T4) forced a guess because no member-level documentation is served: what a parameter means,
  whether an index is 0 or 1 based, the unit of a column width, whether a formula needs a leading `=`, which exception is thrown, that a second
  `save` raises FileExistsError because overwrite defaults to False. 0 of 13 T4 tasks were fully sufficient. The documentation exists upstream
  (cells_java `Worksheet.freezePanes` Javadoc, cells_net `Worksheet.cs` XML doc, pdf_python docstrings) and the extractor already reads the FIRST
  sentence of every member's comment into the fixture's `doc` field (measured on the committed fixtures: members with a non-empty `doc` in the first 300
  types: pdf_net 3,887 of 4,887, cells_java 2,199 of 2,677, cells_net 574 of 603, words_net 3,363 of 3,506, cells_rust 1,414 of 1,912, pdf_python 783 of 1,537, cells_cpp 0 of 1,853), but
  `chunk_builder.py` never renders it: a symbol chunk lists `  - freezePanes(row: int, column: int, ...) -> void` and nothing else. Beyond that,
  the Javadoc `@param`/`@return`/`@throws` blocks and the C# `<param>`/`<returns>`/`<exception>` elements are dropped by `_extract_doc_comment`
  (api_surface.py L759), and `_first_sentence` (L681) cuts at the first period-space, so a description such as `Freezes panes at the cell, e.g. before
  scrolling.` stops at `e.g.` (reviewer RST-13: cells/go `Cells ... (e.g.`). This card builds the core: (1) a new extraction helper module
  with an abbreviation-aware `first_sentence` and Javadoc and C# XML-doc parsers that return the summary, per-parameter descriptions, the return
  description and the thrown exceptions, wired into the Java and C# method, constructor and property extraction as additive keys (`params[i].doc`,
  `return_doc`, `throws_doc`, the same keys the TypeScript enrichment already uses); (2) a new renderer that writes ONE line under each member in the
  symbol chunk, `    - <description>`, capped at 300 characters per member, never empty, never repeated for identical overloads, never for inherited members;
  (3) three size caps; and (4) the one reader that would break, `get_symbol._extract_block`, which stops at the first line that does not start with
  `  - ` and would therefore truncate a Methods list after the first documented member: it must skip the four-space doc lines. TC-528 adds the
  Python, TypeScript/JavaScript, Go, Rust and C++ sources on top. SIZE BUDGET (the serving image must stay lean): tests/deploy/test_compact_demo_manifests.py
  pins the committed demo-manifests tree at 28,196,887 bytes against TREE_BYTES_BUDGET 29,500,000 (headroom 1.3 MB), the largest generation file at
  2,944,920 against 2,950,000 and the median at 577,817 against 640,000. A generation file holds each chunk's text once and its token list again (measured on
  pdf_go: text 167 KB, tokens 283 KB, doc_freq 38 KB of 707 KB), so added text costs about 2.8 bytes per character. Rendering the first sentences ALREADY in the
  fixtures with only a 300-character member cap would add 3.07 MB of text (about 8.6 MB of tree, html_python alone 1.68 MB); with the caps of this card
  (300 per member, 4,000 per type, 48,000 per pilot) the same fixtures add 795 KB of text (about 2.2 MB of tree, 12 pilots at the pilot cap) and the hard
  upper bound after the richer re-extraction is 40 pilots x 48,000 = 1.92 MB of text (5.4 MB of tree, largest file +134 KB). THE BUDGET DECISION FOR THE
  SUPERVISOR: nothing in this card changes a committed manifest, so the existing budget test stays green here; the data card that re-ingests the pilots
  must re-pin TREE_BYTES_BUDGET to 35,000,000, LARGEST_FILE_BYTES_BUDGET to 3,300,000 and MEDIAN_FILE_BYTES_BUDGET to 760,000 (with the measured numbers in
  the comment, as TC-503 did). It does NOT change the committed fixtures, the Python/TypeScript/Go/Rust/C++ extraction (TC-528), the selection of types, or the
  tool contracts (no new field in a tool result; the doc lines are part of the symbol text that `get_symbol` already returns as `raw_text`).
