      ## 2026-11-02 — Round-3 independent re-audit adopted; a real regression found and given top priority; the "no pilot ever gets worse" rule adopted project-wide (operator, supervisor)
    sha256: b750b8bf0df25b17bf66d014895ecb42952050c7cc63773f56249c4a1c551791
inputs:
  - >-
    READ FIRST: this card's own `purpose` text in full - it already contains the real, verified
    evidence for every change. Then `src/foss_mcp/mcp/tools/search_symbols.py`'s
    `_SYMBOL_DEFECT_SUBJECT_KINDS` and its one call site, and `get_product_reference.py`'s
    `_LIBRARY_DEFECT_SUBJECT_KINDS` (confirm they are genuinely separate constants in separate
    files before changing either). Then each of the 9 `config/known_defects/*.yaml` files named
    above, in full, plus the relevant pilot's real `api_surface.json`, before writing a single
    ref.
  - >-
    Order of work: (1) the `CELLS-GO-001`/`CELLS-GO-011` ref correction (independent of
    everything else, verify against `chunk_builder.py`'s `_entry_fqn` and the real Go fixture);
    (2) the `search_symbols.py` architectural widening; (3) each refs addition, one pilot at a
    time, verifying the exact FQN string live before writing it; (4) update every existing test
    in the 4 named `tests/indexing/test_known_defects_data_*.py` files whose assertions pin the
    OLD single-ref value for any entry you changed.
  - >-
    Write at least 12 tests in `tests/mcp/tools/test_known_defects_refs_population.py`: for each
    `method`/`class`-kind addition (cells/net, cells/java, cells/python, pdf/java, pdf/cpp),
    a real end-to-end `get_symbol`/`search_symbols` call on the NEW ref name surfaces the right
    defect id, called through the real `foss_mcp.mcp.server` wrapper against the real
    `infra/demo-manifests` data (the same pattern `test_known_defects_round3_siblings.py` already
    established) - not a synthetic in-memory `KnownDefect`. For the `package`-kind additions
    (tex/python, slides/python, 3d/python), at least one test per pilot proving `search_symbols`
    now surfaces the defect on the new ref (this is the test that actually proves the
    architectural fix, not just the data change) and at least one proving `get_symbol` still
    works too (regression guard - it already worked, must keep working). One test proving a
    pilot's existing `method`/`class`-kind entry (unaffected by the architectural change) still
    behaves identically before/after (no regression). One test proving `CELLS-GO-001`'s corrected
    ref now actually matches a real `get_symbol("Cell")` call where it never did before.
  - >-
    Re-run every test in every one of the 4 `tests/indexing/test_known_defects_data_*.py` files
    and the completeness test twice clean (not just the ones you expect to change) - a stray
    assertion elsewhere in those files may also pin an old single-ref value you didn't expect.
actions:
  - >-
    Fix search_symbols.py's package-kind filter gap, correct cells/go's two never-matching refs,
    and add real, independently-verified sibling symbol names to 9 existing known_defects entries
    across 9 pilots - closing the round-3 audit's "known_defects content-missing" cluster for
    every case where an existing entry's own text already named the real sibling.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_known_defects_refs_population.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 180
    junitxml: true
    proves:
      - REQ-G3-015
  - command: '{python} -m pytest tests/indexing/test_known_defects_data_cells.py tests/indexing/test_known_defects_data_pdf_slides.py tests/indexing/test_known_defects_data_remaining.py tests/indexing/test_known_defects_data_3d.py tests/indexing/test_known_defects_completeness.py tests/mcp/tools/test_known_defects_in_search_symbols.py tests/mcp/tools/test_known_defects_in_get_symbol.py tests/mcp/tools/test_known_defects_in_product_reference.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-015
min_tests: 12
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; q = chr(34); p = pathlib.Path('src/foss_mcp/mcp/tools/search_symbols.py'); s = p.read_text(encoding='utf-8'); marker = '_SYMBOL_DEFECT_SUBJECT_KINDS = frozenset({' + q + 'method' + q + ', ' + q + 'class' + q + ', ' + q + 'package' + q + '})'; assert marker in s, 'the widened frozenset literal was not found exactly as expected - if your real fix spells it differently (e.g. a different ordering or a different variable form), anchor your own mutate on your own real literal instead and note the substitution in your closeout'; narrowed = '_SYMBOL_DEFECT_SUBJECT_KINDS = frozenset({' + q + 'method' + q + ', ' + q + 'class' + q + '})'; s2 = s.replace(marker, narrowed, 1); assert s2 != s, 'substitution had no effect'; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Reverts the one-line architectural widening back to excluding package-kind defects from
    search_symbols, so every test proving search_symbols now surfaces a package-kind entry
    (tex/python, slides/python, 3d/python) must fail. Tests scoped only to get_symbol or to the
    method/class-kind refs additions (cells/net, cells/java, cells/python, pdf/java, pdf/cpp,
    the cells/go correction) are unaffected by this specific mutation; if your real fix touches
    get_symbol.py differently too, verify this mutation still reaches a real behavioral break
    for at least the search_symbols package-kind path, and say so in your closeout.
evidence:
  - evidence/build/G3/TC-660/receipt.json
closeout:
  - >-
    9 real known_defects entries across 9 pilots now name every real sibling symbol their own
    text already implied, search_symbols no longer silently drops every package-kind disclosure,
    and cells/go's two always-broken refs now actually match. 5 pilots with zero coverage and 5
    bugs needing brand-new entries remain, explicitly deferred to a future card.
recovery: Re-run from a clean tree.
