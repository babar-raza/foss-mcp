id: TC-660
gate: G3
lane: storage-retrieval
purpose: >-
  Closes the round-3 audit's "known_defects content-missing" cluster (`docs/round3/issues.json`,
  category `mcp-content-missing`, ~18 findings) for the subset where a REAL, already-committed
  known_defect entry's own `summary`/`user_action` text already names a real sibling symbol the
  same bug affects, but `subject.refs` (the array `TC-658` just proved the mechanism for) still
  only has the ONE name the original finding cited. This supervisor already investigated every
  candidate via a dedicated fork and verified each addition below against the pilot's real
  `tests/fixtures/<pilot>/api_surface.json` before writing this card - do not re-derive from
  scratch, but DO re-verify the exact FQN string live (see the ambiguous-FQN note below) before
  committing any of it, since a wrong string is worse than a missing one.

  This card intentionally does NOT cover every pilot the audit named: cells/cpp, html/python,
  pdf/typescript, slides/java, words/net have ZERO existing known_defects coverage (new-entry
  authoring, not refs-population - out of scope, future card), and cells/rust's pivot-table bug,
  cells/typescript's formula-write-only bug, pdf/net's OcspSettings bug, slides/cpp's
  add_clone()/get_xfrm bugs, and 3d/typescript's other Scene/SaveOptions bugs each need a BRAND
  NEW entry with no existing entry to extend - also out of scope, also a future card. Do not add
  new defect ids in this card under any circumstance; only add names to existing `refs` arrays
  (plus the one real pre-existing bug fix named below, which is a correction, not an addition).

  **A real, independent bug this investigation found** (fix regardless of everything else):
  `config/known_defects/cells__go.yaml`'s `CELLS-GO-001` (`refs: [cells_foss.Cell]`) and
  `CELLS-GO-011` (`refs: [cells_foss.CalculateFormula]`) have NEVER matched anything, in any
  version of this registry, because Go's real FQN convention (confirm yourself in
  `src/foss_mcp/indexing/chunk_builder.py`'s `_entry_fqn`, and in the real
  `tests/fixtures/cells_go/api_surface.json`) is the bare name with no package prefix - exactly
  like the already-correct, already-tested `CELLS-GO-012` (`refs: [Worksheet]`, added by
  `TC-656`, which passed its own real end-to-end test). Correct these two to `refs: [Cell]` and
  `refs: [CalculateFormula]` respectively (a correction of wrong data, not an addition).

  **The architectural blocker found** (fix first, before adding any `package`-kind refs below):
  `search_symbols.py:247`'s `_SYMBOL_DEFECT_SUBJECT_KINDS = frozenset({"method", "class"})`
  filters out every `subject.kind == "package"` entry before `refs` is even checked
  (`search_symbols.py:658`). `get_symbol.py`'s `known_defect_lines` has no such filter. Several
  round-3 findings name BOTH surfaces as empty (e.g. `TEX-PYTHON-008`: "empty on
  get_symbol/search_symbols/lookup") for entries that are `kind: package`
  (`TEX-PYTHON-001`, `SLIDES-PY-001`, the five `3D-PYTHON-*` entries below) - adding refs to
  those alone would fix only `get_symbol`, not `search_symbols`. Fix: widen
  `_SYMBOL_DEFECT_SUBJECT_KINDS` to `frozenset({"method", "class", "package"})` - purely
  additive, matches `get_symbol.py`'s existing unconditional-kind precedent, and does NOT touch
  `get_product_reference.py`'s own independent `_LIBRARY_DEFECT_SUBJECT_KINDS` filter
  (`frozenset({"package", "commit"})`, a different constant in a different file), so every
  pilot's existing library-wide hazard display in `get_product_reference` is completely
  unaffected - no regression there under this project's own "no pilot ever gets worse" rule.
  Confirm this yourself by reading both constants and their call sites before changing anything.

  **Refs to ADD** (verified against each pilot's real `api_surface.json`; re-verify the exact FQN
  string live against the real committed generation before committing - see the ambiguous-FQN
  note):
  - `config/known_defects/cells__net.yaml` `CELLS-NET-002` (currently `refs: [Workbook]`): add
    `SaveOptions`, `PdfSaveOptions` (both real; the entry is specifically about the Save-extension
    behavior these two option types control).
  - `config/known_defects/cells__java.yaml` `CELLS-JAVA-001` (currently `refs: [Workbook]`): add
    `SaveOptions` only - confirm `PdfSaveOptions` does NOT exist as a real symbol in
    `tests/fixtures/cells_java/api_surface.json` before deciding whether to add it too.
  - `config/known_defects/cells__python.yaml` `CELLS-PY-005` (currently `refs: [Workbook]`): add
    `Cell` - confirm the real canonical FQN string (the fixture may carry both a canonical
    module-qualified form and a re-export shell; use whichever one the real baked chunk's own
    `FQN:` line actually carries, not a guess).
  - `config/known_defects/pdf__java.yaml` `PDF-JAVA-002` (currently
    `refs: [org.aspose.pdf.Page]`): add `org.aspose.pdf.TextStamp` - this entry's own summary is
    literally about `Page.addStamp(TextStamp)` being silently dropped; TextStamp is the real
    implicated class. Do NOT add anything to `PDF-JAVA-001` (the WatermarkArtifact entry) -
    its own text recommends TextStamp as the correct *workaround*, not as another affected symbol.
  - `config/known_defects/pdf__cpp.yaml` `PDF-CPP-001` (currently
    `refs: [Aspose::Pdf::Document]`): add `Aspose::Pdf::Text::TextAbsorber` and
    `Aspose::Pdf::CryptoAlgorithm` - both real, both literally named in this entry's own repro
    text (the AES-256 defect this card's own `purpose` already called out for `PDF-CPP-013`).
  - `config/known_defects/tex__python.yaml` `TEX-PYTHON-001` (currently
    `kind: package, refs: [aspose-tex]`): add `TeXJob`, `PdfDevice`, `TeXOptions` - all real, all
    literally named in this entry's own existing `user_action` text as the exact quick-start
    import names that fail. Requires the architectural `search_symbols.py` fix above to actually
    reach `search_symbols`/`lookup`, not just `get_symbol`.
  - `config/known_defects/slides__python.yaml` `SLIDES-PY-001` (currently
    `kind: package, refs: [aspose-slides-foss]`): add `SlideCollection`, `NotesSlideManager` -
    both real, both literally used in this entry's own repro (`add_clone()` via
    `SlideCollection`, `notes_slide_manager.add_notes_slide()`). Same architectural dependency.
  - `config/known_defects/3d__python.yaml`, all 5 entries (`3D-PYTHON-001`, `-002`, `-006`,
    `-008`, `-010`; currently `kind: package, refs: [aspose-3d-foss]` each): every one of these
    is really about `Scene` (export/reload behavior); `3D-PYTHON-001`/`-010` are also about
    `ObjSaveOptions`, `3D-PYTHON-002` about `GltfSaveOptions`, `3D-PYTHON-006` about
    `ThreeMfSaveOptions`. Add `Scene` to all 5, and the matching `*SaveOptions` type to the 3
    named above. Same architectural dependency as tex/python and slides/python above.

  **Ambiguous-FQN note** (read before touching any of the refs above): several of these real
  symbols have more than one candidate FQN string in their pilot's fixture - a canonical
  module-qualified form plus one or more re-export/alias shells (e.g. `Scene` may appear as both
  `aspose.threed.Scene.Scene` and the re-exported `aspose.threed.Scene`; `Document` in
  words/python has 3 variants). Do not guess which string the real baked generation's `FQN:` line
  actually carries for a given symbol - confirm it directly (read the real committed
  generation/lexical-index content for that pilot, or make a real `get_symbol(<candidate>)` call
  through the test harness and see what comes back) before writing it into any `refs` array. A
  wrong string is strictly worse than a missing one: it looks like coverage while adding none.

  Before writing anything, re-read this card's own claims against the real, current
  `config/known_defects/*.yaml` content and the real `api_surface.json` files yourself - this
  investigation is thorough but is still this supervisor's synthesis, not infallible.
