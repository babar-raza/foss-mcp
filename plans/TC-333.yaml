negative_control:
  mutate: |
    python -X utf8 -c "import json,glob;p=sorted(glob.glob('infra/demo-manifests/pdf__net__self_extracted/generation__*.json'))[0];d=json.load(open(p,encoding='utf-8'));d['payload']['lexical_index']['documents']={};json.dump(d,open(p,'w',encoding='utf-8'))"
  rationale: Empties pdf/net's own REPLACED generation's lexical_index.documents (the same real,
    non-empty-content assertion TC-329's own falsifier targeted, now re-applied to this card's new
    content) - test_demo_manifests.py's per-pilot content-integrity test fails for that one pilot. This
    is the only one of this card's two declared checks that reads infra/demo-manifests/ content at all
    (test_retrieval_tools.py builds its own synthetic vector payloads and is unaffected by this card's
    data replacement either way), so it is the correct, real target for this card's own falsifier.
evidence:
