closeout:
- infra/demo-manifests/ now carries real, content-verified, 4096-dim Qwen-embedded vector data for all
  40 pilots, dimensionally compatible with TC-331's find_examples wiring and ready for search_docs/
  search_symbols' own later wiring cards.
recovery: Re-run from a clean tree.
