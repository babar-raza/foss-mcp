id: TC-426
gate: G3
lane: extraction
purpose: >-
  REQ-G3-005 (pilot completeness). tex/python serves only its 4 exception classes; TeXJob, TeXOptions, PdfDevice, SvgDevice,
  DviDevice, OutputDevice, OutputFormat, create_input_source, FileInputSource, InputSource and StringInputSource are NotFound, and
  nothing tells a client why. Verified: the cause is NOT that the Python reader skips classes defined in a package
  `__init__.py` (src/foss_mcp/extraction/tree_sitter_engine/python_surface.py `_module_symbols` scans `__init__.py` like any
  module). The upstream source at the pinned commit 181015d does not parse: in a GitHub archive of that commit 34
  aspose_tex .py files fail `ast.parse` (indentation collapsed to 0 or 1 space), among them presentation/__init__.py at line 108
  and _input/reader.py at line 53. The committed tests/fixtures/tex_python/api_surface.json already records
  `aspose_tex.presentation:108:syntax-error:src/aspose_tex/presentation/__init__.py:...` plus 11 `unresolved-reexport` entries in
  its `unresolved` list, but that list never reaches the index or a client. Two real gaps: (1) a re-export whose origin is a
  PRIVATE module that fails to parse (aspose_tex._input.reader) is reported only as "unresolved-reexport", never as a syntax
  error, because `_origin_definition` swallows the SyntaxError; (2) infra/build_chunks.py publishes nothing about an extraction
  that could not read the source, so the pilot silently looks like a 4-class library. This card records the private-module
  syntax error and publishes one explicit, searchable extraction-notice documentation chunk whenever the fixture records a
  syntax error. Clients then see: get_symbol/lookup for TeXJob still answer NotFound (the symbol genuinely could not be
  extracted), and documentation search returns the notice naming the unparseable files and the public names that could not be
  extracted. Re-ingesting tex/python publishes the notice from the CURRENT fixture (no re-extraction needed); the private-module
  entry appears after the next re-extraction.
