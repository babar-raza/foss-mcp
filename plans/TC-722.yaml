    `email/cpp`'s real reference-invalidation hazard on `add_attachment`/`add_recipient`/
    `add_embedded_message_attachment` is now disclosed via a new project-authored known_hazards
    entry, closing EMAIL-CPP-004 with zero code change.
recovery: Re-run from a clean tree.
