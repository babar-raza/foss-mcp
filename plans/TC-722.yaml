negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('config/products/email/cpp.yaml'); s = p.read_text(encoding='utf-8'); old = 'mapi_message'; count = s.count(old); assert count >= 1, 'the expected mapi_message literal was not found - if your real hazard text phrases this differently, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; s2 = s.replace(old, 'mapi_messageNOTREAL', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the real hazard text's own subject name so it no longer names the real class the new
    regression test asserts on, which must make that test fail - a pure data mutation, immune to
    the lockstep-rename vacuousness class this session's earlier reviews found, and it never
    touches any code path. If your real hazard text repeats "mapi_message" more than once before
    the mutate's target occurrence, or your chosen trace token is a substring of another required
    phrase, re-anchor the mutate or your trace token so the mutation genuinely breaks your new
    test, per the TC-720 lesson cited above.
evidence:
