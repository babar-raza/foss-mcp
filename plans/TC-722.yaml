id: TC-722
gate: G3
lane: transport-deployment
purpose: >-
  Closes EMAIL-CPP-004 (round-2, `docs/round2/issues.json`, severity P2, category "coverage-gap"
  - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation): `mapi_message`'s
  `add_attachment`/`add_recipient`/`add_embedded_message_attachment` each return a REFERENCE
  (`mapi_attachment&`/`mapi_recipient&`) into an internal `std::vector` member - a reference that
  is silently invalidated the moment any SUBSEQUENT `add_*` call on the SAME `mapi_message` causes
  that vector to grow and reallocate (standard, unavoidable `std::vector::push_back` semantics).
  `get_symbol`/`list_members` show only the bare `mapi_attachment&`/`mapi_recipient&` return type
  with zero reference-stability caveat. A caller who follows the natural pattern - capture the
  returned reference, then call `add_attachment`/`add_recipient`/`add_embedded_message_attachment`
  again to add a second item, then keep using the FIRST reference to continue configuring it -
  silently reads corrupted/empty data with no crash and no diagnostic.

  ROOT CAUSE (independently confirmed, not guessed): the real upstream source
  (`src/msg/mapi_message.cpp`, fetched via `gh api` at the real pinned commit `c844a467`) shows
  all three methods end with the identical pattern `attachments_.push_back(...); return
  attachments_.back();` (or the `recipients_`-equivalent) with NO `reserve()` call anywhere in the
  class - confirming the vector can and does reallocate on ordinary use, invalidating every
  previously-returned reference. This is a genuine, confirmed upstream behavior, not a hypothetical.

  REPRODUCE FIRST: confirm this is still real. Read the real pinned commit's `src/msg/mapi_message.cpp`
  and `include/.../mapi_message.hpp` (or wherever the three methods' real declarations live) yourself
  directly (via `gh api repos/<the real email/cpp repository, from config/products/email/cpp.yaml>/contents/...
  ?ref=<the real source_ref>`) and confirm the exact same `push_back(...); return .back();` pattern
  with no `reserve()` call, for all three methods. If a real, minimal C++ compile is available in
  your environment (the pinned ingestion toolchain container), a live repro matching the finding's
  own `work/main.cpp` style (capture a reference, call a second `add_*`, observe the first
  reference's data is now corrupted/empty) is a stronger confirmation than the source read alone -
  attempt it if practical, but the source-level confirmation above is sufficient to proceed if a
  live compile isn't readily available; report which you did, and the real result, in your closeout.

  FIX (pure additive data, zero code change - same mechanism this project already uses for
  `cells/go`/`page/python`/`cells/python`'s own entries; `email/cpp` has no `known_hazards` key
  yet): add a NEW `known_hazards` key to `config/products/email/cpp.yaml` (as the LAST top-level
  key, matching the established file-level comment convention), with ONE entry stating plainly:
  the real trigger (capturing the reference `add_attachment`/`add_recipient`/
  `add_embedded_message_attachment` returns, then making ANY further `add_*` call on the same
  `mapi_message` before finishing with that reference), the real mechanism (a `std::vector`
  reallocation silently invalidates the earlier reference - no crash, no exception, just
  corrupted/empty data read back), and the safe pattern (never hold onto a returned
  `mapi_attachment&`/`mapi_recipient&` across a further `add_*` call on the same message; finish
  configuring each one, or re-fetch it by index/position afterward, before adding the next).
depends_on:
