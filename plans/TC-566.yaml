id: TC-566
gate: G3
lane: verification
purpose: >-
  REQ-G3-009 (rows RD3-150 to RD3-154, RD3-023). PERMANENT FIDELITY GATE AND TEST-BLIND-SPOT CLOSURE. The round-3 audit showed that the shipped data is a pure function of the committed fixtures (14,347
  of 14,348 chunks rebuild byte-identically), so no existing test can see a lossy extractor; 15 of 32 fixtures carry no extractor_version; live container tests cover 7 of 32 pilots and one is already stale
  (the pdf/typescript e2e test pins the old two-commit generation and fails at HEAD); tests/test_githooks.py expects a relative core.hooksPath that this clone stores as an absolute path; three real-Rust
  build tests error intermittently under a Windows application-control policy; several assertions were rewritten to match behaviour (W1 to W6 of the weakening audit). FIX: (1) an independent source-differential
  verifier under scripts/release that, for every language, enumerates the public API of the upstream library at the pinned commit with the language's own tooling (Python ast/inspect, TypeScript compiler
  API, Go go/ast, Rust syn/rustdoc, Java javap/reflection, .NET reflection or the compiler, C++ clang or header scan) and compares presence, signature, static/instance, defaults and enum values with the
  baked generation; it runs in the release gate with per-language error-rate ceilings and fails on a fixture without an extractor_version at the current schema; (2) a fleet live-content smoke that starts
  every one of the 32 pilots and asserts a language-appropriate set of symbol facts (a central class, a constructor, an enum, a static) taken from the oracle; (3) fix the stale pdf/typescript e2e pin and
  the githooks test (accept both forms of the hooks path); (4) mark the real-Rust build tests as environment-sensitive with a precise skip reason only when error 4551 is observed, never silently; (5) restore
  the weakened assertions where the cause is fixed (EXTRACTOR_VERSION equality, W2 after TC-561) and record the rest in docs/RELEASE.md; (6) adopt the blind-spot classes C1 to C8 of docs/ROUND3_REVIEW.md
  as a review checklist in docs/REPOSITORY_LAYOUT.md. REGISTERED AS A DRAFT on 2026-10-17 from docs/ROUND3_REVIEW.md: before dispatch the supervisor re-reads this card against the merged code, calibrates
  min_tests (it applies to EACH check), replaces the placeholder negative control with a real falsifier that has no backslash, and verifies every file named in write_paths (Supervisor rule 5). Nothing here
  has been executed.
depends_on:
- TC-550
- TC-553
- TC-554
- TC-555
- TC-556
- TC-558
- TC-173
- TC-180
- TC-226
- TC-343
- TC-567
write_paths:
- scripts/release/source_differential.py
- scripts/release/fleet_live_smoke.py
- scripts/release/image_workflow_gate.py
- tests/release/test_source_differential.py
- tests/release/test_fleet_live_smoke.py
- tests/e2e/test_pdf_typescript_live_content.py
- tests/test_githooks.py
- tests/extraction/test_run_extraction_coverage_policy.py
- tests/indexing/test_example_verifier.py
- docs/REPOSITORY_LAYOUT.md
satisfies:
- REQ-G3-009
- REQ-G3-008
source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: (a) the verifier runs offline on committed upstream-shaped micro-libraries in each language (written for the test) and reports exact per-category error counts; on the real pilots it is run
  by the supervisor at closing time, not by the unit check; its ceilings are set from the post-fix measurements of the seven extractor cards and recorded as ratchets; (b) the release gate fails on a baked
  pilot whose fixture lacks extractor_version >= the current schema; (c) the fleet smoke has a dry-run mode for the offline check and a live mode for the closing run; (d) the e2e pin test passes against
  the new single-commit generation; (e) test_githooks passes with either path form; (f) EXTRACTOR_VERSION equality restored. INDEPENDENT ORACLE: by construction this card IS the oracle; its own tests use
  hand-written libraries with known answers.
actions:
- >-
  Build the independent differential verifier and the 32-pilot live smoke, wire them into the release gate, repair the stale and environment-sensitive tests.
checks:
- command: >-
    {python} -m pytest tests/release/test_source_differential.py tests/release/test_fleet_live_smoke.py tests/test_githooks.py tests/extraction/test_run_extraction_coverage_policy.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/release tests/deploy tests/extraction -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native and not test_prepare_rust_library and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 8
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "print('negative control to be authored before dispatch')"
  rationale: >-
    PLACEHOLDER written at registration. The supervisor replaces it, before dispatch, with a falsifier that breaks the card's central claim in the code the worker writes (a mandated constant or function
    name) so that a named new test fails.
evidence:
- evidence/build/G3/TC-566/receipt.json
closeout:
- >-
  The release gate measures the served data against upstream source with an independent oracle in every language, every pilot is smoke-tested live, and the stale and environment-sensitive tests are repaired.
recovery: Re-run from a clean tree.
