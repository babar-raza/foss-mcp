  each of the 5 affected C++ pilots, exactly as TC-252''s algorithm fix was followed by TC-255-258''s regeneration
  wave earlier this session. Do not attempt to regenerate any fixture yourself as part of this card.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
