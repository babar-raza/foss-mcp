inputs:
- 'Read src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py''s _node_name() (currently ~line 287-320) in full,
  including its own existing comment block describing the (currently unimplemented) intent for C++ class members.
  Read _cpp_is_free_function() and _cpp_free_function_name() immediately below it (same file) to understand exactly
  how the free-function case is already correctly handled, so the member-case fix follows the same established
  pattern rather than inventing a new one.'
- 'Restructure the existing `if language == "cpp" and node.type == "function_definition" and _cpp_is_free_function(node):`
  block into exactly this shape (an outer language/node-type check, with the existing free-function body moved into
  an `if`, and a new `else` branch added for the member case):

      if language == "cpp" and node.type == "function_definition":
          if _cpp_is_free_function(node):
              cpp_name = _cpp_free_function_name(node)
              if cpp_name:
                  return cpp_name
          else:
              return ""  # TC-259: member case

  Use exactly this structure, INCLUDING the literal trailing comment `# TC-259: member case` on the `return ""`
  line verbatim (the supervisor''s negative control matches that exact comment text, regardless of indentation, to
  reliably disable only this new branch without touching the free-function path next to it) - do not invent a
  differently-shaped equivalent and do not drop or reword that comment. Do not change _cpp_is_free_function,
  _cpp_free_function_name, or anything
  about the free-function body itself, which is already correct and already tested. Update the existing comment
  block so it accurately describes what the code now actually does (it currently describes the empty-string-return
  behavior as already implemented for members when it is not - correct that gap, do not just add more text on top
  of the inaccurate claim).'
- 'Add tests/extraction/tree_sitter_engine/test_cpp_reference_return_member_naming.py: construct a minimal, real
  tree-sitter-cpp parse of a class containing a reference-returning const accessor shaped exactly like the real
  bug (e.g. "const Border& GetLeft() const noexcept { return _left; }" alongside a normal value-returning accessor
  such as "bool GetDiagonalUp() const noexcept { return _diagonalUp; }", a setter, and a constructor - mirror the
  real Borders.h shape closely enough to be a faithful regression, but you do not need to reproduce the whole real
  file). Call the real extract_api_surface() (see tests/extraction/tree_sitter_engine/test_lang_python_parity.py
  or tests/extraction/tree_sitter_engine/test_consolidate_classes_free_functions.py for the calling convention
  already used elsewhere in this test suite) and assert: no method or property is ever named exactly after its own
  zero-parameter return type ("Border" must never appear as a method or property name here); the real
  reference-returning getter is still correctly extracted under its real name with its real return type; the real
  setter, constructor, and the real value-returning getter/setter pair are all still correctly extracted unchanged.
  Also add a second test proving the free-function path is completely unaffected: a genuine namespace-scope free
  function with a reference-returning signature (e.g. "const Matrix& Identity();" at namespace scope, mirroring
  TC-058''s own original real-world case) still resolves to its real name, not its return type.'
- 'Run the new test file, then run the full existing test suite once (not just your own file) to check for
  downstream breakage - every committed C++ fixture currently contains this exact fabricated data, so some existing
  test somewhere may assert on a phantom entry''s presence as if it were real content, or on a type/method count
