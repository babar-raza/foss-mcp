id: TC-259
gate: G2
lane: extraction
purpose: 'Fix a real, confirmed, fleet-wide fabrication defect (C1 of the third independent audit, 2026-10-08):
  src/foss_mcp/extraction/tree_sitter_engine/tree_helpers.py''s _node_name() claims, in its own existing comment
  (written by TC-058), that a C++ class-member function_definition is "deliberately left returning '''''' here...
  because api_surface.py''s dedicated C++ field_declaration_list member loop already names and extracts those
  independently" - but the code does not actually do this. It only special-cases genuine free functions (gated by
  _cpp_is_free_function) and otherwise falls through to a generic "first identifier-or-type_identifier direct-child"
  fallback - the exact fallback TC-058''s own comment identifies as unsafe for a bare-identifier return type, just
  never actually guarded for the member case. For any member whose return type is a reference or pointer to a class
  type (e.g. "const Border& GetLeft() const noexcept"), tree-sitter-cpp places a bare type_identifier node (the
  return type) as a direct child of function_definition, one level above the reference_declarator/function_declarator
  holding the real name - so the fallback matches the return type first and returns it as the "name". This feeds a
  separate, generic, language-agnostic method-collection pass (which also visits class members despite the
  comment''s claim) that appends a phantom method named after the return type, with that same type as its own
  return_type; _synthesize_cpp_properties then turns that same phantom method into a phantom property too, since it
  satisfies every one of that function''s own synthesis criteria. Confirmed live against the real cells/cpp pod''s
  get_symbol("Aspose::Cells_FOSS::Borders") - the response contains five fabricated "Border() -> Border" methods and
  a fabricated "Border: Border" property, none of which exist anywhere in the real upstream header (confirmed by
  fetching the real source at the pinned commit directly from GitHub). Confirmed, by scanning every committed C++
  fixture for the exact "a method''s name equals its own zero-parameter return type" signature, that this is NOT an
  isolated one-class bug: it appears 665 times across all 5 C++ pilots (slides_cpp 459, cells_cpp 112, pdf_cpp 81,
  jmap_cpp 11, email_cpp 2). Confirmed, by monkeypatching the proposed fix into a minimal reproduction of the real
  source shape, that an explicit early return "" for this exact case (matching the comment''s own already-stated
  intent) eliminates both phantoms completely while leaving every real method untouched.'
