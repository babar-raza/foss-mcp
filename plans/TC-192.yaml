id: TC-192
gate: G2
lane: transport-deployment
purpose: 'Make release images come from one exact commit, with that commit recorded on them. Today the
  images are built from the working tree of the main checkout. The checkout has CRLF line endings and any
  untracked local file, so an image is not byte-identical to any commit, and nothing on the image says
  which commit it came from. The 2026-10-04 chart proof could only say "built at b6737bd" by hand, and
  HEAD had already moved on by the time the proof ran. Also, .dockerignore lists __pycache__/ at the
  context root only, so nested src/**/__pycache__ .pyc files are copied into both images. This card adds
  a release build script that exports HEAD with git archive, builds both images from that export, and
  stamps the revision label. It also fixes the .dockerignore pattern.'
depends_on:
- TC-185
write_paths:
- .dockerignore
- scripts/release/build_images.py
- tests/infra/test_release_images.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read .dockerignore in full, and Dockerfile.serving and Dockerfile.ingestion, to learn what each image copies.
  Read the chart''s image settings in infra/helm/foss-mcp/values.yaml, to learn the tag and repository names
  it expects.'
- 'Add the line **/__pycache__/ to .dockerignore, as a literal line of its own, keeping the existing lines.
  The new line must read exactly **/__pycache__/ so that it can be found by text.'
- 'Add scripts/release/build_images.py as a new file. It takes no arguments beyond an optional --tag. It does
  these steps, and stops with a non-zero exit at the first failure. (1) Refuse to run unless git reports HEAD
  as a commit and the tree of the main checkout is clean in tracked files. (2) Export HEAD with git archive
  into a fresh temporary directory, so that the bytes are the committed bytes. (3) Build foss-mcp-serving
  from Dockerfile.serving and foss-mcp-ingestion from Dockerfile.ingestion, with the exported directory as the
  build context, and the label org.opencontainers.image.revision set to the full HEAD SHA. (4) Tag both images
  with the short HEAD SHA, as rev-<sha7>, unless --tag is given. (5) Print the two image names and the full
  SHA. The script must use the docker command already on PATH after the toolchain activation.'
- 'Add tests/infra/test_release_images.py as a new file. It must be offline and must not run docker. Test 1: the
  .dockerignore file contains the line **/__pycache__/. Test 2: scripts/release/build_images.py contains the
  git archive call, and the revision label string org.opencontainers.image.revision. Test 3: the script
  refuses a dirty tree, which is checked by reading the script''s own guard text for the word dirty and the
  git status call. Test 3 must not run git on a real repository.'
- 'Keep every existing test and assertion. Do not change the Dockerfiles, the chart, or any source file.'
actions:
- Read the files named in inputs in full.
- Add the .dockerignore line, the script, and the test file.
- Run the test file and report the exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_release_images.py -q'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 3
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('.dockerignore');s=p.read_text(encoding='utf-8');p.write_text(s.replace('**/__pycache__/','**/__pycache_off__/'),encoding='utf-8')"
  rationale: 'Changes the new .dockerignore line so that it no longer excludes nested __pycache__ folders. Test
    1 looks for the exact line **/__pycache__/ and must then fail. This proves the test reads the ignore file
    itself, not a copy of its intent. Built with plain text, since it has no quote or backslash.'
evidence:
- evidence/build/G2/TC-192/receipt.json
closeout:
- Release images are built from a git archive of one commit and carry that commit SHA as a label.
- Nested __pycache__ files are excluded from the image build context.
recovery: Re-run from a clean tree.
