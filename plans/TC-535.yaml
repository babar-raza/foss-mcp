negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/lang/go.py');s=p.read_text(encoding='utf-8');old='GO_SUBPACKAGE_IMPORT_PATHS = True';assert s.count(old)==1;p.write_text(s.replace(old,'GO_SUBPACKAGE_IMPORT_PATHS = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch by which a Go symbol carries its package and import path, so the 31 pdf/go `ai` sub-package names are attributed to the root package again (the RD3-025 defect, `pdf.NewChatCopilot`
    -> undefined): the synthetic sub-directory test and the regenerated-fixture test (NewChatCopilot must carry the /ai import path) fail at once.
