source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md rows RD3-025 to RD3-033 and section 3.4, then src/foss_mcp/extraction/tree_sitter_engine/api_surface.py (the Go and Rust declaration walking), lang/go.py, lang/rust.py
  (`export_surface`, `reexported_names`), chunk_builder.py, the existing Go/Rust tests named in write_paths, and the merged work of TC-532, TC-533 and TC-534 (the same module serves Python, TypeScript and
  C++: do not disturb those paths; all their tests must stay green). Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call; set PYTHONPATH=src.
  Never print an environment value. Verify every name against the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Do not edit plans/, project/,
  ops/, evidence/, schemas/ or docs/; no docker or cluster command. The real-Rust build tests are blocked on this host by an intermittent application-control policy: your new tests must NOT run cargo, rustc
  or go build; they use hand-written sources and the committed fixtures only. Source truth wins over fixtures: every new test takes its expectation from an INDEPENDENT oracle (a hand-written Go/Rust source
  whose answer follows from the language rules, a count made directly on the cloned sources, or the upstream facts quoted below), never from the extractor's own output.
- >-
  THE EXTRACTOR AND RENDERER WORK. Mandated names (the negative control and later cards rely on them): in lang/go.py the exact line `GO_SUBPACKAGE_IMPORT_PATHS = True`, a real switch: when True every Go
  symbol is recorded with its package name and import path (module path plus the sub-directory, so `ai` symbols of pdf/go carry `<module>/ai`) and chunk_builder renders the import path and the qualified
  call form (`ai.NewChatCopilot`); when False the extractor behaves as before this card (one flat root package). Beyond that, GO: untyped package-level `const` and `var` (also grouped, with `iota`) are
  indexed with their value or type; methods and functions of unexported types are not served; a struct-tag string is never the field type; a function-typed declaration (`type RowCallback func(...)`) renders
  its signature; embedded/promoted members are listed with `(promoted from T)`. RUST: only items reachable from the crate root through `pub use`/`pub mod` chains are served and trait-impl functions (`eq`,
  `fmt`, `hash`, ...) are not served as free API; receivers (`&self`, `&mut self`, `self`, `mut self`) and generic parameters with bounds and where-clauses are recorded and rendered; data-carrying enum
  variants keep their payload (tuple and struct variants); `pub type` aliases are indexed with their target; derive traits are not listed as Bases. ACCEPTANCE: each item has a synthetic-source test in tests/extraction/tree_sitter_engine/test_gorust_surface_round3.py
  (at least 16 tests, hand-written sources, for example `package ai; func NewChatCopilot() *ChatCopilot` in a sub-directory yields the import path `<module>/ai`; `const ( A = iota; B )` yields A and B;
  `pub fn save(&mut self, p: &str)` renders `&mut self`; `pub enum V { A(i32), B { x: u8 } }` keeps both payloads; `pub type S = Inner;` is indexed; a `fn` in a private `mod` that is not re-exported is
  not served), and renderer tests in tests/indexing/test_chunk_builder_round3_gorust.py (at least 5). No currently faithful line changes: the existing Go/Rust tests, the Go fidelity gate and every non-Go/Rust
  extractor test stay green.
- >-
  THE RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop).
  Regenerate THE THREE fixtures with the fixed extractor, one pilot per command, from the repository root: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml
  tests/fixtures/<family>_<platform>/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_<platform>/pages/_index.md --max-types 100000` for (family, platform) in pdf/go,
  cells/go, cells/rust, where <pin> is `ingestion.pilots[].library.commit` of infra/helm/foss-mcp/values.yaml for that pilot (never retype a commit). Each prints `wrote <path> (<bytes> bytes); <kept>/<total>
  types; commit <sha>`: kept must equal total and the commit must equal the pin. The CLI writes CRLF on Windows: normalise to LF so `git diff --stat` shows a content change. Every regenerated fixture must
  carry extractor_version 5, `symbol_counts`, `counts` and `parse_failures`. Record old and new type, function and member counts and byte sizes in the report (at registration: pdf/go 357 types, cells/go
  31, cells/rust 221). infra/helm/foss-mcp/values.yaml and docker-compose.yml are NOT in write_paths: chart caps are 357, 300, 300; if a measured total exceeds a cap, report it (the supervisor edits the
  chart).
- >-
  INDEPENDENT FACTS to assert on the REGENERATED real fixtures (each was read from the upstream by the round-3 audit; verify each against the clone at the pin before you rely on it and report any that is
  wrong): pdf/go: the 31 `ai` sub-package names (`NewChatCopilot`, `OpenAIClient`, `APIError`, ...) carry the `/ai` import path and are not attributed to the root package; the 26 untyped constants/vars
  (`PageFormatA4`, `FontHelvetica`, `ErrEncrypted`, ...) are indexed. cells/go: 20 untyped constants/vars (`AlignCenter`, ...) are indexed; `Cell.XMLName` and 4 other tagged fields show their real Go type;
  `RowCallback` has a signature. cells/rust: 106 of the old 221 symbols are not importable and are no longer served (count the `pub use`/`pub mod` reachable set directly on the crate source and assert equality,
  not the literal); `WorkbookModel` is importable at the crate root and served; methods render receivers; `CellValue`, `CellsError` and `CellObjectValue` keep their variant payloads; `Style` and `WorksheetCollection`
  aliases are indexed.
- >-
  RE-PINS AND TABLES (only after the re-extraction): run the first check and keep the failures. Change ONLY the assertions that pin a fact the regeneration legitimately moved (old type counts, symbols that
  are no longer served because they were not importable), each with the comment `TC-535: <old> -> <new>` and listed with its reason in the report; never delete, skip or xfail a test, never loosen a guard.
  tests/deploy/test_fleet_consistency.py: add STALE_BAKED_PILOTS entries (wording as TC-550/TC-532/TC-533/TC-534: `re-extracted by TC-535: the fixture now holds ..., the baked generation still says ...
  until the supervisor re-ingests`) for exactly the pilots whose `coverage_problems` is non-empty after your regeneration, and UNRESOLVED_EXCEPTIONS from the regenerated `unresolved` lists (never higher
  than the old maximum). tests/fixtures/readme_identifier_allowlist.json only with the helper (`python -X utf8 -m tests.extraction.docs_identifiers --write`); read `git diff`: only keys of these three pilots
  may change, and list every identifier that remains and looks like an API symbol. If a test outside write_paths fails, stop and report its name and the pinned fact.
- >-
  TEST COUNTS: min_tests is 395 for EACH check. At the issue revision the first check collects 374 existing tests (the nine existing files it names, with the two real-Rust tests deselected) plus the at
  least 21 you add in the three new files; the second check collects well over 2,500.
- >-
  PRE-EMPTED OUT-OF-SCOPE PINS (supervisor, 2026-10-19, learned from TC-533, whose worker met eight failures outside its write_paths). A regeneration of your fixtures may legitimately move facts pinned
  by these files, now in your write_paths: tests/extraction/test_reextracted_uncapped.py (chart cap equality, SIZE_FLOOR_BYTES and MEMBER_FLOOR per pilot: re-measure only the pilots of this card, floor
  = measured value rounded down to a round number, comment <card>: <old> -> <new> with the reason), tests/extraction/test_run_extraction_coverage_policy.py, tests/deploy/test_served_coverage_matches_fixtures.py
  (MIN_FUNCTION_ENTRIES and similar non-vacuity floors: set just below the new measured total, still well above zero), tests/deploy/test_served_provenance.py and tests/mcp/tools/test_freshness_provenance.py
  (these compare the BAKED generation with the fixture; the baked data stays stale until the supervisor re-ingests, so for a pilot listed in STALE_BAKED_PILOTS of tests/deploy/test_fleet_consistency.py
  do not assert the fixture-dependent comparison, but keep everything that does not depend on the fixture; never skip, delete or xfail), README.md (only the per-pilot type/function figures that tests/deploy/test_readme_matches_release.py
  compares), and infra/helm/foss-mcp/values.yaml, docker-compose.yml and src/foss_mcp/extraction/run_extraction.py RECOMMENDED_MAX_TYPES ONLY if a measured total no longer equals the one cap number (single-line
  replacements; chart, compose and extractor must carry the same number). Run the wider offline suites (tests/indexing, tests/infra, tests/deploy, tests/mcp and the top-level tests/test_*.py, usual -k filter)
  before you report: ALL must be green, and report each file of this paragraph that you changed with its reason.
