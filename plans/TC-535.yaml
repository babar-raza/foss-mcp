source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  ORDER AND FRESHNESS. TC-535 belongs to the strict chain TC-530 -> TC-531 -> TC-532 -> TC-533 -> TC-534 -> TC-535 -> TC-536 (dispatch in id order; the cards share infra/helm/foss-mcp/values.yaml, docker-compose.yml,
  tests/deploy/test_fleet_consistency.py, tests/fixtures/readme_identifier_allowlist.json, tests/indexing/test_chunk_builder_honesty.py and tests/extraction/reextraction_checks.py). It runs only after the
  extractor cards TC-520 to TC-528 are merged on main. Everything named below (command-line flags, module constants, fixture keys, helper functions, test names of other cards) was written from the specifications
  of those cards BEFORE they were implemented, and you must verify each name against the MERGED code before you rely on it: if a merged name differs, use the merged name and list the difference in your
  report; if a feature a step needs is simply not in the merged code, stop and report it as FAILED_INTERNAL, because src/ is not in your write_paths and you must not patch the extractor. Start from a clean
  tree at the commit the supervisor issues. Never print or log any environment value: the extraction clones with git over https and needs no token, and GITHUB_TOKEN is not read by it.
- >-
  READ FIRST (merged code, read only): src/foss_mcp/extraction/run_extraction.py (`main` and its flags `--commit`, `--keep-names-from`, `--max-types`; the constants `EXTRACTOR_VERSION`, `RECOMMENDED_MAX_TYPES`,
  `README_KEEP_FRACTION`; `reduce_fixture`; the keys the artifact carries: `extractor_version`, `symbol_counts`, `parse_failures` (TC-520), `counts` (TC-525), and on members `doc`, `params[].doc`, `return_doc`,
  `throws_doc` (TC-527, TC-528)); tests/extraction/docs_identifiers.py (TC-521: `docs_identifiers(pilot)`, `unresolved(pilot)`, `compare(pilot)`, `load_allowlist()` and the command `python -m tests.extraction.docs_identifiers
  --write`); src/foss_mcp/indexing/chunk_builder.py (`build_chunks_from_api_surface(fixture, title=..., max_types=...)`, the slot rule of TC-522 and the `API-Coverage:` line of TC-520); tests/deploy/test_fleet_consistency.py
  (TC-513); infra/helm/foss-mcp/values.yaml (`ingestion.pilots[]`: `family`, `platform`, `maxTypes`, `library.repository`, `library.commit`); docker-compose.yml (the `ingest-<family>-<platform>` services
  and their `--max-types` value); tests/infra/test_helm_pilots_match_compose.py (the parity rule).
- >-
  RE-EXTRACTION, one pilot at a time. Derive family, platform, pinned commit and cap from the chart and the merged constant, never retype them: the pilot key is `<family>_<platform>` (the directory name
  under tests/fixtures); the commit is `ingestion.pilots[].library.commit` of infra/helm/foss-mcp/values.yaml for that pilot; the cap is `RECOMMENDED_MAX_TYPES.get('<family>/<platform>', 300)` read from
  src/foss_mcp/extraction/run_extraction.py. The caps that differ from the default 300 for this card are (TC-520 `RECOMMENDED_MAX_TYPES`, key `<family>/<platform>`): pdf_go 450. Read the real values from
  the merged constant rather than trusting this list. With the toolchain activated in the SAME shell command (`scripts/toolchain/activate.ps1`) and `PYTHONPATH=src` set, from the repository root run, for
  each pilot, exactly: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/<platform>.yaml tests/fixtures/<pilot>/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<pilot>/pages/_index.md
  --max-types <cap>` (the command of the earlier re-extraction cards TC-400 and TC-401 plus the explicit cap; confirm the flags with `--help` first). Never regenerate or edit a furnished page. The command
  prints `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: the commit must equal the pin, and `<kept>` must be the smaller of the cap and `<total>` (a Python pilot may keep more than the
  cap because a re-export and its definition travel together). Runtime measured on 2026-10-15 with the pre-merge extractor: 4 to 60 seconds per pilot after the clone; words/net alone needed about 8 minutes
  for the clone and checkout; the merged extractor also parses doc comments, so allow twice that. Run each pilot as its own command, start slow ones in the background and poll with bounded waits (never
  a tail -F monitor on process output), and continue with the next pilot after a failure. If a clone or fetch fails (network, rate limit, an unreachable commit) do not retry in a loop: record `gatectl status-append`
  with BLOCKED_EXTERNAL and the exact resume predicate `git fetch of <repo>@<sha> succeeds`, keep every fixture you already regenerated, and stop. The CLI writes with the platform line ending and .gitattributes
  normalises to LF on commit: confirm `git diff --stat` shows each fixture as a content change and not as a whole-file line-ending rewrite. Before you overwrite tests/fixtures/cells_rust/api_surface.json
  and tests/fixtures/jmap_rust/api_surface.json note, from `git show HEAD:<path>`, the number of methods of the JmapClient entry of jmap_rust (the reviewer saw 9): it is the baseline for the 19-method test
  below. Expected: pdf_go `<total>/<total> types` with <total> about 433 (the extractor call uses cap 450); cells_go `31`; jmap_go about 149 before selection; cells_rust and jmap_rust whole surface.
- >-
  CHART AND COMPOSE. For every pilot of this card whose cap differs from the `maxTypes` now in infra/helm/foss-mcp/values.yaml (300 everywhere today), set that pilot's `maxTypes` to the cap AND the `--max-types`
  value of its `ingest-<family>-<platform>` service in docker-compose.yml to the same number, with targeted single-line replacements inside that pilot's block or service only (tests/infra/test_helm_pilots_match_compose.py
  and the `two_step_chain` test of tests/infra/test_helm_chart.py compare the rendered chart command with the compose command and fail on any difference). Why: infra/build_chunks.py slices the fixture again
  with `--max-types`, so a 300 there would silently cut what the extraction kept. For this card that means pdf_go (450). Every other byte of both files stays as it is, and you do not touch memory limits
  (the supervisor measures ingestion memory at the re-ingest). Pilots at the default cap are left untouched.
- >-
  README IDENTIFIER ALLOWLIST. tests/extraction/test_docs_identifiers_resolve.py (TC-521) fails for a pilot whose committed fixture resolves a different set of README-named identifiers than tests/fixtures/readme_identifier_allowlist.json
  lists, in both directions (a new gap, and a listed gap that is fixed). After re-extracting, regenerate the file with the helper only: `python -X utf8 -m tests.extraction.docs_identifiers --write` (never
  by hand), then read `git diff` of that file: only keys of pilots of this card may change. A key of a pilot you did not touch changing means the allowlist was already stale at your start commit: stop and
  report it. For every pilot of this card read the identifiers that remain listed and put in your report each one that looks like an API symbol of the library (each is an extraction defect to report, not
  something to leave allowlisted silently); the legitimate remainder is non-API text such as a build tool or a file name.
- >-
  GENERIC TESTS of tests/extraction/test_reextracted_gorust.py (NEW, offline, deterministic, no skips; import the helper; parametrised over the module list `PILOTS = ['pdf_go', 'cells_go', 'jmap_go', 'cells_rust',
  'jmap_rust']`; every test id carries the pilot): `test_fixture_is_extracted_at_the_chart_pin` (source_commit equals `pinned_commit(key)` and is 40 hex characters), `test_fixture_carries_the_current_extractor_keys`
  (`extractor_version >= REQUIRED_EXTRACTOR_VERSION`; `symbol_counts` is a dict with integer `types` and `functions`; when `parse_failures` exists its `engine` is `ast` or `tree-sitter` and `failed`, `total`
  are integers with failed <= total), `test_fixture_is_canonical_json` (the file text equals `json.dumps(data, indent=2, sort_keys=True) + chr(10)`, which is how the CLI writes it), `test_fixture_has_no_test_file_entries`
  (`test_file_entries` is empty), `test_cap_is_one_number_in_extractor_chart_and_compose` (`cap_problems` is empty), `test_ingestion_slice_keeps_every_extracted_entry` (`ingestion_slice_problems` is empty),
  `test_member_docs_reach_the_fixture` (against the module dicts `MEMBER_DOC_RATIO_FLOOR[key]` and `PARAM_DOC_FLOOR[key]`, literals YOU measure on the regenerated fixture and print in your report: the ratio
  `members_with_doc / members` rounded DOWN to two decimals and the integer `params_with_doc`; they are ratchets - a later extraction may raise them, never lower them), `test_no_description_is_cut_at_an_abbreviation`
  (`abbreviation_cut_docs` is empty), `test_readme_recall_has_a_floor` (against `RECALL_FLOOR[key]`: 0.90 for every pilot whose measured recall reaches it; a pilot that measures below 0.90 gets a floor
  equal to its measured recall rounded DOWN to two decimals AND a non-empty string in `RECALL_EXCEPTION_REASON[key]` that names the identifiers still unresolved and why none of them is an API symbol of
  the library (a build tool such as FetchContent, a file extension) or why the upstream cannot be parsed; if any remaining unresolved identifier looks like an API symbol, do not use an exception: report
  the pilot, its recall and the identifiers, and stop as FAILED_INTERNAL), and `test_recall_exceptions_are_real` (a pilot in RECALL_EXCEPTION_REASON really measures below 0.90, so an exception cannot outlive
  its cause). The helper tests/extraction/reextraction_checks.py already exists (created by TC-530): import it and extend it only additively.
- >-
  GO-AND-RUST-SPECIFIC TESTS of tests/extraction/test_reextracted_gorust.py (same file). Go: `test_pdf_go_has_all_98_exported_package_functions` (entries of kind `function` without a `receiver_type`: at
  least 98, among them Open, OpenWithPassword, OpenStream, NewDocument, NewDocumentFromFormat, NewTable), `test_no_go_function_is_an_unattached_method_of_an_unexported_receiver` (no function entry of the
  three Go fixtures has a `receiver_type` whose bare name starts with a lower-case letter), `test_basic_type_enums_carry_their_constants` (pdf_go: at least 40 entries have a non-empty `enum_members`; the
  HAlign entry's members include HAlignCenter), `test_pdf_go_counts_separate_types_from_functions_and_methods` (the merged counts key - `counts` of TC-525 and `symbol_counts` of TC-520, whichever are written
  - give types between 233 and 285 (the reviewer's 259 exported types plus or minus 10 percent) and functions between 98 and 200; if both keys exist they agree on `types`), `test_cells_go_stays_clean` (cells_go:
  at least 23 methods over its types and at least 15 function entries, the reviewer's clean baseline), `test_go_fixtures_carry_no_test_file_entry` (the old fixtures carried `_test.go` entries; none now).
  Rust: `test_cells_rust_methods_carry_a_receiver_or_associated_mark` (every dict in the `methods` list of every entry of cells_rust has a `modifiers` item in {&self, &mut self, self, mut self, associated};
  methods with `associated` >= 246 (95 percent of 259) and with a receiver >= 1362 (95 percent of 1434)), `test_no_std_boilerplate_function_chunks_remain` (no entry of kind `function` in cells_rust or jmap_rust
  is named eq, fmt, hash, default, clone, ne, partial_cmp or cmp), `test_jmap_rust_client_lists_the_mail_methods` (the JmapClient entry has `get_mailbox` and at least 19 methods; the baseline measured before
  the overwrite was 9), `test_rust_fixtures_carry_no_receiverless_function_for_a_method` (no `function` entry has a `receiver_type`). Generic 9 x 5 = 45 cases plus at least 10: the file has at least 55
  tests.
- >-
  THE jmap_go COVERAGE EXCEPTION. tests/deploy/test_fleet_consistency.py lists COVERAGE_EXCEPTIONS['jmap_go'] (the fixture counts 99 never-chunked Go functions, so the baked line reads '46 of 149 types'
  for a fixture that is not truncated). Rule of the existing table test: the exception stays only while `coverage_problems` is non-empty AND every problem names the truncation reading. After the regeneration
  the fixture's `type_count`, `truncated` and counts change, so against the OLD baked generation the problems will also name M (the type count), which is the stale-baked situation: if that is what you see,
  MOVE jmap_go from COVERAGE_EXCEPTIONS to STALE_BAKED_PILOTS (reason: regenerated by TC-535, baked generation old; TC-536 re-evaluates whether any Go-function coverage exception is still needed after the
  re-ingest) and keep the disjointness test green; do not delete the pilot from both tables. State in your report which of the two cases you met.
- >-
  FLEET CONSISTENCY TRANSITION (tests/deploy/test_fleet_consistency.py, owned by TC-513). The baked generations in infra/demo-manifests are produced by the supervisor's re-ingest AFTER the last re-extraction
  card, so between this card and TC-536 a re-extracted fixture and its old baked generation disagree on the API-Coverage line (the fixture's `type_count` and `truncated` change: pdf_net becomes 901 of 901
  and not truncated while its baked chunks still say `300 of 901 types`), and `test_api_coverage_lines_are_present_and_honest` would fail for a reason that is not a defect. The mechanism exists (created
  by TC-530): `STALE_BAKED_PILOTS` and its three table tests. Add to the table EXACTLY the pilots of this card for which `coverage_problems(load_fixture(key), symbols)` is non-empty after your regeneration
  (run the test first; never list a pilot that is still consistent), with a reason string naming this card. UNRESOLVED table: after regenerating, for every pilot of this card that is listed in `UNRESOLVED_EXCEPTIONS`
  set the listed maximum to the new count of the fixture's `unresolved` list (never higher than the old maximum), and delete the entry when the count is 0 (the table test `test_every_unresolved_exception_still_applies`
  fails otherwise); the `unresolved` count of a pilot that is not listed must be 0.
- >-
  EXISTING TESTS THAT PIN A FACT OF THE OLD FIXTURES. Before you edit any test, run the second check command and keep the list of failures. For each failing test that reads a fixture of this card (the per-pilot
  tests tests/extraction/test_<pilot>_extraction.py and the reader files named in write_paths), change ONLY the assertion that pins an old fact the regeneration legitimately changed - the old source commit,
  an exact old type count, first type or member list, a count that was capped at 300, the string `300 of 901 types`, a slice index into the old ordering, or a defect the extractor cards fixed (for example
  an assertion that a test-file entry or a std trait function is present because the old fixture had it) - to the re-extracted fact, with a one-line comment `re-extracted by <this card>: <old> -> <new>`.
  List every changed assertion with its reason in your report. Never delete, skip or xfail a test, never loosen a check that guards a defect (a `>=` floor may be raised, never lowered), and never edit a
  test outside write_paths: if one fails and is not in write_paths, stop and report its name and the pinned fact. tests/indexing/test_chunk_builder_honesty.py builds its chunks with `max_types=10_000`,
  so after a cap is raised its real-fixture tests see the whole fixture: re-derive each expected number from the new fixture rather than from memory.
- >-
  KNOWN READERS of the Go and Rust fixtures: tests/indexing/test_chunk_builder.py (`test_real_pdf_go_cells_rust_and_pdf_typescript_free_functions_render` pins `AddFontFile(path: string)` in pdf_go and,
  in cells_rust, the free function `fmt(f: &mut Formatter<'_>) -> std::fmt::Result` - TC-526 removes std trait impls from the members, so that assertion pins the defect: change it to an equivalent real
  free function or associated function of the new fixture and keep the intent 'a real free function renders with its real parameters'), tests/indexing/test_chunk_builder_honesty.py (`test_real_go_fixtures_publish_no_test_file_symbol`
  asserts `test_entries` is non-empty - the old fixtures carried `_test.go` entries; the new ones do not, so assert emptiness and that the published symbol count equals the entry count; `test_real_pdf_go_and_pdf_typescript_fqns_are_unique`
  keeps its intent), tests/indexing/test_publisher.py, tests/indexing/test_authored_examples_cells_rust.py, tests/infra/test_build_chunks_candidate_chains.py (jmap_rust), tests/infra/test_ingest_symbol_survival.py
  (jmap_rust). Per-pilot tests pin exact numbers: test_pdf_go_extraction.py (type counts, first types), test_cells_rust_extraction.py (type_count 221), test_jmap_rust_extraction.py, test_jmap_go_extraction.py,
  test_cells_go_extraction.py.
- >-
  Run the first check command, then the second (twice-identical results are required by the gate; the broad suite is slow under load - start it in the background and poll with bounded waits). Commit once
  with the subject `fix(extraction): re-extract the Go and Rust fixtures at their pinned commits with the corrected extractor and raised caps (G3/TC-535)` ending with the Co-Authored-By trailer for the
  model that did the work; UTF-8 without a byte-order mark; preserve each file's line endings (LF in git). In your report list: the fixture sizes before and after, the measured floors you pinned, every
  changed assertion of an existing test with its reason, the identifiers still on the allowlist that look like API, and the pilots you added to STALE_BAKED_PILOTS. Do NOT edit any src/ file, any furnished
  page, plans/, project/, ops/, evidence/ or schemas/, and do not run an ingestion, docker or a cluster command.
- >-
  ROUND-3 AMENDMENT (2026-10-17, supervisor; docs/ROUND3_REVIEW.md is the register). The jmap family was removed from the product: every jmap item, fixture, pin and pilot named elsewhere in this card is
  VOID and must be ignored (no jmap file exists any more). The card's scope is now the one in this paragraph, in addition to its original measured items that still apply to the 32 current pilots. SCOPE:
  Go and Rust extractors and fixtures. Rows RD3-025 to RD3-033. Go: symbols of a sub-package carry the package path and import path (pdf/go `ai`: 31 names), untyped package consts/vars are indexed (pdf/go
  26, cells/go 20), phantom functions of unexported receivers and struct-tag text as field types are removed (cells/go), promoted/embedded members are resolved (pdf/go 424). Rust: only items reachable through
  the crate's public re-exports are indexed (cells/rust 106 of 221 are not), trait-impl methods are not free functions, receivers (`&self`, `&mut self`, `self`) and generic bounds are rendered, data-carrying
  enum variants keep their payload types, type aliases are indexed, derive traits are not 'Bases'. Source truth wins over fixtures: new tests take their expectations from an independent oracle (upstream
  source parsed with the language's own tooling or hand-written upstream-shaped snippets), never only from the extractor's own output. Calibrate min_tests (it applies to EACH check) and author a real negative
  control before dispatch; the card was last written before Round 3 and its numbers are stale.
