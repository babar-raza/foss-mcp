id: TC-535
gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 and REQ-G3-008 (Round-3 rows RD3-025 to RD3-027 Go and RD3-030 to RD3-033 Rust; the earlier rows RST-02, RST-08, RST-11, ISOPROV-04, AGT-07 Go/Rust parts). GO AND RUST EXTRACTION FIDELITY FOR
  THE THREE PILOTS pdf/go, cells/go and cells/rust (the jmap family no longer exists, so every jmap item of the earlier text is void). The round-3 differential (own oracle: `go doc`/`go vet`/`go build`
  probes, rustc/cargo probes and the pilots' sources read directly) found: GO. (1) pdf/go: the `ai` sub-package (31 names: `NewChatCopilot`, `OpenAIClient`, `APIError`, ...) is served as if it were the
  root package with no import path, so `pdf.NewChatCopilot` -> `undefined`; every symbol must carry the import path of its package. (2) Untyped package constants and vars are not indexed (pdf/go 26, cells/go
  20: `PageFormatA4`, `FontHelvetica`, `ErrEncrypted`, `AlignCenter`, ...). (3) Phantom functions (`Close`, `ReadAt` of unexported types), struct-tag text served as the field type (`Cell.XMLName` and 4
  more), `RowCallback` has no signature, and 424 promoted/embedded members of pdf/go (20.6 percent) differ from upstream. RUST. (4) cells/rust: 106 of 221 symbols are not importable (private modules, trait-impl
  functions `eq`/`fmt`/`hash`), so `use aspose_cells_foss_rust::WorkbookModel` fails E0432 and the coverage line overstates the public surface: only symbols reachable through `pub use`/`pub mod` from the
  crate root are served. (5) Method receivers (`&self`, `&mut self`, `self`) and generic bounds are not rendered (0 of 1,430): an MCP-literal program fails E0596. (6) Data-carrying enum payloads are lost
  (`CellValue`, `CellsError`, `CellObjectValue`). (7) Type aliases are not indexed (`Style`, `WorksheetCollection`, ...) while signatures return them, and "Bases" lists derive traits. pdf/go is already
  at extractor_version 5; cells/go and cells/rust still come from the OLD extractor (no extractor_version), so they are re-extractions with the new fixes.
