closeout:
- >-
  The three Go/Rust fixtures are regenerated with the fixed extractor (extractor_version 5): Go sub-packages carry their import path and untyped constants are indexed, Rust serves only importable symbols
  with receivers, enum payloads and aliases, and the tests prove each from an independent oracle. Nothing a peer sees changes until the supervisor re-ingests.
recovery: Re-run from a clean tree.
