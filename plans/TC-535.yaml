id: TC-535
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-08, RST-11, RST-01 pdf/go part, AGT-07 Go and Rust parts). RE-EXTRACT THE FIVE GO AND RUST FIXTURES. Measured by the reviewers: pdf/go
  has 98 exported package-level functions upstream and indexes 16 (`Open`, `OpenWithPassword`, `OpenStream`, `NewDocument`, `NewDocumentFromFormat`, `NewTable` are misses), 29 of its 45 `Kind: function`
  chunks are methods that read as package functions, 28 receiver types (113 methods) have no chunk, 48 of 48 basic-type enums are served with an empty body so `HAlignCenter` cannot be found, and the coverage
  line counts methods as types (`261 of 2313 types` against about 259 exported types); cells/rust has all 1693 inherent public methods but 0 `self` markers (259 associated functions and 1434 methods look
  identical) and 6 noise chunks from derived trait impls (`eq`, `fmt`, `hash`, `default`); jmap/rust shows 9 JmapClient methods while 10 mail methods of `impl JmapClient` in client_mail.rs are receiver-less
  function chunks; jmap/go publishes 46 of 149 entries because 99 are functions that were never chunked (COVERAGE_EXCEPTIONS['jmap_go'] of tests/deploy/test_fleet_consistency.py documents the resulting
  '46 of 149 types' line). A prototype extraction on 2026-10-15 with the unmerged extractor at the pin and no cap found 433 pdf_go entries, 174 of them functions of which 98 have no receiver (so the 98
  exported package functions are all extracted before selection) and 259 non-function entries (the reviewer's 259 exported types). This card regenerates pdf_go, cells_go, jmap_go, cells_rust and jmap_rust
  at their pinned commits with the merged extractor (TC-520 selection, TC-525 Go fidelity, TC-526 Rust fidelity, TC-527 and TC-528 member documentation), raises pdf_go to 450 in the extractor call, the
  chart and docker-compose, regenerates the allowlist and pins the Go and Rust facts at fixture level. What it does NOT change: src/, any furnished page, infra/demo-manifests, sidecars, memory limits.
