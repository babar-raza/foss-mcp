purpose: 'Carries TC-264''s work forward: TC-264 used all 3 attempts, each one correctly stopping without
  committing for a genuinely different real reason (never an equivalent failure - attempt 1 found every Python
  type scoring zero centrality; attempt 2 found TC-265, claimed integrated, actually was not yet on main; attempt
  3, after TC-265 was genuinely integrated, confirmed the fix is real and non-degenerate for slides/python (max
  centrality score 115, 227 types tied at the cutoff) but found a newly-exposed regression). Regenerate
  tests/fixtures/slides_python/api_surface.json with the real, working centrality-ranked reduce_fixture() and fix
  the one real regression attempt 3 found and could not fix within its own write_paths.
