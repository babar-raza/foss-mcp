  to legitimately NOT survive the centrality cut: this library types almost everything against its own interfaces
  (IPresentation, IPresentationComponent, ISlideComponent, etc.) rather than the concrete Presentation class, so
  nothing else''s recorded bases/return_type/params textually references the bare word "Presentation" anywhere in
  the real 1023-type corpus - a real corpus property, not an extraction defect. Accept this; do not force
  Presentation into the kept set by any means.
  The real, newly-exposed regression: tests/e2e/test_slides_python_live_content.py hardcodes
  REAL_SYMBOL = "AutoShape" / REAL_SYMBOL_FQN = "aspose.slides_foss.AutoShape.AutoShape" as its live get_symbol
  anchor; AutoShape does not survive the centrality-ranked cut either (same interface-typing reason as
  Presentation), so the live container now returns a not-found response instead of real symbol text.'
