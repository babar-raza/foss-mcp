id: TC-747
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a fourteenth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism thirteen sibling cards already proved for thirteen other pilots this session
  (different pilots, zero file overlap - do not touch anything any of them touch). Confirmed
  needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates` already
  auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through `verify_dotnet_example`, the exact same
  pipeline `TC-736`/`TC-740`/`TC-741` already proved for `cells/net`/`email/net`/`words/net`,
  publishing only the ones that pass.

  `pdf/net` currently serves only 6 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/pdf__net__self_extracted` generation - note the plan's own
  Appendix C table says "3", which is now stale; re-confirm the real current count yourself
  before planning, do not trust either number blindly). Its real pinned repository is
  `aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET` (re-confirm the exact pinned commit yourself from
  `config/products/pdf/net.yaml`/`infra/helm/foss-mcp/values.yaml` - do not trust this card's own
  citation blindly). Per this project's own Appendix-C style accounting, this pilot's real
  upstream repository ships NO dedicated `examples/`-style sample directory (unlike several
  sibling .NET pilots this session) - CONFIRM this directly yourself rather than assuming, and if
  confirmed, author examples directly from the real public API surface (`tests/fixtures/pdf_net/
  api_surface.json`) instead, the same approach `TC-740`'s own `email/net` card and `TC-741`'s own
  `words/net` card already used for part of their own slate when upstream samples ran thin.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `pdf/net` from 6 to AT MOST 11 served examples, not to its own real
  floor (15-40, Appendix C - this is this session's largest remaining proportional gap of any
  pilot with real headroom); closing that fully needs the P4 program's own later, larger
  per-language-sample-adapter work, explicitly out of this card's scope. This card's job is the
  real, bounded, immediately shippable slice: up to 5 new, real, individually-verified authored
  examples, each passing the real ingestion verifier before being trusted to publish.
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/pdf_net/authored_examples.yaml
  - tests/indexing/test_authored_examples_pdf_net.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_net/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_cells_net.py` AND `tests/fixtures/furnished/email_net/
    authored_examples.yaml`/`tests/indexing/test_authored_examples_email_net.py` AND
    `tests/fixtures/furnished/words_net/authored_examples.yaml`/`tests/indexing/
    test_authored_examples_words_net.py` (three same-language sibling templates from this
    session; the latter two mixed sample-derived and API-derived examples for pilots with a small
    or absent real sample set - your likely template if pdf/net turns out to have no real
    `examples/` directory). Also read `src/foss_mcp/indexing/authored_examples.py` in full (every
    structural rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`,
    `code_sha256` must equal `normalised_code_sha256(code)`, `symbols` must be real FQNs,
    `library_commit` must be the real 40-hex pinned commit), `src/foss_mcp/indexing/
    example_verifier.py`'s `verify_dotnet_example`, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `pdf/net`'s real current served example count and real pinned
    repository/commit yourself. Fetch the real upstream repository tree at that exact commit and
    determine its real shape (samples directory, or API-surface/README-fences-only) before
    planning your examples.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: fetch the real pinned package, actually build
    and run each of your adapted programs, confirm each one's real output matches what you claim.
    Do not submit an example you have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns.
  - >-
    This card does NOT claim `pdf/net`'s example-corpus work is complete - it has the largest
    proportional floor gap of any pilot touched this session (15-40). If fewer than 5 real
    candidates verify cleanly, submit the real number you got and say so honestly.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for pdf/net via the existing
    authored_examples.yaml mechanism, raising its served example count toward 11.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_pdf_net.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/pdf_net/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-747/receipt.json
closeout:
  - >-
    pdf/net gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count toward 11 - real, bounded progress toward its own much larger (15-40) floor.
recovery: Re-run from a clean tree.
