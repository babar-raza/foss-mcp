id: TC-534
gate: G3
lane: extraction
purpose: >-
  REQ-G3-008 and REQ-G3-005 (independent pre-production review: RST-06, RST-01 cpp part, ISOPROV-06 internal headers, AGT-07 C++ part, RST-13 cells/cpp descriptions). RE-EXTRACT THE FIVE C++ FIXTURES. Measured
  by the reviewers on cells/cpp and pdf/cpp: constructors upstream/served 166/71 and 383/75 (96 of 165 and 104 of 217 classes lose all constructors; `Workbook` serves only `Workbook()`), parameters declared
  by reference or pointer upstream 351 and 673 but a `&` or `*` served on 0 and 4 lines, const methods 781 and 805 upstream and 0 marked, static methods 192 and 197 and 0 marked, 247 (13 percent) and 425
  (18 percent) methods missing; 100 of the 300 cells/cpp chunks were `Kind: function`, 93 of them file-static helpers from `.cpp` files with zero parameters served as public API; 0 of 300 cells/cpp chunks
  had a description because the headers document with `/// <summary>`; 50 of the 300 pdf/cpp chunks come from include/internal/. A prototype extraction on 2026-10-15 with the unmerged extractor at the pins
  kept 346 of 346 cells_cpp types (146 of them function entries, all 146 from `.cpp` files) and 361 of 361 pdf_cpp types (21 functions, 0 constructors flagged). This card regenerates cells_cpp, pdf_cpp,
  slides_cpp, jmap_cpp and email_cpp at their pinned commits with the merged extractor (TC-520 selection that ranks internal headers last, TC-524 C++ fidelity, TC-527 and TC-528 member documentation), gives
  the three capped pilots their whole surface (pdf_cpp 361, cells_cpp 346, slides_cpp 323) in the extractor call, the chart and docker-compose, regenerates the allowlist and pins the C++ facts at fixture
  level against the reviewer's upstream counts. What it does NOT change: src/, any furnished page, infra/demo-manifests, sidecars, memory limits (pdf/cpp already needed more than 4 Gi and now keeps more
  types: the supervisor re-measures).
