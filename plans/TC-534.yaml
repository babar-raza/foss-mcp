id: TC-534
gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 and REQ-G3-008 (Round-3 rows RD3-020 to RD3-023; the earlier rows RST-06, RST-01 C++ part, ISOPROV-06 internal headers, AGT-07 C++ part, RST-13 cells/cpp descriptions). C++ EXTRACTION FIDELITY
  FOR THE FOUR C++ PILOTS (cells, pdf, slides, email; the jmap family no longer exists, so every jmap item of the earlier text is void). The round-3 differential (own oracle: the pilots' headers read with
  clang or a hand count, and compile probes of the served signatures) found: (1) `static const` / `static constexpr` data members lose their qualifiers and are served writable (slides/cpp 286 `Color` constants,
  pdf/cpp 56, cells/cpp 14 missing); (2) public nested types are missing though public signatures reference them (pdf/cpp 14 to 21 such types, e.g. `PdfFileEditor::ContentsResizeParameters`, and collection
  iterators; slides/cpp 8 to 10); (3) implementation types are served as API (slides/cpp 55 `Internal::*` of which 28 are labelled public, cells/cpp 8 classes that exist only in `.cpp` files); (4) the review
  reached type level only, so member-level fidelity (constructors, operators, overload sets, default arguments, const/static/virtual qualifiers) is not yet gated. cells, pdf and slides fixtures are already
  at extractor_version 5 (cells 200 types, pdf 359, slides 355, all uncapped); the email fixture still comes from the OLD extractor (no extractor_version, 26 types), so email is a re-extraction with the
  new fixes. Verified faithful today and to be preserved: constructors, reference/pointer marks, const and static methods and the include-path handling that earlier cards fixed.
