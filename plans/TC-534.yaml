source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md rows RD3-020 to RD3-023 and section 3.3, then src/foss_mcp/extraction/tree_sitter_engine/api_surface.py (the C++ declaration walking: data members, nested types, namespaces,
  constructors, qualifiers), lang/cpp.py, chunk_builder.py (`_method_line` and the C++ signature rendering), the existing C++ tests named in write_paths, and the merged work of TC-532 and TC-533 (the same
  module serves Python and TypeScript: do not disturb those paths; all their tests must stay green). Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or
  pytest call; set PYTHONPATH=src. Never print an environment value. Verify every name against the merged code and list differences in your report. Run ruff format and ruff check on every Python file you
  change. Do not edit plans/, project/, ops/, evidence/, schemas/ or docs/; no docker or cluster command. Source truth wins over fixtures: every new test takes its expectation from an INDEPENDENT oracle
  (a hand-written C++ header whose answer follows from the language rules, a count made directly on the cloned headers, or the upstream facts quoted below), never from the extractor's own output.
- >-
  THE EXTRACTOR AND RENDERER WORK. Mandated names (the negative control and later cards rely on them): in api_surface.py the exact line `CPP_KEEP_STATIC_CONST_QUALIFIERS = True`, a real switch: when True
  a C++ data member declared `static const`, `static constexpr` or `const` is recorded with `static`/`const` in its modifiers and `writable` false, and it renders with those qualifiers; when False it is
  recorded as before this card (writable, no qualifiers). Beyond that: public nested classes/structs/enums/typedef-ed iterators declared inside a public class are extracted as types named `Outer::Inner`
  (also when only referenced by public signatures); a type declared in a namespace named `Internal`/`internal`/`detail` or under an `internal/` include directory, or declared only in a `.cpp` file, is not
  served as API (and an `_internal`-suffixed type is never labelled public); constructors, operators, overload sets and default arguments of the headers are all recorded (member-level fidelity). ACCEPTANCE:
  each item has a synthetic-source test in tests/extraction/tree_sitter_engine/test_cpp_surface_round3.py (at least 14 tests, hand-written headers: `struct Color { static const Color Red; static constexpr
  int N = 3; }` -> both read-only with their qualifiers; `class A { public: struct Params {}; }` yields `A::Params`; a class in `namespace Internal` is not served; `A(int x = 3)`, `operator==`, and two
  overloads of `f` all appear), and renderer tests in tests/indexing/test_chunk_builder_round3_cpp.py (at least 4). No currently faithful line changes: the existing C++ tests, the fidelity gate and every
  non-C++ extractor test stay green.
- >-
  THE RE-EXTRACTION (needs the network; clones over https, no token; a refused clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop).
  Regenerate THE FOUR C++ fixtures with the fixed extractor, one pilot per command, from the repository root: `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/cpp.yaml tests/fixtures/<family>_cpp/api_surface.json
  --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_cpp/pages/_index.md --max-types 100000` where <pin> is `ingestion.pilots[].library.commit` of infra/helm/foss-mcp/values.yaml for that
  pilot (never retype a commit) and <family> is each of: cells, pdf, slides, email. Each prints `wrote <path> (<bytes> bytes); <kept>/<total> types; commit <sha>`: kept must equal total and the commit must
  equal the pin. The CLI writes CRLF on Windows: normalise to LF so `git diff --stat` shows a content change. Every regenerated fixture must carry extractor_version 5, `symbol_counts`, `counts` and `parse_failures`.
  Record old and new type, function and member counts and byte sizes in the report (at registration: cells 200 types / 996,882 bytes, pdf 359 / 3,068,598, slides 355 / 1,918,453, email 26 / 94,821). infra/helm/foss-mcp/values.yaml
  and docker-compose.yml are NOT in write_paths: the chart caps are 300, 359, 355, 300; if a measured total exceeds a cap, report it (the supervisor edits the chart).
- >-
  INDEPENDENT FACTS to assert on the REGENERATED real fixtures (each was read from the upstream headers by the round-3 audit; verify each against the clone at the pin before you rely on it and report any
  that is wrong): slides/cpp: the `Color` class constants (about 286) are static, const and read-only; no type whose FQN contains `Internal::` is served (55 in the old fixture, 28 of them labelled public).
  pdf/cpp: `PdfFileEditor::ContentsResizeParameters` is served as a nested type; 56 static const members keep their qualifiers; nothing under include/internal/ is served as public API. cells/cpp: the 14
  static const members the audit found missing are present and read-only; the 8 classes that exist only in `.cpp` files are not served. email/cpp: the re-extraction carries extractor_version 5 and its 26
  (or more) types keep constructors and qualifiers. Count each of these directly on the cloned headers with a small script in the test or with grep-able rules, not from the extractor, and assert equality
  or the stated floor.
- >-
  RE-PINS AND TABLES (only after the re-extraction): run the first check and keep the failures. Change ONLY the assertions that pin a fact the regeneration legitimately moved (old type counts, a first-type
  or member list, internal types that are no longer served), each with the comment `TC-534: <old> -> <new>` and listed with its reason in the report; never delete, skip or xfail a test, never loosen a guard.
  tests/deploy/test_fleet_consistency.py: add STALE_BAKED_PILOTS entries (wording as TC-550/TC-532/TC-533: `re-extracted by TC-534: the fixture now holds ..., the baked generation still says ... until the
  supervisor re-ingests`) for exactly the pilots whose `coverage_problems` is non-empty after your regeneration, and UNRESOLVED_EXCEPTIONS from the regenerated `unresolved` lists (never higher than the
  old maximum). tests/fixtures/readme_identifier_allowlist.json only with the helper (`python -X utf8 -m tests.extraction.docs_identifiers --write`); read `git diff`: only keys of these four pilots may
  change, and list every identifier that remains and looks like an API symbol. If a test outside write_paths fails, stop and report its name and the pinned fact.
- >-
  TEST COUNTS: min_tests is 425 for EACH check. At the issue revision the first check collects 403 existing tests (the ten existing files it names) plus the at least 22 you add in the three new files; the
  second check collects well over 2,500.
- >-
  PRE-EMPTED OUT-OF-SCOPE PINS (supervisor, 2026-10-19, learned from TC-533, whose worker met eight failures outside its write_paths). A regeneration of your fixtures may legitimately move facts pinned
  by these files, now in your write_paths: tests/extraction/test_reextracted_uncapped.py (chart cap equality, SIZE_FLOOR_BYTES and MEMBER_FLOOR per pilot: re-measure only the pilots of this card, floor
  = measured value rounded down to a round number, comment <card>: <old> -> <new> with the reason), tests/extraction/test_run_extraction_coverage_policy.py, tests/deploy/test_served_coverage_matches_fixtures.py
  (MIN_FUNCTION_ENTRIES and similar non-vacuity floors: set just below the new measured total, still well above zero), tests/deploy/test_served_provenance.py and tests/mcp/tools/test_freshness_provenance.py
  (these compare the BAKED generation with the fixture; the baked data stays stale until the supervisor re-ingests, so for a pilot listed in STALE_BAKED_PILOTS of tests/deploy/test_fleet_consistency.py
  do not assert the fixture-dependent comparison, but keep everything that does not depend on the fixture; never skip, delete or xfail), README.md (only the per-pilot type/function figures that tests/deploy/test_readme_matches_release.py
  compares), and infra/helm/foss-mcp/values.yaml, docker-compose.yml and src/foss_mcp/extraction/run_extraction.py RECOMMENDED_MAX_TYPES ONLY if a measured total no longer equals the one cap number (single-line
  replacements; chart, compose and extractor must carry the same number). Run the wider offline suites (tests/indexing, tests/infra, tests/deploy, tests/mcp and the top-level tests/test_*.py, usual -k filter)
  before you report: ALL must be green, and report each file of this paragraph that you changed with its reason.
- >-
  Also in write_paths now: tests/infra/test_helm_chart.py (its local PILOTS table pins each pilot's maxTypes) and tests/infra/test_helm_pilots_match_compose.py: re-pin a pilot's maxTypes there only if you
  changed that pilot's cap in the chart, compose and RECOMMENDED_MAX_TYPES.
- >-
  FORMAT GATE (supervisor, learned from TC-533): the review runs `ruff format --check` WITHOUT --force-exclude on every file you changed, and the repo config excludes the tree_sitter_engine directory only
  for directory-wide runs. Before you commit, run `ruff format <each changed file, named explicitly>` and `ruff format --check` / `ruff check` on the same explicit list, including src/foss_mcp/extraction/tree_sitter_engine/api_surface.py
  and lang/*.py. If the formatter would rewrite large regions you did not touch, report it instead of committing.
- >-
  REWORK AMENDMENT (supervisor, 2026-10-19). tests/extraction/tree_sitter_engine/test_api_surface_other_languages.py is now in write_paths: its two C++ tests (test_cpp_class_with_single_public_base_has_base_in_bases_list
  and test_cpp_class_with_multiple_bases_and_mixed_access_specifiers_has_all_bases) write the sample to widget.cpp, which the card now rightly does not serve: change the file name to widget.h at those two
  lines with a TC-534 comment; the shapes under test do not change. Your other decisions are accepted: the lowered RECALL_FLOOR of slides (0.89 -> 0.78) and cells (0.87 -> 0.83) are accepted PROVISIONALLY
  because the README identifiers that no longer resolve are the 24 implementation types now listed in the allowlist (state this reason in the comment of each floor); friend operators stay unserved (recorded
  as a limitation, not part of this card). Rebase onto the new issue revision, re-run check 1 and check 2 once more plus tests/extraction, ruff format on the changed file named explicitly, report the head.
actions:
