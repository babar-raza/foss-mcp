negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='CPP_KEEP_STATIC_CONST_QUALIFIERS = True';assert s.count(old)==1;p.write_text(s.replace(old,'CPP_KEEP_STATIC_CONST_QUALIFIERS = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch by which a static const / constexpr C++ data member keeps its qualifiers and is read-only, so the 286 slides/cpp Color constants are served writable again (the RD3-020
    defect): the synthetic-header test and the regenerated-fixture tests (Color::Red must be static, const and read-only) fail at once.
evidence:
- evidence/build/G3/TC-534/receipt.json
closeout:
- >-
  The four C++ fixtures are regenerated with the fixed extractor (extractor_version 5): static const and constexpr members keep their qualifiers, public nested types are served, internal and .cpp-local
  types are not, member-level fidelity is gated, and the tests prove each from an independent oracle. Nothing a peer sees changes until the supervisor re-ingests.
recovery: Re-run from a clean tree.
