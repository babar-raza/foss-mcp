id: TC-217
gate: G2
lane: verification
purpose: 'Stop the sealed-candidate commit test from skipping. Gate exit on 2026-10-05 failed TC-119 with "5 skipped test(s); skips are not evidence".
  test_doc_source_commit_is_the_sealed_candidates_own_commit reads the real repository-presenter checkout from a path hard-coded to the H: drive, and skips
  when it is absent. On this host the checkout is at E:\Users\prora\OneDrive\Documents\GitHub\repository-presenter, and a verification run (a clean worktree,
  possibly a container) cannot rely on any local checkout. The five commits it compares against are plain data: each pilot''s candidates/<repo>/CURRENT file
  holds one sealed commit. This card commits those five values as fixtures and makes the test assert against them, so it always runs. Where the real checkout
  is present the test also compares the fixtures with it, which keeps the drift check without making the test depend on the machine.'
depends_on:
- TC-123
write_paths:
- tests/infra/test_generate_furnished_page.py
- tests/fixtures/furnished/sealed_current/**
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read tests/infra/test_generate_furnished_page.py in full, especially _REPOSITORY_PRESENTER_ROOT (around line 65) and
  test_doc_source_commit_is_the_sealed_candidates_own_commit, which is parametrised over pdf_net, pdf_java, pdf_go, slides_python and cells_rust.'
- 'Create five fixture files, one per pilot, named tests/fixtures/furnished/sealed_current/<pilot>.CURRENT, each holding exactly the sealed commit that the
  pilot''s current furnished page records as doc_source_commit, followed by one newline. Take each value from the committed furnished page
  tests/fixtures/furnished/<pilot>/pages/_index.md (its doc_source_commit field), and where the real repository-presenter checkout is present on this host
  (look for candidates/<repository with / replaced by __>/CURRENT under H:/Users/prora/OneDrive/Documents/GitHub/repository-presenter or
  E:/Users/prora/OneDrive/Documents/GitHub/repository-presenter) confirm the two agree, and report both. If they disagree, stop and report; do not choose.
  Add tests/fixtures/furnished/sealed_current/README.txt saying what these are and where they come from.'
- 'Change the test. It always asserts that each page''s doc_source_commit equals the vendored CURRENT value for that pilot (no skip, no xfail) and the existing
  assertion that doc_source_commit differs from the library commit for pdf_net and slides_python. If a real checkout directory exists (the environment
  variable FOSS_MCP_REPOSITORY_PRESENTER if set, otherwise the existing constant, otherwise the E: path above), it additionally asserts that the real CURRENT
  file equals the vendored value, and that branch is plain code, not a skip. Add one test proving the vendored file for every pilot exists and holds a 40-hex
  commit. The directory name sealed_current must appear in the test file, because the negative control edits it by text.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Read the test and the five furnished pages.
- Create the five fixtures and change the test.
- Run the check and report exact counts, and say whether the real checkout was found.
checks:
- command: '{python} -m pytest tests/infra/test_generate_furnished_page.py -q -rfE'
  expect: exit 0
  timeout_seconds: 300
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 30
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('tests/infra/test_generate_furnished_page.py');s=p.read_text(encoding='utf-8');p.write_text(s.replace('sealed_current','sealed_current_missing'),encoding='utf-8')"
  rationale: 'Points the test at a fixture directory that does not exist, so every pilot case of the sealed-commit test must fail instead of skipping. Every
    occurrence of the name in the test file is replaced. Built with plain text.'
evidence:
- evidence/build/G2/TC-217/receipt.json
closeout:
- The sealed-candidate commit test runs on every machine, and still compares with the real checkout where one exists.
recovery: Re-run from a clean tree.
