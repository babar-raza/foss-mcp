negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/indexing/example_candidates.py');s=p.read_text(encoding='utf-8');old='def import_like_lines(';assert old in s;p.write_text(s.replace(old,'def import_like_linesX(',1),encoding='utf-8')"
  rationale: >-
    Renames the import-unit recogniser that the chain, import-only and cache-key logic all call, so platform-mode extraction raises a
    NameError: the supply tests on the real pages and every build_chunks chain test fail, while legacy extraction is untouched. A real
    break of the card's central claim.
evidence:
- evidence/build/G3/TC-458/receipt.json
closeout:
- >-
  Each pilot's candidates are every same-language fence of its page (example blocks and the README Quick Start), de-duplicated by a
  normalised sha256; every published example is the program the toolchain compiled, with a Harness line when anything was added, and
  the cache is keyed on it; import-only blocks no longer count on C++, Java and Node.js. Expected minimum effect per pilot after the
  image rebuild and re-ingest (offline supply measurement on the committed pages; verdict numbers are the 2026-10-11 diagnosis, which
  this card does not re-measure) - no pilot loses a candidate that exercises the library; pdf/net, pdf/go, pdf/java and slides/python gain their README
  Quick Start as one or two new candidates (pdf/net is at 1 on the committed data, so this is its likeliest second example; .NET is
  build-only, so no input file is needed; unmeasured); the continuations of jmap/python, jmap/typescript, jmap/nodejs and pdf/python
  get their chain imports (jmap/python still reaches the network and needs TC-464's authored examples); deliberate honest decreases -
  pdf/cpp loses its import-only Installation block, 3d/java its kotlin block. slides/net, 3d/net, jmap/net, jmap/rust, email/cpp and
  jmap/cpp keep exactly the verdicts TC-450, TC-454 and TC-455 measured; only their published text changes to the assembled program.
  After re-ingest read each Job log's `candidate supply:` and `verified N/M` lines and check one published dotnet continuation (slides/net
  `Text and formatting`) shows the using directives and the Harness line.
recovery: Re-run from a clean tree.
