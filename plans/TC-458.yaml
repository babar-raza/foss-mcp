- command: '{python} -m pytest tests/indexing/test_example_candidates_supply.py tests/infra/test_build_chunks_candidate_chains.py tests/indexing/test_example_candidates.py tests/indexing/test_build_chunks_page_sandbox.py tests/indexing/test_build_chunks_verification_report.py tests/infra/test_build_chunks_degradation.py tests/indexing/test_build_chunks_env_failure.py tests/indexing/test_java_page_imports.py tests/infra/test_build_chunks_sanitize.py tests/infra/test_build_chunks_extraction_notice.py tests/infra/test_build_chunks_verification_cache.py tests/indexing/test_dotnet_verifier_assembly.py tests/indexing/test_go_verifier_assembly.py tests/indexing/test_rust_verifier_assembly.py tests/indexing/test_cpp_compat_and_page_includes.py tests/indexing/test_example_fixtures.py -q -rfE'
