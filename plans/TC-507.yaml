negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/sidecar_state.py');s=p.read_text(encoding='utf-8');old='SIDECAR_FETCH_FAILED = ' + chr(34) + 'fetch_failed' + chr(34);assert old in s;p.write_text(s.replace(old,'SIDECAR_FETCH_FAILED = ' + chr(34) + 'present' + chr(34),1),encoding='utf-8')"
  rationale: >-
    Makes the fetch_failed state equal to present, so a degraded sidecar is no longer distinguishable from a good one: the doctored-sidecar tests that
    assert state "fetch_failed", the distinct could-not-be-fetched reason and the unavailable releases error all fail. A real break of the card's
    central claim (a bad sidecar is a visible, distinct state).
evidence:
- evidence/build/G3/TC-507/receipt.json
closeout:
- >-
  A corrupt, truncated or foreign sidecar can no longer crash the server or be served as this product's, and a failed fetch is never reported as an
  absence. Supervisor, after acceptance: run the doctored-sidecar cases against a rebuilt container (pr_truncated, pr_wrong_platform, rr_dict,
  pr_other_pilot) and confirm the pod starts and the three tools answer as the tests say. The writer-side cards must emit the placeholder shape this
  card reads (top-level "state": "fetch_failed", optional "fetched_at" and "family") and write sidecars atomically.
recovery: Re-run from a clean tree.
