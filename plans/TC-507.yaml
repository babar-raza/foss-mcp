  test_an_empty_list_without_a_marker_is_present_and_empty; test_a_nonempty_list_with_a_marker_is_present_and_warns;
  test_an_absent_releases_sidecar_is_not_present_and_empty; test_serving_recent_releases_returns_the_releases_of_resolve;
  test_build_app_starts_for_every_doctored_combination (parametrised over four combinations of a corrupt product-reference sidecar, a corrupt
  releases sidecar, both, and a wrong-family pair, over a copy of the baked pdf/go scope: TestClient, /readyz is 200, search_symbols succeeds,
  get_product_reference install is a NotAvailable whose reason contains "could not be fetched", list_recent_changes is an unavailable error when
  the releases sidecar is bad); test_build_stdio_server_survives_a_corrupt_sidecar. At least 38 tests after parametrisation.
- >-
  NEW tests/infra/test_serve_sidecar_baked_identity.py (offline, data-driven, no copy): pilots from `ingestion.pilots` of infra/helm/foss-mcp/values.yaml
