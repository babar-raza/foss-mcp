  test_default_inputs_and_a_present_sidecar_are_unchanged (state "present", the same answers as before for a baked-style input);
  test_list_recent_changes_raises_sidecar_fetch_failed_error_on_the_failed_state; test_list_recent_changes_default_state_is_unchanged;
  test_an_empty_present_list_is_an_empty_list; test_sidecar_fetch_failed_error_is_not_a_value_error. At least 16 tests after parametrisation.
- >-
  NEW tests/mcp/test_sidecar_fetch_failed_server.py (offline; dispatch as tests/mcp/test_dispatch_offload.py `_call`):
  test_list_recent_changes_is_an_unavailable_error_when_the_releases_fetch_failed (is_error true, code "unavailable", the fixed message, a
