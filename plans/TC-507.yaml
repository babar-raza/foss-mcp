source_refs:
- file: docs/DECISION_LOG.md
  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  Read, in full: infra/serve_http.py (`_serving_product_reference_inputs`, `_serving_recent_releases`, `build_app`, the TC-506 readiness code now
  in it); infra/serve_stdio.py; infra/fetch_product_reference.py (`load_manifest_sidecar`, `_deserialize_document`, `sidecar_name`);
  infra/fetch_recent_releases.py (`load_recent_releases_sidecar`, `_fetch_failed_marker`, `_write_failure_marker`: the marker file is
  `<sidecar name>.failed` holding `<ExceptionClass> <UTC stamp>`); infra/verify_package_registry.py (`load_package_registry_sidecar`);
  src/foss_mcp/mcp/tools/get_product_reference.py (`ProductReferenceInputs`, `_document_section`, `get_product_reference`);
  src/foss_mcp/mcp/tools/list_recent_changes.py; src/foss_mcp/mcp/server.py (`TOOL_DESCRIPTIONS`, `create_server`, `_call_tool` and the
  TC-506 unavailable branch and `ToolErrorCode.UNAVAILABLE`). Read the reviewer's doctored cases to mirror them in tmp directories: scratchpad
  review/examples-productref-releases/doctored.py, doctored2.py, doctored3.py and the doctored/ folder (pr_empty_file, pr_truncated,
  pr_empty_object, pr_not_object, pr_unknown_doc_status, pr_wrong_platform, pr_other_pilot, rr_dict, rr_empty_file, rr_missing_keys, rr_null_body,
  pk_malformed, pk_empty_object, pk_verified_string) and generation-readiness-recovery/lib/scen.py (S10a to S13, S10g, S10h, S11e to S11g).
  Existing pins to keep green: tests/infra/test_serve_http.py (absent sidecar -> `_serving_product_reference_inputs` returns None; registry
  merge), tests/infra/test_helm_manifest_step.py line 426 (None for an identity with no sidecar), tests/infra/test_serve_manifest_sidecar.py
  (absent sidecar -> "no packaging manifest was provided"; absent releases -> `()`), tests/infra/test_serve_stdio_parity.py (the same wording
  over stdio), tests/mcp/tools/test_product_reference_truthful.py (the "is not present in this repository" and "has no data source" reasons for a
  present sidecar), tests/infra/test_fetch_recent_releases.py and tests/infra/test_verify_package_registry.py (the loaders raise). None of these
  is edited by this card; no existing test pins a serving-side crash. Never print or log any environment value.
- >-
  NEW src/foss_mcp/mcp/sidecar_state.py (small, no logic): constants `SIDECAR_PRESENT = "present"`, `SIDECAR_NOT_PRESENT = "not_present"`,
  `SIDECAR_FETCH_FAILED = "fetch_failed"` (each on its own line; the negative control edits the third), `FETCH_FAILED_REASON` = "the product
  reference could not be fetched during ingestion; retry later; this is not a statement that the repository lacks it",
  `RELEASES_FETCH_FAILED_MESSAGE` = "Release information could not be fetched during ingestion. Retry later; this is not a statement that the
  product has no releases." and `class SidecarFetchFailedError(RuntimeError)` (not a ValueError, so it is never classified invalid_argument).
  Every public name here must be used by production code (tests/test_unwired_modules.py).
- >-
  src/foss_mcp/mcp/tools/get_product_reference.py: add to `ProductReferenceInputs`, last and defaulted, `sidecar_state: str = SIDECAR_PRESENT` and
  `sidecar_fetched_at: str | None = None`. In `get_product_reference`, right after the unknown-section check: when
  `inputs.sidecar_state == SIDECAR_FETCH_FAILED` and the section is neither "formats" nor "limitations" (those two never depend on a sidecar),
  return `NotAvailable(section, FETCH_FAILED_REASON)` with ` (last attempt <fetched_at>)` appended when `sidecar_fetched_at` is known. Nothing
  else in this module changes: a present sidecar and the absent-sidecar default produce byte-identical answers to today. Update the module
  docstring sentence that says formats and limitations "have no data source" only if it becomes untrue (it does not).
- >-
  src/foss_mcp/mcp/tools/list_recent_changes.py: `list_recent_changes(releases, *, limit=10, state=SIDECAR_PRESENT)` raises
  `SidecarFetchFailedError(RELEASES_FETCH_FAILED_MESSAGE)` when `state == SIDECAR_FETCH_FAILED`, else returns exactly what it returns today (a
  list, so a good list and a truthfully empty list keep the existing shape). DECISION recorded here: the bare list is kept because three
  existing tests pin it (tests/infra/test_serve_stdio_parity.py `len(structured["result"])`, tests/mcp/test_server_wiring.py text equals
  structuredContent["result"], tests/mcp/test_dispatch_offload.py exact structuredContent equality) and an agent reads the text channel, where a
  sibling field would be invisible; therefore the only state an agent must be told about is the failed one, and it is told by an error, never by
  an empty list. "none_exist" is simply `[]` from a sidecar that loaded.
- >-
  infra/serve_http.py. (a) Constants: `_SIDECAR_MAX_BYTES = 8 * 1024 * 1024` (the largest baked sidecar is about 80 KB). (b) Helpers, all
  private, none raising: `_failure_marker(path)` -> (exists: bool, stamp: str | None) for `path.with_name(path.name + ".failed")`, the stamp being
  the last whitespace-separated token when it looks like an ISO timestamp; `_read_sidecar_json(path)` -> (state, data) where an absent file gives
  `SIDECAR_NOT_PRESENT` and a file over `_SIDECAR_MAX_BYTES`, non-UTF-8 bytes, invalid JSON or an OS error gives `SIDECAR_FETCH_FAILED` with a fixed
  problem phrase or the exception class name; `_family_in_repository(family, repository)` -> True when the lowercased family appears in the
  repository slug with every character outside a-z and 0-9 removed (all 40 baked pilots satisfy this: the family word is part of the upstream
  repository name; tests/infra/test_serve_sidecar_baked_identity.py proves it). (c) `_serving_product_reference_inputs(manifests_dir, config)` keeps
  its signature and returns: None when the file is absent AND no failure marker exists (unchanged); otherwise a `ProductReferenceInputs` with
  `sidecar_state` set per this table. fetch_failed (built as `ProductReferenceInputs(platform=<deployment platform>,
  sidecar_state=SIDECAR_FETCH_FAILED, sidecar_fetched_at=<marker stamp or the file's own fetched_at or None>)`) for: file absent but marker present; any
  `_read_sidecar_json` failure; JSON that is not an object; the loader `load_manifest_sidecar` raising anything; a top-level key
  "state" equal to "fetch_failed" (this is the failure placeholder the writer-side card is told to emit); `sidecar.platform` different from the
  deployment platform; a top-level "family" key different from the deployment family; a recorded `source_repository` whose slug does not contain
  the deployment family. State present otherwise, carrying the optional top-level string "fetched_at" through. A failure marker next to a valid
  sidecar does NOT degrade it (the writer keeps good data on a failed refresh): log one WARNING "refresh failed, serving the last good sidecar".
  Every fetch_failed outcome logs exactly ONE WARNING through `LOG` (message "sidecar unusable, degraded to fetch_failed") with `extra={"sidecar":
  "product_reference", "problem": <fixed phrase or exception class name>, "file": <file name only>, "family", "platform"}`. The raise on a platform
  mismatch is removed. The registry-verification merge: a missing file is as before; a corrupt or wrong-shaped file, or `verified` that is not a bool,
  or `coordinate`/`checked_at` that are not strings, is ignored with ONE WARNING (sidecar "package_registry") and the manifest answers stay as if
  never verified; it never changes the product-reference state. (d) New `_resolve_recent_releases(manifests_dir, config, *, source_repository=None)`
  -> (tuple[Release, ...], state): absent file with no marker -> ((), SIDECAR_NOT_PRESENT); read/size/JSON failure, not a list, any entry that
  is not an object with a str tag_name, a str body and a richness in {"detailed", "templated", "none"}, the loader raising, an optional str url or
  published_at of the wrong type, a release url whose repository slug (the two path segments after github.com) does not contain the deployment
  family or, when `source_repository` is given, differs from it case-insensitively -> ((), SIDECAR_FETCH_FAILED) with the same WARNING; an empty list WITH
  a failure marker -> ((), SIDECAR_FETCH_FAILED) (the placeholder the releases writer leaves); a non-empty list with a marker -> present plus the "refresh
  failed" WARNING; otherwise (releases, SIDECAR_PRESENT). `_serving_recent_releases` keeps its signature and returns `_resolve_recent_releases(...)[0]`.
  (e) `build_app` resolves the product reference once, passes its `source_repository` to `_resolve_recent_releases`, hands the state to
  `create_server(..., recent_releases_state=...)`, and never raises for any sidecar content. Update the docstrings that say a malformed sidecar
  raises.
- >-
  infra/serve_stdio.py `build_stdio_server`: call the same resolve helpers as `build_app` (product reference first, then `_resolve_recent_releases`
  with its source repository) and pass `recent_releases_state` to `create_server`, so stdio and HTTP degrade identically. No other change.
- >-
  src/foss_mcp/mcp/server.py. `create_server(..., recent_releases_state: str = SIDECAR_PRESENT)`; `_wrap_list_recent_changes(releases, state)` forwards
  it to `list_recent_changes`. In `_call_tool` handle `SidecarFetchFailedError` in its own `except` branch placed before the generic
  `except Exception` and next to the TC-506 unavailable branch (reuse its helper if the code is the same): ONE WARNING log, outcome "error",
  usage event as the other error branches, and `CallToolResult(is_error=True, content=[TextContent(RELEASES_FETCH_FAILED_MESSAGE)],
  structured_content={"code": "unavailable", "message": RELEASES_FETCH_FAILED_MESSAGE, "correlation_id": ...})`. Descriptions in `TOOL_DESCRIPTIONS`:
  in "get_product_reference" delete the sentence "Treat NotAvailable as authoritative absence, never a transient failure - do not retry expecting
  different content." and the claim that formats and limitations are "currently NotAvailable for every product" as a dead end; say instead, in
  plain sentences: formats and limitations have no structured source in this index for any product, so use lookup or search_docs (for example
  query='limitations') to read them from the product documentation; contributing and agent_guidance are NotAvailable with a reason ending in
  "is not present in this repository" only when the source repository genuinely lacks that file; a NotAvailable whose reason says the data could not
  be fetched is transient, retry later and do not read it as evidence of absence. In "list_recent_changes" add: an empty list means the product has no
  GitHub releases; when the release data could not be fetched the call returns an error saying so, retry later, never an empty list. Keep every
  description distinct and longer than 80 characters. Do NOT put a single-quoted token that has an uppercase first letter or contains a dot inside
  a description (tests/mcp/test_tool_surface_truthful.py checks such tokens against the pdf/net type names); lower-case quoted words such as
  'limitations' are fine. Do not touch `SERVER_INSTRUCTIONS`, any other description, or the find_examples description (another card).
