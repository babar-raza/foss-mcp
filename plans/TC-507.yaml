id: TC-507
gate: G3
lane: storage-retrieval
purpose: >-
  REQ-G3-008 (independent pre-production review, findings D-02, D-03, D-04, GRR-03, GRR-13 and the wording part of AGT-02). The serving
  entrypoint treats every optional sidecar as all-or-nothing. Measured by the reviewer on the shipped image (examples-productref-releases
  doctored cases, generation-readiness-recovery S10a to S13): 11 doctored product-reference or releases sidecars (empty file, truncated JSON,
  `{}`, a JSON list where an object is expected, an unknown document status, a wrong `platform`, a null release body) make the container exit 1
  at start, so the pod goes CrashLoopBackOff although the generation is perfect (`infra/serve_http.py` `_serving_product_reference_inputs` and
  `_serving_recent_releases` raise by design); the writers use plain write_text so a crash mid-write produces exactly such a file. A sidecar
  that belongs to another product is served as this product's: only `platform` is compared, so the cells/go sidecar under the pdf/go name (same
  platform) is answered as pdf/go (S10g, S10h), and the releases sidecar carries no identity at all (S11g). Worse, a missing or placeholder
  sidecar is served as AUTHORITATIVE ABSENCE: with the sidecar gone, pdf/go answers "agent_guidance is not present in this repository" and
  "no packaging manifest was provided", an empty releases list is indistinguishable from a truthful empty list, the `.failed` markers the
  writers leave are never read, and the get_product_reference tool description tells agents "Treat NotAvailable as authoritative absence, never
  a transient failure". Formats and limitations have no structured source for any pilot, but the same description sends agents away from them
  while lookup answers the README "Scope and Limitations" section. This card changes the SERVING side only: (1) every sidecar problem
  (unreadable, corrupt, truncated, over 8 MiB, wrong shape, wrong type, identity mismatch, a failure placeholder, a failure marker with no data)
  is caught, logged at WARNING with the sidecar kind and a fixed phrase or exception class name (never file content or an exception message),
  and degrades that ONE sidecar to the state fetch_failed; the server starts and everything else is served; (2) get_product_reference answers
  every sidecar-derived section of a fetch_failed product with a distinct NotAvailable reason ("could not be fetched; retry later; this is not
  a statement that the repository lacks it") and never "is not present in this repository"; (3) list_recent_changes keeps its bare list for a
  good or truthfully empty sidecar and answers an unavailable error (not an empty list) when the releases fetch failed; (4) a sidecar must
  match this deployment's family (when the file records one, and by the repository slug otherwise) and platform and, across the two sidecars,
  the source repository, else it is fetch_failed; (5) the tool descriptions say what is true. What does NOT change: the loader functions in
  infra/fetch_*.py and infra/verify_package_registry.py (they still raise, their own tests stay green, and the writer-side fixes, atomic
  writes, failure placeholders and the init gate are other cards), every answer for a good sidecar, the answer for an absent sidecar
  (unchanged and pinned by three existing tests), and the NotAvailable reason of formats and limitations (pinned by existing tests).
