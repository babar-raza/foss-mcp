id: TC-564
gate: G3
lane: transport-deployment
purpose: >-
  REQ-G3-009 (rows RD3-120 to RD3-126). SERVING ROBUSTNESS, OBSERVABILITY AND SHIPPED RECOVERY TOOLING. (1) An ABSENT sidecar makes list_recent_changes answer `[]` with the note 'An empty list is a complete
  answer, not a fetch failure' (pdf/go really has 12 releases), /readyz stays 200 with no warning, nothing is logged, and a sidecar added later is ignored until restart (sidecars are read once in infra/serve_http.py
  build_app). (2) infra/rollback.py is in no shipped image although docs/DEPLOYMENT.md says it is, so the documented recovery cannot run; rollback validates shape only (accepts a 1-chunk, 0-symbol, 60%-regressed,
  different-repository or different-commit target; no post-flip readiness probe or revert), does not roll sidecars back, crashes on `--list` with a corrupt generation file, and fenced publishers leave orphan
  generation files. (3) A corrupt pointer or generation makes list_recent_changes and report_index_freshness return invalid_argument/internal with raw exception text; a vanished pointer gives a non-error
  found:false. (4) Default /metrics is two counters (Prometheus only on request), serverInfo.version is 0.1.0+unknown, call logs lack generation id and source commit, success responses carry no correlation
  id, transport rejections are logged without a reason, ClientDisconnect is logged as an ERROR with a traceback and no ids. (5) 200 abandoned sessions lock out new clients (503) until the 5-minute sweep,
  sessions are lost on restart, stalled connections have no read timeout, Host is not validated, a request with an invalid id gets an empty 202, transport rejections use a different error envelope. (6)
  /data/manifests is owned by the server user, so sidecars can be deleted when a peer runs without --read-only. FIX each item; keep every verified-good behaviour (readiness reasons, sanitised errors, correlation
  ids on errors, fencing tokens). FINALISED for dispatch on 2026-10-19 by the supervisor (min_tests calibrated per check, negative control authored, write_paths checked).
