source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE (each asserted by a test that starts the real server in-process or the real CLI on a temp copy of baked data): (a) boot without a sidecar logs a WARNING naming the file, `/readyz` carries a
  `warnings` entry, a metric counts sidecar states, and list_recent_changes returns a typed `unavailable` error or an explicit 'not loaded' note, never the 'complete answer' note; a sidecar that appears
  later is picked up on the next request (mtime check) or the server states it needs a restart; (b) both Dockerfiles copy infra/rollback.py and a build-time test proves `python /app/infra/rollback.py --list`
  runs; rollback applies the publish floors, the repository-identity check and the regression limit unless `--force` is given, runs the readiness probe after the flip and reverts on failure, `--list` skips
  and names a corrupt file, sidecar identity is re-checked and the install notice uses the active generation's commit; (c) corrupt storage gives the sanitised `unavailable` code on every tool including
  list_recent_changes and report_index_freshness, and a vanished pointer is an error not a miss; (d) /metrics is Prometheus text by default (the JSON form stays under an explicit format), serverInfo.version
  and build_revision come from the image label or an env var set at build, call log lines carry generation id and source commit, success responses carry a correlation id field, rejections are logged with
  their reason, ClientDisconnect is a DEBUG line; (e) the oldest idle session is evicted when the cap is reached, a stalled header read times out, Host is validated against an allow-list defaulting to loopback
  and the container name, invalid ids get a JSON-RPC error, rejection bodies share one envelope; (f) /data/manifests and its contents are root-owned and read-only to the server user. INDEPENDENT ORACLE:
  raw HTTP and JSON-RPC bytes in the tests, plus the R3/R4 reproductions rewritten as tests (cancel, cap, restart, 21 corruption cases, sidecar matrix).
- >-
  REVERSE W6/W4 notes: record in the report which environment-sensitive tests this card needs (the real-Rust builds stay deselected only in checks that do not touch them).
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated name: in src/foss_mcp/mcp/sidecar_state.py the exact line `SIDECAR_STATE_WARNINGS = True`, a real switch: when False the server behaves exactly
  as before this card (silent, 'complete answer' note). (2) Accepted before you start: TC-560 (drift fields in report_index_freshness and list_recent_changes: build on them, keep their new fields), TC-562
  and TC-563 (server.py tool schema text and response_budget.py). Read the merged code of those cards before editing server.py, list_recent_changes.py and report_index_freshness.py. (3) tests/test_container_build.py
  holds 10 existing tests; its docker-build test is gated by the environment and you do NOT run docker: add the rollback-copy assertions as static Dockerfile content tests (both Dockerfiles COPY infra/rollback.py,
  and the file is not excluded by .dockerignore) which run without docker. (4) min_tests is 30 for EACH check: the first check collects the 10 existing tests plus at least 20 you add; the second check (tests/mcp,
  tests/infra, runbook) collects 5,122 or more. (5) The real Rust builds stay deselected as written; the tests you add are offline and start the server in-process (httpx/starlette test client or a loopback
  uvicorn on an ephemeral port that the test shuts down).
- "REWORK AMENDMENT (supervisor, 2026-10-19). The first delivery (commits 94fe198b, 18c8ff36) is accepted in substance; the tests listed in your report that pin a behaviour the card MANDATES (Prometheus\
  \ /metrics by default, JSON-RPC rejection body, Host validation, unavailable for an absent releases sidecar, correlation id in _meta, rollback refusing a 1-chunk or 0-symbol target without --force, the\
  \ exact uvicorn kwargs, root-owned read-only /data/manifests) are now in write_paths. Update ONLY the pinned fact in each, with the comment TC-564: <old> -> <new> and the reason in the report; never delete,\
  \ skip or loosen. Specifics: (a) tests that call /metrics expecting JSON add ?format=json where they test the legacy numbers (and keep a test that the default is Prometheus text); (b) rejection-body tests\
  \ assert the new JSON-RPC error shape and keep the status code; (c) the tests that send Host: evil.example to prove something else send a loopback Host and a separate test keeps proving the 421; (d) list_recent_changes\
  \ with an absent sidecar is unavailable in the server-wrapper tests (the stdio-parity and tool-hardening tests assert the new honest answer); the boot WARNING lines are filtered or counted in test_a_suppressed_unsafe_message_warning_log_line...\
  \ (assert that the line with the correlation id exists, not that it is the only warning); (e) test_a_failing_metrics_registry_never_changes_the_tool_result compares results without the per-call _meta.correlation_id;\
  \ (f) the three rollback tests that roll back to a single-chunk generation pass --force (they test the mechanics, not the floors; the floors have their own tests in your new file); (g) test_serve_startup_errors\
  \ pins the uvicorn kwargs: add the http kwarg to the expectation; (h) tests/deploy/test_demo_compose.py: the two tests that forbid chown/USER in the demo stage are replaced by their inverse (baked data\
  \ is root-owned and read-only to the serving user; the entrypoint still runs as the unprivileged user) with the reason; (i) the docker-only e2e container-session tests assert the old rejection body \b\
  ody['error']=='rejected': update them to the JSON-RPC shape (you cannot run them; keep the edit minimal and mechanical, and list them in the report as NOT RUN); (j) run the wider suites (tests/mcp, tests/infra,\
  \ tests/deploy, top-level tests/test_*.py, usual -k filter) and report that ALL are green. The five real-docker-build tests of tests/test_container_build.py stay environment-gated and are run by the supervisor\
  \ at the closing build. Rebase your two commits onto the new issue revision."
actions:
- >-
  Fix sidecar state reporting, ship and harden rollback, classify storage errors, complete observability, session and transport hardening, ownership.
checks:
- command: >-
    {python} -m pytest tests/infra/test_round3_serving_robustness.py tests/infra/test_round3_rollback_hardening.py tests/mcp/test_round3_error_classification.py tests/test_container_build.py -q -rfE -p
    no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp tests/infra tests/deploy/test_runbook.py -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native and not test_prepare_rust_library and not test_rust_known"
  expect: exit 0
  timeout_seconds: 3000
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 30
network: true
requires:
- python
- git
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/sidecar_state.py');s=p.read_text(encoding='utf-8');old='SIDECAR_STATE_WARNINGS = True';assert s.count(old)==1;p.write_text(s.replace(old,'SIDECAR_STATE_WARNINGS = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated switch by which an absent or unreadable sidecar is reported (a WARNING log line, a readyz warnings entry, a sidecar-state metric and an explicit 'not loaded' answer from list_recent_changes).
    With it off the server again answers 'An empty list is a complete answer' for a missing sidecar and the new boot-without-sidecar tests fail at once. A real break of the card's claim that a missing sidecar
    is reported honestly.
evidence:
- evidence/build/G3/TC-564/receipt.json
closeout:
- >-
  A missing sidecar is reported honestly, the shipped images contain the rollback tool and it validates what it flips, storage faults are classified and sanitised, observability identifies pilot, generation,
  commit and request, and the session and transport edge cases are closed.
recovery: Re-run from a clean tree.
