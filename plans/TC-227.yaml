id: TC-227
gate: G2
lane: transport-deployment
purpose: 'Grow the POC from fourteen pilots to twenty by adding the six remaining self-extracted fixtures the operator asked for on
  2026-10-07: cells/net, cells/python, jmap/python, pdf/python, slides/cpp, slides/net. Each already has a fixture with its api surface in
  tests/fixtures, and a survey of its repository at the pinned commit (2026-10-07) found its real packaging manifest: cells/net
  src/Aspose.Cells_FOSS/Aspose.Cells_FOSS.csproj; cells/python, jmap/python and pdf/python pyproject.toml; slides/cpp CMakeLists.txt at the
  repository root; slides/net src/Aspose.Slides.Foss/Aspose.Slides.Foss.csproj. Each is self-extracted: no furnished page, no compile step,
  configuration only. The work mirrors TC-205 (chart and compose entries), TC-207/208 (manifest paths and library blocks) and TC-209
  (ingestion image fixtures) combined for these six. This card was first authored as TC-226, which collided with an already-accepted
  card of that id; this is the same content re-issued under a free id (see docs/DECISION_LOG.md, 2026-10-07).'
depends_on:
- TC-221
- TC-205
- TC-222
- TC-208
- TC-214
write_paths:
- infra/helm/foss-mcp/values.yaml
- docker-compose.yml
- Dockerfile.ingestion
- tests/infra/test_helm_pilots_match_compose.py
- tests/infra/test_helm_chart.py
- tests/infra/test_docker_compose_multi_instance.py
- tests/infra/test_ingestion_image_fixtures.py
- tests/infra/test_helm_manifest_step.py
satisfies:
- REQ-G2-043
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '### 7.1 Snapshot/generation model — an immutable release manifest with
    one CAS pointer, not a bare alias flip (fixes §1.1-1.3, hardened per Round 5 review)'
  sha256: 9d1e374c401d9d882328b6ff6cf57028f9d0a3ce410ae68a6d04d9d9db3175b9
inputs:
- 'Read infra/helm/foss-mcp/values.yaml under ingestion.pilots in full (fourteen entries today), docker-compose.yml''s ingest and serving
  services for an existing self-extracted pilot such as cells/go or cells/typescript, and Dockerfile.ingestion''s pilot COPY lines (around
  line 160 onward). Read each of the six fixtures: tests/fixtures/cells_net/api_surface.json, cells_python/api_surface.json,
  jmap_python/api_surface.json, pdf_python/api_surface.json, slides_cpp/api_surface.json, slides_net/api_surface.json, for
  source_repository and source_commit. Copy those values exactly; do not invent one.'
- 'Add six pilot entries to ingestion.pilots in values.yaml, one per family/platform below, each with family, platform, sourceKind
  self_extracted, heldBy ingestion-<family>-<platform>, apiSurface /app/fixtures/<family>_<platform>/api_surface.json, title
  "<family>/<platform> API surface", maxTypes 20, manifestPath, and a library block with repository, commit and platform (no furnishedPage,
  matching the pattern of the existing self-extracted pilots). The platform values and manifest paths are: cells/net platform dotnet,
  manifestPath src/Aspose.Cells_FOSS/Aspose.Cells_FOSS.csproj; cells/python platform python, manifestPath pyproject.toml; jmap/python
  platform python, manifestPath pyproject.toml; pdf/python platform python, manifestPath pyproject.toml; slides/cpp platform cpp,
  manifestPath CMakeLists.txt; slides/net platform dotnet, manifestPath src/Aspose.Slides.Foss/Aspose.Slides.Foss.csproj.'
- 'Add one ingest service and one serving service per new pilot to docker-compose.yml, copied from the pattern of an existing
  self-extracted pilot''s services (no --library-* build flags, no --furnished-page flag, matching the comment already there from TC-205).'
- 'Add six COPY lines to Dockerfile.ingestion, one per new pilot, in the same form as the existing self-extracted pilot lines added by
  TC-209: COPY tests/fixtures/<family>_<platform>/api_surface.json ./fixtures/<family>_<platform>/api_surface.json. Change nothing else in
  the file.'
- 'Restate every fixed pilot count from fourteen to twenty, keeping each test''s name and what it checks, and rename any constant or test
  whose own name says "fourteen" to say "twenty" (for example FOURTEEN_PILOTS and test_chart_has_fourteen_pilots): (1)
  tests/infra/test_helm_chart.py, the assertion len(jobs) == len(pilots) == 14 and any job-name list near it; (2)
  tests/infra/test_helm_pilots_match_compose.py, the pilot dictionary and its length assertions; (3)
  tests/infra/test_docker_compose_multi_instance.py, the service-count and host-port assertions; (4)
  tests/infra/test_ingestion_image_fixtures.py, the pilot-count test; (5) tests/infra/test_helm_manifest_step.py, the pilot-with-a-manifest-
  path count around line 174. Record every restatement in the commit body. Do not weaken any assertion.'
- 'Write commit messages as UTF-8 without a byte-order mark.'
actions:
- Read the values file, the compose services, the Dockerfile, each new fixture, and the five test files in full.
- Add the six pilot entries, compose services and Dockerfile COPY lines, and restate the five fixed counts.
- Run the chart, compose and manifest tests, and helm lint and template, and report exact counts.
checks:
- command: '{python} -m pytest tests/infra/test_helm_pilots_match_compose.py tests/infra/test_helm_chart.py tests/infra/test_docker_compose_multi_instance.py tests/infra/test_ingestion_image_fixtures.py tests/infra/test_helm_manifest_step.py tests/infra/test_container_pins.py -q -rfE'
  expect: exit 0
  timeout_seconds: 600
  junitxml: true
  proves:
  - REQ-G2-043
min_tests: 60
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('infra/helm/foss-mcp/values.yaml');s=p.read_text(encoding='utf-8');p.write_text(s.replace('manifestPath: CMakeLists.txt','manifestPath: CMakeLists_off.txt',1),encoding='utf-8')"
  rationale: 'Renames the slides/cpp manifest path. Only one pilot entry in values.yaml uses the bare manifestPath CMakeLists.txt once this card lands
    (pdf/cpp uses the same value too, so the replace is limited to the first match, which is whichever entry appears first in the file; either
    one breaks the manifest-step rendered-path test, which compares every pilot''s manifestPath against the rendered fetch step). Built with
    plain text, since it has no quote or backslash.'
evidence:
- evidence/build/G2/TC-227/receipt.json
closeout:
- The chart and compose carry twenty pilots, each matching its fixture, and each ingests its own packaging manifest.
recovery: Re-run from a clean tree.
