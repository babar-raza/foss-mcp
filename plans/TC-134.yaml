id: TC-134
gate: G2
lane: storage-retrieval
purpose: 'Fix real ruff-format debt the repo''s own pre-push hook found and correctly
  blocked a push over, again: 4 files touched across TC-127/129/130/133''s own worker
  commits are not ruff-format clean. Same recurring class of defect TC-108/TC-123
  already fixed twice - whole-repo format debt accumulating silently across many individually-clean
  commits, this time surfaced specifically because tests/e2e/**/test_*_container_session.py
  (out of scope for this card, see TC-135) only ever gets exercised by the real pre-push
  hook, never by a fast local sanity pass.'
depends_on:
- TC-019a
- TC-060
- TC-079
- TC-125
- TC-126
- TC-127
- TC-129
- TC-130
- TC-131
- TC-132
- TC-133
