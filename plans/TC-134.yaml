- tests/infra/test_ingest.py
- tests/mcp/test_server_wiring.py
- tests/test_repo_hygiene.py
- tests/test_unwired_modules.py
satisfies:
- REQ-G2-047
source_refs:
- file: C:\Users\prora\.claude\plans\mission-plan-and-stateful-sprout.md
  anchor: '## 22. Verification obligations mapped to gates (extends §10''s and §18''s
    acceptance tests with the items §8 of the Round-6 review specifically required)'
  sha256: b417ef557a656b43c9fec9afeb5cbb1d856e9db8f3056ec331c464c5e0ab0d23
inputs:
- Run `.venv\Scripts\python.exe -m ruff format --diff` scoped to exactly these 4 files
  first to see the real, current formatting debt before changing anything.
- Apply `.venv\Scripts\python.exe -m ruff format` to exactly these 4 files - pure
  formatting, zero logic/behavior change.
- After formatting, run each file's own real test suite (or the broader `--ignore=tests/e2e
  --ignore=tests/infra` sanity pass covering 3 of the 4) to confirm zero behavior
  change.
- Do not touch any file outside this exact list of 4.
actions:
- Apply ruff format to exactly the 4 named files.
- Confirm `ruff format --check` on those 4 files now passes clean.
- Confirm each file's own tests still pass unchanged.
checks:
- command: '{python} -m ruff format --check tests/infra/test_ingest.py tests/mcp/test_server_wiring.py
    tests/test_repo_hygiene.py tests/test_unwired_modules.py && {python} -m pytest
    tests/test_repo_hygiene.py -q'
  expect: exit 0
  timeout_seconds: 120
  junitxml: true
  proves:
  - REQ-G2-047
min_tests: 7
network: false
negative_control:
  mutate: python -X utf8 -c "import pathlib;p=pathlib.Path('tests/test_repo_hygiene.py');s=p.read_text(encoding='utf-8');s=s.replace('assert
    \"MIT License\" in text','assert \"MIT License\" not in text');p.write_text(s,encoding='utf-8')"
  rationale: Flipping 'assert "MIT License" in text' to 'assert "MIT License" not
    in text' makes the real test genuinely fail against the real, correct LICENSE
    content, failing the check's pytest half - proving the check genuinely exercises
    this file's real content, not merely its formatting. (A prior version of this
    mutate renamed the test function instead, which does not actually flip pytest's
    outcome - a renamed test function is still collected and still passes - caught
    and fixed before dispatch.) Self-checked end-to-end before being persisted.
evidence:
- evidence/build/G2/TC-134/receipt.json
closeout:
- All 4 files are ruff-format clean.
- Each file's own tests show zero behavior change.
- scripts/ci_check.sh's own format step passes, unblocking the push.
- Renaming the hygiene test fails the check again.
recovery: Re-run from a clean tree; the card is idempotent from committed content.
