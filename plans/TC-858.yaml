    '
  rationale: Corrupts row RD2-086's Status cell to a value that is not any real disposition, which must make the permanent test_every_row_status_is_a_real_disposition_value check fail - a pure data mutation, immune to the lockstep-rename vacuousness class, and it never touches any code path.
