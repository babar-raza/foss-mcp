inputs:
- 'READ FIRST: `docs/ROUND2_REVIEW.md` (find your rows by id; the register has 286 rows, Status is the last column), `tests/deploy/test_round2_ledger.py` (the permanent enum check `test_every_row_status_is_a_real_disposition_value`: your dispositions must be exactly one of OPEN / FIXED / DISCLOSED / NOT_REPRODUCED / DEFINITIONAL / ACCEPTED(P3) / BLOCKED_UPSTREAM), `docs/RELEASE.md` section 8 for the limitation-entry format, `docs/DECISION_LOG.md` (last 6 sections), and `plans/TC-782.yaml` / `plans/TC-780.yaml` (the precedent closure passes: same method, same honesty rules).'
- 'For EACH row listed in this card: re-verify the finding''s CURRENT status yourself, live, against the real committed 32-pilot corpus (`infra/demo-manifests`, now regenerated at 4096-dim) by calling the real tool functions in-process (`search_symbols`, `get_symbol`, `list_members`, `find_examples`, `search_docs`, `lookup`, `get_product_reference`, `report_index_freshness`) with the row''s own repro from `docs/round2/issues.json` as the starting point (the row''s `Evidence` column and the issue''s `repro`/`expected`/`actual` fields). If the old repro no longer applies, derive a fresh one. Never transcribe old prose as evidence. The exact in-process loading pattern is in `tests/mcp/tools/post_regen_simulation.py` and `tests/mcp/tools/test_round3_retrieval_corpus.py`.'
- 'Disposition rule (the plan''s own): rows P0-P2 may end only FIXED (name the card or commit that fixed it and the live evidence), DISCLOSED (name the registry entry id or the `L-` limitation id and show the served disclosure live), NOT_REPRODUCED (show the exact probe and its current output) or DEFINITIONAL (cite the written definition); ACCEPTED(P3) only for genuinely low-severity P3 rows; BLOCKED_UPSTREAM only for a defect only the upstream project can fix and that the served answer already discloses. If a row cannot be honestly dispositioned, LEAVE IT OPEN and state the concrete reason and the next action in the row (precedent: TC-777 left 39 of 73 open, TC-780 38 of 57). Do not force a disposition to make a count look complete. A row that you find STILL BROKEN and fixable inside this card''s write_paths is fixed here (with a test); one that needs a different file is left OPEN and reported by id with the file it needs.'
- 'No pilot ever gets worse (AGENTS.md): never remove or downgrade a disclosure, registry entry or limitation text unless you have re-verified, live and on the real package where the row concerns an upstream defect, that it is fixed upstream AND that the fix reaches the served/indexed version. Never weaken, skip or xfail a check. Do not touch production source files, baseline JSON files or any test outside write_paths.'
- 'Before committing run the card''s check twice (it re-runs the ledger enum test, `tests/conformance/` and the known-defects completeness lock) plus ruff check / ruff format --check on any Python file you changed. Make exactly ONE commit, leave no background process, report ONCE with a table: row id, old status, new status, evidence (one line each), and the list of rows left OPEN with their reasons.'
- 'ENVIRONMENT: PowerShell; run `. E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\scripts\toolchain\activate.ps1` first where a toolchain is needed (mvn/javap/dotnet/go/cargo/node/pip for live re-verification of upstream-defect rows; download packages into scratch directories OUTSIDE the repository and OneDrive, run Python that reads downloaded files with `-I`). The worktree has no venv: use E:\Users\prora\OneDrive\Documents\GitHub\foss-mcp\.venv\Scripts\python.exe with PYTHONPATH set to your worktree root, src and infra. Never print GITHUB_TOKEN/GH_TOKEN/GPT_OSS_* values.'
- "LESSONS FROM TC-853..TC-870 (supervisor, 2026-11-21): (1) Every registry entry you add or retire moves pins in the known-defects tests: tests/indexing/test_known_defects_data_remaining.py (per-pilot counts, 'N entries total', _ADDITIONAL_DISCLOSABLE_IDS, named_ids), test_known_defects_sibling_refs_round3.py, test_known_defects_completeness.py (union count, file count) and the tests/mcp/tools/test_known_defects_*.py files are now listed explicitly in write_paths; re-pin only to confirmed real values, never loosen/skip/delete. The registry is 68 entries across 26 files today. (2) Before committing run the FULL directory sweeps WITHOUT -x, in PowerShell with scripts\toolchain\activate.ps1: tests/mcp tests/indexing tests/conformance tests/config tests/extraction tests/infra tests/release tests/deploy (gatectl review only reruns related tests, so a stale pin elsewhere would leave main red; tests/infra caught one after TC-853). A failure outside write_paths: report file + test + what it pins\
  \ and stop. (3) If you cannot execute upstream code because the auto-mode classifier denies it, do not work around it: use a static read of the pinned source and say so in the entry's repro text. (4) A falsifier you do not control is the supervisor's; if the negative control looks vacuous say so in your report."
- 'MACHINE-READABLE PROBES (new requirement, 2026-11-21): the operator wants every reported problem replayable against an image. For EVERY ledger row you disposition, also append one entry to the new file tests/audit/probes/ws_j_b.yaml (a YAML list; create it) so a later runner (card TC-871) can replay the same probe deterministically, in-process against infra/demo-manifests and against a running container. Entry shape, exactly: - id: <the original issue id, e.g. 3D-JAVA-002>; row: <RD2-NNN>; pilot: <family/platform, e.g. 3d/java>; disposition: <FIXED|DISCLOSED|NOT_REPRODUCED|DEFINITIONAL|ACCEPTED(P3)|BLOCKED_UPSTREAM|OPEN>; probe: {tool: <search_symbols|get_symbol|list_members|find_examples|search_docs|lookup|get_product_reference|report_index_freshness>, args: {<the tool''s real keyword arguments as you called them>}}; expect: {<one or more of: found: true|false; match_quality: exact|partial|none; result_contains: [<substrings that MUST appear in the serialised tool result>]; result_not_contains:
  [<substrings that must NOT appear>]; min_results: <int>; max_results: <int>>}; evidence: <one line>. If a row can only be established by ground-truth steps outside the MCP tools (mvn, javap, dotnet, pip, reading upstream source) write probe: {manual: true, reason: <why>} and no expect. The expectation must describe the CURRENT served behaviour that justifies the disposition (for a DISCLOSED row: result_contains the disclosure text/id; for FIXED: the corrected behaviour; for NOT_REPRODUCED: the probe output that shows the symptom absent; for OPEN rows: the symptom as it still reproduces, so the replay documents it). Use only values you actually observed live in-process. Keep each file valid YAML (ruff does not check it; run python -c "import yaml;yaml.safe_load(open(path))"). '
