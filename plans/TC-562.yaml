    tests/mcp/tools/test_lookup_forgiveness.py tests/mcp/tools/test_lookup_miss_reason.py tests/mcp/tools/test_nonsense_queries_miss.py tests/mcp/tools/test_search_symbols_forgiveness.py tests/mcp/tools/test_forgiveness_acceptance.py
    tests/mcp/tools/test_search_symbols_memberless_last.py -q -rfE -p no:cacheprovider
