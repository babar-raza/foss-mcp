source_refs:
- file: docs/DECISION_LOG.md
  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: a committed retrieval corpus of at least 20 user-wording tasks per family (cells, pdf, slides, words, 3d, email, barcode/tex/html/note/page/imaging) with the intended API written from upstream
  source, run against the real baked manifests in the test (no network, no container): hit@3 for lookup at least 0.85 overall and at least 0.70 per family, non-empty-wrong answers at most 2%, every case
  of the purpose's wrong-but-plausible list ranks the correct type in the top 3 or gives an honest miss, search_symbols results carry the fixed 'not implemented in this build' phrase of TC-559 when the
  chunk has it, lookup for 'save presentation as PDF' on slides/java and slides/net, 'export to PDF' on slides/cpp and words/net and 'render a scene' on 3d/net returns the limitation chunk first, `getting
  started` hits on every pilot that has a getting_started document, `Do` finds Operators.Do on pdf/net and pdf/java, `a.b.c::d` is an honest miss, full-width `Workbook` hits, no exact-name or camel-split
  query regresses (hit@1 stays 1.00 on the R8 exact-name set), typo queries still give did-you-mean. INDEPENDENT ORACLE: the intended-API column of the corpus is written from the upstream sources (not from
  MCP output) and is reviewed in the card report.
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated names in src/foss_mcp/mcp/tools/relevance.py: the exact line `STOP_WORDS_ENABLED = True` (a real switch: when False the query is tokenised exactly
  as before this card), a module constant `STOP_WORDS: frozenset[str]` (function words only; never a word that is a product or API noun such as 'page', 'document', 'table', 'image', 'save', 'open'), and
  a synonym map extension `USER_TERM_SYNONYMS` (user words to API words: change/set/edit -> put/set/value; merge -> merge/concat/append; link -> hyperlink; bold -> font; colour -> color; remove/delete ->
  remove/delete; text -> text/string). (2) Measure the BASELINE FIRST: write the corpus runner, run it on the committed data before any change and record the baseline hit@1, hit@3, hit@10, MRR and non-empty-wrong
  rate per family in the report; the ratchet is hit@3 >= max(0.75, baseline + 0.15) overall and >= baseline + 0.10 in every family, and non-empty-wrong <= 2 percent. The seeds are the round-3 investigator's
  444 tasks: tasks are in C:\Users\babar\foss-mcp-review-backup\audit-r3\R8\tasks.py and the README-derived expected answers in oracle.json (read-only, outside the repository; they are SEEDS: verify each
  intended API against the upstream source or the pilot's own README before you commit it to tests/fixtures/retrieval_corpus/<family>.json; drop a task whose intended answer does not exist in the index,
  because an honest miss is then the right answer). (3) The corpus test reads the real baked manifests under infra/demo-manifests (no network, no container) and calls the tools in-process. (4) The marker
  contract with TC-559: search_symbols results carry the phrase `not implemented in this build` from the chunk text when the chunk has it (test with a synthetic chunk; the real data gets it from TC-559),
  and lookup returns the pilot's limitation documentation first when the query names a capability that documentation lists as unsupported (test with the real slides/java, slides/net, slides/cpp, words/net
  scope documents: 'save presentation as PDF', 'export to PDF', 'render a scene' on 3d/net). (5) EXISTING TESTS (349 in the first check's relevance files) must stay green; change only an expectation that
  the new normalisation legitimately moves, with the comment `TC-562: <old> -> <new>` and the reason in the report; tests/mcp/tools/test_nonsense_queries_miss.py (132) guards the honest-miss invariant:
  it must still pass unchanged (the gibberish rule of this card tightens, never loosens). (6) min_tests is 360 for EACH check: the first check collects 349 existing + at least 20 new = 369 or more; the
  second check (tests/mcp, filtered) collects 2,500 or more. (7) Do not touch src/foss_mcp/mcp/server.py beyond the tool schema text for search_docs (content_type optional) and the pagination argument;
  TC-563 (accepted before you start) owns the excerpt code in response_budget.py and search_docs.py's excerpt argument: build on it.
- >-
  REWORK AMENDMENT (supervisor, 2026-10-19). (1) server.py: apply the tested patch you set aside (search_docs `content_type` optional in the tool schema, the pagination argument of search_symbols) and update
  exactly the three tests that pin the old schema, now in write_paths: tests/mcp/test_response_envelope.py (the valid-argument list), tests/mcp/test_round3_doc_excerpt.py (required == ["query"]) and tests/mcp/test_tool_surface_truthful.py
  (the schema/wrapper agreement test), each change with the comment `TC-562: <old> -> <new>` and listed with its reason in the report; never delete, skip or loosen. (2) The corpus as an embedded module
  (CORPUS_DATA in tests/mcp/tools/test_round3_retrieval_corpus.py) instead of tests/fixtures/retrieval_corpus/*.json is accepted: the guard cannot match that glob. (3) The non-empty-wrong rate 3.6 percent
  against the card's 2 percent is PROVISIONALLY ACCEPTED (baseline 17.3 percent; OQ-016 records it for the QA round): keep WRONG_MAX at 4.5 percent as a ratchet that may only go down; do not spend more
  time on it, except the pdf family at 9.9 percent: if one targeted change brings it clearly below 8 percent without lowering any other family, include it, otherwise leave it. (4) Rebase your commit onto
  the new issue revision shown in the dispatch record (`git rebase --onto <new issue rev> 4ed0b82012d7 worker/TC-562`), re-run both checks twice and the negative control, run the top-level tests/test_*.py,
  tests/test_unwired_modules.py and tests/test_githooks.py, and run `ruff format --check` and `ruff check` with the repo configuration from the worktree root on every file you changed (the review rejects
  any unformatted file).
actions:
- >-
  Improve query normalisation, synonyms, partial matches, floors, pagination marker and wording in the relevance layer; add the retrieval corpus test.
