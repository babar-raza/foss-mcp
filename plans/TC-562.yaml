    {python} -m pytest tests/mcp/tools/test_round3_retrieval.py tests/mcp/tools/test_round3_retrieval_corpus.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1800
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/mcp -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native"
  expect: exit 0
  timeout_seconds: 2400
  junitxml: true
  proves:
  - REQ-G3-009
  - REQ-G3-008
min_tests: 8
network: true
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "print('negative control to be authored before dispatch')"
  rationale: >-
    PLACEHOLDER written at registration. The supervisor replaces it, before dispatch, with a falsifier that breaks the card's central claim in the code the worker writes (a mandated constant or function
    name) so that a named new test fails.
evidence:
- evidence/build/G3/TC-562/receipt.json
closeout:
- >-
  Natural-language tasks reach the right API with measured hit rates; wrong-but-plausible answers and gibberish matches are gone; miss wording and pagination are honest.
recovery: Re-run from a clean tree.
