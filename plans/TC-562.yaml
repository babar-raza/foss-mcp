negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/mcp/tools/relevance.py');s=p.read_text(encoding='utf-8');old='STOP_WORDS_ENABLED = True';assert s.count(old)==1;p.write_text(s.replace(old,'STOP_WORDS_ENABLED = False'),encoding='utf-8')"
  rationale: >-
    Turns off the mandated stop-word switch of the relevance layer, so function words (together, from, my, a, how) count as query terms again: the committed retrieval corpus tests (merge cells together,
    create a chart from my data, add a hyperlink) fall back to honest misses and the hit-rate ratchet fails at once. A real break of the card's claim that ordinary phrasing reaches the right API.
