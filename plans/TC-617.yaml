inputs:
  - >-
    READ FIRST: C:\Users\babar\.claude\plans\steady-wobbling-meteor.md section 2.2 (Q1-Q4), and
    TC-616's own closeout note (visible in evidence/build/G3/TC-616/ and the commit it integrated)
