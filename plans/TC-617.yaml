negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/search_docs.py'); s = p.read_text(encoding='utf-8'); old = 'query = fold_query(query)'; assert s.count(old) == 1, 'fix text not found - card and source have diverged'; p.write_text(s.replace(old, old + chr(10) + '    normalize_query = lambda q, f: q  # TC-617 negative control: never normalize the query', 1), encoding='utf-8')"
  rationale: >-
    Shadows normalize_query with an identity no-op immediately after fold_query runs in search_docs,
    regardless of exactly which line inside the function the real wiring calls it from. At least the
    search_docs-side normalization test must then fail, proving it exercises the real wiring rather
    than trusting that normalize_query is imported. If search_docs's own dotted-mention fix turns
    out to be a measured no-op the same way find_examples's was, use the module's own
    liveness-spy pattern TC-616 built (confirming normalize_query is actually CALLED) instead of
    relying on an output-shape assertion - state which approach you used and why in your closeout.
    This mutate is independent of the attempt-2 `_rule_for` platform-exclusion fix; also hand-verify
    (not necessarily via a SECOND registered falsifier, one is enough per card, but state the result
    in your closeout) that reverting the attempt-2 `_rule_for` fix specifically (e.g. by removing
    just its new special-case branch) makes the 24-case product-title regression reappear, proving
    that fix is load-bearing and not accidentally inert.
evidence:
  - evidence/build/G3/TC-617/receipt.json
closeout:
  - >-
    search_docs and lookup (including lookup's own _without_unsupported_tables) now normalize a
    dotted "Aspose.<Family>" mention and exclude the scope's own platform word from
    distinctive-term counting; state the real measured effect of each fix on each tool
    separately (do not assume TC-616's find_examples-specific no-op finding carries over). The full
    existing search_docs/lookup ratchet suites are confirmed unchanged, INCLUDING the 24-case
    product-title regression attempt 1 found and attempt 2's `_rule_for` fix resolves - state the
    before (24 failing)/after (0 failing) counts explicitly.
recovery: >-
  If threading platform= into any query_terms/distinctive_terms call changes ANY existing pinned
  search_docs or lookup result even for a query with no platform word, STOP and report
  FAILED_INTERNAL with the exact diff - TC-610 already proved platform=None is fully inert, so a
  change here would mean this card's wiring is passing a non-None platform somewhere it should
  not, not that the ratchet needs adjusting.
