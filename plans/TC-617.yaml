    `platform=scope.platform`. Also call `normalize_query(query, scope.family)` once, immediately
    after the existing `query = fold_query(query)` line inside `search_docs` itself (around line
    455) - confirm the exact real line first, it may have shifted.
  - >-
    In `src/foss_mcp/mcp/tools/lookup.py`: find EVERY real call site of `query_terms`/
    `distinctive_terms` via grep (there are at least 4 as of this plan's own research:
    `_limitation_docs` line ~346/348, `_answer_quality`'s unmatched-terms fallback line ~407,
    `_rule_for` reused from search_docs via its one call inside `_answer_quality` line ~401, and
    `_without_unsupported_tables` line ~429) - confirm the exact current set, it may have shifted.
    For each helper that already receives `scope` directly (`_limitation_docs`, `_answer_quality`),
    pass `platform=scope.platform` straight through to the relevant `query_terms`/
    `distinctive_terms` call. For `_without_unsupported_tables(matches, query, family)`, which
    receives a bare `family` string rather than `scope` - add an optional `platform: str | None =
    None` parameter to IT too (same backward-compatible pattern), thread it into its
    `distinctive_terms` call, and pass `platform=scope.platform` from its one real call site inside
    `lookup` (find it via grep; confirm `scope` is actually in lexical scope there). `_rule_for` is
    SHARED with search_docs.py - do not duplicate it; lookup.py must still import and call the one
    real `_rule_for` from search_docs.py exactly as it does today, now simply passing
    `platform=scope.platform` at its own call site too (line ~401). Also call
    `normalize_query(query, scope.family)` once, immediately after the existing
    `query = fold_query(query)` line inside `lookup` itself (around line 470).
  - >-
    tests/mcp/tools/test_search_docs_query_normalization.py and
    tests/mcp/tools/test_lookup_query_normalization.py (no mocks for the real-pilot case; reads the
    real, committed infra/demo-manifests, writes nothing to it) - for EACH of the two tools,
    separately: (a) a query containing the scope's own platform word now produces a distinctive-term
    count one lower than before, measured concretely against a real pilot/platform pair, with the
    concrete, real effect on the tool's own returned answer (an upgraded match_quality, a changed
    unmatched_terms list, or whatever the real measured effect turns out to be - report reality);
    (b) a query containing a literal "Aspose.<Family>" dotted mention - measure fresh whether this
    tool's own term machinery is actually affected (it may be a no-op here too, as TC-616 found for
    find_examples, or it may not be - report reality either way, backed by a concrete before/after
    comparison, not an assumption); (c) the full existing search_docs/lookup ratchet suites (list the
    real files you ran for each) are UNCHANGED - every existing pinned match, miss and confidence
    value byte-identical to before this card - the real files to run are named in this card's second
    check (test_lookup_forgiveness.py, test_lookup_miss_reason.py, test_search_docs_language_letter.py,
    test_search_docs_title_passage_coverage.py, test_round3_retrieval_corpus.py; there is no
    monolithic test_search_docs.py/test_lookup.py in this repository); (d) a query that is ONLY the
    bare platform word gets a sensible, reported-not-assumed outcome for each tool. Never weaken a
    check to make it pass.
