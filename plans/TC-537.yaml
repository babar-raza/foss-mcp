- command: >-
    {python} -m pytest tests/deploy/test_preprod_review_register.py tests/deploy/test_release_known_limitations.py tests/deploy/test_release_deferred_extraction.py tests/deploy/test_removed_family_absent.py tests/deploy/test_pilot_roster.py -q -rfE
  expect: exit 0
  timeout_seconds: 900
  junitxml: true
  proves:
  - REQ-G3-008
- command: >-
    {python} -m pytest tests/deploy/test_preprod_review_register.py tests/deploy/test_release_known_limitations.py tests/deploy/test_release_deferred_extraction.py tests/deploy/test_verified_examples_coverage.py
    tests/deploy/test_build_review_ledger.py tests/test_layout.py tests/deploy/test_removed_family_absent.py tests/deploy/test_pilot_roster.py -q -rfE -p no:cacheprovider
  expect: exit 0
  timeout_seconds: 1200
  junitxml: true
  proves:
  - REQ-G3-008
min_tests: 250
network: false
requires:
- python
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib;p=pathlib.Path('docs/PREPROD_REVIEW.md');s=p.read_text(encoding='utf-8');old='| FIXED |';assert old in s;p.write_text(s.replace(old,'| OPEN |',1),encoding='utf-8')"
  rationale: >-
    Turns the first FIXED row of the committed gap register into an OPEN row: the no-open-row test and the status-shape test fail.  A real break of the card's central claim (no finding of the review may
    stay open).
evidence:
- evidence/build/G3/TC-537/receipt.json
closeout:
- >-
  docs/PREPROD_REVIEW.md records the whole review with a verification method per finding, every finding is FIXED by an accepted card or ACCEPTED and published in docs/RELEASE.md section 8, and a committed
  test fails the day a row is opened or a card is no longer accepted. The review is closed in the repository.
recovery: Re-run from a clean tree.
