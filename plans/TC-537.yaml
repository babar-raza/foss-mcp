id: TC-537
gate: G3
lane: verification
purpose: >-
  REQ-G3-008 (closure of the independent pre-production review). The review of the shipped image found 85 distinct findings in seven slices (generation, readiness and recovery GRR-01..14; fleet and Kubernetes
  FK8S-01..12; protocol and security PS-01..11; isolation and provenance ISOPROV-01..07; agentic tasks AGT-01..11; examples, product reference and releases D-01..13; retrieval and source truth RST-01..17),
  plus the verified-good results, the critique of the existing proof suite and a capability matrix. The definition of done (docs/REVIEW_LEDGER.md and tests/deploy/test_verified_examples_coverage.py already
  enforce it for the earlier rounds) is that every finding is FIXED by a named, accepted card or ACCEPTED with a published reason. Today the working register lives outside the repository. This card commits
  the review as docs/PREPROD_REVIEW.md (executive verdict, scope, fleet status, the proof-suite blind spots, what was verified good per slice, the gap register with ID, severity, status, cards and a verification
  method for every finding, the missing capabilities, the shipping gates PASS or FAIL, and the residual accepted limitations), appends every ACCEPTED finding to docs/RELEASE.md section 8 as a new ledger
  bullet, amends the existing section 8 bullets that the remediation made false, and adds tests/deploy/test_preprod_review_register.py, which fails when a row is open, when a FIXED row names a card that
  is not accepted in project/state.yaml, or when an ACCEPTED row is not published in RELEASE.md. The statuses are decided by the supervisor at dispatch and arrive in a JSON file whose schema this card fixes
  below; the worker invents no status, no card and no number. It does NOT change src/, any other test, docs/REVIEW_LEDGER.md or scripts/release/build_review_ledger.py (a retired section 8 bullet is amended
  in place, not removed, so the ledger generator and its tests keep working).
