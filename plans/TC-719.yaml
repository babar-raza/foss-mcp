source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-07 — WORDS-PY-002 investigated: not stale served data as reported, a real design tension in the `__all__`-based public-name rule; a supervisor decision, not a quick fix (supervisor)
    sha256: facf53870f4293b1ad12582511aca9b9f228dc2e98dc7274e91c5a6c6f1152cc
inputs:
  - >-
    READ FIRST: `docs/round2/issues.json` id `PDF-CPP-004` in full. Then `get_product_reference.py`'s
    `_drift_notice` (around line 445), `_annotate_broken_embedding`/`_BROKEN_EMBEDDING_NOTE` (around
    line 1389), and `_cpp_install`'s own `platform == "cpp"` call site (around lines 2134-2159) in
    full - the exact place where `recipe` and `cmake_drift` are both already computed, moments
    apart, with no cross-check between them today.
  - >-
    REPRODUCE FIRST (do not skip): a real call against the real committed pdf/cpp data, confirming
    both halves of the contradiction exist today. Report the real observed text, verbatim, in your
    closeout.
  - >-
    Never change `_drift_notice`'s default behavior for its other two existing call sites, and
    never remove the `git clone`/`git checkout` sentence, which is valid regardless of whether
    FetchContent/add_subdirectory work for this pilot.
actions:
  - >-
    Make the generic drift-notice's FetchContent suggestion aware of the same pilot's own
    already-computed broken-embedding disclosure, closing PDF-CPP-004's self-contradiction without
    touching any other ecosystem or call site.
checks:
  - command: '{python} -m pytest tests/mcp/tools/test_round3_install_truth.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
  - command: '{python} -m pytest tests/mcp/tools/test_product_reference_cpp_install.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-013
min_tests: 7
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('src/foss_mcp/mcp/tools/get_product_reference.py'); s = p.read_text(encoding='utf-8'); old = 'embedding_broken'; count = s.count(old); assert count >= 1, 'the expected parameter name was not found - if your real fix uses a different name, anchor your own mutate on your own real literal instead and note the substitution in your closeout'; new_old = 'if ecosystem == ' + chr(34) + 'cmake' + chr(34) + ':'; count2 = s.count(new_old); assert count2 >= 1, 'the expected cmake-branch literal was not found - anchor your own mutate on your own real literal instead'; s2 = s.replace(new_old, 'if False and ecosystem == ' + chr(34) + 'cmake' + chr(34) + ':', 1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Disables the whole `cmake`-branch of `_drift_notice` outright (`if ecosystem == "cmake"` ->
    `if False and ...`), which must make the new regression test fail (the FetchContent sentence
    never appears at all any more, including for the pilot that SHOULD still get it) - if your real
    fix structures the condition differently, anchor your own mutate on your own real post-fix
    literal instead and note the substitution in your closeout.
evidence:
  - evidence/build/G3/TC-719/receipt.json
closeout:
  - >-
    `get_product_reference(section=install)` for `pdf/cpp` no longer recommends `FetchContent` in
    its drift notice when the body already discloses that embedding is broken at the indexed
    commit, closing PDF-CPP-004 without changing `_drift_notice`'s behavior for any other pilot or
    call site.
recovery: Re-run from a clean tree.
