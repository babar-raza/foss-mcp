id: TC-719
gate: G3
lane: storage-retrieval
purpose: >-
  Closes PDF-CPP-004 (round-2, `docs/round2/issues.json`, severity P1, category "mcp-content-wrong"
  - confirmed STILL OPEN by a dedicated 2026-11-07 supervisor investigation):
  `get_product_reference(section=install)` for `pdf/cpp` directly contradicts itself in ONE
  response: the body text states (twice) that `add_subdirectory`/`FetchContent` do NOT work at the
  indexed commit (`${CMAKE_SOURCE_DIR}` refers to the consuming project, not the library - the
  already-correct, already-working `_annotate_broken_embedding`/`_BROKEN_EMBEDDING_NOTE` mechanism,
  `get_product_reference.py` around line 1389, replaces the broken embedding code block with this
  exact disclosure), but the SAME response's trailing `notice` field (built independently by
  `_drift_notice`) then instructs the reader to use exactly that broken route:
  `FetchContent_Declare(<name> GIT_REPOSITORY ... GIT_TAG <commit>)` then `FetchContent_MakeAvailable(<name>)`.
  A reader who trusts the notice (which appears last, and reads as more actionable) hits the exact
  `${CMAKE_SOURCE_DIR}` failure the body already warned about.

  ROOT CAUSE (independently traced): `_drift_notice(inputs, ecosystem)` (around line 445) is a
  GENERIC, pilot-agnostic helper that appends a `FetchContent_Declare(...)`-shaped sentence
  whenever `ecosystem == "cmake"` AND the pilot's indexed commit is ahead of (or diverged from) its
  latest release/tag - with zero awareness of whether THIS SPECIFIC pilot's own install recipe
  already disclosed that embedding is broken at this exact commit. The `cpp` branch's own call site
  (around line 2150-2157) computes `recipe = _cpp_install(inputs, content, readme)` FIRST (which
  already correctly runs `_annotate_broken_embedding` and would have replaced the broken block with
  `_BROKEN_EMBEDDING_NOTE` if applicable), THEN separately computes `cmake_drift =
  _drift_notice(inputs, "cmake")` and appends it to `recipe.notice` via `_join_notice` with no
  cross-check between the two - the information needed to avoid the contradiction (whether
  `recipe`'s own text already contains `_BROKEN_EMBEDDING_NOTE`) is already sitting right there at
  the call site, just never consulted.

  REPRODUCE FIRST: confirm this is still real on current `main`. Call
  `get_product_reference(section="install")` for `pdf/cpp` against the real committed data (same
  pattern this session's other `get_product_reference` cards used) and confirm the body contains
  `_BROKEN_EMBEDDING_NOTE`'s disclosure text while the `notice` field simultaneously recommends
  `FetchContent_Declare`. Report the real observed text, verbatim, in your closeout.

  FIX (narrow, additive, touches only the `cpp` branch's own call site and `_drift_notice`'s own
  signature - never changes the drift-detection logic, the `git clone`+`git checkout` sentence
  which is ALWAYS valid regardless of whether FetchContent/add_subdirectory work, or any other
  ecosystem's behavior): add an optional keyword parameter to `_drift_notice`, e.g.
  `embedding_broken: bool = False`, defaulting to the exact current behavior for every existing
  caller (the two OTHER call sites, around lines 2032 and 2235, must stay byte-for-byte unchanged -
  do not touch them). When `embedding_broken` is True AND `ecosystem == "cmake"`, skip appending
  the `FetchContent_Declare(...)`/`FetchContent_MakeAvailable(...)` sentence specifically, keeping
  the `git clone`/`git checkout` sentence (always correct) and the rest of the drift message
  unchanged. At the `cpp` branch's own call site (around line 2153), pass
  `embedding_broken=_BROKEN_EMBEDDING_NOTE in recipe.text` (computed from `recipe`, which is already
  available at that point, built moments earlier) - reusing the existing broken-embedding detection
  this project already trusts, never re-deriving it with a second, parallel check.

  TEST: add a real-fixture-backed regression test to `tests/mcp/tools/test_round3_install_truth.py`
  (or the appropriate existing C++ install test file - check whether `cpp` install drift already has
  dedicated tests in that file or in `test_product_reference_cpp_install.py`, and follow whichever
  file's own existing convention) proving `pdf/cpp`'s real install answer no longer recommends
  `FetchContent_Declare` when the body already discloses broken embedding, while the `git
  clone`/`git checkout` sentence and the broken-embedding disclosure itself are both still present
  and unchanged. Also prove (negative case) that a C++ pilot WITHOUT a broken-embedding disclosure
  (if one with real drift exists in the committed corpus; if none does, construct the narrowest
  possible synthetic case for just this one negative assertion, matching this file's own existing
  conventions for similar edge cases) still gets the `FetchContent_Declare` sentence exactly as
  before - this is the "do not weaken the check for any other pilot" proof.
