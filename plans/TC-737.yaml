id: TC-737
gate: G3
lane: storage-retrieval
purpose: >-
  P4 example-corpus program (REQ-G3-014), a fourth real pilot-adoption win via the EXISTING,
  already-wired `authored_examples.yaml` mechanism (`TC-460`/`TC-565`/`TC-566`) - the exact same
  mechanism `TC-733`/`TC-735`/`TC-736` already proved for `cells/python`, `pdf/go`, and `cells/net`
  (sibling cards, different pilots, zero file overlap - do not touch anything any of them touch).
  Confirmed needing ZERO code change: `infra/build_chunks.py`'s `_load_authored_candidates`
  already auto-loads `tests/fixtures/furnished/<pilot>/authored_examples.yaml`, merges it with
  README-derived candidates, and runs every entry through the exact same `verify_cpp_example`
  pipeline that already verifies every other example, publishing only the ones that pass.
  `cells/cpp` already uses this mechanism today (3 examples, below its own cap) -
  `tests/fixtures/furnished/cells_cpp/authored_examples.yaml` is your exact schema/style template
  for the C++ shape specifically (also read `tests/fixtures/furnished/cells_rust/
  authored_examples.yaml` for the general schema convention), following `LANGUAGE_BY_PLATFORM`'s
  own `"cpp": "cpp"` mapping in `src/foss_mcp/indexing/authored_examples.py`.

  `email/cpp` currently serves only 2 real example chunks (confirmed directly against the real
  committed `infra/demo-manifests/email__cpp__self_extracted` generation) - the lowest of any
  pilot this session has touched. Its real pinned repository is `aspose-email-foss/Aspose.Email-
  FOSS-for-Cpp` (re-confirm the exact pinned commit yourself from `config/products/email/cpp.yaml`
  - do not trust this card's own citation blindly). The real upstream repository has a genuine
  `examples/` directory of roughly 3 real C++ programs (per this project's own Appendix-C style
  accounting for this pilot - a SMALL real sample set, confirm this directly, do not assume) - read
  all of them, and if fewer than 5 genuinely distinct, self-contained operations exist across both
  the real samples AND other real public API surface you can exercise directly (reading the real
  header/API surface for additional real, valuable operations beyond just the shipped samples is
  fine and encouraged when the sample count alone cannot reach 5 - exactly how `cells/rust`'s own
  existing sidecar already mixes sample-derived and API-derived examples), that is an honest,
  acceptable outcome - report the real number you got.

  `_MAX_EXAMPLES = 5` (`src/foss_mcp/indexing/authored_examples.py`) is a hard, already-enforced
  ceiling - this card raises `email/cpp` from 2 to AT MOST 7 served examples, not to its own real
  floor (8, Appendix C); closing that floor fully needs the P4 program's own later, larger
  per-language-sample-adapter work (XA17, the C++ sample adapter), explicitly out of this card's
  scope. This card's job is the real, bounded, immediately shippable slice: up to 5 new, real,
  individually-verified authored examples, each passing the real ingestion verifier before being
  trusted to publish.

  VERIFY EACH EXAMPLE YOURSELF - this pilot's real verification toolchain needs a real C++
  compiler/CMake build against the real pinned library source (read `example_verifier.py`'s
  `prepare_cpp_library`/`verify_cpp_example`/`_msvc_environment` to confirm exactly what the real
  pipeline needs on this host before assuming it will "just work" - this project's own prior C++
  verification work has needed a pinned toolchain; confirm what's actually available and usable
  here before writing an example you cannot personally compile and run).
depends_on:
  - TC-460
  - TC-565
  - TC-566
write_paths:
  - tests/fixtures/furnished/email_cpp/authored_examples.yaml
  - tests/indexing/test_authored_examples_email_cpp.py
satisfies:
  - REQ-G3-014
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: >-
      ## 2026-11-09 — TC-727 saga closed: pdf_java's own coverage-line gap fixed test-side; the 11
    sha256: 798801d5285b8fca9bd9c16e5b39a783987b36adfcfa56fe6d99de92e96e48ad
inputs:
  - >-
    READ FIRST: `tests/fixtures/furnished/cells_cpp/authored_examples.yaml` (your exact
    language-shape template) AND `tests/fixtures/furnished/cells_rust/authored_examples.yaml`/`
    tests/indexing/test_authored_examples_cells_rust.py` (your exact schema/structure/test-file
    template). Also read `src/foss_mcp/indexing/authored_examples.py` in full (every structural
    rule - `_MAX_EXAMPLES`, `_MAX_TITLE_CHARS`, `FORBIDDEN_CODE_PATTERNS`, `code_sha256` must equal
    `normalised_code_sha256(code)`, `symbols` must be real FQNs, `library_commit` must be the real
    40-hex pinned commit), `src/foss_mcp/indexing/example_verifier.py`'s C++ functions in full to
    confirm exactly what toolchain/build shape this pipeline expects, and `infra/build_chunks.py`'s
    `_load_authored_candidates`.
  - >-
    REPRODUCE FIRST: confirm `email/cpp`'s real current served example count (2) and real pinned
    repository/commit yourself. Fetch the real upstream `examples/` directory at that exact commit
    and read it, plus enough of the real public header/API surface to find additional real,
    valuable, self-contained operations if the shipped samples alone don't reach 5.
  - >-
    VERIFY EACH EXAMPLE YOURSELF before committing: confirm you have a working C++ toolchain
    available, fetch/build the real pinned library, actually compile and run each of your adapted
    programs, confirm each one's real output matches what you claim. Do not submit an example you
    have not personally run successfully.
  - >-
    `FORBIDDEN_CODE_PATTERNS` blocks environment/credential access, process spawning, raw network
    clients, and interactive input - confirm none of your examples trips any of these patterns
    before committing.
  - >-
    This card does NOT claim `email/cpp`'s example-corpus work is complete - up to 7 served
    examples is real, bounded progress toward its real floor, not the floor itself. If fewer than 5
    real candidates verify cleanly (very possible given this pilot's small real sample set), submit
    the real number you got and say so honestly - do not pad with unverified ones, and do not force
    a weak example just to hit 5.
actions:
  - >-
    Author up to 5 new, real, individually-verified examples for email/cpp via the existing
    authored_examples.yaml mechanism, raising its served example count from 2 toward 7.
checks:
  - command: '{python} -m pytest tests/indexing/test_authored_examples.py tests/indexing/test_authored_examples_email_cpp.py tests/infra/test_authored_examples_fixtures.py -q -rfE -p no:cacheprovider'
    expect: 'exit 0'
    timeout_seconds: 300
    junitxml: true
    proves:
      - REQ-G3-014
min_tests: 5
requires:
  - python
network: false
negative_control:
  mutate: |
    python -X utf8 -c "import pathlib; p = pathlib.Path('tests/fixtures/furnished/email_cpp/authored_examples.yaml'); s = p.read_text(encoding='utf-8'); assert s, 'the sidecar file is empty or missing - this card must create it with real content before this mutate can run'; old = 'code_sha256:'; count = s.count(old); assert count >= 1, 'no code_sha256 field found - the file does not match the expected schema'; import re; s2 = re.sub(r'code_sha256: [0-9a-f]{64}', 'code_sha256: ' + '0'*64, s, count=1); assert s2 != s; p.write_text(s2, encoding='utf-8')"
  rationale: >-
    Corrupts the first example's own `code_sha256` to a value that cannot match the real code's
    hash, which must make `load_authored_examples`'s own validation reject the whole sidecar file -
    a pure data mutation, immune to the lockstep-rename vacuousness class this session's earlier
    reviews found, and it never touches any code path. Confirm by hand that the check files you
    named actually exercise this validation path before trusting it.
evidence:
  - evidence/build/G3/TC-737/receipt.json
closeout:
  - >-
    email/cpp gains up to 5 new, real, individually-verified authored examples via the existing,
    already-wired authored_examples.yaml mechanism (zero code change), raising its served example
    count from 2 toward 7 - real, bounded progress toward its full floor, which remains separately
    open pending the P4 program's own later per-language sample-adapter work.
recovery: Re-run from a clean tree.
