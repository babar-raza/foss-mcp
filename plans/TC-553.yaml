  anchor: '## 2026-10-15 — Independent pre-production adversarial review of the shipped image; its findings enter the state machine as cards (operator, supervisor)'
  sha256: d2d82669b8060d5e3a3b9da00e9858e576d5d264d96e32d1aed8034e8d6d9007
inputs:
- >-
  ORDER, FRESHNESS AND WHAT IS LISTED. TC-553 runs after TC-551 and TC-552 are accepted and after the supervisor's data commit of the refreshed thirteen pilots (the dispatch
  instruction names that commit). Start from a clean tree at the commit the supervisor issues and build on what is there: TC-551 changed constants, names and roster in several files named
  below (EXPECTED_PILOTS 32, COVERAGE_EXCEPTIONS emptied, budgets of the 32-pilot tree, the cpp install list without the removed pilot) and TC-552 renamed synthetic names and added
  tests/deploy/test_removed_family_absent.py. Every file name, test name, constant and line number below was checked against main da125187 plus a trial snapshot; verify each name against the
  merged code before you rely on it, use the merged name when it differs and list the difference in your report. The measured numbers in this card come from a TRIAL snapshot: the committed
  tree is the authority, re-measure every number yourself and use YOURS. NEVER print or log any environment value. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command
  as every python or pytest call. Do not run an ingestion, a docker command or a cluster command. Do not use the removed pilot family's name anywhere in a file you write (tests/deploy/test_removed_family_absent.py,
  added by TC-552, scans every tracked file; the only allowed occurrence outside the history files is the one removal sentence of docs/RELEASE.md, which stays byte for byte). The pilot
  count is 32 in 12 families; derive every pilot list from the chart (infra/helm/foss-mcp/values.yaml ingestion.pilots), never retype it.
- >-
  STEP 0, BASELINE (before you edit anything). Run the offline suite on the clean tree in two bounded background chunks and keep the list of failures: chunk A `python -m pytest tests/deploy tests/infra
  tests/poc tests/config tests/schemas tests/telemetry -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native"` (the drafter measured about 16 minutes under load),
  chunk B `python -m pytest tests/mcp tests/indexing tests/extraction tests/normalization tests/test_layout.py tests/test_unwired_modules.py tests/test_repo_hygiene.py tests/test_live_marker.py
  tests/test_pilot_export.py tests/test_serving_dependency_lock.py -q -rfE -p no:cacheprovider -k "not live and not github_http and not repo_native"` (about 15 minutes). Start each with a hard
  `timeout 3000`, redirect to a file in your scratch directory, poll with bounded waits (never a tail -F monitor on process output), and tee the failure lines. Do not run tests/e2e, tests/test_container_build.py
  (docker) or tests/test_githooks.py. The failures must be the ones named in the purpose and the table below. A failing test that is NOT in the table: if its assertion pins a fact of the
  pre-refresh baked data (an old count, an old commit, an old coverage line, a 300-type cap, a size) it is yours to re-pin within the rules of this card (it is in write_paths when it reads the baked
  tree: the write_paths hold every test file that mentions infra/demo-manifests); if it is not in write_paths, or if it fails for any other reason, or if it looks like a PRODUCT defect (a wrong served
  answer, a chunk that cannot be parsed), STOP, record `gatectl status-append` FAILED_INTERNAL with the test id and the evidence, and report it: never edit src/. Never delete, skip or xfail a test and never
  loosen a check that guards a defect; a numeric floor may be raised, never lowered, except where this card says a pinned number follows the measured data. For every changed assertion put a one-line
  comment `re-pinned by TC-553: <old> -> <new>` and list it in your report.
- >-
  BUDGETS (tests/deploy/test_compact_demo_manifests.py and tests/deploy/test_demo_manifests_sidecars.py; constants and comments only, plus the one new test below). Measure with the tests' own definitions,
  in one command, and put all numbers in your report: in test_compact_demo_manifests.py `total` is the sum of every file under infra/demo-manifests (rglob), `sizes` are the single generation file of
  each scope (`real_generation_file`), the largest is max(sizes) and the median statistics.median(sizes); the drafter measured on the trial snapshot total 41,744,019, 32 scopes, largest 5,098,150
  (pdf_java), median 763,927. New value of each constant = measured x 1.05 rounded UP to the next multiple of 10,000 (TREE_BYTES_BUDGET in BOTH test files from the tree total, LARGEST_FILE_BYTES_BUDGET from the
  largest, MEDIAN_FILE_BYTES_BUDGET from the median), so about 43,840,000 / 5,360,000 / 810,000; EXPECTED_SCOPES stays what TC-551 left (32). Put next to each changed constant a comment with the measured value,
  the date, the data commit named in the dispatch instruction and why the tree grew (the thirteen pilots now hold their whole public surface: pdf/java 1,239 types, pdf/typescript 1,333 types and 3,060
  functions, pdf/net 901 types). THE CEILING: the lean standalone image was agreed at 45 MB for the baked tree. Add `LEAN_CEILING_BYTES = 45_000_000` to test_compact_demo_manifests.py with a comment that it is the
  operator-agreed ceiling and a new test `test_the_tree_budgets_stay_under_the_agreed_lean_ceiling` asserting TREE_BYTES_BUDGET <= LEAN_CEILING_BYTES in both test files (import the constant in the sidecars
  test through the same sys.path mechanism the file already uses, or repeat the literal with the same comment, whichever the file's imports allow) plus a synthetic anti-vacuity test that a budget above the ceiling
  is rejected by the helper you factor out. STOP RULE: if the measured tree is above 45,000,000 bytes do NOT pin: record FAILED_INTERNAL with the four measured numbers (total, largest, median, scope count)
  and stop, because the lean ceiling is the operator's decision to move, never a worker's. The largest-file and median budgets have no operator ceiling, but say in the report if the largest exceeds 5.5 MB or the
  median 850 KB. docs/RELEASE.md has no size ceiling today: add exactly one sentence to section 2 step 1 (after `Commit the result: the image is built from committed bytes.`): `The committed tree stays under 45 MB (the
  lean ceiling); the exact budgets are pinned in tests/deploy/test_compact_demo_manifests.py.` and a test in test_compact_demo_manifests.py that the document contains `45 MB` and `test_compact_demo_manifests.py`
  (the document names the ceiling and the test, not the budget, so a later re-pin changes only the test).
- >-
  FLEET CONSISTENCY (tests/deploy/test_fleet_consistency.py; this file is shared with the pending cards TC-532 to TC-536, which run after this one and add their pilots to STALE_BAKED_PILOTS, so the transition
  mechanism MUST survive). (1) STALE_BAKED_PILOTS becomes the EMPTY dict `{}` (all thirteen entries leave: the baked generations are fresh), KEEP the type annotation, the branch in
  `test_api_coverage_lines_are_present_and_honest` and the three table tests, and reword the comment: `transition table: a pilot whose fixture was re-extracted before the supervisor re-ingests it is listed
  here with a reason; empty after TC-553; TC-536 deletes the mechanism`. (2) COMMIT_EXCEPTIONS becomes `{}` with its comment (pdf_typescript is one commit, 155bfc7, everywhere:
  `problems_commit('pdf_typescript')` is empty; verify it); `test_every_commit_exception_still_applies` loops, so an empty table passes. (3) COVERAGE_EXCEPTIONS must be `{}` after TC-551 (verify). (4) UNRESOLVED_EXCEPTIONS:
  set each maximum to the fixture's real `unresolved` count (measured now: tex_python 13, email_python 38, words_python 10, pdf_python 4, html_python 1, so no change) and delete an entry that reaches 0.
  (5) THE API-COVERAGE GRAMMAR. The merged builder (src/foss_mcp/indexing/chunk_builder.py `_coverage_line`, read it first) writes `API-Coverage: N of M types` for a fixture without `symbol_counts`/`parse_failures`,
  and for a fixture that carries them `API-Coverage: Nt of Mt types` + optional `; Nf of Mf functions` (only when symbol_counts.functions > 0) + optional `; X of Y source files could not be parsed` or `; at least K source
  files could not be parsed`, where Nt counts the NON-function chunks, Nf the `Kind: function` chunks, Mt = symbol_counts.types and Mf = symbol_counts.functions. Change `_COVERAGE_VALUE` and `coverage_problems` to
  that grammar so that every old guarantee is kept in the form the grammar allows and no line the old test would have rejected for a reason that still applies is accepted: exactly one `API-Coverage:` line per symbol
  chunk and the same line on every chunk; a chunk is a function chunk when its SECOND line is `Kind: function` (the layout `_format_type_text` writes: line 1 `FQN:`, line 2 `Kind:`); WHEN the fixture has
  `symbol_counts` with an integer `types`: Nt must equal the number of non-function symbol chunks, Mt must equal symbol_counts.types, and when symbol_counts.functions > 0 the line must carry the functions clause with
  Nf equal to the function chunks and Mf equal to symbol_counts.functions, while symbol_counts.functions == 0 allows neither a functions clause nor a function chunk; `(Nt < Mt or Nf < Mf)` must equal the fixture's
  `truncated` (keep the existing marker text `disagrees with the fixture's truncated`); a parse-failure clause is accepted by the grammar and, when the fixture has a `parse_failures` mapping, its numbers must equal
  `failed` and `total` (no baked pilot has one today: say so). WHEN the fixture has NO `symbol_counts` (14 of the 32 fixtures are older: cells_rust, slides_java, cells_go, cells_typescript, cells_python, email_python,
  email_cpp, barcode_python, note_python, page_python, cells_java, 3d_typescript, 3d_java, tex_python) the OLD rule stays exactly as it is (N = all symbol chunks, M = type_count, N < M exactly when truncated) and a
  functions clause on such a fixture is a problem. Extend `baked_self_view` the same way (a first line with a functions clause gives a view with `symbol_counts` {types: Mt, functions: Mf}, `type_count` Mt + Mf and
  `truncated` from the two comparisons; a line without one gives the old view), because the STALE branch of the next cards will meet baked generations of pilots with functions. Keep EVERY existing synthetic test
  green unchanged (their texts use `Kind: class` and a fixture with only type_count) and add at least 12 synthetic tests, with these names where they apply: test_coverage_grammar_accepts_the_types_only_line,
  test_coverage_grammar_accepts_a_functions_clause, test_coverage_grammar_accepts_a_parse_failure_clause, test_coverage_grammar_rejects_a_functions_clause_that_disagrees_with_the_fixture,
  test_coverage_grammar_rejects_a_wrong_types_count, test_coverage_grammar_rejects_two_lines, test_coverage_grammar_rejects_a_missing_line, test_truncated_reading_is_unchanged, plus a functions clause on a fixture
  without symbol_counts, a function chunk counted as a type, a function chunk missing while Mf > 0, and baked_self_view of a line with and without the functions clause.
- >-
  THE NEW TEST FILE tests/deploy/test_served_coverage_matches_fixtures.py (YOU CREATE IT; offline, deterministic, no skips, no network, no docker, no wall clock; at least 170 tests; keep your own small loaders so
  the file does not depend on private helpers of other test files, but READ the fleet module's STALE table through `importlib` / a plain import of `tests.deploy.test_fleet_consistency` with
  `getattr(module, 'STALE_BAKED_PILOTS', {})`, so deleting the table later cannot break this file). THIS IS THE REPOSITORY'S PROOF OF FULL COVERAGE OF THE SHIPPED DATA: for every pilot of the chart it joins the
  committed fixture (tests/fixtures/<key>/api_surface.json) with the committed baked generation (infra/demo-manifests/<family>__<platform>__<sourceKind>/, the generation the active pointer names, documents under
  payload.lexical_index.documents) and asserts that what is served is exactly what was extracted. How types and functions are told apart (read src/foss_mcp/indexing/chunk_builder.py `_format_type_text`, `_entry_fqn`,
  `_unique_fqns`, `_is_test_source`): a symbol chunk is a document whose `FQN:` line does not start with `Example: ` or `Doc: `; its SECOND line is `Kind: <entry kind>`; a FUNCTION chunk is `Kind: function`, every other
  kind is a TYPE chunk; on the fixture side an entry is a function when `kind == 'function'`. Verified by the drafter on the trial snapshot for all 32 pilots (and the 8 removed ones): the multiset of served
  (FQN, Kind) pairs equals the multiset of (`_unique_fqns(entries)`, entry kind) over the fixture entries that are not test-source entries, for every pilot; no FQN is served twice; and for the 18 fixtures that carry
  `symbol_counts` the served type chunks equal symbol_counts.types and the served function chunks equal symbol_counts.functions (pdf_go 259 and 98, pdf_typescript 1333 and 3060, pdf_python 543 and 324, slides_cpp 264 and 91,
  slides_python 1022 and 1, html_python 305 and 18, pdf_cpp 340 and 19, words_python 272 and 119; every other pilot has 0 functions in symbol_counts), while the 14 older fixtures are compared with their own entries
  (cells_go 14 and 17, cells_rust 213 and 8, cells_typescript 108 and 22, cells_python 186 and 18, page_python 146 and 98, barcode_python 52 and 18, 3d_typescript 150 and 3, email_python 60 and 3, note_python 74 and 1, the
  rest 0 functions). Fleet totals: 10,411 type chunks and 3,918 function chunks, 17 pilots with functions. Parametrised over the chart's pilot keys (every id carries the key): `test_fixture_is_complete_and_has_no_test_file_entries`
  (`truncated` is false, `type_count == len(types)`, no entry is a test-source entry, and for a fixture with symbol_counts `types + functions == type_count` and both equal the recount of the entries by kind),
  `test_served_type_chunks_equal_the_fixture_types`, `test_served_function_chunks_equal_the_fixture_functions` (the fixture side is symbol_counts when present, else the recount of the entries; the served side is the
  count of chunks by kind), `test_served_symbol_fqns_are_exactly_the_fixture_entries` (the multiset of served (FQN, Kind) pairs equals the builder's: nothing missing, nothing extra, no duplicate),
  `test_served_coverage_line_states_the_same_counts` (the one API-Coverage line shared by every symbol chunk states `Nt of Mt types` and, when the fixture has functions in symbol_counts, `Nf of Mf functions`, with
  every number equal to the served and fixture counts above, and Nt == Mt, Nf == Mf because nothing is partial; for an older fixture the line is `N of N types` with N = all symbol chunks = type_count). STALE
  PILOTS: for a key in the STALE table (empty today) the fixture comparison is replaced by the baked generation's agreement with its OWN line (served counts by kind equal the numbers the line states) and the test also
  asserts the pilot is really stale (the line differs from the fixture); this branch is covered by synthetic tests only until a later card lists a pilot. Single tests: `test_every_chart_pilot_is_checked` (>= 32 pilots,
  unique keys, each has a fixture file and a scope directory with exactly one generation file and an active pointer naming it), `test_the_function_assertions_are_not_vacuous` (floors, deliberately below the
  measurement because later re-extractions change them: at least 15 pilots have function entries, at least 3,000 function entries and at least 9,000 type entries over the fleet), `test_no_served_symbol_chunk_is_
  without_a_kind_line` (every symbol chunk's second line starts with `Kind: `). ANTI-VACUITY HELPER TESTS (synthetic, same file, at least 12): the served-count helper counts a function chunk and a type chunk
  apart and ignores `Doc: ` and `Example: ` chunks; the multiset check flags a missing function chunk, an extra chunk, a duplicated FQN and a type served as a function; the line parser reads the types-only line, the
  functions clause and the parse-failure clause and flags a malformed line; the stale branch compares with the chunk's own line; the fixture recount ignores nothing it should count. The drafter wrote a prototype of the
  three core checks against the trial snapshot: 120 tests, 119 green, the one red being a removed pilot's old test-file entries, running in 1.0 s.
- >-
  tests/mcp/tools/test_freshness_provenance.py. `test_real_pdf_typescript_generation_reports_both_commits` read a baked generation that mixed c672b39 (symbols) and 155bfc7 (documentation); the baked
  generation is now ONE commit, 155bfc7a33f0ba23fb4252b6ba201828b02a5b9d (the chart pin). Rename it `test_real_pdf_typescript_generation_reports_its_one_commit_at_the_chart_pin` and assert, derived from the
  committed fixture and chart where a number is involved: the commits are exactly {the pin}; the pin's symbol_chunks equal the fixture's type_count (4393 on the trial snapshot) and its documentation plus example chunks
  are at least 1; indexed_source_commit is the pin; the report for the pin is not stale and its reason does not contain `index is mixed`; the report for the OLD commit c672b3918318ccd0c13bc9dc619620cac2674c9e
  (keep TS_SYMBOL_COMMIT as the old, no longer served commit) is stale; with pinned_library_commit equal to the pin `pinned_matches_symbols` is True. The MIXED two-commit behaviour of report_index_freshness stays
  proven by the existing synthetic tests of the file (test_two_commits_split_by_kind_with_exact_counts and the others): confirm they all still pass and say in the report that the mixed branch no longer has a
  real-data test because no pilot is mixed.
- >-
  tests/mcp/tools/test_miss_coverage_note.py. (a) `test_the_lookup_miss_no_longer_speaks_for_the_repository` pins `300 of 901`; pdf/net is complete, so the miss reason still starts with `nothing in the indexed
  documentation` and `coverage_note` is None: assert exactly that, derived with the file's own `_stated_coverage` and `_assert_note` (stated 901 of 901 -> no note), and rename it to say the miss speaks about the index
  only. (b) THE PARTIAL BRANCH LOST ITS REAL DATA: `_assert_note` and the four per-miss tests expect a note only when the generation states N < M, and no baked pilot does any more, so those parametrised tests now only
  prove the complete branch. Add synthetic tests on an in-memory generation (the file already has `_InMemoryStore`, `_docs_store`, `_doc_chunk`; extend or add a small symbol-chunk builder) proving that a
  `search_symbols` miss, a `lookup` miss, a `get_symbol` miss and a `list_members` miss from a generation whose symbol chunks state `API-Coverage: 2 of 5 types` carry a note containing `2 of 5`, that
  `2 of 5 types; 1 of 4 functions` carries a note naming both, and that `5 of 5 types` carries none. Add `test_no_baked_pilot_states_a_partial_index_any_more` (every pilot's stated coverage has indexed == total, using
