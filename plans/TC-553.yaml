purpose: >-
  REQ-G3-008, REQ-G3-005, REQ-G3-001 and REQ-G3-007 (operator decision 2026-10-16: partial indexes are rejected, the shipped data holds the WHOLE public surface of every
  pilot). THE TEST AND DOCUMENT HALF OF THE DATA REFRESH. TC-550 and TC-530 re-extracted the thirteen truncated fixtures; the supervisor re-ingested exactly those thirteen
  pilots on the cluster (pdf_net, words_net, 3d_python, cells_cpp, html_python, pdf_cpp, pdf_go, pdf_java, pdf_python, pdf_typescript, slides_cpp, slides_python,
  words_python), compacted them and committed the refreshed scope directories and root sidecars of infra/demo-manifests as a supervisor data commit that precedes this card.
  The 19 other pilots are untouched byte for byte. This card makes every test and document agree with that new baked data, with NO weakening, and adds the repository's proof of
  FULL COVERAGE of the shipped data. Measured by the drafter on 2026-10-17 on a trial snapshot of the thirteen pilots applied to main da125187 (before TC-551 and TC-552; the
  tree of the 32 remaining pilots is 41,744,019 bytes, 32 generation files, median 763,927, largest 5,098,150 = pdf_java, then pdf_typescript 4,767,300, pdf_net 3,430,234,
  html_python 3,052,169; the budgets TC-551 left are tree 28,000,000 in the compact test and 29,500,000 in the sidecars test, median 710,000, largest 2,950,000), by running every offline test of tests/deploy, tests/infra, tests/poc, tests/config,
  tests/schemas, tests/telemetry, tests/mcp, tests/indexing, tests/extraction and tests/normalization against it (about 10,800 tests in two chunks of about 16 minutes): exactly 10 test
  functions are red, 24 test ids, and nothing else. They are: tests/deploy/test_compact_demo_manifests.py::test_real_tree_is_within_the_lean_budget and
  tests/deploy/test_demo_manifests_sidecars.py::test_the_whole_tree_is_within_the_size_budget (the tree grew from 26.9 MB to about 41.7 MB); in
  tests/deploy/test_fleet_consistency.py test_fixture_commit_equals_the_pin_equals_every_source_commit_line[pdf_typescript], test_every_commit_exception_still_applies,
  test_every_stale_baked_pilot_still_applies and test_api_coverage_lines_are_present_and_honest for the eight pilots that have functions (slides_python, pdf_typescript, pdf_go,
  pdf_cpp, words_python, pdf_python, slides_cpp, html_python: the new baked line is `API-Coverage: 259 of 259 types; 98 of 98 functions`, which the test grammar `N of M types`
  rejects as malformed, and the old comparison counts function chunks as types); tests/mcp/tools/test_freshness_provenance.py::test_real_pdf_typescript_generation_reports_both_commits
  (the baked pdf/typescript generation is now ONE commit, 155bfc7); tests/mcp/tools/test_miss_coverage_note.py::test_the_lookup_miss_no_longer_speaks_for_the_repository (pins
  `300 of 901`, pdf/net is now 901 of 901, so the miss carries no note); tests/mcp/tools/test_product_reference_baked_contract.py::
  test_limitations_is_never_no_data_source_when_the_index_has_the_section for 3d_python, html_python, pdf_cpp, pdf_go, pdf_java, pdf_net, pdf_python and words_python (after TC-517
  the generated lead-in sentence and the real limitations text are ONE chunk, and the test discards every chunk that starts with the lead-in) and test_cpp_installs_are_the_readme_recipe[cells_cpp].
  Three facts the tests cannot see are also wrong now and are fixed here: scripts/poc/pilot_workflow_proof.py check_12 compares the served `total_types` with the fixture's
  `type_count`, which counts types PLUS functions, so the live proof fails check 12 for exactly the eight pilots that have functions (served total_types equals the fixture's
  symbol_counts.types in every case: pdf_go 259, pdf_typescript 1333, pdf_python 543, slides_cpp 264, slides_python 1022, html_python 305, pdf_cpp 340, words_python 272);
  README.md and docs/RELEASE.md still tell the peer that the index of the largest libraries is partial and that pdf/java holds 300 of 1,239 types (tests/deploy/test_readme_matches_release.py
  pins that sentence), that the 300-type cap may still hide central types (TC-402, TC-403) and that pdf/typescript has a MIXED index at two commits; and the lookup-miss coverage
  note, which was proven only on real PARTIAL data, now has no partial pilot left to be proven on. What this card does NOT change: src/ (it is a test, script and document card;
  if a test failure proves a product defect, STOP and report it), any fixture, any baked file of infra/demo-manifests, the chart, docker-compose, any furnished page, ops/, project/,
  plans/, evidence/, schemas/, docs/DECISION_LOG.md, docs/REVIEW_LEDGER.md, scripts/release/build_review_ledger.py and tests/e2e.
