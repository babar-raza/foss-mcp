    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: the regenerated fixtures and rendered chunks (a) list operators and explicit/implicit conversions with their operand and return types, (b) list public non-readonly and readonly fields, (c)
  render method type parameters and constraints and type-level constraints, (d) resolve a file-level `using X = T;` alias to its target in every signature that uses it, and where the alias is conditional
  per target framework serve the target for the framework the packaged library is built for (or the alias name plus an explicit marker), (e) keep `Foo` and `Foo<T>` as two symbols with distinct FQNs (`Foo`
  and `Foo<T>`), (f) split generic base lists at top-level commas only, (g) index delegate types and events, (h) treat a type declared only under a non-default preprocessor branch as not public, (i) render
  implicit default constructors for non-static, non-abstract classes without a declared constructor, (j) list record positional properties, constructor and Deconstruct. INDEPENDENT ORACLE: in the tests,
  compile tiny C# sources with the repository's pinned .NET SDK (dotnet build in a temp dir) or, where the SDK is unavailable offline, use hand-written upstream-shaped snippets run through the extractor
  and compare with expectations written from the C# language rules; the real pins listed in the purpose (TriMesh, SdiImageFormat, Image alias, HtmlSaveOptions.FontSavingMode, Vector3 operator+) are asserted
  on the regenerated real fixtures.
- >-
  RE-PINS as in TC-557 (comment `TC-558: <old> -> <new>`, STALE_BAKED_PILOTS entries until the supervisor re-ingests).
