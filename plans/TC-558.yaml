    python -X utf8 -c "import pathlib;p=pathlib.Path('src/foss_mcp/extraction/tree_sitter_engine/api_surface.py');s=p.read_text(encoding='utf-8');old='CSHARP_INDEX_OPERATORS = True';assert s.count(old)==1;p.write_text(s.replace(old,'CSHARP_INDEX_OPERATORS = False'),encoding='utf-8')"
