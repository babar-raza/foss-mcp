  anchor: >-
    ## 2026-10-17 — Round-3 independent review of the shipped image: 82 findings registered, nothing executed (operator, supervisor)
  sha256: c2056b11a13e5b18cda7e522027fb5eb0102edcef2f99f6c7e7ce0ee5c4b4e5b
inputs:
- >-
  READ FIRST: docs/ROUND3_REVIEW.md (the rows this card closes, with the investigators' evidence ids; the evidence itself is kept by the supervisor outside the repository and can be requested), then the
  code named in write_paths. Activate the toolchain (scripts/toolchain/activate.ps1) in the SAME shell command as every python or pytest call. Never print an environment value. Verify every name against
  the merged code and list differences in your report. Run ruff format and ruff check on every Python file you change. Source truth wins over fixtures: every new regression test must take its expectation
  from an INDEPENDENT oracle (the upstream source at the pinned commit read with the language's own parser or compiler, a compiled library's reflection, or a hand-written upstream-shaped snippet), never
  from the extractor's own output or a committed fixture alone. A re-extraction of a fixture is regenerated with the CLI at the chart-pinned commit exactly as card TC-550 describes; the extraction needs
  the network, and a refused clone is BLOCKED_EXTERNAL, not a reason to retry in a loop. Do not edit plans/, project/, ops/, evidence/, schemas/, docs/ (except where write_paths names a docs file), do not
  run docker or a cluster command.
- >-
  ACCEPTANCE: the regenerated fixtures and rendered chunks (a) list operators and explicit/implicit conversions with their operand and return types, (b) list public non-readonly and readonly fields, (c)
  render method type parameters and constraints and type-level constraints, (d) resolve a file-level `using X = T;` alias to its target in every signature that uses it, and where the alias is conditional
  per target framework serve the target for the framework the packaged library is built for (or the alias name plus an explicit marker), (e) keep `Foo` and `Foo<T>` as two symbols with distinct FQNs (`Foo`
  and `Foo<T>`), (f) split generic base lists at top-level commas only, (g) index delegate types and events, (h) treat a type declared only under a non-default preprocessor branch as not public, (i) render
  implicit default constructors for non-static, non-abstract classes without a declared constructor, (j) list record positional properties, constructor and Deconstruct. INDEPENDENT ORACLE: in the tests,
  compile tiny C# sources with the repository's pinned .NET SDK (dotnet build in a temp dir) or, where the SDK is unavailable offline, use hand-written upstream-shaped snippets run through the extractor
  and compare with expectations written from the C# language rules; the real pins listed in the purpose (TriMesh, SdiImageFormat, Image alias, HtmlSaveOptions.FontSavingMode, Vector3 operator+) are asserted
  on the regenerated real fixtures.
- >-
  RE-PINS as in TC-557 (comment `TC-558: <old> -> <new>`, STALE_BAKED_PILOTS entries until the supervisor re-ingests).
- >-
  FINALISATION NOTES (supervisor, 2026-10-19). (1) Mandated name: in src/foss_mcp/extraction/tree_sitter_engine/api_surface.py the exact line `CSHARP_INDEX_OPERATORS = True`, a real switch: when False operators
  and conversions are skipped exactly as before this card. The other acceptance items have their own tests. (2) The acceptance's oracle sentence is replaced: the new tests must NOT run dotnet or any SDK
  (the SDK is not reliable on this host); the oracle is a hand-written C# source whose answer follows from the C# language rules, written in the test and run through the extractor offline, plus assertions
  on the committed real fixtures. Real pins to assert on the regenerated fixtures (the round-3 audit read them from the compiled assemblies; verify each against the clone at the chart pin and report any
  that is wrong): 3d/net `TriMesh` and `TriMesh<T>` are two symbols with distinct FQNs; 3d/net `Vector3` lists `operator +`; the operator/conversion count is about 67 for 3d/net and 17 for pdf/net (count
  them directly on the cloned source with a regex or tree walk in the test and assert equality or a stated floor); pdf/net `HtmlSaveOptions.FontSavingMode` is served; pdf/net `SdiImageFormat` resolves in
  the 14 overloads that use it; words/net `Image` alias resolves to the SkiaSharp bitmap type or carries an explicit marker; pdf/net generic base lists (8) and words/net (4) are not cut at the comma; delegates
  (pdf/net 14, 3d/net 3) and events (pdf/net 7) are indexed; the three words/net types declared under `#if CPLUSPLUS public #else internal` are not served as public; implicit default constructors render
  for pdf/net, words/net, slides/net and cells/net classes without a declared constructor; email/net record members are listed. (3) RE-EXTRACTION (needs the network; clones over https, no token; a refused
  clone or rate limit is BLOCKED_EXTERNAL with the resume predicate `git fetch of <repo>@<sha> succeeds`, never a retry loop): for each pilot in 3d, cells, email, imaging, pdf, slides, words run from the
  repository root `python -X utf8 -m foss_mcp.extraction.run_extraction config/products/<family>/net.yaml tests/fixtures/<family>_net/api_surface.json --commit <pin> --keep-names-from tests/fixtures/furnished/<family>_net/pages/_index.md
  --max-types 100000` where <pin> is `ingestion.pilots[].library.commit` of infra/helm/foss-mcp/values.yaml for that pilot (never retype a commit). Each prints `wrote <path> (<bytes> bytes); <kept>/<total>
  types; commit <sha>`: kept must equal total and the commit must equal the pin; normalise CRLF to LF. Every regenerated fixture carries extractor_version 5, symbol_counts, counts and parse_failures. At
  registration: 3d/net 293 types, cells/net 98, email/net 29, imaging/net 3, pdf/net 901, slides/net 264, words/net 618. words/net alone needs a long clone (about 8 minutes): run it as its own command with
  a bounded wait. Record old and new counts and byte sizes in the report. The chart and compose are not in write_paths: chart caps are 300 (3d, cells, email, imaging, slides), 901 (pdf), 618 (words); if
  a measured total exceeds a cap, report it. (4) EXISTING TESTS: the per-pilot .NET tests, test_api_surface_csharp*.py, test_central_classes_dotnet.py, test_chunk_builder.py, test_chunk_builder_honesty.py
  and test_build_chunks.py may pin an old fact; change only such an assertion with the comment `TC-558: <old> -> <new>`, list each with its reason, never delete, skip or loosen. tests/fixtures/readme_identifier_allowlist.json
  only with the helper `python -X utf8 -m tests.extraction.docs_identifiers --write`; only keys of these seven pilots may change. If a test outside write_paths fails, stop and report its name and the pinned
  fact. (5) TEST COUNTS: min_tests is 535 for EACH check. The first check collects 509 existing tests (the thirteen existing files it names; the two new files do not exist yet) plus the at least 26 you
  add in the two new files (at least 18 extractor tests in test_round3_dotnet_fidelity.py and at least 8 renderer tests in test_chunk_builder_round3_dotnet.py); the second check collects well over 2,500.
- >-
  PRE-EMPTED OUT-OF-SCOPE PINS (supervisor, 2026-10-19, learned from TC-533, whose worker met eight failures outside its write_paths). A regeneration of your fixtures may legitimately move facts pinned
  by these files, now in your write_paths: tests/extraction/test_reextracted_uncapped.py (chart cap equality, SIZE_FLOOR_BYTES and MEMBER_FLOOR per pilot: re-measure only the pilots of this card, floor
  = measured value rounded down to a round number, comment <card>: <old> -> <new> with the reason), tests/extraction/test_run_extraction_coverage_policy.py, tests/deploy/test_served_coverage_matches_fixtures.py
  (MIN_FUNCTION_ENTRIES and similar non-vacuity floors: set just below the new measured total, still well above zero), tests/deploy/test_served_provenance.py and tests/mcp/tools/test_freshness_provenance.py
  (these compare the BAKED generation with the fixture; the baked data stays stale until the supervisor re-ingests, so for a pilot listed in STALE_BAKED_PILOTS of tests/deploy/test_fleet_consistency.py
  do not assert the fixture-dependent comparison, but keep everything that does not depend on the fixture; never skip, delete or xfail), README.md (only the per-pilot type/function figures that tests/deploy/test_readme_matches_release.py
  compares), and infra/helm/foss-mcp/values.yaml, docker-compose.yml and src/foss_mcp/extraction/run_extraction.py RECOMMENDED_MAX_TYPES ONLY if a measured total no longer equals the one cap number (single-line
  replacements; chart, compose and extractor must carry the same number). Run the wider offline suites (tests/indexing, tests/infra, tests/deploy, tests/mcp and the top-level tests/test_*.py, usual -k filter)
  before you report: ALL must be green, and report each file of this paragraph that you changed with its reason.
- >-
  Also in write_paths now: tests/infra/test_helm_chart.py (its local PILOTS table pins each pilot's maxTypes) and tests/infra/test_helm_pilots_match_compose.py: re-pin a pilot's maxTypes there only if you
  changed that pilot's cap in the chart, compose and RECOMMENDED_MAX_TYPES.
- >-
  FORMAT GATE (supervisor, learned from TC-533): the review runs `ruff format --check` WITHOUT --force-exclude on every file you changed, and the repo config excludes the tree_sitter_engine directory only
  for directory-wide runs. Before you commit, run `ruff format <each changed file, named explicitly>` and `ruff format --check` / `ruff check` on the same explicit list, including src/foss_mcp/extraction/tree_sitter_engine/api_surface.py
  and lang/*.py. If the formatter would rewrite large regions you did not touch, report it instead of committing.
- >-
  Also in write_paths: tests/extraction/tree_sitter_engine/test_api_surface_other_languages.py (language-sample tests that write sources under a file name; re-pin only what your extractor change legitimately
  moves, TC comment, never weaken).
- >-
  Also in write_paths (learned from TC-557): the 'other languages are unchanged' extractor tests (test_api_surface_go_fidelity.py, test_ts_fidelity.py, test_api_surface_csharp_signatures.py, test_api_surface_java.py),
  tests/infra/test_round3_install_sections.py (pins rendered chunk lines of pdf/java) and tree_helpers.py. Re-pin only what your change legitimately moves, with a TC comment; never weaken.
- >-
  REWORK AMENDMENT (supervisor, 2026-10-20). The three tests of your report are accepted into write_paths: tests/indexing/test_chunk_builder_coverage_line.py (901 -> 915), tests/indexing/test_chunk_builder_python_signatures.py
  (300 of 901 types -> 300 of 915 types), tests/release/test_claims_ledger.py::test_real_tree_pdf_net_is_pinned_to_the_measured_chunks (fixture symbol_counts types 901 -> 915; the baked chunk figures it
  also pins stay, they describe the baked data until the re-ingest). Each re-pin carries a TC-558: <old> -> <new> comment. Your other decisions are accepted: the six lowered doc-ratio floors in test_reextracted_dotnet.py
  are accepted PROVISIONALLY because the denominator grew with members that have no source doc comment and no documented member was lost (put that reason in each floor comment, as you did); the record ==
  / != members are accepted. Rebase onto the new issue revision, re-run both checks twice, tests/release, the wider suites; ruff format on each changed file named explicitly; normalise any CRLF the negative
  control left; report the head.
- >-
  SECOND REWORK AMENDMENT (supervisor, 2026-10-20): the review passed every gate, then its related-tests step found tests/normalization/test_citation.py::test_oq_001_the_real_805_classes_claim_has_no_confident_corroborating_count
  (known_counts['types'] == 901, now 915). The file is in write_paths: re-pin that figure to 915 with a TC-558: 901 -> 915 comment (the pdf/net fixture now serves 14 delegate types). Rebase onto the new
  issue revision, re-run tests/normalization, check 1 once more, ruff format on the file named explicitly, report the head.
