id: TC-558
gate: G3
lane: extraction
purpose: >-
  REQ-G3-009 (rows RD3-043, RD3-044, RD3-047, RD3-050 to RD3-055). .NET EXTRACTION FIDELITY for 3d/net, cells/net, email/net, imaging/net, pdf/net, slides/net, words/net. Measured against the compiled assemblies
  (MetadataLoadContext reflection) at the indexed commits: operators and conversions never served (0 of 92: 3d/net 67, pdf/net 17), public mutable fields never served (3d/net 56, pdf/net 81 incl. the 23
  HtmlSaveOptions options; `search_symbols FontSavingMode` misses), generic method type parameters dropped (9; `Node.GetEntity<T>()` served `GetEntity() -> T`, CS0411), `using` aliases served unresolved
  (words/net `Image = SkiaSharp.SKBitmap` per target framework, CS1503; pdf/net `SdiImageFormat` in 14 overloads, CS0103), a generic and a non-generic type with the same name merged (3d/net TriMesh and
  TriMesh<T>, CS1501), generic base lists cut at the comma (pdf/net 8, words/net 4), delegates (pdf/net 14, 3d/net 3) and events (pdf/net 7) not indexed, three words/net types in `#if CPLUSPLUS public #else
  internal` treated as public, implicit default constructors not rendered (pdf/net 139, words/net 134, slides/net 70, cells/net 8), email/net record members lost (34). Verified faithful and to be preserved:
  return types, static/abstract/override/virtual flags, ref/out/params, default values, indexers, overload sets (Scene.Open 9, PdfConverter.GetNextImage 22), inheritance (0 chain violations). REGISTERED
  AS A DRAFT on 2026-10-17 from docs/ROUND3_REVIEW.md: before dispatch the supervisor re-reads this card against the merged code, calibrates min_tests (it applies to EACH check), replaces the placeholder
  negative control with a real falsifier that has no backslash, and verifies every file named in write_paths (Supervisor rule 5). Nothing here has been executed.
