name: CI

# Runs this project's own local pre-push gate (scripts/ci_check.sh) on every push and
# pull request against main, so GitHub enforces exactly what a contributor already runs
# before pushing - lint, format, typecheck, pytest, and gatectl validate - with no
# separate CI-only step list to silently drift out of sync with the local one.
#
# tests/e2e and tests/infra are excluded from THIS run only, via PYTEST_ADDOPTS, because
# both need Docker and/or real network clones that a GitHub-hosted runner cannot reliably
# provide; scripts/ci_check.sh itself is left untouched so a contributor's own local run
# still exercises the full suite. This is the same scope a fast local sanity pass already
# uses.
#
# Dependencies install from requirements.lock with --require-hashes: every dependency and
# its transitive closure is pinned by exact sha256, so nothing unpinned or substituted can
# reach this runner (see docs/DECISION_LOG.md's 2026-09-11 requirements.lock entry).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 clone: ops/tests/test_cardlint.py replays a real
      # historical card against the commit it was authored at (e607ceff), which a shallow clone
      # does not contain ("fatal: invalid object name").
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # AGENTS.md: "Run git config core.hooksPath .githooks once per clone. Versioned hooks are
      # inert without it." tests/test_githooks.py asserts it, and a CI clone has not run it.
      - name: Point git at the versioned hooks
        run: git config core.hooksPath .githooks

      - name: Install dependencies (hash-verified)
        run: pip install --no-cache-dir --require-hashes -r requirements.lock

      - name: Run local CI-equivalent checks (lint, format, typecheck, pytest, gatectl)
        env:
          PYTEST_ADDOPTS: "--ignore=tests/e2e --ignore=tests/infra"
        run: bash scripts/ci_check.sh
