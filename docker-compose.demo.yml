name: foss-mcp-demo

services:
  pdf-net:
    image: "${FOSS_MCP_DEMO_IMAGE:?set FOSS_MCP_DEMO_IMAGE to the demo image reference}"
    environment:
      FOSS_MCP_PILOT: pdf/net
    ports:
      - "127.0.0.1:${FOSS_MCP_DEMO_PORT_PDF_NET:-8101}:8080"
    profiles: [pdf, all]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readyz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

