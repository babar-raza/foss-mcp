#
# Standalone demo: 40 services, one per pilot, all running the same image (FOSS_MCP_DEMO_IMAGE, required).
# Each service differs only in FOSS_MCP_PILOT, which the image's entrypoint turns into the server's
# identity. Start only the pilots you want:
#
#     export FOSS_MCP_DEMO_IMAGE=<registry>/foss-mcp-serving:<demo tag>
#     docker compose -f docker-compose.demo.yml up -d pdf-net slides-python
#     docker compose -f docker-compose.demo.yml --profile pdf up -d     # a whole family
#     docker compose -f docker-compose.demo.yml --profile all up -d     # all 40 pilots
#
# Profiles: each service is in its family's profile (3d, barcode, cells, email, html, imaging, jmap, note, page, pdf, slides, tex, words) and in 'all'.
# Limits per container: mem_limit 192m, cpus 0.25, pids_limit 256, read-only root
# filesystem with a /tmp tmpfs, cap_drop ALL, no-new-privileges. Healthcheck: /readyz.
#
# Host ports, loopback only. Pilot N (1-based, in chart order) is published on 127.0.0.1:8100+N;
# override one with FOSS_MCP_DEMO_PORT_<FAMILY>_<PLATFORM>. The MCP endpoint is http://127.0.0.1:<port>/mcp,
# readiness is /readyz.
#
#   8101  pdf/net  (service pdf-net)
#   8102  slides/python  (service slides-python)
#   8103  pdf/typescript  (service pdf-typescript)
#   8104  pdf/go  (service pdf-go)
