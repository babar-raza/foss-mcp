# The Python oracle's machine-readable public-API definition (O2, REQ-G3-012, G3/TC-676).
#
# This describes the REAL, CURRENT rule `scripts/release/source_differential.py` already applies
# for Python today - never an aspirational one. `_is_public_python_name` loads this file's
# `visibility` section (private_prefix / dunder_exception) and applies it generically, in place of
# the hardcoded one-liner it used to carry; see that function and its wiring for the exact logic.
# `scope_roots`, `excluded_dirs`, `kind_model` and `member_kinds` below document, as reviewable
# data, the rest of `enumerate_python`'s and `_python_symbol_from_classdef`'s real, already-shipped
# behavior; this card does not additionally wire THOSE fields into production code (only
# `visibility` is wired - see the card and the oracle production-wiring test for why: the card's
# own scope is "wire it into source_differential.py's production decision for
# _is_public_python_name" alone).
#
# Consumed by:
#   - scripts/release/source_differential.py's own production code (`visibility` only)
#   - tests/release/test_oracle_public_api_definition.py (schema validation + identical-behavior
#     measurement, as the oracle's own ground truth)
#   - tests/extraction/tree_sitter_engine/test_python_surface_public_api_definition.py (as a
#     ground-truth fixture for asserting agreement AND the real, disclosed dunder divergence
#     against the EXTRACTOR's independent rule - never imported by the extractor's own production
#     code; see plans/TC-676.yaml's SCOPE NOTE)
language: python

# Python has no sub-package scoping concept of its own in this oracle: enumerate_python walks
# every *.py file under the cloned library root and collects module-level ClassDefs directly -
# there is no narrower "scope root" glob to express.
scope_roots: module-level

# The real, literal set enumerate_python checks via
# `any(part in {"tests", "test", "examples", "docs"} for part in path.parts)`.
excluded_dirs:
  - tests
  - test
  - examples
  - docs

visibility:
  # `_is_public_python_name`'s real body: `not name.startswith("_") or (name.startswith("__") and
  # name.endswith("__"))` - leading underscore is private UNLESS the name is a dunder.
  private_prefix: "_"
  # Every dunder (`__repr__`, `__eq__`, `__init__`, ... - any name starting and ending with "__")
  # is public under the oracle's real rule today, with no exceptions. This is the exact rule the
  # REAL, MEASURED DISCREPANCY against the extractor's own PUBLISHED_DUNDERS allow-list (see
  # plans/TC-676.yaml) is measured against - the oracle says "all", the extractor effectively says
  # "only __init__, __enter__, __exit__, __aenter__, __aexit__".
  dunder_exception: all

# The real symbol kinds enumerate_python/_python_symbol_from_classdef produce today: a plain class,
# or an Enum/IntEnum/Flag/IntFlag/StrEnum subclass.
kind_model:
  - class
  - enum

# The real member kinds _python_symbol_from_classdef produces today: an ordinary method (including
# __init__, since it is public under dunder_exception: all above), or an enum value assignment.
member_kinds:
  - method
  - enum_value

# Optional, future-language fields. Python's own oracle does not model any of these distinctly
# today, so each is explicitly null (never silently omitted) with a one-line reason:
inheritance: null  # enumerate_python collects only each class's OWN body members; inherited-member
                    # resolution for the diff itself lives in diff_language/compute_canonical_identities
                    # (O1, TC-623/TC-624), not in the per-symbol oracle definition this file describes.
constructors: null  # __init__ is treated as an ordinary "method" member (see member_kinds above),
                     # made public by the dunder_exception rule above - there is no separate
                     # constructor shape in the Python oracle today.
indexers: null  # Python has no oracle-level "indexer" member kind; __getitem__/__setitem__ are
                # ordinary dunders, governed by the same visibility.dunder_exception rule as any
                # other dunder, not by a distinct indexer concept.
bean_properties: null  # The Python oracle does not detect @property getter/setter pairs as a
                        # distinct accessor-pair shape; every class member it collects is "method"
                        # or "enum_value" per member_kinds above.
overloads: null  # The Python oracle does not group multiple signatures under one name; Python has
                  # no native overload set for the oracle to resolve.
