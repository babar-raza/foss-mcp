schema_version: 1
pilot: slides_net
defects:
- id: SLIDES-NET-006
  subject:
    kind: method
    refs:
    - Aspose.Slides.Foss.ILayoutSlide
    - Aspose.Slides.Foss.LayoutSlide
  applies_to:
    package_versions:
    - 26.9.0
  summary: ILayoutSlide.MasterSlide is null for a freshly-created presentation's default layout,
    and after a save/reopen round trip, even though the master exists and the saved package's
    own relationship links it.
  user_action: Do not rely on ILayoutSlide.MasterSlide to navigate from a layout to its master
    in Aspose.Slides.Foss 26.9.0; it is always null even when Presentation.Masters and the
    saved OOXML relationship are both correct.
  evidence:
    repro: A freshly-created Presentation's LayoutSlides[0].MasterSlide was null even though
      Presentation.Masters.Count was 1; after Save and reopen it was still null, while the
      saved package's slideLayout1.xml.rels correctly linked to slideMaster1.xml.
    verified_on:
      package: Aspose.Slides.Foss
      version: 26.9.0
      date: '2026-10-29'
  status: open
- id: SLIDES-NET-007
  subject:
    kind: method
    refs:
    - Aspose.Slides.Foss.IShape
    - Aspose.Slides.Foss.Shape
    - Aspose.Slides.Foss.IPlaceholder
    - Aspose.Slides.Foss.Placeholder
  applies_to:
    indexed_commit: 86c441b5d81e707f2ea9e01b197dbb6ff7a3859b
  summary: IShape.Placeholder at commit 86c441b5 is null for every shape and nothing ever creates a Placeholder;
    IPlaceholder and Placeholder declare no members, so a placeholder can be neither detected nor read.
  user_action: 'Do not use IShape.Placeholder to detect or read a placeholder shape: it is always null
    and Placeholder exposes no type or index. Inspect the shape''s Name and text frame, or the p:ph element
    in the saved slide XML, instead.'
  evidence:
    repro: 'Cloned Aspose.Slides-FOSS-for-.NET at commit 86c441b5 and read the C# source statically (no
      upstream code was executed in this pass): Shape.cs line 50 is ''public virtual IPlaceholder? Placeholder
      => null;'', Connector.cs overrides it with ''=> null'', no other class overrides it, ''new Placeholder''
      appears nowhere under src, and IPlaceholder.cs and Placeholder.cs have empty bodies.'
    verified_on:
      package: Aspose.Slides.Foss
      version: 86c441b5d81e707f2ea9e01b197dbb6ff7a3859b
      date: '2026-11-23'
  status: open
