schema_version: 1
pilot: words_python
defects:
- id: WORDS-PY-008
  subject:
    kind: method
    refs:
    - aspose.words_foss.document.Document
  applies_to:
    package_versions:
    - 26.7.0
  summary: Document.get_text() in aspose-words-foss 26.7.0 claims in its docstring that 'Tables are
    included with cell text' but returns body-paragraph text only, silently dropping all table cells
    and header/footer text.
  user_action: Do not rely on Document.get_text() to include table cell text or header/footer text;
    it returns only body-paragraph text (light_document_model.Document.text), despite the method's own
    docstring.
  evidence:
    repro: Built a document with a heading, a paragraph, a 2x2 table, and header/footer text; get_text()
      after save+reload returned only the heading and paragraph text, with the table cells and header/footer
      entirely absent; zipfile inspection confirmed the table and header/footer XML genuinely exist
      in the saved DOCX.
    verified_on:
      package: aspose-words-foss
      version: 26.7.0
      date: '2026-10-29'
  status: open
- id: WORDS-PY-013
  subject:
    kind: method
    refs:
    - aspose.words_foss.Document
    - aspose.words_foss.document.Document
    - aspose.words_foss.light_document_model.Document
  applies_to:
    package_versions:
    - 26.7.0
  summary: Document.page_count in aspose-words-foss 26.7.0 is a plain field (light_document_model.Document.page_count,
    default 0) that nothing in the package ever assigns; it stays 0 even after a real multi-page save to PDF.
  user_action: Do not rely on Document.page_count for the real number of pages a document will render to, before
    or after save() - it is always 0 in this version. Render to PDF and count the real output pages (for example
    with an independent PDF-page-counting library) if the real page count is needed.
  evidence:
    repro: 'Built a real 400-paragraph plain-text document (far more than fits on one rendered page), loaded it
      via Document(path), and read page_count both before and after doc.save("out.pdf", SaveFormat.PDF): both
      reads returned 0. Independently confirmed via pypdf that the real saved PDF has 26 pages, proving genuine
      multi-page pagination occurred while page_count never reflected it. Root cause confirmed by reading the
      installed package''s own source: document.py''s page_count property (docstring: "Estimated page count")
      is a one-line passthrough, `return self.light_document_model.page_count`; light_document_model.py declares
      `page_count: int = 0` as a plain pydantic field with no validator or computed-field decorator; a whole-package
      grep for the literal string "page_count" across every installed .py file finds only these two sites - no
      reader, writer, or converter module ever assigns to it. The real per-page pagination the PDF export genuinely
      performs (pdf_writer/paragraph_renderer.py and page_bands.py call the underlying PDF library''s own
      add_page()/page_no() repeatedly while laying out content) is tracked entirely inside the PDF writer''s own
      state and is never written back onto the light document model''s page_count field.'
    verified_on:
      package: aspose-words-foss
      version: 26.7.0
      date: '2026-11-12'
  status: open
- id: WORDS-PY-004
  subject:
    kind: class
    refs:
    - aspose.words_foss.md_import.document_builder.MarkdownDocumentBuilder
    - aspose.words_foss.md_import.MarkdownDocumentBuilder
    - aspose.words_foss.md_import.document_builder.HtmlInsertOptions
    - aspose.words_foss.md_import.HtmlInsertOptions
  applies_to:
    package_versions:
    - 26.7.0
  summary: aspose-words-foss 26.7.0 has no DocumentBuilder class (the .NET/Java authoring entry point);
    MarkdownDocumentBuilder and HtmlInsertOptions are internal Markdown-import helpers, not a general
    document-authoring API.
  user_action: Do not look for DocumentBuilder in the Python edition. Load an existing file with Document(path)
    and edit it, or build content as light_document_model objects (Document, Section, Paragraph, Run,
    Table) and write them with aspose.words_foss.docx_writer.LdmDocxWriter; Document() with no source
    holds no model (its light_document_model raises ValueError).
  evidence:
    repro: 'Package check: pip download aspose-words-foss==26.7.0 finds no distribution on PyPI, so the
      source was read from the upstream repository at the indexed commit 2d2efee2 (pyproject.toml and
      aspose.words_foss.__version__ both say 26.7.0). An ast.parse scan of every .py file under aspose/
      finds no class, function or assignment named DocumentBuilder, and no file is named for it; aspose.words_foss.__all__
      is Document, SaveFormat, LoadFormat, LoadOptions, MarkdownLoadOptions, NodeType, loading, saving.
      The only matches for the word are md_import/document_builder.py, whose docstring calls MarkdownDocumentBuilder
      a "minimal LDM-facing analogue" of Aspose.Words'' DocumentBuilder used by MarkdownReaderContext
      (a cursor with write/writeln/insert_image over a fresh ldm.Document), and its HtmlInsertOptions
      flags. Document.__init__ with no source leaves _document None and light_document_model then raises
      ValueError("No document loaded. Provide a filepath to Document()."); Document._save_as_docx writes
      through LdmDocxWriter(options).write(ldm.Document, path). Static source read only - the upstream
      code was not executed. The sibling words/net pilot does ship a real Aspose.Words.DocumentBuilder
      (round-2 WORDS-PY-004 / RD2-278).'
    verified_on:
      package: aspose-words-foss
      version: 26.7.0
      date: '2026-11-21'
  status: open
- id: WORDS-PY-009
  subject:
    kind: method
    refs:
    - aspose.words_foss.light_document_model.Paragraph
  applies_to:
    package_versions:
    - 26.7.0
  summary: Paragraph(children=[Run(...)]) in aspose-words-foss 26.7.0 works only through a private pydantic
    wrap-validator onto a private _children slot; Paragraph declares no public children field, so the
    idiom is unsupported.
  user_action: 'Treat Paragraph(children=[...]) as an unsupported private idiom that can change in any
    release: entries that are not Run, Shape, BookmarkStart/End or FieldStart/Separator/End are silently
    dropped. Re-check it against the installed version before building on it.'
  evidence:
    repro: 'Read light_document_model.py statically at the indexed commit 2d2efee2 of Aspose.Words-FOSS-for-Python
      (pyproject.toml says 26.7.0, which is not on PyPI; no upstream code was executed in this pass):
      Paragraph keeps its content in ''_children: list[ChildNode] = PrivateAttr(...)'', its class docstring
      says the collection ''is intentionally not part of the public attribute surface'', and a model_validator(mode=''wrap'')
      named _absorb_children pops ''children'' from the constructor input and installs it on _children,
      dropping any entry that _coerce_child_node maps to None. Also disclosed in get_product_reference
      limitations by the 2026-11-14 known_hazards entry in config/products/words/python.yaml, which records
      a direct reproduction on the real 26.7.0 source.'
    verified_on:
      package: aspose-words-foss
      version: 26.7.0
      date: '2026-11-23'
  status: open
