  summary: 39 rendering-engine type names resolve via get_symbol/search_symbols as confident real classes
    but are absent from the published org.aspose:aspose-3d-foss 26.5.0 jar; present only in the indexed
    source commit, a commercial-only module.
  user_action: Do not trust a confident get_symbol/search_symbols hit alone for a 3d/java rendering-related
    type name; cross-check it exists in the real published jar (for example via javap or jar tf) before
    writing code against it, since it will not compile or resolve against the real artifact.
  evidence:
    repro: Round-2 (docs/round2/issues.json, id 3D-JAVA-001) names 39 candidate type names in its own
      repro field (Renderer plus the 38 named in its own Repeat for sentence), though its prose says 37
      - a transcription discrepancy, corrected here by re-verifying every one of the 39 names it actually
      lists. Resolved org.aspose:aspose-3d-foss:26.5.0 from Maven Central (the only version published
      - confirmed via its real maven-metadata.xml), ran jar tf for the real top-level class list (204
      entries, 201 under com.aspose.threed) and javap -public per candidate name; all 39 are class not
      found against the real jar, while a real type (Mesh) resolves correctly as a sanity check. All 39
      ARE present in this repository own indexed infra-demo-manifests corpus for 3d-java (get_symbol returns
      found true with zero caveat for Renderer, ShaderSource and CShape against that real corpus on current
      main, before this fix).
    verified_on:
      package: org.aspose:aspose-3d-foss
      version: 26.5.0
      date: '2026-11-06'
  status: open
- id: 3D-JAVA-014
  subject:
    kind: method
    refs:
    - com.aspose.threed.Scene
  applies_to:
    package_versions:
    - 26.5.0
  summary: Scene.open() on a syntactically valid, non-empty OBJ file in aspose-3d-foss 26.5.0
    throws no exception but imports a Scene with 0 meshes and 0 geometry - a silent import
    failure, not a parse error.
  user_action: Do not trust Scene.open()/Scene.fromFile() succeeding (no exception) as proof an
    OBJ import produced real geometry in aspose-3d-foss 26.5.0; check the returned Scene's own
    mesh/entity count after loading an OBJ file before relying on it.
  evidence:
    repro: Called Scene.open() on a valid OBJ file containing real vertex and face data (confirmed
      parseable by an independent OBJ reader); the call returned normally with no exception, but
      the resulting Scene had 0 meshes and 0 total geometry - the same silent-data-loss shape this
      pilot's already-disclosed export bugs (3D-JAVA-002/003/004/006) show on the save side, now
      confirmed on the import side too.
    verified_on:
      package: org.aspose:aspose-3d-foss
      version: 26.5.0
      date: '2026-11-02'
  status: open
- id: 3D-JAVA-006
  subject:
    kind: method
    refs:
    - com.aspose.threed.Mesh
  applies_to:
    package_versions:
    - 26.5.0
  summary: 'Mesh.triangulate() is a no-op in aspose-3d-foss 26.5.0: a 6-quad box mesh
    still has 6 polygons after calling it (expected 12 triangles), so STL export of
    a triangulated mesh silently omits half the surface.'
  user_action: Do not rely on Mesh.triangulate() to split quads into triangles; it
    returns the mesh unchanged. Pre-triangulate geometry before constructing the Mesh
    if triangle output is required.
  evidence:
    repro: 'Called triangulate() on a 6-quad Box(2,2,2).toMesh(): polygon count stayed
      at 6 (expected 12). Saving the untriangulated mesh via StlSaveOptions(ASCII)
      produced only 6 facet blocks with real coordinates instead of the 12 a correct
      triangulation needs.'
    verified_on:
      package: org.aspose:aspose-3d-foss
      version: 26.5.0
      date: '2026-10-29'
  status: open
