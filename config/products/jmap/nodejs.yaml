# Product manifest for the JMAP family, Node.js platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example), so a pattern-derived name is not trustworthy. This
# exact string was supplied verbatim by the operator in TC-232 (a
# repository-listing read on 2026-10-07 confirmed it real, public, not a
# fork, not archived).
#
# platform is "nodejs" (not "javascript"): run_extraction._LANGUAGE_BY_PLATFORM
# already maps "nodejs" to the tree-sitter "typescript" grammar (which parses
# plain JavaScript too), and package_root.detect_package_root already accepts
# "nodejs" directly.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: jmap
platform: nodejs
repository: aspose-email-foss/Aspose.JMAP-FOSS-for-Node.js
schedule:
  cron: "0 7 * * *"
  timezone: UTC
storage_topology: embedded
