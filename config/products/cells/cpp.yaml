# Product manifest for the Cells family, C++ platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# re-verified via a fresh anonymous `gh api
# repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp` read today: public,
# size ~318KB.
#
# NOTE (unique to this pilot, not represented by any field in this schema):
# this repository's default_branch is `main` - confirmed via the same API
# read. Unlike cells/rust (whose default_branch is `master`), this platform's
# own branch was verified independently rather than copied from that
# sibling pilot; recorded here so it is not rediscovered the hard way by
# whichever card next defaults a `--ref` argument.
#
# cells/cpp replaces pdf/cpp as this project's C++ pilot: pdf/cpp is stalled
# at its own taskcard's attempt cap, and the real, general extraction-engine
# bug that was blocking any C++ pilot (not specific to pdf/cpp) was fixed
# separately under TC-092. cells/cpp was chosen as the better C++ product to
# onboard going forward (REQ-G2-011).
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("TC-004's topology rule generalized to all pilots") - that decision
# applies structurally to every pilot, so no new topology_spike measurement
# is run for this card.
family: cells
platform: cpp
repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp
schedule:
  cron: "0 18 * * *"
  timezone: UTC
storage_topology: embedded
