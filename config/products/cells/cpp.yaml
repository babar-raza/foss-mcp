# Product manifest for the Cells family, C++ platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# re-verified via a fresh anonymous `gh api
# repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp` read today: public,
# size ~318KB.
#
# NOTE (unique to this pilot, not represented by any field in this schema):
# this repository's default_branch is `main` - confirmed via the same API
# read. Unlike cells/rust (whose default_branch is `master`), this platform's
# own branch was verified independently rather than copied from that
# sibling pilot; recorded here so it is not rediscovered the hard way by
# whichever card next defaults a `--ref` argument.
#
# cells/cpp replaces pdf/cpp as this project's C++ pilot: pdf/cpp is stalled
# at its own taskcard's attempt cap, and the real, general extraction-engine
# bug that was blocking any C++ pilot (not specific to pdf/cpp) was fixed
# separately under TC-092. cells/cpp was chosen as the better C++ product to
# onboard going forward (REQ-G2-011).
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("TC-004's topology rule generalized to all pilots") - that decision
# applies structurally to every pilot, so no new topology_spike measurement
# is run for this card.
family: cells
platform: cpp
repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp
schedule:
  cron: "0 18 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-796: a project-verified absence of any formula-calculation engine in this library (round-2
# finding CELLS-CPP-004), re-verified 2026-11-14 against the pinned commit 9f852d0f by reading
# src/aspose/cells_foss/Cell.cpp and XlsxWorkbookSerializerCommon.cpp and by building and running
# a small program against that commit. Keep this the LAST top-level key.
known_hazards:
  - text: >-
      cells/cpp has no formula-calculation engine: Cell::SetFormula() and Workbook::Save() never
      compute or cache a formula result. Verified against pinned commit 9f852d0f by reading the
      source and by running a small program built from it. After SetFormula("=SUM(B2:B3)") on an
      otherwise empty cell, GetValue() is empty and GetStringValue() and GetDisplayStringValue()
      both return an empty string, and the saved sheet XML for that cell is
      <c r="B4"><f>SUM(B2:B3)</f></c> with no <v> cached value (the leading '=' is stripped when
      writing and added back by GetFormula()). The upstream README's comment that
      GetDisplayStringValue() returns a "formatted formula result" does not hold for such a cell.
      A cached result exists only if the caller stores one: calling PutValue() BEFORE SetFormula()
      on the same cell keeps that value and writes it as <v> next to <f>, while calling PutValue()
      AFTER SetFormula() erases the formula. The stored value is never refreshed - after
      A1 changed from 2 to 10, the cached 5 stored next to the formula =A1+A2 on B1 stayed 5.
      The safe pattern: compute each formula's result in your own code, store it with PutValue()
      and then SetFormula() on the same cell (in that order), recompute and re-store it whenever an
      input changes, and never rely on this library to produce or update a formula's result.
    verified_at: "2026-11-14"
