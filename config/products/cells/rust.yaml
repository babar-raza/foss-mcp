# G3/TC-725: a real, project-confirmed absence of any formula-calculation engine (round-2
# finding CELLS-RUST-003, re-verified 2026-11-07 by a direct search of the real committed
# tests/fixtures/cells_rust/api_surface.json fixture). Keep this the LAST top-level key.
known_hazards:
  - text: >-
      cells/rust advertises formulas AND calculation as one of this family's capabilities, but
      there is no formula-calculation engine anywhere in its real indexed API: a direct search of
      the real committed api_surface.json fixture across all 1470 methods on all 122 indexed
      types finds zero methods literally named recalculate/evaluate/calculate_formula. Workbook
      itself declares no member named calculate, and the only "calculation"-named
      members anywhere are configuration settings on CalculationProperties/WorkbookProperties
      (calculation_mode, force_full_calculation, calculation_on_save, concurrent_calculation, and
      similar) - flags describing how a downstream reader such as Excel should behave on open,
      never an actual compute engine this library runs itself. The real trigger is writing a
      formula via this library's only formula-writing mechanism, where
      (put_formula_with_cached_value) requires a pre-computed value as its own cached_value
      parameter and never computes anything itself, or simply trusting that the advertised
      "formulas and calculation" capability means the library will recompute results on its own.
      The real observed behavior: whatever cached value you supplied is the only value that will
      ever be read back, forever, even after the inputs the formula depends on change - there is
      no recalculation mechanism anywhere in the real indexed API to catch this, so Excel or any
      other reader displays whatever number was last cached, not a recalculated one. The safe
      pattern: recompute the formula's real result yourself, in your own code, every time a
      dependency changes, and re-supply it via put_formula_with_cached_value; never assume this
      library will recalculate anything on your behalf.
    verified_at: "2026-11-07"
  - text: >-
      In cells/rust (pinned commit 1a6004af), the arguments of CellsMut::merge() and
      merge_or_cells_exception() are merge(first_row, first_column, total_rows, total_columns):
      the last two are COUNTS of rows and columns, not end indices, and all four are zero-based.
      The source computes end_row = first_row + total_rows - 1 and end_column = first_column +
      total_columns - 1, and rejects a negative first_row or first_column and any total_rows or
      total_columns of zero or less. Verified by running the crate: merge(0, 0, 1, 3) merged
      A1:C1 (not A1:D1); merge(5, 0, 5, 2), written as if the last two were end indices, merged
      A6:B10 (5 rows by 2 columns), a different range from the intended one, with no error; and
      merge(9, 0, 0, 2) returned an InvalidCellReference error. To merge A1:C1 call
      merge(0, 0, 1, 3). To merge rows r1..r2 and columns c1..c2 (zero-based, inclusive) call
      merge(r1, c1, r2 - r1 + 1, c2 - c1 + 1), and read merged_cells() back to confirm the
      range.
    verified_at: "2026-11-14"
