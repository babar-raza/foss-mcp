# the same API read. This is the only one of the 7 pilots where this
# differs; recorded here so it is not rediscovered the hard way by whichever
# card next defaults a `--ref` argument to `main`.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
