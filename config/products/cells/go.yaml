# Product manifest for the Cells family, Go platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash before "PDF", pdf/net uses a dot
# before "NET") - a pattern-derived name is not trustworthy. This exact
# string was re-verified via a fresh anonymous `gh api
# repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Go` read on 2026-10-01:
# public, default branch main, size 89KB, language Go, not a fork, not
# archived.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: cells
platform: go
repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Go
schedule:
  cron: "0 12 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-582: a project-authored, project-verified hazard the upstream repository does not
# document anywhere (README, docs, source, AGENTS.md all carry zero mentions of thread-safety -
# a confirmed upstream documentation gap, re-checked 2026-10-24, not a foss-mcp defect). An
# independent audit reproduced this 5 out of 5 runs. Keep this the LAST top-level key.
known_hazards:
  - text: >-
      Two goroutines that mutate different cells of ONE SHARED Workbook instance crash the
      process with an unrecoverable Go runtime fatal error ("fatal error: concurrent map read
      and map write" / "fatal error: concurrent map writes") - this is not a catchable panic;
      recover() cannot stop it and the whole process exits immediately. The real trigger is
      exactly the kind of naive parallelism an agent could reach for after reading this
      library's undocumented API: e.g. two goroutines each filling a different column of the
      same Workbook concurrently. Reproduced 5 out of 5 runs by an independent audit
      (2026-10-24). The safe pattern is either (a) one Workbook instance per goroutine, each
      saved and merged afterwards, or (b) serialize every mutation of one shared Workbook
      through a single goroutine or a mutex - never mutate one shared Workbook from more than
      one goroutine at a time.
    verified_at: "2026-10-24"
  - text: >-
      cells/go (pinned commit fa4e890e) has no API for several commonly expected spreadsheet
      features, confirmed by reading the non-test Go source under aspose/cells_foss and by running
      a small Go program against it. There is no merged-cells API and no defined-name or
      named-range API: no function, method or field mentioning merge, definedName or namedRange
      exists. There is no number-format setting: Style has only Font, Fill, Alignment and Border
      fields, and every saved cell format is written with numFmtId 0 (General). There is no
      PDF export and no chart API. There is no Workbook.AddWorksheet or NewWorksheet: the only
      way to append a worksheet is Workbook.ImportFromCSV(path, sheetName, delimiter), which
      adds a new sheet filled from CSV data (a two-sheet save was confirmed to write both
      sheets), while a Worksheet built directly with &cells_foss.Worksheet{} has a nil Cells()
      and Cells().Set panics with a nil pointer dereference. Do not plan on any of these in this
      library; if you need one of them, use another tool for that step rather than expecting the
      call to exist or to be a silent no-op.
    verified_at: "2026-11-14"
  - text: >-
      CalculateFormula (cells/go, pinned commit fa4e890e) takes the formula text WITHOUT a leading
      "=", and the README's CalculateFormula limitation never says so. The function treats everything
      before the first "(" as the function name and does not strip an "=" or leading whitespace, so
      CalculateFormula("=SUM(A1:A2)", ws), "=AVERAGE(A1:A2)", "=MAX(A1:A2)" and "=MIN(A1:A2)" all return
      the error `formula: unsupported function "=SUM"` (respectively "=AVERAGE", "=MAX", "=MIN") even though
      SUM, AVERAGE, MAX and MIN are supported - the message reads as if the function were missing, and
      the same happens for " =SUM(A1:A2)" and "= SUM(A1:A2)". The working spelling has no "=":
      with A1 = 3 and A2 = 4, CalculateFormula("SUM(A1:A2)", ws) returns 7, "AVERAGE(A1:A2)" returns
      3.5, "MAX(A1:A2)" returns 4 and "MIN(A1:A2)" returns 3. Cell.SetFormula stores its text verbatim
      and GetFormula returns it unchanged, so a formula stored as SetFormula("=SUM(A1:A2)") fails the
      same way when its GetFormula() text is passed to CalculateFormula; store and evaluate formulas
      without the leading "=". A second misleading error: an unsupported function is not reported as
      "unsupported function" when its arguments are not plain cell references, because arguments are
      resolved as cell references before the function name is checked - CalculateFormula("IF(A1>0,1,2)",
      ws) (with or without the "=") returns `formula: cells: cell "A1>0" not found`. Reproduced twice
      with a small Go program against the repository checked out at fa4e890e (2026-11-14).
    verified_at: "2026-11-14"
