# Product manifest for the Cells family, Go platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash before "PDF", pdf/net uses a dot
# before "NET") - a pattern-derived name is not trustworthy. This exact
# string was re-verified via a fresh anonymous `gh api
# repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Go` read on 2026-10-01:
# public, default branch main, size 89KB, language Go, not a fork, not
# archived.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: cells
platform: go
repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Go
schedule:
  cron: "0 12 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-582: a project-authored, project-verified hazard the upstream repository does not
# document anywhere (README, docs, source, AGENTS.md all carry zero mentions of thread-safety -
# a confirmed upstream documentation gap, re-checked 2026-10-24, not a foss-mcp defect). An
# independent audit reproduced this 5 out of 5 runs. Keep this the LAST top-level key.
known_hazards:
  - text: >-
      Two goroutines that mutate different cells of ONE SHARED Workbook instance crash the
      process with an unrecoverable Go runtime fatal error ("fatal error: concurrent map read
      and map write" / "fatal error: concurrent map writes") - this is not a catchable panic;
      recover() cannot stop it and the whole process exits immediately. The real trigger is
      exactly the kind of naive parallelism an agent could reach for after reading this
      library's undocumented API: e.g. two goroutines each filling a different column of the
      same Workbook concurrently. Reproduced 5 out of 5 runs by an independent audit
      (2026-10-24). The safe pattern is either (a) one Workbook instance per goroutine, each
      saved and merged afterwards, or (b) serialize every mutation of one shared Workbook
      through a single goroutine or a mutex - never mutate one shared Workbook from more than
      one goroutine at a time.
    verified_at: "2026-10-24"
