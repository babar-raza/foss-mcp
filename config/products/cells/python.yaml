# Product manifest for the Cells family, Python platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# re-verified via a fresh anonymous `gh api
# repos/aspose-cells-foss/Aspose.Cells-FOSS-for-Python` read on
# 2026-10-01: public, default branch main, size 1392KB.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: cells
platform: python
repository: aspose-cells-foss/Aspose.Cells-FOSS-for-Python
schedule:
  cron: "0 6 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-721: a project-authored, project-verified hazard the upstream repository does not
# document anywhere (the real installed aspose-cells-foss 26.10.0 package's own class
# docstring says only "Basic formula evaluator ... not a full spreadsheet calculation engine",
# with zero mention of which functions it actually implements) - a confirmed upstream
# documentation gap, re-checked 2026-11-07 by direct reproduction against the real installed
# package, not a foss-mcp defect. Keep this the LAST top-level key.
known_hazards:
  - text: >-
      Calling FormulaEvaluator.evaluate() with a SUM formula (e.g. "=SUM(A1:A3)"), raw
      arithmetic (e.g. "=B2+B3"), or an AVERAGE formula (e.g. "=AVERAGE(A1:A3)") silently
      returns None - no exception, no warning - confirmed by direct reproduction against the
      real installed aspose-cells-foss 26.10.0 package on a real Workbook: all three formulas
      returned None, while =CONCATENATE("foo","bar") on the same evaluator genuinely returned
      'foobar'. Reading the installed package's own _evaluate_function source confirms why:
      any formula whose top-level function is not in its real, complete supported set -
      exactly CONCATENATE, CONCAT, TEXT, IF, AND, OR, NOT, LEN, TRIM, UPPER, and LOWER, nothing
      else - falls straight through to an unconditional final `return None`, with SUM, bare
      arithmetic operators, and AVERAGE simply absent from that implementation. The safe
      pattern: never treat a None result from evaluate() as "the formula evaluated to
      zero/empty" - first check whether the formula's top-level function is in this real
      supported list, and treat None from any other function (including SUM, AVERAGE, and raw
      arithmetic) as "not supported by this evaluator", never as a computed result.
    verified_at: "2026-11-07"
