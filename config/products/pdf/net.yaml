# Product manifest for the PDF family, .NET platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular: pdf/go uses "Aspose-PDF-FOSS-for-Go" (a
# dash), while this one uses "Aspose.PDF-FOSS-for-.NET" (a dot before "NET").
# A pattern-derived name is wrong for 2 of the 7 pilot repos, which is exactly
# why this string is authored literally here and asserted literally in
# tests/config/test_product_manifests.py rather than derived anywhere.
#
# storage_topology is deliberately left as "undecided_pending_TC-004": that
# decision belongs to a later card (plan 18.1) and must not be guessed here.
family: pdf
platform: net
repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET
schedule:
  cron: "0 4 * * *"
  timezone: UTC
storage_topology: undecided_pending_TC-004
