# Product manifest for the PDF family, C++ platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net, pdf/java, and
# pdf/typescript use a dot before "PDF"); this pilot uses a DOT before "PDF"
# - "Aspose.PDF-FOSS-for-Cpp" - matching pdf/net's, pdf/java's, and
# pdf/typescript's convention, unlike pdf/go's dash form. Freshly
# re-verified via a fresh anonymous `gh api
# repos/aspose-pdf-foss/Aspose.PDF-FOSS-for-Cpp` read on 2026-09-25: public,
# default branch main, size ~4.5MB.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("TC-004's topology rule generalized to all pilots") - that decision
# applies structurally to every pilot, so no new topology_spike measurement
# is run for this card.
family: pdf
platform: cpp
repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-Cpp
schedule:
  cron: "0 16 * * *"
  timezone: UTC
storage_topology: embedded
