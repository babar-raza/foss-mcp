# Product manifest for the PDF family, Java platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET");
# this pilot uses a DOT before "PDF" - "Aspose.PDF-FOSS-for-Java" - matching
# pdf/net's convention, unlike pdf/go's dash form. Freshly re-verified via a
# fresh anonymous `gh api repos/aspose-pdf-foss/Aspose.PDF-FOSS-for-Java`
# read on 2026-09-24: public, default branch main, size ~2.9MB.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("TC-004's topology rule generalized to all pilots") - that decision
# applies structurally to every pilot, so no new topology_spike measurement
# is run for this card.
family: pdf
platform: java
repository: aspose-pdf-foss/Aspose.PDF-FOSS-for-Java
schedule:
  cron: "0 12 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-650 (round-2 audit PDF-JAVA-003): this project's OWN served formats/limitations text
# falsely claims PDF<->Word/Excel conversion is unsupported, stale against the actually-installed
# 26.9.0 package - not an upstream documentation gap. Independently reproduced 2026-10-29. Keep
# this the LAST top-level key.
known_hazards:
  - text: >-
      This project's own formats/limitations text claims "conversion to non-PDF formats beyond
      HTML/XML, conversion from non-PDF formats beyond HTML ... are not supported", but on the
      real registry package (26.9.0) PDF<->Word/Excel conversion IS supported end-to-end. The real
      trigger: this is stale README prose from before the 26.8.0 SDM subsystem landed;
      Document.save(path, SaveFormat.DocX) works and produces a correct, valid .docx file, and the
      same deployment's own symbol index and search_docs describe DocSaveOptions/DocLoadOptions/
      ExcelSaveOptions/SaveFormat.DocX/.Xlsx/.Doc in detail. The safe pattern: do not tell an agent
      that PDF<->Word/Excel conversion is unsupported - call Document.save with SaveFormat.DocX
      (or .Xlsx/.Doc) directly, and cross-check a formats/limitations claim of "unsupported"
      against the deployment's own symbol index before repeating it, since stale prose and a live
      index can disagree.
    verified_at: "2026-10-29"
