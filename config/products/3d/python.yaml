# Product manifest for the 3D family, Python platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# verified via a live GitHub repository-listing read on 2026-10-07: the org
# aspose-3d-foss publishes exactly four repositories (python, typescript,
# net, java); this one is public, default branch master, size 382KB, not a
# fork, not archived.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: 3d
platform: python
repository: aspose-3d-foss/Aspose.3D-FOSS-for-Python
schedule:
  cron: "0 1 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-815 (round-2 audit 3D-PYTHON-009 / RD2-034): a project-authored, project-verified hazard.
# get_symbol for aspose.threed.FileFormat.FileFormat lists 48 class-level constants as
# "X = None (read-only)" beside 4 static factory methods; the constants really are None on the
# installed aspose-3d-foss 26.1.0 package (and in the indexed source). Re-verified 2026-11-14 by
# direct reproduction in a throwaway venv. The symbol-scoped disclosure is
# config/known_defects/3d__python.yaml (3D-PYTHON-009). G3/TC-832 appended the FBX7400ASCII() save
# failure and the silent skipping of un-converted primitives (3MF 0-byte file) to the same paragraph,
# each re-verified on 2026-11-14 on aspose-3d-foss 26.1.0 and against the source at the indexed
# commit 65b1f577. Keep this the LAST top-level key.
known_hazards:
  - text: >-
      In aspose-3d-foss 26.1.0, 48 of the FileFormat class attributes that get_symbol and list_members
      show as "NAME = None (read-only)" (GLTF, GLTF_BINARY, GLTF2_BINARY, STL_BINARY, STLASCII, PLY,
      COLLADA, DISCREET_3DS, PDF, USD, the FBX6100..FBX7700 variants other than FBX7400ASCII, and the
      rest) are genuinely None at runtime, not format objects - only the four static factory methods
      FBX7400ASCII(), GLTF2(), MICROSOFT_3MF_FORMAT() and WAVEFRONT_OBJ() are real, and
      WAVEFRONT_OBJ() itself raises ModuleNotFoundError because the module it imports does not exist
      in the package. The real trigger is using FileFormat.GLTF (or any other "= None" constant) as a
      format argument or reading its .extension/.can_export: Scene.save(stream, FileFormat.GLTF)
      raises AttributeError ("'NoneType' object has no attribute 'create_save_options'"), and
      Scene.save(path, FileFormat.GLTF) silently ignores the constant and picks the format from the
      file extension instead. The safe pattern: pass a real format object such as FileFormat.GLTF2()
      or a format-specific SaveOptions instance, or pass a path with a recognised extension and no
      format argument, and check the written file rather than assuming the named format was used.
      Two more silent traps on the save path, both reproduced on the same package (G3/TC-832).
      First, a real format object is not enough to save with: Scene.save(path, FileFormat.FBX7400ASCII())
      and Scene.save(stream, FileFormat.FBX7400ASCII()) raise NotImplementedError ("supports_format is not
      implemented"), exactly as Scene.save("x.fbx") and Scene.save("x.dae") do, so of the four static
      factories only GLTF2() and MICROSOFT_3MF_FORMAT() can be used to save (FBX7400ASCII() merely
      returns an FbxFormat object, and WAVEFRONT_OBJ() raises ModuleNotFoundError). Second, a node whose
      entity is a parametrised primitive such as Box(), Sphere() or Cylinder() rather than the Mesh
      returned by its to_mesh() is silently skipped by the STL, glTF and 3MF exporters: Scene.save("x.stl")
      writes a header-only file with no facets ("solid x" then "endsolid x"), Scene.save("x.gltf") writes
      a glTF whose "meshes" array is empty, and Scene.save("x.3mf") writes a 0-byte file with no error
      (the 3MF exporter returns without writing anything when the scene holds no Mesh, so an empty scene
      also gives 0 bytes). Attach Box().to_mesh() (a real Mesh) instead, and check the file size or
      content after every save.
    verified_at: "2026-11-14"
