# Product manifest for the 3D family, TypeScript platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# verified via a live GitHub repository-listing read on 2026-10-07: the org
# aspose-3d-foss publishes exactly four repositories (python, typescript,
# net, java); this one is public, default branch master, size 207KB, not a
# fork, not archived.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, not only the original 7.
family: 3d
platform: typescript
repository: aspose-3d-foss/Aspose.3D-FOSS-for-TypeScript
schedule:
  cron: "0 2 * * *"
  timezone: UTC
storage_topology: embedded
