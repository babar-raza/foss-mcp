# Product manifest for the Page family, Python platform.
#
# The `repository` value below is pinned VERBATIM to the verified upstream
# GitHub `full_name` and must never be reconstructed from `family`/`platform`.
# This org's naming is irregular (see config/products/pdf/net.yaml for the
# canonical example: pdf/go uses a dash, pdf/net uses a dot before "NET"),
# so a pattern-derived name is not trustworthy. This exact string was
# re-verified via a fresh `gh api
# repos/aspose-page-foss/Aspose.Page-FOSS-for-Python` read on
# 2026-10-01: public, default branch main, size ~418379KB.
#
# storage_topology is set directly to `embedded` per the generalized
# decision recorded in docs/DECISION_LOG.md's 2026-09-24 entry
# ("Storage topology decision generalized to all pilots") - that decision
# applies structurally to every pilot/product, so no new topology_spike
# measurement is run for this card.
family: page
platform: python
repository: aspose-page-foss/Aspose.Page-FOSS-for-Python
schedule:
  cron: "0 7 * * *"
  timezone: UTC
storage_topology: embedded

# G3/TC-720: a project-authored, project-verified hazard the upstream repository does not
# document anywhere (the real installed aspose-page-foss 26.9.0 package's own docstrings say
# nothing about an initial page) - a confirmed upstream documentation gap, re-checked
# 2026-11-07 by direct reproduction against the real installed package, not a foss-mcp defect.
# Keep this the LAST top-level key.
known_hazards:
  - text: >-
      PsDocument.create(is_eps=True) returns a document that already contains one page -
      len(doc.pages) == 1 immediately, exactly as the plain PsDocument.create() does too,
      confirmed by direct reproduction against the real installed aspose-page-foss 26.9.0
      package (create() prints 1, then add_page() prints 2). This is asymmetric with the
      sibling XpsDocument.create(), which genuinely starts at zero pages
      (len(doc.builder.pages) == 0, also confirmed by direct reproduction) - the same
      "create()" name behaves differently across the two classes. An agent following the
      natural "create() then add_page() for the first page" pattern silently ends up with an
      unwanted second, blank page on the very first call, and save()/to_pdf()/to_image() all
      succeed without error, so nothing signals the mistake. The safe pattern is to check the
      real page count (len(doc.pages)) before deciding whether to call add_page() at all - use
      the page already provided instead of assuming a freshly created document is empty.
    verified_at: "2026-11-07"

  # G3/TC-726: a second, unrelated project-authored hazard for this same pilot, closing
  # PAGE-PYTHON-005 - a different class entirely (XpsGlyphs's silent font-fallback behavior, not
  # a page count). Confirmed STILL OPEN by direct reproduction against the real installed
  # aspose-page-foss 26.9.0 package: a real XpsDocument.create() -> add_page() -> appending an
  # XpsGlyphs whose font reference attribute is set to "/Resources/Fonts/does-not-exist.odttf"
  # (never registered as a real part anywhere in document.package.parts, confirmed empty of that
  # path after save()) - save(), to_pdf(), and to_image() all succeed with no exception or
  # warning, pypdf confirms the resulting PDF's extracted text is exactly "Hello XPS", and the
  # PNG has 470 real non-white glyph pixels: the requested text genuinely renders, just via
  # whichever fallback font the renderer silently substituted, never the one actually requested
  # or any error about it. See the entry's own text below for the exact attribute name.
  - text: >-
      XpsGlyphs.font_uri accepts any string, including a path that was never registered as a real
      part in the XpsDocument's own package - get_symbol('aspose.page.xps.editing.XpsGlyphs')
      shows only font_uri: str (writable), with no validation, allowed-value list, or behavior
      note attached. Setting font_uri to a nonexistent resource such as
      "/Resources/Fonts/does-not-exist.odttf" never raises and never warns anywhere in the
      pipeline, confirmed by direct reproduction against the real installed aspose-page-foss
      26.9.0 package: save() (whose own _validate_page_images check only validates XpsImage
      sources, never XpsGlyphs.font_uri), to_pdf(), and to_image() all succeed, and the requested
      unicode_string genuinely renders - pypdf confirms the PDF's extracted text is exactly
      "Hello XPS", and the rendered PNG has real, non-white glyph pixels. The library silently
      substitutes a fallback font and still renders the requested text, never the font actually
      named by font_uri. A successful to_pdf()/to_image() call is therefore NOT proof the
      requested font was used: nothing in this library signals whether font_uri ever resolved to a
      real font part. The safe pattern is to never assume font_uri resolved correctly just because
      rendering succeeded with no error - independently verify the actual font/glyph shapes used
      if that distinction matters to the caller, since this library gives no signal either way.
    verified_at: "2026-11-07"
