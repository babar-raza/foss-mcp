        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_typescript/api_surface.json
        --held-by ingestion-pdf-typescript
        &&
