# Brings up serving containers for all 7 G2 pilots locally, one per pilot, each on its
# own host port so they can run concurrently. Deployment identity is set here, at deploy
# time, never negotiated with a client (foss_mcp.mcp.routing.resolve_scope).
#
# Overrides the image's default CMD (stdio - see Dockerfile.serving) to run
# infra/serve_http.py instead: the same create_server() dispatch core, served over
# Streamable HTTP on the published port so a real client can reach it. Never a second
# implementation of tool dispatch - only the transport differs.
#
# infra/serve_http.py always binds its OWN internal port to 8080 (DEFAULT_PORT, not
# overridable by env), so every service below maps a DIFFERENT, unique HOST port to the
# SAME container port 8080. Never change the container side.
#
# The shared build/image/command shape is factored into the x-serving-base anchor to
# avoid 7-way copy-paste drift; each service still lists its own full, independently
# readable environment block and port mapping - correctness never lives only in the
# anchor.
x-serving-base: &serving-base
  build:
    context: .
    dockerfile: Dockerfile.serving
  image: foss-mcp-serving:local
  command: ["python", "/app/infra/serve_http.py"]

# G2/TC-064: pdf/net's real, persistent manifest volume - shared between the one-shot
# `ingest-pdf-net` service below (which publishes into it) and the `serving` service (which
# reads it). Named, not a bind mount, so it survives one container's exit and is picked up by
# the next container that mounts it - the exact gap the 2026-09-25 audit found: no volume here
# meant every `serving` start read an empty, ephemeral /data/manifests. Scope is pdf/net only;
# no other pilot service below is touched by this card.
#
# G2/TC-098: pdf/typescript's own equivalent, same shape - shared between the one-shot
# `ingest-pdf-typescript` service below (which publishes into it) and `serving-pdf-typescript`
# (which reads it). Scope is pdf/typescript only; every other pilot's own volume/service above
# and below is unaffected.
volumes:
  manifests-pdf-net:
  manifests-pdf-typescript:

services:
  # G2/TC-064: the real, live first publish for pdf/net - a one-shot init job, not a
  # long-running service. Builds real Chunk objects from TC-011's real committed fixture
  # (infra/build_chunks.py, TC-062's build_chunks_from_api_surface), then publishes them
  # through the real CAS/citation-validation authority path (infra/ingest.py, TC-060) using the
  # real HashingEmbeddingProvider (TC-063) - into the SAME named volume `serving` below reads.
  #
  # Dockerfile.ingestion's own ENTRYPOINT is fixed to `python /app/infra/ingest.py` for its
  # general one-shot-CLI contract (other cards depend on that); both `entrypoint` and `command`
  # are overridden here, for this service only, to chain build_chunks.py before ingest.py -
  # idiomatic for a one-shot compose init job, and it does not touch the Dockerfile's own
  # general-purpose ENTRYPOINT.
  ingest-pdf-net:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-net:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_net/api_surface.json
        --title "pdf/net API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_net/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET
        --library-commit b7172877651413cff57a8bfe41fb8a8befb2406b
        --library-platform dotnet
        --library-csproj src/Aspose.Pdf.Foss.csproj
        --out /tmp/pdf_net_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform net
        --source-kind self_extracted
        --chunks /tmp/pdf_net_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_net/api_surface.json
        --held-by ingestion-pdf-net

  serving:
    <<: *serving-base
    ports:
      - "8080:8080"
    volumes:
      - manifests-pdf-net:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: net
      FOSS_MCP_SOURCE_KIND: self_extracted

  # G2/TC-098: pdf/typescript's real, live first publish - a one-shot init job, not a
  # long-running service, mirroring `ingest-pdf-net` above exactly. Builds real Chunk objects
  # from this pilot's real committed fixture (infra/build_chunks.py,
  # build_chunks_from_api_surface) plus real, compile-verified examples extracted from its own
  # furnished content (--library-platform typescript dispatches to
  # prepare_typescript_library/verify_typescript_example, TC-091), then publishes them through
  # the real CAS/citation-validation authority path (infra/ingest.py) using the real
  # HashingEmbeddingProvider - into the SAME named volume `serving-pdf-typescript` below reads.
  ingest-pdf-typescript:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-typescript:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_typescript/api_surface.json
        --title "pdf/typescript API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_typescript/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose.PDF-FOSS-for-TypeScript
        --library-commit 155bfc7a33f0ba23fb4252b6ba201828b02a5b9d
        --library-platform typescript
        --library-package-name @asposefoss/pdf
        --out /tmp/pdf_typescript_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform typescript
        --source-kind self_extracted
        --chunks /tmp/pdf_typescript_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_typescript/api_surface.json
        --held-by ingestion-pdf-typescript

  serving-pdf-typescript:
    <<: *serving-base
    ports:
      - "8081:8080"
    volumes:
      - manifests-pdf-typescript:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: typescript
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-pdf-cpp:
    <<: *serving-base
    ports:
      - "8082:8080"
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: cpp
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-pdf-java:
    <<: *serving-base
    ports:
      - "8083:8080"
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: java
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-pdf-go:
    <<: *serving-base
    ports:
      - "8084:8080"
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: go
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-slides-python:
    <<: *serving-base
    ports:
      - "8085:8080"
    environment:
      FOSS_MCP_FAMILY: slides
      FOSS_MCP_PLATFORM: python
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-cells-rust:
    <<: *serving-base
    ports:
      - "8086:8080"
    environment:
      FOSS_MCP_FAMILY: cells
      FOSS_MCP_PLATFORM: rust
      FOSS_MCP_SOURCE_KIND: self_extracted
