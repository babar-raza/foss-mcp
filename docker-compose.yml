# Brings up serving containers for all 7 G2 pilots locally, one per pilot, each on its
# own host port so they can run concurrently. Deployment identity is set here, at deploy
# time, never negotiated with a client (foss_mcp.mcp.routing.resolve_scope).
#
# Overrides the image's default CMD (stdio - see Dockerfile.serving) to run
# infra/serve_http.py instead: the same create_server() dispatch core, served over
# Streamable HTTP on the published port so a real client can reach it. Never a second
# implementation of tool dispatch - only the transport differs.
#
# infra/serve_http.py always binds its OWN internal port to 8080 (DEFAULT_PORT, not
# overridable by env), so every service below maps a DIFFERENT, unique HOST port to the
# SAME container port 8080. Never change the container side.
#
# The shared build/image/command shape is factored into the x-serving-base anchor to
# avoid 7-way copy-paste drift; each service still lists its own full, independently
# readable environment block and port mapping - correctness never lives only in the
# anchor.
x-serving-base: &serving-base
  build:
    context: .
    dockerfile: Dockerfile.serving
  image: foss-mcp-serving:local
  command: ["python", "/app/infra/serve_http.py"]

# G2/TC-064: pdf/net's real, persistent manifest volume - shared between the one-shot
# `ingest-pdf-net` service below (which publishes into it) and the `serving` service (which
# reads it). Named, not a bind mount, so it survives one container's exit and is picked up by
# the next container that mounts it - the exact gap the 2026-09-25 audit found: no volume here
# meant every `serving` start read an empty, ephemeral /data/manifests. Scope is pdf/net only;
# no other pilot service below is touched by this card.
#
# G2/TC-098: pdf/typescript's own equivalent, same shape - shared between the one-shot
# `ingest-pdf-typescript` service below (which publishes into it) and `serving-pdf-typescript`
# (which reads it). Scope is pdf/typescript only; every other pilot's own volume/service above
# and below is unaffected.
#
# G2/TC-099: pdf/java's own equivalent, same shape - shared between the one-shot
# `ingest-pdf-java` service below (which publishes into it) and `serving-pdf-java` (which reads
# it). Scope is pdf/java only; every other pilot's own volume/service above and below is
# unaffected.
#
# G2/TC-100: pdf/go's own equivalent, same shape - shared between the one-shot `ingest-pdf-go`
# service below (which publishes into it) and `serving-pdf-go` (which reads it). Scope is pdf/go
# only; every other pilot's own volume/service above and below is unaffected.
#
# G2/TC-101: slides/python's own equivalent, same shape - shared between the one-shot
# `ingest-slides-python` service below (which publishes into it) and `serving-slides-python`
# (which reads it). Scope is slides/python only; every other pilot's own volume/service above and
# below is unaffected.
volumes:
  manifests-pdf-net:
  manifests-pdf-typescript:
  manifests-pdf-java:
  manifests-pdf-go:
  manifests-slides-python:

services:
  # G2/TC-064: the real, live first publish for pdf/net - a one-shot init job, not a
  # long-running service. Builds real Chunk objects from TC-011's real committed fixture
  # (infra/build_chunks.py, TC-062's build_chunks_from_api_surface), then publishes them
  # through the real CAS/citation-validation authority path (infra/ingest.py, TC-060) using the
  # real HashingEmbeddingProvider (TC-063) - into the SAME named volume `serving` below reads.
  #
  # Dockerfile.ingestion's own ENTRYPOINT is fixed to `python /app/infra/ingest.py` for its
  # general one-shot-CLI contract (other cards depend on that); both `entrypoint` and `command`
  # are overridden here, for this service only, to chain build_chunks.py before ingest.py -
  # idiomatic for a one-shot compose init job, and it does not touch the Dockerfile's own
  # general-purpose ENTRYPOINT.
  ingest-pdf-net:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-net:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_net/api_surface.json
        --title "pdf/net API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_net/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET
        --library-commit b7172877651413cff57a8bfe41fb8a8befb2406b
        --library-platform dotnet
        --library-csproj src/Aspose.Pdf.Foss.csproj
        --out /tmp/pdf_net_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform net
        --source-kind self_extracted
        --chunks /tmp/pdf_net_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_net/api_surface.json
        --held-by ingestion-pdf-net

  serving:
    <<: *serving-base
    ports:
      - "8080:8080"
    volumes:
      - manifests-pdf-net:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: net
      FOSS_MCP_SOURCE_KIND: self_extracted

  # G2/TC-098: pdf/typescript's real, live first publish - a one-shot init job, not a
  # long-running service, mirroring `ingest-pdf-net` above exactly. Builds real Chunk objects
  # from this pilot's real committed fixture (infra/build_chunks.py,
  # build_chunks_from_api_surface) plus real, compile-verified examples extracted from its own
  # furnished content (--library-platform typescript dispatches to
  # prepare_typescript_library/verify_typescript_example, TC-091), then publishes them through
  # the real CAS/citation-validation authority path (infra/ingest.py) using the real
  # HashingEmbeddingProvider - into the SAME named volume `serving-pdf-typescript` below reads.
  ingest-pdf-typescript:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-typescript:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_typescript/api_surface.json
        --title "pdf/typescript API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_typescript/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose.PDF-FOSS-for-TypeScript
        --library-commit 155bfc7a33f0ba23fb4252b6ba201828b02a5b9d
        --library-platform typescript
        --library-package-name @asposefoss/pdf
        --out /tmp/pdf_typescript_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform typescript
        --source-kind self_extracted
        --chunks /tmp/pdf_typescript_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_typescript/api_surface.json
        --held-by ingestion-pdf-typescript

  serving-pdf-typescript:
    <<: *serving-base
    ports:
      - "8081:8080"
    volumes:
      - manifests-pdf-typescript:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: typescript
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-pdf-cpp:
    <<: *serving-base
    ports:
      - "8082:8080"
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: cpp
      FOSS_MCP_SOURCE_KIND: self_extracted

  # G2/TC-099: pdf/java's real, live first publish - a one-shot init job, not a long-running
  # service, mirroring `ingest-pdf-net`/`ingest-pdf-typescript` above exactly. Builds real Chunk
  # objects from this pilot's real committed fixture (infra/build_chunks.py,
  # build_chunks_from_api_surface) plus real, compile-verified examples extracted from its own
  # furnished content (--library-platform java dispatches to
  # prepare_java_library/verify_java_example, TC-091 - a real Maven build of the pinned
  # reference library, then a real javac compile per candidate, both using the OpenJDK 21 + Maven
  # 3.9.9 already installed in Dockerfile.ingestion), then publishes them through the real
  # CAS/citation-validation authority path (infra/ingest.py) using the real
  # HashingEmbeddingProvider - into the SAME named volume `serving-pdf-java` below reads.
  ingest-pdf-java:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-java:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_java/api_surface.json
        --title "pdf/java API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_java/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose.PDF-FOSS-for-Java
        --library-commit db2d3f0622f035825419c6d46727022064f39f15
        --library-platform java
        --out /tmp/pdf_java_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform java
        --source-kind self_extracted
        --chunks /tmp/pdf_java_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_java/api_surface.json
        --held-by ingestion-pdf-java

  serving-pdf-java:
    <<: *serving-base
    ports:
      - "8083:8080"
    volumes:
      - manifests-pdf-java:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: java
      FOSS_MCP_SOURCE_KIND: self_extracted

  # G2/TC-100: pdf/go's real, live first publish - a one-shot init job, not a long-running
  # service, mirroring `ingest-pdf-net`/`ingest-pdf-typescript`/`ingest-pdf-java` above exactly.
  # Builds real Chunk objects from this pilot's real committed fixture (infra/build_chunks.py,
  # build_chunks_from_api_surface) plus real, compile-verified examples extracted from its own
  # furnished content (--library-platform go dispatches to prepare_go_library/verify_go_example,
  # TC-091 - a real Go toolchain build/vet of the pinned reference module, then a real compile per
  # candidate, using the Go 1.27.1 toolchain already installed in Dockerfile.ingestion), then
  # publishes them through the real CAS/citation-validation authority path (infra/ingest.py)
  # using the real HashingEmbeddingProvider - into the SAME named volume `serving-pdf-go` below
  # reads.
  ingest-pdf-go:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-pdf-go:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/pdf_go/api_surface.json
        --title "pdf/go API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/pdf_go/pages/_index.md
        --library-repository aspose-pdf-foss/Aspose-PDF-FOSS-for-Go
        --library-commit 286484d235196d65c9a458c5eff3d3d6539216dc
        --library-platform go
        --library-module-path github.com/aspose-pdf-foss/aspose-pdf-foss-for-go
        --out /tmp/pdf_go_chunks.json
        &&
        python /app/infra/ingest.py
        --family pdf
        --platform go
        --source-kind self_extracted
        --chunks /tmp/pdf_go_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/pdf_go/api_surface.json
        --held-by ingestion-pdf-go

  serving-pdf-go:
    <<: *serving-base
    ports:
      - "8084:8080"
    volumes:
      - manifests-pdf-go:/data/manifests
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: go
      FOSS_MCP_SOURCE_KIND: self_extracted

  # G2/TC-101: slides/python's real, live first publish - a one-shot init job, not a
  # long-running service, mirroring `ingest-pdf-net`/`ingest-pdf-typescript`/`ingest-pdf-java`/
  # `ingest-pdf-go` above exactly. Builds real Chunk objects from this pilot's real committed
  # fixture (infra/build_chunks.py, build_chunks_from_api_surface) plus real, run-verified
  # examples extracted from its own furnished content (--library-platform python dispatches to
  # prepare_python_library/verify_python_example, TC-091 - a real git clone of the pinned
  # reference library, a real venv, a real `pip install -e`, then a real interpreter run per
  # candidate, using the base python3 toolchain already present in Dockerfile.ingestion), then
  # publishes them through the real CAS/citation-validation authority path (infra/ingest.py) using
  # the real HashingEmbeddingProvider - into the SAME named volume `serving-slides-python` below
  # reads.
  ingest-slides-python:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: foss-mcp-ingestion:local
    volumes:
      - manifests-slides-python:/data/manifests
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /app/infra/build_chunks.py
        --api-surface /app/fixtures/slides_python/api_surface.json
        --title "slides/python API surface"
        --max-types 20
        --furnished-page /app/fixtures/furnished/slides_python/pages/_index.md
        --library-repository aspose-slides-foss/Aspose.Slides-FOSS-for-Python
        --library-commit 4e63447ba79d1c27a5192844847d9f872c5b92ad
        --library-platform python
        --out /tmp/slides_python_chunks.json
        &&
        python /app/infra/ingest.py
        --family slides
        --platform python
        --source-kind self_extracted
        --chunks /tmp/slides_python_chunks.json
        --manifest-store /data/manifests
        --embedding-provider foss_mcp.indexing.hashing_embedding_provider:HashingEmbeddingProvider
        --api-surface /app/fixtures/slides_python/api_surface.json
        --held-by ingestion-slides-python

  serving-slides-python:
    <<: *serving-base
    ports:
      - "8085:8080"
    volumes:
      - manifests-slides-python:/data/manifests
    environment:
      FOSS_MCP_FAMILY: slides
      FOSS_MCP_PLATFORM: python
      FOSS_MCP_SOURCE_KIND: self_extracted

  serving-cells-rust:
    <<: *serving-base
    ports:
      - "8086:8080"
    environment:
      FOSS_MCP_FAMILY: cells
      FOSS_MCP_PLATFORM: rust
      FOSS_MCP_SOURCE_KIND: self_extracted
