# Brings up the serving container for pdf/net locally. Deployment identity is set here, at
# deploy time, never negotiated with a client (foss_mcp.mcp.routing.resolve_scope).
services:
  serving:
    build:
      context: .
      dockerfile: Dockerfile.serving
    image: foss-mcp-serving:local
    environment:
      FOSS_MCP_FAMILY: pdf
      FOSS_MCP_PLATFORM: net
      FOSS_MCP_SOURCE_KIND: self_extracted
    stdin_open: true
    tty: true
