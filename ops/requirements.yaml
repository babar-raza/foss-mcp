  - id: REQ-G0-005
    gate: G0
    anchor: '### 19.2 Gate G0'
    text: >-
      config/products/pdf/net.yaml validates against the product-manifest
      schema and pins the EXACT upstream repository name
      (aspose-pdf-foss/Aspose.PDF-FOSS-for-.NET), never a name derived from a
      pattern - 2 of the 7 pilot repos use an irregular form.

  - id: REQ-G0-006
    gate: G0
    anchor: '### 18.1 Storage topology'
    text: >-
      The storage-topology decision is measured on a real fixture corpus and
      recorded in docs/DECISION_LOG.md, and the chosen profile is written back
      into the product manifest.

  - id: REQ-G0-007
    gate: G0
    anchor: '### 7.1 Snapshot/generation model'
    text: >-
      A generation is an immutable manifest published by a compare-and-swap on a
      single active pointer. Generation identity covers the full addressable
      unit, and activation never precedes write-and-validate completion.

  - id: REQ-G0-008
    gate: G0
    anchor: '### 18.3 Publication authority'
    text: >-
      Publication is guarded by a lease with a monotonic fencing token. A write
      carrying a stale token is rejected, and ROLLBACK travels the identical
      authority path - a late worker is fenced out whether the last action was a
      promotion or a rollback.

  - id: REQ-G0-009
    gate: G0
    anchor: '### 19.4 Governance adoption map'
    text: >-
      The pre-push gate fails CLOSED. Pushing to a remote that does not match
      this project must still run the gate rather than exiting 0, which git
      reports as success and which is the confirmed defect in the forked hook.
