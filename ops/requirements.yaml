# Stable ids for the mission plan's in-scope requirements. The plan is read-only
# and is never edited to carry ids, so this index is derived from it instead.
#
# This is the OMISSION control. A per-card review can only ever inspect cards
# that exist; it structurally cannot notice a card that was never written. Here,
# a requirement no card claims is a hard gate-exit failure.

