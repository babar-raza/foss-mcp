- id: REQ-G0-006
  gate: G0
  anchor: '### 18.1 Storage topology'
  text: The storage-topology decision is measured on a real fixture corpus and recorded
    in docs/DECISION_LOG.md, and the chosen profile is written back into the product
    manifest.
- id: REQ-G0-007
  gate: G0
  anchor: '### 7.1 Snapshot/generation model'
  text: A generation is an immutable manifest published by a compare-and-swap on a
    single active pointer. Generation identity covers the full addressable unit, and
    activation never precedes write-and-validate completion.
- id: REQ-G0-008
  gate: G0
  anchor: '### 18.3 Publication authority'
  text: Publication is guarded by a lease with a monotonic fencing token. A write
    carrying a stale token is rejected, and ROLLBACK travels the identical authority
    path - a late worker is fenced out whether the last action was a promotion or
    a rollback.
- id: REQ-G0-009
  gate: G0
  anchor: '### 19.4 Governance adoption map'
  text: The pre-push gate fails CLOSED. Pushing to a remote that does not match this
    project must still run the gate rather than exiting 0, which git reports as success
    and which is the confirmed defect in the forked hook.
- id: REQ-G1-001
  gate: G1
  anchor: '### 4.7 Redesign'
  text: The tree-sitter extraction engine is ported from repository-presenter's already-vendored,
    already-tested copy - not freshly from aspose.org - carrying its exact three-package
    dependency pin. Python uses the independent pure-AST reader in production, NOT
    the tree-sitter path, which exists only as a parity oracle.
- id: REQ-G1-002
  gate: G1
  anchor: '### 4.7a The claim-ID bridge'
  text: Furnished-content citations resolve by SEMANTIC ANCHOR against foss-mcp's
    own extraction. aspose.org's opaque CLM-*/ERC-* ids are never looked up directly
    - an independent extractor cannot reproduce that hash space, and their own team
    broke it once on their own code.
- id: REQ-G1-003
  gate: G1
  anchor: '### 19.3 Gate G1'
  text: The extractor runs against pdf/net's real public repository and produces a
    validated api_surface-equivalent artifact, pinned as a fixture so tests are reproducible
    offline.
- id: REQ-G1-004
  gate: G1
  anchor: '### 8.6 New ingestion source'
  text: 'The repo-native reader parses GitHub Releases, the packaging manifest, and
    AGENTS.md/CONTRIBUTING.md, and degrades HONESTLY: release richness is typed detailed|templated|none
    rather than presented as uniform quality.'
- id: REQ-G1-005
  gate: G1
  anchor: '### 4.7 Redesign'
  text: The furnished-content pilot export is explicitly labelled non-production in
    its own output, standing in for the public export bundle that Aspose's own CI
    must produce for production.
- id: REQ-G1-006
  gate: G1
  anchor: '### 8.9 Normalized document schema'
  text: The normalized document schema carries source_kind, content_type, provenance,
    evidence_refs and validation, and chunking is SECTION-granularity, not page-level
    - page-level chunking cannot catch the class of defect the fabricated-version
    incident represents.
- id: REQ-G1-007
  gate: G1
  anchor: '### 8.10 Insufficient-evidence behavior'
  text: A sentence whose citation does not resolve against foss-mcp's own extraction
    is excluded or explicitly qualified. It is never silently retained, and citation
    resolution proves traceability, not correctness.
- id: REQ-G1-008
  gate: G1
  anchor: '### 7.1 Snapshot/generation model'
  text: pdf/net's first real generation is published through the immutable-manifest
    CAS path, with generation-qualified index identity so a rollback is real rather
    than self-admittedly broken.
- id: REQ-G1-009
  gate: G1
  anchor: '### 8.8 Transport & routing'
  text: The MCP server is built on a maintained SDK, and routing resolves (family,
    platform) from DEPLOYMENT identity alone. Product identity is never a tool argument
    and never a client header.
- id: REQ-G1-010
  gate: G1
  anchor: '### 8.2 Common tools'
  text: 'All nine tools from the authoritative registry are implemented: lookup, search_docs,
    search_symbols, get_symbol, list_members, find_examples, get_product_reference,
    list_recent_changes, report_index_freshness.'
- id: REQ-G1-011
  gate: G1
  anchor: '### 8.8 Transport & routing'
  text: 'No tool ever substitutes a different language, version or product than routing
    fixed. The reference system''s deliberate scope-widening-on-miss behaviour is
    not inherited: a miss returns a miss.'
- id: REQ-G1-012
  gate: G1
  anchor: '### 11.3 Concrete repository structure'
  text: 'One reproducible build path per image: Dockerfile.serving and Dockerfile.ingestion
    with hash-verified installs, a non-root user and a HEALTHCHECK. No unused third
    build path.'
- id: REQ-G1-013
  gate: G1
  anchor: '### 7.3 Health probes'
  text: Health probes prove usefulness rather than TCP reachability - readiness reads
    the actual active generation pointer - and structured usage events are emitted
    per the telemetry contract.
- id: REQ-G1-014
  gate: G1
  anchor: '### 19.3 Gate G1'
  text: A real MCP client completes a full session against the locally-running pdf/net
    container, including tools/list discovery and rejection of an invalid Origin and
    protocol version.
- id: REQ-G1-015
  gate: G1
  anchor: '### 8.8 Transport & routing'
  text: 'The SERVED transport registers all nine tools and enforces the spec''s transport-boundary
    MUSTs: an unapproved Origin is rejected, and a MISSING or invalid MCP-Protocol-Version
    is rejected with 400. Verified in mcp 2.2.0 that the SDK alone does NOT cover
    the missing case - it falls through to DEFAULT_NEGOTIATED_VERSION - so this needs
    explicit middleware.'
- id: REQ-G2-001
  gate: G2
  anchor: '### 4.7 Redesign'
  text: run_extraction.py, the real production entrypoint a pilot onboarding card
    actually calls, has a working route for every tree-sitter-backed platform (net/dotnet,
    java, cpp, go, rust, typescript/javascript/nodejs) but NO route for platform=python
    at all - confirmed by reading _LANGUAGE_BY_PLATFORM directly, which omits the
    key. Calling it against a python pilot raises a bare KeyError. TC-010 ported and
    unit-tested the independent pure-AST reader (python_surface.inspect_public_surface)
    specifically because the plan requires Python NOT go through tree-sitter in production,
    but nothing ever wired that reader into the entrypoint. Same shape of gap as TC-019a.
