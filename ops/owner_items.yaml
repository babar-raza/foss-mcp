  summary: 'The fetch of product references from GitHub (infra/fetch_product_reference.py and the readers in src/foss_mcp/extraction) is rate limited to 60 requests per hour without a token. TC-220 makes the readers wait out a limit and use GITHUB_TOKEN when it is set, and TC-221 delivers that token to the ingestion Jobs from a Kubernetes Secret the operator creates. The token itself is a credential only the owner can create. Without it a fourteen-pilot install can still hit the limit (HTTP 403).'
  resume_predicate: 'A Kubernetes Secret named by ingestion.githubToken.existingSecret exists in the target namespace, with the key named by ingestion.githubToken.key holding a GitHub token, and a fourteen-pilot install completes with every ingestion Job Complete on the first attempt.'
  consumed_by:
  - NONE
  recorded_at: '2026-10-05T13:58:56Z'
  note: 'Owner-only credential. Blocks no card and no gate. RE-CONFIRMED still open
    2026-10-07 during the independent product-readiness audit before K8s shipping:
    ingestion.githubToken.existingSecret is still "" in infra/helm/foss-mcp/values.yaml,
    and this session independently reproduced the fleet-wide consequence (12 of 40
    pilots'' ingestion Jobs in Error/Failed state today from real HTTP 403 rate-limit
    responses, confirmed by reading pod logs directly). Also found, separately from
    this item: infra/fetch_product_reference.py never passes a stored etag to
    fetch_manifest_file even though the etag/If-None-Match plumbing already exists in
    manifest_reader.py and github_release_reader.py - so every ingestion cycle re-fetches
    unconditionally regardless of token state. That code-side half does not need a
    credential and is fixed via TC-244, which reduces exposure but does not remove the
    need for this token - a token still raises the quota from 60/hr to 5000/hr, which
    remains the real fix for fleet-wide ingestion at this scale.'
  last_checked_at: '2026-10-07T20:50:00Z'

