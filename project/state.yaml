  summary: 'TC-013 needs read access to the PRIVATE Aspose/aspose.org repository to
    produce a real furnished-content export. Verified private: anonymous fetch 404s.'
  resume_predicate: 'No longer gated on `gh api` credentials at all: TC-028 (2026-09-24)
    added a local-git-clone export path to pilot_manual_export.py after the operator
    pointed out a full local clone of Aspose/aspose.org already exists on this machine
    at H:\onedrive\Documents\GitHub\aspose.org. `--local-clone <path>` reads committed
    content via read-only git plumbing (rev-parse/ls-tree/cat-file) - no GitHub API
    call, no token, no network. Every future pilot''s furnished-content export should
    use this path by default; it does not depend on OWNER-03''s credential state at
    all. Only relevant again if that local clone itself ever becomes unavailable.'
  consumed_by:
  - TC-013
  - TC-028
  recorded_at: '2026-09-10T00:00:00Z'
  note: 'Access CONFIRMED via gh api 2026-09-11 (TC-013, pdf/net, commit 30b4199e).
    RE-CHECKED 2026-09-24 while planning slides/python''s onboarding: gh api now returns
    401 - the SAME credential breakage as OWNER-03. Briefly reopened rather than left
    SATISFIED on stale information, then RE-SATISFIED the same day once the operator
    pointed out a local clone already exists on this machine: TC-028 built a credential-free
    local-git-plumbing export path and used it for a real slides/python export at
    commit b22e412fb1f55fa0d314b25cabd1e7ef42ae9c9f, verified clean. This item no
    longer depends on OWNER-03 at all - a durable structural fix, not a workaround
    that expires when credentials are restored.'
  last_checked_at: '2026-09-24T00:00:00Z'
- id: OWNER-02
  status: SATISFIED
  summary: GitHub is source of truth; .github/workflows/mirror-gitlab.yml pushes main+tags
    to gitlab.recruitize.ai/sialkot/cantt-smallize/aspose-foss-dev-context-mcp.git
    on every push, authenticating via the GITLAB_TOKEN repo secret.
  resume_predicate: 'RESOLVED 2026-09-27: `gh secret list -R babar-raza/foss-mcp`
    confirms GITLAB_TOKEN is set (since 2026-09-16, before gh auth was even restored).
    `gh run list --workflow mirror-gitlab.yml` shows repeated real successes since
    2026-09-24 (every push auto-triggers it). Manually triggered via `gh workflow
    run mirror-gitlab.yml --ref main` and confirmed success with a real log: "Everything
    up-to-date" - a genuine authenticated push to GitLab, not a masked failure (an
    invalid token fails loudly here by design, per the workflow''s own non-forced-push
    comment). GitHub Actions secrets are architecturally write-only (no `gh secret
    get`, no API to read a value back, for anyone, ever) - this was verified by triggering
    the real workflow and reading its real result, never by reading the secret''s
    value.'
  consumed_by:
  - NONE
  recorded_at: '2026-09-24T00:00:00Z'
  note: 'Non-blocking for the mission: nothing in G0-G4 depends on GitLab being in
    sync. This is purely an operator-requested sync mechanism between two remotes.
    RESOLVED 2026-09-27 - GITLAB_TOKEN was apparently configured directly by the operator
    (only a human with dashboard access could have set it; no session action set it),
    and the workflow has been working since at least 2026-09-24.'
  last_checked_at: '2026-09-27T00:00:00Z'
- id: OWNER-03
  status: SATISFIED
  summary: GitHub WRITE credentials broke mid-session on 2026-09-24. An earlier push
    in this same session (commit ee6c834) succeeded normally. A later push (commit
    92ef3f6) hung for 14+ minutes with no CI process anywhere in its tree - confirmed
    via process inspection it was stuck purely in `git-remote-https` network/auth
    negotiation, not in the pre-push hook. Reproduced cleanly with `timeout 25 git
    push --dry-run origin main` (exit 124, no output) - a dry-run still requires GitHub
    to authenticate the push, unlike `git ls-remote` on this PUBLIC repo, which succeeds
    instantly via anonymous read and proves nothing about write credentials. `gh auth
    status` independently reports GH_TOKEN is invalid (401), and two credential helpers
    are configured for github.com (`manager` i.e. Git Credential Manager, and `gh
    auth git-credential`) - the working theory is the second one fails on the invalid
    token and falls through to GCM attempting an interactive/browser OAuth flow that
    can never complete in this non-interactive session, hanging indefinitely rather
    than failing fast.
  resume_predicate: 'RESOLVED 2026-09-27: `gh auth status` now reports a valid, logged-in
    token (scopes gist/read:org/repo) - the 401 is gone. `timeout 25 git push --dry-run
    origin main` no longer hangs (exit 124) - it now runs the real pre-push hook (scripts/ci_check.sh)
    to completion in ~10-15 minutes, well past the original 25s test window, which
    is why the first re-check this session looked inconclusive until re-run with a
    1500s timeout. The dry-run''s real, complete result: lint/format/pytest/gatectl
    all genuinely ran (no auth hang anywhere in the trace) and reported real, legitimate
    failures unrelated to credentials - see TC-079 (lint/format debt) and the 2026-09-27
    DECISION_LOG entry. The credential problem itself is gone; only real CI hygiene
    remains before a clean push, which is separate, already-tracked work, not an owner
    item.'
  consumed_by:
  - NONE
  recorded_at: '2026-09-24T16:10:00Z'
  note: 'Did not block local work while open: commits landed and verified normally,
    only the push to origin was affected. RESOLVED 2026-09-27 - cause unknown (the
    operator did not report taking an action, and no session action could refresh
    a GitHub token), but independently, repeatedly confirmed working via `gh auth
    status` and a real, complete pre-push hook run that reached pytest and gatectl
    without any auth-stage hang. Every git push/fetch against an authenticated remote
    should still be wrapped in `timeout N` as a general safety practice, now sized
    for the REAL hook runtime (multiple minutes, not 25s) given how large this project''s
    test suite has grown.'
  last_checked_at: '2026-09-27T00:00:00Z'
